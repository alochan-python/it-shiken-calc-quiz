の視点から、事業拡大の方向性を市場浸透・製品開発・市場開拓・多角化に分けて、戦略を検討する。"},{"label":"ウ","html":"製品の相対的市場占有率と市場成長率から、企業がそれぞれの事業に対する経営資源の最適配分を意思決定する。"},{"label":"エ","html":"製品の導入期・成長期・成熟期・衰退期の各段階に応じて、製品の改良、新品種の追加、製品廃棄などを計画する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>AIDMAモデルは、1920年代にアメリカのサミュエル・ローランド・ホールが提唱したとされる購買行動モデルで、消費者が商品を認知してから購入に至るまでの心理プロセスを、Attention(注意)、Interest(興味)、Desire(欲求)、Memory(記憶)、Action(行動)という5段階に分解して捉える。各段階ごとに消費者の心理状態が異なるため、広告やプロモーションなど最適なコミュニケーション手段を段階別に検討・設計する際に活用される。選択肢イは製品・市場の二軸で事業拡大の方向性(市場浸透・新製品開発・新市場開拓・多角化)を整理するアンゾフの成長マトリクス、ウは市場成長率と相対的市場占有率で事業ポートフォリオを評価するPPM(プロダクト・ポートフォリオ・マネジメント)、エは導入期・成長期・成熟期・衰退期で製品戦略を考えるプロダクトライフサイクルの説明であり、いずれもAIDMAモデルとは異なるフレームワークである。</p>","mnemonic":""},{"id":108,"year":2021,"period":"令和3年度春期","num":9,"cat":"ストラテジ系","field":"バイラルマーケティング","summary":"バイラルマーケティング：令和3年度春期 問9","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>バイラルマーケティングを説明したものはどれか。</p>","choices":[{"label":"ア","html":"インターネット上で成果報酬型広告の仕組みを用いるマーケティング手法である。"},{"label":"イ","html":"個々の顧客を重要視し、個別ニーズへの対応を図るマーケティング手法である。"},{"label":"ウ","html":"セグメントごとに差別化した、異なる商品を提供するマーケティング手法である。"},{"label":"エ","html":"人から人へと評判が伝わることを積極的に利用するマーケティング手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バイラルマーケティングの「バイラル(viral)」は「ウイルス性の」という意味であり、ウイルスが人から人へ感染するように、口コミによって消費者の間で自発的に評判や情報が拡散していく現象を積極的に活用するマーケティング手法を指す。企業が一方的に広告を押し付けるのではなく、友人・知人といった身近な人からの紹介は心理的な抵抗が少なく信頼されやすいという性質を利用する点が特徴であり、情報を拡散するかどうかの判断は消費者自身に委ねられる。選択肢アは広告経由の成果(購入など)に応じて報酬を支払うアフィリエイト広告のような成果報酬型広告の説明、イは個々の顧客のニーズに個別対応するワン・トゥ・ワンマーケティングの説明、ウは市場をセグメントに分けてそれぞれに異なる商品を提供する差別化マーケティングの説明であり、いずれも人から人への評判の伝播を主眼とするバイラルマーケティングとは異なる手法である。</p>","mnemonic":""},{"id":109,"year":2021,"period":"令和3年度春期","num":10,"cat":"ストラテジ系","field":"市場セグメンテーション","summary":"市場セグメンテーション：令和3年度春期 問10","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>市場を消費者特性でセグメント化する際に、基準となる変数を、地理的変数、人口統計的変数、心理的変数、行動的変数に分類するとき、人口統計的変数に分類されるものはどれか。</p>","choices":[{"label":"ア","html":"社交性などの性格"},{"label":"イ","html":"職業"},{"label":"ウ","html":"人口密度"},{"label":"エ","html":"製品の使用割合"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>市場セグメンテーションにおける人口統計的変数(デモグラフィック変数)とは、年齢、性別、所得、学歴、職業、家族構成など、個人の客観的な基本属性に基づく分類軸を指す。これらは主観的な感情や価値観を含まず、統計データとして把握しやすいため、マーケティング実務で広く使われる基準であり、選択肢の中では「職業」がこれに該当する。選択肢アの「社交性などの性格」は個人の内面的な特性を示すため心理的変数に分類され、ウの「人口密度」は居住地域の特徴を示すため地理的変数に分類され、エの「製品の使用割合」は消費者の実際の行動結果を示すため行動的変数に分類される。このように4つの変数カテゴリはそれぞれ異なる視点(地理・属性・心理・行動)から市場を切り分けるものであり、組み合わせて使われることも多い。</p>","mnemonic":""},{"id":110,"year":2021,"period":"令和3年度春期","num":11,"cat":"ストラテジ系","field":"STP・マーケティングミックス","summary":"STP・マーケティングミックス：令和3年度春期 問11","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>マーケティング戦略の策定プロセスを幾つかのブロックに分けて順番に並べたとき、図のdに入るものはどれか。ただしア〜エはa〜dのいずれかに入るものとする。</p><table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;text-align:center;\"><tr><td>a</td><td>b</td><td>c</td><td>ポジション決定</td><td>d</td><td>実行計画策定</td></tr></table>","choices":[{"label":"ア","html":"環境分析"},{"label":"イ","html":"マーケティングミックス決定"},{"label":"ウ","html":"ターゲット特定"},{"label":"エ","html":"市場細分化"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マーケティング戦略の策定プロセスは、一般に「環境分析→市場細分化(セグメンテーション)→ターゲット特定(ターゲティング)→ポジション決定(ポジショニング)→マーケティングミックス決定→実行計画策定」という順序で進む、いわゆるSTPとマーケティングミックス(4Pなど)の流れに沿っている。提唱者はフィリップ・コトラーとされ、STP分析では標的とする顧客セグメントを定め、市場における自社の立ち位置(ポジショニング)を明確にすることが目的とされる。問題の図ではa=環境分析、b=市場細分化、c=ターゲット特定という順序になっており、ポジション決定の直後に入るdには、選定したターゲットと差別化ポジションに基づいて製品・価格・流通・販促などの具体策を決める「マーケティングミックス決定」が該当する。選択肢ア(環境分析)はaに、エ(市場細分化)はbに、ウ(ターゲット特定)はcに、それぞれ既に割り当てられているため、残るイがdに入る。</p>","mnemonic":""},{"id":111,"year":2021,"period":"令和3年度春期","num":12,"cat":"ストラテジ系","field":"エスノグラフィー","summary":"エスノグラフィー：令和3年度春期 問12","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>マーケティング調査におけるエスノグラフィーの活用事例はどれか。</p>","choices":[{"label":"ア","html":"業界誌や業界新聞、調査会社の売れ筋ランキングなどから消費者の動向を探る。"},{"label":"イ","html":"広告の一部に資料請求の項目を入れておき、それを照会してきた人数を調べる。"},{"label":"ウ","html":"消費行動の現場で観察やインタビューを行い、気付かなかった需要を発掘する。"},{"label":"エ","html":"同等の条件下で複数パターンの見出しを広告として表示し、反応の違いを測る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>エスノグラフィーはもともと文化人類学に由来する質的調査手法で、調査者が対象者の生活環境や消費行動の現場に身を置き、観察やインタビューを通じて行動や価値観を深く理解しようとする手法である。アンケートやグループインタビューでは消費者自身が言語化できない無意識のニーズや、日常の中で当たり前になっている不満・工夫(いわゆる「あきらめ」)が見えにくいのに対し、エスノグラフィーは行動そのものを現場で観察することで、消費者自身も気付いていない潜在需要を発掘できる点に強みがある。選択肢アは業界誌や売れ筋ランキングなど二次データから動向を探る手法、イは広告への反応件数を集計する資料請求調査、エはA/Bテストのように複数パターンの広告を比較して反応の違いを測る手法であり、いずれも消費行動の現場に入り込んで直接観察するエスノグラフィーとは異なるアプローチである。</p>","mnemonic":""},{"id":112,"year":2021,"period":"令和3年度春期","num":13,"cat":"ストラテジ系","field":"SECIモデル","summary":"SECIモデル：令和3年度春期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>SECIモデルにおいて、新たに創造された知識を組織に広め、新たな暗黙知として習得するプロセスはどれか。</p>","choices":[{"label":"ア","html":"共同化(Socialization)"},{"label":"イ","html":"表出化(Externalization)"},{"label":"ウ","html":"連結化(Combination)"},{"label":"エ","html":"内面化(Internalization)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SECIモデルは野中郁次郎らが提唱した組織的知識創造理論で、個人の暗黙知と組織の形式知が「共同化(Socialization)」「表出化(Externalization)」「連結化(Combination)」「内面化(Internalization)」の4プロセスを循環することで、組織全体の知識が継続的に創造・増幅されると説明する。このうち内面化は、連結化によって組織内に広められた形式知を個人が実践を通じて繰り返し体得し、新たな暗黙知(コツや勘)として自分のものにする段階であり、設問の「新たに創造された知識を組織に広め、新たな暗黙知として習得するプロセス」に一致する。選択肢アの共同化は、師弟関係のように暗黙知のまま経験を共有して新たな暗黙知を生み出す段階、イの表出化は対話や問いかけによって暗黙知を言語化・図式化し形式知に変換する段階、ウの連結化は個々の形式知を組み合わせて体系的な文書や知識体系に再構成する段階であり、いずれも「形式知を実践して暗黙知に戻す」内面化とは異なるプロセスである。</p>","mnemonic":""},{"id":113,"year":2021,"period":"令和3年度春期","num":14,"cat":"ストラテジ系","field":"死の谷(技術経営)","summary":"死の谷(技術経営)：令和3年度春期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>技術経営における課題のうち、“死の谷”の説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"コモディティ化が進んでいる分野で製品を開発しても、他社との差別化ができず、価格競争に陥り、利益の獲得が難しいこと"},{"label":"イ","html":"新製品が市場に浸透していく過程において、実用性を重んじる顧客が受け入れず、より大きな市場を形成できないこと"},{"label":"ウ","html":"先進的な製品開発に成功しても、事業化するためには更なる困難があること"},{"label":"エ","html":"プロジェクトのマネジメントが適切に行われないために、プロジェクトの現場に生じた過大な負担がメンバを過酷な状態に追い込み、失敗に向かってしまうこと"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>技術経営(MOT)における「死の谷(Valley of Death)」とは、研究開発によって先進的な技術や製品の開発に成功しても、それを量産化・事業化して市場に投入するまでの間に、資金調達や体制構築など新たな困難が立ちはだかり、事業化に至らず頓挫してしまう段階を指す概念である。研究開発の成果と事業化の間に存在するこのギャップは、技術の「供給側」の課題として語られることが多い。選択肢イは、新製品が市場に浸透する過程でアーリーアダプターと実用性を重視する多数派(アーリーマジョリティ)の間に生じる断絶を指す「キャズム」の説明であり、死の谷と混同されやすいが別の概念である(キャズムは市場「需要側」の課題とされる)。選択肢アはコモディティ化による価格競争の問題、エはプロジェクトマネジメントの失敗によるデスマーチ的状況の説明であり、いずれも死の谷の定義とは異なる。</p>","mnemonic":""},{"id":114,"year":2021,"period":"令和3年度春期","num":15,"cat":"ストラテジ系","field":"JIT(ジャストインタイム)","summary":"JIT(ジャストインタイム)：令和3年度春期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>JIT(Just In Time)の特徴はどれか。</p>","choices":[{"label":"ア","html":"押し出し方式(プッシュシステム)である。"},{"label":"イ","html":"各工程は使用した分だけを前工程に発注する。"},{"label":"ウ","html":"他の品目の需要に連動しない在庫システムである。"},{"label":"エ","html":"毎回仕様が異なる受注生産型の工場に適している。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIT(ジャストインタイム)はトヨタ生産方式の基本理念で、「必要なものを、必要なときに、必要なだけ」生産・供給することで、在庫や仕掛品などのムダを徹底的に排除することを目指す考え方である。これを現場で実現する代表的な仕組みが「かんばん方式」であり、後工程が実際に使用した分だけを前工程に発注し、前工程はその分だけを補充生産する「後工程引取り」のプル方式(プルシステム)を採用する。選択肢アの「押し出し方式(プッシュシステム)」は、各工程があらかじめ立てた計画に基づいて生産し後工程に送り出す方式であり、JITのプル方式とは正反対の考え方である。選択肢ウは他の品目の需要と連動しない従来型の独立在庫システムの説明、エは毎回仕様が異なる受注生産型の工場に適した方式の説明であり、いずれも標準化された繰り返し生産を前提とするJITの特徴とは異なる。</p>","mnemonic":""},{"id":115,"year":2021,"period":"令和3年度春期","num":16,"cat":"ストラテジ系","field":"TOC(制約理論)","summary":"TOC(制約理論)：令和3年度春期 問16","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>TOCの特徴はどれか。</p>","choices":[{"label":"ア","html":"個々の工程を個別に最適化することによって、生産工程全体を最適化する。"},{"label":"イ","html":"市場の需要が供給能力を下回っている場合に有効な理論である。"},{"label":"ウ","html":"スループット(=売上高−資材費)の増大を最重要視する。"},{"label":"エ","html":"生産プロセス改善のための総投資額を制約条件として確立された理論である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TOC(Theory of Constraints、制約理論)は、イスラエルの物理学者エリヤフ・ゴールドラットが提唱した生産管理・経営改善の理論で、1984年の著書『ザ・ゴール』で広く知られるようになった。TOCは、全体の生産能力を決定づけるボトルネック(制約条件)に着目し、個々の工程を部分最適化するのではなく、制約条件を基準に全体最適を図ることを特徴とする。そのための管理会計手法が「スループット会計」であり、スループット(売上高から真の変動費である資材費を差し引いた額)の増大を最重要の評価尺度として位置づける。選択肢アの「個々の工程を個別に最適化することによって生産工程全体を最適化する」は部分最適の発想であり、全体最適を志向するTOCの考え方とは逆である。選択肢イは制約(ボトルネック)がない状況を想定しているが、TOCはまさに供給能力に制約がある状況で有効な理論であり、エの「総投資額を制約条件とする」という説明もTOCが着目するボトルネックという物理的・能力的制約とは異なる。</p>","mnemonic":""},{"id":116,"year":2021,"period":"令和3年度春期","num":17,"cat":"ストラテジ系","field":"生産計画","summary":"生産計画：令和3年度春期 問17","correct":"イ","result":"","formula":"P8=S8+S9+S10+S11-I7（翌月末在庫=翌々月から3か月分の予想販売量，の条件から逆算）","howto":"I7=I6+P7-S7で7月末在庫を求め，I7+P8-S8=S9+S10+S11をP8について解く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ある会社の生産計画部では，毎月25日に次の手続で翌月分の計画生産量を決定している。8月分の計画生産量を求める式はどれか。</p><p>〔手続〕<br>(1) 当月末の予想在庫量を，前月末の実在庫量と当月分の計画生産量と予想販売量から求める。<br>(2) 当月末の予想在庫量と翌月分の予想販売量を基に，翌月末の予想在庫量が翌々月から3か月間の予想販売量と等しくなるように翌月分の計画生産量を決定する。</p><table><tr><td>I6</td><td>6月末実在庫量</td></tr><tr><td>I7</td><td>7月末予想在庫量</td><td>P7</td><td>7月分計画生産量</td><td>S7</td><td>7月分予想販売量</td></tr><tr><td>I8</td><td>8月末予想在庫量</td><td>P8</td><td>8月分計画生産量</td><td>S8</td><td>8月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S9</td><td>9月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S10</td><td>10月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S11</td><td>11月分予想販売量</td></tr></table><p>In：n月の月末在庫量　Pn：n月分の生産量　Sn：n月分の販売量</p>","choices":[{"label":"ア","html":"I6＋P7－S7＋S8"},{"label":"イ","html":"S8＋S9＋S10＋S11－I7"},{"label":"ウ","html":"S8＋S9＋S10＋S11－I8"},{"label":"エ","html":"S9＋S10＋S11－I7"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>7月末の予想在庫量I7は，手続(1)よりI7=I6+P7-S7で求められる（P7は既に決定済みの7月の計画生産量）。</p><p>手続(2)より，8月末の予想在庫量I8は，翌々月（9月）から3か月間（9,10,11月）の予想販売量の合計と等しくなるように決める。すなわちI8=S9+S10+S11。</p><p>一方，I8は手続(1)と同じ考え方でI8=I7+P8-S8とも表せる。両者を等置すると，I7+P8-S8=S9+S10+S11となり，P8について解くとP8=S8+S9+S10+S11-I7。</p><p>これは選択肢「イ」と一致する。</p>","mnemonic":"来月(8月)の生産量は、8〜11月の4か月分の販売予測を全部足して、すでに固まっている7月末在庫を引くだけ――イの式がその発想。"},{"id":117,"year":2021,"period":"令和3年度春期","num":18,"cat":"ストラテジ系","field":"X理論・Y理論","summary":"X理論・Y理論：令和3年度春期 問18","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ダグラス・マグレガーが説いた行動科学理論において、“人間は本来仕事が嫌いである。したがって、報酬と制裁を使って働かせるしかない”とするのはどれか。</p>","choices":[{"label":"ア","html":"X理論"},{"label":"イ","html":"Y理論"},{"label":"ウ","html":"衛生要因"},{"label":"エ","html":"動機づけ要因"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ダグラス・マグレガーは1960年の著書『企業の人間的側面』の中で、管理者が抱く人間観によって異なる2つのマネジメントスタイルを対比させる「X理論・Y理論」を提唱した。X理論は性悪説的な人間観に基づき、「人間は本来仕事が嫌いで、できれば避けようとする存在であり、強制・統制・命令・処罰といった手段を用いなければ、組織目標の達成に十分な力を発揮しない」と仮定する考え方である。これに対しY理論は、仕事での努力は遊びや休息と同様に人間にとって自然なものであり、人は自ら設定した目標に対しては自己管理・自己統制を行うという性善説的な人間観に基づいている。選択肢ウの「衛生要因」とエの「動機づけ要因」はハーズバーグの動機づけ衛生理論(二要因理論)の概念であり、職務満足・不満足に関わる別の枠組みであって、マグレガーのX理論・Y理論とは異なる理論体系に属する。</p>","mnemonic":""},{"id":118,"year":2021,"period":"令和3年度春期","num":19,"cat":"ストラテジ系","field":"デルファイ法","summary":"デルファイ法：令和3年度春期 問19","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>将来の科学技術の進歩の予測などについて、専門家などに対するアンケートを実施し、その結果をその都度回答者にフィードバックすることによって、ばらばらの予測を図のように収束させる方法はどれか。</p><p>(図:第1回・第2回・第3回とアンケートを重ねるごとに、回答者による実現時期の予測(横軸)の分布(下方四分位数・メジアン・上方四分位数で示される山形のグラフ)のばらつきが徐々に狭まり、一つの時期に収束していく様子が示されている。)</p>","choices":[{"label":"ア","html":"ゴードン法"},{"label":"イ","html":"デルファイ法"},{"label":"ウ","html":"ミニマックス法"},{"label":"エ","html":"モンテカルロ法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>デルファイ法は、将来の科学技術の進歩などを予測する際に用いられる調査手法で、複数の専門家に対して匿名でアンケートを行い、その集計結果(回答の分布など)を回答者にフィードバックした上で再度アンケートを行うというプロセスを、意見がある程度収束するまで繰り返す点が特徴である。これにより他者の意見を参考にしながら極端な予測が緩和され、設問の図のように回答のばらつき(四分位範囲)が回を重ねるごとに狭まっていく。技術予測はデルファイ法が最初に応用された分野の一つとされ、日本でも文部科学省科学技術・学術政策研究所の科学技術予測調査などで実際に用いられている。選択肢アのゴードン法はブレーンストーミングの一種で、本来のテーマを伏せたまま非合理的な類比を用いて発想を広げる発想法、ウのミニマックス法はゲーム理論における最悪の場合の損失を最小化する意思決定基準、エのモンテカルロ法は乱数を用いたシミュレーション手法であり、いずれも専門家の意見をフィードバックしながら収束させるデルファイ法とは異なる手法である。</p>","mnemonic":""},{"id":119,"year":2021,"period":"令和3年度春期","num":20,"cat":"マネジメント系","field":"抜取検査(生産者危険)","summary":"抜取検査(生産者危険)：令和3年度春期 問20","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>合格となるべきロットが、抜取検査で誤って不合格となる確率のことを何というか。</p>","choices":[{"label":"ア","html":"合格品質水準"},{"label":"イ","html":"消費者危険"},{"label":"ウ","html":"生産者危険"},{"label":"エ","html":"有意水準"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>抜取検査では、サンプルの結果に基づいてロット全体の合格・不合格を判定するため、本来は合格となるべき良品質のロットが、たまたま抜き取ったサンプルに不良品が多く含まれていたために誤って不合格と判定されてしまう危険性が存在し、これを「生産者危険(α)」と呼ぶ。逆に、本来は不合格となるべき不良ロットが誤って合格と判定されてしまう危険性は「消費者危険(β)」と呼ばれ、両者はOC曲線(検査特性曲線、不良率と合格確率の関係を示すグラフ)によって定量的に表される。一般に抜取検査の設計では生産者危険はおよそ5%程度、消費者危険はおよそ10%程度を目安とすることが多いとされる。選択肢アの「合格品質水準(AQL)」は生産者危険を評価する際の基準となる良品質側の不良率水準、イの「消費者危険」は不良ロットを誤って合格とする確率、エの「有意水準」は統計的仮説検定において帰無仮説を誤って棄却する確率(第1種の誤り)を指す一般的な統計用語であり、いずれも本問が問う「合格となるべきロットを誤って不合格とする確率」そのものを指す用語ではない。</p>","mnemonic":""},{"id":120,"year":2021,"period":"令和3年度春期","num":21,"cat":"マネジメント系","field":"特性要因図","summary":"特性要因図：令和3年度春期 問21","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>利用者とシステム運用担当者によるブレーンストーミングを行って、利用者の操作に起因するPCでのトラブルについて、主要なトラブルごとに原因となったと思われる操作、利用状況などを拾い上げた。トラブル対策を立てるために、ブレーンストーミングの結果を利用して原因と結果の関係を整理するのに適した図はどれか。</p>","choices":[{"label":"ア","html":"散布図"},{"label":"イ","html":"特性要因図"},{"label":"ウ","html":"パレート図"},{"label":"エ","html":"ヒストグラム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>特性要因図は、石川馨が考案したとされるQC7つ道具の一つで、結果である「特性」とそれに影響を与える「要因」の関係を、魚の骨のような形状に整理して可視化する図であり、「フィッシュボーン図」や「因果図」とも呼ばれる。右端に結果(問題)を置き、そこから要因を大骨・中骨・小骨と枝分かれさせて分類していくことで、ブレーンストーミングなどで洗い出した多数の原因候補を体系的に整理し、原因と結果の関係を把握しやすくする。本問はブレーンストーミングで拾い上げた原因と思われる操作や利用状況を、トラブルという結果と結び付けて整理するものであり、まさに特性要因図の典型的な用途である。選択肢アの散布図は2つの変数間の相関関係を点でプロットする図、ウのパレート図は項目別の件数を大きい順に並べて累積比率を重ねた図で重点項目の絞り込みに使う、エのヒストグラムはデータの分布状況を柱状に表す図であり、いずれも原因と結果の因果関係そのものを体系的に整理する目的には適していない。</p>","mnemonic":""},{"id":121,"year":2021,"period":"令和3年度春期","num":22,"cat":"ストラテジ系","field":"特定商取引法","summary":"特定商取引法：令和3年度春期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>インターネットのショッピングサイトで、商品の広告をする際に、商品の販売価格、商品の代金の支払時期及び支払方法、商品の引渡時期、売買契約の解除に関する事項などの表示を義務付けている法律はどれか。</p>","choices":[{"label":"ア","html":"商標法"},{"label":"イ","html":"電子契約法"},{"label":"ウ","html":"特定商取引法"},{"label":"エ","html":"不正競争防止法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>特定商取引法(特定商取引に関する法律)は、通信販売を含む特定の取引類型について、事業者に一定の情報表示や書面交付などを義務付け、消費者を保護することを目的とした法律である。同法第11条及びその施行規則では、通信販売の広告において、販売価格(送料を含む)、商品代金の支払時期及び支払方法、商品の引渡時期、売買契約の申込みの撤回や解除(返品)に関する事項などを表示することを義務付けている。選択肢アの商標法は商標(ブランドを示す標識)の保護を目的とする法律、イの電子契約法(電子消費者契約法)は操作ミスによる錯誤の契約取消しなど電子契約特有の民法の特則を定める法律、エの不正競争防止法は模倣品の販売や営業秘密の侵害などの不正競争行為を規制する法律であり、いずれも通信販売における価格・支払・引渡し等の表示義務を直接定めるものではない。</p>","mnemonic":""},{"id":122,"year":2021,"period":"令和3年度春期","num":23,"cat":"テクノロジ系","field":"格納型XSS","summary":"格納型XSS：令和3年度春期 問23","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>格納型クロスサイトスクリプティング(Stored XSS又はPersistent XSS)攻撃に該当するものはどれか。</p>","choices":[{"label":"ア","html":"Webサイト上の掲示板に攻撃用スクリプトを忍ばせた書込みを攻撃者が行うことによって、その後に当該掲示板を閲覧した利用者のWebブラウザで、攻撃用スクリプトが実行された。"},{"label":"イ","html":"Webブラウザへの応答を生成する処理に脆弱性のあるWebサイトに向けて、不正なJavaScriptコードを含むリクエストを送信するリンクを攻撃者が用意し、そのリンクを利用者がクリックするように仕向けた。"},{"label":"ウ","html":"攻撃者が、乗っ取った複数のPC上でスクリプトを実行して大量のリクエストを攻撃対象のWebサイトに送り付け、攻撃対象のWebサイトをサービス不能状態にした。"},{"label":"エ","html":"攻撃者がスクリプトを使って、送信元IPアドレスを攻撃対象のWebサイトのIPアドレスに偽装した大量のDNSリクエストを多数のDNSサーバに送信することによって、大量のDNSレスポンスが攻撃対象のWebサイトに送り付けられた。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クロスサイトスクリプティング(XSS)は、Webアプリケーションの脆弱性を突いて悪意あるスクリプトを利用者のブラウザ上で実行させる攻撃であり、攻撃スクリプトの投入経路によって反射型(Reflected)と格納型(Stored/Persistent)などに分類される。格納型XSSは、攻撃者が脆弱性のある掲示板やコメント欄などに攻撃用スクリプトを含む書き込みを行い、それがサーバ上に保存(格納)された結果、その後そのページを閲覧した他の利用者のWebブラウザ上で、閲覧のたびに自動的にスクリプトが実行されてしまう点が特徴である。選択肢イは、脆弱性のあるサイトへ不正なコードを含むリクエストを送るリンクを利用者にクリックさせることで初めてスクリプトが実行される「反射型(Reflected)XSS」の説明であり、攻撃がサーバに保存されない点で格納型とは異なる。選択肢ウは乗っ取った複数PCから大量のリクエストを送るDDoS攻撃、選択肢エは送信元IPアドレスを偽装したDNSリクエストを大量送信してDNSサーバからの応答を踏み台にするDNSリフレクション攻撃(DDoS攻撃の一種)の説明であり、いずれもXSSとは異なる攻撃手法である。</p>","mnemonic":""},{"id":123,"year":2021,"period":"令和3年度春期","num":24,"cat":"テクノロジ系","field":"OCSP","summary":"OCSP：令和3年度春期 問24","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ディジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルはどれか。</p>","choices":[{"label":"ア","html":"CHAP"},{"label":"イ","html":"LDAP"},{"label":"ウ","html":"OCSP"},{"label":"エ","html":"SNMP"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>OCSP(Online Certificate Status Protocol)は、IETFのRFC 6960で規定された、X.509公開鍵証明書(ディジタル証明書)が失効しているかどうかをオンラインでリアルタイムに確認するための通信プロトコルである。クライアントはOCSPレスポンダに対して特定の証明書の状態を問い合わせ、レスポンダはその証明書が有効・失効・不明のいずれであるかを応答する。これにより、従来のCRL(証明書失効リスト)をまるごと取得・照合する方式に比べて、必要な証明書の状態だけを効率よく即座に確認できる利点がある。選択肢アのCHAPはPPP接続などで用いられるチャレンジ・レスポンス方式の認証プロトコル、イのLDAPはディレクトリサービスにアクセスするためのプロトコル、エのSNMPはネットワーク機器を監視・管理するためのプロトコルであり、いずれも証明書の失効確認を目的とするプロトコルではない。</p>","mnemonic":""},{"id":124,"year":2021,"period":"令和3年度春期","num":25,"cat":"テクノロジ系","field":"NOTICE(IoTセキュリティ)","summary":"NOTICE(IoTセキュリティ)：令和3年度春期 問25","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>2019年2月から総務省、情報通信研究機構(NICT)及びインターネットサービスプロバイダが連携して開始した“NOTICE”という取組はどれか。</p>","choices":[{"label":"ア","html":"NICTが依頼のあった企業のイントラネット内のWebサービスに対して脆弱性診断を行い、脆弱性が見つかったWebサービスの管理者に対して注意喚起する。"},{"label":"イ","html":"NICTがインターネット上のIoT機器を調査することによって、容易に推測されるパスワードなどを使っているIoT機器を特定し、インターネットサービスプロバイダを通じて利用者に注意喚起する。"},{"label":"ウ","html":"スマートフォンにアイコンやメッセージダイアログを表示するなどし、緊急情報を通知する仕組みを利用して、スマートフォンのマルウェアに関してスマートフォン利用者に注意喚起する。"},{"label":"エ","html":"量子暗号技術を使い、インターネットサービスプロバイダが緊急地震速報、津波警報などの緊急情報を安全かつ自動的に住民のスマートフォンに送信して注意喚起する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NOTICE(National Operation Towards IoT Clean Environment)は、2019年2月から総務省、国立研究開発法人情報通信研究機構(NICT)及びインターネットサービスプロバイダ(ISP)が連携して開始した取組で、改正NICT法に基づき実施されている。具体的には、NICTがインターネット上に接続されたIoT機器に対して、容易に推測されるID・パスワードなどを入力してログインを試みる調査を行い、サイバー攻撃に悪用されるおそれのある脆弱な設定のIoT機器を特定し、その情報をISPに通知する。通知を受けたISPは、該当する利用者を特定して注意喚起を行い、機器の設定変更などの対策を促す仕組みになっている。選択肢アはNICTが依頼企業のイントラネット内Webサービスを脆弱性診断するという説明で実際の取組とは異なり、選択肢ウはスマートフォンのマルウェア感染を通知する別の仕組みの説明、選択肢エは量子暗号技術を用いた緊急情報配信という実際には存在しない説明であり、いずれもNOTICEの実際の内容とは一致しない。</p>","mnemonic":""},{"id":125,"year":2019,"period":"令和元年度秋期","num":1,"cat":"ストラテジ系","field":"EA参照モデル","summary":"EA参照モデル：令和元年度秋期 問1","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>エンタープライズアーキテクチャの参照モデルのうち，BRM（Business Reference Model）として提供されるものはどれか。</p>","choices":[{"label":"ア","html":"アプリケーションサービスを機能的な観点から分類・体系化したサービスコンポーネント"},{"label":"イ","html":"サービスコンポーネントを実際に活用するためのプラットフォームやテクノロジの標準仕様"},{"label":"ウ","html":"参照モデルの中で最も業務に近い階層として提供される，業務分類に従った業務体系・システム体系と各種業務モデル"},{"label":"エ","html":"組織間で共有される可能性の高い情報について，名称，定義及び各種属性を総体的に記述したモデル"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BRM（Business Reference Model）は、米国連邦政府のFEA（Federal Enterprise Architecture）などで用いられるエンタープライズアーキテクチャの参照モデル群の一つで、複数ある参照モデルの中で最も業務（ビジネス）に近い階層に位置づけられる。FEAの参照モデルは、業務分類に基づいて組織横断的に業務を捉えるBRMを最上位とし、その下にサービスコンポーネントを整理するSRM（Service Component Reference Model）、技術標準を定めるTRM（Technical Reference Model）、組織間で共有される情報を定義するDRM（Data Reference Model）などが連なる階層構造になっている。選択肢ウの「参照モデルの中で最も業務に近い階層として提供される，業務分類に従った業務体系・システム体系と各種業務モデル」はこのBRMの説明そのものである。選択肢アはサービスコンポーネントを機能的に分類するSRMの説明、選択肢イはサービスコンポーネントを実現する技術標準を示すTRMの説明、選択肢エは組織間で共有される情報を記述するDRMの説明であり、いずれもBRMより技術・データ寄りの階層を指す。したがって、業務プロセスや業務体系そのものを扱うウが正解となる。</p>","mnemonic":""},{"id":126,"year":2019,"period":"令和元年度秋期","num":2,"cat":"ストラテジ系","field":"オープンデータ","summary":"オープンデータ：令和元年度秋期 問2","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>官民データ活用推進基本法などに基づいて進められているオープンデータバイデザインに関して，行政機関における取組の記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"行政機関が保有する個人情報を産業振興などの目的でオープン化するためには，データ収集の開始に先立って個人情報保護委員会への届出が必要となる。"},{"label":"イ","html":"行政機関において収集・蓄積された既存のデータが公開される場合，営利目的の利用は許されておらず，非営利の用途に限って利用が認められている。"},{"label":"ウ","html":"行政機関における情報システムの設計において，情報セキュリティを確保する観点から，公開するデータの用途を行政機関同士の相互利用に限定する。"},{"label":"エ","html":"対象となる行政データを，二次利用や機械判読に適した形態で無償公開することを前提に，情報システムや業務プロセスの企画，整備及び運用を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>官民データ活用推進基本法（平成28年法律第103号）第11条は、国及び地方公共団体が保有する官民データについて、個人・法人の権利利益や国の安全等を害さない範囲でインターネット等を通じて容易に利用できるよう必要な措置を講じることを定めている。この考え方を具体化したのが「オープンデータ・バイ・デザイン」であり、情報システムの企画・設計の段階からデータを二次利用や機械判読に適した形式で無償公開することを前提として整備・運用する取組を指す。選択肢エはこの考え方を正しく述べている。選択肢アは個人情報を産業振興目的で公開する際に個人情報保護委員会への届出を一律に必要とする内容だが、そのような届出義務は定められておらず誤りである。選択肢イは営利目的の利用を制限しているが、オープンデータの利用規約は通常営利・非営利を問わず二次利用を認める方向にあり趣旨に反する。選択肢ウは公開データの用途を行政機関同士の相互利用に限定するとしているが、オープンデータの目的は官民問わず広く利用可能にすることにあり誤りである。</p>","mnemonic":""},{"id":127,"year":2019,"period":"令和元年度秋期","num":3,"cat":"ストラテジ系","field":"SCM/SCOR","summary":"SCM/SCOR：令和元年度秋期 問3","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>SCOR（Supply Chain Operations Reference model）で定義しているSCMに関する実行プロセスのうち，自社にとってのSourceに当たるものはどれか。</p>","choices":[{"label":"ア","html":"資材などの購入"},{"label":"イ","html":"受注と納入"},{"label":"ウ","html":"納入後に発生する作業"},{"label":"エ","html":"プロダクトの生産，サービスの実施"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SCOR（Supply Chain Operations Reference）モデルは、サプライチェーンマネジメント（SCM）の業務プロセスを標準化して評価・改善するためのフレームワークで、1996年にPRTMが開発し、現在はASCM（旧APICS）が管理している。SCORでは、計画（Plan）・実行・イネーブル（Enable）の大区分のうち、実行プロセスをSource（調達）、Make（製造）、Deliver（出荷・配送）、Return（返品）の4つに分類する。Sourceは自社にとって、原材料や部品、商品などを供給者（サプライヤ）から購入・調達するプロセスを指すため、「資材などの購入」を説明する選択肢アが正解となる。選択肢イの「受注と納入」はDeliver、選択肢ウの「納入後に発生する作業」はReturn（返品対応）、選択肢エの「プロダクトの生産，サービスの実施」はMakeにそれぞれ対応しており、Sourceとは異なるプロセスを説明している。</p>","mnemonic":""},{"id":128,"year":2019,"period":"令和元年度秋期","num":4,"cat":"ストラテジ系","field":"EMS受託製造","summary":"EMS受託製造：令和元年度秋期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>EMS（Electronics Manufacturing Services）の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"相手先ブランドで販売する電子機器の設計だけを受託し，製造は相手先で行う。"},{"label":"イ","html":"外部から調達した電子機器に付加価値を加えて，自社ブランドで販売する。"},{"label":"ウ","html":"自社ブランドで販売する電子機器のソフトウェア開発だけを外部に委託し，ハードウェアは自社で設計製造する。"},{"label":"エ","html":"生産設備をもつ企業が，他社からの委託を受けて電子機器を製造する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EMS（Electronics Manufacturing Services）とは、電子機器の製造を専門に受託するサービス、またはそれを提供する企業形態を指し、自社で生産設備を保有し、複数のブランド企業（委託元）から製造を受託する点が特徴である。委託元のブランドで販売される製品の製造を代行し、場合によっては設計の一部も請け負うが、基本は「生産委託」を軸としたビジネスモデルであり、代表的な企業としてFoxconnやFlextronics、Jabilなどが挙げられる。選択肢エの「生産設備をもつ企業が，他社からの委託を受けて電子機器を製造する」はこの定義に合致する。選択肢アは設計のみを受託し製造は行わないという内容でEMSの実態とは逆であり、設計専業のODM的企業に近い。選択肢イは外部調達した機器に付加価値を付けて自社ブランドで販売するという内容で、これはEMSに製造を委託する側（ブランドオーナー）の活動を指しており、EMS自体の説明ではない。選択肢ウはソフトウェアだけを外部委託するという限定的な内容であり、EMSが担う製造受託の範囲とは異なる。</p>","mnemonic":""},{"id":129,"year":2019,"period":"令和元年度秋期","num":5,"cat":"マネジメント系","field":"契約方式","summary":"契約方式：令和元年度秋期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>システム開発における発注者と受注者であるベンダとの契約方法のうち，実費償還型契約はどれか。</p>","choices":[{"label":"ア","html":"委託業務の進行中に発生するリスクはベンダが負い，発注者は注文時に合意した価格を支払う。"},{"label":"イ","html":"インフレ率や特定の製品の調達コストの変化に応じて，あらかじめ取り決められた契約金額を調整する。"},{"label":"ウ","html":"契約時に，目標とするコスト，利益，利益配分率，上限額を合意し，目標とするコストと実際に発生したコストの差異に基づいて利益を配分する。"},{"label":"エ","html":"ベンダの役務や技術に対する報酬に加え，委託業務の遂行に要した費用の全てをベンダに支払う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム開発の契約方式には、あらかじめ決めた価格で発注する定額契約（Fixed-Price Contract）、インフレ等に応じて金額を調整する経済価格調整契約（Economic Price Adjustment）、目標コストや利益配分率を事前合意するインセンティブフィー契約（Cost-Plus-Incentive-Fee）、そして実費償還型契約（Cost-Reimbursable Contract）などがある。実費償還型契約は、委託業務の遂行に実際にかかった費用（実費）を全額発注者が負担し、それに加えてベンダの役務や技術力に対する報酬（フィー）を支払う方式であり、要件が固まりきらない開発の初期段階などリスクが高い案件で用いられることが多い。選択肢エはこの定義そのものである。選択肢アは発注者が注文時に合意した価格を支払い、リスクをベンダが負う内容であり定額契約の説明、選択肢イは物価変動等に応じて契約金額を調整する経済価格調整契約の説明、選択肢ウは目標コストと実際コストの差異に基づいて利益を配分するインセンティブフィー型契約の説明であり、いずれも実費償還型とは異なる契約類型である。</p>","mnemonic":""},{"id":130,"year":2019,"period":"令和元年度秋期","num":6,"cat":"ストラテジ系","field":"LBO","summary":"LBO：令和元年度秋期 問6","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>LBOの説明はどれか。</p>","choices":[{"label":"ア","html":"株式市場で一般株主に対して，一定期間に一定の価格で株式を買い付けることを公告し，相手先企業の株式を取得する。"},{"label":"イ","html":"現経営陣や事業部門の責任者が株主から自社の株式を取得することによって，当該事業の経営支配権を取得する。"},{"label":"ウ","html":"投資会社が，業績不振などの問題を抱えた企業の株式の過半数を取得した上で，マネジメントチームを派遣し，経営に参画する。"},{"label":"エ","html":"買収先企業の資産などを担保に，金融機関から資金を調達するなど，限られた手元資金で企業を買収する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>LBO（Leveraged Buyout、レバレッジドバイアウト）とは、買収対象企業の資産や将来のキャッシュフローを担保に金融機関などから買収資金を借り入れ、少ない自己資金（手元資金）で企業を買収する手法である。買収後は対象企業自身が生み出す事業キャッシュフローを原資に借入金を返済していく点が特徴で、プライベートエクイティファンドなどが主導することが多い。選択肢エはこの「資産を担保にした借入による、限られた資金での買収」というLBOの核心を正しく説明している。選択肢アは株式市場で一般株主から株式を買い集めるTOB（株式公開買付け）の説明、選択肢イは経営陣や事業責任者が自ら株式を取得して経営支配権を得るMBO（マネジメント・バイアウト）の説明であり、LBOとは「誰が買収するか」という観点で異なる概念である。選択肢ウは投資会社が株式を取得してマネジメントチームを派遣し経営に参画するという内容で、バイアウトファンドによる経営関与を述べたものであり、借入を前提とするLBO固有の特徴（レバレッジ）には言及していない。</p>","mnemonic":""},{"id":131,"year":2019,"period":"令和元年度秋期","num":7,"cat":"ストラテジ系","field":"アンゾフ","summary":"アンゾフ：令和元年度秋期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>アンゾフの成長マトリクスを説明したものはどれか。</p>","choices":[{"label":"ア","html":"外部環境と内部環境の観点から，強み，弱み，機会，脅威という四つの要因について情報を整理し，企業を取り巻く環境を分析する手法である。"},{"label":"イ","html":"企業のビジョンと戦略を実現するために，財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点から事業活動を検討し，アクションプランまで具体化していくマネジメント手法である。"},{"label":"ウ","html":"事業戦略を，市場浸透，市場拡大，製品開発，多角化という四つのタイプに分類し，事業の方向性を検討する際に用いる手法である。"},{"label":"エ","html":"製品ライフサイクルを，導入期，成長期，成熟期，衰退期という四つの段階に分類し，企業にとって最適な戦略を立案する手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アンゾフの成長マトリクスは、経営学者イゴール・アンゾフが提唱したフレームワークで、「製品」と「市場」をそれぞれ既存・新規の軸で捉え、市場浸透、市場開拓（市場拡大）、製品開発、多角化という4つの事業成長戦略に分類する手法である。一般に、既存製品を既存市場でより深く浸透させる市場浸透戦略はリスクが最も低く、逆に新製品を新市場に投入する多角化戦略はリスクが最も高いとされる。選択肢ウはこの4区分による事業方向性の検討手法という説明であり、アンゾフの成長マトリクスそのものを指している。選択肢アは強み・弱み・機会・脅威の4要因で環境分析を行うSWOT分析の説明、選択肢イは財務・顧客・内部ビジネスプロセス・学習と成長の4視点からアクションプランまで具体化するバランススコアカード（BSC）の説明、選択肢エは導入期・成長期・成熟期・衰退期という段階に製品を分類するプロダクトライフサイクル（PLC）分析の説明であり、いずれもアンゾフのマトリクスとは異なる手法である。</p>","mnemonic":""},{"id":132,"year":2019,"period":"令和元年度秋期","num":8,"cat":"ストラテジ系","field":"ブランド拡張","summary":"ブランド拡張：令和元年度秋期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ブランド戦略のうち，ブランド拡張を説明したものはどれか。</p>","choices":[{"label":"ア","html":"既存のブランドネームをそのまま用いた上で，対象市場を新しいマーケットセグメントに変更し，売上高の増加を狙う戦略である。"},{"label":"イ","html":"既存のブランドネームを他の商品においても展開することによって，既存ブランドの認知度を他の商品にも利用し，販売効果を高める戦略である。"},{"label":"ウ","html":"従来の市場をターゲットとし続けるが，従来のブランドネームを廃棄して新しいブランドネームに変更する戦略である。"},{"label":"エ","html":"単一のブランドを強調するだけでなく，同一カテゴリで複数ブランドを使い分けることによって市場シェアの獲得を狙う戦略である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ブランド拡張（Brand Extension）とは、既に市場で確立されたブランドネームを、その企業の別の製品カテゴリーにも展開するマーケティング戦略を指す。既存ブランドが持つ高い認知度や好意的なイメージを新製品に波及させることで、広告・販促コストを抑えつつ新製品の市場浸透を図れる点が利点だが、逆に新製品で失敗した場合はブランド全体のイメージが毀損するリスクもある。選択肢イの「既存のブランドネームを他の商品においても展開することによって，既存ブランドの認知度を他の商品にも利用し，販売効果を高める」はこの定義に合致する。選択肢アは同じブランドのまま対象セグメントを変更するという内容でリポジショニングに近く、選択肢ウはブランドネーム自体を新しいものに変更するリブランディングの説明、選択肢エは同一カテゴリーで複数のブランドを使い分けるマルチブランド戦略の説明であり、いずれもブランド拡張（既存ブランド名を異なるカテゴリーに展開する）とは異なる概念である。</p>","mnemonic":""},{"id":133,"year":2019,"period":"令和元年度秋期","num":9,"cat":"ストラテジ系","field":"価格設定法","summary":"価格設定法：令和元年度秋期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>目標とする投資収益率を実現するように価格を設定する手法はどれか。</p>","choices":[{"label":"ア","html":"実勢価格設定"},{"label":"イ","html":"需要価格設定"},{"label":"ウ","html":"ターゲットリターン価格設定"},{"label":"エ","html":"知覚価値価格設定"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ターゲットリターン価格設定（Target Return Pricing）は、投下資本に対して目標とする投資収益率（ROI）を実現できるよう、想定生産量・コストと目標利益を踏まえて価格を逆算して設定する手法である。原価にあらかじめ決めたマークアップ率を単純に上乗せするコストプラス価格設定とは異なり、投資額と目標リターン率を明示的に組み込む点が特徴で、設備投資の大きい事業で使われることが多い。問題文の「目標とする投資収益率を実現するように価格を設定する手法」はこの定義と一致し、選択肢ウ「ターゲットリターン価格設定」がそのまま正解となる。選択肢アの実勢価格設定は競合や市場の相場に合わせて価格を決める方法、選択肢イの需要価格設定は顧客の需要の強さに応じて価格を変える方法、選択肢エの知覚価値価格設定は顧客が感じる価値を基準に価格を決める方法であり、いずれも「目標投資収益率の達成」を直接の目的とはしていない。</p>","mnemonic":""},{"id":134,"year":2019,"period":"令和元年度秋期","num":10,"cat":"ストラテジ系","field":"価格戦略","summary":"価格戦略：令和元年度秋期 問10","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ペネトレーション価格戦略の説明はどれか。</p>","choices":[{"label":"ア","html":"価格感度が高い消費者層ではなく高価格でも購入する層をターゲットとし，新製品の導入期に短期間で利益を確保する戦略である。"},{"label":"イ","html":"新製品の導入期に，市場が受け入れやすい価格を設定し，まずは利益獲得よりも市場シェアの獲得を優先する戦略である。"},{"label":"ウ","html":"製品やサービスに対する消費者の値頃感に基づいて価格を設定し，消費者にその製品やサービスへの購買行動を喚起させる戦略である。"},{"label":"エ","html":"補完的な複数の製品やサービスを組み合わせて，個々の製品やサービスの価格の合計よりも低い価格を設定し，売上を増大させる戦略である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ペネトレーション価格戦略（市場浸透価格戦略）は、新製品の導入期にあえて市場が受け入れやすい低めの価格を設定し、早期に高い市場シェアを獲得することを優先する価格戦略である。初期の利益を犠牲にしてでも販売数量を増やし、規模の経済や経験曲線効果によって後の段階でコストを下げ、長期的な収益確保につなげる狙いがある。選択肢イの「新製品の導入期に，市場が受け入れやすい価格を設定し，まずは利益獲得よりも市場シェアの獲得を優先する」はこの戦略を正しく説明している。選択肢アは高価格でも購入する層をターゲットに短期間で利益を回収する上澄み吸収価格戦略（スキミングプライシング）の説明であり、ペネトレーション価格とは価格設定の方向性が正反対である。選択肢ウは消費者の値頃感に基づく知覚価値価格設定の説明、選択肢エは複数製品を組み合わせて割安に見せるバンドル価格（抱き合わせ価格）の説明であり、いずれもペネトレーション価格戦略とは異なる。</p>","mnemonic":""},{"id":135,"year":2019,"period":"令和元年度秋期","num":11,"cat":"ストラテジ系","field":"OKR","summary":"OKR：令和元年度秋期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>企業や組織の目標管理の仕組みとしてOKR（Objectives and Key Results）を活用するとき，OKRの目標（Objectives）及び主な結果（Key Results）に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"主な結果は，定性的なものが主体で主観的な確認が可能であればよい。"},{"label":"イ","html":"目標及び主な結果は会社，事業部，個人などお互いに関連のないものを独立して別個に設定する。"},{"label":"ウ","html":"目標は一定期間でのストレッチゴールで人を鼓舞する内容とし，主な結果は定量的なものにする。"},{"label":"エ","html":"目標は測定可能なものとし，主な結果は定性的で人を鼓舞する内容にする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>OKR（Objectives and Key Results）は、企業や組織が目標（Objectives）とその達成度を測る主な結果（Key Results）を設定し、高い頻度（多くは四半期単位）で進捗を確認しながら運用する目標管理手法である。Objectivesは定性的で人を鼓舞するストレッチゴール（通常の努力では到達しにくい高い目標）として設定し、Key Resultsはその達成度を客観的に判断できるよう定量的・測定可能な指標として設定することが推奨されている。選択肢ウの「目標は一定期間でのストレッチゴールで人を鼓舞する内容とし，主な結果は定量的なものにする」はこの考え方を正しく表している。選択肢アは主な結果を定性的・主観的な確認でよいとしており、OKRが重視する客観的な測定可能性に反する。選択肢イは目標や主な結果を会社・事業部・個人で独立に設定するとしているが、実際のOKR運用では各階層の目標を連動（カスケード）させて組織全体の方向性を揃えることが重要とされ誤りである。選択肢エはObjectivesとKey Resultsの性質（定性的/定量的）が選択肢ウと逆になっており誤りである。</p>","mnemonic":""},{"id":136,"year":2019,"period":"令和元年度秋期","num":12,"cat":"マネジメント系","field":"DMAIC","summary":"DMAIC：令和元年度秋期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>図は，シックスシグマの基本となる日常業務の効率や品質の向上を目指す継続的改善サイクルであるDMAICの活動フェーズである。cに該当するものはどれか。ここで，ア～エはa～dのいずれかに対応する。</p><table border=\"1\"><tr><td>定義</td><td>→</td><td>a</td><td>→</td><td>b</td><td>→</td><td>c</td><td>→</td><td>d</td></tr></table><p>（dから定義へ戻る矢印があり，サイクルとして繰り返される。）</p>","choices":[{"label":"ア","html":"改善"},{"label":"イ","html":"測定"},{"label":"ウ","html":"定着"},{"label":"エ","html":"分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>シックスシグマにおけるDMAICは、業務の効率や品質を継続的に改善するためのフレームワークで、Define（定義）、Measure（測定）、Analyze（分析）、Improve（改善）、Control（定着・管理）の5フェーズから成り、頭文字を取ってDMAICと呼ばれる。定義フェーズで顧客の声（VOC）から重要品質特性（CTQ）を導いて課題を設定し、測定フェーズで指標を定めてデータを収集して現状を把握し、分析フェーズで問題の原因となる仮説を列挙して優先順位を付け、改善フェーズで影響の大きい原因への対策を立案・検証し、最後に定着（管理）フェーズで対策を現場に定着させ継続的にモニタリングする、という循環構造になっている。図では定義の後にa→b→c→dの順で続き、dから定義へ戻る矢印があることから、a=測定（イ）、b=分析（エ）、c=改善（ア）、d=定着（ウ）に対応すると判断できる。したがって、cに該当するのは選択肢アの「改善」である。</p>","mnemonic":""},{"id":137,"year":2019,"period":"令和元年度秋期","num":13,"cat":"ストラテジ系","field":"5フォース分析","summary":"5フォース分析：令和元年度秋期 問13","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ファイブフォース分析において，企業の競争力に影響を与える五つの要因として，新規参入者の脅威，バイヤの交渉力，競争業者間の敵対関係，代替製品の脅威と，もう一つはどれか。</p>","choices":[{"label":"ア","html":"サプライヤの交渉力"},{"label":"イ","html":"自社製品の品質"},{"label":"ウ","html":"消費者の購買力"},{"label":"エ","html":"政府の規制"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファイブフォース分析は、経営学者マイケル・ポーターが提唱した業界構造分析のフレームワークで、業界の収益性（競争環境の厳しさ）を、新規参入者の脅威、代替製品の脅威、買い手（顧客）の交渉力、供給者（サプライヤ）の交渉力、業界内の既存競争業者間の敵対関係という5つの要因から分析する。これらの力が強いほど業界の収益性は圧迫され、弱いほど業界内の企業は高い収益を確保しやすいとされる。問題文で挙げられている「新規参入者の脅威」「バイヤの交渉力（買い手の交渉力）」「競争業者間の敵対関係」「代替製品の脅威」の4つに続く残り一つの要因は、供給者側の交渉力、すなわち選択肢アの「サプライヤの交渉力」である。選択肢イの「自社製品の品質」や選択肢エの「政府の規制」はファイブフォースの構成要素には含まれず、選択肢ウの「消費者の購買力」は「バイヤの交渉力」と内容が重複する概念であり、5つ目の独立した要因としては不適切である。</p>","mnemonic":""},{"id":138,"year":2019,"period":"令和元年度秋期","num":14,"cat":"テクノロジ系","field":"IVR","summary":"IVR：令和元年度秋期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>コールセンタシステムにおけるIVRを説明したものはどれか。</p>","choices":[{"label":"ア","html":"企業ビル内などに設置して，外線電話と内線電話，内線電話同士を交換する装置"},{"label":"イ","html":"顧客からの電話に自動応答し，顧客自身の操作によって情報の選択や配信，合成音声による応答などを行う仕組み"},{"label":"ウ","html":"コンピュータと電話を統合し，顧客データベースとPBXを連動させて，発呼や着呼と同時に必要な顧客情報をオペレータの画面上に表示するシステム"},{"label":"エ","html":"着信した電話を，あらかじめ決められたルールに従って，複数のオペレータのうちの1人だけに接続する仕組み"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IVR（Interactive Voice Response、自動音声応答）は、コールセンターなどに着信した電話に対して、あらかじめ録音・合成した音声メニューで自動応答し、発信者がプッシュボタン操作や音声入力で選択した内容に応じて情報提供や適切な窓口への振り分けを行う仕組みである。1970年代から定型的な電話応対の自動化に使われており、24時間対応の実現やオペレーターの負荷軽減といった効果がある一方、メニューが複雑になると顧客体験を損なう面もある。選択肢イの「顧客からの電話に自動応答し，顧客自身の操作によって情報の選択や配信，合成音声による応答などを行う仕組み」はこのIVRの定義と一致する。選択肢アは内線・外線を交換する構内交換機（PBX）の説明、選択肢ウは顧客データベースとPBXを連動させて発着信時に顧客情報を画面表示するCTI（Computer Telephony Integration）の説明、選択肢エはあらかじめ決めたルールで特定のオペレーターに着信を振り分けるACD（Automatic Call Distributor）に近い仕組みの説明であり、いずれもIVRとは異なるコールセンター関連技術を指している。</p>","mnemonic":""},{"id":139,"year":2019,"period":"令和元年度秋期","num":15,"cat":"ストラテジ系","field":"産学連携","summary":"産学連携：令和元年度秋期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>企業と大学との共同研究に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"企業のニーズを受け入れて共同研究を実施するための機関として，各大学にTLO（Technology Licensing Organization）が設置されている。"},{"label":"イ","html":"共同研究で得られた成果を特許出願する場合，研究に参加した企業，大学などの法人を発明者とする。"},{"label":"ウ","html":"共同研究に必要な経費を企業が全て負担した場合でも，実際の研究は大学の教職員と企業の研究者が対等な立場で行う。"},{"label":"エ","html":"国立大学法人が共同研究を行う場合，その研究に必要な費用は全て国が負担しなければならない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>企業と大学の共同研究は、大学の教員・研究者と企業の研究者がそれぞれの知見や資源を持ち寄り、対等な立場で共同して研究を進める産学連携活動の代表的な形態である。費用負担の割合（全額企業負担か、大学・企業双方の負担か）は契約交渉事項であり、費用をどちらが負担するかによって研究上の指揮・実施体制に優劣が生じるものではなく、実際の研究活動は大学側・企業側双方が対等な立場で協力して行われる。選択肢ウはこの点を正しく述べている。選択肢アのTLO（技術移転機関）は大学の研究成果を特許化し企業へ技術移転する仲介組織であり、「企業ニーズを受け入れて共同研究を実施するための機関」ではなく、また全ての大学に設置されているわけでもない。選択肢イは共同研究の成果を特許出願する際の発明者を一律に「研究に参加した企業・大学などの法人」とする内容だが、特許法上、発明者となるのは実際に発明行為を行った自然人（研究者個人）であり、法人を発明者とすることはできない。選択肢エは国立大学法人が行う共同研究費用を全額国が負担するとしているが、共同研究費用は通常、受益者である企業側が応分の費用を負担する仕組みになっており誤りである。</p>","mnemonic":""},{"id":140,"year":2019,"period":"令和元年度秋期","num":16,"cat":"テクノロジ系","field":"スマコン","summary":"スマコン：令和元年度秋期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>Webサイト上で実行されるスマートコントラクトの説明はどれか。</p>","choices":[{"label":"ア","html":"Webサイト上の契約手続において，委託会社，弁護士などの第三者機関を介することを前提とした仕組みである。"},{"label":"イ","html":"アプリケーションサービスを実現するための基盤上に執行条件と契約内容を事前に定義しておき，条件に合致したイベントが発生すると自動執行する仕組みである。"},{"label":"ウ","html":"契約手続において発生する決済を現実通貨ではなく暗号資産によって実施する仕組みである。"},{"label":"エ","html":"販売者と購入者が安全かつスマートに取引するためのものであり，インターネット通販だけを適用範囲とした仕組みである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スマートコントラクトとは、ブロックチェーンなどの分散台帳技術を基盤として、契約内容や実行条件をあらかじめプログラムとして定義しておき、条件を満たすイベントが発生すると、第三者の仲介なしに自動的に処理（決済や権利移転など）が実行される仕組みを指す。イーサリアムが2015年に実装したことで広く普及し、送信されたトランザクションに応じてネットワーク上の各ノードが同一のコードを実行し、結果をブロックチェーン上に記録する点が特徴である。選択肢イの「アプリケーションサービスを実現するための基盤上に執行条件と契約内容を事前に定義しておき，条件に合致したイベントが発生すると自動執行する仕組みである」はこの定義と合致する。選択肢アは委託会社や弁護士など第三者機関の介在を前提としているが、スマートコントラクトの本質は第三者を介さずに自動執行する点にあるため誤り。選択肢ウは決済を暗号資産に限定しているが、スマートコントラクト自体は決済手段を暗号資産に限定する仕組みではない。選択肢エはインターネット通販だけに適用範囲を限定しているが、スマートコントラクトはDeFiやブロックチェーンゲーム、保険など幅広い分野に応用されており、適用範囲をネット通販に限定する説明は誤りである。</p>","mnemonic":""},{"id":141,"year":2019,"period":"令和元年度秋期","num":17,"cat":"ストラテジ系","field":"広告課金方式","summary":"広告課金方式：令和元年度秋期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>インターネットにおける広告形態のうち，インプレッション保証型広告の説明はどれか。</p>","choices":[{"label":"ア","html":"あらかじめ決められたキーワードを利用者が検索エンジンに入力した際に表示される広告"},{"label":"イ","html":"掲載した広告を見た利用者が，その広告をクリックした上で，掲載者の意図に沿った行動を起こした場合に，掲載料を支払う広告"},{"label":"ウ","html":"契約した表示回数に達するまで掲載を続ける広告"},{"label":"エ","html":"ポータルサイトのトップページや特集ページなどに一定期間掲載する広告"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>インターネット広告には、検索結果に連動して表示される検索連動型広告、クリックや成果の発生に応じて課金される成果報酬型広告、一定の表示回数（インプレッション数）に達するまで掲載を続けるインプレッション保証型広告、掲載期間を保証する期間保証型広告など、複数の課金・保証方式がある。インプレッション保証型広告は、広告主と媒体社があらかじめ契約した表示回数（インプレッション数）を広告が獲得するまで掲載を継続する予約型の純広告で、表示回数を基準にCPM（1,000回表示あたりの単価）で課金されるのが一般的であり、クリックの有無にかかわらず広告の露出量を確保できるため、商品やブランドの認知拡大を目的とした展開に適している。選択肢ウの「契約した表示回数に達するまで掲載を続ける広告」はこの定義そのものである。選択肢アは検索キーワードに連動して表示される検索連動型広告（リスティング広告）の説明、選択肢イは広告をクリックした利用者が掲載者の意図した行動（商品購入や会員登録など）を起こした場合に料金が発生する成果報酬型広告（アフィリエイト広告など）の説明であり、いずれもインプレッション数を基準とする保証ではない。選択肢エはポータルサイトの特定の枠に一定「期間」掲載することを保証する期間保証型広告の説明であり、表示「回数」を保証するインプレッション保証型広告とは保証の基準（期間か回数か）が異なるため、不適切である。</p>","mnemonic":""},{"id":142,"year":2019,"period":"令和元年度秋期","num":18,"cat":"ストラテジ系","field":"CVR・顧客獲得単価","summary":"CVR・顧客獲得単価：令和元年度秋期 問18","correct":"イ","result":"","formula":"CVR=購入者数÷クリック数，CAC=広告費用÷購入者数","howto":"広告A〜CそれぞれのCVRとCACを計算して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ECサイトが実施した3種類のバナー広告A〜Cについて，広告費用，バナー広告クリック数，各バナー広告からサイトにアクセスして商品を購入した人数は表のとおりである。コンバージョン率，顧客獲得単価（商品購入者数1人当たりの広告費用）の説明として正しいものはどれか。</p><table><tr><td></td><td>バナー広告A</td><td>バナー広告B</td><td>バナー広告C</td></tr><tr><td>広告費用（円）</td><td>150,000</td><td>750,000</td><td>1,000,000</td></tr><tr><td>バナー広告クリック数（サイトアクセス数）（回）</td><td>300</td><td>500</td><td>600</td></tr><tr><td>商品購入者数（人）</td><td>6</td><td>25</td><td>30</td></tr></table>","choices":[{"label":"ア","html":"バナー広告A〜Cのコンバージョン率は同一であるが，顧客獲得単価はバナー広告Aが最も安い。"},{"label":"イ","html":"バナー広告Aは，三つのバナー広告の中で，コンバージョン率が最も低く，顧客獲得単価は最も安い。"},{"label":"ウ","html":"バナー広告Bとバナー広告Cのコンバージョン率は同一であり，バナー広告Aとバナー広告Cの顧客獲得単価は同一である。"},{"label":"エ","html":"バナー広告Cは，三つのバナー広告の中で，顧客獲得単価が最も高く，コンバージョン率は最も低い。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各広告のコンバージョン率（CVR＝商品購入者数÷クリック数）と顧客獲得単価（CAC＝広告費用÷商品購入者数）を求める。</p><p>広告A：CVR＝6÷300＝2%，CAC＝150,000÷6＝25,000円</p><p>広告B：CVR＝25÷500＝5%，CAC＝750,000÷25＝30,000円</p><p>広告C：CVR＝30÷600＝5%，CAC＝1,000,000÷30≒33,333円</p><p>広告AはCVRが2%で三つの中で最も低く，CACも25,000円で三つの中で最も安い。したがって選択肢「イ」が正しい。アはCVRが同一でない時点で誤り，ウはCAC（A）25,000円とCAC（C）約33,333円が同一でないため誤り，エはCのCACは最高だがCVRは最低でない（Aが最低）ため誤り。</p>","mnemonic":"Aは300クリックで6人しか買わずCVR2%と最低だが、1人25,000円は三広告中いちばん安い――安物買いに見えて実は掘り出し物のイ。"},{"id":143,"year":2019,"period":"令和元年度秋期","num":19,"cat":"ストラテジ系","field":"デルファイ法","summary":"デルファイ法：令和元年度秋期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>予測手法の一つであるデルファイ法の説明はどれか。</p>","choices":[{"label":"ア","html":"現状の指標の中に将来の動向を示す指標があることに着目して予測する。"},{"label":"イ","html":"将来予測のためのモデル化した連立方程式を解いて予測する。"},{"label":"ウ","html":"同時点における複数の観測データの統計比較分析によって将来を予測する。"},{"label":"エ","html":"複数の専門家へのアンケートの繰返しによる回答の収束によって将来を予測する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>デルファイ法は、技術や社会動向の将来予測に用いられる手法で、複数の専門家に対して匿名でアンケート調査を複数回（通常2～4回程度）繰り返し実施し、各回ごとに集計結果を参加者にフィードバックしながら回答を見直してもらうことで、意見を徐々に収束させていく点が特徴である。米国のランド研究所でO.ヘルマーらによって開発された手法で、匿名性を保つことにより、発言力のある特定の専門家の意見に全体が引きずられることを防ぎ、地位や権威に影響されない率直な意見を引き出せるとされる。問題文の「予測手法の一つであるデルファイ法」に対応する選択肢エ「複数の専門家へのアンケートの繰返しによる回答の収束によって将来を予測する」はこの手法を正しく説明している。選択肢アは既知の指標の兆候から将来を予測する先行指標法に近く、選択肢イは連立方程式などの数理モデルを用いるモデル予測（計量経済モデル等）の説明、選択肢ウは同時点の複数の観測データを統計的に比較分析する横断的（クロスセクション）分析の説明であり、いずれもデルファイ法の特徴である「反復的なアンケートによる合意形成」とは異なる。</p>","mnemonic":""},{"id":144,"year":2019,"period":"令和元年度秋期","num":20,"cat":"テクノロジ系","field":"ベイズ統計","summary":"ベイズ統計：令和元年度秋期 問20","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ベイズ統計の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"経済統計に関する国際条約に基づいて，貿易実態を正確に把握し，国の経済政策や企業の経済活動の資料とすることを目的に統計指標を作成する手法"},{"label":"イ","html":"事前分布・事後分布といった確率に関する考え方に基づいて体系化されたものであり，ディープラーニング，迷惑メールフィルタなどに利用されている統計理論"},{"label":"ウ","html":"収集されたデータの代表値である平均値・中央値・最頻値を求めたり，度数分布表やヒストグラムを作成したりすることによって，データの特徴を捉える統計理論"},{"label":"エ","html":"ビッグデータの収集・分析に当たり，分析結果の検証可能性を確保し，複数の分析結果を比較可能とするために，対象をオープンデータに限定する統計手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ベイズ統計は、ある事象の起こりやすさ（確率）を、データを観測する前の知識や仮定に基づく「事前分布」と、実際にデータを観測した後に更新される「事後分布」という考え方で捉え、ベイズの定理に基づいて事前分布と尤度（データの出方）の積から事後分布を求めることで体系化された統計理論である。この枠組みは、新しいデータが得られるたびに確率の推定を逐次更新できる点が特徴で、迷惑メールの判定（いわゆるベイジアンフィルタ）や、階層構造を持つ複雑なモデルの推測、さらに近年ではディープラーニングを含む機械学習分野でも応用されている。選択肢イの「事前分布・事後分布といった確率に関する考え方に基づいて体系化されたものであり，ディープラーニング，迷惑メールフィルタなどに利用されている統計理論」はこの内容と合致する。選択肢アは貿易統計など経済統計に関する国際条約に基づく統計手法の説明、選択肢ウは平均値・中央値・最頻値やヒストグラムなどを扱う記述統計の説明、選択肢エはビッグデータの分析対象をオープンデータに限定する統計手法という独自の説明であり、いずれもベイズ統計の特徴（事前分布と事後分布による確率更新）とは異なる。</p>","mnemonic":""},{"id":145,"year":2019,"period":"令和元年度秋期","num":21,"cat":"ストラテジ系","field":"線形計画法","summary":"線形計画法：令和元年度秋期 問21","correct":"ウ","result":"","formula":"目的関数Z=X+Yを制約3X+2Y≦120，X+2Y≦60の下で最大化（線形計画法）","howto":"制約式の交点の頂点を求め，各頂点のZ=X+Yを比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>製品X，Yを1台製造するのに必要な部品数は，表のとおりである。製品1台当たりの利益がX，Yともに1万円のとき，利益は最大何万円になるか。ここで，部品Aは120個，部品Bは60個まで使えるものとする。</p><table><tr><td rowspan=\"2\">部品</td><td colspan=\"2\">製品（単位 個）</td></tr><tr><td>X</td><td>Y</td></tr><tr><td>A</td><td>3</td><td>2</td></tr><tr><td>B</td><td>1</td><td>2</td></tr></table>","choices":[{"label":"ア","html":"30"},{"label":"イ","html":"40"},{"label":"ウ","html":"45"},{"label":"エ","html":"60"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>利益Z=X+Y（万円）を，制約条件 3X+2Y≦120（部品A），X+2Y≦60（部品B），X,Y≧0 の下で最大化する線形計画問題である。</p><p>2直線 3X+2Y=120 と X+2Y=60 の交点を求める。両式の差をとると 2X=60 よりX=30，これをX+2Y=60に代入してY=(60-30)/2=15。</p><p>この頂点での利益はZ=30+15=45（万円）。他の頂点（X=40,Y=0でZ=40／X=0,Y=30でZ=30／原点でZ=0）より大きいので，最大利益は45万円となる。したがって正解は「ウ」。</p>","mnemonic":"部品Aを3対2、部品Bを1対2で使い切るぎりぎりの配分はX30台・Y15台。足せば『良い子(45)』の45万円が利益の頂点になる。"},{"id":146,"year":2019,"period":"令和元年度秋期","num":22,"cat":"ストラテジ系","field":"IRR法","summary":"IRR法：令和元年度秋期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>投資効果の評価に用いられる内部収益率法（IRR法）を説明したものはどれか。</p>","choices":[{"label":"ア","html":"現金の支出（投資額）と収入（利益額）のフローを現在価値に置き換えた金額の大小によって投資の有利性を評価する方法である。"},{"label":"イ","html":"投下した資金がどれだけの期間で回収できるかによって投資の有利性を評価する方法である。"},{"label":"ウ","html":"投資から回収される現金収入（利益額）の現在価値が投資額に等しくなるような割引率を求め，基準の割引率よりも大きければ有利と評価する方法である。"},{"label":"エ","html":"投資によって生じる年々の平均現金流入額を投資額で割って投資利益率を算出し，投資利益率が高ければ有利と評価する方法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IRR法（内部収益率法、Internal Rate of Return法）は、投資案の評価手法の一つで、投資によって将来得られる現金収入（利益額）の現在価値の合計が、投資額（初期投資）と等しくなるような割引率、すなわち正味現在価値（NPV）がゼロになる割引率（内部収益率）を算出し、その割引率が企業の設定する基準割引率（資本コストなど）を上回れば、その投資は有利であると判断する方法である。NPV法が特定の割引率のもとでの正味現在価値の大きさによって投資の優劣を判断するのに対し、IRR法は投資自体が生み出す収益率そのものを算出して他の投資機会や資本コストと比較できる点が特徴である。選択肢ウの「投資から回収される現金収入の現在価値が投資額に等しくなるような割引率を求め，基準の割引率よりも大きければ有利と評価する方法である」はこの内容と一致する。選択肢アは現金の支出と収入のフローを現在価値に置き換えた金額（正味現在価値）の大小で評価するNPV法の説明、選択肢イは投資額を回収するのに要する期間で評価する回収期間法（ペイバック法）の説明、選択肢エは年々の平均現金流入額を投資額で割って求める投資利益率（ARR、会計的利益率法）の説明であり、いずれもIRR法とは異なる評価方法である。</p>","mnemonic":""},{"id":147,"year":2019,"period":"令和元年度秋期","num":23,"cat":"ストラテジ系","field":"RoHS指令","summary":"RoHS指令：令和元年度秋期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>基準値を超える鉛，水銀などの有害物質を電気・電子機器に使用することを制限するために，欧州連合が制定し，施行しているものはどれか。</p>","choices":[{"label":"ア","html":"ISO 14001"},{"label":"イ","html":"RoHS指令"},{"label":"ウ","html":"WEEE指令"},{"label":"エ","html":"グリーン購入法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RoHS指令（Restriction of Hazardous Substances指令）は、欧州連合（EU）が電気・電子機器を対象に制定した化学物質規制で、鉛、水銀、カドミウム、六価クロム、特定の臭素系難燃剤（PBB、PBDE）など、基準値を超える有害物質の使用を制限することを目的としている。製品が廃棄される際のリサイクルを容易にし、埋立てや焼却に伴う人や環境への悪影響を防ぐことを狙いとしており、2003年に採択され、その後2011年の改正（RoHS2）を経て対象製品の範囲が拡大されている。廃電気・電子機器の回収・リサイクルの仕組みを定めるWEEE指令（Waste Electrical and Electronic Equipment指令）とは対象製品がほぼ同じで、両指令は表裏一体の関係にある制度として運用されている。選択肢イの「RoHS指令」が、問題文にある「基準値を超える鉛，水銀などの有害物質を電気・電子機器に使用することを制限するために，欧州連合が制定し，施行しているもの」そのものを指す。選択肢アのISO14001は環境マネジメントシステムの国際規格、選択肢ウのWEEE指令は廃電気・電子機器のリサイクルに関する指令（有害物質の使用制限そのものを定める指令ではない）、選択肢エのグリーン購入法は日本の法律で環境負荷の少ない製品の調達を促進するものであり、いずれも「有害物質の使用制限」をEUが定めた指令という問題文の趣旨には合致しない。</p>","mnemonic":""},{"id":148,"year":2019,"period":"令和元年度秋期","num":24,"cat":"テクノロジ系","field":"DNS水責め","summary":"DNS水責め：令和元年度秋期 問24","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>DNS水責め攻撃（ランダムサブドメイン攻撃）はどれか。</p>","choices":[{"label":"ア","html":"標的のDNSキャッシュサーバに，ランダムかつ大量に生成した偽のサブドメインのDNS情報を注入する。"},{"label":"イ","html":"標的の権威DNSサーバに，ランダムかつ大量に生成した存在しないサブドメイン名を問い合わせる。"},{"label":"ウ","html":"標的のサーバに，ランダムに生成したサブドメインのDNS情報を格納した，大量のDNSレスポンスを送り付ける。"},{"label":"エ","html":"標的のサーバに，ランダムに生成したサブドメインのDNS情報を格納した，データサイズが大きいDNSレスポンスを送り付ける。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DNS水責め攻撃（ランダムサブドメイン攻撃、Water Torture Attack）は、攻撃対象のドメインに存在しない、ランダムに生成した大量のサブドメイン名（例：ランダム文字列.target.example.jp）を、標的の権威DNSサーバに大量に問い合わせることで、当該サーバの処理能力を枯渇させるDDoS攻撃の一種である。ランダムなサブドメイン名はキャッシュDNSサーバにキャッシュされていないため、問い合わせはキャッシュで処理されずに必ず権威DNSサーバまで到達し、権威DNSサーバが大量の問い合わせに応答しきれなくなることで、同じサーバが管理する他の正規ドメインへの名前解決にも支障が生じる点が特徴である。しばしば多数の踏み台（オープンリゾルバや不正に乗っ取った端末）から分散的に問い合わせを送信することで、送信元の特定や対策を困難にする。選択肢イの「標的の権威DNSサーバに，ランダムかつ大量に生成した存在しないサブドメイン名を問い合わせる」はこの攻撃の本質を正しく説明している。選択肢アは標的のキャッシュDNSサーバに偽のDNS情報を注入する内容でDNSキャッシュポイズニングに近く、選択肢ウ・エは標的サーバに大量のDNSレスポンス（応答）を送り付けるとしており、DNSリフレクション（反射）攻撃やDNSアンプ攻撃に近い内容であって、権威DNSサーバへの大量の「問い合わせ」によって負荷をかけるDNS水責め攻撃とは攻撃の方向性が異なる。</p>","mnemonic":""},{"id":149,"year":2019,"period":"令和元年度秋期","num":25,"cat":"テクノロジ系","field":"暗号方式","summary":"暗号方式：令和元年度秋期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>暗号技術のうち，共通鍵暗号方式はどれか。</p>","choices":[{"label":"ア","html":"AES"},{"label":"イ","html":"ElGamal暗号"},{"label":"ウ","html":"RSA"},{"label":"エ","html":"楕円曲線暗号"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>暗号技術は大きく、暗号化と復号に同じ鍵を使う共通鍵暗号方式（秘密鍵暗号方式）と、公開鍵と秘密鍵の鍵ペアを使う公開鍵暗号方式に分類される。AES（Advanced Encryption Standard）は、米国NISTが2000年代初頭に標準として採用したブロック暗号アルゴリズムであり、共通鍵暗号方式に分類される代表的な方式で、処理速度が速いことから大量データの暗号化に広く使われている。これに対し、選択肢に挙がっているRSAは大きな合成数の素因数分解の困難性を安全性の根拠とする公開鍵暗号方式、ElGamal暗号は離散対数問題の困難性を安全性の根拠とする公開鍵暗号方式、楕円曲線暗号は楕円曲線上の離散対数問題を利用する公開鍵暗号方式（ECDSAなどの電子署名にも応用される）であり、いずれも公開鍵暗号方式に分類される。したがって、共通鍵暗号方式に該当するのは選択肢アのAESのみであり、これが正解となる。公開鍵暗号方式は鍵の配送や電子署名に向く一方、共通鍵暗号方式は暗号化・復号の処理が高速なため大量データの暗号化に向いており、実際の通信（TLS/SSLなど）では両者を組み合わせたハイブリッド方式が一般的に用いられる。</p>","mnemonic":""},{"id":150,"year":2018,"period":"平成30年度秋期","num":1,"cat":"マネジメント系","field":"IDEALモデル","summary":"IDEALモデル：平成30年度秋期 問1","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>IDEALによるプロセス改善の取組みにおいて,図のbに当てはまる説明はどれか。ここで,ア~エはa~dのいずれかに対応する。</p><table border=\"1\" cellspacing=\"0\" cellpadding=\"6\"><tr><td>開始</td><td>→</td><td>a</td><td>→</td><td><b>b</b></td></tr><tr><td></td><td></td><td>↑</td><td></td><td>↓</td></tr><tr><td></td><td></td><td>d</td><td>←</td><td>c</td></tr></table>","choices":[{"label":"ア","html":"解決策を作り,その先行評価・試行・展開を行う。"},{"label":"イ","html":"改善活動の優先順位を設定し,具体的な改善計画を作成する。"},{"label":"ウ","html":"活動を分析してその妥当性を確認し,次のサイクルの準備を行う。"},{"label":"エ","html":"業務の現状を調査して可視化し,改善ポイントを明らかにする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IDEALモデルは、米国カーネギーメロン大学SEIが提唱したソフトウェアプロセス改善のためのサイクルモデルであり、Initiating(開始)、Diagnosing(診断)、Establishing(確立)、Acting(実行)、Learning(学習)の5フェーズの頭文字を取った名称である。図の流れは「開始→a→b→c→d→(aへ戻る)」であり、これはInitiating→Diagnosing→Establishing→Acting→Learning→次サイクルのDiagnosingへ、という順序に対応する。したがってaはDiagnosing(現状調査・可視化=エ)、bはEstablishing(優先順位設定・改善計画の作成=イ)、cはActing(解決策の先行評価・試行・展開=ア)、dはLearning(活動の分析・妥当性確認・次サイクルの準備=ウ)となる。bに当てはまるのは改善活動の優先順位を設定し具体的な改善計画を作成する活動であり、選択肢イが正解である。選択肢エはDiagnosingの説明であり、現状把握の段階でbより前のaに該当するため誤り。選択肢アはActing、選択肢ウはLearningの説明であり、いずれもbより後の工程を指している。</p>","mnemonic":""},{"id":151,"year":2018,"period":"平成30年度秋期","num":2,"cat":"テクノロジ系","field":"SOA","summary":"SOA：平成30年度秋期 問2","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>SOAの説明はどれか。</p>","choices":[{"label":"ア","html":"会計,人事,製造,購買,在庫管理,販売などの企業の業務プロセスを一元管理することによって,業務の効率化や経営資源の全体最適を図る手法"},{"label":"イ","html":"企業の業務プロセス,システム化要求などのニーズと,ソフトウェアパッケージの機能性がどれだけ適合し,どれだけかい離しているかを分析する手法"},{"label":"ウ","html":"業務プロセスの問題点を洗い出して,目標設定,実行,チェック,修正行動のマネジメントサイクルを適用し,継続的な改善を図る手法"},{"label":"エ","html":"利用者の視点から業務システムの機能を幾つかの独立した部品に分けることによって,業務プロセスとの対応付けや他ソフトウェアとの連携を容易にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SOA(Service Oriented Architecture、サービス指向アーキテクチャ)は、業務システムの機能を「サービス」と呼ばれる独立した単位に分割し、それらを組み合わせることでシステムを構築する設計思想である。各サービスは利用者や業務の視点から意味のある機能単位として定義され、SOAPやRESTといった標準化された通信方式で相互に連携する。この特徴により、業務プロセスの変更に応じてサービスを組み替えたり他のソフトウェアと連携させたりすることが容易になり、ビジネス環境の変化に迅速に対応できる柔軟性を実現する。選択肢エはこの「独立した部品への分割」と「連携の容易化」というSOAの本質を的確に説明しており正解である。選択肢アは会計・人事・製造・購買・在庫管理・販売などを一元管理するERP(統合基幹業務システム)の説明であり、SOAとは異なる。選択肢イは業務要求とパッケージソフトの機能とのかい離を分析するフィット&ギャップ分析の説明、選択肢ウはPDCAサイクルを適用した継続的改善活動の説明であり、いずれもSOAとは別の概念である。</p>","mnemonic":""},{"id":152,"year":2018,"period":"平成30年度秋期","num":3,"cat":"ストラテジ系","field":"決定木分析","summary":"決定木分析：平成30年度秋期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ある企業では,顧客データについて,顧客を性別・年齢層・職業・年収など複数の属性を組み合わせてセグメント化し,蓄積された大量の購買履歴データに照らして商品の購入可能性が最も高いセグメントを予測している。このときに活用される分析手法はどれか。</p>","choices":[{"label":"ア","html":"ABC分析"},{"label":"イ","html":"SWOT分析"},{"label":"ウ","html":"競合分析"},{"label":"エ","html":"決定木分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>設問の状況は、性別・年齢層・職業・年収など複数の属性を組み合わせて顧客をセグメント化し、蓄積された購買履歴データから商品の購入可能性が最も高いセグメントを予測するというものであり、これは決定木分析(デシジョンツリー分析)が典型的に用いられる場面である。決定木分析では、購入の有無などの目的変数に対して影響の大きい属性(性別・年齢・職業など)を順に枝分かれさせてグループ分けし、樹形図の上位の分岐ほど購入可否を分ける重要な要因であることを視覚的に示す。マーケティングの実務では、会員属性や購買履歴から特定商品を購入する確率の高いセグメントを抽出する用途で広く使われており、設問の説明そのものに合致する。選択肢アのABC分析は売上や在庫を重要度順に分類する手法、選択肢イのSWOT分析は自社の強み・弱みと機会・脅威を整理する経営戦略の分析手法、選択肢ウの競合分析は競合他社の動向を分析する手法であり、いずれも複数属性の組合せから購入可能性の高いセグメントを予測する手法ではない。</p>","mnemonic":""},{"id":153,"year":2018,"period":"平成30年度秋期","num":4,"cat":"ストラテジ系","field":"構造化インタビュー","summary":"構造化インタビュー：平成30年度秋期 問4","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>構造化インタビューの手法を用いた意見の収集形態はどれか。</p>","choices":[{"label":"ア","html":"参加者にテーマだけを提示し,そのテーマに対し,意見の収集,要約,配布,再度の意見の収集を繰り返すことで,集約した意見を収集した。"},{"label":"イ","html":"熟練したインタビュアが,議論を一定の方向に絞りながら,会議の参加者の自由な意見を収集した。"},{"label":"ウ","html":"調査項目を全て決めてから,決められた順序で質問することで,インタビュアの技量に左右されない意見を収集した。"},{"label":"エ","html":"批判厳禁,自由奔放,質より量,他人の意見の活用などを基本ルールとして,多様で新たな意見を収集した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>構造化インタビューとは、調査項目や質問の順序を事前にすべて決定しておき、その決められた質問内容・順序どおりにインタビューを進める手法であり、インタビュアーの技量や進行の仕方による差異が結果に影響しにくいという特徴を持つ。これは、質問項目や順序をあらかじめ固定しない「非構造化インタビュー」や、大枠のみ決めて柔軟に質問する「半構造化インタビュー」と対比される概念である。選択肢ウは「調査項目を全て決めてから,決められた順序で質問することで,インタビュアの技量に左右されない意見を収集した」としており、この定義に正確に合致するため正解である。選択肢アは、テーマだけを提示し意見の収集・要約・配布・再度の収集を繰り返す手法で、これはデルファイ法の説明である。選択肢イは熟練したインタビュアーが議論を一定方向に絞りながら自由な意見を集める手法で、フォーカスグループインタビュー(グループインタビュー)に近い説明である。選択肢エは批判厳禁・自由奔放・質より量・便乗歓迎(他人の意見の活用)というブレーンストーミングの四原則そのものであり、構造化インタビューとは異なる。</p>","mnemonic":""},{"id":154,"year":2018,"period":"平成30年度秋期","num":5,"cat":"テクノロジ系","field":"共通フレーム2013","summary":"共通フレーム2013：平成30年度秋期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>共通フレーム2013によれば,要件定義プロセスの活動内容には,利害関係者の識別,要件の識別,要件の評価,要件の合意などがある。このうちの要件の識別において実施する作業はどれか。</p>","choices":[{"label":"ア","html":"システムのライフサイクルの全期間を通して,どの工程でどの関係者が参画するのかを明確にする。"},{"label":"イ","html":"抽出された要件を確認して,矛盾点や曖昧な点をなくし,一貫性がある要件の集合として整理する。"},{"label":"ウ","html":"矛盾した要件,実現不可能な要件などの問題点に対する解決方法を利害関係者に説明し,合意を得る。"},{"label":"エ","html":"利害関係者から要件を漏れなく引き出し,制約条件や運用シナリオなどを明らかにする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>共通フレーム2013は、ソフトウェアライフサイクルに関する国際規格(JIS X 0160:2012、ISO/IEC/IEEE 29148等)をベースに、システム開発に関わる用語や作業内容の共通化を図ったガイドラインであり、要件定義プロセスの活動として、利害関係者の識別・要件の識別・要件の評価・要件の合意などを定めている。このうち「要件の識別」は、利害関係者から要件を漏れなく引き出し、制約条件や運用シナリオなどを明らかにする、いわゆる要件抽出(エリシテーション)の作業に相当する。これはISO/IEC/IEEE 29148における利害関係者要件定義プロセスの考え方とも整合しており、選択肢エが正解である。選択肢アはシステムのライフサイクル全体でどの関係者がどの工程に関与するかを明確にする作業であり、これは「利害関係者の識別」に該当する。選択肢イは抽出された要件の矛盾や曖昧さをなくし一貫性ある要件集合として整理する作業で「要件の評価」に近く、選択肢ウは問題点への解決方法を利害関係者に説明し合意を得る作業であり「要件の合意」に該当する。</p>","mnemonic":""},{"id":155,"year":2018,"period":"平成30年度秋期","num":6,"cat":"ストラテジ系","field":"垂直統合(M&A)","summary":"垂直統合(M&A)：平成30年度秋期 問6","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>多角化戦略のうち,M&Aによる垂直統合に該当するものはどれか。</p>","choices":[{"label":"ア","html":"銀行による保険会社の買収・合併"},{"label":"イ","html":"自動車メーカによる軽自動車メーカの買収・合併"},{"label":"ウ","html":"製鉄メーカによる鉄鋼石採掘会社の買収・合併"},{"label":"エ","html":"電機メーカによる不動産会社の買収・合併"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>垂直統合とは、原材料の調達から製造、販売に至るバリューチェーン(価値連鎖)上の、自社とは異なる段階を担う企業をM&Aによって統合する多角化戦略であり、上流(原材料・部品側)を統合する場合を「川上統合(後方統合)」、下流(流通・販売側)を統合する場合を「川下統合(前方統合)」と呼ぶ。選択肢ウの「製鉄メーカによる鉄鋼石採掘会社の買収・合併」は、製鉄業の原材料である鉄鉱石を採掘する上流企業を統合するものであり、典型的な垂直統合(川上統合)に該当するため正解である。これにより原材料調達の安定化や中間マージンの削減といった効果が期待できる。選択肢イの「自動車メーカによる軽自動車メーカの買収・合併」は、同じ自動車製造という同一事業段階の企業同士の統合であり、垂直統合ではなく水平統合に分類される。選択肢アの「銀行による保険会社の買収・合併」や選択肢エの「電機メーカによる不動産会社の買収・合併」は、価値連鎖上のつながりがない異業種への進出であり、垂直統合ではなく(非関連)多角化に該当する。</p>","mnemonic":""},{"id":156,"year":2018,"period":"平成30年度秋期","num":7,"cat":"ストラテジ系","field":"PPM","summary":"PPM：平成30年度秋期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>プロダクトポートフォリオマネジメント(PPM)マトリックスのa, bに入れる語句の適切な組合せはどれか。</p><table border=\"1\" cellspacing=\"0\" cellpadding=\"6\"><tr><th></th><th>高</th><th>低</th></tr><tr><th>[a] 高</th><td>花形</td><td>問題児</td></tr><tr><th>低</th><td>金のなる木</td><td>負け犬</td></tr></table><p>(横軸: 高 ← [b] → 低)</p>","choices":[{"label":"ア","html":"a:売上高利益率 b:市場占有率"},{"label":"イ","html":"a:市場成長率 b:売上高利益率"},{"label":"ウ","html":"a:市場成長率 b:市場占有率"},{"label":"エ","html":"a:市場占有率 b:市場成長率"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PPM(プロダクトポートフォリオマネジメント)は、1970年代にボストン・コンサルティング・グループ(BCG)が提唱した経営資源配分の分析手法であり、縦軸に「市場成長率」、横軸に「市場占有率(市場シェア)」をとった2軸のマトリックスで事業・製品を4象限に分類する。市場成長率・占有率がともに高い象限は「花形」、成長率は低いが占有率が高い象限は「金のなる木」、成長率は高いが占有率が低い象限は「問題児」、両方低い象限は「負け犬」と呼ばれる。設問の図でaは縦軸(高い側に花形・問題児、低い側に金のなる木・負け犬)なので市場成長率、bは横軸(高い側に花形・金のなる木、低い側に問題児・負け犬)なので市場占有率に対応し、a=市場成長率、b=市場占有率の組合せである選択肢ウが正解である。選択肢ア・イ・エはこの軸の組合せを誤って入れ替えたものであり、たとえば「売上高利益率」はPPMの軸には用いられない指標である。</p>","mnemonic":""},{"id":157,"year":2018,"period":"平成30年度秋期","num":8,"cat":"ストラテジ系","field":"FSP","summary":"FSP：平成30年度秋期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>FSP(Frequent Shoppers Program)の説明はどれか。</p>","choices":[{"label":"ア","html":"Webサイトの閲覧者が掲載広告のリンク先であるECサイトで商品を購入した場合,広告主からそのWebサイト運営者に成果報酬を支払う仕組みである。"},{"label":"イ","html":"期間を限定した値引きの販売施策を見直し,コスト削減によるローコストオペレーションを実現させて,恒常的な低価格戦略を展開することである。"},{"label":"ウ","html":"顧客に会員カードなどを発行して購買情報を収集し,顧客には割引ポイントの付与や会員割引の特典を与えるなど,優良顧客の維持拡大を図る仕組みである。"},{"label":"エ","html":"顧客の購買行動における,直近購買日,購買頻度,購買金額の3要素を用いて,優良顧客のセグメンテーションなどを行う顧客分析手法のことである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>FSP(Frequent Shoppers Program)は、小売業などが会員カードを発行して顧客の購買履歴データを収集し、購買実績に応じてポイント付与や会員割引などの特典を提供することで、優良顧客(ロイヤルカスタマー)の維持・拡大を図るマーケティング施策である。従来の、誰でも同じ割引を受けられる単純な割引販売とは異なり、顧客ごとの購買データに基づいて個々の顧客との関係を深め、長期的な利益最大化を狙う点に特徴がある。選択肢ウはこの「会員カードによる購買情報収集」と「優良顧客の維持拡大」という要点を的確に表しており正解である。選択肢アはアフィリエイト(成果報酬型広告)の説明、選択肢イは期間限定値引きを見直しローコストオペレーションで恒常的な低価格を実現する施策の説明である。選択肢エは直近購買日・購買頻度・購買金額の3要素(RFM分析)による顧客分析手法の説明であり、FSPで集めたデータの分析手法の一つではあるが、FSPそのものの定義ではない。</p>","mnemonic":""},{"id":158,"year":2018,"period":"平成30年度秋期","num":9,"cat":"ストラテジ系","field":"スキミングプライシング","summary":"スキミングプライシング：平成30年度秋期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>スキミングプライシングの説明はどれか。</p>","choices":[{"label":"ア","html":"顧客に適切な価格であると認識させ,購買意欲を高める価格を設定する手法"},{"label":"イ","html":"市場シェアを獲得するために,製品投入の初期段階で低価格を設定する手法"},{"label":"ウ","html":"先行者利益を獲得するために,製品投入の初期段階で高価格を設定する手法"},{"label":"エ","html":"同一製品に市場セグメントの特性に合わせて,異なる価格を設定する手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スキミングプライシング(上澄み吸収価格戦略)は、新製品の投入初期段階であえて高い価格を設定し、価格に敏感でないイノベーターやアーリーアダプターなど「上澄み」の顧客層から先に利益を獲得したうえで、需要の減少や競合の参入に応じて段階的に価格を引き下げていく価格戦略である。この戦略の狙いは、先行者利益の確保と開発費の早期回収にあり、技術革新が速く製品ライフサイクルが短い業界や、強いブランド力・独自性を持つ製品で有効とされる。選択肢ウはこの「先行者利益の獲得」と「初期段階での高価格設定」という要点を正確に表しており正解である。選択肢イは、逆に市場シェア獲得のため投入初期に低価格を設定する「市場浸透価格戦略(ペネトレーションプライシング)」の説明であり、スキミングプライシングとは対になる戦略である。選択肢アは心理的な適正価格設定、選択肢エは同一製品を市場セグメントごとに異なる価格で販売する価格差別化の説明であり、いずれもスキミングプライシングとは異なる。</p>","mnemonic":""},{"id":159,"year":2018,"period":"平成30年度秋期","num":10,"cat":"ストラテジ系","field":"セグメンテーション変数","summary":"セグメンテーション変数：平成30年度秋期 問10","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>消費者市場のセグメンテーション変数のうち,人口統計的変数はどれか。</p>","choices":[{"label":"ア","html":"使用頻度,ロイヤルティ"},{"label":"イ","html":"都市規模,人口密度"},{"label":"ウ","html":"年齢,職業"},{"label":"エ","html":"パーソナリティ,ライフスタイル"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>消費者市場のセグメンテーション変数は、一般に地理的変数、人口統計的変数(デモグラフィック変数)、心理的変数(サイコグラフィック変数)、行動変数の4つに大別される。人口統計的変数は、年齢、性別、家族構成、所得、職業、学歴といった客観的に把握できる属性で市場を区分するものであり、最も基本的で測定しやすいセグメンテーション軸として広く用いられている。選択肢ウの「年齢,職業」はこの人口統計的変数そのものであり正解である。選択肢イの「都市規模,人口密度」は地域や居住地に関する地理的変数、選択肢エの「パーソナリティ,ライフスタイル」は価値観や性格といった内面的要素に基づく心理的変数に該当する。選択肢アの「使用頻度,ロイヤルティ」は、製品やサービスの利用パターン・購買行動に基づく行動変数に分類される。</p>","mnemonic":""},{"id":160,"year":2018,"period":"平成30年度秋期","num":11,"cat":"ストラテジ系","field":"ラインエクステンション","summary":"ラインエクステンション：平成30年度秋期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>商品のブランド戦略の一つであるラインエクステンションを説明したものはどれか。</p>","choices":[{"label":"ア","html":"売上の伸びが鈍くなってきたときなどに,デザインや容量を変更した商品を導入し,ブランド力を高める戦略"},{"label":"イ","html":"関連分野において知名度の高い他社ブランドと提携し,自社商品のブランド力を高める戦略"},{"label":"ウ","html":"実績のある商品と同じカテゴリにシリーズ商品を導入し,同一ブランド名での品ぞろえを豊富にする戦略"},{"label":"エ","html":"消費者の間に浸透し,市場での地位を確立しているブランド名で,現行商品とは異なるカテゴリに参入する戦略"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ラインエクステンション(ライン拡張)とは、既存の確立されたブランドと同じ製品カテゴリの中で、味・色・容量・成分などのバリエーションを増やしたシリーズ商品を投入し、同一ブランド名のもとで品ぞろえを充実させるブランド戦略である。既存ブランドの持つ知名度や信頼を活用しながら、新たなセグメントや用途に対応できる点がメリットとされる。選択肢ウはこの「同じカテゴリでのシリーズ商品の導入」と「同一ブランド名での品ぞろえ拡充」という定義そのものであり正解である。選択肢エは、既に確立したブランド名を使って既存とは異なる製品カテゴリに参入する「ブランドエクステンション(ブランド拡張、カテゴリー拡張)」の説明であり、同一カテゴリ内かどうかという点でラインエクステンションと区別される。選択肢イは他社ブランドと提携する「コ・ブランディング」に近い説明であり、選択肢アはデザインや容量変更による既存商品のリニューアル・ブランド刷新の説明であって、いずれもラインエクステンションの定義とは異なる。</p>","mnemonic":""},{"id":161,"year":2018,"period":"平成30年度秋期","num":12,"cat":"ストラテジ系","field":"キャズム理論","summary":"キャズム理論：平成30年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ジェフリー・A・ムーアはキャズム理論において,利用者の行動様式に変化を強いるハイテク製品では,イノベータ理論の五つの採用者区分の間に断絶があると主張し,その中でも特に乗り越えるのが困難な深く大きな溝を「キャズム」と呼んでいる。「キャズム」が存在する場所はどれか。</p>","choices":[{"label":"ア","html":"イノベータとアーリーアダプタの間"},{"label":"イ","html":"アーリーアダプタとアーリーマジョリティの間"},{"label":"ウ","html":"アーリーマジョリティとレイトマジョリティの間"},{"label":"エ","html":"レイトマジョリティとラガードの間"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>キャズム理論は、経営コンサルタントのジェフリー・A・ムーアが著書『キャズム』で提唱した、ハイテク製品の普及に関する理論である。エベレット・ロジャースのイノベータ理論が示す5つの採用者区分(イノベータ、アーリーアダプタ、アーリーマジョリティ、レイトマジョリティ、ラガード)のうち、「新しさ」を重視して製品を採用するイノベータ・アーリーアダプタからなる初期市場と、「周囲の安心感」や「費用対効果」を重視するアーリーマジョリティ以降のメインストリーム市場との間には、購入動機の質的な違いに起因する深く大きな溝(キャズム)が存在するとムーアは主張した。したがって、アーリーアダプタとアーリーマジョリティの間にキャズムが存在するとする選択肢イが正解である。この溝を越えられずに市場拡大に失敗するハイテク製品は多いとされ、越えるためにはニッチ市場を絞って攻略する戦略などが有効とされる。選択肢ア・ウ・エは、いずれもキャズムが存在するとされる区分とは異なる隣接区分の組合せであり誤りである。</p>","mnemonic":""},{"id":162,"year":2018,"period":"平成30年度秋期","num":13,"cat":"マネジメント系","field":"ダブルビン方式","summary":"ダブルビン方式：平成30年度秋期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ダブルビン方式の特徴はどれか。</p>","choices":[{"label":"ア","html":"単価が高く体積が大きい又は需要変動が大きい重点管理品に適する。"},{"label":"イ","html":"発注間隔が一定で発注量が増減する。"},{"label":"ウ","html":"発注点と発注量が等しく,都度の在庫調査の必要がない。"},{"label":"エ","html":"発注点と発注量は調達リードタイムに関係しない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ダブルビン方式(二棚法、ツービン方式)は、在庫を2つの容器(ビン)に分けて管理する定量発注方式の一種であり、片方のビンを使い切った時点(空になった時点)がそのまま発注点となり、その時点でもう一方の容器の分だけ残っている在庫で発注リードタイムをしのぐ仕組みである。発注量は空になったビンを満たすための一定量(通常は1ビン分)であり、2つのビンの容量を等しく設定すれば、発注点となる残存在庫量(=もう一方のビンの容量)と発注量は等しくなる。また、ビンが空になったかどうかを目視で確認できればよいため、継続的な在庫の数量調査(実地棚卸のような都度の確認作業)を必要としない点が大きな特徴であり、選択肢ウが正解である。選択肢アは、単価が高く需要変動が大きい重点管理品向けという記述だが、ダブルビン方式はむしろボルト・ナットなど単価が低く管理の手間を省きたい非重点管理品に適した簡易な方式であるため誤り。選択肢イは発注間隔を固定し発注量を変動させる定期発注方式の特徴であり、選択肢エは発注点が調達リードタイム中の需要と無関係とする点が誤りで、実際には発注点はリードタイム中の需要量をカバーできる水準に設定される。</p>","mnemonic":""},{"id":163,"year":2018,"period":"平成30年度秋期","num":14,"cat":"マネジメント系","field":"SECIモデル","summary":"SECIモデル：平成30年度秋期 問14","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>知識創造プロセス(SECIモデル)において,表出化に該当するものはどれか。</p>","choices":[{"label":"ア","html":"顧客への対応の仕方を,顧客の業種別にマニュアル化する。"},{"label":"イ","html":"顧客訪問に新入社員を同行させ,対応の方法を目で見て体得させる。"},{"label":"ウ","html":"製品操作マニュアルと業務マニュアルから,運用マニュアルを作成する。"},{"label":"エ","html":"マニュアルに記載された方法を実践し,スキルを習得する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SECIモデルは、野中郁次郎氏と竹内弘高氏が提唱した知識創造理論であり、暗黙知と形式知が共同化(Socialization)・表出化(Externalization)・連結化(Combination)・内面化(Internalization)の4プロセスを螺旋状に繰り返すことで、組織的に新たな知識が創造されるとするモデルである。このうち「表出化」は、個人が経験を通じて持つ暗黙知を、対話や比喩などを通じて言語化・図式化し、マニュアルや文書といった形式知に変換するプロセスを指す。選択肢アの「顧客への対応の仕方を,顧客の業種別にマニュアル化する」は、現場で培われた暗黙の対応ノウハウを明文化されたマニュアルという形式知に変換する行為であり、まさに表出化に該当するため正解である。選択肢イは、新入社員が訪問に同行し目で見て体得する行為であり、暗黙知を暗黙知のまま共有する「共同化」に該当する。選択肢ウは複数のマニュアル(形式知)を組み合わせて新たなマニュアルを作成する「連結化」、選択肢エはマニュアル(形式知)を実践してスキル(暗黙知)として体得する「内面化」にそれぞれ該当する。</p>","mnemonic":""},{"id":164,"year":2018,"period":"平成30年度秋期","num":15,"cat":"ストラテジ系","field":"TLO法","summary":"TLO法：平成30年度秋期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>TLO(Technology Licensing Organization)法に基づき,承認又は認定された事業者の役割として,適切なものはどれか。</p>","choices":[{"label":"ア","html":"企業からの委託研究,又は共同研究を受け入れる窓口として,企業と大学との調整を行う。"},{"label":"イ","html":"研究者からの応募に基づき,補助金を支給して先進的な研究を発展させる。"},{"label":"ウ","html":"大学の研究成果の特許化及び企業への技術移転の支援を行い,産学の仲介役を果たす。"},{"label":"エ","html":"民間企業が保有する休眠特許を発掘し,他企業にライセンスを供与して活用を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TLO法(大学等技術移転促進法)は1998年に施行された法律で、大学などの研究成果を特許化した上で民間事業者へ技術移転し、その対価を大学の研究活動に還元する仕組みを後押しするものである。この法律に基づき承認・認定を受けた事業者(承認TLO)は、大学の研究成果について特許出願などの特許化を支援するとともに、企業への実施許諾(ライセンス供与)などの技術移転活動を行い、大学(研究)と産業界とを橋渡しする仲介役としての役割を担う。実際に、早稲田大学の承認TLOが年間百件を超える特許出願や数十件規模の技術移転を行っているように、承認TLOの中心的な役割は大学発の研究成果の特許化支援と技術移転の仲介であり、選択肢ウが正解である。選択肢アは企業の委託研究・共同研究の受入窓口としての大学と企業の調整を行う産学連携窓口の役割に近く、TLOそのものの定義とは異なる。選択肢イは研究者への補助金支給による研究振興機関の役割、選択肢エは大学ではなく民間企業が保有する休眠特許の発掘・ライセンス供与を行う特許流通機関の役割であり、いずれも大学の研究成果を対象とするTLOの説明としては不適切である。</p>","mnemonic":""},{"id":165,"year":2018,"period":"平成30年度秋期","num":16,"cat":"ストラテジ系","field":"XBRL","summary":"XBRL：平成30年度秋期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>XBRLに関する記述として,適切なものはどれか。</p>","choices":[{"label":"ア","html":"XBRLによって,決算などに伴う集計,法定書類の作成を自動化することを容易にする。"},{"label":"イ","html":"XBRLによって表現される勘定科目体系は,会計基準ごとに固定であり,個別に定義することはできない。"},{"label":"ウ","html":"XBRLは,企業外部向けの財務会計情報の開示に利用できるが,企業内部向けの管理会計情報としては利用できない。"},{"label":"エ","html":"XBRLは,企業の財務諸表の情報を複数企業間において交換するための国際的なEDI標準である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>XBRL(拡張可能な事業報告用言語)は、財務諸表などの勘定科目やその数値を標準化されたタグを用いて記述するXMLベースの言語であり、タクソノミ(勘定科目などの語彙体系)とインスタンス(個別の数値データ)から構成される。タグ付けされたデータは企業・会計基準をまたいでコンピュータが機械的に読み取り、集計・加工できるため、決算処理に伴う集計作業や有価証券報告書などの法定書類の作成を自動化しやすくする効果があり、選択肢アが正解である。選択肢イは、XBRLの勘定科目体系(タクソノミ)が会計基準ごとに固定で個別定義できないとする点が誤りで、実際にはEDINETタクソノミのような共通タクソノミを基礎としつつ、企業や部門が必要に応じて独自の拡張タクソノミを作成・運用できる点がXBRLの大きな特徴である。選択肢ウは、XBRLが企業外部向けの財務会計情報にしか使えないとする点が誤りで、XBRL GL(Global Ledger)のように企業内部の管理会計・仕訳データの表現にも応用が広がっている。選択肢エは、XBRLを複数企業間の財務諸表交換のための国際的なEDI標準と限定している点が誤りで、XBRLは主に規制当局・投資家向けの財務報告の電子化・標準化を目的とした言語であり、EDI(電子データ交換)そのものの標準規格というわけではない。</p>","mnemonic":""},{"id":166,"year":2018,"period":"平成30年度秋期","num":17,"cat":"マネジメント系","field":"TOC","summary":"TOC：平成30年度秋期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>TOCの特徴はどれか。</p>","choices":[{"label":"ア","html":"個々の工程を個別に最適化することによって,生産工程全体を最適化する。"},{"label":"イ","html":"市場の需要が供給能力を下回っている場合に有効な理論である。"},{"label":"ウ","html":"スループット(=売上高-資材費)の増大を最重要視する。"},{"label":"エ","html":"生産プロセス改善のための総投資額を制約条件として確立された理論である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TOC(制約理論、Theory of Constraints)は、イスラエルの物理学者エリヤフ・ゴールドラット博士が提唱した生産管理・経営改善の理論であり、小説形式のビジネス書『ザ・ゴール』によって広く知られるようになった。TOCの中核は、工程全体の成果(アウトプット)は最も処理能力の低いボトルネック工程によって上限が決まるという考え方であり、ボトルネックでない工程をいくら個別に最適化しても全体のスループットは増えず、ボトルネック前に仕掛品が溜まるだけだとされる。そのため、TOCでは全体最適化の指標として、売上高から資材費(真の変動費)を差し引いたスループットの増大を最も重視し、ボトルネック工程の能力向上やその前後の工程のペース調整に注力する「スループット会計」の考え方を取る。選択肢ウはこのスループット重視の考え方を正確に表しており正解である。選択肢アは個々の工程を個別最適化することで全体最適化を図るとしているが、これはTOCが否定する「部分最適の積み上げ」の発想であり誤り。選択肢イは需要が供給能力を下回る場合に有効だとしているが、TOCはむしろ内部のボトルネック(制約)に着目する理論であり需要と供給の大小関係で限定されるものではなく、選択肢エは総投資額を制約条件とする理論だとしているが、TOCの制約はあくまで工程の処理能力(ボトルネック)であり総投資額ではないため、いずれも誤りである。</p>","mnemonic":""},{"id":167,"year":2018,"period":"平成30年度秋期","num":18,"cat":"マネジメント系","field":"ティアダウン","summary":"ティアダウン：平成30年度秋期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ティアダウンの説明はどれか。</p>","choices":[{"label":"ア","html":"市場の要求である\"要求品質\"と,提供する側の技術である\"技術特性\"の2元表を作成し,顧客の要求を満たすための機能を明確にする手法"},{"label":"イ","html":"整理・整頓することで事故やけがの防止や作業効率の低下を防ぐ活動"},{"label":"ウ","html":"他社の製品を分解し,分析して自社商品と比較することによって,コストや性能面でより高い競争力をもった製品を開発する手法"},{"label":"エ","html":"物作りの仕組みの中の無駄を,現場の知恵を出し合って排除する活動"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ティアダウンとは、自社製品だけでなく競合他社の製品を実際に分解し、部品構成・材質・製造方法・コストなどを詳細に分析して自社製品と比較することで、コストや性能の面でより高い競争力を持つ製品を開発するための手法である。原価企画やVE(バリューエンジニアリング)の一環として、技術部門だけでなく商品企画・マーケティング・営業など複数部門が連携して実施されることも多く、あるべきコスト(should-cost)の見積もりや設計改善の提案に活用される。選択肢ウはこの「他社製品の分解・分析による自社製品との比較」と「競争力の高い製品開発」という要点を的確に表しており正解である。選択肢アは、市場が求める品質(要求品質)と技術特性を対応させる2元表を用いる品質機能展開(QFD)の説明であり、ティアダウンとは異なる手法である。選択肢イは整理整頓によって事故・けがや作業効率低下を防ぐ5S活動(特に整頓)の説明、選択肢エは現場の知恵を結集してものづくりの無駄を排除する改善(カイゼン)活動の説明であり、いずれもティアダウンの定義には当てはまらない。</p>","mnemonic":""},{"id":168,"year":2018,"period":"平成30年度秋期","num":19,"cat":"ストラテジ系","field":"コンティンジェンシー理論","summary":"コンティンジェンシー理論：平成30年度秋期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>リーダシップのコンティンジェンシー理論の説明はどれか。</p>","choices":[{"label":"ア","html":"権限行使と命令統制による労務管理を批判し,目標管理制度や経営参加制度などによる動機付けが有効だとしたもの"},{"label":"イ","html":"恒常的に成果に結び付けることができる個人の行動や思考特性をモデル化し,これを評価や育成の基準にしたもの"},{"label":"ウ","html":"人間の基本的欲求を低次から,生理的欲求,安全の欲求,所属と愛の欲求,承認の欲求,自己実現の欲求と階層化したもの"},{"label":"エ","html":"唯一最適な部下の指導・育成のスタイルは存在しない,という考え方に基づいて,リーダの特性や行動と状況の関係を分析したもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>リーダーシップのコンティンジェンシー理論(状況適合理論)は、フレッド・フィードラーらによって提唱された理論で、あらゆる状況に通用する唯一最適なリーダーシップのスタイルは存在せず、リーダーの特性・行動と、リーダーとメンバーの関係・課題構造の明確さ・リーダーの職位権限といった状況要因との適合度によって、有効なリーダーシップのあり方が変わるとする考え方である。この理論はその後、状況に応じてリーダー自身が行動を変えるべきだとするハーシー&ブランチャードのSL理論(状況対応型リーダーシップ)など、後続の状況適合理論へと発展していった。選択肢エはこの「唯一最適なスタイルは存在しない」という前提と「リーダーの特性・行動と状況の関係の分析」という要点を正確に表しており正解である。選択肢アは権限行使と命令統制による労務管理を批判し目標管理制度や経営参加制度による動機付けを重視する、マグレガーのY理論的な人間関係論の説明であり、選択肢ウはマズローの欲求五段階説の説明である。選択肢イは成果に結び付く個人の行動・思考特性をモデル化し評価・育成基準とするコンピテンシーモデルの説明であり、いずれもコンティンジェンシー理論とは異なる概念である。</p>","mnemonic":""},{"id":169,"year":2018,"period":"平成30年度秋期","num":20,"cat":"マネジメント系","field":"ワークデザイン法","summary":"ワークデザイン法：平成30年度秋期 問20","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>問題解決に当たって,現実にとらわれることなく理想的なシステムを想定した上で,次に,理想との比較から現状の問題点を洗い出し,具体的な改善案を策定する手法はどれか。</p>","choices":[{"label":"ア","html":"系統図法"},{"label":"イ","html":"親和図法"},{"label":"ウ","html":"線形計画法"},{"label":"エ","html":"ワークデザイン法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ワークデザイン法は、米国ウィスコンシン大学のナドラー博士が考案した問題解決・業務設計の手法であり、現状の制約にとらわれず、まず目的を明確にした上で理想的なシステム(理想案)を描き、そこから現実的に実現可能なシステムへと段階的に収束させていく「演繹型」のアプローチを特徴とする。現状の問題点を部分的に改善する積み上げ型の発想とは逆に、理想像との比較を通じて現状の問題点を洗い出し、具体的な改善案を策定する点が特徴であり、後にナドラー博士自身によって「ブレークスルー思考」として体系化された。設問の「現実にとらわれることなく理想的なシステムを想定した上で、理想との比較から現状の問題点を洗い出し、具体的な改善案を策定する手法」という説明はこのワークデザイン法の定義そのものであり、選択肢エが正解である。選択肢アの系統図法と選択肢イの親和図法は、言語データを図解して問題を整理する新QC七つ道具の手法であり、理想システムとの比較という発想ではない。選択肢ウの線形計画法は、制約条件の下で目的関数を最大化・最小化する数理最適化の手法であり、理想システムの構想とは異なるアプローチである。</p>","mnemonic":""},{"id":170,"year":2018,"period":"平成30年度秋期","num":21,"cat":"ストラテジ系","field":"在庫補充量","summary":"在庫補充量：平成30年度秋期 問21","correct":"ア","result":"","formula":"在庫補充量=翌週販売予測量×1.1－現在庫量、翌週販売予測量=(先週実績+今週実績)/2","howto":"(C[n-1]+C[n])/2で翌週予測を出し、安全在庫10%分を含めて1.1倍し、現在庫B[n]を引く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>X社では、(1)〜(4)に示す算定方式で在庫補充量を決定している。第n週の週末時点での在庫量をB[n]、第n週の販売量をC[n]としたとき、第n週の週末に発注する在庫補充量の算出式はどれか。ここで、nは3以上とする。</p><p>〔在庫補充量の算定方式〕</p><ol><li>週末ごとに在庫補充量を算出し、発注を行う。在庫は翌週の月曜日に補充される。</li><li>在庫補充量は、翌週の販売予測量から現在の在庫量を引き、安全在庫量を加えて算出する。</li><li>翌週の販売予測量は、先週の販売量と今週の販売量の平均値とする。</li><li>安全在庫量は、翌週の販売予測量の10%とする。</li></ol>","choices":[{"label":"ア","html":"(C[n-1]+C[n])/2×1.1－B[n]"},{"label":"イ","html":"(C[n-1]+C[n])/2×1.1－B[n-1]"},{"label":"ウ","html":"(C[n-1]+C[n])/2+C[n]×0.1－B[n]"},{"label":"エ","html":"(C[n-2]+C[n-1])/2+C[n]×0.1－B[n]"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>第n週の週末時点で、先週(n-1週)の販売量はC[n-1]、今週(n週)の販売量はC[n]である。</p><p>(3)より、翌週の販売予測量=(C[n-1]+C[n])/2</p><p>(4)より、安全在庫量=翌週の販売予測量の10%=(C[n-1]+C[n])/2×0.1</p><p>(2)より、在庫補充量=翌週の販売予測量－現在の在庫量(B[n])＋安全在庫量</p><p>=(C[n-1]+C[n])/2－B[n]+(C[n-1]+C[n])/2×0.1</p><p>=(C[n-1]+C[n])/2×(1+0.1)－B[n]</p><p>=(C[n-1]+C[n])/2×1.1－B[n]</p><p>よって正解はア。</p>","mnemonic":"「平均を1割増しにして、引くのは今のBだけ」―先週と今週の平均を1.1倍するのが安全在庫込みの発注量、差し引くBは必ず最新のB[n]。"},{"id":171,"year":2018,"period":"平成30年度秋期","num":22,"cat":"ストラテジ系","field":"連結総利益率","summary":"連結総利益率：平成30年度秋期 問22","correct":"ウ","result":"","formula":"連結売上高総利益率=連結売上総利益÷連結売上高×100、グループ内取引は売上高・売上原価の双方から相殺消去","howto":"A社総売上(4,000+800)とB社売上(1,000)を合算し内部取引800を売上高・売上原価の両方から消去、売上高5,000・原価3,000・利益2,000で40%","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>連結売上高総利益率は何%か。ここで、B社はA社の100%子会社で、仕入れは全て親会社からであり、売上は全て親会社以外である。また、期首、期末とも在庫はない。</p><table><tr><th colspan=\"2\">A社損益計算書</th></tr><tr><td>売上高</td><td>4,000</td></tr><tr><td>子会社売上高</td><td>800</td></tr><tr><td>売上原価</td><td>3,000</td></tr><tr><td>売上総利益</td><td>1,800</td></tr></table><table><tr><th colspan=\"2\">B社損益計算書</th></tr><tr><td>売上高</td><td>1,000</td></tr><tr><td>売上原価</td><td>800</td></tr><tr><td>売上総利益</td><td>200</td></tr></table>","choices":[{"label":"ア","html":"34"},{"label":"イ","html":"38"},{"label":"ウ","html":"40"},{"label":"エ","html":"56"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A社の売上高4,000は親会社以外(外部)への売上であり、子会社売上高800はB社への売上(グループ内取引)である。両者を合計したA社の総売上高は4,800となり、これから売上原価3,000を差し引くと売上総利益1,800となって表の数値と一致する。</p><p>B社は仕入れを全てA社から行っており(売上原価800はA社からの仕入高)、売上1,000は全て外部向けである。</p><p>連結上は、A社のB社向け売上(800)とB社の仕入(売上原価800)が企業集団内部の取引であるため、連結売上高・連結売上原価の双方から800ずつ相殺消去する。</p><p>連結売上高=A社総売上高4,800+B社売上高1,000－内部取引800=5,000</p><p>連結売上原価=A社売上原価3,000+B社売上原価800－内部取引800=3,000</p><p>連結売上総利益=5,000－3,000=2,000</p><p>連結売上高総利益率=2,000÷5,000×100=40%</p><p>よって正解はウ。</p>","mnemonic":"「ハッピャク(800)を売上からも原価からも消す」―親子間の800億円を両側から相殺すれば売上5,000・原価3,000・利益2,000で、きれいに40%そろう。"},{"id":172,"year":2018,"period":"平成30年度秋期","num":23,"cat":"ストラテジ系","field":"電子計算機使用詐欺罪","summary":"電子計算機使用詐欺罪：平成30年度秋期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>刑法の電子計算機使用詐欺罪に該当する行為はどれか。</p>","choices":[{"label":"ア","html":"いわゆるねずみ講方式による取引形態のWebページを開設する。"},{"label":"イ","html":"インターネット上に,実際よりも良品と誤認させる商品カタログを掲載し,粗悪な商品を販売する。"},{"label":"ウ","html":"インターネットを経由して銀行のシステムに虚偽の情報を与え,不正な振込や送金をさせる。"},{"label":"エ","html":"企業のWebページを不正な手段によって改変し,その企業の信用を傷つける情報を流す。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>電子計算機使用詐欺罪(刑法246条の2)は、「人の事務処理に使用する電子計算機に虚偽の情報若しくは不正な指令を与えて財産権の得喪・変更に係る不実の電磁的記録を作る行為」、または「財産権の得喪・変更に係る虚偽の電磁的記録を人の事務処理の用に供する行為」によって財産上不法の利益を得る、または他人に得させる罪であり、人を欺く従来の詐欺罪(刑法246条)が人間を対象とするのに対し、コンピュータ(電子計算機)を対象とする点に特徴がある。選択肢ウの「インターネットを経由して銀行のシステムに虚偽の情報を与え,不正な振込や送金をさせる」行為は、銀行の事務処理用コンピュータに虚偽の情報を入力して不実の電磁的記録(預金残高や振込記録)を作出させ財産上の利益を得るものであり、電子計算機使用詐欺罪の典型的な構成要件に該当するため正解である。選択肢アのねずみ講方式の取引は無限連鎖講の防止に関する法律違反などの問題であり、選択肢イの誇大な商品カタログによる粗悪品の販売は、人を欺いて財物を交付させる通常の詐欺罪や特定商取引法・景品表示法上の問題に当たり、いずれも「人」を欺く行為であって電子計算機を対象とするものではない。選択肢エの企業Webページの不正な改ざんによる信用毀損は、不正アクセス禁止法違反や刑法上の信用毀損罪・業務妨害罪に該当する行為であり、財産権の得喪・変更に係る不実の電磁的記録を作る行為ではないため電子計算機使用詐欺罪には当たらない。</p>","mnemonic":""},{"id":173,"year":2018,"period":"平成30年度秋期","num":24,"cat":"テクノロジ系","field":"格納型XSS","summary":"格納型XSS：平成30年度秋期 問24","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai
