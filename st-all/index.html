-kaiotu/2018h30.html","q":"<p>格納型クロスサイトスクリプティング(Stored XSS又はPersistent XSS)攻撃に該当するものはどれか。</p>","choices":[{"label":"ア","html":"Webサイト上の掲示板に攻撃用スクリプトを忍ばせた書込みを攻撃者が行い,その後に当該掲示板を閲覧した利用者のWebブラウザで,攻撃用スクリプトが実行された。"},{"label":"イ","html":"Webブラウザへの応答を生成する処理に脆弱性のあるWebサイトに対して,不正なJavaScriptコードを含むリクエストを送信するリンクを攻撃者が用意し,そのリンクを利用者がクリックするように仕向けた。"},{"label":"ウ","html":"攻撃者が,乗っ取った複数のPC上でスクリプトを実行して大量のリクエストを攻撃対象のWebサイトに送り付け,サービス不能状態にした。"},{"label":"エ","html":"攻撃者がスクリプトを使って,送信元IPアドレスを攻撃対象のWebサイトのIPアドレスに偽装した大量のDNSリクエストを多数のDNSサーバに送信することによって,大量のDNSレスポンスを攻撃対象のWebサイトに送り付けるようにした。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クロスサイトスクリプティング(XSS)は、脆弱性のあるWebサイトを悪用して、攻撃者が用意した不正なスクリプトを利用者のWebブラウザ上で実行させる攻撃であり、代表的な分類として反射型(Reflected XSS)と格納型(Stored XSS、Persistent XSS)がある。格納型XSSは、攻撃者が掲示板やコメント欄などの入力フォームにあらかじめ不正なスクリプトを埋め込んだ書き込みを行い、それがWebサーバ側に保存(格納)されることで、その後そのページを閲覧した不特定多数の利用者のブラウザ上でスクリプトが実行されてしまう攻撃であり、被害者がリンクをクリックするなどの誘導操作を必要とせずページを閲覧するだけで被害を受けるため拡散力が大きく、より危険性が高いとされる。選択肢アはこの「掲示板への攻撃用スクリプトの書込み」と「その後の閲覧による実行」という格納型XSSの典型的な流れを正確に説明しており正解である。選択肢イは、攻撃者が用意した不正なリクエストを含むリンクを被害者にクリックさせることでスクリプトが実行される反射型XSSの説明であり、格納型とは異なりスクリプトはサーバに保存されず都度の攻撃リクエストに含まれる。選択肢ウは乗っ取った複数PCから大量のリクエストを送り付けるDDoS(分散型サービス妨害)攻撃、選択肢エは送信元IPアドレスを偽装した大量のDNSリクエストを利用するDNSリフレクション(DNSアンプ)攻撃の説明であり、いずれもXSS攻撃ではない。</p>","mnemonic":""},{"id":174,"year":2018,"period":"平成30年度秋期","num":25,"cat":"テクノロジ系","field":"リスク回避","summary":"リスク回避：平成30年度秋期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>個人情報の漏えいリスクに関するリスク対応のうち,リスク回避に該当するものはどれか。</p>","choices":[{"label":"ア","html":"個人情報の重要性と対策費用を勘案し,あえて対策をとらない。"},{"label":"イ","html":"個人情報の保管場所に外部の者が侵入できないように,入退室をより厳重に管理する。"},{"label":"ウ","html":"個人情報を含む情報資産を外部のデータセンタで保管する。"},{"label":"エ","html":"取得済みの個人情報を消去し,新たな取得を禁止する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>情報セキュリティにおけるリスク対応は、一般にリスク回避、リスク低減、リスク移転、リスク保有(受容)の4つに分類される。このうちリスク回避は、リスクの発生要因となる活動そのものをやめることで、リスクとの関わりを完全に断つ対応であり、他の対応がリスクを残したまま発生確率や影響を抑えたり第三者に転嫁したりするのに対し、リスクの源そのものを除去する点が特徴である。選択肢エの「取得済みの個人情報を消去し,新たな取得を禁止する」は、個人情報を保有・取得するという、漏えいリスクの発生源となる活動自体をやめるものであり、まさにリスク回避に該当するため正解である。選択肢イの「入退室管理の厳重化」は、漏えいの発生確率を下げる対策でありリスク低減に該当し、選択肢ウの「外部データセンタでの保管」は、保管業務を外部事業者に委ねることで影響を第三者に移すリスク移転に該当する。選択肢アの「対策費用を勘案してあえて対策をとらない」は、リスクをそのまま受け入れるリスク保有(リスク受容)に該当し、いずれもリスクの発生源自体を断つリスク回避とは異なる対応である。</p>","mnemonic":""},{"id":175,"year":2017,"period":"平成29年度秋期","num":1,"cat":"ストラテジ系","field":"共通フレーム","summary":"共通フレーム：平成29年度秋期 問1","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>共通フレーム2013によれば，システム化構想の立案プロセスで実施するタスクはどれか。</p>","choices":[{"label":"ア","html":"市場，競争相手，取引先，法規制，社会情勢などの事業環境，業務環境を分析し，事業目標，業務目標との関係を明確にする。"},{"label":"イ","html":"システムのライフサイクルの全期間を通して，利害関係者を識別する。"},{"label":"ウ","html":"人間の能力及びスキルの限界を考慮して，利用者とシステムとの間の相互作用を識別する。"},{"label":"エ","html":"利害関係者の要件が正確に表現されていることを，利害関係者とともに確立する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>共通フレーム2013(SLCP-JCF2013)における「システム化構想の立案プロセス」は企画プロセスに属し、経営戦略・事業戦略に基づいて情報システム化の方向性を定める最上流の工程です。その代表的なタスクが「事業環境・業務環境の調査分析」であり、市場、競合、取引先、法規制、社会情勢などの外部環境を分析し、事業目標・業務目標との関係を明確化することが求められます。これに合致する選択肢アが正解です。一方、イの利害関係者の識別、ウの人間の能力・スキルを踏まえた相互作用の識別、エの利害関係者要件の確認はいずれも、構想段階よりも後工程にあたる「要件定義プロセス」で実施されるタスクであり、具体的な対象システムの要件や利害関係者を詳細化する段階の作業です。システム化構想の段階ではまだそこまで具体化されておらず、より上位の経営・事業環境の分析が中心になる点が、この設問のポイントです。</p>","mnemonic":""},{"id":176,"year":2017,"period":"平成29年度秋期","num":2,"cat":"ストラテジ系","field":"目標復旧時間","summary":"目標復旧時間：平成29年度秋期 問2","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>BCP策定に際して，目標復旧時間となるものはどれか。</p>","choices":[{"label":"ア","html":"災害時に企業活動を継続するために，最低限必要な業務を復旧するまでの時間"},{"label":"イ","html":"災害時に代替手段で運用していた業務が，完全に元の状態に戻るまでの時間"},{"label":"ウ","html":"障害発生後のシステムの縮退運用を継続することが許容される時間"},{"label":"エ","html":"対策本部の立上げや判定会議の時間を除く，待機系への切替えに要する時間"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RTO(Recovery Time Objective、目標復旧時間)はBCP(事業継続計画)の中核をなす指標の一つで、災害や事故によって停止した重要業務を、どのくらいの時間内に許容できるレベルまで復旧させるかという目標時間を指します。RTOの考え方で重要なのは「完全復旧」ではなく、企業活動を継続するために最低限必要な業務機能を復旧させるまでの時間という点であり、これに合致する選択肢アが正解です。イの「完全に元の状態に戻るまでの時間」は、RTOで定義される最低限の業務復旧よりもさらに先の、完全復旧段階を指しており定義がずれます。ウはシステムの縮退運用が許容される時間であり、RTOというより業務影響許容時間(MTPD)に近い別概念、エは待機系への切替えに要する技術的な時間に過ぎず、事業・業務の観点から定める目標復旧時間とは異なります。BCP策定では、業種・業務ごとにRTOを定め、それに応じて復旧体制やバックアップ方式を設計することになります。</p>","mnemonic":""},{"id":177,"year":2017,"period":"平成29年度秋期","num":3,"cat":"ストラテジ系","field":"システム管理基準","summary":"システム管理基準：平成29年度秋期 問3","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>システム管理基準（平成16年）によれば，情報戦略における全体最適化計画の策定で実施することはどれか。</p>","choices":[{"label":"ア","html":"情報システムの目的を達成する実現可能な代替案を検討する。"},{"label":"イ","html":"投資効果及びリスク算定の方法を明確にする。"},{"label":"ウ","html":"パッケージソフトウェアとユーザニーズとの適合性を検討する。"},{"label":"エ","html":"ユーザ部門及び情報システム部門の役割分担を明確にする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム管理基準は経済産業省が策定した、情報システムの企画・開発・運用・保守全般にわたる管理基準で、平成16年には全面改訂が行われています。この基準における「全体最適化計画の策定」は情報戦略のもっとも上流に位置し、全社レベルで情報システム化の方向性と評価の枠組みを定める段階です。この段階で先に明確にすべきなのは、個別案件の実現可能性や適合性そのものではなく、投資効果やリスクをどのような方法で算定するかという、計画全体を評価するための物差しであり、これに合致する選択肢イが正解です。アの実現可能な代替案の検討やウのパッケージソフトウェアとユーザニーズとの適合性検討は、全体最適化計画を踏まえて行われる個別システムの企画・開発段階に近い内容、エの部門間の役割分担の明確化は体制整備にかかわる事項であり、いずれも全体最適化計画そのものの策定段階より後工程、あるいは別の観点の作業にあたります。この問題は原典の条文そのものを直接確認できる一次資料が検索では得られなかったため、システム管理基準の企画フェーズにおける一般的な段階構成（全体最適化計画→個別最適化計画→開発）に基づいて判断しています。</p>","mnemonic":""},{"id":178,"year":2017,"period":"平成29年度秋期","num":4,"cat":"ストラテジ系","field":"ROI","summary":"ROI：平成29年度秋期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>IT投資効果の評価に用いられる手法のうち，ROIによるものはどれか。</p>","choices":[{"label":"ア","html":"一定期間のキャッシュフローを，将来発生するものは割引率を設定して現在価値に換算した上で，キャッシュフローの合計値を求め，その大小で評価する。"},{"label":"イ","html":"キャッシュフロー上で初年度の投資によるキャッシュアウトフローが何年後に回収できるかによって評価する。"},{"label":"ウ","html":"金銭価値の時間的変化を考慮して，現在価値に換算されたキャッシュフローの一定期間の合計値がゼロとなるような割引率を求め，その大小で評価する。"},{"label":"エ","html":"投資額を分母に，投資による収益を分子とした比率を算出し，その大小で評価する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ROI(Return on Investment、投資利益率)は「投資による収益(利益)÷投資額」という比率で算出される指標で、投資額に対してどれだけの収益を生み出したかを示します。選択肢のうちこの定義に合致するのはエの「投資額を分母、投資による収益を分子とした比率を算出し、その大小で評価する」であり、これが正解です。アは将来のキャッシュフローを割引率で現在価値に換算して合計する手法で正味現在価値法(NPV法)の説明、イは投資額の回収に要する期間に着目する回収期間法(ペイバック法)の説明、ウは現在価値の合計がゼロになるような割引率(内部収益率)を求める内部収益率法(IRR法)の説明です。IT投資評価では、これら金額(NPV)、期間(回収期間法)、利率(IRR)、比率(ROI)という異なる切り口の手法が併用されることが多く、それぞれの評価基準の違いを正確に区別することが問われます。</p>","mnemonic":""},{"id":179,"year":2017,"period":"平成29年度秋期","num":5,"cat":"ストラテジ系","field":"成長マトリクス","summary":"成長マトリクス：平成29年度秋期 問5","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>アンゾフの成長マトリクスを説明したものはどれか。</p>","choices":[{"label":"ア","html":"外部環境と内部環境の観点から，強み，弱み，機会，脅威という四つの要因について情報を整理し，企業を取り巻く環境を分析する手法である。"},{"label":"イ","html":"企業のビジョンと戦略を実現するために，財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点から事業活動を検討し，アクションプランまで具体化していくマネジメント手法である。"},{"label":"ウ","html":"事業戦略を，市場浸透，市場拡大，製品開発，多角化という四つのタイプに分類し，事業の方向性を分析する手法である。"},{"label":"エ","html":"製品ライフサイクルを，導入期，成長期，成熟期，衰退期という四つの段階に分類し，企業にとって最適な戦略を分析する手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>イゴール・アンゾフが提唱した成長マトリクス(製品・市場マトリックス)は、「製品」と「市場」をそれぞれ「既存」「新規」の2軸に分け、市場浸透(既存製品×既存市場)、市場拡大・新市場開拓(既存製品×新規市場)、製品開発(新製品×既存市場)、多角化(新製品×新規市場、もっともリスクが高い戦略とされる)という4つの成長戦略類型に整理するフレームワークです。選択肢ウの「事業戦略を、市場浸透、市場拡大、製品開発、多角化という四つのタイプに分類し、事業の方向性を分析する」はこの内容と一致し、正解です。アは強み・弱み・機会・脅威の4要素で環境を分析するSWOT分析の説明、イは財務・顧客・内部ビジネスプロセス・学習と成長の4視点で戦略を具体策まで落とし込むバランストスコアカード(BSC)の説明、エは導入期・成長期・成熟期・衰退期という段階で製品の市場での位置づけを分析するプロダクトライフサイクル(PLC)の説明です。いずれも「4分類」という形式が似ているため混同しやすく、各フレームワークがどの軸・観点で4つに分けているかを正確に押さえることが重要です。</p>","mnemonic":""},{"id":180,"year":2017,"period":"平成29年度秋期","num":6,"cat":"ストラテジ系","field":"バリューチェーン","summary":"バリューチェーン：平成29年度秋期 問6","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>バリューチェーンでは，付加価値を生み出す事業活動を，五つの主活動と四つの支援活動に分類している。支援活動に該当するものはどれか。</p>","choices":[{"label":"ア","html":"技術開発"},{"label":"イ","html":"購買物流"},{"label":"ウ","html":"サービス"},{"label":"エ","html":"製造"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マイケル・ポーターが提唱したバリューチェーン(価値連鎖)分析では、企業の事業活動を「主活動」と「支援活動」に大別します。主活動は、購買物流、製造、出荷物流、販売・マーケティング、サービスという、製品が顧客に届くまでの直接的な5つの工程です。これに対し支援活動は、主活動を間接的に支える活動で、全般管理(企業インフラ)、人事・労務管理、技術開発、調達活動の4つから構成されます。設問の選択肢のうち、購買物流(イ)、サービス(ウ)、製造(エ)はいずれも主活動に分類される項目であり、技術開発(ア)のみが支援活動に該当するため、アが正解です。なお、購買物流と調達活動は名称が似て混同しやすいですが、購買物流は原材料の受け入れ・保管・在庫管理といった「モノの流れ」を担う主活動であるのに対し、調達活動は資材やサービスを購入する仕組み・交渉を指す支援活動である点に違いがあります。</p>","mnemonic":""},{"id":181,"year":2017,"period":"平成29年度秋期","num":7,"cat":"ストラテジ系","field":"ファイブフォース","summary":"ファイブフォース：平成29年度秋期 問7","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>ファイブフォース分析は，業界構造を，業界内で競争が激化する五つの要因を用いて図のように説明している。図中のaに入る要因はどれか。</p><table border=\"1\" style=\"border-collapse:collapse;text-align:center;margin:8px 0;\"><tr><td></td><td style=\"padding:6px 10px;\">新規参入の脅威</td><td></td></tr><tr><td style=\"padding:6px 10px;\">売り手の交渉力</td><td style=\"padding:6px 10px;\">→　a　←</td><td style=\"padding:6px 10px;\">買い手の交渉力</td></tr><tr><td></td><td style=\"padding:6px 10px;\">代替品の脅威</td><td></td></tr></table>","choices":[{"label":"ア","html":"規模の経済性"},{"label":"イ","html":"業者間の敵対関係"},{"label":"ウ","html":"仕入先の集中度"},{"label":"エ","html":"流通チャネルの確保"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マイケル・ポーターのファイブフォース分析(5フォース分析)は、業界の競争構造を「新規参入の脅威」「売り手(供給者)の交渉力」「買い手(顧客)の交渉力」「代替品の脅威」、そして中心に位置する「業界内の既存競争業者間の敵対関係」という5つの力で整理するフレームワークです。図の中央にあるaは、周囲の4つの外部要因が収斂していく中心的な要素であり、既に業界内に存在する競合企業同士の価格競争・差別化競争の激しさを示す「業者間の敵対関係」が該当するため、イが正解です。規模の経済性(ア)や仕入先の集中度(ウ)はいずれも売り手の交渉力の強さを左右する着眼点の一例であり、流通チャネルの確保(エ)は新規参入の障壁や代替品の脅威を評価する際の着眼点であって、5つの力そのものを表す項目ではありません。ファイブフォース分析では、これら5つの力が強いほど業界内の競争は激化し、各企業の収益性は低下する傾向があるとされます。</p>","mnemonic":""},{"id":182,"year":2017,"period":"平成29年度秋期","num":8,"cat":"ストラテジ系","field":"NPV法","summary":"NPV法：平成29年度秋期 問8","correct":"イ","result":"","formula":"NPV=Σ(各年の回収額÷(1+割引率)^年数)－投資額、NPVが最大のものを採用","howto":"回収額を割引率5%で現在価値に換算して合計し、投資額220を差し引いてNPVを比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>投資効果を正味現在価値法で評価するとき、最も投資効果が大きい(又は損失が小さい)シナリオはどれか。ここで、期間は3年間、割引率は5%とし、各シナリオのキャッシュフローは表のとおりとする。</p><table><tr><td>シナリオ</td><td>投資額</td><td>1年目</td><td>2年目</td><td>3年目</td></tr><tr><td>A</td><td>220</td><td>40</td><td>80</td><td>120</td></tr><tr><td>B</td><td>220</td><td>120</td><td>80</td><td>40</td></tr><tr><td>C</td><td>220</td><td>80</td><td>80</td><td>80</td></tr><tr><td>投資をしない</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table><p>(単位 万円、1年目〜3年目は回収額)</p>","choices":[{"label":"ア","html":"A"},{"label":"イ","html":"B"},{"label":"ウ","html":"C"},{"label":"エ","html":"投資をしない"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率5%での現価係数は、1年目1/1.05≒0.9524、2年目1/1.05²≒0.9070、3年目1/1.05³≒0.8638である。各シナリオの回収額の現在価値合計から投資額220を差し引き、NPVを求める。</p><p>A: 40×0.9524+80×0.9070+120×0.8638≒38.1+72.6+103.7=214.3 → NPV=214.3－220=－5.7</p><p>B: 120×0.9524+80×0.9070+40×0.8638≒114.3+72.6+34.6=221.4 → NPV=221.4－220=＋1.4</p><p>C: 80×0.9524+80×0.9070+80×0.8638≒76.2+72.6+69.1=217.9 → NPV=217.9－220=－2.1</p><p>投資をしない場合のNPV=0</p><p>4者のうちNPVが最大となるのはB(約+1.4)であり、唯一プラスのNPVを示す。よって投資効果が最も大きいのはB、正解はイ。</p>","mnemonic":"「早稼ぎは目減りしにくい」―Bは初年度に120稼ぐので割引の影響が小さく、唯一NPVがプラス(+1.4)になって逆転勝ちする。"},{"id":183,"year":2017,"period":"平成29年度秋期","num":9,"cat":"ストラテジ系","field":"寄付付き商品","summary":"寄付付き商品：平成29年度秋期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>コーズリレーテッドマーケティングの特徴はどれか。</p>","choices":[{"label":"ア","html":"顧客との継続的な取引関係を構築して維持することによって，顧客生涯価値を高め，企業収益に貢献する。"},{"label":"イ","html":"顧客の許可を得てから勧誘や広告活動を行うことによって，顧客との長期的な信頼関係や友好関係の形成を重視する。"},{"label":"ウ","html":"商品の売上の一部をNPO法人に寄付するなど，社会貢献活動を支援する信条をアピールし，販売促進に繋げる。"},{"label":"エ","html":"蓄積された顧客情報を分析することによって，見込み客の特定，的確な提案，顧客の購買促進や顧客のロイヤリティ向上などに役立てる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コーズ・リレーテッド・マーケティング(Cause Related Marketing)は、商品の売上の一部を社会課題解決のための活動(NPOへの寄付など)に充てることで、企業の社会貢献姿勢をアピールしながら販売促進につなげる手法です。1983年にアメリカン・エキスプレスが、カード利用1件ごとに一定額を自由の女神像の修復費用として寄付するキャンペーンを行ったことが有名な起源とされ、以降「寄付付き商品」として広く普及しました。選択肢ウの「商品の売上の一部をNPO法人に寄付するなど、社会貢献活動を支援する信条をアピールし、販売促進に繋げる」はこの内容そのものであり、正解です。アは顧客生涯価値(LTV)を高める継続的な関係構築を特徴とするリレーションシップマーケティング、イは事前に顧客の許可を得てから働きかけるパーミッションマーケティング、エは蓄積した顧客データを分析して活用するデータベースマーケティングの説明であり、いずれもコーズリレーテッドマーケティングとは異なる手法です。単なる慈善活動(フィランソロピー)とは異なり、企業の収益活動と明確に結び付いている点が特徴とされます。</p>","mnemonic":""},{"id":184,"year":2017,"period":"平成29年度秋期","num":10,"cat":"ストラテジ系","field":"口コミ拡散","summary":"口コミ拡散：平成29年度秋期 問10","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>人から人へと評判が拡散することを積極的に利用することが特徴的なマーケティング手法はどれか。</p>","choices":[{"label":"ア","html":"アフィリエイトマーケティング"},{"label":"イ","html":"セグメント内差別化マーケティング"},{"label":"ウ","html":"パーミッションマーケティング"},{"label":"エ","html":"バイラルマーケティング"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バイラルマーケティングは、ウイルス(virus)が感染拡大するように、消費者から消費者へと口コミで情報が連鎖的に広がっていくことを狙ったマーケティング手法です。企業は「人に伝えたくなる・シェアしたくなる」仕掛けをコンテンツや施策に組み込み、消費者が自発的に情報を拡散していく流れを作り出します。設問の「人から人へと評判が拡散することを積極的に利用する」という特徴はまさにバイラルマーケティングの核心であり、エが正解です。アのアフィリエイトマーケティングは成果報酬型の広告提携の仕組み、ウのパーミッションマーケティングは顧客の事前許可を得てから働きかける手法であり、いずれも「口コミの連鎖的拡散」を本質的な特徴とするものではありません。バイラルマーケティングは、拡散するかどうかの判断が消費者の自発的な意思に委ねられる点で、企業が消費者になりすまして情報を操作するステルスマーケティングとは明確に区別される点も押さえておきたいポイントです。</p>","mnemonic":""},{"id":185,"year":2017,"period":"平成29年度秋期","num":11,"cat":"ストラテジ系","field":"4Pと4C","summary":"4Pと4C：平成29年度秋期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>売り手側でのマーケティング要素4Pは，買い手側での要素4Cに対応するという考え方がある。4Pの一つであるプロモーションに対応する4Cの構成要素はどれか。</p>","choices":[{"label":"ア","html":"顧客価値（Customer Value）"},{"label":"イ","html":"顧客コスト（Customer Cost）"},{"label":"ウ","html":"コミュニケーション（Communication）"},{"label":"エ","html":"利便性（Convenience）"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マーケティングの4P(Product、Price、Place、Promotion、売り手視点)に対し、4C(Customer Value、Customer Cost、Convenience、Communication、買い手視点)は顧客側から見た対応概念として整理されます。この対応関係では、Product↔Customer Value(顧客価値)、Price↔Customer Cost(顧客コスト)、Place↔Convenience(利便性)、Promotion↔Communication(コミュニケーション)という4組の対応があるとされ、企業からの一方的な「販促活動」であるPromotionは、顧客側から見れば企業との双方向の「コミュニケーション」と位置づけられます。したがって正解はウです。4Pは1960年代にE.J.マッカーシーが提唱した企業視点のフレームワークで販売側の都合から施策を組み立てるのに対し、4Cは顧客視点のフレームワークとして、顧客が何を求め、何を負担し、どう企業と接点を持つかという観点から4Pを検証する目的で用いられます。4Pで施策を立案し、4Cで顧客視点から見直すという使い分けが一般的です。</p>","mnemonic":""},{"id":186,"year":2017,"period":"平成29年度秋期","num":12,"cat":"ストラテジ系","field":"浸透価格戦略","summary":"浸透価格戦略：平成29年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>ペネトレーション価格戦略の説明はどれか。</p>","choices":[{"label":"ア","html":"価格感度が高い消費者層ではなく高価格でも購入する層をターゲットとし，新製品の導入期に短期間で利益を確保する戦略である。"},{"label":"イ","html":"新製品の導入期に，市場が受け入れやすい価格を設定し，まずは利益獲得よりも市場シェアの獲得を優先する戦略である。"},{"label":"ウ","html":"製品やサービスに対する消費者の値頃感に基づいて価格を設定し，消費者にその製品やサービスへの購買行動を喚起させる戦略である。"},{"label":"エ","html":"補完的な複数の製品やサービスを組み合わせて，個々の製品やサービスの価格の合計よりも低い価格を設定し，売上を増大させる戦略である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ペネトレーションプライシング(市場浸透価格戦略)は、新製品投入時にあえて低い価格を設定し、短期的な利益よりも早期の市場シェア獲得や顧客基盤の拡大を優先する価格戦略です。低価格によって消費者の試用を促し、競合の顧客を取り込みながらブランドへのロイヤルティを築いた後、段階的に値上げして収益性を高めていくのが典型的な流れとされます。選択肢イの「市場が受け入れやすい価格を設定し、まずは利益獲得よりも市場シェアの獲得を優先する」はこの定義と一致し、正解です。アは逆に高価格を設定して早期に利益を刈り取るスキミングプライシング(上澄み吸収価格戦略)の説明であり、ペネトレーション価格戦略とは対極の戦略として対比されます。ウは消費者の心理的な価格受容感に基づく価格設定、エは複数商品を組み合わせた抱き合わせ価格(バンドリング価格)の説明で、いずれも別の価格戦略を指しています。</p>","mnemonic":""},{"id":187,"year":2017,"period":"平成29年度秋期","num":13,"cat":"ストラテジ系","field":"価格弾力性","summary":"価格弾力性：平成29年度秋期 問13","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>需要の価格弾力性を説明したものはどれか。</p>","choices":[{"label":"ア","html":"製品価格と需要，製品価格と供給の関係をそれぞれ表したものであり，両者の曲線の交点が均衡価格であることが分かる。"},{"label":"イ","html":"製品価格の変化に対する需要の変化を比率で表したものであり，製品価格を上下させたときの需要の増減量を判断できる。"},{"label":"ウ","html":"製品の需要と，価格，所得，広告，販売促進などの需要決定要因との関係を表したものであり，これによって需要予測ができる。"},{"label":"エ","html":"累積生産量と単位コストの関係を表したものであり，製品の需要が増加して累積生産量が増加すると単位コストが低減することが分かる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>需要の価格弾力性は、価格が1%変化したときに需要量が何%変化するかを示す指標で、「需要量の変化率÷価格の変化率」という比率で算出されます。価格と需要量は通常逆方向に動くため値は負になりますが、慣習的に絶対値で評価し、絶対値が1より大きければ「弾力的(価格変化に対して需要が敏感に反応する)」、1より小さければ「非弾力的」と判断します。選択肢イの「製品価格の変化に対する需要の変化を比率で表したものであり、価格を上下させたときの需要の増減量を判断できる」はこの定義に合致し、正解です。アは価格と需要・供給の関係をそれぞれの曲線で表し、交点として均衡価格を導く需要・供給曲線の説明、ウは価格以外の所得や広告などの要因も含めて需要を説明する需要関数の説明、エは累積生産量の増加に伴って単位コストが逓減する関係を示す経験曲線(経験曲線効果)の説明であり、いずれも需要の価格弾力性そのものとは異なる概念です。</p>","mnemonic":""},{"id":188,"year":2017,"period":"平成29年度秋期","num":14,"cat":"ストラテジ系","field":"PEST分析","summary":"PEST分析：平成29年度秋期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>企業が実施するマクロ環境分析のうち，PEST分析によって戦略を策定している事例はどれか。</p>","choices":[{"label":"ア","html":"購買決定者の年齢層や社会的なポジション，購買に至るプロセスの中で購買行動に影響する要因を把握し，自社の製品の市場投入方法を決定する。"},{"label":"イ","html":"自社の製品市場に参入してくると見込まれる，別市場の企業の動向を把握し，新製品の開発を決定する。"},{"label":"ウ","html":"自社の販売力，生産力の評価や自社の保有する技術力を検証し，新しく進出する市場分野を決定する。"},{"label":"エ","html":"法規制，景気動向，流行の推移や新技術の状況を把握し，自社の製品改善の方針を決定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PEST分析は、企業が自らコントロールできない外部のマクロ環境要因を、Politics(政治・法規制)、Economy(経済・景気動向)、Society(社会・文化・流行)、Technology(技術革新)という4つの視点で把握するフレームワークです。選択肢エの「法規制、景気動向、流行の推移や新技術の状況を把握し、自社の製品改善の方針を決定する」は、まさにこの政治・経済・社会・技術の4要素を網羅しており、PEST分析の典型的な活用事例として正解です。アは個々の購買者の属性や購買プロセスに着目するミクロな消費者行動分析、イは特定の競合企業の動向分析、ウは自社の販売力・生産力・技術力という内部の経営資源を評価する内部環境分析であり、いずれも社会全体に及ぶマクロな外部環境を対象とするPEST分析とは分析の粒度・対象が異なります。PEST分析はSWOT分析の外部環境(機会・脅威)の部分を深掘りする目的で、しばしば組み合わせて使われます。</p>","mnemonic":""},{"id":189,"year":2017,"period":"平成29年度秋期","num":15,"cat":"ストラテジ系","field":"製品革新","summary":"製品革新：平成29年度秋期 問15","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>プロダクトイノベーションの例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"シックスシグマの工程管理を導入し，製品品質を向上する。"},{"label":"イ","html":"ジャストインタイム方式を採用し，部品在庫を減らす。"},{"label":"ウ","html":"製造方法を見直し，コストを下げた製品を製造する。"},{"label":"エ","html":"マルチコアCPUを採用した，高性能で低消費電力の製品を開発する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>イノベーションは大きく「プロダクトイノベーション(製品そのものの革新)」と「プロセスイノベーション(製造・業務プロセスの革新)」に分類されます。プロダクトイノベーションは、新機能・新技術を取り入れた新製品の開発や、既存製品の大幅な性能向上を指し、選択肢エの「マルチコアCPUを採用した、高性能で低消費電力の製品を開発する」は、製品自体に新しい技術(マルチコア化)を取り入れて性能・特性そのものを向上させているため、プロダクトイノベーションの典型例であり正解です。一方、ア(シックスシグマによる工程管理の導入)、イ(ジャストインタイム方式による在庫削減)、ウ(製造方法見直しによるコスト削減)は、いずれも製品そのものではなく、製造・業務の「やり方・仕組み」を改善している点で、プロセスイノベーションに分類されます。両者は効率・生産性向上を目的とする点で似ていますが、プロダクトイノベーションは「顧客に提供する価値(製品・サービス)の革新」、プロセスイノベーションは「価値を生み出す過程の革新」という違いで区別するのがポイントです。</p>","mnemonic":""},{"id":190,"year":2017,"period":"平成29年度秋期","num":16,"cat":"ストラテジ系","field":"表示回数保証広告","summary":"表示回数保証広告：平成29年度秋期 問16","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>インターネットにおける広告形態のうち，インプレッション保証型広告の説明はどれか。</p>","choices":[{"label":"ア","html":"あらかじめ決められたキーワードを利用者が検索エンジンに入力した際に表示される広告"},{"label":"イ","html":"掲載した広告を見た利用者が，その広告をクリックした上で，掲載者の意図に沿った行動を起こした場合に，掲載料を支払う広告"},{"label":"ウ","html":"契約した表示回数に達するまで掲載を続ける広告"},{"label":"エ","html":"ポータルサイトのトップページや特集ページなどに一定期間掲載する広告"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>インプレッション保証型広告は、広告主と媒体社があらかじめ契約した「表示回数(インプレッション数)」に達するまで広告を掲載し続ける、予約型のネット広告形態です。課金は表示回数を基準とするCPM(1,000回表示あたりの単価)が一般的で、クリックされるかどうかにかかわらず、決められた表示回数の到達が保証される点が特徴です。選択肢ウの「契約した表示回数に達するまで掲載を続ける」はこの定義そのものであり、正解です。アは特定のキーワード検索時に表示される検索連動型広告、イはクリック後に掲載者が意図した行動(資料請求や購入など)が発生した場合に課金される成果報酬型広告の説明、エは掲載場所と期間のみを契約し表示回数を保証しない期間保証型広告の説明です。インプレッション保証型は、クリック数や成果の多寡にかかわらず認知拡大・ブランディングを目的とする出稿に向いているとされます。</p>","mnemonic":""},{"id":191,"year":2017,"period":"平成29年度秋期","num":17,"cat":"ストラテジ系","field":"フリーミアム","summary":"フリーミアム：平成29年度秋期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>フリーミアムの特徴はどれか。</p>","choices":[{"label":"ア","html":"Webサイト内の広告を収益源としているので，サービスの維持・拡大が困難である。"},{"label":"イ","html":"全ての利用者に広く課金するモデルである。"},{"label":"ウ","html":"有料と無料の境界が明確になっていて，高度な機能や充実した内容など有料のサービスの優位性がはっきりしている。"},{"label":"エ","html":"利用者ごとに掛かるコストが大きいので，少数の人が限定的に使うような場合に，より高い効果が見込める。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フリーミアム(Freemium)は「Free(無料)」と「Premium(割増料金)」を組み合わせた造語で、基本機能・基本サービスを無料で広く提供し、高度な機能や大容量ストレージなど付加価値の高い部分を有料で提供することで収益を得るビジネスモデルです。成功の鍵は、無料版と有料版の境界(どこまで無料で使えて、何が有料の壁の向こうにあるか)を明確に設計し、有料版の優位性(高度な機能、充実した内容など)を利用者にはっきり示すことにあるとされ、これは選択肢ウの内容と一致するため正解です。アは広告収入のみに依存するモデルの弱点を述べたもので、フリーミアムとは異なる収益構造の説明、イは全利用者への一律課金でありフリーミアムが前提とする「無料ユーザーの大きな母数」と矛盾します。エも少数限定利用でより効果が出るとする内容で、多数の無料ユーザーを土台に一部が有料へ転換するフリーミアムの構造とは逆の説明です。一般にフリーミアムの有料転換率は数パーセント程度とされ、無料ユーザーの母数の大きさがビジネスの成否を左右します。</p>","mnemonic":""},{"id":192,"year":2017,"period":"平成29年度秋期","num":18,"cat":"ストラテジ系","field":"コンバージョン率","summary":"コンバージョン率：平成29年度秋期 問18","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>インターネット広告の効果指標として用いられるコンバージョン率の説明はどれか。</p>","choices":[{"label":"ア","html":"Webサイト上で広告が表示された回数に対して，その広告がクリックされた回数の割合を示す指標である。"},{"label":"イ","html":"Webサイト上の広告から商品購入に至った顧客の1人当たりの広告コストを示す指標である。"},{"label":"ウ","html":"Webサイト上の広告に掛けた費用の何倍の収益がその広告から得ることができたかを示す指標である。"},{"label":"エ","html":"Webサイト上の広告をクリックし，そのWebサイトを訪れた人のうち会員登録や商品購入などに至った顧客数の割合を示す指標である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コンバージョン率(CVR: Conversion Rate)は、広告をクリックしてサイトを訪れたユーザーのうち、実際に商品購入・会員登録・資料請求といった「成果(コンバージョン)」に至った人の割合を示す指標で、「コンバージョン数÷サイト訪問者数(クリック数)×100」で算出されます。選択肢エの「広告をクリックし、サイトを訪れた人のうち会員登録や商品購入などに至った顧客数の割合」はこの定義そのものであり、正解です。アは表示回数に対するクリック数の割合を示すクリック率(CTR)の説明、イは購入に至った顧客1人当たりのコストを示す顧客獲得単価(CPA)の説明、ウは広告費用に対する収益の倍率を示す広告費用対効果(ROAS)の説明です。これらはいずれもネット広告の代表的な効果測定指標ですが、「表示→クリック」「クリック→成果」「費用→収益」のどの段階・切り口を測るものかがそれぞれ異なるため、混同しないよう区別して理解する必要があります。</p>","mnemonic":""},{"id":193,"year":2017,"period":"平成29年度秋期","num":19,"cat":"ストラテジ系","field":"SL理論","summary":"SL理論：平成29年度秋期 問19","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>ハーシィ及びブランチャードが提唱するSL理論の説明はどれか。</p>","choices":[{"label":"ア","html":"開放の窓，秘密の窓，未知の窓，盲点の窓の四つの窓を用いて，自己理解と対人関係の良否を説明した理論"},{"label":"イ","html":"教示的，説得的，参加的，委任的の四つに，部下の成熟度レベルによって，リーダーシップスタイルを分類した理論"},{"label":"ウ","html":"共同化，表出化，連結化，内面化のプロセスによって，個人と組織に新たな知識が創造されるとした理論"},{"label":"エ","html":"生理的，安全，所属と愛情，承認と自尊，自己実現といった5段階で欲求が発達するとされる理論"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SL理論(Situational Leadership Theory、状況対応型リーダーシップ理論)は、ポール・ハーシィとケネス・ブランチャードが提唱した、唯一絶対の優れたリーダーシップスタイルは存在せず、部下の成熟度(能力・意欲のレベル)に応じて最適なスタイルが変化するという考え方です。具体的には「指示的行動」と「援助的(支援的)行動」という2つの軸を組み合わせ、部下の成熟度が低い順に、具体的に指示する「教示的」、指示しつつ理由も説明し部下の意見にも耳を傾ける「説得的」、部下と一緒に考え支援を中心とする「参加的」、仕事を任せ権限を委譲する「委任的」という4つのリーダーシップスタイルに分類します。選択肢イはこの内容と一致し、正解です。アは自己開示と他者からのフィードバックの関係を4つの窓で説明するジョハリの窓、ウは野中郁次郎が提唱した組織的知識創造理論(SECIモデル)、エはアブラハム・マズローの欲求5段階説であり、いずれも別の著名な心理学・組織論のフレームワークです。</p>","mnemonic":""},{"id":194,"year":2017,"period":"平成29年度秋期","num":20,"cat":"ストラテジ系","field":"線形計画法","summary":"線形計画法：平成29年度秋期 問20","correct":"ウ","result":"","formula":"線形計画法: 制約条件の交点(頂点)で目的関数(利益)を最大化する","howto":"3x+2y≤120とx+2y≤60を連立して交点(x=30,y=15)を求め、利益x+yを計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>製品X,Yを1台製造するのに必要な部品数は、表のとおりである。製品1台当たりの利益がX,Yともに1万円のとき、利益は最大何万円になるか。ここで、部品Aは120個、部品Bは60個まで使えるものとする。</p><table><tr><td>部品＼製品</td><td>X</td><td>Y</td></tr><tr><td>A</td><td>3</td><td>2</td></tr><tr><td>B</td><td>1</td><td>2</td></tr></table><p>(単位 個)</p>","choices":[{"label":"ア","html":"30"},{"label":"イ","html":"40"},{"label":"ウ","html":"45"},{"label":"エ","html":"60"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Xの製造台数をx、製品Yの製造台数をyとする。部品の制約条件は次のとおり。</p><p>部品A: 3x+2y≤120</p><p>部品B: x+2y≤60</p><p>目的関数(利益、1台当たり共に1万円)は、利益=x+yを最大化する。線形計画法では、実行可能領域の頂点のいずれかで目的関数が最大になる。二つの制約式を等号で連立させる。</p><p>3x+2y=120 …①</p><p>x+2y=60 …②</p><p>①－②: 2x=60 → x=30、②へ代入: 30+2y=60 → y=15</p><p>この頂点(x=30,y=15)での利益=x+y=30+15=45万円。他の頂点であるx=40,y=0(部品Bに余裕あり)では利益40万円、x=0,y=30では利益30万円であり、いずれも45万円より小さい。よって最大利益は45万円、正解はウ。</p>","mnemonic":"部品A:3×30+2×15=120、部品B:30+2×15=60とどちらも使い切る頂点がX30台・Y15台(イチゴ=15)、利益45万円でウ。"},{"id":195,"year":2017,"period":"平成29年度秋期","num":21,"cat":"マネジメント系","field":"特性要因図","summary":"特性要因図：平成29年度秋期 問21","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>利用者とシステム運用担当者によるブレーンストーミングを行って，利用者の操作に起因するPCでのトラブルについて，主要なトラブルごとに原因となったと思われる操作，利用状況などを拾い上げた。トラブル対策を立てるために，ブレーンストーミングの結果を利用して原因と結果の関係を整理するのに適した図はどれか。</p>","choices":[{"label":"ア","html":"散布図"},{"label":"イ","html":"特性要因図"},{"label":"ウ","html":"パレート図"},{"label":"エ","html":"ヒストグラム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>特性要因図(フィッシュボーン図、石川ダイアグラム)は、QC七つ道具の一つで、ある「結果(特性)」に対して、それを引き起こす可能性のある複数の「原因(要因)」を魚の骨のような形に体系立てて整理する図です。ブレーンストーミングで洗い出したさまざまな原因候補を、人・設備・方法・材料などのカテゴリ別に大骨・小骨として分類し、結果との因果関係を視覚的に整理するのに適しており、設問のように「原因と結果の関係を整理する」目的には特性要因図が最も適しているため、イが正解です。散布図(ア)は2つの変量間の相関関係を把握するための図、パレート図(ウ)は項目別の件数を大きい順に並べ累積比率を示し重点項目を絞り込むための図、ヒストグラム(エ)はデータのばらつき・分布状況を棒グラフで表す図であり、いずれも「原因と結果の関係の整理」を主目的とする図ではありません。特性要因図はブレーンストーミングと組み合わせて使われることが多く、品質管理やトラブル分析の現場で広く活用されています。</p>","mnemonic":""},{"id":196,"year":2017,"period":"平成29年度秋期","num":22,"cat":"ストラテジ系","field":"営業利益","summary":"営業利益：平成29年度秋期 問22","correct":"イ","result":"","formula":"営業利益=売上高－売上原価－販管費(営業外損益は含めない)","howto":"1,500－1,000－200=300。営業外収益40・営業外費用30は経常利益の算定要素なので無視する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>期末の決算において、表の損益計算資料が得られた。当期の営業利益は何百万円か。</p><table><tr><td>項目</td><td>金額</td></tr><tr><td>売上高</td><td>1,500</td></tr><tr><td>売上原価</td><td>1,000</td></tr><tr><td>販売費及び一般管理費</td><td>200</td></tr><tr><td>営業外収益</td><td>40</td></tr><tr><td>営業外費用</td><td>30</td></tr></table><p>(単位 百万円)</p>","choices":[{"label":"ア","html":"270"},{"label":"イ","html":"300"},{"label":"ウ","html":"310"},{"label":"エ","html":"500"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>営業利益は、売上高から売上原価と販売費及び一般管理費を差し引いて求める。営業外収益・営業外費用は、営業利益に加減して経常利益を求める際に使う項目であり、営業利益そのものの計算には含めない。</p><p>売上総利益=売上高1,500－売上原価1,000=500</p><p>営業利益=売上総利益500－販売費及び一般管理費200=300</p><p>よって当期の営業利益は300百万円、正解はイ。</p>","mnemonic":"「営業外は蚊帳の外」―1500から原価1000と販管費200だけ引けば300、40や30の営業外項目には惑わされない。"},{"id":197,"year":2017,"period":"平成29年度秋期","num":23,"cat":"ストラテジ系","field":"電子帳簿保存法","summary":"電子帳簿保存法：平成29年度秋期 問23","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>国税関係帳簿を磁気媒体で保存する場合，法律で規定されているものはどれか。</p>","choices":[{"label":"ア","html":"あらかじめ所轄の税務署長の承認を受けることが必要となる。"},{"label":"イ","html":"定められた性能の媒体を用いなければならない。"},{"label":"ウ","html":"電子取引に関する記録に限って許可される。"},{"label":"エ","html":"バックアップとして紙又はマイクロフィルムでの保存が義務付けられている。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>電子帳簿保存法(当時の名称は「電子計算機を使用して作成する国税関係帳簿書類の保存方法等の特例に関する法律」)第4条では、最初の記録段階から一貫してコンピュータで作成している国税関係帳簿について、保存義務者があらかじめ納税地等の所轄税務署長の承認を受けた場合に限り、紙ではなく電磁的記録(磁気媒体等)による保存が認められると規定されていました。これは出題当時(平成29年)の制度を前提にしたもので、選択肢アの「あらかじめ所轄の税務署長の承認を受けることが必要となる」がこの法律の要件と一致し、正解です。イの「定められた性能の媒体を用いなければならない」という媒体性能の要件は同法が定める主要件ではなく、ウの「電子取引に関する記録に限って許可される」は誤りで、電子取引データの保存は国税関係帳簿書類の電磁的記録保存とは別の規定にあたります。エの「バックアップとして紙又はマイクロフィルムでの保存が義務付けられている」も、紙保存の負担軽減という電子保存制度の趣旨に反する内容であり誤りです。なお、2022年の法改正により、この承認制度自体は廃止されており、現行制度は出題当時とは異なる点に留意が必要です。</p>","mnemonic":""},{"id":198,"year":2017,"period":"平成29年度秋期","num":24,"cat":"テクノロジ系","field":"MITB攻撃","summary":"MITB攻撃：平成29年度秋期 問24","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>Man-in-the-Browser攻撃に該当するものはどれか。</p>","choices":[{"label":"ア","html":"DNSサーバのキャッシュを不正に書き換えて，インターネットバンキングに見せかけた偽サイトをWebブラウザに表示させる。"},{"label":"イ","html":"PCに侵入したマルウェアが，利用者のインターネットバンキングへのログインを検知して，Webブラウザから送信される振込先などのデータを改ざんする。"},{"label":"ウ","html":"インターネットバンキングから送信されたように見せかけた電子メールに偽サイトのURLを記載しておき，その偽サイトに接続させて，Webブラウザから口座番号やクレジットカード番号を入力させることで情報を盗み出す。"},{"label":"エ","html":"インターネットバンキングの正規サイトに見せかけた中継サイトにWebブラウザを接続させ，入力された利用者IDとパスワードを使って利用者になりすまし，正規サイトにログインする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>Man-in-the-Browser(MITB)攻撃は、PCに侵入したマルウェアがWebブラウザそのものに寄生し、利用者が正規のインターネットバンキングサイトに正しくログインした後の通信内容を、ブラウザ内部でリアルタイムに書き換える攻撃です。選択肢イの「PCに侵入したマルウェアが、利用者のインターネットバンキングへのログインを検知して、Webブラウザから送信される振込先などのデータを改ざんする」はこの動作そのものであり、正解です。MITB攻撃は、画面上には利用者が入力した通りの取引内容を表示しつつ、実際に金融機関へ送信するデータだけを改ざんするため利用者が気づきにくく、ワンタイムパスワードなど従来の二要素認証を回避する目的で用いられる点が特徴とされます。アはDNSキャッシュポイズニングによる偽サイトへの誘導、ウは偽の電子メールで偽サイトへ誘導するフィッシング攻撃、エは正規サイトと利用者の間に中継サイトを挟み認証情報を盗用する中間者攻撃(フィッシングの一種)の説明であり、いずれもブラウザ内部でマルウェアが通信内容を書き換えるMITBとは攻撃の仕組みが異なります。「正規サイトへのログイン後の正規セッションを悪用する」点が、MITBを他の攻撃と区別する重要なポイントです。</p>","mnemonic":""},{"id":199,"year":2017,"period":"平成29年度秋期","num":25,"cat":"テクノロジ系","field":"OCSP","summary":"OCSP：平成29年度秋期 問25","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>ディジタル証明書が失効しているかどうかをオンラインでリアルタイムに確認するためのプロトコルはどれか。</p>","choices":[{"label":"ア","html":"CHAP"},{"label":"イ","html":"LDAP"},{"label":"ウ","html":"OCSP"},{"label":"エ","html":"SNMP"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>OCSP(Online Certificate Status Protocol)は、ディジタル証明書(公開鍵証明書)が失効しているかどうかを、認証局が運用するOCSPレスポンダーに問い合わせることで、オンラインかつリアルタイムに確認できるプロトコルです。クライアントは確認したい証明書の情報を含むOCSPリクエストを送信し、レスポンダーは証明書の状態(有効・失効・不明)を含むOCSPレスポンスを返します。現行の標準仕様はRFC 6960で規定されています。従来、証明書の失効確認にはCRL(証明書失効リスト)という、失効した証明書の一覧を定期的に配布・参照する方式が使われていましたが、CRLはリスト全体をダウンロードする必要があり更新間隔にも制約があったのに対し、OCSPは個別の証明書についてその場で即座に状態を確認できるため、より即時性の高い代替手段として普及しました。したがって正解はウです。CHAP(ア)はPPP接続等で使われるチャレンジレスポンス方式の認証プロトコル、LDAP(イ)はディレクトリサービスにアクセスするためのプロトコル、SNMP(エ)はネットワーク機器を監視・管理するためのプロトコルであり、いずれも証明書の失効確認を目的とするものではありません。</p>","mnemonic":""},{"id":200,"year":2016,"period":"平成28年度秋期","num":1,"cat":"ストラテジ系","field":"EA/DFD","summary":"EA/DFD：平成28年度秋期 問1","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>エンタープライズアーキテクチャ（EA）のビジネスアーキテクチャで機能情報関連図（DFD）を作成する目的はどれか。</p>","choices":[{"label":"ア","html":"業務・システムの機能と情報の流れを明確にする。"},{"label":"イ","html":"業務・システムの目的・機能，情報システムの管理・運用体制を明確にする。"},{"label":"ウ","html":"情報システム間でやり取りされる情報の種類と方向を明確にする。"},{"label":"エ","html":"物理的なデータ構造を明確にする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EA（エンタープライズアーキテクチャ）はビジネスアーキテクチャ（BA）、データアーキテクチャ（DA）、アプリケーションアーキテクチャ（AA）、テクノロジアーキテクチャ（TA）の4階層で構成され、BAは業務の全体最適化を目的とする設計図群である。機能情報関連図（DFD：Data Flow Diagram）はBAの代表的な成果物の一つで、業務・システムが担う「機能（処理）」と、それらの間でやり取りされる「情報（データ）の流れ」を可視化し明確にすることを目的として作成される。選択肢イの「管理・運用体制」はEAの文書群の中でも別の成果物が扱う領域であり、DFD自体の目的ではない。選択肢ウの「情報システム間の情報の種類と方向」はより詳細な技術レベル（アプリケーションアーキテクチャでのシステム間インタフェース）の話であり、BAレベルのDFDが示す業務機能との関係とは区別される。選択肢エの「物理的なデータ構造」はデータアーキテクチャにおける物理データモデルの役割であり、DFDは概念レベルでの機能と情報の流れを示すものなので該当しない。したがって正解はアとなる。</p>","mnemonic":""},{"id":201,"year":2016,"period":"平成28年度秋期","num":2,"cat":"ストラテジ系","field":"SCORモデル","summary":"SCORモデル：平成28年度秋期 問2","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>SCOR（Supply Chain Operations Reference model）で定義しているSCMに関する実行プロセスのうち，自社にとってのSourceに当たるものはどれか。</p>","choices":[{"label":"ア","html":"資材などの購入"},{"label":"イ","html":"受注と納入"},{"label":"ウ","html":"納入後に発生する作業"},{"label":"エ","html":"プロダクトの生産，サービスの実施"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SCOR（Supply Chain Operations Reference）モデルはサプライチェーン協議会が策定したSCMの標準プロセス参照モデルで、Plan（計画）を軸に、Source（調達）、Make（製造）、Deliver（配送）、Return（返品）という実行プロセスでサプライチェーン全体を記述する。このうちSourceは、原材料・部品・サービスなど自社が外部（サプライヤー）から仕入れる活動、すなわち「資材などの購入」を指す。SCORのレベル2では、市販品の調達、特注品の調達、受注設計生産品の調達のようにSourceプロセスがさらに細分化される。選択肢エの「プロダクトの生産，サービスの実施」はMake（製造）に該当し、選択肢イの「受注と納入」はDeliver（配送、顧客への出荷）に該当し、選択肢ウの「納入後に発生する作業」はReturn（返品・アフターサービス）に近い。SCORの全体図では「自社」を中心に、上流のサプライヤーとの接点がSource、下流の顧客との接点がDeliverとして描かれるため、「自社にとってのSource」は資材などの購入にあたる。したがって正解はア。</p>","mnemonic":""},{"id":202,"year":2016,"period":"平成28年度秋期","num":3,"cat":"ストラテジ系","field":"協調フィルタリング","summary":"協調フィルタリング：平成28年度秋期 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>レコメンデーション（お勧め商品の提案）の例のうち，協調フィルタリングを用いたものはどれか。</p>","choices":[{"label":"ア","html":"カテゴリ別に売れ筋商品のランキングを自動抽出し，リアルタイムで売れ筋情報を発信する。"},{"label":"イ","html":"顧客情報から，年齢，性別などの人口動態変数を用い，“20代男性”，“30代女性”などにセグメント化した上で，各セグメント向けの商品を提示する。"},{"label":"ウ","html":"顧客同士の購買行動の類似性を相関分析などによって求め，顧客Aに類似した顧客Bが購入している商品を顧客Aに勧める。"},{"label":"エ","html":"野球のバットを購入した人に野球のボールを勧めるなどあらかじめ用意されたルールに基づいて，関連商品を提示する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>協調フィルタリング（Collaborative Filtering）は、「似た行動をとる利用者は似た嗜好を持つ」という前提に基づき、自分自身の履歴だけでなく、他の利用者との類似性を手がかりに推薦を行う手法である。代表的な方式には、利用者同士の類似度を計算する「ユーザーベース」と、商品同士の関連性を分析する「アイテムベース」があり、いずれも大量の行動データから統計的な類似性（相関）を求める点が特徴である。選択肢ウはまさに「顧客同士の購買行動の類似性を相関分析などによって求め、類似した顧客が購入している商品を勧める」というユーザーベース協調フィルタリングの典型例であり、これが正解となる。選択肢イは年齢・性別など人口動態変数によるセグメンテーションであり、他の利用者の行動データを使わない点で協調フィルタリングとは異なる（デモグラフィックベースの手法）。選択肢エは「バットを買った人にボールを勧める」というあらかじめ定義されたルール（アソシエーションルール）に基づく推薦であり、利用者間の類似性計算を行う協調フィルタリングとは区別される。選択肢アは単純な売れ筋ランキングの抽出であり、個々の利用者の嗜好や類似性を考慮しないため該当しない。</p>","mnemonic":""},{"id":203,"year":2016,"period":"平成28年度秋期","num":4,"cat":"ストラテジ系","field":"PBP(回収期間)","summary":"PBP(回収期間)：平成28年度秋期 問4","correct":"エ","result":"","formula":"PBP=投資回収に要する年数(短いほど投資効果が高い)","howto":"各年のキャッシュインを累積し、投資額500に達するまでの年数を4シナリオで比較、最短のものを選ぶ","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>IT投資案件において、投資効果をPBP(Pay Back Period)で評価する。投資額が500のとき、期待できるキャッシュインの四つのシナリオa〜dのうち、PBPの効果が最も高いものはどれか。</p><table><tr><td></td><td>年目</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><td>a</td><td>キャッシュイン</td><td>100</td><td>150</td><td>200</td><td>250</td><td>300</td></tr><tr><td>b</td><td>キャッシュイン</td><td>100</td><td>200</td><td>300</td><td>200</td><td>100</td></tr><tr><td>c</td><td>キャッシュイン</td><td>200</td><td>150</td><td>100</td><td>150</td><td>200</td></tr><tr><td>d</td><td>キャッシュイン</td><td>300</td><td>200</td><td>100</td><td>50</td><td>50</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>投資額500に対する各シナリオの累積キャッシュインを計算する。</p><table><tr><td>シナリオ</td><td>1年目</td><td>2年目</td><td>3年目</td><td>4年目</td><td>5年目</td></tr><tr><td>a(累計)</td><td>100</td><td>250</td><td>450</td><td>700</td><td>950</td></tr><tr><td>b(累計)</td><td>100</td><td>300</td><td>600</td><td>800</td><td>900</td></tr><tr><td>c(累計)</td><td>200</td><td>350</td><td>450</td><td>600</td><td>800</td></tr><tr><td>d(累計)</td><td>300</td><td>500</td><td>600</td><td>650</td><td>700</td></tr></table><p>dは2年目の累計キャッシュインがちょうど500に達し、投資額を最短の2.0年で回収できる。aは3年目450・4年目で50/250=0.2年分を要し約3.2年、bは2年目300・3年目で200/300=0.67年分を要し約2.67年、cは3年目450・4年目で50/150=0.33年分を要し約3.33年となり、いずれもdより回収期間が長い。PBPは短いほど投資効果が高いと評価されるため、最も効果が高いのはdである。よって正解はエ。</p>","mnemonic":"「初年度300+2年目200でジャスト500」―dだけ頭金を厚くして2.0年でゴール、他は3年目以降までかかりPBPで完敗。"},{"id":204,"year":2016,"period":"平成28年度秋期","num":5,"cat":"ストラテジ系","field":"全社データモデル","summary":"全社データモデル：平成28年度秋期 問5","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>情報システムの全体計画立案のためにE-Rモデルを用いて全社のデータモデルを作成する手順はどれか。</p>","choices":[{"label":"ア","html":"管理層の業務から機能を抽出し，機能をエンティティとする。次に，機能の相互関係に基づいてリレーションシップを定義する。さらに，全社の帳票類を調査して整理し，正規化された項目に基づいて属性を定義し，全社のデータモデルとする。"},{"label":"イ","html":"企業の全体像を把握するために，主要なエンティティだけを抽出し，それらの相互間のリレーションシップを含めて，鳥瞰図を作成する。次に，エンティティを詳細化し，全てのリレーションシップを明確にしたものを全社のデータモデルとする。"},{"label":"ウ","html":"業務層の現状システムを分析し，エンティティとリレーションシップを抽出する。それぞれについて適切な属性を定め，これらを基にE-R図を作成し，それを抽象化して，全社のデータモデルを作成する。"},{"label":"エ","html":"全社のデータとその処理過程を分析し，重要な処理を行っている業務を基本エンティティとする。次に，基本エンティティ相互のデータの流れをリレーションシップとして捉え，適切な識別名を与える。さらに，基本エンティティと関係があるデータを属性とし，全社のデータモデルを作成する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>情報システムの全体計画（全社システム化計画）でデータモデルを作成する際は、現場レベルの詳細から積み上げるボトムアップ方式ではなく、まず企業全体を俯瞰するトップダウン方式が基本とされる。具体的には、企業の全体像を把握するために、まず主要な（基幹となる）エンティティだけを抽出し、それらの間の大まかなリレーションシップを含めた「鳥瞰図」（トップレベルのE-R図）を作成する。その後、各エンティティを段階的に詳細化し、属性や全てのリレーションシップを明確にしていくことで、整合性のとれた全社データモデルを完成させる。選択肢イはこの「鳥瞰図から詳細化へ」という正しい手順を説明している。選択肢アやエは、個別の業務や処理データを分析してエンティティ・属性を積み上げるボトムアップ的なアプローチであり、情報量が膨大になり全体整合性を欠きやすいため、全社計画の立案には不向きとされる。選択肢ウも現状システムの分析から始めるボトムアップ型であり、既存システムの制約に引きずられやすいという欠点がある。したがって全社計画立案のための正しい手順は選択肢イである。</p>","mnemonic":""},{"id":205,"year":2016,"period":"平成28年度秋期","num":6,"cat":"ストラテジ系","field":"LBO","summary":"LBO：平成28年度秋期 問6","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>LBOの説明はどれか。</p>","choices":[{"label":"ア","html":"株式市場で一般株主に対して，一定期間に一定の価格で株式を買い付けることを公告し，相手先企業の株式を取得する。"},{"label":"イ","html":"現経営陣や事業部門の責任者が株主から自社の株式を譲り受けることによって，当該事業の経営権を取得する。"},{"label":"ウ","html":"投資会社が，業績不振などの問題を抱えた企業の株式の過半数を取得した上で，マネジメントチームを派遣し，経営に参画する。"},{"label":"エ","html":"買収先企業の資産などを担保に，金融機関から資金を調達するなどして，限られた資金で企業を買収する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>LBO（Leveraged Buyout、レバレッジド・バイアウト）とは、買収する側が買収対象企業の資産や将来のキャッシュフローを担保として金融機関から多額の資金を借り入れ（レバレッジを効かせ）、少ない自己資金で企業買収を実現する手法である。借入金は株式調達より資本コストが低く、支払利息には税負担軽減効果もあるため、買収後の収益改善によって出資者のリターンを大きく高められる点が特徴とされる一方、買収後の業績が計画どおりに伸びなければ、借入金の返済負担が重くのしかかるリスクも指摘される。選択肢アは株式市場を通じた公開買付け、すなわちTOB（Take-Over Bid）の説明である。選択肢イは現経営陣が株主から自社株式を譲り受けて経営権を取得するMBO（Management Buyout）の説明であり、LBOの手法で資金調達されることもあるが、LBOそのものの定義ではない。選択肢ウは経営不振企業に投資会社が出資し経営再建に参画する、事業再生型投資の説明である。これらに対し選択肢エは「買収先企業の資産などを担保に、限られた資金で企業を買収する」とLBOの核心である借入による買収構造を正確に説明しており、正解となる。</p>","mnemonic":""},{"id":206,"year":2016,"period":"平成28年度秋期","num":7,"cat":"ストラテジ系","field":"環境分析フレームワーク","summary":"環境分析フレームワーク：平成28年度秋期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>環境分析の代表的なフレームワークについて，外部環境を分析するものと内部環境を分析するもので整理した図のcに当てはまるものはどれか。ここで，ア〜エはa〜dのいずれかに対応する。図は，外部環境分析の欄にa，bの二つの枠があり，内部環境分析の欄にVRIO分析とdの二つの枠がある。その下に両方の欄にまたがる形で3C分析の枠があり，さらにその下に両方の欄にまたがる形でcの枠がある。</p>","choices":[{"label":"ア","html":"PEST分析"},{"label":"イ","html":"SWOT分析"},{"label":"ウ","html":"バリューチェーン分析"},{"label":"エ","html":"ファイブフォース分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>経営戦略の策定でよく使われる環境分析フレームワークは、大きく「外部環境分析」と「内部環境分析」に分類される。外部環境分析には、政治・経済・社会・技術という4つのマクロ要因を捉えるPEST分析と、業界内の競争構造（新規参入、代替品、既存競合、供給者や買い手の交渉力）を分析するファイブフォース分析が該当する。内部環境分析には、自社の経営資源の競争優位性を経済価値・希少性・模倣困難性・組織の4要素で評価するVRIO分析と、調達・製造・物流・販売・サービスなど自社の活動ごとにどこで付加価値や利益が生まれているかを可視化するバリューチェーン分析が該当する。さらに、顧客（Customer）・競合（Competitor）・自社（Company）という外部と内部の視点を統合する3C分析があり、その延長線上で自社内部の価値創出プロセスをより詳細に掘り下げる手法としてバリューチェーン分析が位置付けられる。設問の図ではVRIO分析とバリューチェーン分析がともに自社の内部環境・強みを掘り下げる手法として扱われ、PEST分析とファイブフォース分析が外部環境側（a，b）に入ることになるため、3C分析の下に続く「c」にはバリューチェーン分析（ウ）が当てはまる。</p>","mnemonic":""},{"id":207,"year":2016,"period":"平成28年度秋期","num":8,"cat":"ストラテジ系","field":"コアコンピタンス","summary":"コアコンピタンス：平成28年度秋期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>コアコンピタンスに該当するものはどれか。</p>","choices":[{"label":"ア","html":"主な事業ドメインの高い成長率"},{"label":"イ","html":"競合他社よりも効率性が高い生産システム"},{"label":"ウ","html":"参入を予定している事業分野の競合状況"},{"label":"エ","html":"収益性が高い事業分野での市場シェア"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コアコンピタンス（Core Competence）は、G.ハメルとC.K.プラハラードが提唱した概念で、企業が持つ、競合他社には容易に模倣されない中核的な強み・能力を指す。コアコンピタンスとして認められるための代表的な条件として、(1)顧客に対して明確な価値をもたらすこと、(2)競合他社が容易に模倣できないこと、(3)複数の製品・市場に応用・展開できること、の3点が挙げられる。選択肢イの「競合他社よりも効率性が高い生産システム」は、まさに他社が簡単には真似できない独自の技術・ノウハウに基づく強みであり、複数の製品分野に応用可能な能力でもあるため、コアコンピタンスの典型例といえる（代表例として、ホンダのエンジン技術やソニーの小型化技術などが挙げられる）。これに対し選択肢ア・ウ・エはいずれも「成長率」「競合状況」「市場シェア」といった市場や事業の外部的・結果的な指標であり、自社固有の能力そのものを表すものではないため、コアコンピタンスには該当しない。したがって正解はイ。</p>","mnemonic":""},{"id":208,"year":2016,"period":"平成28年度秋期","num":9,"cat":"ストラテジ系","field":"ブルーオーシャン戦略","summary":"ブルーオーシャン戦略：平成28年度秋期 問9","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ブルーオーシャン戦略の特徴はどれか。</p>","choices":[{"label":"ア","html":"価値を高めながらコストを押し下げる。"},{"label":"イ","html":"既存の市場で競争する。"},{"label":"ウ","html":"既存の需要を喚起する。"},{"label":"エ","html":"競合他社を打ち負かす。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ブルーオーシャン戦略は、INSEAD（欧州経営大学院）のW.チャン・キムとレネ・モボルニュが2005年の著書で提唱した戦略理論で、競合がひしめく既存市場（レッドオーシャン）を抜け出し、競争のない未開拓の新市場（ブルーオーシャン）を切り開くことを目指す。その中核概念が「バリューイノベーション」であり、これは顧客にとっての価値（バリュー）を飛躍的に高めると同時に、コストを押し下げることを両立させる発想である。つまり、従来「価値を高めればコストが上がる、コストを下げれば価値が下がる」というトレードオフを前提としてきた競争戦略の常識を覆し、価値向上とコスト削減を同時に実現する点がブルーオーシャン戦略の最大の特徴であり、選択肢アが正解となる。選択肢イ（既存市場での競争）、エ（競合他社を打ち負かす）はいずれも既存市場内での競争を前提としたレッドオーシャン型の発想であり、ブルーオーシャン戦略とは対極にある。選択肢ウの「既存の需要を喚起する」も既存市場の枠内での発想であり、ブルーオーシャン戦略が目指す「新しい需要の創造」とは異なる。</p>","mnemonic":""},{"id":209,"year":2016,"period":"平成28年度秋期","num":10,"cat":"ストラテジ系","field":"FSP","summary":"FSP：平成28年度秋期 問10","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>FSP（Frequent Shoppers Program）の説明はどれか。</p>","choices":[{"label":"ア","html":"Webサイトの閲覧者が掲載広告のリンク先であるECサイトで商品を購入した場合，広告主からそのWebサイト運営者に成果報酬を支払う仕組みである。"},{"label":"イ","html":"期間を限定した値引きの販売施策を見直し，コスト削減によるローコストオペレーションを実現させて，恒常的な低価格戦略を展開することである。"},{"label":"ウ","html":"顧客に会員カードなどを発行して購買情報を収集し，顧客には割引ポイントの付与や会員割引の特典を与えるなど，優良顧客の維持拡大を図る仕組みである。"},{"label":"エ","html":"顧客の購買行動における，直近購買日，購買頻度，購買金額の3要素を用いて，優良顧客のセグメンテーションなどを行う顧客分析手法のことである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>FSP（Frequent Shoppers Program）は、1990年代に米国の小売・スーパーマーケット業界で広がった顧客戦略の一つで、会員カード（ポイントカードなど）を通じて個々の顧客の購買データを収集し、購買実績・頻度に応じてポイント付与や割引などの特典を提供することで、優良顧客（ロイヤルティの高い顧客）の維持・育成を図る仕組みである。単なる一時的な値引き販売とは異なり、継続的な購買データの蓄積と分析に基づいて顧客との関係を長期的に強化する点が特徴とされる。選択肢ウはこの「会員カードによる購買情報収集」と「優良顧客の維持拡大」という核心を正確に説明しており、正解となる。選択肢エは購買の最近性（Recency）・頻度（Frequency）・金額（Monetary）の3要素で顧客をセグメント化するRFM分析の説明であり、FSPで集めたデータの分析手法の一つではあるがFSPそのものの定義ではない。選択肢イは低価格戦略（EDLPなど）の説明、選択肢アはアフィリエイト広告の成果報酬の説明であり、いずれもFSPとは異なる概念である。</p>","mnemonic":""},{"id":210,"year":2016,"period":"平成28年度秋期","num":11,"cat":"ストラテジ系","field":"セグメンテーション変数","summary":"セグメンテーション変数：平成28年度秋期 問11","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>消費者市場のセグメンテーション変数のうち，行動的変数はどれか。</p>","choices":[{"label":"ア","html":"社会階層，ライフスタイル"},{"label":"イ","html":"使用頻度，ロイヤルティ"},{"label":"ウ","html":"都市規模，人口密度"},{"label":"エ","html":"年齢，職業"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>消費者市場のセグメンテーションでは、一般に地理的変数、人口動態変数、心理的変数、行動的変数という4つの切り口が使われる。このうち行動的変数（行動変数）は、製品やサービスに対する消費者の実際の行動パターンに基づく分類であり、具体的には購入のタイミング、使用頻度、求めるベネフィット、ブランドへのロイヤルティ（愛顧度）、利用者ステータスなどが指標となる。選択肢イの「使用頻度，ロイヤルティ」はまさにこの行動的変数の代表例であり、正解となる。選択肢アの「社会階層，ライフスタイル」は、価値観や生き方に注目する心理的変数（サイコグラフィック変数）に分類される。選択肢エの「年齢，職業」は、客観的な属性情報に基づく人口動態変数の典型例である。選択肢ウの「都市規模，人口密度」は、居住地域の特性に注目する地理的変数に分類され、いずれも行動的変数とは異なるカテゴリに属する。</p>","mnemonic":""},{"id":211,"year":2016,"period":"平成28年度秋期","num":12,"cat":"ストラテジ系","field":"キャズム理論","summary":"キャズム理論：平成28年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ジェフリー・A・ムーアはキャズム理論において，利用者の行動様式に変化を強いるハイテク製品では，イノベータ理論の五つの採用者区分の間に断絶があると主張し，その中でも特に乗り越えるのが困難な深く大きな溝を“キャズム”と呼んでいる。“キャズム”が存在する場所はどれか。</p>","choices":[{"label":"ア","html":"イノベータとアーリーアダプタの間"},{"label":"イ","html":"アーリーアダプタとアーリーマジョリティの間"},{"label":"ウ","html":"アーリーマジョリティとレイトマジョリティの間"},{"label":"エ","html":"レイトマジョリティとラガードの間"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>キャズム理論は、米国のコンサルタントであるジェフリー・A・ムーアが1991年の著書『Crossing the Chasm』で提唱した理論で、E.M.ロジャースのイノベータ理論（普及学）をベースにしている。ロジャースは採用者をイノベータ（革新者、市場の約2.5%）、アーリーアダプタ（初期採用者、約13.5%）、アーリーマジョリティ（前期追随者、約34%）、レイトマジョリティ（後期追随者、約34%）、ラガード（採用遅滞者）の5区分に分類し、滑らかなベルカーブで普及が進むモデルを示したが、ムーアは特に利用者に行動様式の変化を強いるハイテク製品において、初期市場（イノベータ・アーリーアダプタ）とメインストリーム市場（アーリーマジョリティ以降）の間に、価値観やニーズの違いに起因する深く大きな溝（キャズム）が存在すると主張した。初期市場の顧客が「新しさ」や技術的な先進性を重視するのに対し、メインストリーム市場の顧客は実用性や信頼性、既存業務への適合を重視するため、この間を越えられずに失速するハイテク製品が多いとされる。したがって、キャズムが存在する場所は「アーリーアダプタとアーリーマジョリティの間」であり、選択肢イが正解となる。</p>","mnemonic":""},{"id":212,"year":2016,"period":"平成28年度秋期","num":13,"cat":"ストラテジ系","field":"CSF分析","summary":"CSF分析：平成28年度秋期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>経営戦略に用いるCSF分析で明らかになるものはどれか。</p>","choices":[{"label":"ア","html":"業界内の競争に影響する要因と，自社の強み"},{"label":"イ","html":"競争環境の脅威と機会，企業の強み・弱み"},{"label":"ウ","html":"成功するための重要な機能や特性"},{"label":"エ","html":"保有する事業の成長性と収益性"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CSF（Critical Success Factor、重要成功要因）分析は、企業や事業が競争を勝ち抜き、目標（KGI）を達成するために、特に重視し注力すべき少数の重要な要因・機能・特性を明らかにするための経営戦略の分析手法である。SWOT分析などで現状を分析した上で、自社の事業戦略の中で「何が成功のカギを握るか」を絞り込み、具体的なアクションやKPIに落とし込んでいく際の土台として用いられる。選択肢ウの「成功するための重要な機能や特性」はまさにこのCSF分析の定義そのものであり、正解となる。選択肢アの「業界内の競争に影響する要因と自社の強み」はファイブフォース分析と自社分析を組み合わせたような内容であり、選択肢イの「競争環境の脅威と機会、企業の強み・弱み」はSWOT分析の説明である。選択肢エの「保有する事業の成長性と収益性」は、プロダクト・ポートフォリオ・マネジメント（PPM）などで用いられる視点であり、いずれもCSF分析そのものの説明ではない。</p>","mnemonic":""},{"id":213,"year":2016,"period":"平成28年度秋期","num":14,"cat":"ストラテジ系","field":"SECIモデル","summary":"SECIモデル：平成28年度秋期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>図は，SECIモデルの知識変換プロセスに基づき，製造現場において，熟練工の技能を若手技能者に伝承する例を示したものである。dに該当する活動はどれか。ここで，ア〜エは，a〜dのいずれかに該当する。図は，共同化（Socialization）からaを経て表出化（Externalization）へ，表出化からbを経て連結化（Combination）へ，連結化からcを経て内面化（Internalization）へ，内面化からdを経て再び共同化へ戻る、というサイクルを示している。</p>","choices":[{"label":"ア","html":"現場作業やOJTを通じて，熟練工と若手技能者間において製造のための知識や課題を確認するとともに，文書化されていない技能の存在を認識する。"},{"label":"イ","html":"熟練工がもつ技能のうち，文章，図表，数式によって表現が可能なものを熟練工と若手技能者間において確認しながら作業手順書などの文書にまとめる。"},{"label":"ウ","html":"若手技能者が，得られた知識をデータベースに記録し，これらを整理・分類し，組み合わせることによって，新しい作業手順を生み出す。"},{"label":"エ","html":"若手技能者が，得られた知識を基に実際の作業を繰り返し経験することによって，知識を自分の技能として体得する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SECIモデルは、野中郁次郎と竹内弘高が提唱した組織的知識創造理論で、個人が持つ言語化しにくい暗黙知と、言語や図表で表現できる形式知が、共同化（Socialization）→表出化（Externalization）→連結化（Combination）→内面化（Internalization）という4つのプロセスを経て、スパイラル状に変換・拡大していくと説明する。共同化は現場での経験共有（OJTなど）を通じて暗黙知を暗黙知のまま伝える段階、表出化は熟練者の暗黙知を言葉や図表・数式として形式知化する段階、連結化は複数の形式知を組み合わせ、データベース化・体系化してより高次の形式知（作業手順書など）を生み出す段階である。そして内面化は、体系化された形式知（作業手順やマニュアル）を個人が実際の作業として繰り返し実践することで、自分自身の新たな暗黙知（スキル・勘）として体得する段階であり、これが次の共同化の出発点となって知識創造のスパイラルが続いていく。設問の図では、連結化の後に続く内面化（d）に該当する活動が問われており、選択肢エの「若手技能者が、得られた知識を基に実際の作業を繰り返し経験することによって、知識を自分の技能として体得する」がこれに一致するため、正解はエとなる。選択肢アは共同化、イは表出化、ウは連結化の活動にそれぞれ対応する。</p>","mnemonic":""},{"id":214,"year":2016,"period":"平成28年度秋期","num":15,"cat":"ストラテジ系","field":"TRIZ","summary":"TRIZ：平成28年度秋期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>特許を分析して生まれた問題解決技法であり，問題（矛盾）を創造的・発明的に解決するための弁証法的な思考法を具体的な方法論にまとめたものはどれか。</p>","choices":[{"label":"ア","html":"QFD"},{"label":"イ","html":"TRIZ"},{"label":"ウ","html":"シックスシグマ"},{"label":"エ","html":"親和図法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TRIZ（トリーズ）は、旧ソ連の発明家・特許審査官であったゲンリッヒ・アルトシュラーが、膨大な数の特許文献を分析し、発明に共通するパターン（発明原理）を体系化して生み出した問題解決の方法論であり、ロシア語“Teoriya Resheniya Izobretatelskikh Zadatch”（発明的課題解決理論）の頭文字をとった名称である。TRIZの中心的な発想は、ある特性を改善しようとすると別の特性が悪化してしまうという「矛盾」（管理的矛盾・工学的矛盾・物理的矛盾）を、トレードオフとして妥協するのではなく、矛盾そのものを解消する形で創造的・発明的に解決しようとする点にあり、この考え方は対立する要素を統合して新たな次元で解決を図る弁証法的な思考と通じるものとされる。具体的な方法論として、矛盾を整理するための「矛盾マトリクス」や、過去の発明に共通する「40の発明原理」といった実践的なツールが用意されている。選択肢アのQFD（品質機能展開）は顧客要求を技術特性に変換する手法、選択肢ウのシックスシグマは統計的品質管理手法、選択肢エの親和図法はアイデアや意見をグルーピングして整理する発想整理の手法であり、いずれも「特許分析から生まれた、矛盾を創造的に解決する弁証法的方法論」という設問の内容には一致しない。したがって正解はイのTRIZ。</p>","mnemonic":""},{"id":215,"year":2016,"period":"平成28年度秋期","num":16,"cat":"ストラテジ系","field":"XBRL","summary":"XBRL：平成28年度秋期 問16","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>XBRLを説明したものはどれか。</p>","choices":[{"label":"ア","html":"企業内又は企業間で使用される複数の業務システムを連携させることであり，データやビジネスプロセスの効率的な統合が可能となる。"},{"label":"イ","html":"小売店の端末からネットワーク経由で発注を行うことによって，迅速かつ正確な発注作業が実現でき，リードタイムの短縮や受発注業務の効率向上が可能となる。"},{"label":"ウ","html":"財務報告用の情報の作成・流通・利用ができるように標準化した言語であり，適用業務パッケージやプラットフォームに依存せずに財務情報の利用が可能となる。"},{"label":"エ","html":"通信プロトコルやデータフォーマットの標準的な規約を定めることによって，企業間での受発注，決済，入出荷などの情報の電子的な交換が可能となる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>XBRL（eXtensible Business Reporting Language）は、財務諸表などの財務報告情報を電子的に作成・流通・利用できるように標準化された、XMLをベースとするコンピュータ言語である。財務諸表の各数値項目に、勘定科目などを定義する「タクソノミ」に基づいたタグを付与することで、どの企業のどの報告書であっても共通の形式でデータを扱えるようになり、特定の業務パッケージやプラットフォームに依存せずに財務情報を作成・流通・再利用できる点が最大の特徴である。日本では金融庁の開示システムEDINETが2008年度からXBRL形式での有価証券報告書等の提出を義務付けており、作成者側は一度データをXBRL化すれば報告書作成の効率化が図れ、利用者側はデータを機械的にダウンロード・分析しやすくなるという利点がある。選択肢ウはこのXBRLの目的と特徴を正確に説明しており、正解となる。選択肢アはEAI（Enterprise Application Integration）、選択肢イはEOS（電子発注システム）、選択肢エはEDI（電子データ交換）の説明であり、いずれも財務報告の標準化言語であるXBRLとは異なる概念である。</p>","mnemonic":""},{"id":216,"year":2016,"period":"平成28年度秋期","num":17,"cat":"ストラテジ系","field":"ボランタリーチェーン","summary":"ボランタリーチェーン：平成28年度秋期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ボランタリーチェーンを説明したものはどれか。</p>","choices":[{"label":"ア","html":"加盟店が一定のロイヤルティを本部に支払って，本部の経営ノウハウ，商標，サービスマークなどを用いて販売活動を行う。"},{"label":"イ","html":"生産者・卸売業者・小売業者の間で，購買，生産，販売及び物流の一連の業務を全体最適の視点から見直し，納期短縮や在庫削減を図る。"},{"label":"ウ","html":"複数の小売業者が独立性を維持しながら，一つのグループとして，仕入れ，宣伝，販売促進などを共同で行う。"},{"label":"エ","html":"本部が複数店舗の仕入れを一括して行い，各店舗は本部の経営方針に基づいた販売活動に専念する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ボランタリーチェーンとは、本来は独立した事業者である複数の小売業者（または卸売業者）が、それぞれの経営の独立性・自主性を維持したまま、仕入れ・宣伝・販売促進などの特定の機能を一つのグループとして共同で行う組織形態である。主に問屋（卸売業者）が主導して小売店を組織化する「卸主宰型」と、小売業者同士が自主的に結集する「小売主宰型」があるとされる。フランチャイズチェーンとの大きな違いは、フランチャイズでは本部が強い決定権を持ち、加盟店はロイヤルティを支払って本部のノウハウ・商標の下で統一的に活動するのに対し、ボランタリーチェーンでは加盟店同士の結びつきが比較的緩やかで、各店舗が独自性・裁量を保ちながら共同仕入れによるコスト削減やスケールメリットを追求する点にある。選択肢ウは「独立性を維持しながら一つのグループとして仕入れ・宣伝・販売促進を共同で行う」というボランタリーチェーンの核心を的確に表しており、正解となる。選択肢アはフランチャイズチェーン、選択肢エはレギュラーチェーン（コーポレートチェーン）、選択肢イはSCM（サプライチェーンマネジメント）の説明に相当する。</p>","mnemonic":""},{"id":217,"year":2016,"period":"平成28年度秋期","num":18,"cat":"ストラテジ系","field":"TOC","summary":"TOC：平成28年度秋期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>TOCの特徴はどれか。</p>","choices":[{"label":"ア","html":"個々の工程を個別に最適化することによって，生産工程全体を最適化する。"},{"label":"イ","html":"市場の需要が供給能力を下回っている場合に有効な理論である。"},{"label":"ウ","html":"スループット（＝売上高－資材費）の増大を最重要視する。"},{"label":"エ","html":"生産プロセス改善のための総投資額を制約条件として確立された理論である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TOC（Theory of Constraints、制約条件の理論）は、イスラエルの物理学者エリヤフ・ゴールドラット博士が1984年の著書『ザ・ゴール』で提唱した経営改善理論であり、「組織全体の成果は、最も弱い制約（ボトルネック）によって決まる」という考え方に立ち、個々の工程をばらばらに最適化するのではなく、全体のボトルネックに焦点を当てて集中的に改善することを重視する。TOCでは組織の業績を測る指標として、スループット（＝売上高－資材費、すなわち製品・サービスの販売を通じて新たに生み出すお金）、在庫、業務費用の3つを用い、その中でも特にスループットの増大を最も重要視し、次いで在庫削減、業務費用削減の順に意思決定を行うとされる。選択肢ウの「スループット（＝売上高－資材費）の増大を最重要視する」はこのTOCの中核的な考え方を正確に表しており、正解となる。選択肢アは個々の工程の個別最適化を重視する従来型の発想であり、ボトルネックに着目するTOCとは逆の発想である。選択肢イ・エについても、TOCは需要と供給の大小関係や総投資額そのものを制約条件として確立された理論ではなく、工程上のボトルネック（制約）に着目する理論であるため、いずれも誤りである。</p>","mnemonic":""},{"id":218,"year":2016,"period":"平成28年度秋期","num":19,"cat":"ストラテジ系","field":"BCM/レジリエンス","summary":"BCM/レジリエンス：平成28年度秋期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>BCM（Business Continuity Management）において考慮すべきレジリエンスの説明はどれか。</p>","choices":[{"label":"ア","html":"競争力の源泉となる，他社に真似のできない自社固有の強み"},{"label":"イ","html":"想定される全てのリスクを回避して事業継続を行う方針"},{"label":"ウ","html":"大規模災害などの発生時に事業の継続を可能とするために事前に策定する計画"},{"label":"エ","html":"不測の事態が生じた場合の組織的対応力や，支障が生じた事業を復元させる力"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BCM（Business Continuity Management、事業継続マネジメント）は、大規模災害やシステム障害などの不測の事態が発生した際にも、重要な事業を中断させない、あるいは中断しても目標復旧時間内に再開できるようにするためのマネジメント活動全般を指し、その中核となる計画がBCP（事業継続計画）である。BCMにおいて考慮すべき「レジリエンス」は、英語のresilience（回復力・弾力性）に由来し、不測の事態によって事業や組織が受けた打撃に対し、組織としてしなやかに対応し、被害を受けた事業を元の状態に復元させる力、すなわち組織的な対応力・復元力を意味する概念として位置づけられる。近年の研究では、BCMは単に被害を事前に防ぐ・回避するだけでなく、不確実性の高い事態に柔軟に対応し回復する「組織レジリエンス」を高めるための枠組みの一つとして位置づけられている。選択肢エの「不測の事態が生じた場合の組織的対応力や，支障が生じた事業を復元させる力」はこのレジリエンスの定義そのものであり、正解となる。選択肢アはコアコンピタンスの説明、選択肢ウはBCP（事業継続計画）そのものの説明であり、選択肢イの「全てのリスクを回避する」という発想は、むしろ不測の事態の発生を前提に対応力を高めるレジリエンスの考え方とは相容れない。</p>","mnemonic":""},{"id":219,"year":2016,"period":"平成28年度秋期","num":20,"cat":"ストラテジ系","field":"コンピテンシモデル","summary":"コンピテンシモデル：平成28年度秋期 問20","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>コンピテンシモデルの説明はどれか。</p>","choices":[{"label":"ア","html":"権限行使と命令統制による労務管理を批判し，目標管理制度や経営参加制度などによる動機付けが有効であるとしたもの"},{"label":"イ","html":"最適なリーダシップの唯一のスタイルは存在せず，望ましいリーダシップのスタイルは，状況に応じて異なるとしたもの"},{"label":"ウ","html":"人材の評価や育成の基準とするために，恒常的に成果に結び付けることができる個人の行動や思考特性を定義したもの"},{"label":"エ","html":"人間の基本的欲求を低次から，生理的欲求，安全の欲求，所属と愛の欲求，承認の欲求，自己実現の欲求としたもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コンピテンシ（コンピテンシー）とは、特定の職務や役割において継続的に高い成果を生み出す人材に共通して見られる行動特性（およびその背後にある思考特性）を指す概念で、1990年代半ば以降、日本企業でも高業績者の行動を分析・言語化し、人材の採用・評価・育成の基準として活用する動きが広がった。コンピテンシモデルは、こうした「恒常的に高い成果に結びつく行動・思考特性」を定義し、体系化したものであり、各企業・各職務ごとに固有のモデルとして構築される点が特徴である。選択肢ウの「人材の評価や育成の基準とするために，恒常的に成果に結び付けることができる個人の行動や思考特性を定義したもの」はこの定義と一致しており、正解となる。選択肢アは目標管理制度などによる動機付けを重視する労務管理批判の説明、選択肢イはコンティンジェンシー理論（状況適合理論）に基づくリーダーシップ論の説明、選択肢エはマズローの欲求五段階説の説明であり、いずれもコンピテンシモデルとは異なる理論である。</p>","mnemonic":""},{"id":220,"year":2016,"period":"平成28年度秋期","num":21,"cat":"ストラテジ系","field":"ハロー効果","summary":"ハロー効果：平成28年度秋期 問21","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>人事考課の際，考課者が陥りやすい傾向の説明のうち，ハロー効果を説明したものはどれか。</p>","choices":[{"label":"ア","html":"考課者の自信欠如や個人的感情から，評価が甘くなってしまうこと"},{"label":"イ","html":"事実を確認せずに，論理的に関係がある項目に対して同等の評価をすること"},{"label":"ウ","html":"評価項目の一部が飛び抜けて高いと，他の項目も根拠なく高評価になること"},{"label":"エ","html":"部下の勤務状況を十分に把握していないので，評価が標準に集中してしまうこと"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ハロー効果（光背効果・後光効果）とは、人事考課において考課者が陥りやすい評価エラーの一つで、評価対象者のある一つの特徴的に目立つ特性（例えば営業成績の高さなど）に引きずられて、本来は別々に評価すべき他の評価項目についても、根拠なく高く（あるいは低く）評価してしまう心理的現象を指す。このうち、一部の優れた点につられて全体評価を実際以上に高くしてしまう場合を「ポジティブ・ハロー効果」、逆に一つの悪い点につられて全体を低く評価してしまう場合を「ネガティブ・ハロー効果」と呼ぶ。選択肢ウの「評価項目の一部が飛び抜けて高いと，他の項目も根拠なく高評価になること」は、まさにこのポジティブ・ハロー効果の典型的な説明であり、正解となる。選択肢アは自信欠如や個人的感情による評価の甘さを説明したもので「寛大化傾向」に近く、選択肢イは「論理的誤差」（関連がありそうな項目を同じように評価してしまう誤り）の説明、選択肢エは「中心化傾向」（評価が標準・平均に集中してしまう誤り）の説明であり、いずれもハロー効果とは異なる評価エラーである。対策としては、評価基準を明確にして周知する、複数の評価者による多面的な評価を行う、思い込みではなく事実に基づいて評価することなどが挙げられる。</p>","mnemonic":""},{"id":221,"year":2016,"period":"平成28年度秋期","num":22,"cat":"ストラテジ系","field":"連結売上高","summary":"連結売上高：平成28年度秋期 問22","correct":"ア","result":"","formula":"連結売上高=連結対象各社の売上高合計－グループ内取引高(支配力のない出資先は連結対象外)","howto":"80%・60%保有は子会社化で連結対象、役員派遣もない20%保有のD社は連結対象外。親子間取引のみ相殺消去する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>次の条件においてA社の連結損益計算書を作成した場合の連結売上高は何億円か。</p><p>〔条件〕</p><ul><li>A社は、B社の株式の80%を取得している。</li><li>B社は、C社の株式の60%を取得している。</li><li>B社は、D社の株式の20%を取得している。ただし、役員の派遣などはない。</li><li>A社の売上高は、7,000億円であり、その10%は、B社に対するものである。</li><li>B社の売上高は、3,500億円であり、その20%は、D社に対するものである。</li><li>C社の売上高は、2,500億円である。</li><li>D社の売上高は、2,000億円である。</li><li>A社とB社、B社とD社以外の相互間取引はない。</li></ul>","choices":[{"label":"ア","html":"12,300"},{"label":"イ","html":"13,000"},{"label":"ウ","html":"13,600"},{"label":"エ","html":"14,300"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>連結の範囲を判定する。A社はB社株式の80%を保有し支配関係があるため、B社は連結子会社となる。B社はC社株式の60%を保有しており、C社も間接的にA社グループの連結子会社となる。一方、B社のD社への出資比率は20%で役員派遣などの支配の実態もないため、D社は連結の範囲に含めない。</p><p>連結売上高は、連結対象となるA社・B社・C社の売上高を合算し、グループ内取引(A社→B社の売上)のみを相殺消去して求める。B社→D社の売上は、D社が連結対象外であるため外部売上として扱い、相殺しない。</p><p>A社売上高7,000億円のうちB社向けは7,000×10%=700億円。</p><p>連結売上高=7,000(A社)+3,500(B社)+2,500(C社)－700(A社→B社の内部取引消去)=12,300億円</p><p>よって正解はア。</p>","mnemonic":"「ナナセン・サンゴー・ニゴーを足して700だけ引く」―7,000+3,500+2,500からA→B向け10%の700億だけ消せば12,300、Dは20%でも仲間外れ。"},{"id":222,"year":2016,"period":"平成28年度秋期","num":23,"cat":"ストラテジ系","field":"下請代金支払遅延等防止法","summary":"下請代金支払遅延等防止法：平成28年度秋期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ソフトウェア開発を下請事業者に委託する場合，下請代金支払遅延等防止法に照らして，禁止されている行為はどれか。</p>","choices":[{"label":"ア","html":"継続的な取引が行われているので，支払条件，支払期日等を記載した書面をあらかじめ交付し，個々の発注書面にはその事項の記載を省略する。"},{"label":"イ","html":"顧客が求める仕様が確定していなかったので，発注の際に，下請事業者に仕様が未記載の書面を交付し，仕様が確定した時点では，内容を書面ではなく口頭で伝えた。"},{"label":"ウ","html":"顧客の都合で，仕様変更の必要が生じたので，下請事業者と協議の上，発生する費用の増加分を下請代金に加算することで仕様変更に応じてもらう。"},{"label":"エ","html":"振込手数料を下請事業者が負担する旨を発注前に書面で合意したので，親事業者が負担した実費の範囲内で振込手数料を差し引いて下請代金を支払う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>下請代金支払遅延等防止法（下請法）は、親事業者による下請事業者への優越的地位の濫用を防止するための法律で、資本金区分などの要件を満たすソフトウェア開発の委託（情報成果物作成委託）もこの法律の対象となる。下請法第3条は、親事業者に対し、発注と同時に、給付の内容（具体的な仕様）、下請代金の額、支払期日、支払方法などの法定事項を記載した書面を直ちに下請事業者へ交付する義務を課しており、これは下請事業者が不利な条件を一方的に押し付けられることを防ぐための重要な規定である。選択肢イのように、仕様が確定していないことを理由に仕様未記載の書面で発注し、仕様が確定した後もその内容を書面化せず口頭で伝えるという行為は、この書面交付義務に反する行為であり、下請法上禁止されている。選択肢アは、継続的取引において支払条件などの基本事項を記載した書面をあらかじめ交付し、個々の発注書面では重複記載を省略するという運用であり、公正取引委員会の規則上認められた適正な書面交付の方法である。選択肢ウは、顧客都合の仕様変更に伴う追加費用をきちんと下請事業者と協議の上で下請代金に反映させるものであり、むしろ「買いたたき」を防ぐ適正な対応といえる。選択肢エも、振込手数料の負担について発注前に書面で合意し、実費の範囲内で差し引く扱いであるため適法であり、禁止行為には当たらない。</p>","mnemonic":""},{"id":223,"year":2016,"period":"平成28年度秋期","num":24,"cat":"テクノロジ系","field":"シングルサインオン","summary":"シングルサインオン：平成28年度秋期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>シングルサインオンの実装方式の特徴のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"クッキーを使ったシングルサインオンの場合，サーバごとの認証情報を含んだクッキーをクライアントで生成し，各サーバ上で保存，管理する。"},{"label":"イ","html":"クッキーを使ったシングルサインオンの場合，認証対象のサーバを，異なるインターネットドメインに配置する必要がある。"},{"label":"ウ","html":"リバースプロキシを使ったシングルサインオンの場合，認証対象のWebサーバを，異なるインターネットドメインに配置する必要がある。"},{"label":"エ","html":"リバースプロキシを使ったシングルサインオンの場合，利用者認証においてパスワードの代わりにディジタル証明書を用いることができる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>シングルサインオン（SSO）の代表的な実装方式には、クッキー（Cookie）を利用する方式と、リバースプロキシを利用する方式がある。クッキー方式は、Webブラウザが保持するクッキーがドメイン単位でスコープ管理される（同一ドメインの範囲でしか共有されない）という性質を利用するため、SSOの対象となる複数のサーバは、クッキーを共有できるよう同一のインターネットドメイン（またはその配下のサブドメイン）に配置する必要があり、異なるドメインにまたがる場合はクッキーだけでは認証情報を共有できない。リバースプロキシ方式は、利用者のブラウザとバックエンドの各Webサーバとの間にリバースプロキシサーバを設置し、利用者からのアクセスを全てこのプロキシが代理で中継・認証する方式であり、プロキシが認証を一元的に処理するため、パスワードによる認証だけでなく、クライアント側のディジタル証明書（クライアント証明書）を用いた認証方式を利用者認証に組み込むことも可能である。選択肢エはこの「リバースプロキシ方式ではディジタル証明書をパスワードの代わりに利用者認証へ用いることができる」という特徴を正しく述べており、正解となる。選択肢アはクッキーの管理主体やその内容の説明が実態と異なり、選択肢イ・ウはクッキー方式・リバースプロキシ方式それぞれにおける「異なるドメインへの配置」の要否の説明が逆（クッキー方式こそ同一ドメインへの配置が必要）になっている点で誤りである。</p>","mnemonic":""},{"id":224,"year":2016,"period":"平成28年度秋期","num":25,"cat":"テクノロジ系","field":"WPA2/AES","summary":"WPA2/AES：平成28年度秋期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>無線LANのセキュリティ方式としてWPA2を選択するとき，利用される暗号化アルゴリズムはどれか。</p>","choices":[{"label":"ア","html":"AES"},{"label":"イ","html":"ECC"},{"label":"ウ","html":"RC4"},{"label":"エ","html":"RSA"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>WPA2（Wi-Fi Protected Access 2）は、無線LANのセキュリティ規格の一つであり、IEEE 802.11iに基づき、旧来のWEPやWPA（TKIP）が抱えていた脆弱性を解消するために策定された。WPA2では、暗号化プロトコルとしてCCMP（Counter mode with Cipher block chaining Message authentication code Protocol）が標準的に採用されており、このCCMPの中核をなす暗号化アルゴリズムがAES（Advanced Encryption Standard）である。AESは128ビットのブロック暗号であり、WEPやTKIPで使われていたストリーム暗号のRC4に比べて暗号強度が高く、より安全性の高い無線LAN通信を実現できることから、WPA2の暗号化アルゴリズムとしてはAESが用いられる（機器の設定画面でも「CCMP」ではなく「AES」と表記されることが多い）。選択肢ウのRC4は、WEPおよびWPA（TKIP）で使われていた旧来のストリーム暗号であり、WPA2では使用されない。選択肢イのECCと選択肢エのRSAはいずれも公開鍵暗号方式のアルゴリズムであり、デジタル証明書や鍵交換などには利用されるが、WPA2の無線LAN通信データそのものを暗号化する共通鍵暗号アルゴリズムではない。したがって正解はアのAES。</p>","mnemonic":""}]</script>
<script>
(function(){
"use strict";
var QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
var CATS = Array.from(new Set(QUESTIONS.map(function(q){return q.cat}))).sort();
var CAT_CLASS = {"テクノロジ系":"cat-tech","マネジメント系":"cat-mgmt","ストラテジ系":"cat-strat"};
var FIELDS = Array.from(new Set(QUESTIONS.map(function(q){return q.field}))).sort();
var YEARS = Array.from(new Set(QUESTIONS.map(function(q){return q.year}))).sort();

var STORE_KEY = 'stfull_progress_v1';
var state = loadState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(!s.checks) s.checks = {};
      // migrate from the old single-flag "あやふや" toggle, if present
      if(s.unsure){
        Object.keys(s.unsure).forEach(function(id){
          if(s.unsure[id] && !s.checks[id]) s.checks[id] = ['yellow'];
        });
        delete s.unsure;
      }
      // migrate single-color checks (one value per question) to multi-select arrays
      Object.keys(s.checks).forEach(function(id){
        if(typeof s.checks[id] === 'string') s.checks[id] = [s.checks[id]];
      });
      if(!s.answers) s.answers = {};
      return s;
    }
  }catch(e){}
  return {answers:{}, checks:{}};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var filter = {cats:new Set(), fields:new Set(), years:new Set(), checks:new Set()};
var queue = [];      // array of question ids for current session
var answeredInSession = new Set(); // ids answered during THIS session (so retry modes start fresh)
var qPos = 0;        // index into queue
var answeredThisQ = false;
var pickedLabel = null;

// ---------- auto-review mode ----------
var AUTO_KEY = 'stfull_auto_mode';
var AUTO_SEC_KEY = 'stfull_auto_seconds';
var AUTO_SEC_OPTIONS = [2, 3, 5, 8, 15];
var autoMode = false;
var autoSeconds = 15;
try{
  autoMode = localStorage.getItem(AUTO_KEY) === '1';
  var savedSec = parseInt(localStorage.getItem(AUTO_SEC_KEY) || '15', 10);
  if(savedSec > 0) autoSeconds = savedSec;
}catch(e){}
var autoTimeoutHandle = null;

function renderAutoUI(){
  document.getElementById('autoOffChip').classList.toggle('active', !autoMode);
  document.getElementById('autoOnChip').classList.toggle('active', autoMode);
  document.getElementById('autoSecRow').style.display = autoMode ? 'block' : 'none';
  var wrap = document.getElementById('autoSecChips');
  wrap.innerHTML = '';
  AUTO_SEC_OPTIONS.forEach(function(s){
    wrap.appendChild(chip(s+'秒', s===autoSeconds, function(){
      autoSeconds = s;
      try{ localStorage.setItem(AUTO_SEC_KEY, String(s)); }catch(e){}
      renderAutoUI();
    }));
  });
}
document.getElementById('autoOffChip').addEventListener('click', function(){
  autoMode = false;
  try{ localStorage.setItem(AUTO_KEY, '0'); }catch(e){}
  renderAutoUI();
});
document.getElementById('autoOnChip').addEventListener('click', function(){
  autoMode = true;
  try{ localStorage.setItem(AUTO_KEY, '1'); }catch(e){}
  renderAutoUI();
});

function clearAutoTimer(){
  if(autoTimeoutHandle){ window.clearTimeout(autoTimeoutHandle); autoTimeoutHandle = null; }
  var bar = document.getElementById('autoBar');
  if(bar) bar.style.display = 'none';
  var fill = document.getElementById('autoBarFill');
  if(fill){ fill.style.transition = 'none'; fill.style.width = '0%'; fill.classList.remove('advancing'); }
}
function startAutoBar(seconds, label, advancing, onDone){
  var bar = document.getElementById('autoBar');
  var fill = document.getElementById('autoBarFill');
  var lbl = document.getElementById('autoBarLabel');
  lbl.textContent = label;
  fill.classList.toggle('advancing', !!advancing);
  bar.style.display = 'block';
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth;
  fill.style.transition = 'width ' + seconds + 's linear';
  fill.style.width = '100%';
  autoTimeoutHandle = window.setTimeout(function(){
    autoTimeoutHandle = null;
    onDone();
  }, seconds * 1000);
}

var views = {};
['dash','quiz','jump','done'].forEach(function(v){ views[v]=document.getElementById('view-'+v); });
function showView(name){
  Object.keys(views).forEach(function(k){ views[k].classList.toggle('active', k===name); });
  window.scrollTo(0,0);
}

// ---------- theme toggle ----------
var THEME_KEY='stfull_theme';
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
(function(){ try{ var t=localStorage.getItem(THEME_KEY); if(t) applyTheme(t); }catch(e){} })();
document.getElementById('themeToggle').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  applyTheme(next);
  try{ if(next) localStorage.setItem(THEME_KEY,next); else localStorage.removeItem(THEME_KEY); }catch(e){}
});

// ---------- sound ----------
var SOUND_KEY='stfull_sound_muted';
var soundMuted = false;
try{ soundMuted = localStorage.getItem(SOUND_KEY)==='1'; }catch(e){}
var soundBtn = document.getElementById('soundToggle');
function renderSoundBtn(){ soundBtn.textContent = soundMuted ? '🔇' : '🔊'; }
renderSoundBtn();

var audioCtx = null;
function getCtx(){
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
  }catch(e){}
  return audioCtx;
}
function tone(ctx, t0, freq, dur, type, peak){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak||0.18, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.02);
  return osc;
}
function playTones(specs){
  try{
    var ctx = getCtx();
    if(!ctx) return;
    var fire = function(){
      try{
        var t0 = ctx.currentTime;
        specs.forEach(function(s){ tone(ctx, t0+s.at, s.freq, s.dur, s.type, s.peak); });
      }catch(e){}
    };
    if(ctx.state === 'suspended'){ ctx.resume().then(fire, fire); }
    else { fire(); }
  }catch(e){}
}
function playCorrectSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:880,    dur:0.16, type:'sine', peak:0.24},
    {at:0.1,  freq:1318.5, dur:0.26, type:'sine', peak:0.24}
  ]);
}
function playWrongSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:220,   dur:0.3,  type:'sawtooth', peak:0.16},
    {at:0.06, freq:174.6, dur:0.34, type:'sawtooth', peak:0.15}
  ]);
}
// unlock audio context on first touch/click anywhere (iOS requirement)
function unlockAudio(){
  var ctx = getCtx();
  if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
}
document.addEventListener('touchend', function once(){ unlockAudio(); document.removeEventListener('touchend', once); }, {once:true});
document.addEventListener('click', function once(){ unlockAudio(); document.removeEventListener('click', once); }, {once:true});

soundBtn.addEventListener('click', function(){
  soundMuted = !soundMuted;
  renderSoundBtn();
  try{ localStorage.setItem(SOUND_KEY, soundMuted?'1':'0'); }catch(e){}
  if(!soundMuted){ getCtx(); playCorrectSound(); }
});

// ---------- big stamp ----------
function flashBigStamp(correct){
  var el = document.getElementById('bigStamp');
  el.className = correct ? '' : 'wrong';
  el.innerHTML = correct
    ? '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20"></circle></svg>'
    : '<svg viewBox="0 0 52 52"><path d="M14 14 L38 38 M38 14 L14 38"></path></svg>';
  // force reflow so re-adding the class restarts the animation
  void el.offsetWidth;
  el.className = (correct ? '' : 'wrong ') + 'show';
  window.setTimeout(function(){ el.className = correct ? '' : 'wrong'; }, 950);
}

// ---------- stats ----------
function computeStats(){
  var answered=0, correct=0, wrong=0, checked=0;
  QUESTIONS.forEach(function(q){
    var a = state.answers[q.id];
    if(a){ answered++; if(a.correct) correct++; else wrong++; }
    if(state.checks[q.id] && state.checks[q.id].length) checked++;
  });
  return {answered:answered, correct:correct, wrong:wrong, checked:checked, fresh:QUESTIONS.length-answered};
}
function idsWrong(){ return QUESTIONS.filter(function(q){var a=state.answers[q.id]; return a && !a.correct}).map(function(q){return q.id}); }
function isChecked(id, color){ var c = state.checks[id]; return !!c && c.indexOf(color)>=0; }
function idsChecked(){ return QUESTIONS.filter(function(q){var c=state.checks[q.id]; return c && c.length>0;}).map(function(q){return q.id}); }
function idsByCheck(color){ return QUESTIONS.filter(function(q){return isChecked(q.id, color);}).map(function(q){return q.id}); }
function idsFresh(){ return QUESTIONS.filter(function(q){return !state.answers[q.id]}).map(function(q){return q.id}); }

function renderDash(){
  var s = computeStats();
  document.getElementById('statAnswered').textContent = s.answered;
  document.getElementById('statTotal').textContent = QUESTIONS.length;
  document.getElementById('statCorrect').textContent = s.correct;
  document.getElementById('statWrong').textContent = s.wrong;
  document.getElementById('statChecked').textContent = s.checked;
  document.getElementById('statFresh').textContent = s.fresh;
  var pct = s.answered ? Math.round(s.correct/s.answered*100) : null;
  document.getElementById('pctText').textContent = pct===null ? '–' : pct+'%';
  var circumference = 2*Math.PI*50;
  var ring = document.getElementById('ringFill');
  ring.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ring.style.strokeDashoffset = (circumference - (pct||0)/100*circumference).toFixed(1);

  document.getElementById('mcAll').textContent = QUESTIONS.length;
  var w = idsWrong().length, c = idsChecked().length, f = idsFresh().length;
  document.getElementById('mcWrong').textContent = w;
  document.getElementById('mcChecked').textContent = c;
  document.getElementById('mcFresh').textContent = f;
  document.getElementById('cardWrong').disabled = w===0;
  document.getElementById('cardChecked').disabled = c===0;
  document.getElementById('cardFresh').disabled = f===0;

  renderFilterCount();
}

function chip(label, active, onclick, extraClass){
  var b = document.createElement('button');
  b.className = 'chip'+(extraClass?' '+extraClass:'')+(active?' active':'');
  b.textContent = label;
  b.addEventListener('click', onclick);
  return b;
}
var CHECK_DEFS = [
  {key:'green', label:'🟢 わかる', cls:'chip-green'},
  {key:'yellow', label:'🟡 あやふや', cls:'chip-yellow'},
  {key:'red', label:'🔴 わからない', cls:'chip-red'}
];
function renderCheckBadge(id){
  var badges = document.getElementById('qBadges');
  badges.querySelectorAll('[data-check-badge]').forEach(function(el){ el.remove(); });
  var arr = state.checks[id] || [];
  arr.forEach(function(color){
    var cDef = CHECK_DEFS.filter(function(d){return d.key===color})[0];
    var b = document.createElement('span');
    b.className = 'badge check-'+color;
    b.setAttribute('data-check-badge', '1');
    b.textContent = cDef ? cDef.label : color;
    badges.appendChild(b);
  });
}
function renderChips(){
  var checkWrap = document.getElementById('checkChips'); checkWrap.innerHTML='';
  CHECK_DEFS.forEach(function(cd){
    checkWrap.appendChild(chip(cd.label, filter.checks.has(cd.key), function(){
      if(filter.checks.has(cd.key)) filter.checks.delete(cd.key); else filter.checks.add(cd.key);
      renderChips(); renderFilterCount();
    }, cd.cls));
  });
  var catWrap = document.getElementById('catChips'); catWrap.innerHTML='';
  CATS.forEach(function(c){
    catWrap.appendChild(chip(c, filter.cats.has(c), function(){
      if(filter.cats.has(c)) filter.cats.delete(c); else filter.cats.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var fWrap = document.getElementById('fieldChips'); fWrap.innerHTML='';
  FIELDS.forEach(function(c){
    fWrap.appendChild(chip(c, filter.fields.has(c), function(){
      if(filter.fields.has(c)) filter.fields.delete(c); else filter.fields.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var yWrap = document.getElementById('yearChips'); yWrap.innerHTML='';
  YEARS.forEach(function(y){
    yWrap.appendChild(chip(y+'年', filter.years.has(y), function(){
      if(filter.years.has(y)) filter.years.delete(y); else filter.years.add(y);
      renderChips(); renderFilterCount();
    }));
  });
}
function filteredIds(baseIds){
  return baseIds.filter(function(id){
    var q = QUESTIONS[id];
    if(filter.cats.size && !filter.cats.has(q.cat)) return false;
    if(filter.fields.size && !filter.fields.has(q.field)) return false;
    if(filter.years.size && !filter.years.has(q.year)) return false;
    if(filter.checks.size){
      var qchecks = state.checks[id] || [];
      var anyMatch = false;
      filter.checks.forEach(function(c){ if(qchecks.indexOf(c)>=0) anyMatch = true; });
      if(!anyMatch) return false;
    }
    return true;
  });
}
function hasActiveFilter(){
  return filter.cats.size || filter.fields.size || filter.years.size || filter.checks.size;
}
function renderFilterCount(){
  var all = QUESTIONS.map(function(q){return q.id});
  var n = filteredIds(all).length;
  document.getElementById('filterCount').textContent = hasActiveFilter() ? n+'問が条件に一致' : '';
  document.getElementById('startBtn').disabled = n===0;
}

document.querySelectorAll('.mode-card').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.disabled) return;
    startSession(btn.getAttribute('data-mode'));
  });
});
document.getElementById('startBtn').addEventListener('click', function(){ startSession('filter'); });

function startSession(mode){
  var ids;
  var all = QUESTIONS.map(function(q){return q.id});
  if(mode==='all') ids = all;
  else if(mode==='wrong') ids = idsWrong();
  else if(mode==='checked') ids = idsChecked();
  else if(mode==='fresh') ids = idsFresh();
  else ids = filteredIds(all);
  if(mode!=='filter' && hasActiveFilter()) ids = filteredIds(ids);
  if(!ids.length) return;
  queue = ids;
  qPos = 0;
  answeredInSession = new Set();
  showView('quiz');
  renderQuestion();
}

document.getElementById('resetBtn').addEventListener('click', function(){
  if(confirm('すべての回答履歴（正誤・チェック）を削除します。よろしいですか？')){
    state = {answers:{}, checks:{}};
    saveState();
    renderDash();
  }
});

// ---------- quiz rendering ----------
function q(){ return QUESTIONS[queue[qPos]]; }

function renderQuestion(){
  clearAutoTimer();
  var cur = q();
  answeredThisQ = false;
  pickedLabel = null;

  document.getElementById('quizCounter').textContent = (qPos+1)+' / '+queue.length;
  document.getElementById('quizProgress').style.width = ((qPos)/queue.length*100)+'%';

  var badges = document.getElementById('qBadges');
  badges.innerHTML = '';
  var catB = document.createElement('span');
  catB.className = 'badge '+CAT_CLASS[cur.cat];
  catB.textContent = cur.cat;
  badges.appendChild(catB);
  var metaB = document.createElement('span');
  metaB.className = 'badge meta';
  metaB.textContent = cur.period+' 問'+cur.num;
  badges.appendChild(metaB);
  var fieldB = document.createElement('span');
  fieldB.className = 'badge meta';
  fieldB.textContent = cur.field;
  badges.appendChild(fieldB);
  renderCheckBadge(cur.id);

  document.getElementById('qText').innerHTML = cur.q;

  buildChoices(cur);

  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('nextBtn').textContent = '回答して確認';
  document.getElementById('nextBtn').disabled = true;

  document.querySelectorAll('.check-dot').forEach(function(d){
    d.classList.toggle('active', isChecked(cur.id, d.getAttribute('data-check')));
  });
