<meta charset="UTF-8">
<title>ST全問題道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ST全問題道場">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FA; --bg-elevated:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECEEF5;
  --border:#DBDEE9; --border-soft:#E7E9F2;
  --text:#1B2130; --text-dim:#5B6478; --text-faint:#8991A3;
  --accent:#0E7C86; --accent-strong:#0A5E66; --accent-soft:#E1F1F1; --accent-contrast:#FFFFFF;
  --success:#1F8A4C; --success-soft:#E3F5E9;
  --danger:#C8392F; --danger-soft:#FBEAE8;
  --warning:#B4790F; --warning-soft:#FBF0DA;
  --cat-tech:#2F5FD6; --cat-tech-soft:#E7ECFC;
  --cat-mgmt:#7A4FC9; --cat-mgmt-soft:#F0EBFB;
  --cat-strat:#1E8F72; --cat-strat-soft:#E4F5F0;
  --shadow:0 1px 2px rgba(24,32,56,.06), 0 8px 24px rgba(24,32,56,.08);
  --shadow-lg:0 4px 8px rgba(24,32,56,.08), 0 16px 40px rgba(24,32,56,.12);
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --font-display:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
    --border:#2B3145; --border-soft:#242A3B;
    --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
    --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
    --success:#4BC382; --success-soft:rgba(75,195,130,.14);
    --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
    --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
    --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
    --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
    --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
  --border:#2B3145; --border-soft:#242A3B;
  --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
  --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
  --success:#4BC382; --success-soft:rgba(75,195,130,.14);
  --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
  --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
  --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
  --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
  --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
h1,h2,h3,h4,.disp{font-family:var(--font-display); text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit; touch-action:manipulation; color:inherit; background:none}
::selection{background:var(--accent-soft)}

#app{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
@media (min-width:700px){ #app{max-width:880px} }
.view{display:none}
.view.active{display:block}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .brand{display:flex;flex-direction:column;gap:2px}
.topbar h1{font-size:1.3rem;font-weight:900;letter-spacing:.01em;margin:0}
.topbar .sub{font-size:.74rem;color:var(--text-faint);letter-spacing:.04em}
.iconbtn{
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- Dashboard ---------- */
.hero{
  display:flex;align-items:center;gap:20px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow);
  margin-bottom:16px;
}
.ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:9}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .pct{font-family:var(--font-display);font-weight:900;font-size:1.5rem;line-height:1}
.ring-label .pct-cap{font-size:.62rem;color:var(--text-faint);margin-top:2px;letter-spacing:.03em}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;flex:1;min-width:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;border-bottom:1px dashed var(--border-soft);padding:3px 0}
.stat-row b{font-family:var(--font-display);font-size:1rem}
.stat-row .lbl{color:var(--text-dim)}

.section-label{font-size:.72rem;font-weight:700;color:var(--text-faint);letter-spacing:.08em;margin:22px 2px 8px;text-transform:uppercase}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{
  text-align:left;border:1px solid var(--border-soft);background:var(--surface);
  border-radius:var(--radius-m);padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.mode-card:disabled{opacity:.45;cursor:not-allowed}
.mode-card:not(:disabled):hover{border-color:var(--accent)}
.mode-card .mc-count{font-family:var(--font-display);font-weight:900;font-size:1.7rem;color:var(--accent)}
.mode-card .mc-title{font-size:.86rem;font-weight:700;margin-top:2px}
.mode-card .mc-desc{font-size:.72rem;color:var(--text-faint);margin-top:2px}
.mode-card.retry .mc-count{color:var(--danger)}
.mode-card.checked .mc-count{color:var(--warning)}
.mode-card.fresh .mc-count{color:var(--text-dim)}

.filters{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:14px;box-shadow:var(--shadow)}
.filter-group{margin-bottom:10px}
.filter-group:last-child{margin-bottom:0}
.filter-group .fg-label{font-size:.7rem;color:var(--text-faint);margin-bottom:6px;letter-spacing:.03em}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  border-radius:999px;padding:5px 12px;font-size:.76rem;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);font-weight:700}
.chip.chip-green{border-color:var(--success);color:var(--success)}
.chip.chip-green.active{background:var(--success);border-color:var(--success);color:#fff}
.chip.chip-yellow{border-color:var(--warning);color:var(--warning)}
.chip.chip-yellow.active{background:var(--warning);border-color:var(--warning);color:#fff}
.chip.chip-red{border-color:var(--danger);color:var(--danger)}
.chip.chip-red.active{background:var(--danger);border-color:var(--danger);color:#fff}

.start-cta{
  width:100%;margin-top:14px;background:var(--accent);color:var(--accent-contrast);border:none;
  border-radius:999px;padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);
}
.start-cta:disabled{opacity:.4;cursor:not-allowed}
.filtercount{text-align:center;font-size:.74rem;color:var(--text-faint);margin-top:8px}

.danger-zone{margin-top:26px;text-align:center}
.link-btn{background:none;border:none;color:var(--text-faint);font-size:.72rem;text-decoration:underline;cursor:pointer}

/* ---------- Quiz ---------- */
.quizbar{position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:12px 0 10px;z-index:5;display:flex;align-items:center;gap:10px}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcounter{font-size:.76rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

.qcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:14px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.badge{border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700;letter-spacing:.02em}
.badge.cat-tech{background:var(--cat-tech-soft);color:var(--cat-tech)}
.badge.cat-mgmt{background:var(--cat-mgmt-soft);color:var(--cat-mgmt)}
.badge.cat-strat{background:var(--cat-strat-soft);color:var(--cat-strat)}
.badge.meta{background:var(--surface-2);color:var(--text-dim);font-weight:500}
.badge.check-green{background:var(--success-soft);color:var(--success)}
.badge.check-yellow{background:var(--warning-soft);color:var(--warning)}
.badge.check-red{background:var(--danger-soft);color:var(--danger)}

.qtext{font-size:.94rem;line-height:1.6}
.qtext table,.expl-body table{border-collapse:collapse;margin:.8em 0;font-size:.92em;max-width:100%}
.qtext td,.qtext th,.expl-body td,.expl-body th{border:1px solid var(--border);padding:5px 10px;text-align:left}
.qtext th,.expl-body th{background:var(--surface-2);font-weight:700}
.qtext{overflow-x:auto}
.qtext img{max-width:100%;height:auto;display:block;margin:1em auto}
.qtext ul, .expl-body ul, .choice-item ul{padding-left:0;margin:.6em 0}
.qtext ul > li, .expl-body ul > li{list-style:none}
.qtext li[class^="li"],.qtext li[class^="maru"],.expl-body li[class^="li"],.expl-body li[class^="maru"]{
  position:relative;padding-left:2em;margin:0 0 6px}
.qtext li[class^="li"]::before,.expl-body li[class^="li"]::before{position:absolute;left:0;top:1px}
li.lia::before{content:"ア"}li.lii::before{content:"イ"}li.liu::before{content:"ウ"}li.lie::before{content:"エ"}
li.li1{counter-reset:licount}
li.li1::before,li.li2::before,li.li3::before,li.li4::before,li.li5::before,li.li6::before{counter-increment:licount;content:"(" counter(licount) ")"}
li[class^="maru"]{counter-increment:marucount}
li.maru1{counter-reset:marucount}
li[class^="maru"]::before{position:absolute;left:0;top:5px;counter-increment:marucount;content:counter(marucount);border:1px solid currentColor;border-radius:50%;text-align:center;font-size:11px;width:14px;height:14px;line-height:13px}
ul.none li{padding-left:0}
ul.none li::before{content:none}
.frac{display:inline-block;text-align:center;vertical-align:middle;line-height:1.4;min-width:1.6em;margin:0 .15em}
.frac>span:not([class]){display:block;border-bottom:1.5px solid currentColor;padding:0 .1em}
em.r{color:var(--danger);font-style:normal;font-weight:700}
em.g{color:var(--success);font-style:normal;font-weight:700}
.bb{display:inline-block;border:1.5px solid var(--text-dim);min-width:6ex;padding:1px 10px;margin:0 2px;text-align:center;border-radius:4px}
.code,.pre{font-family:Menlo,Consolas,monospace;font-size:.92em}
.pre{background:var(--surface-2);border-radius:6px;border-left:3px solid var(--border);padding:8px 10px;margin:.6em 0;overflow-x:auto;white-space:pre}
span.code{background:var(--surface-2);border-radius:5px;padding:1px 6px;border:1px solid var(--border)}
.img_margin{text-align:center;margin:1em auto !important}

.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice-item{
  display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:10px 12px;cursor:pointer;font-size:.9rem;line-height:1.5;color:var(--text);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.choice-item:hover{border-color:var(--accent)}
.choice-item .clabel{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--text-dim);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84rem;font-family:var(--font-display);
}
.choice-item .ctext{flex:1;padding-top:2px;color:var(--text)}
.choice-item .ctext img{max-width:100%}
.choices.locked .choice-item{cursor:default}
.choice-item.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice-item.picked .clabel{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.choice-item.correct-answer{border-color:var(--success);background:var(--success-soft)}
.choice-item.correct-answer .clabel{background:var(--success);border-color:var(--success);color:#fff}
.choice-item.wrong-pick{border-color:var(--danger);background:var(--danger-soft)}
.choice-item.wrong-pick .clabel{background:var(--danger);border-color:var(--danger);color:#fff}

.shared-block{margin-top:14px}
.shared-block img{max-width:100%}
.shared-block .selectList{list-style:none;padding:0;margin:0}
.label-row{display:flex;gap:8px;margin-top:14px}
.label-btn{
  flex:1;border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:11px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--text-dim);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.label-btn:hover{border-color:var(--accent)}
.label-btn.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.label-btn.correct-answer{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.label-btn.wrong-pick{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

/* stamp */
.stamp-row{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.stamp{width:42px;height:42px;flex-shrink:0}
.stamp svg{width:100%;height:100%;overflow:visible}
.stamp circle,.stamp path{fill:none;stroke:var(--success);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220;animation:draw .55s ease-out forwards}
.stamp.wrong circle,.stamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stamp circle,.stamp path{animation:none;stroke-dashoffset:0}}

/* big center-screen stamp flash */
#bigStamp{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;opacity:0;
}
#bigStamp svg{width:min(46vw,220px);height:min(46vw,220px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.18))}
#bigStamp circle,#bigStamp path{fill:none;stroke:var(--success);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220}
#bigStamp.wrong circle,#bigStamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
#bigStamp.show{animation:bigStampPop .9s cubic-bezier(.2,.8,.2,1) forwards}
#bigStamp.show circle,#bigStamp.show path{animation:draw .4s ease-out .05s forwards}
@keyframes bigStampPop{
  0%{opacity:0; transform:scale(.6) rotate(-8deg)}
  16%{opacity:1; transform:scale(1.08) rotate(2deg)}
  26%{transform:scale(1) rotate(0)}
  72%{opacity:1; transform:scale(1) rotate(0)}
  100%{opacity:0; transform:scale(1.04) rotate(0)}
}
@media (prefers-reduced-motion:reduce){
  #bigStamp.show{animation:none; opacity:0}
}

/* big answer reveal (correct letter + mnemonic) */
.answer-reveal{
  display:flex; gap:11px; align-items:flex-start;
  background:linear-gradient(135deg, var(--accent-soft), transparent 160%);
  border:2px solid var(--accent); border-radius:var(--radius-m);
  padding:12px 13px; margin:8px 0;
}
.ar-letter{
  flex-shrink:0; width:44px; height:44px; border-radius:50%;
  background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:1.4rem;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.ar-body{flex:1; min-width:0}
.ar-h{display:flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;color:var(--accent-strong);letter-spacing:.05em;margin-bottom:3px}
:root:not([data-theme="light"]) .ar-h{color:var(--accent)}
:root[data-theme="dark"] .ar-h{color:var(--accent)}
.ar-mnemonic{font-size:1.02rem; line-height:1.55; font-weight:700; color:var(--text)}
.stamp-text b{font-family:var(--font-display);font-size:1.3rem}
.stamp-text.ok b{color:var(--success)}
.stamp-text.ng b{color:var(--danger)}
.stamp-text div{font-size:.8rem;color:var(--text-dim);margin-top:2px}

.auto-bar{margin-bottom:14px}
.auto-bar-label{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text-faint);margin-bottom:5px;letter-spacing:.02em}
.auto-bar-track{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.auto-bar-fill{height:100%;background:var(--accent);border-radius:99px;width:100%}
.auto-bar-fill.advancing{background:var(--success)}

.result-panel{margin-top:6px;border-top:1px dashed var(--border-soft);padding-top:10px}
.tip-box{background:var(--surface-2);border-radius:var(--radius-s);padding:9px 12px;margin:8px 0;font-size:.82rem}
.tip-box .tip-h{font-size:.68rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:4px}
.expl-h{font-size:.78rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin:16px 0 8px;text-transform:uppercase}
.expl-body{font-size:.9rem;line-height:1.85}
.expl-body img{max-width:100%;display:block;margin:1em auto}

.linkrow{display:flex;gap:14px;margin-top:14px;font-size:.78rem}
.linkrow a{text-decoration:none;color:var(--text-dim);border-bottom:1px solid var(--border)}
.linkrow a:hover{color:var(--accent);border-color:var(--accent)}

.footer-actions{display:flex;align-items:center;gap:8px;margin-top:4px}
.check-row{display:flex;gap:6px;flex-shrink:0}
.check-dot{
  width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg-elevated);
  font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:.45;filter:grayscale(.6);
}
.check-dot.active{opacity:1;filter:none;transform:scale(1.08);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.check-dot.green.active{border-color:var(--success)}
.check-dot.yellow.active{border-color:var(--warning)}
.check-dot.red.active{border-color:var(--danger)}
.next-btn{
  flex:1;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:999px;
  padding:12px;font-size:.9rem;font-weight:700;cursor:pointer;
}
.next-btn:disabled{opacity:.35;cursor:not-allowed}

.quiz-nav{display:flex;justify-content:space-between;margin-top:10px}
.ghost-btn{background:none;border:none;color:var(--text-faint);font-size:.78rem;cursor:pointer;padding:6px 4px}
.ghost-btn:hover{color:var(--text)}

/* jump grid */
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:6px}
.jump-cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);
  font-size:.68rem;color:var(--text-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.jump-cell.current{outline:2px solid var(--accent);outline-offset:1px}
.jump-cell.correct{background:var(--success-soft);color:var(--success);border-color:transparent}
.jump-cell.wrong{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.jump-cell.check-green{box-shadow:inset 0 -3px 0 var(--success)}
.jump-cell.check-yellow{box-shadow:inset 0 -3px 0 var(--warning)}
.jump-cell.check-red{box-shadow:inset 0 -3px 0 var(--danger)}

/* done screen */
.done-wrap{text-align:center;padding:40px 10px}
.done-wrap h2{font-size:1.4rem;margin-bottom:6px}
.done-wrap p{color:var(--text-dim);font-size:.88rem}

@media(max-width:420px){
  .mode-grid{grid-template-columns:1fr}
}

/* wider screens (iPad etc.): lay choices out 2-up so the question+choices
   block is shorter, leaving the answer/mnemonic visible without scrolling */
@media (min-width:700px){
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .label-row{max-width:420px}
}

/* once answered, shrink the choice list so the answer card below doesn't
   require scrolling to reach */
#choicesWrap.answered .choice-item{padding:6px 10px;font-size:.8rem;line-height:1.3}
#choicesWrap.answered .choice-item .clabel{width:21px;height:21px;font-size:.72rem}
#choicesWrap.answered .choices{gap:5px}
#choicesWrap.answered .label-btn{padding:7px;font-size:.88rem}
#choicesWrap.answered .label-row{margin-top:8px}

<script>
(function(){
  function showErr(msg){
    var b = document.getElementById('jsDebug');
    if(!b){
      b = document.createElement('div');
      b.id = 'jsDebug';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;'
        + 'padding:10px 14px;font:12px/1.5 -apple-system,sans-serif;font-weight:bold;white-space:pre-wrap;'
        + 'max-height:40vh;overflow:auto';
      document.body.insertBefore(b, document.body.firstChild);
    }
    b.textContent += (b.textContent?'\n\n':'') + msg;
  }
  window.addEventListener('error', function(e){
    showErr('JSエラー: ' + e.message + ' (' + (e.filename||'') + ':' + e.lineno + ':' + e.colno + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('Promiseエラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>

<script id="qdata" type="application/json">[{"id":0,"year":2025,"period":"令和7年度春期","num":1,"cat":"ストラテジ系","field":"ロジスティック回帰","summary":"ロジスティック回帰：令和7年度春期 問1","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>多数の被験者の検診データから，説明変数である年齢，飲酒の頻度及び喫煙本数が，目的変数であるガンの発症の有無に及ぼす影響を統計的に分析した上で，ある人の年齢，飲酒の頻度及び喫煙本数から，その人のガンの発症確率を推定するモデルを構築した。このとき用いられる分析手法はどれか。</p><table><tr><th>年齢</th><th>飲酒の頻度（回／週）</th><th>喫煙本数（本／週）</th><th>ガンの発症の有無</th></tr><tr><td>50</td><td>7</td><td>70</td><td>有</td></tr><tr><td>40</td><td>5</td><td>40</td><td>有</td></tr><tr><td>55</td><td>2</td><td>10</td><td>無</td></tr><tr><td>45</td><td>5</td><td>0</td><td>無</td></tr></table>","choices":[{"label":"ア","html":"ABC分析"},{"label":"イ","html":"クラスター分析"},{"label":"ウ","html":"主成分分析"},{"label":"エ","html":"ロジスティック回帰分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。ロジスティック回帰分析は，目的変数が「発症した／しない」のような2値（0/1）のデータであるときに，説明変数（年齢，飲酒頻度，喫煙本数など）からその事象が起こる確率をシグモイド関数を用いて0〜1の値として推定する統計的手法である。重回帰分析が連続値を予測するのに対し，ロジスティック回帰分析は確率を出力する点が特徴で，各説明変数の影響度はオッズ比として解釈されることが多く，疫学分野で疾患の発症要因の分析によく用いられてきた。設問はまさに「年齢・飲酒頻度・喫煙本数からガン発症確率を推定するモデル」を構築する内容であり，この手法そのものに合致する。他の選択肢はいずれも用途が異なる。ABC分析は在庫や売上の重要度をA・B・Cにランク付けする手法で確率推定は行わず，クラスター分析は似た特徴を持つデータをグループ化する教師なし学習手法であり目的変数を用いた予測は行わない。主成分分析は多数の変数を少数の合成変数（主成分）に圧縮する次元削減の手法であり，発症確率のような目的変数を予測するためのモデル構築が主目的ではない。</p><p>参考: <a href=\"https://book.st-hakky.com/data-analysis/logistic-regression-usage\">Hakky AI「ロジスティック回帰分析の使い方」</a></p>","mnemonic":""},{"id":1,"year":2025,"period":"令和7年度春期","num":2,"cat":"マネジメント系","field":"ECRS","summary":"ECRS：令和7年度春期 問2","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>業務改善をするときのフレームワークであるECRSに関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"業務を簡素化することによって，担当作業者ごとの品質の差を無くしたり，ミスの防止につなげたりすることは，C（Combine）の視点である。"},{"label":"イ","html":"作業工程順序や作業場所，担当作業者を入れ替えることによって，業務の効率向上を図ることは，S（Simplify）の視点である。"},{"label":"ウ","html":"無駄な業務を排除していくことによって，事務工数を削減し，業務効率を上げることは，E（Eliminate）の視点である。"},{"label":"エ","html":"類似している業務を統合していくことや，その逆に異なる属性を有する業務を分離することは，R（Rearrange）の視点である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。ECRSは業務改善・工程改善のために用いられるフレームワークで，E（Eliminate：排除），C（Combine：結合），R（Rearrange：交換・組み替え），S（Simplify：簡素化）の4つの視点の頭文字をとったものであり，もともとは製造業の業務効率化の方法論として定着し，現在は業種を問わず幅広く使われている。一般にE→C→R→Sの順に検討すると改善効果が大きいとされ，Eliminate（排除）は「そもそもその業務をなくせないか」を検討する，最も効果の大きい視点とされる。選択肢ウの「無駄な業務を排除していくことによって，事務工数を削減し，業務効率を上げる」はまさにEliminateの定義どおりであり正しい。他の選択肢は，業務改善の内容自体はそれぞれ妥当だが，対応するアルファベットが入れ替わっている点に注意が必要である。選択肢アの「業務の簡素化」は本来Simplifyの視点であるのにCombineとラベル付けされ，選択肢イの「作業工程順序や担当者の入れ替え」は本来Rearrangeの視点であるのにSimplifyとラベル付けされ，選択肢エの「類似業務の統合・異なる属性業務の分離」は本来Combineの視点であるのにRearrangeとラベル付けされている。このように用語の定義と具体例の対応関係を正しく覚えているかを問う出題である。</p><p>参考: <a href=\"https://asana.com/ja/resources/what-is-ecrs\">Asana「ECRS（イクルス）とは？業務改善の4原則とメリット、進め方を解説」</a></p>","mnemonic":""},{"id":2,"year":2025,"period":"令和7年度春期","num":3,"cat":"ストラテジ系","field":"決定木分析","summary":"決定木分析：令和7年度春期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>ある企業では，顧客データについて，顧客を性別，年齢層，職業，年収など複数の属性を組み合わせてセグメント化し，蓄積された大量の購買履歴データに照らして商品の購入可能性が最も高いセグメントを予測している。このときに活用される分析手法はどれか。</p>","choices":[{"label":"ア","html":"ABC分析"},{"label":"イ","html":"SWOT分析"},{"label":"ウ","html":"競合分析"},{"label":"エ","html":"決定木分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。決定木分析は，データをある条件によって次々に枝分かれ（if-then分岐）させ，樹形図（ツリー構造）を作ることで分類や予測を行う手法である。分岐の良し悪しはジニ不純度やエントロピー・情報利得などの指標で評価され，最終的に得られた葉（セグメント）ごとに購入率などの傾向を確認できる。実務では，例えば「関心事：グルメ・海外旅行」「購入金額合計：1万円以上」「女性」といった複数属性の組合せによるセグメントを自動的に抽出し，そのセグメントに属する顧客の購入率が高いことを明らかにするといった使われ方をする。設問の「顧客を複数の属性で組み合わせてセグメント化し，購入可能性が最も高いセグメントを予測する」という内容はこの手法の典型的な活用例であり合致する。他の選択肢は用途が異なる。ABC分析は売上や在庫などの重要度によって品目をA・B・Cにランク付けする手法であり，属性の組合せによるセグメント予測は行わない。SWOT分析は自社の強み・弱みと機会・脅威を整理する経営戦略の分析手法，競合分析は競合他社の動向を調べる手法であり，いずれも大量の購買履歴データから最も購入可能性の高い顧客セグメントを予測するような統計的・データマイニング的な手法ではない。</p><p>参考: <a href=\"https://www.sas.com/ja_jp/insights/articles/marketing/custome-segmentation-analysis2.html\">SAS「決定木分析とは」</a></p>","mnemonic":""},{"id":3,"year":2025,"period":"令和7年度春期","num":4,"cat":"ストラテジ系","field":"DCF法","summary":"DCF法：令和7年度春期 問4","correct":"ア","result":"","formula":"現在価値=将来キャッシュフロー÷(1＋割引率)^年数（各年ごとに百万円未満切り捨て）","howto":"割引率20%で単年複利で割り引き，各年の端数は都度切り捨ててから合計する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>プロジェクト開始時点で150百万円の支出を行うIT投資プロジェクトにおいて，3年間の金銭的価値をDCF法で算定した場合，正しい算定結果はa〜dのどれか。</p><p>ここで，割引率は20％で固定とし，キャッシュフローは全て年度末に発生するものとする。また，金銭的価値の算定の際には年度ごとに百万円未満を切り捨てて計算する。</p><table><tr><td colspan='5'>IT投資プロジェクト（単位　百万円）</td></tr><tr><td>投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td></tr><tr><td>キャッシュフロー</td><td>－150</td><td>100</td><td>100</td><td>100</td></tr></table><table><tr><td colspan='6'>DCF法による金銭的価値の算定結果（単位　百万円）</td></tr><tr><td>算定結果＼投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td><td>合計</td></tr><tr><td>a</td><td>－150</td><td>83</td><td>69</td><td>57</td><td>59</td></tr><tr><td>b</td><td>－150</td><td>83</td><td>71</td><td>62</td><td>66</td></tr><tr><td>c</td><td>－150</td><td>83</td><td>83</td><td>83</td><td>99</td></tr><tr><td>d</td><td>－150</td><td>83</td><td>96</td><td>99</td><td>128</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各年のキャッシュフロー100百万円を，割引率20%で複利現在価値に割り引き，年度ごとに百万円未満を切り捨てる。</p><p>1年後：100 ÷ 1.2 = 83.33… → 83</p><p>2年後：100 ÷ 1.2² = 100 ÷ 1.44 = 69.44… → 69</p><p>3年後：100 ÷ 1.2³ = 100 ÷ 1.728 = 57.87… → 57</p><p>合計 = －150 ＋ 83 ＋ 69 ＋ 57 = 59百万円。これはa行と完全に一致する。よって答えはア。</p>","mnemonic":"“2割引”を毎年重ねると100→83→69→57と目減りし，150を引けばぎりぎり黒字の59に着地するのがa。"},{"id":4,"year":2025,"period":"令和7年度春期","num":5,"cat":"ストラテジ系","field":"ODM","summary":"ODM：令和7年度春期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>ODMにおける委託者と受託者の役割分担として，適切なものはどれか。</p><table><tr><th></th><th>設計</th><th>製造</th><th>販売</th></tr><tr><td>ア</td><td>委託者</td><td>委託者</td><td>受託者</td></tr><tr><td>イ</td><td>委託者</td><td>受託者</td><td>受託者</td></tr><tr><td>ウ</td><td>受託者</td><td>委託者</td><td>受託者</td></tr><tr><td>エ</td><td>受託者</td><td>受託者</td><td>委託者</td></tr></table>","choices":[{"label":"ア","html":"設計：委託者，製造：委託者，販売：受託者"},{"label":"イ","html":"設計：委託者，製造：受託者，販売：受託者"},{"label":"ウ","html":"設計：受託者，製造：委託者，販売：受託者"},{"label":"エ","html":"設計：受託者，製造：受託者，販売：委託者"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。ODM（Original Design Manufacturing）は，発注元（委託者）が製品の企画・販売を担い，受託側（ODMメーカー）が製品の設計から製造までを一貫して担当する生産委託の形態である。OEM（Original Equipment Manufacturing）が「製造のみ」を受託するのに対し，ODMは「設計・開発まで」を受託する点が大きな違いであり，発注元は自社に開発ノウハウがなくても商品を市場に揃えられるというメリットがある一方，受託者の技術力に依存し，仕様や品質を細かくコントロールしにくいというデメリットもある。設問の組合せでは，設計と製造をいずれも受託者が担当し，商品企画や市場への販売は委託者（ブランドオーナー）が担当する組合せが正しく，これは選択肢エに一致する。選択肢イ（設計＝委託者，製造＝受託者，販売＝受託者）は，設計を委託者が行い製造のみを外部委託する点でむしろOEMに近い役割分担であり，ODMの定義とは異なる点に注意したい。ODM生産は特に台湾や中国の受託企業が強みを持ち，パソコンや携帯電話など電子機器業界で広く採用されている。</p><p>参考: <a href=\"https://mynavi-agent.jp/dainishinsotsu/canvas/2021/12/post-620.html\">マイナビ「ODMとは？OEMとの違いをわかりやすく図解」</a>, <a href=\"https://it-trend.jp/production_management/article/10-0055\">IT trend「OEMとODMの違い」</a></p>","mnemonic":""},{"id":5,"year":2025,"period":"令和7年度春期","num":6,"cat":"ストラテジ系","field":"バリューチェーン","summary":"バリューチェーン：令和7年度春期 問6","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>バリューチェーンの説明はどれか。</p>","choices":[{"label":"ア","html":"企業活動を，五つの主活動と四つの支援活動に区分し，企業の競争優位の源泉を分析するフレームワーク"},{"label":"イ","html":"企業の内部環境と外部環境を分析し，自社の強みと弱み，自社を取り巻く機会と脅威を整理して明確にする手法"},{"label":"ウ","html":"財務，顧客，内部ビジネスプロセス，学習と成長の四つの視点から企業を分析し，戦略マップを策定するフレームワーク"},{"label":"エ","html":"商品やサービスを，誰に，何を，どのように提供するかを分析し，事業領域を明確にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。バリューチェーン（価値連鎖）は，1985年にマイケル・ポーターが著書『競争優位の戦略』で提唱した分析フレームワークであり，企業活動を，購買物流・製造（オペレーション）・出荷物流・マーケティング／販売・サービスという，製品を作り顧客に届ける直接的な工程である「主活動」（一般に5つ）と，それを支える企業インフラ・人材資源管理・技術開発・調達という「支援活動」（一般に4つ）に分類し，それぞれの活動がどれだけ付加価値を生み出しているかを分析することで，企業の競争優位の源泉を見極める手法である。設問アの説明はこの定義と一致する。他の選択肢はいずれも別のフレームワークの説明である。選択肢イは自社の強み・弱みと機会・脅威を整理するSWOT分析の説明，選択肢ウは財務・顧客・内部ビジネスプロセス・学習と成長の4視点で戦略マップを策定するバランススコアカード（BSC）の説明，選択肢エは「誰に・何を・どのように」提供するかを定義する事業ドメイン（事業領域）設定の手法の説明であり，いずれもバリューチェーンとは異なる経営分析フレームワークである。</p><p>参考: <a href=\"https://www.kotora.jp/c/164793-2/\">コトラ「バリューチェーン分析とは」</a></p>","mnemonic":""},{"id":6,"year":2025,"period":"令和7年度春期","num":7,"cat":"ストラテジ系","field":"コンテンツ戦略","summary":"コンテンツ戦略：令和7年度春期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>コンテンツマーケティングの説明はどれか。</p>","choices":[{"label":"ア","html":"Webサイト上で，漫画，CG，キャラクターデザインなどのコンテンツを著作権者から預かって掲載し，販売収益から著作権者に利益を配分する手法"},{"label":"イ","html":"商品やサービスを広めたいと考えている企業が，Web，テレビCM，新聞広告などを用いて，企業側が伝えたいコンテンツを，大衆に一方的に発信する手法"},{"label":"ウ","html":"潜在顧客に向けて，価値のあるコンテンツを作成し，情報発信することによって，潜在顧客との関係性を深め，最終的に自らの製品・サービスの購入につなげる手法"},{"label":"エ","html":"動画共有サイトに自主制作のコンテンツを継続的に公開して，ファンとなるコミュニティを形成することによって，企業からの広告料収入を得る手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。コンテンツマーケティングは，米Content Marketing Instituteの定義に代表されるように，価値があり関心を引くコンテンツを作成・配信することで，明確に定義された読者層（潜在顧客）を惹きつけ，関係性を維持し，最終的に収益につながる顧客行動を促す，戦略的なマーケティング手法である。製品やサービスを直接宣伝するのではなく，情報提供・教育・エンターテインメントなどを通じて潜在顧客との信頼関係を段階的に構築し，自社の製品・サービスの購入へとつなげていく点が特徴であり，ブログ記事，動画，eBook，インフォグラフィックなどが代表的な形態である。設問ウの説明はこの定義に合致する。他の選択肢は似て非なる概念である。選択肢イは，企業が一方的にメッセージを発信するマスマーケティング（プッシュ型広告）であり，顧客との関係構築を重視するコンテンツマーケティングとは対照的な手法である。選択肢エは，広告収入を目的とした動画クリエイター（YouTuberなど）のビジネスモデルの説明であり，企業が自社製品・サービスの販売につなげる目的のコンテンツマーケティングとは主体・目的が異なる。</p><p>参考: <a href=\"https://www.oracle.com/jp/cx/marketing/content-marketing/\">Oracle「コンテンツマーケティングとは」</a></p>","mnemonic":""},{"id":7,"year":2025,"period":"令和7年度春期","num":8,"cat":"ストラテジ系","field":"マーケ戦略策定","summary":"マーケ戦略策定：令和7年度春期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>マーケティング戦略の策定プロセスを幾つかのブロックに分けて順番に並べたとき，図のdに入るものはどれか。ただしア〜エはa〜dのいずれかに入るものとする。</p><p>プロセスの流れ：　a　→　b　→　c　→　ポジション決定　→　d　→　実行計画策定</p>","choices":[{"label":"ア","html":"環境分析"},{"label":"イ","html":"マーケティングミックス決定"},{"label":"ウ","html":"ターゲット特定"},{"label":"エ","html":"市場細分化"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。マーケティング戦略の策定は，一般に「環境分析（PEST分析・3C分析・SWOT分析など）→ STP（市場細分化＝セグメンテーション → ターゲット特定＝ターゲティング → ポジション決定＝ポジショニング）→ マーケティングミックス（4P：製品・価格・流通・販促）決定 → 実行計画策定」という流れで進められる。設問の図では，a→b→c→ポジション決定→d→実行計画策定という順序が示されており，STPの流れから考えるとa＝環境分析，b＝市場細分化，c＝ターゲット特定，ポジション決定（ポジショニング）の後に続くd＝マーケティングミックス決定，という対応関係になる。STP（戦略の方向性を定める段階）で自社の立ち位置を決めた後，それを具体的な4Pの施策に落とし込むのがマーケティングミックス決定であり，その後に実行計画の策定に進むという流れは一般的なマーケティング戦略プロセスの教科書的な順序と一致する。したがってdに入るのはイの「マーケティングミックス決定」であり，ア（環境分析）はa，ウ（ターゲット特定）はc，エ（市場細分化）はbに対応する。</p><p>参考: <a href=\"https://www.salesforce.com/jp/marketing/how-to-build-marketing-strategy/\">Salesforce「マーケティング戦略の立て方」</a></p>","mnemonic":""},{"id":8,"year":2025,"period":"令和7年度春期","num":9,"cat":"ストラテジ系","field":"価格弾力性","summary":"価格弾力性：令和7年度春期 問9","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>需要の価格弾力性に関する説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"多くの競合他社が代替品を提供している場合，価格弾力性が小さくなりやすい。"},{"label":"イ","html":"価格弾力性が大きい商品の場合，値上げをしても需要量に大きな変化は見られない。"},{"label":"ウ","html":"価格弾力性の値が1の場合，価格を下げても需要量は変化しない。"},{"label":"エ","html":"必需品と贅沢品を比較した場合，一般に必需品の方が価格弾力性は小さい。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。需要の価格弾力性は，価格が1%変化したときに需要量が何%変化するかを示す指標であり，価格変化に対する需要の反応の大きさを表す。必需品（食料品や日用品など生活に不可欠な財）は，価格が上がっても買い控えが起きにくく，需要量があまり変化しないため価格弾力性は小さく（非弾力的）なる。一方，贅沢品（奢侈品）は price感応度が高く，価格が上がれば購入を手控えやすいため価格弾力性は大きく（弾力的）なる。これは代替品の有無とも関係しており，代替品が多い財ほど需要は弾力的になりやすい。設問エはこの一般的傾向を正しく述べている。他の選択肢は誤り。アは逆で，代替品を提供する競合が多いほど，その財から他の財へ乗り換えやすくなるため価格弾力性はむしろ大きくなりやすい。イも逆で，価格弾力性が大きい商品ほど，値上げによって需要量が大きく変化（減少）する。ウについては，価格弾力性が1（単位弾力的）の場合は，価格の変化率と需要量の変化率が等しくなる状態を指し，「需要量が変化しない」という意味ではない。</p><p>参考: <a href=\"https://www.issoh.co.jp/column/details/10564/\">ISSOHコラム「需要の価格弾力性とは」</a></p>","mnemonic":""},{"id":9,"year":2025,"period":"令和7年度春期","num":10,"cat":"ストラテジ系","field":"消費者購買行動","summary":"消費者購買行動：令和7年度春期 問10","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>消費者行動研究者ヘンリー・アサエルは，消費者と製品との関わりの程度と，消費者がブランド間の違いを知覚できる程度によって，消費者の購買行動が異なるとし，図に示す四つの製品タイプ（型）を導出した。この図において，不協和低減型に分類される製品に対する消費者の行動はどれか。</p><table><tr><th></th><th>消費者と製品との関わりの程度：高</th><th>消費者と製品との関わりの程度：低</th></tr><tr><th>ブランド間の違いを知覚できる程度：高</th><td>複雑な購買行動型</td><td>バラエティシーキング型</td></tr><tr><th>ブランド間の違いを知覚できる程度：低</th><td>不協和低減型</td><td>習慣購買型</td></tr></table>","choices":[{"label":"ア","html":"消費者は，他のブランドへの乗換えにほとんど抵抗感がないので，目新しさや多様性を求めて，様々なブランドの製品を試しに購入する行動が見られる。"},{"label":"イ","html":"消費者は，どのブランドも同じようだと感じるので，“いつも購入している”，“最初に目に付いた”，“単に知っている”などを理由にブランドを選ぶ傾向がある。"},{"label":"ウ","html":"消費者は，どのブランドを購入すればよいか見分けがつかないまま購入し，その後にブランドの評価を行うので，購入後に何らかの後悔を感じる傾向がある。"},{"label":"エ","html":"消費者は，まずブランド間の差異を認識した上で，様々な観点でブランド間の違いに関する分析・評価を繰り返した後に，最終的に購入するブランドを決定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。アサエルの購買行動類型は，「消費者の関与（製品との関わり）の高低」と「消費者が知覚するブランド間差異の大小」という2軸によって，消費者の購買行動を4パターンに分類するモデルである。不協和低減型は，製品への関与は高いが，ブランド間の差を消費者があまり知覚できない（低い）場合に生じる行動パターンであり，高額な製品であるにもかかわらずブランドの見分けがつきにくいため，確信を持てないまま購入し，購入後に「本当にこれでよかったのか」という認知的不協和（後悔・不安）を感じやすいという特徴がある。設問ウの説明はこの特徴と合致する。他の選択肢は別の象限の行動である。アは，関与が低くブランド差は知覚されているため，目新しさを求めて気軽にブランドを乗り換える「バラエティシーキング型」の行動である。イは，関与もブランド差の知覚も低く，深く考えずに惰性で購入する「習慣購買型」の行動である。エは，関与もブランド差の知覚も高く，購入前に時間をかけて比較検討する「複雑な購買行動型」の行動である。</p><p>参考: <a href=\"https://webtan.impress.co.jp/e/2025/04/08/48664\">Web担当者Forum「アサエルの購買行動類型」</a></p>","mnemonic":""},{"id":10,"year":2025,"period":"令和7年度春期","num":11,"cat":"ストラテジ系","field":"学習と成長の視点","summary":"学習と成長の視点：令和7年度春期 問11","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>次の記述は，バランススコアカードによる戦略マップの四つの視点において，ある視点とそれ以外の視点との関係性について，R.S.キャプランとD.P.ノートンが説明したものである。説明に該当する視点はどれか。</p><p>無形資産は持続可能な価値創造の究極の源泉である。この視点の目的は人材，技術及び組織風土が戦略を支えるためにどのように結びついているのか説明することにある。この視点に関する測定値の改善は，他の三つの視点の業績の先行指標である。</p>","choices":[{"label":"ア","html":"財務の視点"},{"label":"イ","html":"顧客の視点"},{"label":"ウ","html":"内部プロセスの視点"},{"label":"エ","html":"学習と成長の視点"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。バランススコアカード（BSC）は，キャプランとノートンが提唱した業績評価・戦略マネジメントの枠組みで，財務の視点，顧客の視点，内部プロセス（内部ビジネスプロセス）の視点，学習と成長の視点という4つの視点から企業活動を評価し，戦略マップとして可視化する。このうち学習と成長の視点は，人材（従業員の能力やスキル），情報システムなどの技術，組織風土・モチベーションといった無形資産に関する視点であり，これらは他の3つの視点（内部プロセス，顧客，財務）の成果を生み出す土台・基盤となるものと位置付けられる。設問の記述にある「無形資産は持続可能な価値創造の究極の源泉」「他の三つの視点の業績の先行指標」という説明は，学習と成長の視点がBSCの因果関係の起点（人材育成→業務プロセス改善→顧客満足向上→財務的成果向上）にあることを表しており，キャプラン＆ノートンの著作『戦略マップ』などで述べられている考え方と一致する。したがって財務，顧客，内部プロセスの各視点ではなく，学習と成長の視点が正解となる。</p><p>参考: <a href=\"https://www.sbbit.jp/article/cont1/165320\">ITmedia ビジネスオンライン「バランススコアカードの4つの視点」</a></p>","mnemonic":""},{"id":11,"year":2025,"period":"令和7年度春期","num":12,"cat":"ストラテジ系","field":"マルチサイド型","summary":"マルチサイド型：令和7年度春期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>マルチサイドプラットフォームのビジネスモデルに関する説明はどれか。</p>","choices":[{"label":"ア","html":"顧客価値を創造するために，複数の異なる種類の顧客セグメントをつなぎ合わせ，顧客セグメント間の交流を促進する仕組みを提供するモデルである。"},{"label":"イ","html":"顧客との良好な関係を築き収益拡大を図るために，顧客データベースの構築を前提として，顧客との様々な局面でのコミュニケーションを支援するモデルである。"},{"label":"ウ","html":"製造業において，事業の多角化を図るために，現在の製品の川上となる部品の製造と，川下となる販売事業に同時に進出するモデルである。"},{"label":"エ","html":"複数の異なる仕様の機種やOSで同じように動作するソフトウェアやサービスを提供することによって利用者を増やし，事業拡大を図るモデルである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。マルチサイドプラットフォーム（MSP）は，性質の異なる複数の利用者グループ（サイド）を一つの基盤（プラットフォーム）でつなぎ合わせ，各グループ間の交流・取引を仲介することで価値を生み出すビジネスモデルである。例えば，検索エンジンやSNSは利用者を無料で集め，その利用者にリーチしたい広告主から収益を得るといった形で，複数の異なる顧客セグメント（利用者と広告主，買い手と売り手など）を結び付け，自社では製品を保有せず「接続」そのものに価値を置く点が特徴とされる（Visaやライドシェアサービスなどが代表例とされる）。設問アの説明はこの定義に合致する。他の選択肢は別のビジネスモデルの説明である。イは顧客データベースを基盤としたCRM（顧客関係管理）の説明，ウは川上の部品製造から川下の販売まで一貫して手がける垂直統合型の多角化モデルの説明，エは複数の機種・OSに対応する汎用ソフトウェアで利用者を増やすクロスプラットフォーム戦略の説明であり，いずれも異なる顧客セグメント同士をつなぐマルチサイドプラットフォームの仕組みとは異なる。</p><p>参考: <a href=\"https://www.issoh.co.jp/column/details/9965/\">ISSOHコラム「マルチサイドプラットフォームとは」</a></p>","mnemonic":""},{"id":12,"year":2025,"period":"令和7年度春期","num":13,"cat":"ストラテジ系","field":"S&OP","summary":"S&OP：令和7年度春期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>SCMから発展した概念の一つであるS&amp;OP（Sales and Operations Planning）の説明はどれか。</p>","choices":[{"label":"ア","html":"顧客情報の管理，見積りの管理，見込案件の管理，商談活動の履歴管理などによって，営業プロセスの効率向上と，顧客情報の分析による戦略的な営業計画の策定を図る手法"},{"label":"イ","html":"顧客セグメンテーション，Webサイト・電子メール・ソーシャルメディアを活用したマーケティング，キャンペーン管理などによって，マーケティングプロセスの効率向上と見込客の育成を図る手法"},{"label":"ウ","html":"新製品・既存製品の顧客重視型マーケティング計画と，サプライチェーンの管理とを融合して，継続的な競争優位性の確立に向けて戦略的に事業を推進する能力を経営者に提供する，戦略的計画の策定プロセス"},{"label":"エ","html":"製品の企画，設計開発，製造，保守及び回収・廃棄といったライフサイクル全体に渡って，製品情報を一元的かつ包括的に管理することによって，製品品質，コスト，納期の改善を目指すプロセス"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。S&amp;OP（Sales and Operations Planning）は，従来のSCM（サプライチェーンマネジメント）が工場の生産計画や在庫の数量最適化を中心とした現場寄りの取り組みであったのに対し，販売計画（需要）と生産・調達計画（供給）を部門横断で統合し，金額ベースで経営判断と結び付けることを狙いとする，より上位の戦略的な計画プロセスへと発展させたものである。KPMGなどの解説によれば，S&amp;OPは短期の数量ベースの需給調整にとどまらず，中長期の視点を持つ経営連動型のプロセスとして位置付けられ，製品カテゴリ単位でマーケティング計画とサプライチェーン計画を融合し，経営者に戦略的な意思決定の材料を提供するものとされる。設問ウの「マーケティング計画とサプライチェーンの管理とを融合して，戦略的に事業を推進する能力を経営者に提供する，戦略的計画の策定プロセス」という説明はこの位置付けと一致する。他の選択肢はいずれも別の概念の説明であり，アはSFA（営業支援システム），イはMA（マーケティングオートメーション），エはPLM（製品ライフサイクル管理）の説明である。</p><p>参考: <a href=\"https://kpmg.com/jp/ja/home/insights/2025/11/sales-op.html\">KPMG「S&amp;OPとは」</a>, <a href=\"https://it.impress.co.jp/articles/-/10567\">Impress「S&amp;OPの基礎知識」</a></p>","mnemonic":""},{"id":13,"year":2025,"period":"令和7年度春期","num":14,"cat":"ストラテジ系","field":"魔の川","summary":"魔の川：令和7年度春期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>技術経営における“魔の川”の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"研究の開始までに横たわる障壁"},{"label":"イ","html":"研究の結果を基に製品開発するまでの間に横たわる障壁"},{"label":"ウ","html":"事業化から市場での成功までの間に横たわる障壁"},{"label":"エ","html":"製品開発から事業化までの間に横たわる障壁"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。技術経営（MOT）の分野では，技術が事業として成果を生むまでのプロセスに存在する3つの障壁を，「魔の川（デビルリバー）」「死の谷（デスバレー）」「ダーウィンの海」という比喩で表現することが知られている。「魔の川」は，基礎研究の成果を，実際に製品化につながる応用研究・技術開発（製品開発）へと橋渡しする段階に存在する障壁を指し，有望な研究テーマであっても製品開発につながらずに終わってしまう状態を表す。これに対し，「死の谷」は製品開発の成果を事業化（量産・市場投入）に移す段階での資金・体制面の障壁を，「ダーウィンの海」は事業化した製品が競合他社との厳しい競争を経て市場で生き残り成功を収めるまでの障壁を指す。したがって，設問の「研究の結果を基に製品開発するまでの間に横たわる障壁」は魔の川の説明であり，選択肢イが正解となる。選択肢ウは「ダーウィンの海」，選択肢エは「死の谷」の説明に相当し，選択肢アのような「研究の開始まで」の障壁を指す一般的な比喩用語は存在しない。</p>","mnemonic":""},{"id":14,"year":2025,"period":"令和7年度春期","num":15,"cat":"マネジメント系","field":"エネルギー管理","summary":"エネルギー管理：令和7年度春期 問15","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>エネルギーマネジメントシステムの導入では，エネルギーパフォーマンスの評価と改善を行うエネルギーレビューのプロセスが重要な管理のポイントとなる。生産工場におけるエネルギーレビューのプロセスを“エネルギーの使用及び使用量データの分析”，“著しいエネルギーの使用の特定と特性の把握”，“エネルギーパフォーマンス改善の機会と優先度の決定”，及び“将来のエネルギーの使用及びエネルギー使用量の予測”の四つの活動内容に分類した場合，“著しいエネルギーの使用の特定と特性の把握”に該当するものはどれか。</p>","choices":[{"label":"ア","html":"生産施設，生産設備，生産プロセスなどの操業条件のうち，エネルギー使用量への影響が大きい要素や関連する要素を明らかにする。"},{"label":"イ","html":"製造プロセス省エネ化技術，省エネ化システム・加工技術，省エネプロダクト加速化技術などの，導入の優先度を決定する。"},{"label":"ウ","html":"設備単位又は設備群単位，作業工程単位によるきめ細かいエネルギー使用量を収集する。"},{"label":"エ","html":"月々の電気料金請求書，契約使用量超過請求書，計測メーターの読取数値などのデータを基にエネルギー分析を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。ISO 50001（エネルギーマネジメントシステム規格）では，組織はエネルギーレビューを実施し，自らのエネルギーパフォーマンスを継続的に評価・改善することが求められる。エネルギーレビューの代表的な活動は，①過去から現在までのエネルギー使用及び使用量データの分析，②分析結果に基づいて著しいエネルギーの使用（SEU：Significant Energy Use）を特定し，その使用に影響を与える操業条件や関連要因（特性）を把握すること，③改善の機会を特定し優先順位を決定すること，④将来のエネルギー使用・使用量を予測すること，に整理される。設問で問われている「著しいエネルギーの使用の特定と特性の把握」は，生産施設・設備・プロセスなどの操業条件のうち，エネルギー使用量に大きな影響を与えている要素（例えば稼働率，生産量，外気温など）を明らかにする活動であり，選択肢アの説明がこれに該当する。他の選択肢は別の活動に対応しており，イは「改善の機会と優先度の決定」，ウとエはいずれもデータ収集・分析段階である「エネルギーの使用及び使用量データの分析」に関連する活動である。</p><p>参考: <a href=\"https://www.enecho.meti.go.jp/category/saving_and_new/saving/iso50001/\">経済産業省資源エネルギー庁「ISO 50001（エネルギーマネジメントシステム）」</a></p>","mnemonic":""},{"id":15,"year":2025,"period":"令和7年度春期","num":16,"cat":"マネジメント系","field":"ティアダウン","summary":"ティアダウン：令和7年度春期 問16","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>ティアダウンの説明はどれか。</p>","choices":[{"label":"ア","html":"市場の要求である“要求品質”と，提供する側の技術である“技術特性”の2元表を作成し，顧客の要求を満たすための機能を明確にする手法"},{"label":"イ","html":"整理・整頓することによって事故やけがを防止し，作業効率の低下を防ぐ活動"},{"label":"ウ","html":"他社の製品を分解し，分析して自社の製品と比較することによって，コストや性能面でより高い競争力をもった製品を開発する手法"},{"label":"エ","html":"物作りの仕組みの中の無駄を，現場の知恵を出し合って排除する活動"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。ティアダウン（Teardown：分解分析）は，自社製品だけでなく競合他社の製品を実際に分解し，使用されている部品の構成，設計思想，製造方法，概算コストなどを詳細に調べて自社製品と比較することで，競合がどのように同等の機能をより効率的に（より低コストで，あるいはより高性能に）実現しているかを把握し，自社製品のコスト低減や競争力強化につなげる手法である。半導体・電子機器業界などでは，専門企業が競合製品のティアダウン解析によるコストデータベースを提供しており，機能を落とさずにコストを削減するための設計判断の材料として活用されている。設問ウの「他社の製品を分解し，分析して自社の製品と比較することによって，コストや性能面でより高い競争力をもった製品を開発する」という説明はこの定義と合致する。他の選択肢は別の手法・活動の説明であり，アは品質機能展開（QFD）における品質表の作成，イと エはそれぞれ職場の整理整頓（5S的活動）や現場主導のムダ取り改善活動（カイゼン活動）の説明である。</p><p>参考: <a href=\"https://techinsights.com/beyond-cost-estimates-optimizing-product-costs-teardown-intelligence\">TechInsights「競合製品のティアダウン分析によるコスト最適化」</a></p>","mnemonic":""},{"id":16,"year":2025,"period":"令和7年度春期","num":17,"cat":"テクノロジ系","field":"CPS","summary":"CPS：令和7年度春期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>サイバーフィジカルシステム（CPS）の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"1台のサーバ上で複数のOSを動かし，複数のサーバとして運用する仕組み"},{"label":"イ","html":"仮想世界を現実かのように体感させる技術であり，人間の複数の感覚を同時に刺激することによって，仮想世界への没入感を与える技術"},{"label":"ウ","html":"現実世界のデータを収集し，仮想世界で分析・加工して，現実世界側にリアルタイムにフィードバックすることによって，付加価値を創造する仕組み"},{"label":"エ","html":"電子データだけでやり取りされる通貨であり，法定通貨のように国家による強制通用力をもたず，主にインターネット上での取引などに用いられるもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。サイバーフィジカルシステム（CPS：Cyber-Physical System）は，現実空間（フィジカル空間）にあるセンサーやIoT機器などから収集したデータを，コンピュータ上の仮想空間（サイバー空間）で統合・分析・加工し，その結果を現実世界側へリアルタイムにフィードバックすることで，現実の課題解決や新たな付加価値の創造につなげる仕組みを指す。サイバー空間とフィジカル空間がセンサーとアクチュエータを介して緊密に連携・循環する点が特徴であり，自動運転やスマート工場（ドイツのIndustrie 4.0構想など）で活用されている。考え方としてはデジタルツインと近いが，デジタルツインが主にシミュレーションによる検証に重点を置くのに対し，CPSは医療や交通など社会課題の解決まで含めた，現実世界への実際のフィードバック・作用までを対象とする点がより広い。設問ウの説明はこの定義と一致する。他の選択肢はいずれも別の技術の説明であり，アはサーバ仮想化，イはVR（バーチャルリアリティ），エは暗号資産（仮想通貨）の説明である。</p><p>参考: <a href=\"https://crexgroup.com/ja/consulting/operation/what-is-cyber-physical-system/\">CREX「サイバーフィジカルシステム（CPS）とは」</a></p>","mnemonic":""},{"id":17,"year":2025,"period":"令和7年度春期","num":18,"cat":"ストラテジ系","field":"リーダーシップ論","summary":"リーダーシップ論：令和7年度春期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>J.コッターが，変革を生み出すリーダーシップに求められる機能として位置付けているものはどれか。</p>","choices":[{"label":"ア","html":"計画立案，組織の設計，人の配置"},{"label":"イ","html":"販売管理，財務管理，人事管理"},{"label":"ウ","html":"ビジョンの提示，動機付け，コーチング"},{"label":"エ","html":"予算編成，問題解決，コントロール"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。経営学者ジョン・コッター（John Kotter）は，組織の「マネジメント」と「リーダーシップ」を明確に区別して論じたことで知られる。マネジメントは，既存の複雑な組織を秩序だって円滑に機能させるための機能であり，予算編成・計画立案，組織の設計・人員配置，問題解決・コントロールといった活動がこれに当たる。一方，リーダーシップは変化・変革を生み出すための機能であり，組織の進むべき方向性を示す「ビジョンの提示」，そのビジョンに向けて人々の心を一つにする「（人心の）統合」，ビジョン実現に向けて人々を奮い立たせる「動機付け」や「コーチング」といった活動がこれに当たるとされる。設問の「ビジョンの提示，動機付け，コーチング」はこのリーダーシップ側の機能の説明であり，選択肢ウが正解となる。選択肢ア，エはいずれもマネジメントの機能（計画立案・組織設計・人員配置，予算編成・問題解決・コントロール）の説明であり，選択肢イの「販売管理，財務管理，人事管理」はコッターの枠組みにおけるリーダーシップとマネジメントのいずれの機能とも直接対応しない一般的な業務管理の名称であり，いずれも誤りである。</p><p>参考: <a href=\"https://bookplus.nikkei.com/atcl/column/032800224/032800003/\">日経BOOKプラス「コッターのリーダーシップ論」</a></p>","mnemonic":""},{"id":18,"year":2025,"period":"令和7年度春期","num":19,"cat":"ストラテジ系","field":"キャッシュフロー","summary":"キャッシュフロー：令和7年度春期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>キャッシュフロー計算書において，投資活動によるキャッシュフローに該当するものはどれか。</p>","choices":[{"label":"ア","html":"株式の発行による収入"},{"label":"イ","html":"商品の仕入による支出"},{"label":"ウ","html":"損害賠償金の支払による支出"},{"label":"エ","html":"有形固定資産の売却による収入"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。キャッシュフロー計算書は，企業の現金の増減を「営業活動によるキャッシュフロー」「投資活動によるキャッシュフロー」「財務活動によるキャッシュフロー」の3区分に分けて表示する財務諸表である。投資活動によるキャッシュフローは，有形固定資産（建物，機械設備など）や無形固定資産，有価証券などの取得・売却に伴う資金の動きを表す区分であり，設問の「有形固定資産の売却による収入」はまさにこの区分に計上される典型例である（対になる「有形固定資産の取得による支出」もここに計上される）。他の選択肢は別の区分に該当する。アの「株式の発行による収入」は，資金調達に関する活動であるため財務活動によるキャッシュフローに分類される。イの「商品の仕入による支出」は，本業の営業取引に伴う支出であるため営業活動によるキャッシュフローに分類される。ウの「損害賠償金の支払による支出」も，通常は本業に関連する臨時的な支出として営業活動によるキャッシュフローの区分に含められる。</p>","mnemonic":""},{"id":19,"year":2025,"period":"令和7年度春期","num":20,"cat":"ストラテジ系","field":"債務超過","summary":"債務超過：令和7年度春期 問20","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>債務超過の状態を表しているものはどれか。</p>","choices":[{"label":"ア","html":"純資産合計がマイナスである。"},{"label":"イ","html":"負債合計が自己資本よりも大きい。"},{"label":"ウ","html":"負債合計が資本金よりも大きい。"},{"label":"エ","html":"利益剰余金がゼロである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。債務超過とは，貸借対照表上で負債の額が資産の額を上回り，その結果として純資産（資産－負債）がマイナスになっている状態を指す会計上の概念である。保有する資産をすべて現金化しても負債を返しきれない状態であり，赤字（単年度の損益がマイナス）とは異なり貸借対照表上の財政状態を表す指標である点に注意が必要である。設問アの「純資産合計がマイナスである」はこの定義そのものであり正しい。選択肢イの「負債合計が自己資本よりも大きい」は一見同じ意味に見えるが，自己資本と純資産は厳密には異なる概念であり，純資産には非支配株主持分（少数株主持分）や評価・換算差額等などが含まれる一方，自己資本はそれらを除いた株主資本中心の概念であるため，両者は必ずしも一致しない。選択肢ウの「負債合計が資本金よりも大きい」は誤りで，資本金は純資産のごく一部（払込資本の一部）に過ぎず，負債が資本金を上回ること自体は健全な企業でも普通に起こり得る。選択肢エの「利益剰余金がゼロである」も誤りで，利益剰余金がゼロであっても資本金や資本剰余金がプラスであれば純資産全体はプラスのままであり，債務超過とは限らない。</p><p>参考: <a href=\"https://biz.moneyforward.com/words/saimuchoka\">マネーフォワード「債務超過とは」</a></p>","mnemonic":""},{"id":20,"year":2025,"period":"令和7年度春期","num":21,"cat":"ストラテジ系","field":"営業利益","summary":"営業利益：令和7年度春期 問21","correct":"イ","result":"","formula":"営業利益=売上高－売上原価－販売費及び一般管理費（営業外項目は含めない）","howto":"営業外収益・営業外費用は経常利益の計算要素であり，営業利益の計算には使わないひっかけに注意","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>当期末の決算において，表に示した損益計算資料が得られた。日本基準で当期の営業利益は何百万円か。</p><table><tr><td colspan='2'>単位　百万円</td></tr><tr><td>項目</td><td>金額</td></tr><tr><td>売上高</td><td>1,500</td></tr><tr><td>売上原価</td><td>1,000</td></tr><tr><td>販売費及び一般管理費</td><td>200</td></tr><tr><td>営業外収益</td><td>40</td></tr><tr><td>営業外費用</td><td>30</td></tr></table>","choices":[{"label":"ア","html":"270"},{"label":"イ","html":"300"},{"label":"ウ","html":"310"},{"label":"エ","html":"500"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>日本基準の損益計算書では，営業利益は本業の儲けを表す区分で，営業外収益・営業外費用は含めない（それらは営業利益の下の「経常利益」の計算で加減算する）。</p><p>営業利益 = 売上高1,500 － 売上原価1,000 － 販売費及び一般管理費200 = 300百万円。</p><p>よって答えはイ。なお，営業外収益40と営業外費用30まで加減算してしまうと300+40-30=310となりウに釣られるが，これは経常利益の計算であり誤り。</p>","mnemonic":"営業外の40と30は“本業の外”だから無視，1,500－1,000－200で素直に300。釣られるとウの310になる。"},{"id":21,"year":2025,"period":"令和7年度春期","num":22,"cat":"ストラテジ系","field":"フェアユース","summary":"フェアユース：令和7年度春期 問22","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>フェアユースの説明はどれか。</p>","choices":[{"label":"ア","html":"国及び地方公共団体，並びにこれに準ずる公的機関は，公共の福祉を目的として他者の著作物を使用する場合，著作権者に使用料を支払う必要がないという考え方"},{"label":"イ","html":"著作権者は，著作権使用料の徴収を第三者に委託することが認められており，委託を受けた著作権管理団体はその徴収を公平に行わなければならないという考え方"},{"label":"ウ","html":"著作物の利用に当たっては，その内容や題号を公正に取り扱うため，著作者の意に反し，利用者が勝手に変更，切除その他の改変を行ってはならないという考え方"},{"label":"エ","html":"批評，解説，ニュース報道，教授，研究，調査などといった公正な目的のためであれば，一定の範囲での著作物の利用は，著作権の侵害に当たらないという考え方"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。フェアユース（Fair Use）は，米国著作権法（1976年著作権法第107条）に由来する法理であり，批評，解説，ニュース報道，教授（授業での複製を含む），研究，調査といった目的のためであれば，著作権者の許諾を得ていなくても，一定の範囲内での著作物の利用は著作権侵害に当たらないとする考え方である。実際の判断では，利用の目的・性格，著作物の性質，利用された分量，市場への影響などの要素が総合的に考慮される，柔軟な一般規定（権利制限の一般規定）として機能する。設問エの説明はこの定義に一致する。なお，日本の著作権法は米国のような包括的なフェアユース規定を採用しておらず，報道目的の利用（著作権法第41条）や時事問題の論説の転載（第39条）など，個別の権利制限規定によって類似の利用を認める仕組みを取っている点には注意したい。他の選択肢はいずれも別の概念の説明であり，イは著作権等管理事業者による著作権使用料の徴収・分配の仕組み，ウは著作者人格権の一つである同一性保持権の説明であって，フェアユースとは異なる。</p><p>参考: <a href=\"https://keiyaku-watch.jp/media/kisochishiki/fair-use/\">契約ウォッチ「フェアユースとは」</a></p>","mnemonic":""},{"id":22,"year":2025,"period":"令和7年度春期","num":23,"cat":"テクノロジ系","field":"排他制御","summary":"排他制御：令和7年度春期 問23","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>プログラムの排他制御の不備によって，プロセスやスレッドが共有リソースに同時アクセスした場合に想定外の動作をするという問題はどれか。</p>","choices":[{"label":"ア","html":"クロスサイトリクエストフォージェリ"},{"label":"イ","html":"ディレクトリトラバーサル"},{"label":"ウ","html":"バッファオーバーフロー"},{"label":"エ","html":"レースコンディション"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。レースコンディション（競合状態）とは，並列に動作する複数のプロセスやスレッドが，排他制御の不備によって同一の共有リソース（メモリ上の変数やデータベースのレコードなど）にほぼ同時にアクセスし，処理の実行順序やタイミングによって結果が変わってしまう，想定外の動作が生じる問題である。典型例としては，あるプロセスが共有リソースの値を読み取り，メモリ上で変更し，その結果を書き戻そうとする「読み取り－変更－書き込み」の一連の処理の途中に，別のプロセスが割り込んで同じリソースを操作してしまうケースが挙げられる。対策としては，共有リソースへのアクセス区間（クリティカルセクション）をミューテックスなどでロックし，一度に1つの処理だけがアクセスできるように排他制御を行うことが基本となる。設問の説明はこのレースコンディションの定義と一致する。他の選択肢はいずれも別の脆弱性であり，クロスサイトリクエストフォージェリは利用者のセッションを悪用して意図しないリクエストを送信させる攻撃，ディレクトリトラバーサルは不正なパス指定によって本来アクセスできないファイルにアクセスする攻撃，バッファオーバーフローはメモリ上の確保領域を超えてデータを書き込むことで誤動作や乗っ取りを招く脆弱性であり，いずれも排他制御の不備が直接の原因ではない。</p><p>参考: <a href=\"https://www.ipa.go.jp/archive/security/vuln/programming/cc/chapter4/cc4-4.html\">IPA「安全なウェブサイトの作り方」関連資料（レースコンディション）</a></p>","mnemonic":""},{"id":23,"year":2025,"period":"令和7年度春期","num":24,"cat":"テクノロジ系","field":"CSIRT体制","summary":"CSIRT体制：令和7年度春期 問24","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>JPCERTコーディネーションセンター“CSIRTガイド（2021年11月30日）”では，CSIRTの機能をサービス対象によって六つに分類しており，その一つにベンダーチームがある。ベンダーチームの機能とサービス対象の組みとして，適切なものはどれか。</p><table><tr><th></th><th>機能</th><th>サービス対象</th></tr><tr><td>ア</td><td>インシデント対応の中で，CSIRT間の情報連携，調整を行う。</td><td>他のCSIRT</td></tr><tr><td>イ</td><td>インシデントの傾向分析やマルウェアの解析，攻撃の痕跡の分析を行い，必要に応じて注意喚起する。</td><td>関係組織，国又は地域</td></tr><tr><td>ウ</td><td>自社製品の脆弱性に対応し，パッチ作成や注意喚起を行う。</td><td>自組織及び自社製品の利用者</td></tr><tr><td>エ</td><td>組織内CSIRTの機能の一部又は全部をサービスプロバイダとして，有償で請け負う。</td><td>顧客である組織</td></tr></table>","choices":[{"label":"ア","html":"機能：インシデント対応の中で，CSIRT間の情報連携，調整を行う。／サービス対象：他のCSIRT"},{"label":"イ","html":"機能：インシデントの傾向分析やマルウェアの解析，攻撃の痕跡の分析を行い，必要に応じて注意喚起する。／サービス対象：関係組織，国又は地域"},{"label":"ウ","html":"機能：自社製品の脆弱性に対応し，パッチ作成や注意喚起を行う。／サービス対象：自組織及び自社製品の利用者"},{"label":"エ","html":"機能：組織内CSIRTの機能の一部又は全部をサービスプロバイダとして，有償で請け負う。／サービス対象：顧客である組織"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。JPCERTコーディネーションセンターが公開している「CSIRTガイド」では，CSIRTをサービス対象（誰のためにサービスを提供するか）によって複数の類型に分類しており，ベンダーチーム（ベンダーCSIRT／PSIRTに相当）は，自社が開発・販売する製品に関するセキュリティ対応を専門に担うCSIRTの類型である。その主な機能は，自社製品に脆弱性が発見された際に，その脆弱性への対応（解析・検証），修正パッチの作成，利用者への注意喚起（セキュリティアドバイザリの発行）などであり，サービス対象は自組織及び自社製品を利用している顧客（利用者）である。設問ウの「自社製品の脆弱性に対応し，パッチ作成や注意喚起を行う」「自組織及び自社製品の利用者」という組合せはこの定義に一致する。他の選択肢は別の類型の説明に対応する。アは他のCSIRT間の情報連携・調整を担う「コーディネーションセンター」型，イは関係組織や国・地域全体を対象に分析や注意喚起を行う「分析センター」型や国レベルのCSIRT，エは有償で顧客組織にCSIRT機能を提供する「インシデントレスポンスプロバイダ（MSSP）」型の説明に相当し，いずれもベンダーチームとは異なる。</p><p>参考: JPCERT/CC「CSIRTガイド」（CSIRTの類型とサービス対象の分類）</p>","mnemonic":""},{"id":24,"year":2025,"period":"令和7年度春期","num":25,"cat":"テクノロジ系","field":"フォレンジック","summary":"フォレンジック：令和7年度春期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>デジタルフォレンジックスに該当するものはどれか。</p>","choices":[{"label":"ア","html":"画像，音楽などのデジタルコンテンツに著作権者などの情報を埋め込む。"},{"label":"イ","html":"コンピュータやネットワークのセキュリティ上の弱点を発見するテストとして，システムを実際に攻撃して侵入を試みる。"},{"label":"ウ","html":"巧みな話術，盗み聞き，盗み見などの手段によって，ネットワークの管理者，利用者などから，パスワードなどのセキュリティ上重要な情報を入手する。"},{"label":"エ","html":"犯罪に関する証拠となり得るデータを保全し，調査，分析，その後の訴訟などに備える。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。デジタルフォレンジックス（Digital Forensics）は，コンピュータ，スマートフォン，サーバ，ネットワーク機器などのデジタル機器に残された情報を，犯罪捜査や不正調査，セキュリティインシデント対応などの場面で，法的に通用する証拠として用いるために収集・保全・分析する一連の技術・手法の総称である。具体的には，証拠となり得るデータを改ざんされないよう隔離・保全（識別・保全），専用ツールを用いてファイル構造やメタデータを解析し削除データの復元や操作履歴・通信記録を追跡（分析），調査結果を時系列で正確に文書化（報告）するという流れで進められ，証拠の取り扱い経過を記録する「チェーン・オブ・カストディ（証拠保管の連鎖）」の考え方が重視される。設問エの「犯罪に関する証拠となり得るデータを保全し，調査，分析，その後の訴訟などに備える」はこの定義と一致する。他の選択肢は別の活動の説明であり，アは電子透かし（デジタルウォーターマーキング），イはペネトレーションテスト（侵入テスト），ウはソーシャルエンジニアリングの説明であって，証拠保全・分析を目的とするデジタルフォレンジックスとは異なる。</p><p>参考: <a href=\"https://www.sentinelone.com/ja/cybersecurity-101/cybersecurity/digital-forensics/\">SentinelOne「デジタルフォレンジックとは」</a></p>","mnemonic":""},{"id":25,"year":2024,"period":"令和6年度春期","num":1,"cat":"ストラテジ系","field":"DFFT","summary":"DFFT：令和6年度春期 問1","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>プライバシーやセキュリティ、知的財産権に関する信頼を確保しながら、ビジネスや社会課題の解決に有益なデータが国境を意識することなく自由に行き来する、国際的に自由なデータ流通の促進を目指すというコンセプトはどれか。</p>","choices":[{"label":"ア","html":"DFFT"},{"label":"イ","html":"ESG"},{"label":"ウ","html":"GEIT"},{"label":"エ","html":"SCM"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DFFT(Data Free Flow with Trust、信頼性のある自由なデータ流通)は、2019年のG20大阪サミットで日本が提唱した「大阪トラック」の中核概念で、プライバシー・セキュリティ・知的財産権への信頼を確保しながら、データが国境を越えて自由に流通する国際的な枠組みを目指す考え方である。2023年のG7広島サミットでは、DFFTを具体的に運用するための国際的な協力体制IAP(Institutional Arrangement for Partnership)の設立が合意されるなど、各国政府・国際機関で推進が続けられている。選択肢イのESG(Environment, Social, Governance)は投資判断や経営における環境・社会・企業統治への配慮を示す概念であり、データ流通とは直接関係しない。選択肢ウのGEIT(Governance of Enterprise IT)はITガバナンス全般の枠組み、エのSCM(Supply Chain Management)は供給網管理の手法であり、いずれも国境を越えたデータ流通の自由化を目的とするものではない。したがって正解はアのDFFTである。</p>","mnemonic":""},{"id":26,"year":2024,"period":"令和6年度春期","num":2,"cat":"ストラテジ系","field":"レグテック","summary":"レグテック：令和6年度春期 問2","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>金融業界で生まれた考え方で、主に被規制事業者が各種規制に正しく対応できているかどうかをチェックする業務などを、最新ITを駆使して効率化する取組はどれか。</p>","choices":[{"label":"ア","html":"MOT"},{"label":"イ","html":"ギグエコノミー"},{"label":"ウ","html":"コンプライアンス"},{"label":"エ","html":"レグテック"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>レグテック(RegTech)は「Regulation(規制)」と「Technology(技術)」を組み合わせた造語で、2015年前後から英米の金融業界を中心に広がった概念であり、AI・ビッグデータ・自動化技術などの最新ITを活用して、金融機関などの被規制事業者が複雑化・高度化する規制に正しく対応できているかをチェックする業務(取引監視、コンプライアンス管理、報告書作成など)を効率化する取組を指す。コンプライアンスコストの削減や規制リスクの低減、精度向上が期待されており、関連概念として監督当局側のIT活用を指すSupTech(スプテック)もある。選択肢ウのコンプライアンス(法令遵守)はレグテックが対象とする業務領域そのものであり、ITを駆使した効率化という手段を含意しないため、設問が求める「取組」の名称としては不適切である。選択肢アのMOT(技術経営)は技術をいかに事業化・収益化するかという経営手法、イのギグエコノミーは単発の仕事を単位とする働き方であり、いずれも規制対応の効率化とは無関係である。したがって正解はエのレグテックである。</p>","mnemonic":""},{"id":27,"year":2024,"period":"令和6年度春期","num":3,"cat":"ストラテジ系","field":"組み込み型金融","summary":"組み込み型金融：令和6年度春期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>組み込み型金融(Embedded Finance)の事例はどれか。</p>","choices":[{"label":"ア","html":"金融事業者である銀行が自行のインターネットバンキングサイトで、全銀システムに接続して他の銀行向けの振込サービスを提供する。"},{"label":"イ","html":"金融事業者である損害保険会社が自社のインターネットサイトで、他社のサービスに接続することなく、火災保険の契約受付を行う。"},{"label":"ウ","html":"非金融事業者である自動車メーカーが自社のインターネットサイトで、金融機関など他社のサービスに接続することなく、顧客に対して購入希望の自動車の見積りを提供する。"},{"label":"エ","html":"非金融事業者である百貨店が自社のインターネット販売サイトで、顧客が意識することなくクレジットカード会社のサービスに接続して、あらかじめクレジットカード情報を登録した顧客が購入した商品の代金決済を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>組み込み型金融(Embedded Finance)とは、銀行や証券会社などの金融機関ではない非金融事業者が、自社の製品やサービスの中に決済・融資・保険・投資といった金融機能を「部品」のように組み込んで提供する仕組みであり、顧客は金融機関のサービスに接続していることを意識せずに金融機能を利用できる点が特徴である。選択肢エは、非金融事業者である百貨店が、顧客が意識することなくクレジットカード会社のサービスに接続し、あらかじめ登録されたカード情報で決済を完了させる仕組みであり、まさに非金融事業者が金融機能を自社サービスに透過的に組み込んだ典型例である。選択肢アとイは、いずれも金融事業者自身(銀行・損害保険会社)が自社サービスとして金融機能を提供しており、非金融事業者による組み込みではないため該当しない。選択肢ウは非金融事業者(自動車メーカー)の事例だが、見積り提供自体は金融機能ではなく、かつ他社サービスへの接続も行っていないため組み込み型金融とはいえない。したがって正解はエである。</p>","mnemonic":""},{"id":28,"year":2024,"period":"令和6年度春期","num":4,"cat":"ストラテジ系","field":"デザイン思考","summary":"デザイン思考：令和6年度春期 問4","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>スタンフォード大学ハッソ・プラットナー・デザイン研究所によるデザイン思考の説明はどれか。</p>","choices":[{"label":"ア","html":"与えられた問題に対して一つの正しい解決策を見つけるために、アイディア出しの段階で、テーマに制限を設けてアイディアが発散しないようにする手法"},{"label":"イ","html":"本質的な問題がどこにあるのかを絞り込むために、利用者との対話よりも、過去のデータや経験を分析することを重視する手法"},{"label":"ウ","html":"利用者の立場から問題解決に取り組む方法論であり、現場を観察することによって利用者を理解し、共感することから始め、問題定義、アイディア出し、試作、試行を繰り返す手法"},{"label":"エ","html":"類似の問題が発生した場合に、迅速に解決策を探り当てるために、過去の問題とその解決策をナレッジデータベースとして蓄積する手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スタンフォード大学のハッソ・プラットナー・デザイン研究所(通称d.school)は、IDEO社などとともにデザイン思考を体系化し世界に広めた中心的な存在であり、そのプロセスは一般に「共感(Empathize)→問題定義(Define)→アイディア創出(Ideate)→試作(Prototype)→検証(Test)」の5段階で説明される。これは利用者の立場に立って現場を観察し、利用者に共感することから出発して本質的な課題を定義し、多様なアイディアを出し、試作・試行を繰り返しながら解決策を磨き上げていく、利用者中心の反復的な問題解決方法論である。選択肢ウはこの観察・共感から始まり問題定義、アイディア出し、試作、試行を繰り返すという特徴を正確に述べており正解である。選択肢アは「一つの正しい解決策」やアイディアの発散を抑える制限を強調しており、多様な発想を歓迎するデザイン思考の本質(アイディアの発散を促す)と矛盾する。選択肢イは利用者との対話よりも過去データの分析を重視するとしており、利用者観察・共感を起点とするデザイン思考の考え方と逆である。選択肢エは過去の問題と解決策をナレッジベース化する手法であり、デザイン思考というより事例ベース推論に近く、本質的な特徴ではない。</p>","mnemonic":""},{"id":29,"year":2024,"period":"令和6年度春期","num":5,"cat":"マネジメント系","field":"モデル取引・契約書","summary":"モデル取引・契約書：令和6年度春期 問5","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>\"情報システム・モデル取引・契約書&lt;第二版&gt;\"によれば、ウォーターフォールモデルによるシステム開発において、ユーザー(取得者)とベンダー(供給者)間で請負型の契約を基本とするフェーズはどれか。問題の図は、システム化計画、要件定義、システム外部設計、システム内部設計、ソフトウェア設計・プログラミング・ソフトウェアテスト、システム結合、システムテスト、受入・導入支援という工程を横に並べ、選択肢ア～エの矢印がそれぞれどの範囲のフェーズにまたがるかを示したものである。</p><table><tr><th>フェーズ</th><th>システム化計画</th><th>要件定義</th><th>システム外部設計</th><th>システム内部設計</th><th>ソフトウェア設計・プログラミング・ソフトウェアテスト</th><th>システム結合</th><th>システムテスト</th><th>受入・導入支援</th></tr><tr><td>アの矢印</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td></tr><tr><td>イの矢印</td><td></td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td></tr><tr><td>ウの矢印</td><td></td><td>○</td><td>○</td><td>○</td><td>○</td><td>○</td><td></td><td></td></tr><tr><td>エの矢印</td><td></td><td></td><td></td><td>○</td><td>○</td><td>○</td><td></td><td></td></tr></table>","choices":[{"label":"ア","html":"システム化計画フェーズから受入・導入支援フェーズまで"},{"label":"イ","html":"要件定義フェーズから受入・導入支援フェーズまで"},{"label":"ウ","html":"要件定義フェーズからシステム結合フェーズまで"},{"label":"エ","html":"システム内部設計フェーズからシステム結合フェーズまで"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>経済産業省及びIPAが公表した\"情報システム・モデル取引・契約書<第二版>\"は、ウォーターフォール型開発を念頭に、フェーズごとに請負型と準委任型の契約を使い分ける多段階契約の考え方を示している。一般的な整理では、システム化計画のような川上工程は、ユーザー主導で事業戦略やシステム化構想を検討する段階であり成果物の完成を一義的に保証しにくいことから準委任型が馴染みやすく、川下工程のシステムテストや受入・導入支援も、テストの実施やユーザーの導入作業への助言といった役務提供的な性格が強いため準委任型が選ばれやすい。これに対し、要件定義で整理された要求を踏まえた外部設計・内部設計・プログラミング・ソフトウェアテスト・システム結合までの範囲は、設計書やプログラム、結合済みのシステムという具体的な成果物を完成させて納品することが契約の目的となるため、仕事の完成に対して報酬が支払われる請負型を基本とする整理がなされている。本問の正解であるウ(要件定義フェーズからシステム結合フェーズまで)はこの考え方に沿った範囲を示している。選択肢ア・イはシステムテストや受入・導入支援という役務提供的な工程まで請負の範囲に含めている点、選択肢エは要件定義を請負の範囲から除外している点で、モデル契約が示す基本的な区切りとは異なる。</p>","mnemonic":""},{"id":30,"year":2024,"period":"令和6年度春期","num":6,"cat":"ストラテジ系","field":"アンゾフの成長マトリクス","summary":"アンゾフの成長マトリクス：令和6年度春期 問6","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>アンゾフの成長マトリクスにおける多角化戦略に当てはまるものはどれか。</p>","choices":[{"label":"ア","html":"新たな機能を付加した製品や新規に開発した製品を、現在の市場に投入する。"},{"label":"イ","html":"技術開発、業務提携、M&Aなどによって、新たな製品を新たな市場に投入し、成長の機会を求める。"},{"label":"ウ","html":"現在の市場において現有製品の広告、及び宣伝を強化し、顧客の購入頻度や購入量を増やす。"},{"label":"エ","html":"現有製品を海外市場に投入し、新たな市場セグメントの開拓を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アンゾフの成長マトリクスは、イゴール・アンゾフが1965年の著書「企業戦略論」で提唱した、縦軸に市場(既存・新規)、横軸に製品(既存・新規)をとった2×2の成長戦略フレームワークであり、四つの象限はそれぞれ市場浸透戦略(既存製品×既存市場)、新製品開発戦略(新製品×既存市場)、新市場開拓戦略(既存製品×新市場)、多角化戦略(新製品×新市場)に対応する。多角化戦略は、技術開発・業務提携・M&Aなどの手段を用いて、自社にとって未知の新たな製品を新たな市場に投入し、既存事業とのシナジーが薄い領域にまで成長機会を広げる戦略であり、四象限の中で最もリスクが高いとされる。選択肢イはまさに「新たな製品を新たな市場に投入」する多角化戦略の説明であり正解である。選択肢アは新製品開発戦略(既存市場に新製品)、ウは市場浸透戦略(既存製品・既存市場の深耕)、エは新市場開拓戦略(既存製品を新市場・海外市場へ)にそれぞれ該当し、いずれも多角化戦略ではない。</p>","mnemonic":""},{"id":31,"year":2024,"period":"令和6年度春期","num":7,"cat":"ストラテジ系","field":"アドエクスチェンジ","summary":"アドエクスチェンジ：令和6年度春期 問7","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>アドエクスチェンジの説明はどれか。</p>","choices":[{"label":"ア","html":"インターネット上の複数の広告媒体を束ねて、広告枠を管理し、入札型インプレッション課金と呼ばれるオークション形式のリアルタイム入札によって、広告枠ごとに掲載する広告を決定する仕組み"},{"label":"イ","html":"企業や起業家がインターネット上で事業資金を必要とする目的や内容を告知し、資金提供者を募集する仕組み"},{"label":"ウ","html":"検索エンジンに入力された検索語句に連動して広告を表示し、これがクリックされた量に応じて、広告主から広告料を徴収する仕組み"},{"label":"エ","html":"ネットオークションなどで、落札者が出品者に代金の支払を行ったにもかかわらず出品者が商品を送らないといったトラブルを防ぐために、売り手と買い手の間に入り代金の支払を仲介する仕組み"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アドエクスチェンジは、インターネット上の複数の広告媒体(パブリッシャー)の広告枠を一つの市場に束ね、広告主側のDSP(デマンドサイドプラットフォーム)と媒体側のSSP(サプライサイドプラットフォーム)を接続して、広告が表示される1インプレッションが発生するたびにリアルタイムのオークション(RTB:リアルタイムビッディング)で広告枠の売買を行う仕組みである。これにより広告主は多数の媒体の広告枠に対して横断的に入札でき、媒体側も複数の需要先から最も高い単価を自動的に選んで広告枠を販売できる。選択肢アはこの「複数の広告媒体を束ねた広告枠管理」と「入札型インプレッション課金によるオークション形式のリアルタイム入札」という特徴を的確に表しており正解である。選択肢イはクラウドファンディング、ウは検索連動型広告(リスティング広告)、エはネットオークションなどにおけるエスクローサービスの説明であり、いずれもアドエクスチェンジとは異なる仕組みである。</p>","mnemonic":""},{"id":32,"year":2024,"period":"令和6年度春期","num":8,"cat":"ストラテジ系","field":"コーズリレーテッドマーケティング","summary":"コーズリレーテッドマーケティング：令和6年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>コーズリレーテッドマーケティングの特徴はどれか。</p>","choices":[{"label":"ア","html":"顧客との継続的な取引関係を構築して維持することによって、顧客生涯価値を高め、企業収益に貢献する。"},{"label":"イ","html":"顧客の許可を得てから勧誘や広告活動を行うことによって、顧客との長期的な信頼関係や友好関係の形成を重視する。"},{"label":"ウ","html":"商品の売上の一部をNPO法人に寄付するなど、社会貢献活動を支援する信条をアピールし、販売促進につなげる。"},{"label":"エ","html":"蓄積された顧客情報を分析することによって、見込客の特定、的確な提案、顧客の購買促進や顧客のロイヤルティ向上などに役立てる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コーズリレーテッドマーケティング(Cause Related Marketing)は、企業が商品やサービスの売上の一部を特定の社会的課題に取り組むNPO法人などへの寄付に充てることを通じて、社会貢献活動を支援する信条を顧客にアピールし、販売促進や企業イメージ向上につなげるマーケティング手法である。代表例として、Apple・Nikeなど複数のブランドが参加しエイズ撲滅支援などに売上の一部を充てる(PRODUCT)REDキャンペーンや、日本ではボルヴィックとユニセフが連携した「1L for 10L」などが知られている。選択肢ウはこの「売上の一部をNPO法人に寄付するなど社会貢献活動を支援する信条をアピールし販売促進につなげる」という特徴を正確に表しており正解である。選択肢アは顧客生涯価値を高めるリレーションシップマーケティング、イはパーミッションマーケティング、エはデータベースマーケティング(One to Oneマーケティング)の説明であり、いずれも社会貢献と結び付けた手法ではないためコーズリレーテッドマーケティングには該当しない。</p>","mnemonic":""},{"id":33,"year":2024,"period":"令和6年度春期","num":9,"cat":"ストラテジ系","field":"ライフサイクルエクステンション","summary":"ライフサイクルエクステンション：令和6年度春期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ライフサイクルエクステンションの手法の例はどれか。</p>","choices":[{"label":"ア","html":"自社にとっての新規市場に新製品を提供することによって、自社の延命を図る。"},{"label":"イ","html":"新製品を高価格で設定することによって、短期の資金回収を図る。"},{"label":"ウ","html":"プロダクトライフサイクルの成熟期から衰退期にかけて、性能や品質の向上、機能やデザインの多様化などによって、売上高の維持、増大を図る。"},{"label":"エ","html":"プロダクトライフサイクルの導入期から成長期にかけて、広告宣伝費を投入することによって、製品の認知度向上を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ライフサイクルエクステンションとは、プロダクトライフサイクル(導入期・成長期・成熟期・衰退期)上で成熟期から衰退期に向かう製品について、性能・品質の向上や機能・デザインの多様化、新用途・新市場の開拓、価格や販路の見直しなどを行うことによって、売上の落ち込みを食い止め、製品としての寿命を延ばし売上高の維持・増大を図る手法である。選択肢ウはこの「成熟期から衰退期にかけて性能や品質の向上、機能やデザインの多様化などによって売上高の維持、増大を図る」という内容を的確に述べており正解である。選択肢アは新規市場への投入による延命を述べているが、市場開拓的な側面のみであり成熟期・衰退期対策としての典型的な説明としては不十分である。選択肢イは新製品の高価格設定による早期資金回収(上澄み吸収価格戦略)の説明であり、むしろ導入期の価格戦略に関するもの、選択肢エは導入期から成長期にかけての広告宣伝による認知度向上の説明であり、いずれも成熟期・衰退期の延命策であるライフサイクルエクステンションとは異なる段階の施策である。</p>","mnemonic":""},{"id":34,"year":2024,"period":"令和6年度春期","num":10,"cat":"ストラテジ系","field":"顧客生涯価値","summary":"顧客生涯価値：令和6年度春期 問10","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>一人の顧客に関する顧客生涯価値を算出する際の考慮点として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"顧客が紹介する他の顧客の購入見込みも対象とする。"},{"label":"イ","html":"顧客の平均購入単価よりも年間購入回数を重視する。"},{"label":"ウ","html":"商品を新しく買い換える行為は考慮しない。"},{"label":"エ","html":"新製品のプロモーション費用は対象としない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>顧客生涯価値(CLV:Customer Lifetime Value、LTV)は、一人の顧客が取引を開始してから終了するまでの期間に企業にもたらす利益の総額を表す指標であり、基本的には「顧客単価×購買頻度×継続期間」などの式で算出されるが、より広い観点からは、その顧客が友人・知人を紹介することによって新たにもたらされる他の顧客の購入見込み(紹介価値、リファラル価値)も、その顧客が生み出す価値の一部として考慮に入れるべきとされる。選択肢アはこの考え方を正しく述べており正解である。選択肢イは、年間購入回数と平均購入単価はいずれもLTV算出の重要な要素であり、一方のみを重視するのは適切ではない。選択肢ウについて、商品の買い換え(リピート購入)はまさに顧客の継続的な取引そのものであり、LTV算出において考慮すべき重要な要素であるため、考慮しないとするのは誤りである。選択肢エについても、新製品のプロモーション費用は顧客獲得・維持のためのコストとしてLTVの算出(特に利益ベースでの算出)に関係し得るため、対象としないとするのは適切ではない。</p>","mnemonic":""},{"id":35,"year":2024,"period":"令和6年度春期","num":11,"cat":"ストラテジ系","field":"顧客価値ヒエラルキー","summary":"顧客価値ヒエラルキー：令和6年度春期 問11","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>コトラーによれば、顧客価値ヒエラルキーとして五つの製品レベルを分類したときに、表中の[ a ]に該当するものはどれか。</p><table><tr><th></th><th>製品レベル</th><th>各レベルの説明</th></tr><tr><td>基本レベル</td><td>[ a ]</td><td>顧客が実質的に手にする基本的なサービスやベネフィット</td></tr><tr><td>第2レベル</td><td>基本製品</td><td>具体的サービスやベネフィット</td></tr><tr><td>第3レベル</td><td>期待製品</td><td>顧客の期待するサービスやベネフィット</td></tr><tr><td>第4レベル</td><td>膨張製品</td><td>顧客の期待を上回るサービスやベネフィット</td></tr><tr><td>第5レベル</td><td>潜在製品</td><td>顧客を満足させ、自社の提供物を特徴づける常に新しい方法を模索するサービスやベネフィット</td></tr></table>","choices":[{"label":"ア","html":"イノベーション"},{"label":"イ","html":"既存製品"},{"label":"ウ","html":"試作品"},{"label":"エ","html":"中核ベネフィット"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マーケティングの大家フィリップ・コトラーは、製品がもたらす価値を顧客視点から5段階に分類する「顧客価値ヒエラルキー」を提示しており、その最も基礎となる基本レベル(第1レベル)は「中核ベネフィット(Core Benefit)」と呼ばれ、顧客がその製品・サービスを通じて実質的に得ようとしている根本的な便益そのものを指す。例えばホテルの宿泊であれば「休息・睡眠」、ドリルであれば「穴を開けること」が中核ベネフィットに当たる。その上に、中核ベネフィットを具体的な形にした基本製品(第2レベル)、顧客が購入にあたって当然期待する属性をそろえた期待製品(第3レベル)、競合との差別化のために期待を上回る付加価値を加えた膨張製品(第4レベル、付随製品とも訳される)、将来の進化の可能性を示す潜在製品(第5レベル)が積み重なる構造になっている。選択肢エの「中核ベネフィット」はこの基本レベルの定義と一致し正解である。選択肢アのイノベーションや選択肢ウの試作品はこのモデルの5レベルには含まれない概念であり、選択肢イの既存製品は特定のレベルを指す用語ではないため、いずれも不適切である。</p>","mnemonic":""},{"id":36,"year":2024,"period":"令和6年度春期","num":12,"cat":"ストラテジ系","field":"バランススコアカード","summary":"バランススコアカード：令和6年度春期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>バランススコアカードにおける業績評価指標のうち、\"学習と成長の視点\"に分類されるものはどれか。</p>","choices":[{"label":"ア","html":"顧客満足度調査の結果"},{"label":"イ","html":"従業員の特許取得件数"},{"label":"ウ","html":"従業員一人当たりの売上高"},{"label":"エ","html":"新規顧客獲得数"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バランススコアカード(BSC)は、ロバート・キャプランとデビッド・ノートンが提唱した業績評価・戦略管理のフレームワークであり、企業の業績を「財務の視点」「顧客の視点」「内部ビジネスプロセスの視点」「学習と成長の視点」という四つの視点からバランスよく評価する点に特徴がある。このうち\"学習と成長の視点\"は、将来にわたって企業が成長し続けるための基盤となる、従業員の能力・モチベーション・組織の情報インフラやイノベーション創出力などを測るものであり、従業員の特許取得件数は、組織が新たな知識や技術を生み出す力(イノベーション創出力・人材の能力)を表す指標として、この視点に分類される。選択肢イが正解である。選択肢アの顧客満足度調査の結果は\"顧客の視点\"、選択肢ウの従業員一人当たりの売上高は生産性を表す指標として主に\"内部ビジネスプロセスの視点\"や\"財務の視点\"、選択肢エの新規顧客獲得数は\"顧客の視点\"に分類される指標であり、いずれも学習と成長の視点には該当しない。</p>","mnemonic":""},{"id":37,"year":2024,"period":"令和6年度春期","num":13,"cat":"ストラテジ系","field":"SECIモデル","summary":"SECIモデル：令和6年度春期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>SECIモデルにおいて、新たに創造された知識を組織に広め、新たな暗黙知として習得するプロセスはどれか。</p>","choices":[{"label":"ア","html":"共同化 (Socialization)"},{"label":"イ","html":"表出化 (Externalization)"},{"label":"ウ","html":"連結化 (Combination)"},{"label":"エ","html":"内面化 (Internalization)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SECIモデルは、経営学者の野中郁次郎らが著書「知識創造企業」で提示した組織的知識創造理論であり、個人が持つ暗黙知(言語化しにくい経験知・勘)と、組織で共有できる形式知(言語化・文書化された知識)が、共同化(Socialization)→表出化(Externalization)→連結化(Combination)→内面化(Internalization)という4つのプロセスを経て相互に変換され、スパイラル状に組織全体の知識が創造・拡大していくと説明するモデルである。このうち内面化(Internalization)は、連結化によって体系化された形式知を、個人が実践・行動を通じて繰り返し利用することで、自分自身の新たな暗黙知として体得していくプロセスであり、新たに創造された知識が組織の中で実践を通じて個人のノウハウ・勘として定着していく段階に当たる。したがって選択肢エが正解である。選択肢アの共同化は、経験の共有によって暗黙知を暗黙知のまま他者に伝える段階、選択肢イの表出化は、対話や思考を通じて暗黙知を言語や図などの形式知に変換する段階、選択肢ウの連結化は、個々の形式知を組み合わせ・体系化して新たな形式知を創造する段階であり、いずれも「新たな暗黙知として習得する」段階ではない。</p>","mnemonic":""},{"id":38,"year":2024,"period":"令和6年度春期","num":14,"cat":"ストラテジ系","field":"APIエコノミー","summary":"APIエコノミー：令和6年度春期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>APIエコノミーの事例として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"既存の学内データベースのAPIを活用できるEAI(Enterprise Application Integration)ツールを使い、大学業務システムを短期間で再構築することによって経費を削減できた。"},{"label":"イ","html":"自社で開発した音声合成システムの利用を促進するために、自部門で開発したAPIを自社内の他の部署に提供した。"},{"label":"ウ","html":"不動産会社が自社で保持する顧客データをBI(Business Intelligence)ツールのAPIを使って可視化することによって、商圏における売上規模を分析できるようになった。"},{"label":"エ","html":"ホテル事業者が、他社が公開しているタクシー配車アプリのAPIを自社のアプリに組み込み、サービスを提供した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>APIエコノミーとは、企業が自社の機能やデータをAPI(Application Programming Interface)として外部に公開し、他社がそのAPIを組み合わせて新たなサービスを作り出すことで形成される経済圏を指す概念である。有名な事例として、配車サービスのUberが2014年に他社アプリへ配車リクエストボタンを組み込める「Uber API」を公開し、ホテルチェーンのHyatt Hotels & Resortsなどが自社アプリにUberの配車機能を組み込んで、宿泊客が別アプリを開かずに配車依頼できるようにした例が知られている。選択肢エの「ホテル事業者が、他社が公開しているタクシー配車アプリのAPIを自社のアプリに組み込み、サービスを提供した」は、まさにこのUberとHyattの事例に相当する、他社APIを活用した新たな価値創出の典型例であり正解である。選択肢アと選択肢ウは、いずれも自社内のデータベースやBIツールのAPIを自社システムの構築・分析に使っているだけで、他社との連携による経済圏の形成という側面がなく、選択肢イも自社開発のAPIを自社内の他部署に提供しているに過ぎず社外との連携がないため、いずれもAPIエコノミーの事例としては不適切である。</p>","mnemonic":""},{"id":39,"year":2024,"period":"令和6年度春期","num":15,"cat":"ストラテジ系","field":"SoE","summary":"SoE：令和6年度春期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>企業システムにおけるSoE(Systems of Engagement)の説明はどれか。</p>","choices":[{"label":"ア","html":"高可用性、拡張性、セキュリティを確保しながら情報システムを稼働させるためのハードウェア、ソフトウェアから構成されるシステム基盤"},{"label":"イ","html":"社内業務プロセスに組み込まれ、定型業務を処理し、結果を記録することによって省力化を実現するためのシステム"},{"label":"ウ","html":"データの活用を通じて、消費者や顧客企業とのつながりや関係性を深めるためのシステム"},{"label":"エ","html":"日々の仕訳伝票を入力した上で、データの改ざん、消失を防ぎながら取引データベースを維持管理することによって、財務報告を行うためのシステム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SoE(Systems of Engagement)は、企業のITシステムを、正確な記録や統制を目的とする基幹系システムSoR(Systems of Record)と対比させる概念としてジェフリー・ムーアが2011年に提唱したもので、モバイルアプリ、Webポータル、SNS、IoT機器など、企業が顧客や取引先と直接つながり、データの活用を通じてその関係性・つながり(エンゲージメント)を深めることを目的とするシステム群を指す。選択肢ウはこの「データの活用を通じて、消費者や顧客企業とのつながりや関係性を深めるためのシステム」という説明そのものであり正解である。選択肢イは社内の定型業務プロセスに組み込まれたシステムの説明で、これはむしろSoR的な基幹業務システムの特徴に近く、選択肢アは高可用性・拡張性を備えたシステム基盤(インフラ)の一般的な説明、選択肢エは会計システム(記録・財務報告のためのシステム)の説明であり、いずれもSoRの性格に近くSoEの説明ではない。</p>","mnemonic":""},{"id":40,"year":2024,"period":"令和6年度春期","num":16,"cat":"ストラテジ系","field":"操業度","summary":"操業度：令和6年度春期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>生産性指標のうち、操業度を説明したものはどれか。</p>","choices":[{"label":"ア","html":"工場全体の設備能力の利用度合いを、標準生産量に対する実際生産量の割合で表す。"},{"label":"イ","html":"個人若しくはグループ、又は一つの機械若しくは一群の機械について、総実働時間に対する有効作業時間(直接作業時間)の割合で表す。"},{"label":"ウ","html":"作業者一人一人の能率のことであり、計画工数に対する正味実績工数の割合で表す。"},{"label":"エ","html":"従業員一人当たりの生産額(生産量)で表す。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>操業度とは、工場全体が持つ設備能力をどの程度活用できているかを示す生産性指標の一つであり、標準的な生産能力(標準生産量)に対して実際にどれだけ生産できたか(実際生産量)の割合によって表される。操業度は稼働率・操業率とも呼ばれ、同じ製品を同じ設備で生産していても操業度の高低によって単位当たりの固定費負担(原価)が変わるため、原価計算や設備投資計画において重要な指標となる。選択肢アはこの「工場全体の設備能力の利用度合いを、標準生産量に対する実際生産量の割合で表す」という内容と一致しており正解である。選択肢イは個人・グループや機械の総実働時間に対する有効作業時間の割合であり稼働率(可動率)の説明、選択肢ウは計画工数に対する正味実績工数の割合であり作業者個人の能率(作業効率)の説明、選択肢エは従業員一人当たりの生産額であり労働生産性の説明であって、いずれも操業度の定義とは異なる。</p>","mnemonic":""},{"id":41,"year":2024,"period":"令和6年度春期","num":17,"cat":"ストラテジ系","field":"フィルターバブル","summary":"フィルターバブル：令和6年度春期 問17","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>SNSやWeb検索などに関して、イーライ・パリサーが提唱したフィルターバブルの記述として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"PCやスマートフォンなど、使用する機器の性能やソフトウェアの機能に応じて、利用者は情報へのアクセスにフィルターがかかっており、様々な格差が生じている。"},{"label":"イ","html":"SNSで一般のインターネット利用者が発信する情報が増えたことによって、Web検索の結果は非常に膨大なものとなり、個人による適切な情報収集が難しくなった。"},{"label":"ウ","html":"広告収入を目的に、事実とは異なるフィルターのかかったニュースがSNSなどを通じて発信されるようになったので、正確な情報を検索することが困難になった。"},{"label":"エ","html":"利用者の属性・行動などに応じ、好ましいと考えられる情報がより多く表示され、利用者は実社会とは隔てられたパーソナライズされた情報空間へと包まれる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フィルターバブルは、アメリカの活動家イーライ・パリサーが2011
