年の著書「閉じこもるインターネット」の中で提唱した概念で、検索エンジンやSNSが利用者の属性や過去の閲覧・検索履歴、クリック行動などのデータに基づいて、その利用者が好みそうな情報を選別して優先的に表示するアルゴリズムの結果、利用者が無意識のうちに自分の興味関心に合致した情報だけに囲まれ、異なる意見や多様な情報から隔てられたパーソナライズされた「泡(バブル)」の中に閉じ込められてしまう現象を指す。選択肢エはこの「利用者の属性・行動などに応じ、好ましいと考えられる情報がより多く表示され、利用者は実社会とは隔てられたパーソナライズされた情報空間へと包まれる」という内容を正確に述べており正解である。選択肢アは情報格差(デジタルデバイド)の説明、選択肢イは情報の氾濫による検索の困難さについての一般的な説明、選択肢ウはフェイクニュースの拡散に関する説明であり、いずれもパリサーが提唱したフィルターバブル固有の概念(パーソナライゼーションによる情報の選別と囲い込み)を説明したものではない。</p>","mnemonic":""},{"id":42,"year":2024,"period":"令和6年度春期","num":18,"cat":"テクノロジ系","field":"バスタブ曲線","summary":"バスタブ曲線：令和6年度春期 問18","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>バスタブ曲線における偶発故障期間の特徴を説明したものはどれか。</p>","choices":[{"label":"ア","html":"一旦下がった故障率が再び増加していく。"},{"label":"イ","html":"故障率は時間の経過によらずほぼ一定となる。"},{"label":"ウ","html":"最初は故障率が高く次第に故障率が低下していく。"},{"label":"エ","html":"最初は故障率が低く徐々に増加していく。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バスタブ曲線は、機器・部品の使用開始からの経過時間と故障率の関係を示したグラフであり、その形状が浴槽(バスタブ)に似ていることからこの名が付けられている。製品の寿命は一般に、製造上の欠陥などに起因して故障率が高く時間とともに低下していく「初期故障期間」、故障率がほぼ一定の低い水準で推移する「偶発故障期間」、部品の摩耗・劣化が進み故障率が再び増加していく「摩耗故障期間」の3つの期間に分けられる。このうち偶発故障期間は、初期不良が取り除かれ、まだ摩耗による劣化も進んでいない安定した期間であり、発生する故障は使用時間に関係なくランダム(偶発的)に起きるため、故障率は時間の経過によらずほぼ一定となる点が特徴である。選択肢イはこの内容と一致しており正解である。選択肢ウは初期故障期間の特徴であり、選択肢アと選択肢エはいずれの期間の典型的な特徴とも一致しない。</p>","mnemonic":""},{"id":43,"year":2024,"period":"令和6年度春期","num":19,"cat":"マネジメント系","field":"親和図法","summary":"親和図法：令和6年度春期 問19","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>親和図の特徴はどれか。</p>","choices":[{"label":"ア","html":"原因と結果を対比させた図式表現であり、不良原因の追及に用いられる。"},{"label":"イ","html":"錯綜した問題点や、まとまっていない意見、アイディアなどを整理し、まとめるために用いられる。"},{"label":"ウ","html":"二つ以上の変数の相互関係を表すのに役立つ。"},{"label":"エ","html":"分布の形、目標値からのばらつき状態などから、製品の品質の状態が規格値に対して満足いくものかなどを判断するために用いられる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>親和図法(アフィニティ・ダイアグラム)は、日本の文化人類学者・川喜田二郎が考案したKJ法を基にした手法で、日本科学技術連盟が1977年に体系化した「新QC七つ道具」の一つである。数値化が難しい言語データ(事実、意見、アイディアなど)をカードや付箋に書き出し、内容の親和性(近さ)によってグルーピングしていくことで、錯綜した問題点やまとまっていない意見を整理し、問題の全体構造や本質を明らかにするために用いられる。選択肢イはこの「錯綜した問題点や、まとまっていない意見、アイディアなどを整理し、まとめるために用いられる」という内容と一致しており正解である。選択肢アは特性要因図(魚の骨図)、選択肢ウは散布図、選択肢エはヒストグラムの説明であり、いずれも新QC七つ道具やQC七つ道具に含まれる別の図表の説明であって親和図法ではない。</p>","mnemonic":""},{"id":44,"year":2024,"period":"令和6年度春期","num":20,"cat":"ストラテジ系","field":"キャッシュフロー","summary":"キャッシュフロー：令和6年度春期 問20","correct":"ウ","result":"","formula":"営業CF=税引前利益+減価償却費－資産増加額+資産減少額+負債増加額－法人税等支払額","howto":"間接法：資産の増加はキャッシュのマイナス，負債の増加はキャッシュのプラスとして調整する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>キャッシュフロー計算書における，営業活動によるキャッシュフローは何万円か。</p><table><tr><td colspan='2'>単位　万円</td></tr><tr><td>税金等調整前当期純利益</td><td>108</td></tr><tr><td>減価償却費</td><td>42</td></tr><tr><td>売上債権の増加額</td><td>60</td></tr><tr><td>棚卸資産の減少額</td><td>30</td></tr><tr><td>仕入債務の増加額</td><td>40</td></tr><tr><td>法人税等の支払額</td><td>32</td></tr></table>","choices":[{"label":"ア","html":"44"},{"label":"イ","html":"104"},{"label":"ウ","html":"128"},{"label":"エ","html":"188"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>間接法による営業活動キャッシュフローは次のように調整する。</p><p>税金等調整前当期純利益108　＋　減価償却費42（非資金費用を足し戻す）</p><p>－　売上債権の増加額60（未回収の売上はキャッシュ増になっていないので差し引く）</p><p>＋　棚卸資産の減少額30（在庫が減った分は仕入支出が減りキャッシュ増）</p><p>＋　仕入債務の増加額40（未払いの仕入はまだキャッシュアウトしていないので足す）</p><p>－　法人税等の支払額32</p><p>108+42-60+30+40-32 = 128万円。よって答えはウ。</p>","mnemonic":"税引前108に経費や債権債務のデコボコを足し引きすると，IT業界お馴染みの数字“いちにっぱー（128）”に着地する。"},{"id":45,"year":2024,"period":"令和6年度春期","num":21,"cat":"ストラテジ系","field":"EVA","summary":"EVA：令和6年度春期 問21","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>EVA(経済的付加価値)の算出方法を説明したものはどれか。</p>","choices":[{"label":"ア","html":"効果の現在価値と投資額の差がゼロになる資本コストを求める。"},{"label":"イ","html":"税引後営業利益から資本コストを引いて金額を求める。"},{"label":"ウ","html":"投資額に対してどれだけ利益を生み出しているかを求める。"},{"label":"エ","html":"投資額を回収するのに必要な期間(年数)を求める。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EVA(Economic Value Added、経済的付加価値)は、米国のコンサルティング会社スターン・スチュワート社が開発した企業価値評価・業績管理の指標(同社の登録商標)であり、「税引後営業利益(NOPAT)から、投下資本(有利子負債と株主資本の合計)に資本コスト率(加重平均資本コストWACC)を掛けた資本コスト額を差し引いた金額」として算出される。EVAがプラスであれば、企業は資本提供者(債権者・株主)が期待する最低限のリターンを上回る価値を生み出していることを意味し、マイナスであれば資本コストに見合う収益を上げられておらず企業価値を毀損していることを意味する。選択肢イはこの「税引後営業利益から資本コストを引いて金額を求める」という算出方法を正確に述べており正解である。選択肢アは正味現在価値(NPV)がゼロになる割引率を求める内部収益率(IRR)の説明、選択肢ウは投資額に対する利益率を求めるROI(投資利益率)などの説明、選択肢エは投資額の回収に必要な年数を求める回収期間法(ペイバック期間)の説明であり、いずれもEVAの算出方法とは異なる。</p>","mnemonic":""},{"id":46,"year":2024,"period":"令和6年度春期","num":22,"cat":"ストラテジ系","field":"AI学習と著作権法","summary":"AI学習と著作権法：令和6年度春期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>公衆への提供などが行われた他人の著作物をAIの学習データとして利用する行為に関して、著作権法に照らして適切なものはどれか。ただし、著作物の利用は、AIによる情報解析の範囲で行われ、著作物に表現された思想又は感情を享受することを目的とするものではない。また、日本国内で作成された著作物を日本国内で利用する場合であり、利用者と著作権者との間で特段の契約は存在しないものとする。</p>","choices":[{"label":"ア","html":"他人の著作物から情報を抽出してAIに学習させる行為は、どのような条件においても、一切禁止されている。"},{"label":"イ","html":"著作権者の許諾が得られた場合に限って、著作権者との合意の範囲内において、AIの学習に利用できる。"},{"label":"ウ","html":"著作権者の利益を不当に害さない場合、その必要と認められる限度において、商業利用であるか否かを問わず、著作権者の許諾なくAIの学習に利用できる。"},{"label":"エ","html":"著作権者の利益を不当に害する場合及び商業利用の場合を除いて、著作権者の許諾なくAIの学習に利用できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>日本の著作権法第30条の4は、著作物を「情報解析」の用に供する場合など、著作物に表現された思想又は感情の享受を目的としない利用については、著作権者の許諾を得ることなく利用できると定めており、AIの学習データとして著作物を利用する行為の多くはこの規定によって原則として適法とされている。ただし同条には但し書きがあり、「著作物の種類及び用途並びに当該利用の態様に照らし著作権者の利益を不当に害することとなる場合」はこの限りでないとされ、例えば情報解析用に販売されているデータベースの著作物を無断で複製して学習に使う場合などが、不当に害する例として議論されている。選択肢ウは「著作権者の利益を不当に害さない場合、その必要と認められる限度において、商業利用であるか否かを問わず、著作権者の許諾なくAIの学習に利用できる」としており、30条の4の原則(享受目的でない利用は許諾不要)と但し書き(不当に利益を害する場合は除く)、及び非営利・商業の別を問わない点を正確に反映しており正解である。選択肢アは一切禁止としている点、選択肢イは許諾が得られた場合に限定している点で30条の4による無許諾利用を認める制度趣旨と矛盾し、選択肢エは「商業利用の場合を除いて」としている点が、30条の4が商業・非商業を区別していないという制度の特徴と一致しないため、いずれも誤りである。</p>","mnemonic":""},{"id":47,"year":2024,"period":"令和6年度春期","num":23,"cat":"テクノロジ系","field":"OCSP","summary":"OCSP：令和6年度春期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>OCSPクライアントからOCSPレスポンダーへのリクエストとそのレスポンスに関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"デジタル証明書全体をOCSPレスポンダーに送信し、そのレスポンスでデジタル証明書の有効性を確認する。"},{"label":"イ","html":"デジタル証明書全体をOCSPレスポンダーに送信し、そのレスポンスとしてタイムスタンプトークンの発行を受ける。"},{"label":"ウ","html":"デジタル証明書のシリアル番号、証明書発行者の識別名(DN)のハッシュ値などをOCSPレスポンダーに送信し、そのレスポンスでデジタル証明書の有効性を確認する。"},{"label":"エ","html":"デジタル証明書のシリアル番号、証明書発行者の識別名(DN)のハッシュ値などをOCSPレスポンダーに送信し、そのレスポンスとしてタイムスタンプトークンの発行を受ける。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>OCSP(Online Certificate Status Protocol)は、デジタル証明書が失効しているかどうかをリアルタイムに確認するためのプロトコルであり、証明書失効リスト(CRL)を定期的にダウンロードして照合する方式に代わる仕組みとしてRFC 2560(現在はRFC 6960)で規定されている。OCSPクライアントは、確認したいデジタル証明書そのものを送信するのではなく、証明書のシリアル番号、発行者(CA)の識別名(DN)のハッシュ値、発行者の公開鍵のハッシュ値などから構成される証明書識別情報(CertID)をOCSPレスポンダーに送信し、OCSPレスポンダーはこれに基づきデータベースを参照して、その証明書が有効(good)・失効(revoked)・不明(unknown)のいずれであるかを示す署名付きレスポンスを返す。選択肢ウはこの「シリアル番号、発行者の識別名(DN)のハッシュ値などを送信し、有効性を確認する」という内容と一致しており正解である。選択肢アとイは証明書全体を送信するとしている点が誤りであり、選択肢イとエはレスポンスとしてタイムスタンプトークンの発行を受けるとしているが、タイムスタンプトークンはタイムスタンプ局(TSA)が発行するものであって、証明書の有効性確認を行うOCSPのレスポンスとは異なる。</p>","mnemonic":""},{"id":48,"year":2024,"period":"令和6年度春期","num":24,"cat":"テクノロジ系","field":"ファイルレス攻撃","summary":"ファイルレス攻撃：令和6年度春期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>マルウェアが、その実行ファイルをターゲットのコンピュータのファイルシステム上に生成せずに、メモリ上にだけ生成することによって、マルウェア対策ソフトが行うマルウェアのファイル解析と検知を難しくする攻撃はどれか。</p>","choices":[{"label":"ア","html":"OSコマンドインジェクション攻撃"},{"label":"イ","html":"カミンスキー攻撃"},{"label":"ウ","html":"クロスサイトスクリプティング攻撃"},{"label":"エ","html":"ファイルレス攻撃"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファイルレス攻撃(ファイルレスマルウェア)は、攻撃対象のコンピュータのファイルシステム(ハードディスクなど)上に実行ファイルを生成・保存せず、PowerShellやWMIなどOSに標準搭載された正規のツールを悪用したり、悪意のあるコードをメモリ上にのみ展開・実行したりすることで攻撃を行う手法である。従来のマルウェア対策ソフトの多くは、ディスク上に保存されたファイルを既知のマルウェアの特徴(シグネチャ)と照合するパターンマッチング方式を中心に検知を行うため、ファイルとして実体が残らないファイルレス攻撃は、このファイル解析・検知の仕組みをすり抜けやすく、発見が困難になる。選択肢エはこの内容と一致しており正解である。選択肢アのOSコマンドインジェクション攻撃はWebアプリケーションの入力値を介してOSコマンドを不正実行させる攻撃、選択肢イのカミンスキー攻撃はDNSキャッシュポイズニングの一種、選択肢ウのクロスサイトスクリプティング攻撃はWebページに悪意のあるスクリプトを埋め込み他の利用者のブラウザ上で実行させる攻撃であり、いずれも実行ファイルを生成しないことでファイル解析を回避するという本問の特徴とは異なる攻撃手法である。</p>","mnemonic":""},{"id":49,"year":2024,"period":"令和6年度春期","num":25,"cat":"テクノロジ系","field":"ISMAP","summary":"ISMAP：令和6年度春期 問25","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>\"政府情報システムのためのセキュリティ評価制度(ISMAP)管理基準(令和5年9月22日最終改定)\"に関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"ISMAP管理基準は、ガバナンス基準、マネジメント基準、管理策基準、監査基準の四つから構成されている。"},{"label":"イ","html":"ガバナンス基準の実施主体は経営陣であり、情報セキュリティガバナンスのプロセスとして、評価、指示、モニタ、コミュニケーション及び保証の各プロセスが定められている。"},{"label":"ウ","html":"管理策基準は、管理者が実施すべき事項として、情報セキュリティマネジメントの計画、実行、点検、処置及びリスクコミュニケーションに必要な事項を定めている。"},{"label":"エ","html":"マネジメント基準は、組織における情報セキュリティマネジメントの確立段階において、リスク対応方針に従って管理策を選択する際の選択肢を与えている。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ISMAP(政府情報システムのためのセキュリティ評価制度)は、政府がクラウドサービスを調達する際に、あらかじめセキュリティ要件を満たしているサービスを評価・登録しておく制度であり、その中核をなす「ISMAP管理基準」は、クラウドサービス事業者が実施すべき情報セキュリティ対策を定めたものである。管理基準は大きく「ガバナンス基準」「マネジメント基準」「管理策基準」の3つの基準から構成されており、ガバナンス基準はクラウドサービス事業者の経営陣が実施主体となり、組織の情報セキュリティガバナンスを確立するための評価・指示・モニタ・コミュニケーション及び保証といったプロセスを定めている。選択肢イはこの「ガバナンス基準の実施主体は経営陣であり、評価、指示、モニタ、コミュニケーション及び保証の各プロセスが定められている」という内容と一致しており正解である。選択肢アはガバナンス基準・マネジメント基準・管理策基準の3つに加えて「監査基準」を含む4つから構成されるとしているが、実際には3基準構成であるため誤り。選択肢ウは管理策基準の内容として情報セキュリティマネジメントの計画・実行・点検・処置(PDCA)を挙げているが、これはむしろ管理者が運用管理を行うマネジメント基準の内容に近く、選択肢エのマネジメント基準の説明についても、リスク対応の選択肢を与えるという内容はむしろ管理策基準側の性格に近いため、ウとエはそれぞれ基準の取り違えがあり誤りである。</p>","mnemonic":""},{"id":50,"year":2023,"period":"令和5年度春期","num":1,"cat":"ストラテジ系","field":"SCM(SCOR)","summary":"SCM(SCOR)：令和5年度春期 問1","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>SCOR (Supply Chain Operations Reference model) で定義している SCM に関する実行プロセスのうち，自社にとっての Source に当たるものはどれか。</p>","choices":[{"label":"ア","html":"資材などの購入"},{"label":"イ","html":"受注と納入"},{"label":"ウ","html":"納入後に発生する作業"},{"label":"エ","html":"プロダクトの生産，サービスの実施"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。SCOR(Supply Chain Operations Reference)モデルは、サプライチェーン業務を5つの主要管理プロセス(Plan:計画、Source:調達、Make:製造、Deliver:納入、Return:返品)に分類する標準的なフレームワークである。このうちSourceは、需要を満たすために必要な資材や部品、サービスを確保する工程であり、具体的には資材などの購買、仕入先の選定・契約、入荷・検収といった活動を含む。設問の「自社にとってのSource」とは、自社が他社(仕入先)から資材などを調達する側面を指すため、選択肢アの「資材などの購入」が該当する。一方、イの「受注と納入」は顧客からみた自社のDeliver(納入)に相当し、ウの「納入後に発生する作業」はReturn(返品)やアフターサービスに近い概念であり、エの「プロダクトの生産，サービスの実施」はMake(製造)に該当するため、いずれもSourceではない。このようにSCORはサプライチェーン上の「自社」を起点に、川上(Source)・自社内(Make)・川下(Deliver)の各プロセスを整理して捉える点が特徴である。</p>","mnemonic":""},{"id":51,"year":2023,"period":"令和5年度春期","num":2,"cat":"テクノロジ系","field":"プロビジョニング","summary":"プロビジョニング：令和5年度春期 問2","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>クラウドサービスなどの提供を迅速に実現するためのプロビジョニングの説明はどれか。</p>","choices":[{"label":"ア","html":"企業の情報システムの企画，設計，開発，導入，保守などのサービスを，一貫して又は工程の幾つかを部分的に提供する。"},{"label":"イ","html":"業種や事業内容などで共通する複数の企業や組織が共同でデータセンターを運用して，それぞれがインターネットを通して各種サービスを利用する。"},{"label":"ウ","html":"自社でハードウェア，ネットワークなどの環境を用意し，業務パッケージなどを導入して利用する運用形態にする。"},{"label":"エ","html":"利用者の需要を予想し，ネットワーク設備やシステムリソースなどを計画的に調達して強化し，利用者の要求に応じたサービスを提供できるように備える。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。プロビジョニングとは、IT分野において必要になった時にすぐ利用できるよう、あらかじめリソースを準備・用意しておくことを指す言葉であり、サーバーやネットワーク、ストレージ、ユーザーアカウントなど対象は多岐にわたる。クラウドサービスの文脈では特に、利用者の需要の増減を見越して、ネットワーク設備やサーバ・ストレージなどのシステムリソースを計画的に調達・拡張しておき、必要なときに迅速にサービスを提供できる体制を整えることを意味し、これが選択肢エの記述と一致する。実際、クラウドのコスト最適化に関する解説でも、需要予測に基づいて過不足のないリソース供給を行うことでコストを抑えつつ機動的なサービス提供を両立させる考え方として説明されている。これに対し、アは個別のシステム開発・保守サービスの一括ないし部分受託(いわゆるSIサービス)の説明であり、イは複数企業が共同でデータセンターを運用する形態、ウは自社でハードウェアを保有し運用するオンプレミス型の説明であって、いずれもプロビジョニングそのものの定義ではない。</p>","mnemonic":""},{"id":52,"year":2023,"period":"令和5年度春期","num":3,"cat":"ストラテジ系","field":"ロジスティック回帰","summary":"ロジスティック回帰：令和5年度春期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>多数の被験者の検診データから，説明変数である年齢，飲酒の頻度及び喫煙本数が，目的変数であるガンの発症の有無に及ぼす影響を統計的に分析した上で，ある人の年齢，飲酒の頻度及び喫煙本数から，その人のガンの発症確率を推定するモデルを構築した。このとき用いられる分析手法はどれか。</p><table><caption>検診データのサンプル</caption><tr><th>年齢</th><th>飲酒の頻度(回/週)</th><th>喫煙本数(本/週)</th><th>ガンの発症の有無</th></tr><tr><td>50</td><td>7</td><td>70</td><td>有</td></tr><tr><td>40</td><td>5</td><td>40</td><td>有</td></tr><tr><td>55</td><td>2</td><td>10</td><td>無</td></tr><tr><td>45</td><td>5</td><td>0</td><td>無</td></tr></table>","choices":[{"label":"ア","html":"ABC分析"},{"label":"イ","html":"クラスター分析"},{"label":"ウ","html":"主成分分析"},{"label":"エ","html":"ロジスティック回帰分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。設問は、年齢・飲酒頻度・喫煙本数という説明変数から、ガン発症の有無(二値の目的変数)が生じる確率を推定するモデルを構築する状況を述べており、これはロジスティック回帰分析の典型的な適用例である。ロジスティック回帰分析は、目的変数が「発症する/しない」のような二値(または確率)であるときに、説明変数の線形結合をロジット変換(log(p/(1-p)))して確率pを推定する統計的手法であり、医学統計や与信審査、購買予測など「起こる確率」を求めたい場面で広く使われている。係数は最尤法で推定され、各説明変数の影響度はオッズ比として解釈されることが多い。これに対し、アのABC分析は在庫・顧客などを重要度別にランク付けする分析、イのクラスター分析はデータを類似性に基づいてグループ化する教師なし学習の手法、ウの主成分分析は多数の変数を少数の合成変数に要約する次元削減の手法であり、いずれも「確率を推定する」目的には直接対応しないため、本問には当てはまらない。</p>","mnemonic":""},{"id":53,"year":2023,"period":"令和5年度春期","num":4,"cat":"ストラテジ系","field":"NPV評価","summary":"NPV評価：令和5年度春期 問4","correct":"ウ","result":"","formula":"NPV=Σ(CFₙ÷(1+r)ⁿ)－初期投資額","howto":"各年のCFを(1+10%)^nで割って現在価値化し，合計から初期投資額を引いて比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>スマートフォン向けのアプリケーションプログラムの開発プロジェクトa〜dにおいて，2年間の投資効果をNPVで評価する場合，投資効果が最大となるプロジェクトはどれか。ここで，割引率は10％とする。</p><table><tr><td>単位</td><td colspan='3'>百万円</td></tr><tr><td>プロジェクト</td><td>初期投資額</td><td>1年目キャッシュフロー</td><td>2年目キャッシュフロー</td></tr><tr><td>a</td><td>7.9</td><td>4.40</td><td>4.84</td></tr><tr><td>b</td><td>5.5</td><td>3.30</td><td>3.63</td></tr><tr><td>c</td><td>4.3</td><td>3.30</td><td>2.42</td></tr><tr><td>d</td><td>6.1</td><td>2.20</td><td>3.63</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率10%なので，1年目は÷1.1，2年目は÷1.21で現在価値化する。各プロジェクトのキャッシュフローはいずれも÷1.1，÷1.21がちょうど割り切れる数字になっている点に着目する。</p><p>a: -7.9 + 4.40/1.1 + 4.84/1.21 = -7.9 + 4.0 + 4.0 = 0.1</p><p>b: -5.5 + 3.30/1.1 + 3.63/1.21 = -5.5 + 3.0 + 3.0 = 0.5</p><p>c: -4.3 + 3.30/1.1 + 2.42/1.21 = -4.3 + 3.0 + 2.0 = 0.7</p><p>d: -6.1 + 2.20/1.1 + 3.63/1.21 = -6.1 + 2.0 + 3.0 = -1.1</p><p>NPVが最大なのはc（0.7百万円）。よって答えはウ。</p>","mnemonic":"初期投資4.3百万と一番小粒な“c”が，2年分のCFを効率よく稼いでNPV+0.7で四つの中の一人勝ちになる。"},{"id":54,"year":2023,"period":"令和5年度春期","num":5,"cat":"テクノロジ系","field":"非機能要件","summary":"非機能要件：令和5年度春期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>利用者要件のうち，非機能要件項目はどれか。</p>","choices":[{"label":"ア","html":"新しい業務の在り方や運用に関わる業務手順，入出力情報，組織，責任，権限，業務上の制約などの項目"},{"label":"イ","html":"新しい業務の遂行に必要なアプリケーションシステムに関わる利用者の作業，システム機能の実現範囲，機能間の情報の流れなどの項目"},{"label":"ウ","html":"経営戦略や情報戦略に関わる経営上のニーズ，システム化・システム改善を必要とする業務上の課題，求められる成果・目標などの項目"},{"label":"エ","html":"システム基盤に関わる可用性，性能，拡張性，運用性，保守性，移行性などの項目"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。要件定義では、システムに実装すべき機能そのものを定める「機能要件」と、性能・品質・制約など機能以外の側面を定める「非機能要件」を区別する。非機能要件は「システムがどのように動作するか」を規定するものであり、可用性(稼働率や障害時の復旧水準)、性能(応答時間や処理能力)、拡張性(将来の利用者増やデータ量増への対応力)、運用性・保守性、移行性などの項目から構成され、IPAの「非機能要求グレード」もこれらを体系的に整理している。したがって選択肢エの「可用性，性能，拡張性，運用性，保守性，移行性などの項目」が非機能要件に該当する。一方、アは新業務の手順や責任・権限などの業務要件、イはアプリケーションシステムの機能範囲や情報の流れを定める機能要件、ウは経営戦略・情報戦略に関わる上位の企画・要求事項であり、いずれも「機能以外」を定める非機能要件ではない。</p>","mnemonic":""},{"id":55,"year":2023,"period":"令和5年度春期","num":6,"cat":"ストラテジ系","field":"市場セグメンテーション","summary":"市場セグメンテーション：令和5年度春期 問6","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>消費者市場のセグメンテーション変数のうち，人口統計的変数はどれか。</p>","choices":[{"label":"ア","html":"使用頻度，ロイヤルティ"},{"label":"イ","html":"都市規模，人口密度"},{"label":"ウ","html":"年齢，職業"},{"label":"エ","html":"パーソナリティ，ライフスタイル"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。消費者市場のセグメンテーションでは、地理的変数、人口統計的(デモグラフィック)変数、心理的(サイコグラフィック)変数、行動変数の4種類が代表的に用いられる。このうち人口統計的変数は、年齢、性別、職業、所得、家族構成、学歴などの客観的・定量的に把握しやすい属性を指し、市場区分の基本的な軸として広く使われる。選択肢ウの「年齢，職業」はまさにこれに該当する。一方、アの「使用頻度，ロイヤルティ」は製品の使用状況に関する行動変数、イの「都市規模，人口密度」は居住地域の特性を示す地理的変数、エの「パーソナリティ，ライフスタイル」は心理的特性を示す心理的変数であり、いずれも人口統計的変数とは異なるカテゴリに分類される。</p>","mnemonic":""},{"id":56,"year":2023,"period":"令和5年度春期","num":7,"cat":"ストラテジ系","field":"ブランド戦略","summary":"ブランド戦略：令和5年度春期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>ブランド戦略における，ブランドエクイティを説明したものはどれか。</p>","choices":[{"label":"ア","html":"顧客がそのブランドに対してどの程度の執着心をもっているかを示す概念であり，これが高いほど，顧客は他のブランドに乗り換えにくくなる。"},{"label":"イ","html":"顧客がブランド要素に接触したとき，企業として顧客の心の中に何を連想してほしいのかというイメージである。"},{"label":"ウ","html":"特定の組織にとって自社のブランドの名前やシンボルと結び付いたブランドの資産の集合であり，製品やサービスの価値を増大させるものである。"},{"label":"エ","html":"名称，キャッチフレーズ，ロゴマーク，キャラクター，記号，包装，スローガンなど，ブランドを特定して差別化するための要素である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。ブランドエクイティ(ブランド資産)は、D.A.アーカーが提唱した概念を代表例として、特定のブランドの名前やシンボルと結び付いた資産・負債の集合であり、その製品やサービスが顧客にもたらす価値を増大(あるいは減少)させるものと定義される。これはバランスシートには直接現れない無形資産であるが、ブランド認知、知覚品質、ブランド連想、ブランドロイヤルティといった要素から構成され、企業の収益力の源泉となる。選択肢ウはこの定義に合致する。これに対し、アは構成要素の一つである「ブランドロイヤルティ」そのものの説明であり、イは企業が顧客に抱いてほしいイメージ(ブランドイメージ・連想)の説明、エは名称やロゴなど「ブランド要素(ブランド識別子)」の説明であって、いずれもブランドエクイティ全体を指すものではない点が混同しやすいポイントである。</p>","mnemonic":""},{"id":57,"year":2023,"period":"令和5年度春期","num":8,"cat":"ストラテジ系","field":"マーケティング調査","summary":"マーケティング調査：令和5年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>マーケティング調査におけるエスノグラフィーの活用事例はどれか。</p>","choices":[{"label":"ア","html":"業界誌や業界新聞，調査会社の売れ筋ランキングなどから消費者の動向を探る。"},{"label":"イ","html":"広告の一部に資料請求の項目を入れておき，それを照会してきた人数を調べる。"},{"label":"ウ","html":"消費行動の現場で観察やインタビューを行い，気付かなかった需要を発掘する。"},{"label":"エ","html":"同等の条件下で複数パターンの見出しを広告として表示し，反応の違いを測る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。エスノグラフィーはもともと文化人類学の調査手法であり、マーケティング調査に応用される際は、調査員が消費者の生活空間や購買・使用の現場に身を置き、行動を観察したり対話したりすることで、本人も意識していない潜在的なニーズや行動の背景を発掘する定性調査手法である。アンケートやインタビューが「言葉で語られる顕在的なニーズ」を把握するのに対し、エスノグラフィーは「言葉にならない行動」から気付きを得る点が特徴とされる。選択肢ウの「消費行動の現場で観察やインタビューを行い，気付かなかった需要を発掘する」はこの特徴と合致する。一方、アは二次データ(業界誌・ランキング)を用いた動向分析、イはダイレクトレスポンス広告の反応測定、エはA/Bテストによる広告効果測定であり、いずれも現場観察を伴わないため、エスノグラフィーの事例には当たらない。</p>","mnemonic":""},{"id":58,"year":2023,"period":"令和5年度春期","num":9,"cat":"ストラテジ系","field":"Web流入分析","summary":"Web流入分析：令和5年度春期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>自社Webサイトへの流入経路分析を行う目的に該当するものはどれか。</p>","choices":[{"label":"ア","html":"自社Webサイトが利用者にとって魅力的なコンテンツかどうかを把握するため"},{"label":"イ","html":"自社Webサイトの利用者がどこを注視しているのかを把握するため"},{"label":"ウ","html":"自社が投資したバナー広告やSEO対策の効果を検証するため"},{"label":"エ","html":"自社のWeb広告と競合企業のWeb広告の出稿状況を比較するため"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。Webサイトへの流入経路分析(リファラー分析)は、自然検索、有料広告(リスティング・バナーなど)、SNS、メールなど、どの経路から訪問者が流入しているかを明らかにする分析であり、各集客チャネル・施策がどれだけ効果を上げているかを把握し、投資対効果の検証や予算配分の見直しに活用される。したがって、選択肢ウの「自社が投資したバナー広告やSEO対策の効果を検証するため」が目的として最も適切である。一方、アのコンテンツの魅力度把握には滞在時間や直帰率などのエンゲージメント指標、イの視線の動きの把握にはヒートマップやアイトラッキング、エの競合比較には競合サイト分析ツールなど、それぞれ別の分析手法が用いられるのが一般的であり、流入経路分析そのものの主目的ではない。</p>","mnemonic":""},{"id":59,"year":2023,"period":"令和5年度春期","num":10,"cat":"ストラテジ系","field":"サービス経営","summary":"サービス経営：令和5年度春期 問10","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>J.L.ヘスケットとW.E.サッサーが提唱したサービスプロフィットチェーンの説明はどれか。</p>","choices":[{"label":"ア","html":"企業のビジョンと戦略の実現を目的として，財務，顧客，内部プロセス及び学習と成長の視点から達成指標やアクションプランを具体化するためのモデル"},{"label":"イ","html":"顧客ごとの購買履歴を蓄積することによって顧客の収益貢献度を測定し，これに基づき，収益貢献度が高い顧客に対するサービス水準を向上するためのモデル"},{"label":"ウ","html":"市場の魅力度及び市場内での自社の地位を基に，企業の製品及びサービスを分類し，どの分野に経営資源を投下し，利益を回収すべきかを検討するためのモデル"},{"label":"エ","html":"従業員満足度がサービス水準を高め，それが顧客満足度及び企業利益を高め，高めた利益で従業員満足度が更に向上するという因果関係を表したモデル"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。サービスプロフィットチェーンは、J.L.ヘスケットとW.E.サッサーらが1994年のHarvard Business Reviewの論文「Putting the Service-Profit Chain to Work」で提唱した概念であり、従業員満足度の向上がサービス品質・提供水準の向上につながり、それが顧客満足度を高め、ひいては顧客ロイヤルティと企業収益の向上をもたらし、その利益を従業員満足度向上へ再投資することでさらなる好循環が生まれる、という一連の因果連鎖を表すモデルである。選択肢エの記述はこの因果関係と一致する。これに対し、アは財務・顧客・内部プロセス・学習と成長の4視点から戦略を具体化するバランススコアカード(BSC)の説明、イは顧客の収益貢献度に基づくCRM的な顧客ランク付けの説明、ウは市場の魅力度と自社の相対的地位から事業ポートフォリオを評価するPPM(プロダクト・ポートフォリオ・マネジメント)の説明であり、いずれもサービスプロフィットチェーンとは異なる経営管理フレームワークであるため、混同しないよう注意が必要である。</p>","mnemonic":""},{"id":60,"year":2023,"period":"令和5年度春期","num":11,"cat":"マネジメント系","field":"シックスシグマ","summary":"シックスシグマ：令和5年度春期 問11","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>図は，シックスシグマの基本となる日常業務の効率や品質の向上を目指す継続的改善サイクルである。このサイクルのcに該当するフェーズはどれか。ここで，ア〜エはa〜dのいずれかに対応する。</p><p>[図: 定義 → a → b → c → d という流れで，dからaへ戻るフィードバックのループが描かれている]</p>","choices":[{"label":"ア","html":"改善"},{"label":"イ","html":"測定"},{"label":"ウ","html":"定着"},{"label":"エ","html":"分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。シックスシグマの継続的改善サイクルはDMAIC(Define定義、Measure測定、Analyze分析、Improve改善、Control定着・管理)の5段階から成る。設問の図では「定義」が最初に一度だけ実行される起点として描かれ、その後a→b→c→dが繰り返しループする構造になっている。DMAICの標準的な順序に当てはめると、定義の後はMeasure(測定)、続いてAnalyze(分析)、Improve(改善)、Control(定着)という順になり、Control(定着)が終わると再びMeasure(測定)に戻って改善サイクルを継続する。したがってa=測定(イ)、b=分析(エ)、c=改善(ア)、d=定着(ウ)となり、cに該当するのは「改善」である。Define(定義)では顧客の声(VOC)から重要品質特性(CTQ)を導き課題を設定し、Measureでは現状のデータを収集して把握し、Analyzeでは原因仮説を洗い出して優先順位付けし、Improveでは効果の大きい対策を立案・検証し、Controlでは対策を現場に定着させ継続的に監視する、という流れになる。</p>","mnemonic":""},{"id":61,"year":2023,"period":"令和5年度春期","num":12,"cat":"マネジメント系","field":"在庫管理","summary":"在庫管理：令和5年度春期 問12","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>ダブルビン方式の特徴はどれか。</p>","choices":[{"label":"ア","html":"単価が高く体積が大きい又は需要変動が大きい重点管理品に適する。"},{"label":"イ","html":"発注間隔が一定で発注量が増減する。"},{"label":"ウ","html":"発注点と発注量が等しく，都度の在庫調査の必要がない。"},{"label":"エ","html":"発注点と発注量は調達リードタイムに関係しない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。ダブルビン方式(複棚法・二棚法)は、在庫を同容量の2つの容器(ビン)に分けておき、一方のビンが空になった時点でそれを発注のサインとして一定量を補充発注し、その間はもう一方のビンから出庫を続けるという、簡易な定量発注方式の一種である。各ビンの容量があらかじめ発注点(および発注量)として設定されているため、在庫量を都度数えたり計算したりする必要がなく、目視による現品管理だけで運用できる点が特徴であり、選択肢ウの「発注点と発注量が等しく，都度の在庫調査の必要がない」という説明に一致する。これに対し、アは単価が高く需要変動の大きい重点管理品には、むしろ定期発注方式や個別管理など、より精緻な管理手法が適するとされ、ダブルビン方式は一般に単価が低く重要度の低い品目向けの簡易方式であるため誤りである。イは発注量が一定で発注タイミングが変動する定期発注方式の特徴であり、エは発注点の設定自体が調達リードタイム中の消費量を踏まえて決められるため、リードタイムに関係しないという説明も誤りである。</p>","mnemonic":""},{"id":62,"year":2023,"period":"令和5年度春期","num":13,"cat":"ストラテジ系","field":"ナレッジマネジメント","summary":"ナレッジマネジメント：令和5年度春期 問13","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>SECIモデルにおける，内面化の説明はどれか。</p>","choices":[{"label":"ア","html":"新たに創造された知識を組織に広め，新たな暗黙知として習得すること"},{"label":"イ","html":"組織内の個人，小グループが有する暗黙知を形式知として明示化すること"},{"label":"ウ","html":"組織内の個人，小グループで暗黙知の共有化や，新たな暗黙知の創造を行うこと"},{"label":"エ","html":"明示化した形式知を組み合わせ，それを基に新たな知識を創造すること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。SECIモデルは野中郁次郎氏らが提唱した組織的知識創造理論であり、共同化(Socialization：暗黙知を暗黙知のまま経験の共有を通じて伝える)、表出化(Externalization：暗黙知を言語化・概念化して形式知に変換する)、連結化(Combination：形式知同士を組み合わせて体系化する)、内面化(Internalization：形式知を実践や経験を通じて個人の暗黙知として体得する)という4つの知識変換プロセスがスパイラル状に繰り返されることで組織の知識が創造・拡大すると説明される。このうち内面化は、連結化によって整理・体系化された新たな知識(形式知)を、個人が研修やOJTなどの実践を通じて使いこなし、自分自身の暗黙知(ノウハウ・経験知)として再び身につける段階であり、選択肢アの「新たに創造された知識を組織に広め，新たな暗黙知として習得すること」がこれに該当する。選択肢イは暗黙知を形式知に変換する表出化、ウは暗黙知同士を共有・創造する共同化、エは形式知同士を組み合わせる連結化の説明であり、それぞれ別の変換プロセスを指しているため混同に注意が必要である。</p>","mnemonic":""},{"id":63,"year":2023,"period":"令和5年度春期","num":14,"cat":"ストラテジ系","field":"技術経営(MOT)","summary":"技術経営(MOT)：令和5年度春期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>技術経営における“魔の川”の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"研究の開始までに横たわる障壁"},{"label":"イ","html":"研究の結果を基に製品開発するまでの間に横たわる障壁"},{"label":"ウ","html":"事業化から市場での成功までの間に横たわる障壁"},{"label":"エ","html":"製品開発から事業化までの間に横たわる障壁"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。技術経営(MOT)の分野では、技術が事業として成功するまでに乗り越えるべき3つの障壁として「魔の川」「死の谷」「ダーウィンの海」がしばしば挙げられる。「魔の川」は、基礎研究・応用研究の成果が、実際に製品化・事業化に向けた開発プロジェクトとして採択されるまでの間に存在する障壁、すなわち研究成果が開発段階へ橋渡しされるかどうかの関門を指す。選択肢イの「研究の結果を基に製品開発するまでの間に横たわる障壁」はこの定義と一致する。これに対し、「死の谷」は開発された製品・技術が事業化(量産・市場投入)に至るまでの資金・体制面の障壁(選択肢エに相当)、「ダーウィンの海」は事業化された製品が競合との競争の中で市場での成功を勝ち取れるかという障壁(選択肢ウに相当)を指し、両者は「魔の川」とは異なる段階の障壁であるため、順序や名称を取り違えないよう注意が必要である。</p>","mnemonic":""},{"id":64,"year":2023,"period":"令和5年度春期","num":15,"cat":"テクノロジ系","field":"BIM/CIM","summary":"BIM/CIM：令和5年度春期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>BIM/CIMの説明はどれか。</p>","choices":[{"label":"ア","html":"業務プロセスやワークフローなどのつながりや関係性を表記する際に用いられる，ビジネスプロセスのモデリング手法"},{"label":"イ","html":"建築や建設の調査・計画・設計段階から3次元モデルを導入し，施工，維持管理まで，一連の建設生産・管理システムにおける品質確保と関係者間の業務効率化・高度化を図る取組"},{"label":"ウ","html":"災害などの緊急事態に，中核となる事業の継続や早期復旧を行うため，平常時に行うべき活動や緊急時の事業継続のための方針，体制，手順などを取り決めておく計画"},{"label":"エ","html":"データウェアハウスなど企業内に蓄積された膨大なデータを統合・分析・管理し，企業の意思決定に活用するシステムや概念の総称"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。BIM(Building Information Modeling)は建築分野、CIM(Construction Information Modeling/Management)は土木分野を対象とする取組みであり、いずれも国土交通省が建設業の生産性向上(i-Constructionなど)の一環として推進している。調査・計画・設計の段階から構造物の3次元モデルを導入し、属性情報(部材の仕様・数量・工程など)を付加しながら、施工、維持管理に至る建設生産・管理プロセス全体で情報を一貫して連携・活用することで、関係者間の情報共有を円滑にし、手戻りの削減や品質確保、業務効率化・高度化を図る取組みであり、選択肢イの記述がこれに一致する。一方、アはBPMN(ビジネスプロセスモデリング)の説明、ウはBCP(事業継続計画)の説明、エはデータウェアハウスやBI(ビジネスインテリジェンス)に関する説明であり、いずれもBIM/CIMとは異なる概念である。</p>","mnemonic":""},{"id":65,"year":2023,"period":"令和5年度春期","num":16,"cat":"マネジメント系","field":"JIT生産方式","summary":"JIT生産方式：令和5年度春期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>JIT (Just In Time) の特徴はどれか。</p>","choices":[{"label":"ア","html":"押し出し方式（プッシュシステム）である。"},{"label":"イ","html":"各工程は使用した分だけを前工程に発注する。"},{"label":"ウ","html":"他の品目の需要に連動しない在庫システムである。"},{"label":"エ","html":"毎回仕様が異なる受注生産型の工場に適している。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。JIT(Just In Time)はトヨタ生産方式を支える考え方の一つであり、「必要なものを、必要なときに、必要な量だけ」生産・供給することで、仕掛品や完成品の過剰な在庫を持たないようにする生産管理手法である。その実現手段として、後工程が使用した分だけを前工程に取りに行く「後工程引取方式」(かんばん方式)が用いられ、これにより生産はプル型(需要に引っ張られる形)で連動する。選択肢イの「各工程は使用した分だけを前工程に発注する」はこの仕組みと一致する。一方、アの「押し出し方式(プッシュシステム)」は、あらかじめ立てた計画に基づいて前工程から後工程へ生産物を送り出す方式であり、JITとは逆の考え方(MRP的な発想)である。ウについては、JITはむしろ平準化生産や需要変動を踏まえた生産調整を志向するため「需要に連動しない」という説明は誤りであり、エについても、JITは仕様変動の少ない繰り返し生産・平準化生産に適した方式であるため、毎回仕様が異なる受注生産型工場への適合性を述べるのは誤りである。</p>","mnemonic":""},{"id":66,"year":2023,"period":"令和5年度春期","num":17,"cat":"テクノロジ系","field":"OT(制御技術)","summary":"OT(制御技術)：令和5年度春期 問17","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>ITとの連携が進むとされるOT (Operational Technology) の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"新しい概念，理論，原理及びアイディアの実証を目的とした，試作開発の前段階における検証及びデモンストレーションのこと"},{"label":"イ","html":"工場やプラント，ビルなどを制御する機器を運用するシステムやその技術"},{"label":"ウ","html":"サーバ側で稼働しているソフトウェアを，インターネットなどのネットワーク経由でクライアントがサービスとして利用する状況"},{"label":"エ","html":"情報技術に情報及び知識の共有といったコミュニケーションの重要性及び意味を付加したもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。OT(Operational Technology、制御技術)とは、工場の生産設備やプラント、ビルなどにおいて、センサーやアクチュエーター、PLC(プログラマブルロジックコントローラ)、SCADAなどを通じて物理的な機器・プロセスを監視・制御するためのシステムや技術の総称である。従来、OTはオフィス等で用いられるIT(情報技術)とは独立したネットワークで運用されることが多かったが、近年はIoTの普及により、工場のデータを経営情報システムと連携させるIT/OTコンバージェンス(融合)が進んでおり、これによりセキュリティ対策の重要性も増している。選択肢イの「工場やプラント，ビルなどを制御する機器を運用するシステムやその技術」はこの定義に合致する。一方、アは実証実験・デモンストレーション(PoC)に近い説明、ウはSaaS(クラウドサービス)の利用形態の説明、エは情報技術にコミュニケーションの要素を加えたICT(Information and Communication Technology)の説明であり、いずれもOTとは異なる。</p>","mnemonic":""},{"id":67,"year":2023,"period":"令和5年度春期","num":18,"cat":"テクノロジ系","field":"ベイズ統計","summary":"ベイズ統計：令和5年度春期 問18","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>ベイズ統計の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"経済統計に関する国際条約に基づいて，貿易実態を正確に把握し，国の経済政策や企業の経済活動の資料とすることを目的とした指標を作成する統計手法"},{"label":"イ","html":"事前分布・事後分布といった確率に関する考え方に基づいて体系化されたものであり，機械学習，迷惑メールフィルターなどに利用されている統計理論"},{"label":"ウ","html":"収集されたデータの代表値である平均値・中央値・最頻値を求めたり，度数分布表やヒストグラムを作成したりすることによって，データの特徴を捉える統計理論"},{"label":"エ","html":"ビッグデータの収集・分析に当たり，分析結果の検証可能性を確保し，複数の分析結果を比較可能とするために，対象をオープンデータに限定する統計手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。ベイズ統計学は、ベイズの定理に基づき、ある事象の発生確率についてあらかじめ想定する「事前分布」を、新たに得られたデータ(尤度)を用いて更新し、「事後分布」を求めるという考え方で体系化された統計理論である。従来の頻度主義統計とは異なり、確率を「主観的な信念の度合い」として扱える点が特徴であり、少ないデータからでも確率的な推論を逐次更新していける。この性質から、機械学習の分野(例えばナイーブベイズ分類器)や、受信メールが迷惑メールである確率を学習データから逐次更新して判定する迷惑メールフィルターなど、幅広い応用がなされている。選択肢イの記述はこの説明と一致する。一方、アは国際的な貿易統計の作成手法、ウは平均値・中央値・最頻値やヒストグラムなどを扱う記述統計学の説明、エはビッグデータ分析をオープンデータに限定するという架空の統計手法の説明であり、いずれもベイズ統計とは異なる。</p>","mnemonic":""},{"id":68,"year":2023,"period":"令和5年度春期","num":19,"cat":"ストラテジ系","field":"ABC原価計算","summary":"ABC原価計算：令和5年度春期 問19","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>活動基準原価計算（Activity-Based Costing）を導入して実現できることはどれか。</p>","choices":[{"label":"ア","html":"間接費を発生要因と結び付けて把握する。"},{"label":"イ","html":"経営状態を，現金収支の流れに着目して把握する。"},{"label":"ウ","html":"資材の必要量，必要タイミングの予測の正確性を向上する。"},{"label":"エ","html":"使用頻度が高く，単価の高い材料の在庫管理を適正に行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。活動基準原価計算(Activity-Based Costing、ABC)は、間接費(製造間接費など)を、それを発生させる活動(アクティビティ)ごとに分解し、各活動の発生要因(コストドライバー)に基づいて製品やサービスに配賦する原価計算手法である。従来の原価計算では、直接作業時間や直接材料費など単一の基準で間接費を一括配賦することが多く、実際の資源消費の実態と乖離しやすいという問題があったが、ABCでは活動ごとに複数のコストドライバーを設定することで、より精度の高い原価把握が可能になる。選択肢アの「間接費を発生要因と結び付けて把握する」はこの特徴を言い表している。なお、選択肢エの「使用頻度が高く，単価の高い材料の在庫管理を適正に行う」は、名称が似ている別の概念である「ABC分析(重点管理のためのパレート分析)」の説明であり、活動基準原価計算とは異なる概念であるため、混同しないよう注意が必要である。イは資金繰り(キャッシュフロー)管理、ウは資材所要量計画(MRP)に近い説明であり、いずれもABCとは異なる。</p>","mnemonic":""},{"id":69,"year":2023,"period":"令和5年度春期","num":20,"cat":"ストラテジ系","field":"目標売上高","summary":"目標売上高：令和5年度春期 問20","correct":"ウ","result":"","formula":"新売上総利益=売上高×(1－変動費率)－固定費","howto":"変動費率(=変動費÷売上高)は一定のまま，固定費増と目標利益増の合計を限界利益率で割り戻す","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>表の事業計画案に対して，新規設備投資に伴う減価償却費（固定費）の増加1,000万円を織り込み，かつ，売上総利益を3,000万円とするようにしたい。変動費率に変化がないとすると，売上高の増加を何万円にすればよいか。</p><table><tr><td colspan='3'>単位　万円</td></tr><tr><td colspan='2'>売上高</td><td>20,000</td></tr><tr><td rowspan='3'>売上原価</td><td>変動費</td><td>10,000</td></tr><tr><td>固定費</td><td>8,000</td></tr><tr><td>計</td><td>18,000</td></tr><tr><td colspan='2'>売上総利益</td><td>2,000</td></tr></table>","choices":[{"label":"ア","html":"2,000"},{"label":"イ","html":"3,000"},{"label":"ウ","html":"4,000"},{"label":"エ","html":"5,000"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>変動費率 = 10,000 ÷ 20,000 = 50%（限界利益率も50%）。新しい固定費 = 8,000 + 1,000 = 9,000万円。</p><p>売上高を20,000+xとすると，売上総利益は　(20,000+x)×0.5－9,000 = 3,000　となるxを求めればよい。</p><p>0.5×(20,000+x) = 12,000 → 20,000+x = 24,000 → x = 4,000</p><p>別解：固定費の増加1,000万円と，目標利益の増加(3,000－2,000=1,000万円)の合計2,000万円を，限界利益率50%で割り戻すと 2,000÷0.5 = 4,000万円，と一発で求めることもできる。</p><p>よって答えはウ（4,000万円）。</p>","mnemonic":"固定費+1,000と利益+1,000，合計2,000を限界利益率50%で割り戻す“2倍ルール”で答えは四千（4,000）万円。"},{"id":70,"year":2023,"period":"令和5年度春期","num":21,"cat":"ストラテジ系","field":"連結会計","summary":"連結会計：令和5年度春期 問21","correct":"ウ","result":"","formula":"連結売上高総利益率=(連結売上高－連結売上原価)÷連結売上高×100","howto":"グループ内取引（A→B 800）を売上高・売上原価の両方から完全に相殺消去してから集計する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>連結売上高総利益率は何％か。ここで，B社はA社の100％子会社で，仕入れは全て親会社からであり，売上は全て親会社以外である。また，期首，期末とも在庫はない。</p><table><tr><td colspan='2'>A社損益計算書（単位　万円）</td></tr><tr><td>売上高</td><td>4,000</td></tr><tr><td>子会社売上高</td><td>800</td></tr><tr><td>売上原価</td><td>3,000</td></tr><tr><td>売上総利益</td><td>1,800</td></tr></table><table><tr><td colspan='2'>B社損益計算書（単位　万円）</td></tr><tr><td>売上高</td><td>1,000</td></tr><tr><td>売上原価</td><td>800</td></tr><tr><td>売上総利益</td><td>200</td></tr></table>","choices":[{"label":"ア","html":"34"},{"label":"イ","html":"38"},{"label":"ウ","html":"40"},{"label":"エ","html":"56"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A社の表の「売上高4,000」は外部顧客向けのみの金額で，子会社（B社）向けの「子会社売上高800」は別建てになっている（4,000－3,000＝1,000ではなく，4,000＋800－3,000＝1,800が売上総利益になっていることから読み取れる）。</p><p>連結売上高 = A社の外部向け売上高4,000 ＋ B社の売上高1,000 = 5,000万円（A社の子会社向け売上高800とB社の売上原価800は，グループ内の同一取引なので両建てで相殺消去）</p><p>連結売上原価 = A社の売上原価3,000（グループ全体の生産コストを含む） ＋ B社の売上原価800 － 内部取引相殺800 = 3,000万円</p><p>連結売上総利益 = 5,000 － 3,000 = 2,000万円</p><p>連結売上高総利益率 = 2,000 ÷ 5,000 × 100 = 40%。よって答えはウ。</p>","mnemonic":"A社の子会社向け800とB社の原価800がぴったり相殺され，残り5,000分の2,000で“よんわり”40%に落ち着く。"},{"id":71,"year":2023,"period":"令和5年度春期","num":22,"cat":"ストラテジ系","field":"暗号資産(法律)","summary":"暗号資産(法律)：令和5年度春期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>資金決済法における暗号資産に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"暗号資産交換業者は，情報の安全管理や広告・勧誘規制などの行為規制は受けるが，資本金額や純資産額などの財務的規制は受けない。"},{"label":"イ","html":"暗号資産は，不特定の者に対して使用でき，電子的に記録され，移転できるものであり，法定通貨又は法定通貨建ての資産ではないが，法定通貨と相互に交換できる。"},{"label":"ウ","html":"暗号資産は，ブロックチェーン技術を用いて集中管理されており，法定通貨と同様，銀行などの金融機関で入手・交換できる。"},{"label":"エ","html":"利用者の保有する暗号資産の残高や取引は，発行者によって利用者ごとに管理されているので，利用者は保有している暗号資産を発行者の指定する加盟店だけで使用できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。日本の資金決済に関する法律(資金決済法)では、暗号資産(いわゆる仮想通貨)について、(1)不特定の者に対して代金の支払い等に使用でき、かつ不特定の者を相手方として購入・売却を行うことができる財産的価値であること、(2)電子的に記録され、電子情報処理組織を用いて移転できること、(3)法定通貨(日本円や米ドルなど)又は法定通貨建ての資産(プリペイド型電子マネー等)ではないこと、という性質を持ち、法定通貨と相互に交換できるものと定義しており、選択肢イの記述はこれに合致する。一方、アについては、資金決済法上、暗号資産交換業者は登録制であり、行為規制(情報の安全管理、広告・勧誘規制など)に加えて、資本金額や純資産額などの財務的な登録要件・規制も課されるため誤りである。ウについては、暗号資産はブロックチェーン技術によって非中央集権的(分散的)に管理されるのが特徴であり、「集中管理」という説明は誤りであり、また銀行などの金融機関で一般的に直接交換できるとは限らない。エについては、多くの暗号資産(ビットコインなど)には特定の発行者が存在せず、利用者ごとに発行者が中央管理しているわけでも、特定の加盟店だけでしか使えないわけでもないため誤りである。</p>","mnemonic":""},{"id":72,"year":2023,"period":"令和5年度春期","num":23,"cat":"テクノロジ系","field":"デジタル署名","summary":"デジタル署名：令和5年度春期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>送信者Aは，署名生成鍵Xを使って文書ファイルのデジタル署名を生成した。送信者Aから，文書ファイルとその文書ファイルのデジタル署名を受信者Bが受信したとき，受信者Bができることはどれか。ここで，受信者Bは署名生成鍵Xと対をなす，署名検証鍵Yを保有しており，受信者Bと第三者は署名生成鍵Xを知らないものとする。</p>","choices":[{"label":"ア","html":"文書ファイルが改ざんされた場合，デジタル署名，文書ファイル及び署名検証鍵Yの整合性を確認することによって，その改ざん部分を判別できる。"},{"label":"イ","html":"文書ファイルが改ざんされていないこと，及びデジタル署名が署名生成鍵Xによって生成されたことを確認できる。"},{"label":"ウ","html":"文書ファイルがマルウェアに感染していないことを認証局に問い合わせて確認できる。"},{"label":"エ","html":"文書ファイルとデジタル署名のどちらかが改ざんされた場合，どちらが改ざんされたかを判別できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。デジタル署名は公開鍵暗号の仕組みを利用しており、送信者は自分だけが持つ秘密鍵(署名生成鍵)を用いて文書のハッシュ値などから署名を生成し、受信者は送信者の公開鍵(署名検証鍵)を用いてその署名を検証する。検証によって受信者が確認できるのは、(1)受信した文書ファイルが署名生成時点から改ざんされていないこと、(2)その署名が確かに署名生成鍵Xの保有者(送信者A)によって生成されたものであること、の2点であり、これにより完全性の確認と、否認防止を含む送信者の真正性確認が可能になる。選択肢イはこの説明に一致する。一方、アについては、検証で分かるのは「改ざんの有無」のみであり、改ざんされた具体的な箇所を特定することはできないため誤りである。ウについては、デジタル署名の検証はマルウェア感染の有無を判定するものではなく、認証局への問い合わせでそれが分かるわけでもないため誤りである。エについては、検証結果が不一致であった場合、文書と署名のどちらが改ざんされたか(あるいは両方か)を区別することはできないため誤りである。</p>","mnemonic":""},{"id":73,"year":2023,"period":"令和5年度春期","num":24,"cat":"テクノロジ系","field":"共通鍵暗号","summary":"共通鍵暗号：令和5年度春期 問24","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>暗号技術のうち，共通鍵暗号方式のものはどれか。</p>","choices":[{"label":"ア","html":"AES"},{"label":"イ","html":"ElGamal暗号"},{"label":"ウ","html":"RSA"},{"label":"エ","html":"楕円曲線暗号"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。共通鍵暗号方式(対称鍵暗号方式)は、暗号化と復号に同じ鍵(共通鍵)を使用する暗号方式であり、代表的なアルゴリズムとしてAES(Advanced Encryption Standard)が広く採用されている。AESは、旧来のDESに代わる米国の標準暗号として採択され、現在も多くのシステムで標準的に利用されている共通鍵暗号方式である。一方、イのElGamal暗号、ウのRSA、エの楕円曲線暗号(ECC)は、いずれも暗号化鍵(公開鍵)と復号鍵(秘密鍵)が異なる公開鍵暗号方式(非対称鍵暗号方式)に分類されるアルゴリズムであり、RSAは素因数分解の困難性、ElGamal暗号や楕円曲線暗号は離散対数問題(楕円曲線上の離散対数問題を含む)の困難性を安全性の根拠としている。したがって、共通鍵暗号方式に該当するのはアのAESのみである。</p>","mnemonic":""},{"id":74,"year":2023,"period":"令和5年度春期","num":25,"cat":"テクノロジ系","field":"OSINT","summary":"OSINT：令和5年度春期 問25","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>サイバー攻撃に関する脅威に対処するために，非合法な手段を使わずに入手できる公開情報について，収集，分析及び活用が進んでいる。公開情報を収集，分析し，得られる知見，若しくは知見を得るために公開情報を収集，分析する活動，方法などを指すものはどれか。</p>","choices":[{"label":"ア","html":"IoC"},{"label":"イ","html":"OSINT"},{"label":"ウ","html":"SIEM"},{"label":"エ","html":"TTP"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。OSINT(Open Source Intelligence、オープンソースインテリジェンス)とは、ニュース記事、SNS、ブログ、政府・企業の公開発表、学術論文など、非合法な手段を用いずに誰でも入手できる公開情報を収集・分析し、そこから有用な知見を得る活動、またはその方法論を指す言葉である。もともとは国家の情報機関における諜報活動の一手法であったが、近年はサイバーセキュリティの分野でも、攻撃者側が偵察(攻撃対象の情報収集)に用いる一方、防御側も脅威インテリジェンスの収集や脆弱性情報の把握などに活用しており、双方にとって重要な情報源・手法となっている。選択肢イがこれに該当する。一方、アのIoC(Indicator of Compromise)は不正侵入や攻撃の痕跡を示す指標(ハッシュ値やIPアドレスなど)、ウのSIEM(Security Information and Event Management)は各種ログやイベント情報を一元的に収集・相関分析してインシデントを検知する仕組み、エのTTP(Tactics, Techniques, and Procedures)は攻撃者の戦術・技術・手順を体系化したものであり、いずれも「公開情報の収集・分析活動そのもの」を指すOSINTとは異なる概念である。</p>","mnemonic":""},{"id":75,"year":2022,"period":"令和4年度春期","num":1,"cat":"ストラテジ系","field":"オープンデータ","summary":"オープンデータ：令和4年度春期 問1","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>官民データ活用推進基本法などに基づいて進められているオープンデータバイデザインに関して、行政機関における取組の記述として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"行政機関が保有する個人情報を産業振興などの目的でオープン化するためには、データ収集の開始に先立って個人情報保護委員会への届出が必要となる。"},{"label":"イ","html":"行政機関において収集・蓄積された既存のデータが公開される場合、営利目的の利用は許されておらず、非営利の用途に限って利用が認められている。"},{"label":"ウ","html":"行政機関における情報システムの設計において、情報セキュリティを確保する観点から、公開するデータの用途を行政機関同士の相互利用に限定する。"},{"label":"エ","html":"対象となる行政データを、二次利用や機械判読に適した形態で無償公開することを前提に、情報システムや業務プロセスの企画、整備及び運用を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>「オープンデータ・バイ・デザイン」は、官民データ活用推進基本法を踏まえてデジタル庁などが示す基本指針で用いられている考え方で、行政機関が情報システムや業務プロセスを企画・整備・運用する最初の段階から、保有データを二次利用や機械判読に適した形で無償公開することを前提に組み込むという原則を指す。選択肢エはこの定義そのものであり正解となる。アは個人情報保護委員会への事前届出義務という制度を前提にしているが、オープンデータ化の要件としてそのような届出制度は存在しない。イはオープンデータの基本原則(営利・非営利を問わず二次利用を認める)に反しており、非営利用途に限定するという記述は誤り。ウも、行政機関同士の相互利用に限定するという点がオープンデータの「広く公開し二次利用を促す」という考え方と矛盾する。</p>","mnemonic":""},{"id":76,"year":2022,"period":"令和4年度春期","num":2,"cat":"ストラテジ系","field":"レグテック","summary":"レグテック：令和4年度春期 問2","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>金融業界で生まれた考え方で、主に被規制事業者が各種規制に正しく対応できているかどうかをチェックする業務などを、最新ITを駆使して効率化する取組はどれか。</p>","choices":[{"label":"ア","html":"MOT"},{"label":"イ","html":"ギグエコノミー"},{"label":"ウ","html":"コンプライアンス"},{"label":"エ","html":"レグテック"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>レグテック(RegTech)は Regulation(規制)と Technology(技術)を組み合わせた造語で、2015年頃から英米を中心に使われ始めた、金融業界発の取組である。AI・ビッグデータ・自動化技術などの最新ITを活用して、規制対応のための取引監視、コンプライアンスチェック、報告業務などを効率化・高度化することを指し、設問の「被規制事業者が規制に正しく対応できているかをチェックする業務を最新ITで効率化する取組」と合致する。コンプライアンス(ウ)は法令遵守そのものを指す概念・業務領域の名称であり、それをITで効率化する「取組」の名称ではないため不正解。MOT(ア、Management of Technology)は技術をどう事業化・収益化するかという技術経営の考え方で金融規制とは直接関係なく、ギグエコノミー(イ)は単発の仕事を請け負う働き方を指す労働市場の概念であり、いずれも設問の内容とは異なる。</p>","mnemonic":""},{"id":77,"year":2022,"period":"令和4年度春期","num":3,"cat":"ストラテジ系","field":"決定木分析","summary":"決定木分析：令和4年度春期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>ある企業では、顧客データについて、顧客を性別、年齢層、職業、年収など複数の属性を組み合わせてセグメント化し、蓄積された大量の購買履歴データに照らして商品の購入可能性が最も高いセグメントを予測している。このときに活用される分析手法はどれか。</p>","choices":[{"label":"ア","html":"ABC分析"},{"label":"イ","html":"SWOT分析"},{"label":"ウ","html":"競合分析"},{"label":"エ","html":"決定木分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>決定木分析(デシジョンツリー分析)は、「購入する/しない」のような目的変数に対して、影響の強い属性(性別・年齢層・職業・年収など)を順に分岐条件として選び、樹形図(ツリー)状に分類していくデータマイニング手法である。通信販売会社が会員属性や購買履歴データから、カタログ送付時に商品を購入する確率が高いセグメントを発見するために用いる事例などが典型例として知られており、設問の「複数属性を組み合わせたセグメント化」と「購買履歴データに基づく購入可能性が高いセグメントの予測」はこの手法の説明そのものである。ABC分析(ア)は商品を売上高・利益額の累計比率で高・中・低の3ランクに分類して売れ筋を把握する手法で、顧客セグメントの予測には用いない。SWOT分析(イ)は自社の強み・弱みと市場の機会・脅威を整理するための戦略フレームワークであり、個客データを統計的に分析する手法ではないため、いずれも不正解。</p>","mnemonic":""},{"id":78,"year":2022,"period":"令和4年度春期","num":4,"cat":"ストラテジ系","field":"DCF法","summary":"DCF法：令和4年度春期 問4","correct":"ア","result":"","formula":"現在価値＝CF÷(1+r)^n（毎年度末に百万円未満切り捨て）","howto":"各年のCF100を20%で複利割引し端数切り捨てのうえ，－150を含めて合計する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>プロジェクト開始時点で150百万円の支出を行うIT投資プロジェクトにおいて，3年間の金銭的価値をDCF法で算定した場合，正しい金額はa〜dのどれか。</p><p>なお，割引率は20%で固定とし，キャッシュフローは全て年度末に発生するものとする。また，金銭的価値の算定の際には年度ごとに百万円未満を切り捨てて計算している。</p><table><tr><td colspan=\"5\">IT投資プロジェクト（単位　百万円）</td></tr><tr><td>投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td></tr><tr><td>キャッシュフロー</td><td>－150</td><td>100</td><td>100</td><td>100</td></tr></table><table><tr><td colspan=\"6\">DCF法による金銭的価値の算定結果（単位　百万円）</td></tr><tr><td>算定結果＼投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td><td>合計</td></tr><tr><td>a</td><td>－150</td><td>83</td><td>69</td><td>57</td><td>59</td></tr><tr><td>b</td><td>－150</td><td>83</td><td>71</td><td>62</td><td>66</td></tr><tr><td>c</td><td>－150</td><td>83</td><td>83</td><td>83</td><td>99</td></tr><tr><td>d</td><td>－150</td><td>83</td><td>96</td><td>99</td><td>128</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率20%で各年のキャッシュフロー100百万円を現在価値に割り引き，年度ごとに百万円未満を切り捨てる。</p><p>1年後：100÷1.2＝83.33…→83</p><p>2年後：100÷1.2^2＝100÷1.44＝69.44…→69</p><p>3年後：100÷1.2^3＝100÷1.728＝57.87…→57</p><p>開始時点の－150を含めた合計は－150＋83＋69＋57＝59（百万円）。これは表の「a」の行と一致するため，正解は「ア」。</p>","mnemonic":"20%引きを毎年繰り返すと83→69→57と目減りし、150万円の元手を引いても黒字『ご苦労(59)さん』の59百万円が残るaが正解。"},{"id":79,"year":2022,"period":"令和4年度春期","num":5,"cat":"マネジメント系","field":"モデル取引・契約書","summary":"モデル取引・契約書：令和4年度春期 問5","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>ベンダX社に対して、表に示すように要件定義フェーズから運用テストフェーズまでを委託したい。X社との契約に当たって、“情報システム・モデル取引・契約書&lt;第二版&gt;”に照らし、各フェーズの契約形態を整理した。a〜dの契約形態のうち、準委任型が適切であるとされるものはどれか。</p><table><tr><th>要件定義</th><th>システム外部設計</th><th>システム内部設計</th><th>ソフトウェア設計,プログラミング,ソフトウェアテスト</th><th>システム結合</th><th>システムテスト</th><th>運用テスト</th></tr><tr><td>a</td><td>準委任型又は請負型</td><td>b</td><td>請負型</td><td>c</td><td>準委任型又は請負型</td><td>d</td></tr></table>","choices":[{"label":"ア","html":"a, b"},{"label":"イ","html":"a, d"},{"label":"ウ","html":"b, c"},{"label":"エ","html":"b, d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>経済産業省・IPAが公表する「情報システム・モデル取引・契約書〈第二版〉」とその解説では、成果物の仕様や完成形を契約締結時点で明確に確定しにくい工程は、ベンダが専門家として業務を遂行すること自体を目的とする準委任型が適切とされ、逆に完成すべきソフトウェアの仕様が確定している工程は、仕事の完成(成果物の引渡し)を約束する請負型が基本とされる。要件定義フェーズ(a)はまさに仕様を確定させる前段階の工程であり準委任型、運用テストフェーズ(d)は本番環境での最終的な稼働確認・業務適合確認という性質上、完成の保証になじまず準委任型とされる。一方、システム内部設計(b)やシステム結合(c)はソフトウェアという成果物の完成を目指す工程であるため請負型が基本であり、表でも与えられているソフトウェア設計・プログラミング・ソフトウェアテストと同様に扱われる。したがって準委任型が適切とされるのはa・dの組み合わせであり、イが正解となる。</p>","mnemonic":""},{"id":80,"year":2022,"period":"令和4年度春期","num":6,"cat":"ストラテジ系","field":"ダイナミックケイパビリティ","summary":"ダイナミックケイパビリティ：令和4年度春期 問6","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>D.J.ティースが提唱したダイナミック・ケイパビリティの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"環境の変化がない状況のもと、経営資源を効率的に活用し、既存の業務システムを用いて利益を最大化する能力"},{"label":"イ","html":"環境の変化を感知し、機会を捉え、組織内外の資源を再編成することによって、変革を行い、持続的競争優位を確立する能力"},{"label":"ウ","html":"既存の競争枠組みの中でフォロワの地位を長期的に維持するために、リーダの戦略や製品の特徴・価格を模倣する能力"},{"label":"エ","html":"専門分化した大規模な組織において、上意下達の指揮命令の下、各自が担当する業務を所定の規則に従って遂行する能力"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ダイナミック・ケイパビリティは、カリフォルニア大学バークレー校のデイヴィッド・J・ティース(D. J. Teece)が提唱した経営理論で、急速に変化する事業環境の中で企業が持続的な競争優位を構築・維持するために、自社や外部の経営資源・組織能力を再構成し続ける能力を指す。ティースはこれを「感知(Sensing、機会や脅威を感知する)」「捕捉(Seizing、機会を捉えて資源を動員する)」「変容(Transforming、組織・資源を再構成し続ける)」の3つの下位能力に整理して説明しており、選択肢イの「変化を感知し、機会を捉え、組織内外の資源を再編成して変革を行い、持続的競争優位を確立する能力」という記述はこの定義と一致する。これに対しアは、環境変化がないことを前提に既存資源を効率運用する能力であり、ダイナミック・ケイパビリティと対比される「オーディナリー・ケイパビリティ(通常能力)」に近い説明であって、ウの模倣能力やエの官僚的な定型業務遂行能力も、環境変化に応じて自己変革するというダイナミック・ケイパビリティの核心とは異なる。</p>","mnemonic":""},{"id":81,"year":2022,"period":"令和4年度春期","num":7,"cat":"ストラテジ系","field":"インバウンドマーケティング","summary":"インバウンドマーケティング：令和4年度春期 問7","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>インバウンドマーケティングの説明はどれか。</p>","choices":[{"label":"ア","html":"映画、テレビ、ゲーム画面などに商品や企業ロゴなどを登場させ、見ている人にさりげなくアピールするマーケティング"},{"label":"イ","html":"企業が、顧客ではなく自社の従業員に対して行うマーケティング"},{"label":"ウ","html":"市場全体を均質的な存在とみなし、大規模なプロモーション活動によって目標の達成を目指すマーケティング"},{"label":"エ","html":"自ら主体的に情報を探しに来る顧客に対して、自社の商品・サービスに興味をもつコンテンツを制作し、情報発信し続けるマーケティング"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>インバウンドマーケティングは、SEOやオウンドメディア、SNS、メールマガジンなどを通じて顧客を自社サイトやコンテンツに引き寄せる「プル型」の手法であり、顧客が自ら情報を探しに来るのを前提に、興味を持ってもらえる有益なコンテンツを継続的に制作・発信して関係を築いていく考え方である。選択肢エはこの特徴を正確に述べており正解となる。これと対になる概念がアウトバウンドマーケティングで、企業側から不特定多数に一方的に働きかけるテレビCMや訪問販売、電話営業などが該当する。アは映画やゲームに商品を登場させるプロダクトプレースメント、イは従業員向けのインターナルマーケティング、ウは市場を均質とみなして大規模プロモーションを行うマスマーケティングの説明であり、いずれも「顧客が自ら探しに来る」という点を特徴とするインバウンドマーケティングの定義には当てはまらない。</p>","mnemonic":""},{"id":82,"year":2022,"period":"令和4年度春期","num":8,"cat":"ストラテジ系","field":"コーズマーケティング","summary":"コーズマーケティング：令和4年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>コーズリレーテッドマーケティングの特徴はどれか。</p>","choices":[{"label":"ア","html":"顧客との継続的な取引関係を構築して維持することによって、顧客生涯価値を高め、企業収益に貢献する。"},{"label":"イ","html":"顧客の許可を得てから勧誘や広告活動を行うことによって、顧客との長期的な信頼関係や友好関係の形成を重視する。"},{"label":"ウ","html":"商品の売上の一部をNPO法人に寄付するなど、社会貢献活動を支援する信条をアピールし、販売促進につなげる。"},{"label":"エ","html":"蓄積された顧客情報を分析することによって、見込み客の特定、的確な提案、顧客の購買促進や顧客のロイヤルティ向上などに役立てる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コーズリレーテッドマーケティング(コーズマーケティング)は、企業が社会的な課題(コーズ)の解決に取り組む活動を通じて消費者とのコミュニケーションを深め、売上の増大やブランド価値の向上を図る、米国発のマーケティング手法である。最も代表的な形は、商品の売上の一部をNPO法人など支援団体に寄付するキャンペーンを展開し、その社会貢献性をアピールして販売促進に結び付けるというもので、選択肢ウはこれに一致する。この手法の起源としては、1983年にアメリカン・エキスプレスが自由の女神像の修復費用を支援するため、カード利用1回ごとに一定額を寄付したキャンペーンがよく知られている。アは顧客生涯価値を重視するリレーションシップマーケティング、イは事前の許可を前提とするパーミッションマーケティング、エは顧客データ分析によるOne to Oneマーケティング(CRM的手法)の説明であり、いずれも「社会貢献活動との連動」という点を特徴とするコーズリレーテッドマーケティングとは異なる。</p>","mnemonic":""},{"id":83,"year":2022,"period":"令和4年度春期","num":9,"cat":"ストラテジ系","field":"マーケットバスケット分析","summary":"マーケットバスケット分析：令和4年度春期 問9","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>マーケットバスケット分析の説明はどれか。</p>","choices":[{"label":"ア","html":"POSシステムなどで収集した販売情報から、顧客が買物をした際に同時に購入した商品の組合せを見つける。"},{"label":"イ","html":"網の目状に一定の経線と緯線で区切った地域に対して、人口、購買力など様々なデータを集計し、より細かく地域の分析を行う。"},{"label":"ウ","html":"一定の目的で地域を幾つかに分割し、各地域にオピニオンリーダを選んで反復調査を行い、地域の傾向や実態を把握する。"},{"label":"エ","html":"商品ごとの販売金額又は粗利益額を高い順に並べ、その累計比率から商品を三つのランクに分けて分析し、売れ筋商品を把握する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マーケットバスケット分析は、「買い物カゴ(マーケットバスケット)」の中身、すなわちPOSシステムやECサイトの購買履歴データから、顧客が一回の買い物で同時に購入した商品の組合せを見つけ出す分析手法で、アソシエーション分析の代表的な応用例として位置づけられる。支持度・信頼度・リフト値といった指標を用いて商品間の関連性を定量化し、その結果は売場での商品陳列の最適化やクロスセル施策、レコメンデーションなどに活用される(「おむつとビール」が一緒に売れるという逸話が有名だが、これは象徴的な例として語られるものである)。選択肢イは地域をメッシュ状に区切って集計するメッシュ分析、ウはオピニオンリーダを対象とした反復的な地域モニター調査、エは売上・利益の累計比率で商品を3ランクに分けるABC分析の説明であり、いずれも「同時に購入された商品の組合せ」を見つけるマーケットバスケット分析とは異なる手法である。</p>","mnemonic":""},{"id":84,"year":2022,"period":"令和4年度春期","num":10,"cat":"ストラテジ系","field":"価格弾力性","summary":"価格弾力性：令和4年度春期 問10","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>需要の価格弾力性に関する説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"多くの競合他社が代替品を提供している場合は価格弾力性が小さくなりやすい。"},{"label":"イ","html":"価格弾力性が大きい商品の場合、値上げをしても需要に大きな変化は見られない。"},{"label":"ウ","html":"価格弾力性の値が1の場合、価格を下げても需要量は変化しない。"},{"label":"エ","html":"必需品と贅沢品を比較した場合、一般に必需品の方が価格弾力性は小さい。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>需要の価格弾力性とは、価格が1%変化したときに需要量が何%変化するかを示す指標で、値が大きいほど価格変化に対して需要が敏感に反応することを意味する。必需品は価格が上がっても消費量を大きく減らしにくく、代替品も少ないため需要は非弾力的(弾力性が小さい)になりやすいのに対し、贅沢品は価格が上がれば購入を控えたり代替品に切り替えたりしやすいため、需要は弾力的(弾力性が大きい)になりやすいとされ、選択肢エはこの一般的性質と一致する。アは誤りで、密接な代替品が多い財ほど、値上げ時に他社製品へ乗り換えやすくなるため価格弾力性は「大きく」なりやすい。イも誤りで、弾力性が大きい商品は値上げに対して需要が大きく「減少する」のが特徴であり、「大きな変化が見られない」は弾力性が小さい(非弾力的)な商品の性質である。ウも誤りで、弾力性が1というのは価格の変化率と需要量の変化率が等しいことを意味し、価格を下げれば需要量はそれに応じて変化する。</p>","mnemonic":""},{"id":85,"year":2022,"period":"令和4年度春期","num":11,"cat":"ストラテジ系","field":"PEST分析","summary":"PEST分析：令和4年度春期 問11","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>企業が実施するマクロ環境分析のうち、PEST分析によって戦略を策定している事例はどれか。</p>","choices":[{"label":"ア","html":"購買決定者の年齢層や社会的なポジション、購買に至るプロセスの中で購買行動に影響する要因を把握し、自社の製品の市場投入方法を決定する。"},{"label":"イ","html":"自社の製品市場に参入してくると見込まれる、別市場の企業の動向を把握し、新製品の開発を決定する。"},{"label":"ウ","html":"自社の販売力、生産力の評価や自社の保有する技術力を検証し、新しく進出する市場分野を決定する。"},{"label":"エ","html":"法規制、景気動向、流行の推移や新技術の状況を把握し、自社の製品改良の方針を決定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PEST分析は、1967年にフランシス・J・アギュラーが提唱した枠組みを起源とする、企業が自らの意思では変えられない外部環境(マクロ環境)を、Political(政治・法規制)、Economic(経済・景気動向)、Social(社会・流行や人口動態の推移)、Technological(技術・新技術の動向)の4分野に整理して把握するフレームワークである。選択肢エの「法規制、景気動向、流行の推移や新技術の状況を把握する」は、この政治・経済・社会・技術の4要素にそれぞれ対応しており、PEST分析の事例として適切である。アは購買決定者の属性や購買行動プロセスに着目した消費者行動分析、イは参入が見込まれる競合企業の動向分析(ファイブフォース分析の新規参入者の脅威に近い視点)、ウは自社の販売力・生産力・技術力という内部資源の評価(SWOT分析の内部要因分析に近い)であり、いずれも企業を取り巻くマクロ環境そのものを分析する手法ではないため、PEST分析の事例としては不適切である。</p>","mnemonic":""},{"id":86,"year":2022,"period":"令和4年度春期","num":12,"cat":"ストラテジ系","field":"マルチサイドプラットフォーム","summary":"マルチサイドプラットフォーム：令和4年度春期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>マルチサイドプラットフォームのビジネスモデルの説明はどれか。</p>","choices":[{"label":"ア","html":"顧客価値を創造するために、複数の異なる種類の顧客セグメントをつなぎ合わせ、顧客セグメント間の交流を促進する仕組みを提供するモデルである。"},{"label":"イ","html":"顧客との良好な関係を築き収益拡大を図るために、顧客データベースの構築を前提として、顧客との様々な局面でのコミュニケーションを支援するモデルである。"},{"label":"ウ","html":"製造業において、事業の多角化を図るために、現在の製品の川上となる部品の製造と、川下となる販売事業に同時に進出するモデルである。"},{"label":"エ","html":"複数の異なる仕様の機種やOSで同じように動作するソフトウェアやサービスを提供することによって利用者を増やし、事業拡大を図るモデルである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マルチサイドプラットフォーム(経済学でいう両面・多面市場)は、売り手と買い手、運転手と乗客、ホストと宿泊者のように、相互に依存関係にある複数の異なる顧客グループ(サイド)を一つの基盤(プラットフォーム)上で結び付け、各サイド間の交流や取引を促進することで、プラットフォーム全体の価値を高めるビジネスモデルである。Visaのカード会員・加盟店・発行銀行、eBayの買い手と売り手、Uberの乗客と運転手、Airbnbのホストと宿泊者などが代表例として挙げられ、選択肢アの「複数の異なる種類の顧客セグメントをつなぎ合わせ、セグメント間の交流を促進する」という記述はこのモデルの本質を正しく捉えている。イは顧客データベースを基盤とするCRM(顧客関係管理)型のビジネスモデル、ウは部品製造から販売まで垂直統合する多角化戦略、エは複数の機種・OSで動作するクロスプラットフォーム型のソフトウェア戦略であり、いずれも異なる顧客グループ同士を仲介して交流させるというマルチサイドプラットフォームの特徴には当てはまらない。</p>","mnemonic":""},{"id":87,"year":2022,"period":"令和4年度春期","num":13,"cat":"ストラテジ系","field":"SECIモデル","summary":"SECIモデル：令和4年度春期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>新たに創造された知識を組織に広め、新たな暗黙知として習得することを、SECIモデルでは、どれに分類するか。</p>","choices":[{"label":"ア","html":"共同化(Socialization)"},{"label":"イ","html":"表出化(Externalization)"},{"label":"ウ","html":"連結化(Combination)"},{"label":"エ","html":"内面化(Internalization)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SECIモデルは野中郁次郎らが提唱した組織的知識創造理論であり、個人の暗黙知と組織の形式知が「共同化(Socialization)→表出化(Externalization)→連結化(Combination)→内面化(Internalization)」という4つのプロセスを通じて相互に変換され、組織全体の知識として螺旋的に発展していくと説明する。内面化は、マニュアルや文書など言語化された形式知を、個人が実践や反復を通じて体得し、自分自身の新たな暗黙知(コツや勘のような体得知)として身につける段階であり、設問の「新たに創造された知識を組織に広め、新たな暗黙知として習得する」という記述はこの内面化の説明に一致する。これに対し、共同化(ア)は経験の共有による暗黙知から暗黙知への変換、表出化(イ)は暗黙知を言葉や図で言語化する形式知への変換、連結化(ウ)は既存の形式知同士を組み合わせて新たな形式知を生み出す段階であり、いずれも「暗黙知として習得する」という結果には直接結び付かない。</p>","mnemonic":""},{"id":88,"year":2022,"period":"令和4年度春期","num":14,"cat":"ストラテジ系","field":"プロダクトイノベーション","summary":"プロダクトイノベーション：令和4年度春期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>プロダクトイノベーションの例として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"シックスシグマの工程管理を導入し、製品品質を向上させる。"},{"label":"イ","html":"ジャストインタイム方式を採用し、部品在庫を減らす。"},{"label":"ウ","html":"製造方法を見直し、コストを下げた製品を製造する。"},{"label":"エ","html":"マルチコアCPUを採用し、高性能で低消費電力の製品を開発する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロダクトイノベーションとは、新製品の創出や既存製品の機能・性能の大幅な向上など、「製品そのもの」に関する革新を指す概念で、新機能の追加や先進技術の採用によって競合と差別化された新しい設計を実現することがその典型とされる。選択肢エの「マルチコアCPUという先進技術を採用し、高性能・低消費電力という新たな価値を持つ製品を開発する」は、まさに製品自体の仕様・性能を革新する例であり、プロダクトイノベーションに該当する。一方、シックスシグマによる工程管理の導入(ア)、ジャストインタイム方式による部品在庫の削減(イ)、製造方法の見直しによるコスト削減(ウ)は、いずれも「何を作るか」ではなく「どのように作るか・どう業務を遂行するか」という製造工程・業務プロセスに関する革新であり、プロセスイノベーションに分類される。プロダクトイノベーションとプロセスイノベーションは対象(製品か工程か)で区別される点が、この設問を解く鍵となる。</p>","mnemonic":""},{"id":89,"year":2022,"period":"令和4年度春期","num":15,"cat":"ストラテジ系","field":"SoE","summary":"SoE：令和4年度春期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>企業システムにおけるSoE(Systems of Engagement)の説明はどれか。</p>","choices":[{"label":"ア","html":"高可用性、拡張性、セキュリティを確保しながら情報システムを稼働・運用するためのハードウェア、ソフトウェアから構成されるシステム基盤"},{"label":"イ","html":"社内業務プロセスに組み込まれ、定型業務を処理し、結果を記録することによって省力化を実現するためのシステム"},{"label":"ウ","html":"データの活用を通じて、消費者や顧客企業とのつながりや関係性を深めるためのシステム"},{"label":"エ","html":"日々の仕訳伝票を入力した上で、データの改ざん、消失を防ぎながら取引データベースを維持・管理することによって、財務報告を行うためのシステム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SoE(System of Engagement、「つながりのシステム」)は、ジェフリー・ムーアが提唱した概念に由来し、顧客や取引先、従業員など人と人・企業と顧客の「つながり」や関係構築を主目的とするシステムを指す。SNS連携アプリやCRM、顧客向けモバイルアプリなどが該当し、選択肢ウの「データの活用を通じて、消費者や顧客企業とのつながりや関係性を深める」はこの定義に合致する。これと対になる概念がSoR(System of Record、「記録のシステム」)で、取引や会計データを正確かつ安定的に記録・蓄積することを主目的とする基幹系システムを指し、選択肢エの仕訳伝票入力による財務報告システムはSoRの典型例であり、選択肢イの定型業務処理・記録による省力化システムもSoRに近い説明である。SoEは変化の速い顧客ニーズへの対応力が重視されるためアジャイル開発やクラウド基盤がよく用いられ、高い信頼性・安定稼働が最優先されるSoRとは開発スタイルも異なるとされる。選択肢アはITインフラ基盤一般の説明であり、いずれもSoEの特徴である「つながり・関係性の構築」という点を欠いている。</p>","mnemonic":""},{"id":90,"year":2022,"period":"令和4年度春期","num":16,"cat":"ストラテジ系","field":"資材所要量計画","summary":"資材所要量計画：令和4年度春期 問16","correct":"イ","result":"","formula":"正味所要量＝総所要量－在庫残（総所要量は上位品目の正味所要量×員数を積み上げ）","howto":"A→B→D，A→C→Dの2経路の総所要量を足し，Dの在庫残を引く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>ある期間の生産計画において，表の部品表で表される製品Aの需要量が10個であるとき，部品Dの正味所要量は何個か。ここで，ユニットBの在庫残が5個，部品Dの在庫残が25個あり，他の在庫残，仕掛残，注文残，引当残などはないものとする。</p><table><tr><td colspan=\"2\">レベル0</td><td colspan=\"2\">レベル1</td><td colspan=\"2\">レベル2</td></tr><tr><td>品名</td><td>数量（個）</td><td>品名</td><td>数量（個）</td><td>品名</td><td>数量（個）</td></tr><tr><td rowspan=\"4\">製品A</td><td rowspan=\"4\">1</td><td rowspan=\"2\">ユニットB</td><td rowspan=\"2\">4</td><td>部品D</td><td>3</td></tr><tr><td>部品E</td><td>1</td></tr><tr><td rowspan=\"2\">ユニットC</td><td rowspan=\"2\">1</td><td>部品D</td><td>1</td></tr><tr><td>部品F</td><td>2</td></tr></table>","choices":[{"label":"ア","html":"80"},{"label":"イ","html":"90"},{"label":"ウ","html":"95"},{"label":"エ","html":"105"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>部品構成を積み上げて部品Dの総所要量を求める。</p><p>製品A需要10個→ユニットB総所要量＝10×4＝40個。ユニットBの在庫残5個を引くと，ユニットB正味所要量＝40－5＝35個。</p><p>製品A需要10個→ユニットC総所要量＝10×1＝10個（在庫残なしなので正味所要量もそのまま10個）。</p><p>部品Dの総所要量は，ユニットB経由：35×3＝105個，ユニットC経由：10×1＝10個，合計105＋10＝115個。</p><p>部品Dの在庫残25個を引くと，正味所要量＝115－25＝90個。したがって正解は「イ」。</p>","mnemonic":"Aが10台売れるとBは40個(在庫5引いて35)、Cは10個。Dは35×3＋10×1＝115個、在庫25引いて『くれ(90)』の90個に着地。"},{"id":91,"year":2022,"period":"令和4年度春期","num":17,"cat":"テクノロジ系","field":"CPS","summary":"CPS：令和4年度春期 問17","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>インダストリー4.0の重要な概念であるサイバーフィジカルシステム(CPS)の説明はどれか。</p>","choices":[{"label":"ア","html":"1台のサーバの中に複数の仮想マシンを作り、それぞれに別々の基本ソフトを入れて、あたかも複数台のサーバがあるかのように動作させるシステム"},{"label":"イ","html":"サイバー攻撃に備えて、情報の漏えい・滅失・棄損の防止など必要な措置を講じ、制御ネットワークに接続された機器を安全に維持管理するシステム"},{"label":"ウ","html":"実世界と関係のない架空のストーリーを基に、コンピュータグラフィックスを用いて、コンピュータゲームを開発するためのシステム"},{"label":"エ","html":"実世界にある多様なデータをセンサなどで収集し、仮想空間でシミュレーション技術などを用いて解析し、得られた情報を基に実世界の問題解決を図るシステム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サイバーフィジカルシステム(CPS)は、米国国立科学財団(NSF)などの定義によれば、コンピューティング・制御・通信ネットワークを物理的な対象に組み込み、現実世界のデータをセンサなどでリアルタイムに収集し、サイバー空間(仮想空間)側でシミュレーションや分析、自動的な意思決定を行った上で、その結果を物理世界側へフィードバックして制御・最適化する仕組みを指す。ドイツが掲げる国家戦略インダストリー4.0の中核概念として、IoTとAIを活用したスマート工場の実現や、設計から生産、物流、品質管理までのバリューチェーン全体の最適化を支える役割を担うとされており、選択肢エの「実世界のデータをセンサで収集し、仮想空間で解析して実世界の問題解決を図る」という記述はこの仕組みと一致する。アはサーバ仮想化の説明、イは制御システムのセキュリティ対策(情報セキュリティマネジメント)の説明、ウは現実世界とは無関係な架空のゲーム開発の説明であり、いずれも「実世界のデータに基づき仮想空間で解析し、その結果を現実世界にフィードバックする」というCPSの双方向的な特徴を備えていない。</p>","mnemonic":""},{"id":92,"year":2022,"period":"令和4年度春期","num":18,"cat":"ストラテジ系","field":"BCM・レジリエンス","summary":"BCM・レジリエンス：令和4年度春期 問18","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>BCM(Business Continuity Management)において考慮すべきレジリエンスの説明はどれか。</p>","choices":[{"label":"ア","html":"競争力の源泉となる、他社に真似のできない自社固有の強み"},{"label":"イ","html":"想定される全てのリスクを回避して事業継続を行う方針"},{"label":"ウ","html":"大規模災害などの発生時に事業の継続を可能とするために事前に策定する計画"},{"label":"エ","html":"不測の事態が生じた場合の組織的対応力や、支障が生じた事業を復元させる力"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BCM(事業継続管理)は、自然災害やシステム障害、パンデミックなどの緊急事態に直面した際に、重要な事業活動を継続または早期に復旧させるための包括的な経営管理の仕組みで、ISO 22301などの国際規格を踏まえて整備される。この中で「レジリエンス」とは、特定のリスクを事前にすべて排除することを目指すものではなく、不測の事態が実際に発生した場合に組織がどれだけ柔軟かつ適切に対応できるか、また被害を受けた事業をどれだけ早く・しなやかに復元できるかという「組織的な対応力・復元力」を指す概念であり、選択肢エの記述がこれに一致する。アは他社が模倣できない自社固有の強みを指す「コアコンピタンス」の説明、イは全リスクの回避を方針とする記述だがBCMは起こり得るリスクをゼロにすることではなく発生後の対応と復旧を主眼とするため不適切、ウは緊急時の事業継続計画そのものである「BCP(Business Continuity Plan)」の説明であり、組織の対応力・復元力という「能力」を指すレジリエンスとは異なる概念である。</p>","mnemonic":""},{"id":93,"year":2022,"period":"令和4年度春期","num":19,"cat":"マネジメント系","field":"ワークデザイン法","summary":"ワークデザイン法：令和4年度春期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>問題解決に当たって、現実にとらわれることなく理想的なシステムを想定した上で、次に、理想との比較から現状の問題点を洗い出し、具体的な改善案を策定する手法はどれか。</p>","choices":[{"label":"ア","html":"系統図法"},{"label":"イ","html":"親和図法"},{"label":"ウ","html":"線形計画法"},{"label":"エ","html":"ワークデザイン法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ワークデザイン法は、米国ウィスコンシン大学のG.ナドラー(G. Nadler)が開発し、1963年に自身の来日によって日本に紹介された業務設計・問題解決の手法で、「演繹的アプローチ」に特徴がある。現状の制約や既存の仕組みにとらわれず、まず目的(機能)を展開して理想的なシステムを描き、その理想システムと現状とのギャップを比較することで問題点を洗い出し、理想に近づけるための具体的な改善案を策定していくという進め方をとり、設問の記述はこのワークデザイン法の手順と一致する(ナドラーは後にこの考え方を「ブレークスルー思考」として発展させている)。系統図法(ア)や親和図法(イ)は、言語データを図や文章で整理して問題の構造を明らかにする「新QC七つ道具」に含まれる手法で、主に現状分析や方針立案に使われるが、理想システムを起点に発想する演繹的な手法ではない。線形計画法(ウ)は制約条件下で目的関数を最適化するOR(オペレーションズ・リサーチ)の数理的手法であり、理想システムとの比較による問題解決プロセスとは性質が異なる。</p>","mnemonic":""},{"id":94,"year":2022,"period":"令和4年度春期","num":20,"cat":"ストラテジ系","field":"キャッシュフロー計算書","summary":"キャッシュフロー計算書：令和4年度春期 問20","correct":"ウ","result":"","formula":"営業CF＝税引前利益＋減価償却費－売上債権増加＋棚卸資産減少＋仕入債務増加－法人税等支払額","howto":"108+42-60+30+40-62を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>キャッシュフロー計算書における，営業活動によるキャッシュフローは何万円か。</p><table><tr><td colspan=\"2\">単位　万円</td></tr><tr><td>税金等調整前当期純利益</td><td>108</td></tr><tr><td>減価償却費</td><td>42</td></tr><tr><td>売上債権の増加額</td><td>60</td></tr><tr><td>棚卸資産の減少額</td><td>30</td></tr><tr><td>仕入債務の増加額</td><td>40</td></tr><tr><td>法人税等の支払額</td><td>62</td></tr></table>","choices":[{"label":"ア","html":"14"},{"label":"イ","html":"74"},{"label":"ウ","html":"98"},{"label":"エ","html":"158"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>間接法によるキャッシュフロー計算書の営業活動によるキャッシュフローは，税金等調整前当期純利益を起点に非資金損益項目や運転資本の増減を加減し，最後に法人税等の支払額を差し引いて求める。</p><p>108（当期純利益）＋42（減価償却費）－60（売上債権の増加額）＋30（棚卸資産の減少額）＋40（仕入債務の増加額）－62（法人税等の支払額）</p><p>＝108＋42－60＋30＋40－62＝98（万円）。したがって正解は「ウ」。</p>","mnemonic":"純利益108に減価償却42を足し、売上債権60引いて棚卸30足し仕入債務40足し、最後に税金62引けば『クワッと(98)』98万円に着地。"},{"id":95,"year":2022,"period":"令和4年度春期","num":21,"cat":"ストラテジ系","field":"減損会計","summary":"減損会計：令和4年度春期 問21","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>固定資産について回収可能価額と帳簿価額とを比較し、回収可能価額が帳簿価額を下回る場合、その差額を損失として認識し、当該資産の帳簿価額を回収可能価額まで減額する会計手続はどれか。</p>","choices":[{"label":"ア","html":"減損会計"},{"label":"イ","html":"税効果会計"},{"label":"ウ","html":"ヘッジ会計"},{"label":"エ","html":"リース会計"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>減損会計は、取得原価基準の下で、固定資産の収益性が低下し投資額の回収が見込めなくなった場合に、帳簿価額を臨時に減額する会計処理であり、設問の記述と完全に一致する。手続としては、まず減損の兆候の把握、次に割引前将来キャッシュ・フローの総額と帳簿価額を比較して減損損失を認識するかどうかの判定、最後に「正味売却価額」と「使用価値(将来キャッシュ・フローを現在価値に割り引いた額)」のいずれか高い方である「回収可能価額」まで帳簿価額を減額するという測定、という3ステップで行われる。税効果会計(イ)は会計上と税務上の収益・費用の認識時点の違いを調整するための会計処理、ヘッジ会計(ウ)はデリバティブなどによるヘッジ取引の損益を対象資産・負債の損益と対応させて認識する会計処理、リース会計(エ)はリース取引をオンバランスするかどうかなどを扱う会計処理であり、いずれも固定資産の回収可能価額と帳簿価額を比較して損失を認識する減損会計とは異なる手続である。</p>","mnemonic":""},{"id":96,"year":2022,"period":"令和4年度春期","num":22,"cat":"ストラテジ系","field":"フェアユース","summary":"フェアユース：令和4年度春期 問22","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>フェアユースの説明はどれか。</p>","choices":[{"label":"ア","html":"国及び地方公共団体、並びにこれに準ずる公的機関は、公共の福祉を目的として他者の著作物を使用する場合、著作権者に使用料を支払う必要がないという考え方"},{"label":"イ","html":"著作権者は、著作権使用料の徴収を第三者に委託することが認められており、委託を受けた著作権管理団体はその徴収を公平に行わなければならないという考え方"},{"label":"ウ","html":"著作物の利用に当たっては、その内容や題号を公正に取り扱うため、著作者の意に反し、利用者が勝手に変更、切除その他の改変を行ってはならないという考え方"},{"label":"エ","html":"批評、解説、ニュース報道、教授、研究、調査などといった公正な目的のためであれば、一定の範囲での著作物の利用は、著作権の侵害に当たらないという考え方"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フェアユース(Fair use)は米国著作権法107条に規定された法理で、著作権者の許諾を得ていない著作物の利用であっても、利用の目的や性質、著作物の性格、利用された分量とその実質性、著作物の潜在的市場への影響という4つの判断要素を総合的に考慮し、裁判所が「公正な利用」と認めれば著作権侵害とはならないとする一般的・包括的な抗弁の仕組みである。批評・解説・報道・教育・研究といった目的がその典型例として挙げられ、選択肢エの記述はこの考え方に一致する。日本の著作権法にはこのような一般的・包括的なフェアユース規定は存在せず、代わりに私的使用のための複製や引用など、無許諾で利用できる場面が個別・限定的に条文で列挙される方式を採っており、2009年前後には「日本版フェアユース」の導入が議論されたものの、米国型の一般規定には至っていない。アは国・地方公共団体による著作物利用の説明、イは著作権等管理事業者による使用料徴収の説明、ウは著作者人格権の一つである同一性保持権の説明であり、いずれもフェアユースの定義とは異なる。</p>","mnemonic":""},{"id":97,"year":2022,"period":"令和4年度春期","num":23,"cat":"テクノロジ系","field":"CRYPTREC","summary":"CRYPTREC：令和4年度春期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>総務省及び経済産業省が策定した“電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)”を構成する暗号リストの説明のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"推奨候補暗号リストとは、CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリストである。"},{"label":"イ","html":"推奨候補暗号リストとは、候補段階に格下げされ、互換性維持目的で利用する暗号技術のリストである。"},{"label":"ウ","html":"電子政府推奨暗号リストとは、CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリストである。"},{"label":"エ","html":"電子政府推奨暗号リストとは、推奨段階に格下げされ、互換性維持目的で利用する暗号技術のリストである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CRYPTREC暗号リストは、総務省及び経済産業省が2013年3月に公表した「電子政府推奨暗号リスト」「推奨候補暗号リスト」「運用監視暗号リスト」の3種類で構成される。このうち電子政府推奨暗号リストは、CRYPTREC(暗号技術検討会・暗号技術評価委員会)によって安全性及び実装性能が確認された暗号技術のうち、市場での利用実績が十分であるか今後の普及が見込まれると判断され、電子政府システムでの利用を推奨するもののリストであり、選択肢ウの記述はこの定義と一致する。推奨候補暗号リストは、安全性・実装性能は確認済みであるものの、市場における利用実績が十分でない技術を掲載したリストであり、ウの文はそのまま電子政府推奨暗号リストの説明であって推奨候補暗号リストの説明(ア)には当たらない。また、運用監視暗号リストは、かつて電子政府推奨暗号リストに掲載されていたが、安全性の低下(危殆化)などの理由で現在は推奨されず、互換性維持のためにのみ継続利用が認められる技術(例:SHA-1)を指すリストであり、イ・エのように「推奨候補暗号リスト」や「電子政府推奨暗号リスト」自体がこの格下げされたリストであるとする説明は誤りである。</p>","mnemonic":""},{"id":98,"year":2022,"period":"令和4年度春期","num":24,"cat":"テクノロジ系","field":"ISMAP","summary":"ISMAP：令和4年度春期 問24","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>“政府情報システムのためのセキュリティ評価制度(ISMAP)管理基準”に関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"ISMAP管理基準は、ガバナンス基準、マネジメント基準、管理策基準、監査基準の四つから構成されている。"},{"label":"イ","html":"ガバナンス基準の実施主体は経営陣であり、情報セキュリティガバナンスのプロセスとして、評価、指示、モニタ、コミュニケーション及び保証の各プロセスが定められている。"},{"label":"ウ","html":"管理策基準は、管理者が実施すべき事項として、情報セキュリティマネジメントの計画、実行、点検、処置及びリスクコミュニケーションに必要な事項を定めている。"},{"label":"エ","html":"マネジメント基準は、組織における情報セキュリティマネジメントの確立段階において、リスク対応方針に従って管理策を選択する際の選択肢を与えている。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ISMAP(政府情報システムのためのセキュリティ評価制度)管理基準は、ISMAP運営委員会が定めるもので、経営陣が実施すべき事項を定めた「ガバナンス基準」、管理者が実施すべき事項を定めた「マネジメント基準」、組織が具体的に実施すべき対策を定めた「管理策基準」の三つから構成されており、「監査基準」を加えた四つではない点でアは誤りである。ガバナンス基準はJIS Q 27014(情報セキュリティガバナンス)などを踏まえて再整理されたもので、実施主体を経営陣とし、情報セキュリティガバナンスのプロセスとして評価(Evaluate)・指示(Direct)・モニタ(Monitor)に加えコミュニケーション及び保証のプロセスが定められており、選択肢イの記述はこれに一致する。ウの「情報セキュリティマネジメントの計画・実行・点検・処置」というPDCAサイクルに関する記述は管理者が実施すべき事項を定めたマネジメント基準の内容であり管理策基準の説明としては誤り、エの「管理策を選択する際の選択肢を与える」という記述は組織が実施すべき具体的対策を列挙する管理策基準の役割であり、マネジメント基準の説明としては誤りである(ウとエは基準の名称が入れ替わっている)。</p>","mnemonic":""},{"id":99,"year":2022,"period":"令和4年度春期","num":25,"cat":"テクノロジ系","field":"無線LANセキュリティ","summary":"無線LANセキュリティ：令和4年度春期 問25","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>参加者が毎回変わる100名程度の公開セミナーにおいて、参加者に対して無線LAN接続環境を提供する。参加者の端末以外からのアクセスポイントへの接続を防止するために効果がある情報セキュリティ対策はどれか。</p>","choices":[{"label":"ア","html":"アクセスポイントがもつDHCPサーバ機能において、参加者の端末に対して動的に割り当てるIPアドレスの範囲をセミナーごとに変更する。"},{"label":"イ","html":"アクセスポイントがもつURLフィルタリング機能において、参加者の端末に対する条件をセミナーごとに変更する。"},{"label":"ウ","html":"アクセスポイントがもつ認証機能において、参加者の端末とアクセスポイントとの間で事前に共有する鍵をセミナーごとに変更する。"},{"label":"エ","html":"アクセスポイントがもつプライバシセパレータ機能において、参加者の端末へのアクセス制限をセミナーごとに変更する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>設問が求めているのは「参加者の端末以外からのアクセスポイントへの“接続”を防止する」対策であり、これにはアクセスポイントへの接続そのものを許可するかどうかを判定する認証の仕組みを強化する必要がある。WPA/WPA2-PSKのような事前共有鍵(PSK)方式では、アクセスポイントと端末があらかじめ共有した鍵を用いて接続時に認証を行うため、参加者が毎回入れ替わる公開セミナーにおいてこの鍵をセミナーごとに変更すれば、過去の参加者や鍵を知らない第三者の端末はアクセスポイントに接続できなくなり、設問の目的に直接効果がある。これに対しDHCPサーバが割り当てるIPアドレスの範囲の変更(ア)や、プライバシセパレータ機能によるアクセス制限(イとエのURLフィルタリングやエのプライバシセパレータ機能)は、いずれもアクセスポイントへの接続自体を認証・制限する仕組みではなく、接続後の通信先や端末間通信を制御する機能にすぎないため、無関係な端末が最初にアクセスポイントへ接続すること自体を防ぐ効果はない。</p>","mnemonic":""},{"id":100,"year":2021,"period":"令和3年度春期","num":1,"cat":"ストラテジ系","field":"DX推進指標","summary":"DX推進指標：令和3年度春期 問1","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>経済産業省が策定した“「DX推進指標」とそのガイダンス」における DX推進指標の説明はどれか。</p>","choices":[{"label":"ア","html":"ITベンダが、情報システムを開発する際のプロジェクト管理能力、エンジニアリング能力を高めていくために、現状のプロセス状況を5段階に分けて評価し、不十分な部分を改善することを目指すもの"},{"label":"イ","html":"経営者や社内関係者が、データとデジタル技術を活用して顧客視点で新たな価値を創出していくために、現状とあるべき姿に向けた課題・対応策に関する認識を共有し、必要なアクションをとるための気付きの機会を提供することを目指すもの"},{"label":"ウ","html":"社内IT部門が、不正侵入やハッキングなどのサイバー攻撃から自社のデータを守るために、安全なデータの保管場所、保管方法、廃棄方法を具体的に選定するための指針を提供することを目指すもの"},{"label":"エ","html":"内部監査人が、企業などの内部統制の仕組みのうち、ITを用いた業務処理に関して、情報システムの開発・運用・保守に係るリスクを評価した上で、内部統制システムを整備することを目指すもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DX推進指標は経済産業省が2019年7月に策定した自己診断指標である。経営者や社内関係者がデータとデジタル技術を活用して顧客視点で新たな価値を創出していくために、自社の現状とあるべき姿とのギャップ(課題)や対応策に関する認識を共有し、必要なアクションにつなげるための「気付き」の機会を提供することを目的としている。これは経済産業省のガイダンスに明記されている位置づけと一致しており、DXの定義自体も「データとデジタル技術を活用して、顧客や社会のニーズを基に、製品やサービス、ビジネスモデルを変革するとともに、業務そのものや、組織、プロセス、企業文化・風土を変革する」という趣旨で貫かれている。選択肢アはITベンダのプロジェクト管理・エンジニアリング能力を5段階で評価するCMMI(能力成熟度モデル統合)的な枠組みの説明であり、DX推進指標とは別物である。選択肢ウはデータのセキュリティ管理方針、エは内部統制・監査の観点であり、いずれもDX推進指標の本来の目的(経営者の気付きの促進)とは異なる。</p>","mnemonic":""},{"id":101,"year":2021,"period":"令和3年度春期","num":2,"cat":"ストラテジ系","field":"投資評価指標","summary":"投資評価指標：令和3年度春期 問2","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>情報システムの導入と活用によって生み出されるキャッシュフローの現在価値を計算することによって、投資効果を評価したい。このときに使われる指標はどれか。</p>","choices":[{"label":"ア","html":"BSC"},{"label":"イ","html":"EVA"},{"label":"ウ","html":"NPV"},{"label":"エ","html":"ROI"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NPV(正味現在価値、Net Present Value)は、投資によって将来生み出されるキャッシュフローを割引率を用いて現在価値に換算し、そこから初期投資額を差し引いて求める指標である。本問は「キャッシュフローの現在価値を計算することによって投資効果を評価する」と述べており、これはまさにNPV法の手順そのものである。NPVがプラスであれば投資価値があると判断され、複数の投資案を比較検討する際にも広く用いられる代表的な投資評価手法である。選択肢のBSC(バランストスコアカード)は財務・顧客・内部プロセス・学習と成長の4視点で戦略の進捗を管理する手法、EVA(経済的付加価値)は税引後営業利益から資本コストを差し引いて算出する期間利益の指標、ROIは投資額に対する利益の割合を示す収益性指標であり、いずれも将来キャッシュフローを現在価値に割り引くことを直接の定義とはしていない点でNPVと異なる。</p>","mnemonic":""},{"id":102,"year":2021,"period":"令和3年度春期","num":3,"cat":"ストラテジ系","field":"IT投資ポートフォリオ","summary":"IT投資ポートフォリオ：令和3年度春期 問3","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>IT投資ポートフォリオにおいて、情報化投資の対象を、戦略、情報、トランザクション、インフラの四つのカテゴリに分類した場合、トランザクションカテゴリに対する投資の直接の目的はどれか。</p>","choices":[{"label":"ア","html":"管理品質向上のために、マネジメント、レポーティング、分析などを支援する。"},{"label":"イ","html":"市場における競争優位やポジショニングを獲得する。"},{"label":"ウ","html":"複数のアプリケーションソフトウェアによって共有される基盤部分を提供する。"},{"label":"エ","html":"ルーチン化された業務のコスト削減や処理効率向上を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IT投資ポートフォリオは、情報化投資を「戦略」「情報」「トランザクション」「インフラ」の4カテゴリに整理するフレームワークであり、ピーター・ウェイルらの研究を出典とする分類として紹介されることが多い。トランザクションカテゴリは、受発注処理や会計処理のようにルーチン化された定型業務を対象とし、その直接の目的は業務のコスト削減や処理効率の向上にある。選択肢アの「マネジメント・レポーティング・分析の支援」は情報カテゴリの目的、イの「競争優位やポジショニングの獲得」は戦略カテゴリの目的、ウの「複数アプリケーションで共有される基盤の提供」はインフラカテゴリの目的であり、それぞれ性質の異なる投資区分に対応する。4つのカテゴリは互いに排他的ではなく、企業はこれらへの投資配分バランス(ポートフォリオ)を検討することで、IT投資全体の戦略性と効率性を両立させることが求められる。</p>","mnemonic":""},{"id":103,"year":2021,"period":"令和3年度春期","num":4,"cat":"テクノロジ系","field":"プロビジョニング","summary":"プロビジョニング：令和3年度春期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>クラウドサービスなどの提供を迅速に実現するためのプロビジョニングの説明はどれか。</p>","choices":[{"label":"ア","html":"企業の情報システムの企画、設計、開発、導入、保守などのサービスを、一貫して又は工程の幾つかを部分的に提供する。"},{"label":"イ","html":"業種や事業内容などで共通する複数の企業や組織が共同でデータセンタを運用して、それぞれがインターネットを通して各種サービスを利用する。"},{"label":"ウ","html":"自社でハードウェア、ネットワークなどの環境を用意し、業務パッケージなどを導入して利用する運用形態にする。"},{"label":"エ","html":"利用者の需要を予想し、ネットワーク設備やシステムリソースなどを計画的に調達して強化し、利用者の要求に応じたサービスを提供できるように備える。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロビジョニングとは、ITインフラにおいて利用者の将来の需要をあらかじめ見積もり、必要となるネットワーク設備やサーバ、ストレージなどのシステムリソースを計画的に準備・調達しておくことで、要求が発生した際に迅速にサービスを提供できるよう備えることを指す。クラウドサービスの文脈では、需要変動に応じてリソースをオンデマンドで動的に割り当てたり解放したりできる体制をあらかじめ整えておくという意味合いが強く、この性質が自動化とも相性が良いとされる。選択肢アはITアウトソーシング(システム開発・運用を一貫または部分的に受託するサービス)の説明、イは複数組織が共同でデータセンタを運用するコミュニティクラウド的な形態の説明、ウは自社でハードウェアを用意するオンプレミス型の運用形態の説明であり、いずれも「需要を見越した計画的なリソース準備による迅速な提供」というプロビジョニングの核心とは異なる。</p>","mnemonic":""},{"id":104,"year":2021,"period":"令和3年度春期","num":5,"cat":"ストラテジ系","field":"ビジネスモデルキャンバス","summary":"ビジネスモデルキャンバス：令和3年度春期 問5","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>システム化構想の段階で、ビジネスモデルを整理したり、分析したりするときに有効なフレームワークの一つであるビジネスモデルキャンバスの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"企業がどのように、価値を創造し、顧客に届け、収益を生み出しているかを、顧客セグメント、価値提案、チャネル、顧客との関係、収益の流れ、リソース、主要活動、パートナ、コスト構造の九つのブロックを用いて図示し、分析する。"},{"label":"イ","html":"企業が付加価値を生み出すための業務の流れを、購買物流、製造、出荷物流、販売・マーケティング、サービスという五つの主活動と、調達、技術開発など四つの支援活動に分類して分析する。"},{"label":"ウ","html":"企業の強み・弱み、外部環境の機会・脅威を分析し、内部要因と外部要因をそれぞれ軸にした表を作成することによって、事業機会や事業課題を発見する。"},{"label":"エ","html":"企業目標の達成を目指し、財務、顧客、内部ビジネスプロセス、学習と成長の四つの視点から戦略マップを作成して、四つの視点においてバランスのとれた事業計画を策定し進捗管理をしていく。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ビジネスモデルキャンバスは、スイスの経営学者アレックス・オスターワルダーとイヴ・ピニュールが考案したフレームワークで、企業がどのように価値を創造し、顧客に届け、収益を生み出しているかを1枚のシートで可視化・分析するためのツールである。顧客セグメント、価値提案、チャネル、顧客との関係、収益の流れ、リソース(経営資源)、主要活動、パートナー、コスト構造という九つのブロックで構成され、これらを埋めることでビジネスモデル全体の整合性を検討できる。選択肢イは購買物流・製造・出荷物流・販売マーケティング・サービスなどを扱うバリューチェーン分析、ウは内部要因・外部要因を軸にしたSWOT分析、エは財務・顧客・内部ビジネスプロセス・学習と成長の4視点で戦略マップを作るバランストスコアカード(BSC)の説明であり、いずれもビジネスモデルキャンバスとは異なる別のフレームワークである。</p>","mnemonic":""},{"id":105,"year":2021,"period":"令和3年度春期","num":6,"cat":"ストラテジ系","field":"ファイブフォース分析","summary":"ファイブフォース分析：令和3年度春期 問6","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ファイブフォース分析は、業界構造を、業界内で競争が激化する五つの要因を用いて図のように説明している。図中のaに入る要因はどれか。</p><table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;text-align:center;\"><tr><td></td><td>新規参入の脅威</td><td></td></tr><tr><td>売り手の交渉力</td><td><b>a</b></td><td>買い手の交渉力</td></tr><tr><td></td><td>代替品の脅威</td><td></td></tr></table>","choices":[{"label":"ア","html":"規模の経済性"},{"label":"イ","html":"業者間の敵対関係"},{"label":"ウ","html":"仕入先の集中度"},{"label":"エ","html":"流通チャネルの確保"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファイブフォース分析はマイケル・ポーターが提唱した業界構造分析のフレームワークで、業界内の競争の激しさを「新規参入の脅威」「売り手の交渉力」「買い手の交渉力」「代替品の脅威」、そしてそれらに囲まれる中心に位置する「業者間の敵対関係(既存企業間の競争)」という五つの要因で説明する。中心のaは、他の四つの外的な力が直接影響を及ぼす業界内部の競争状態そのものを表すため、「業者間の敵対関係」が該当する。選択肢アの「規模の経済性」は新規参入の脅威(参入障壁)を左右する要因の一つ、ウの「仕入先の集中度」は売り手の交渉力を強める要因、エの「流通チャネルの確保」も新規参入の障壁に関わる要因であり、いずれも中心のボックスそのものではなく、周辺の四つの力を構成する個別の下位要素にすぎない。</p>","mnemonic":""},{"id":106,"year":2021,"period":"令和3年度春期","num":7,"cat":"ストラテジ系","field":"ブルーオーシャン戦略","summary":"ブルーオーシャン戦略：令和3年度春期 問7","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ブルーオーシャン戦略の特徴はどれか。</p>","choices":[{"label":"ア","html":"価値を高めながらコストを押し下げる。"},{"label":"イ","html":"既存の市場で競争する。"},{"label":"ウ","html":"既存の需要を喚起する。"},{"label":"エ","html":"競合他社を打ち負かす。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ブルーオーシャン戦略は、W・チャン・キムとレネ・モボルニュが提唱した戦略論で、競合のいない新たな市場空間(ブルーオーシャン)を創造することを目指す考え方である。その中核にあるのが「バリューイノベーション(価値革新)」で、差別化(価値向上)と低コスト化という従来はトレードオフとされてきた関係を同時に追求し両立させる点に特徴がある。すなわち「価値を高めながらコストを押し下げる」がブルーオーシャン戦略の特徴であり、戦略キャンバスやERRCグリッド(取り除く・減らす・増やす・付け加える)といったツールを用いて具体化される。選択肢イ・ウ・エの「既存の市場で競争する」「既存の需要を喚起する」「競合他社を打ち負かす」は、いずれも限られた既存市場のパイを奪い合う従来型の競争戦略、すなわち対比概念である「レッドオーシャン戦略」の特徴であり、ブルーオーシャン戦略とは対照的な考え方である。</p>","mnemonic":""},{"id":107,"year":2021,"period":"令和3年度春期","num":8,"cat":"ストラテジ系","field":"AIDMAモデル","summary":"AIDMAモデル：令和3年度春期 問8","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>AIDMAモデルの活用方法はどれか。</p>","choices":[{"label":"ア","html":"消費者が製品を購入するまでの心理の過程を、注意、興味、欲求、記憶、行動に分け、各段階のコミュニケーション手段を検討する。"},{"label":"イ","html":"製品と市場
