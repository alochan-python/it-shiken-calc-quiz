<meta charset="UTF-8">
<title>ST計算問題道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ST計算問題道場">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FA; --bg-elevated:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECEEF5;
  --border:#DBDEE9; --border-soft:#E7E9F2;
  --text:#1B2130; --text-dim:#5B6478; --text-faint:#8991A3;
  --accent:#0E7C86; --accent-strong:#0A5E66; --accent-soft:#E1F1F1; --accent-contrast:#FFFFFF;
  --success:#1F8A4C; --success-soft:#E3F5E9;
  --danger:#C8392F; --danger-soft:#FBEAE8;
  --warning:#B4790F; --warning-soft:#FBF0DA;
  --cat-tech:#2F5FD6; --cat-tech-soft:#E7ECFC;
  --cat-mgmt:#7A4FC9; --cat-mgmt-soft:#F0EBFB;
  --cat-strat:#1E8F72; --cat-strat-soft:#E4F5F0;
  --shadow:0 1px 2px rgba(24,32,56,.06), 0 8px 24px rgba(24,32,56,.08);
  --shadow-lg:0 4px 8px rgba(24,32,56,.08), 0 16px 40px rgba(24,32,56,.12);
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --font-display:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
    --border:#2B3145; --border-soft:#242A3B;
    --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
    --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
    --success:#4BC382; --success-soft:rgba(75,195,130,.14);
    --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
    --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
    --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
    --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
    --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
  --border:#2B3145; --border-soft:#242A3B;
  --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
  --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
  --success:#4BC382; --success-soft:rgba(75,195,130,.14);
  --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
  --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
  --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
  --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
  --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
h1,h2,h3,h4,.disp{font-family:var(--font-display); text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit; touch-action:manipulation; color:inherit; background:none}
::selection{background:var(--accent-soft)}

#app{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
@media (min-width:700px){ #app{max-width:880px} }
.view{display:none}
.view.active{display:block}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .brand{display:flex;flex-direction:column;gap:2px}
.topbar h1{font-size:1.3rem;font-weight:900;letter-spacing:.01em;margin:0}
.topbar .sub{font-size:.74rem;color:var(--text-faint);letter-spacing:.04em}
.iconbtn{
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- Dashboard ---------- */
.hero{
  display:flex;align-items:center;gap:20px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow);
  margin-bottom:16px;
}
.ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:9}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .pct{font-family:var(--font-display);font-weight:900;font-size:1.5rem;line-height:1}
.ring-label .pct-cap{font-size:.62rem;color:var(--text-faint);margin-top:2px;letter-spacing:.03em}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;flex:1;min-width:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;border-bottom:1px dashed var(--border-soft);padding:3px 0}
.stat-row b{font-family:var(--font-display);font-size:1rem}
.stat-row .lbl{color:var(--text-dim)}

.section-label{font-size:.72rem;font-weight:700;color:var(--text-faint);letter-spacing:.08em;margin:22px 2px 8px;text-transform:uppercase}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{
  text-align:left;border:1px solid var(--border-soft);background:var(--surface);
  border-radius:var(--radius-m);padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.mode-card:disabled{opacity:.45;cursor:not-allowed}
.mode-card:not(:disabled):hover{border-color:var(--accent)}
.mode-card .mc-count{font-family:var(--font-display);font-weight:900;font-size:1.7rem;color:var(--accent)}
.mode-card .mc-title{font-size:.86rem;font-weight:700;margin-top:2px}
.mode-card .mc-desc{font-size:.72rem;color:var(--text-faint);margin-top:2px}
.mode-card.retry .mc-count{color:var(--danger)}
.mode-card.checked .mc-count{color:var(--warning)}
.mode-card.fresh .mc-count{color:var(--text-dim)}

.filters{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:14px;box-shadow:var(--shadow)}
.filter-group{margin-bottom:10px}
.filter-group:last-child{margin-bottom:0}
.filter-group .fg-label{font-size:.7rem;color:var(--text-faint);margin-bottom:6px;letter-spacing:.03em}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  border-radius:999px;padding:5px 12px;font-size:.76rem;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);font-weight:700}
.chip.chip-green{border-color:var(--success);color:var(--success)}
.chip.chip-green.active{background:var(--success);border-color:var(--success);color:#fff}
.chip.chip-yellow{border-color:var(--warning);color:var(--warning)}
.chip.chip-yellow.active{background:var(--warning);border-color:var(--warning);color:#fff}
.chip.chip-red{border-color:var(--danger);color:var(--danger)}
.chip.chip-red.active{background:var(--danger);border-color:var(--danger);color:#fff}

.start-cta{
  width:100%;margin-top:14px;background:var(--accent);color:var(--accent-contrast);border:none;
  border-radius:999px;padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);
}
.start-cta:disabled{opacity:.4;cursor:not-allowed}
.filtercount{text-align:center;font-size:.74rem;color:var(--text-faint);margin-top:8px}

.danger-zone{margin-top:26px;text-align:center}
.link-btn{background:none;border:none;color:var(--text-faint);font-size:.72rem;text-decoration:underline;cursor:pointer}

/* ---------- Quiz ---------- */
.quizbar{position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:12px 0 10px;z-index:5;display:flex;align-items:center;gap:10px}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcounter{font-size:.76rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

.qcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:14px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.badge{border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700;letter-spacing:.02em}
.badge.cat-tech{background:var(--cat-tech-soft);color:var(--cat-tech)}
.badge.cat-mgmt{background:var(--cat-mgmt-soft);color:var(--cat-mgmt)}
.badge.cat-strat{background:var(--cat-strat-soft);color:var(--cat-strat)}
.badge.meta{background:var(--surface-2);color:var(--text-dim);font-weight:500}
.badge.check-green{background:var(--success-soft);color:var(--success)}
.badge.check-yellow{background:var(--warning-soft);color:var(--warning)}
.badge.check-red{background:var(--danger-soft);color:var(--danger)}

.qtext{font-size:.94rem;line-height:1.6}
.qtext table,.expl-body table{border-collapse:collapse;margin:.8em 0;font-size:.92em;max-width:100%}
.qtext td,.qtext th,.expl-body td,.expl-body th{border:1px solid var(--border);padding:5px 10px;text-align:left}
.qtext th,.expl-body th{background:var(--surface-2);font-weight:700}
.qtext{overflow-x:auto}
.qtext img{max-width:100%;height:auto;display:block;margin:1em auto}
.qtext ul, .expl-body ul, .choice-item ul{padding-left:0;margin:.6em 0}
.qtext ul > li, .expl-body ul > li{list-style:none}
.qtext li[class^="li"],.qtext li[class^="maru"],.expl-body li[class^="li"],.expl-body li[class^="maru"]{
  position:relative;padding-left:2em;margin:0 0 6px}
.qtext li[class^="li"]::before,.expl-body li[class^="li"]::before{position:absolute;left:0;top:1px}
li.lia::before{content:"ア"}li.lii::before{content:"イ"}li.liu::before{content:"ウ"}li.lie::before{content:"エ"}
li.li1{counter-reset:licount}
li.li1::before,li.li2::before,li.li3::before,li.li4::before,li.li5::before,li.li6::before{counter-increment:licount;content:"(" counter(licount) ")"}
li[class^="maru"]{counter-increment:marucount}
li.maru1{counter-reset:marucount}
li[class^="maru"]::before{position:absolute;left:0;top:5px;counter-increment:marucount;content:counter(marucount);border:1px solid currentColor;border-radius:50%;text-align:center;font-size:11px;width:14px;height:14px;line-height:13px}
ul.none li{padding-left:0}
ul.none li::before{content:none}
.frac{display:inline-block;text-align:center;vertical-align:middle;line-height:1.4;min-width:1.6em;margin:0 .15em}
.frac>span:not([class]){display:block;border-bottom:1.5px solid currentColor;padding:0 .1em}
em.r{color:var(--danger);font-style:normal;font-weight:700}
em.g{color:var(--success);font-style:normal;font-weight:700}
.bb{display:inline-block;border:1.5px solid var(--text-dim);min-width:6ex;padding:1px 10px;margin:0 2px;text-align:center;border-radius:4px}
.code,.pre{font-family:Menlo,Consolas,monospace;font-size:.92em}
.pre{background:var(--surface-2);border-radius:6px;border-left:3px solid var(--border);padding:8px 10px;margin:.6em 0;overflow-x:auto;white-space:pre}
span.code{background:var(--surface-2);border-radius:5px;padding:1px 6px;border:1px solid var(--border)}
.img_margin{text-align:center;margin:1em auto !important}

.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice-item{
  display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:10px 12px;cursor:pointer;font-size:.9rem;line-height:1.5;color:var(--text);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.choice-item:hover{border-color:var(--accent)}
.choice-item .clabel{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--text-dim);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84rem;font-family:var(--font-display);
}
.choice-item .ctext{flex:1;padding-top:2px;color:var(--text)}
.choice-item .ctext img{max-width:100%}
.choices.locked .choice-item{cursor:default}
.choice-item.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice-item.picked .clabel{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.choice-item.correct-answer{border-color:var(--success);background:var(--success-soft)}
.choice-item.correct-answer .clabel{background:var(--success);border-color:var(--success);color:#fff}
.choice-item.wrong-pick{border-color:var(--danger);background:var(--danger-soft)}
.choice-item.wrong-pick .clabel{background:var(--danger);border-color:var(--danger);color:#fff}

.shared-block{margin-top:14px}
.shared-block img{max-width:100%}
.shared-block .selectList{list-style:none;padding:0;margin:0}
.label-row{display:flex;gap:8px;margin-top:14px}
.label-btn{
  flex:1;border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:11px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--text-dim);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.label-btn:hover{border-color:var(--accent)}
.label-btn.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.label-btn.correct-answer{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.label-btn.wrong-pick{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

/* stamp */
.stamp-row{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.stamp{width:42px;height:42px;flex-shrink:0}
.stamp svg{width:100%;height:100%;overflow:visible}
.stamp circle,.stamp path{fill:none;stroke:var(--success);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220;animation:draw .55s ease-out forwards}
.stamp.wrong circle,.stamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stamp circle,.stamp path{animation:none;stroke-dashoffset:0}}

/* big center-screen stamp flash */
#bigStamp{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;opacity:0;
}
#bigStamp svg{width:min(46vw,220px);height:min(46vw,220px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.18))}
#bigStamp circle,#bigStamp path{fill:none;stroke:var(--success);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220}
#bigStamp.wrong circle,#bigStamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
#bigStamp.show{animation:bigStampPop .9s cubic-bezier(.2,.8,.2,1) forwards}
#bigStamp.show circle,#bigStamp.show path{animation:draw .4s ease-out .05s forwards}
@keyframes bigStampPop{
  0%{opacity:0; transform:scale(.6) rotate(-8deg)}
  16%{opacity:1; transform:scale(1.08) rotate(2deg)}
  26%{transform:scale(1) rotate(0)}
  72%{opacity:1; transform:scale(1) rotate(0)}
  100%{opacity:0; transform:scale(1.04) rotate(0)}
}
@media (prefers-reduced-motion:reduce){
  #bigStamp.show{animation:none; opacity:0}
}

/* big answer reveal (correct letter + mnemonic) */
.answer-reveal{
  display:flex; gap:11px; align-items:flex-start;
  background:linear-gradient(135deg, var(--accent-soft), transparent 160%);
  border:2px solid var(--accent); border-radius:var(--radius-m);
  padding:12px 13px; margin:8px 0;
}
.ar-letter{
  flex-shrink:0; width:44px; height:44px; border-radius:50%;
  background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:1.4rem;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.ar-body{flex:1; min-width:0}
.ar-h{display:flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;color:var(--accent-strong);letter-spacing:.05em;margin-bottom:3px}
:root:not([data-theme="light"]) .ar-h{color:var(--accent)}
:root[data-theme="dark"] .ar-h{color:var(--accent)}
.ar-mnemonic{font-size:1.02rem; line-height:1.55; font-weight:700; color:var(--text)}
.stamp-text b{font-family:var(--font-display);font-size:1.3rem}
.stamp-text.ok b{color:var(--success)}
.stamp-text.ng b{color:var(--danger)}
.stamp-text div{font-size:.8rem;color:var(--text-dim);margin-top:2px}

.auto-bar{margin-bottom:14px}
.auto-bar-label{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text-faint);margin-bottom:5px;letter-spacing:.02em}
.auto-bar-track{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.auto-bar-fill{height:100%;background:var(--accent);border-radius:99px;width:100%}
.auto-bar-fill.advancing{background:var(--success)}

.result-panel{margin-top:6px;border-top:1px dashed var(--border-soft);padding-top:10px}
.tip-box{background:var(--surface-2);border-radius:var(--radius-s);padding:9px 12px;margin:8px 0;font-size:.82rem}
.tip-box .tip-h{font-size:.68rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:4px}
.expl-h{font-size:.78rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin:16px 0 8px;text-transform:uppercase}
.expl-body{font-size:.9rem;line-height:1.85}
.expl-body img{max-width:100%;display:block;margin:1em auto}

.linkrow{display:flex;gap:14px;margin-top:14px;font-size:.78rem}
.linkrow a{text-decoration:none;color:var(--text-dim);border-bottom:1px solid var(--border)}
.linkrow a:hover{color:var(--accent);border-color:var(--accent)}

.footer-actions{display:flex;align-items:center;gap:8px;margin-top:4px}
.check-row{display:flex;gap:6px;flex-shrink:0}
.check-dot{
  width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg-elevated);
  font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:.45;filter:grayscale(.6);
}
.check-dot.active{opacity:1;filter:none;transform:scale(1.08);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.check-dot.green.active{border-color:var(--success)}
.check-dot.yellow.active{border-color:var(--warning)}
.check-dot.red.active{border-color:var(--danger)}
.next-btn{
  flex:1;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:999px;
  padding:12px;font-size:.9rem;font-weight:700;cursor:pointer;
}
.next-btn:disabled{opacity:.35;cursor:not-allowed}

.quiz-nav{display:flex;justify-content:space-between;margin-top:10px}
.ghost-btn{background:none;border:none;color:var(--text-faint);font-size:.78rem;cursor:pointer;padding:6px 4px}
.ghost-btn:hover{color:var(--text)}

/* jump grid */
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:6px}
.jump-cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);
  font-size:.68rem;color:var(--text-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.jump-cell.current{outline:2px solid var(--accent);outline-offset:1px}
.jump-cell.correct{background:var(--success-soft);color:var(--success);border-color:transparent}
.jump-cell.wrong{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.jump-cell.check-green{box-shadow:inset 0 -3px 0 var(--success)}
.jump-cell.check-yellow{box-shadow:inset 0 -3px 0 var(--warning)}
.jump-cell.check-red{box-shadow:inset 0 -3px 0 var(--danger)}

/* done screen */
.done-wrap{text-align:center;padding:40px 10px}
.done-wrap h2{font-size:1.4rem;margin-bottom:6px}
.done-wrap p{color:var(--text-dim);font-size:.88rem}

@media(max-width:420px){
  .mode-grid{grid-template-columns:1fr}
}

/* wider screens (iPad etc.): lay choices out 2-up so the question+choices
   block is shorter, leaving the answer/mnemonic visible without scrolling */
@media (min-width:700px){
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .label-row{max-width:420px}
}

/* once answered, shrink the choice list so the answer card below doesn't
   require scrolling to reach */
#choicesWrap.answered .choice-item{padding:6px 10px;font-size:.8rem;line-height:1.3}
#choicesWrap.answered .choice-item .clabel{width:21px;height:21px;font-size:.72rem}
#choicesWrap.answered .choices{gap:5px}
#choicesWrap.answered .label-btn{padding:7px;font-size:.88rem}
#choicesWrap.answered .label-row{margin-top:8px}
</style>

<script>
(function(){
  function showErr(msg){
    var b = document.getElementById('jsDebug');
    if(!b){
      b = document.createElement('div');
      b.id = 'jsDebug';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;'
        + 'padding:10px 14px;font:12px/1.5 -apple-system,sans-serif;font-weight:bold;white-space:pre-wrap;'
        + 'max-height:40vh;overflow:auto';
      document.body.insertBefore(b, document.body.firstChild);
    }
    b.textContent += (b.textContent?'\n\n':'') + msg;
  }
  window.addEventListener('error', function(e){
    showErr('JSエラー: ' + e.message + ' (' + (e.filename||'') + ':' + e.lineno + ':' + e.colno + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('Promiseエラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>

益の計算には使わないひっかけに注意","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>当期末の決算において，表に示した損益計算資料が得られた。日本基準で当期の営業利益は何百万円か。</p><table><tr><td colspan='2'>単位　百万円</td></tr><tr><td>項目</td><td>金額</td></tr><tr><td>売上高</td><td>1,500</td></tr><tr><td>売上原価</td><td>1,000</td></tr><tr><td>販売費及び一般管理費</td><td>200</td></tr><tr><td>営業外収益</td><td>40</td></tr><tr><td>営業外費用</td><td>30</td></tr></table>","choices":[{"label":"ア","html":"270"},{"label":"イ","html":"300"},{"label":"ウ","html":"310"},{"label":"エ","html":"500"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>日本基準の損益計算書では，営業利益は本業の儲けを表す区分で，営業外収益・営業外費用は含めない（それらは営業利益の下の「経常利益」の計算で加減算する）。</p><p>営業利益 = 売上高1,500 － 売上原価1,000 － 販売費及び一般管理費200 = 300百万円。</p><p>よって答えはイ。なお，営業外収益40と営業外費用30まで加減算してしまうと300+40-30=310となりウに釣られるが，これは経常利益の計算であり誤り。</p>","mnemonic":"営業外の40と30は“本業の外”だから無視，1,500－1,000－200で素直に300。釣られるとウの310になる。"},{"id":2,"year":2024,"period":"令和6年度春期","num":20,"cat":"ストラテジ系","field":"キャッシュフロー","summary":"キャッシュフロー：令和6年度春期 問20","correct":"ウ","result":"","formula":"営業CF=税引前利益+減価償却費－資産増加額+資産減少額+負債増加額－法人税等支払額","howto":"間接法：資産の増加はキャッシュのマイナス，負債の増加はキャッシュのプラスとして調整する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>キャッシュフロー計算書における，営業活動によるキャッシュフローは何万円か。</p><table><tr><td colspan='2'>単位　万円</td></tr><tr><td>税金等調整前当期純利益</td><td>108</td></tr><tr><td>減価償却費</td><td>42</td></tr><tr><td>売上債権の増加額</td><td>60</td></tr><tr><td>棚卸資産の減少額</td><td>30</td></tr><tr><td>仕入債務の増加額</td><td>40</td></tr><tr><td>法人税等の支払額</td><td>32</td></tr></table>","choices":[{"label":"ア","html":"44"},{"label":"イ","html":"104"},{"label":"ウ","html":"128"},{"label":"エ","html":"188"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>間接法による営業活動キャッシュフローは次のように調整する。</p><p>税金等調整前当期純利益108　＋　減価償却費42（非資金費用を足し戻す）</p><p>－　売上債権の増加額60（未回収の売上はキャッシュ増になっていないので差し引く）</p><p>＋　棚卸資産の減少額30（在庫が減った分は仕入支出が減りキャッシュ増）</p><p>＋　仕入債務の増加額40（未払いの仕入はまだキャッシュアウトしていないので足す）</p><p>－　法人税等の支払額32</p><p>108+42-60+30+40-32 = 128万円。よって答えはウ。</p>","mnemonic":"税引前108に経費や債権債務のデコボコを足し引きすると，IT業界お馴染みの数字“いちにっぱー（128）”に着地する。"},{"id":3,"year":2023,"period":"令和5年度春期","num":4,"cat":"ストラテジ系","field":"NPV評価","summary":"NPV評価：令和5年度春期 問4","correct":"ウ","result":"","formula":"NPV=Σ(CFₙ÷(1+r)ⁿ)－初期投資額","howto":"各年のCFを(1+10%)^nで割って現在価値化し，合計から初期投資額を引いて比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>スマートフォン向けのアプリケーションプログラムの開発プロジェクトa〜dにおいて，2年間の投資効果をNPVで評価する場合，投資効果が最大となるプロジェクトはどれか。ここで，割引率は10％とする。</p><table><tr><td>単位</td><td colspan='3'>百万円</td></tr><tr><td>プロジェクト</td><td>初期投資額</td><td>1年目キャッシュフロー</td><td>2年目キャッシュフロー</td></tr><tr><td>a</td><td>7.9</td><td>4.40</td><td>4.84</td></tr><tr><td>b</td><td>5.5</td><td>3.30</td><td>3.63</td></tr><tr><td>c</td><td>4.3</td><td>3.30</td><td>2.42</td></tr><tr><td>d</td><td>6.1</td><td>2.20</td><td>3.63</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率10%なので，1年目は÷1.1，2年目は÷1.21で現在価値化する。各プロジェクトのキャッシュフローはいずれも÷1.1，÷1.21がちょうど割り切れる数字になっている点に着目する。</p><p>a: -7.9 + 4.40/1.1 + 4.84/1.21 = -7.9 + 4.0 + 4.0 = 0.1</p><p>b: -5.5 + 3.30/1.1 + 3.63/1.21 = -5.5 + 3.0 + 3.0 = 0.5</p><p>c: -4.3 + 3.30/1.1 + 2.42/1.21 = -4.3 + 3.0 + 2.0 = 0.7</p><p>d: -6.1 + 2.20/1.1 + 3.63/1.21 = -6.1 + 2.0 + 3.0 = -1.1</p><p>NPVが最大なのはc（0.7百万円）。よって答えはウ。</p>","mnemonic":"初期投資4.3百万と一番小粒な“c”が，2年分のCFを効率よく稼いでNPV+0.7で四つの中の一人勝ちになる。"},{"id":4,"year":2023,"period":"令和5年度春期","num":20,"cat":"ストラテジ系","field":"目標売上高","summary":"目標売上高：令和5年度春期 問20","correct":"ウ","result":"","formula":"新売上総利益=売上高×(1－変動費率)－固定費","howto":"変動費率(=変動費÷売上高)は一定のまま，固定費増と目標利益増の合計を限界利益率で割り戻す","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>表の事業計画案に対して，新規設備投資に伴う減価償却費（固定費）の増加1,000万円を織り込み，かつ，売上総利益を3,000万円とするようにしたい。変動費率に変化がないとすると，売上高の増加を何万円にすればよいか。</p><table><tr><td colspan='3'>単位　万円</td></tr><tr><td colspan='2'>売上高</td><td>20,000</td></tr><tr><td rowspan='3'>売上原価</td><td>変動費</td><td>10,000</td></tr><tr><td>固定費</td><td>8,000</td></tr><tr><td>計</td><td>18,000</td></tr><tr><td colspan='2'>売上総利益</td><td>2,000</td></tr></table>","choices":[{"label":"ア","html":"2,000"},{"label":"イ","html":"3,000"},{"label":"ウ","html":"4,000"},{"label":"エ","html":"5,000"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>変動費率 = 10,000 ÷ 20,000 = 50%（限界利益率も50%）。新しい固定費 = 8,000 + 1,000 = 9,000万円。</p><p>売上高を20,000+xとすると，売上総利益は　(20,000+x)×0.5－9,000 = 3,000　となるxを求めればよい。</p><p>0.5×(20,000+x) = 12,000 → 20,000+x = 24,000 → x = 4,000</p><p>別解：固定費の増加1,000万円と，目標利益の増加(3,000－2,000=1,000万円)の合計2,000万円を，限界利益率50%で割り戻すと 2,000÷0.5 = 4,000万円，と一発で求めることもできる。</p><p>よって答えはウ（4,000万円）。</p>","mnemonic":"固定費+1,000と利益+1,000，合計2,000を限界利益率50%で割り戻す“2倍ルール”で答えは四千（4,000）万円。"},{"id":5,"year":2023,"period":"令和5年度春期","num":21,"cat":"ストラテジ系","field":"連結会計","summary":"連結会計：令和5年度春期 問21","correct":"ウ","result":"","formula":"連結売上高総利益率=(連結売上高－連結売上原価)÷連結売上高×100","howto":"グループ内取引（A→B 800）を売上高・売上原価の両方から完全に相殺消去してから集計する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2023r05.html","q":"<p>連結売上高総利益率は何％か。ここで，B社はA社の100％子会社で，仕入れは全て親会社からであり，売上は全て親会社以外である。また，期首，期末とも在庫はない。</p><table><tr><td colspan='2'>A社損益計算書（単位　万円）</td></tr><tr><td>売上高</td><td>4,000</td></tr><tr><td>子会社売上高</td><td>800</td></tr><tr><td>売上原価</td><td>3,000</td></tr><tr><td>売上総利益</td><td>1,800</td></tr></table><table><tr><td colspan='2'>B社損益計算書（単位　万円）</td></tr><tr><td>売上高</td><td>1,000</td></tr><tr><td>売上原価</td><td>800</td></tr><tr><td>売上総利益</td><td>200</td></tr></table>","choices":[{"label":"ア","html":"34"},{"label":"イ","html":"38"},{"label":"ウ","html":"40"},{"label":"エ","html":"56"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A社の表の「売上高4,000」は外部顧客向けのみの金額で，子会社（B社）向けの「子会社売上高800」は別建てになっている（4,000－3,000＝1,000ではなく，4,000＋800－3,000＝1,800が売上総利益になっていることから読み取れる）。</p><p>連結売上高 = A社の外部向け売上高4,000 ＋ B社の売上高1,000 = 5,000万円（A社の子会社向け売上高800とB社の売上原価800は，グループ内の同一取引なので両建てで相殺消去）</p><p>連結売上原価 = A社の売上原価3,000（グループ全体の生産コストを含む） ＋ B社の売上原価800 － 内部取引相殺800 = 3,000万円</p><p>連結売上総利益 = 5,000 － 3,000 = 2,000万円</p><p>連結売上高総利益率 = 2,000 ÷ 5,000 × 100 = 40%。よって答えはウ。</p>","mnemonic":"A社の子会社向け800とB社の原価800がぴったり相殺され，残り5,000分の2,000で“よんわり”40%に落ち着く。"},{"id":6,"year":2022,"period":"令和4年度春期","num":4,"cat":"ストラテジ系","field":"DCF法","summary":"DCF法：令和4年度春期 問4","correct":"ア","result":"","formula":"現在価値＝CF÷(1+r)^n（毎年度末に百万円未満切り捨て）","howto":"各年のCF100を20%で複利割引し端数切り捨てのうえ，－150を含めて合計する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>プロジェクト開始時点で150百万円の支出を行うIT投資プロジェクトにおいて，3年間の金銭的価値をDCF法で算定した場合，正しい金額はa〜dのどれか。</p><p>なお，割引率は20%で固定とし，キャッシュフローは全て年度末に発生するものとする。また，金銭的価値の算定の際には年度ごとに百万円未満を切り捨てて計算している。</p><table><tr><td colspan=\"5\">IT投資プロジェクト（単位　百万円）</td></tr><tr><td>投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td></tr><tr><td>キャッシュフロー</td><td>－150</td><td>100</td><td>100</td><td>100</td></tr></table><table><tr><td colspan=\"6\">DCF法による金銭的価値の算定結果（単位　百万円）</td></tr><tr><td>算定結果＼投資年</td><td>プロジェクト開始時点</td><td>1年後</td><td>2年後</td><td>3年後</td><td>合計</td></tr><tr><td>a</td><td>－150</td><td>83</td><td>69</td><td>57</td><td>59</td></tr><tr><td>b</td><td>－150</td><td>83</td><td>71</td><td>62</td><td>66</td></tr><tr><td>c</td><td>－150</td><td>83</td><td>83</td><td>83</td><td>99</td></tr><tr><td>d</td><td>－150</td><td>83</td><td>96</td><td>99</td><td>128</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率20%で各年のキャッシュフロー100百万円を現在価値に割り引き，年度ごとに百万円未満を切り捨てる。</p><p>1年後：100÷1.2＝83.33…→83</p><p>2年後：100÷1.2^2＝100÷1.44＝69.44…→69</p><p>3年後：100÷1.2^3＝100÷1.728＝57.87…→57</p><p>開始時点の－150を含めた合計は－150＋83＋69＋57＝59（百万円）。これは表の「a」の行と一致するため，正解は「ア」。</p>","mnemonic":"20%引きを毎年繰り返すと83→69→57と目減りし、150万円の元手を引いても黒字『ご苦労(59)さん』の59百万円が残るaが正解。"},{"id":7,"year":2022,"period":"令和4年度春期","num":16,"cat":"ストラテジ系","field":"資材所要量計画","summary":"資材所要量計画：令和4年度春期 問16","correct":"イ","result":"","formula":"正味所要量＝総所要量－在庫残（総所要量は上位品目の正味所要量×員数を積み上げ）","howto":"A→B→D，A→C→Dの2経路の総所要量を足し，Dの在庫残を引く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>ある期間の生産計画において，表の部品表で表される製品Aの需要量が10個であるとき，部品Dの正味所要量は何個か。ここで，ユニットBの在庫残が5個，部品Dの在庫残が25個あり，他の在庫残，仕掛残，注文残，引当残などはないものとする。</p><table><tr><td colspan=\"2\">レベル0</td><td colspan=\"2\">レベル1</td><td colspan=\"2\">レベル2</td></tr><tr><td>品名</td><td>数量（個）</td><td>品名</td><td>数量（個）</td><td>品名</td><td>数量（個）</td></tr><tr><td rowspan=\"4\">製品A</td><td rowspan=\"4\">1</td><td rowspan=\"2\">ユニットB</td><td rowspan=\"2\">4</td><td>部品D</td><td>3</td></tr><tr><td>部品E</td><td>1</td></tr><tr><td rowspan=\"2\">ユニットC</td><td rowspan=\"2\">1</td><td>部品D</td><td>1</td></tr><tr><td>部品F</td><td>2</td></tr></table>","choices":[{"label":"ア","html":"80"},{"label":"イ","html":"90"},{"label":"ウ","html":"95"},{"label":"エ","html":"105"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>部品構成を積み上げて部品Dの総所要量を求める。</p><p>製品A需要10個→ユニットB総所要量＝10×4＝40個。ユニットBの在庫残5個を引くと，ユニットB正味所要量＝40－5＝35個。</p><p>製品A需要10個→ユニットC総所要量＝10×1＝10個（在庫残なしなので正味所要量もそのまま10個）。</p><p>部品Dの総所要量は，ユニットB経由：35×3＝105個，ユニットC経由：10×1＝10個，合計105＋10＝115個。</p><p>部品Dの在庫残25個を引くと，正味所要量＝115－25＝90個。したがって正解は「イ」。</p>","mnemonic":"Aが10台売れるとBは40個(在庫5引いて35)、Cは10個。Dは35×3＋10×1＝115個、在庫25引いて『くれ(90)』の90個に着地。"},{"id":8,"year":2022,"period":"令和4年度春期","num":20,"cat":"ストラテジ系","field":"キャッシュフロー計算書","summary":"キャッシュフロー計算書：令和4年度春期 問20","correct":"ウ","result":"","formula":"営業CF＝税引前利益＋減価償却費－売上債権増加＋棚卸資産減少＋仕入債務増加－法人税等支払額","howto":"108+42-60+30+40-62を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2022r04.html","q":"<p>キャッシュフロー計算書における，営業活動によるキャッシュフローは何万円か。</p><table><tr><td colspan=\"2\">単位　万円</td></tr><tr><td>税金等調整前当期純利益</td><td>108</td></tr><tr><td>減価償却費</td><td>42</td></tr><tr><td>売上債権の増加額</td><td>60</td></tr><tr><td>棚卸資産の減少額</td><td>30</td></tr><tr><td>仕入債務の増加額</td><td>40</td></tr><tr><td>法人税等の支払額</td><td>62</td></tr></table>","choices":[{"label":"ア","html":"14"},{"label":"イ","html":"74"},{"label":"ウ","html":"98"},{"label":"エ","html":"158"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>間接法によるキャッシュフロー計算書の営業活動によるキャッシュフローは，税金等調整前当期純利益を起点に非資金損益項目や運転資本の増減を加減し，最後に法人税等の支払額を差し引いて求める。</p><p>108（当期純利益）＋42（減価償却費）－60（売上債権の増加額）＋30（棚卸資産の減少額）＋40（仕入債務の増加額）－62（法人税等の支払額）</p><p>＝108＋42－60＋30＋40－62＝98（万円）。したがって正解は「ウ」。</p>","mnemonic":"純利益108に減価償却42を足し、売上債権60引いて棚卸30足し仕入債務40足し、最後に税金62引けば『クワッと(98)』98万円に着地。"},{"id":9,"year":2021,"period":"令和3年度春期","num":17,"cat":"ストラテジ系","field":"生産計画","summary":"生産計画：令和3年度春期 問17","correct":"イ","result":"","formula":"P8=S8+S9+S10+S11-I7（翌月末在庫=翌々月から3か月分の予想販売量，の条件から逆算）","howto":"I7=I6+P7-S7で7月末在庫を求め，I7+P8-S8=S9+S10+S11をP8について解く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ある会社の生産計画部では，毎月25日に次の手続で翌月分の計画生産量を決定している。8月分の計画生産量を求める式はどれか。</p><p>〔手続〕<br>(1) 当月末の予想在庫量を，前月末の実在庫量と当月分の計画生産量と予想販売量から求める。<br>(2) 当月末の予想在庫量と翌月分の予想販売量を基に，翌月末の予想在庫量が翌々月から3か月間の予想販売量と等しくなるように翌月分の計画生産量を決定する。</p><table><tr><td>I6</td><td>6月末実在庫量</td></tr><tr><td>I7</td><td>7月末予想在庫量</td><td>P7</td><td>7月分計画生産量</td><td>S7</td><td>7月分予想販売量</td></tr><tr><td>I8</td><td>8月末予想在庫量</td><td>P8</td><td>8月分計画生産量</td><td>S8</td><td>8月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S9</td><td>9月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S10</td><td>10月分予想販売量</td></tr><tr><td></td><td></td><td></td><td></td><td>S11</td><td>11月分予想販売量</td></tr></table><p>In：n月の月末在庫量　Pn：n月分の生産量　Sn：n月分の販売量</p>","choices":[{"label":"ア","html":"I6＋P7－S7＋S8"},{"label":"イ","html":"S8＋S9＋S10＋S11－I7"},{"label":"ウ","html":"S8＋S9＋S10＋S11－I8"},{"label":"エ","html":"S9＋S10＋S11－I7"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>7月末の予想在庫量I7は，手続(1)よりI7=I6+P7-S7で求められる（P7は既に決定済みの7月の計画生産量）。</p><p>手続(2)より，8月末の予想在庫量I8は，翌々月（9月）から3か月間（9,10,11月）の予想販売量の合計と等しくなるように決める。すなわちI8=S9+S10+S11。</p><p>一方，I8は手続(1)と同じ考え方でI8=I7+P8-S8とも表せる。両者を等置すると，I7+P8-S8=S9+S10+S11となり，P8について解くとP8=S8+S9+S10+S11-I7。</p><p>これは選択肢「イ」と一致する。</p>","mnemonic":"来月(8月)の生産量は、8〜11月の4か月分の販売予測を全部足して、すでに固まっている7月末在庫を引くだけ――イの式がその発想。"},{"id":10,"year":2019,"period":"令和元年度秋期","num":18,"cat":"ストラテジ系","field":"CVR・顧客獲得単価","summary":"CVR・顧客獲得単価：令和元年度秋期 問18","correct":"イ","result":"","formula":"CVR=購入者数÷クリック数，CAC=広告費用÷購入者数","howto":"広告A〜CそれぞれのCVRとCACを計算して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ECサイトが実施した3種類のバナー広告A〜Cについて，広告費用，バナー広告クリック数，各バナー広告からサイトにアクセスして商品を購入した人数は表のとおりである。コンバージョン率，顧客獲得単価（商品購入者数1人当たりの広告費用）の説明として正しいものはどれか。</p><table><tr><td></td><td>バナー広告A</td><td>バナー広告B</td><td>バナー広告C</td></tr><tr><td>広告費用（円）</td><td>150,000</td><td>750,000</td><td>1,000,000</td></tr><tr><td>バナー広告クリック数（サイトアクセス数）（回）</td><td>300</td><td>500</td><td>600</td></tr><tr><td>商品購入者数（人）</td><td>6</td><td>25</td><td>30</td></tr></table>","choices":[{"label":"ア","html":"バナー広告A〜Cのコンバージョン率は同一であるが，顧客獲得単価はバナー広告Aが最も安い。"},{"label":"イ","html":"バナー広告Aは，三つのバナー広告の中で，コンバージョン率が最も低く，顧客獲得単価は最も安い。"},{"label":"ウ","html":"バナー広告Bとバナー広告Cのコンバージョン率は同一であり，バナー広告Aとバナー広告Cの顧客獲得単価は同一である。"},{"label":"エ","html":"バナー広告Cは，三つのバナー広告の中で，顧客獲得単価が最も高く，コンバージョン率は最も低い。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各広告のコンバージョン率（CVR＝商品購入者数÷クリック数）と顧客獲得単価（CAC＝広告費用÷商品購入者数）を求める。</p><p>広告A：CVR＝6÷300＝2%，CAC＝150,000÷6＝25,000円</p><p>広告B：CVR＝25÷500＝5%，CAC＝750,000÷25＝30,000円</p><p>広告C：CVR＝30÷600＝5%，CAC＝1,000,000÷30≒33,333円</p><p>広告AはCVRが2%で三つの中で最も低く，CACも25,000円で三つの中で最も安い。したがって選択肢「イ」が正しい。アはCVRが同一でない時点で誤り，ウはCAC（A）25,000円とCAC（C）約33,333円が同一でないため誤り，エはCのCACは最高だがCVRは最低でない（Aが最低）ため誤り。</p>","mnemonic":"Aは300クリックで6人しか買わずCVR2%と最低だが、1人25,000円は三広告中いちばん安い――安物買いに見えて実は掘り出し物のイ。"},{"id":11,"year":2019,"period":"令和元年度秋期","num":21,"cat":"ストラテジ系","field":"線形計画法","summary":"線形計画法：令和元年度秋期 問21","correct":"ウ","result":"","formula":"目的関数Z=X+Yを制約3X+2Y≦120，X+2Y≦60の下で最大化（線形計画法）","howto":"制約式の交点の頂点を求め，各頂点のZ=X+Yを比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>製品X，Yを1台製造するのに必要な部品数は，表のとおりである。製品1台当たりの利益がX，Yともに1万円のとき，利益は最大何万円になるか。ここで，部品Aは120個，部品Bは60個まで使えるものとする。</p><table><tr><td rowspan=\"2\">部品</td><td colspan=\"2\">製品（単位 個）</td></tr><tr><td>X</td><td>Y</td></tr><tr><td>A</td><td>3</td><td>2</td></tr><tr><td>B</td><td>1</td><td>2</td></tr></table>","choices":[{"label":"ア","html":"30"},{"label":"イ","html":"40"},{"label":"ウ","html":"45"},{"label":"エ","html":"60"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>利益Z=X+Y（万円）を，制約条件 3X+2Y≦120（部品A），X+2Y≦60（部品B），X,Y≧0 の下で最大化する線形計画問題である。</p><p>2直線 3X+2Y=120 と X+2Y=60 の交点を求める。両式の差をとると 2X=60 よりX=30，これをX+2Y=60に代入してY=(60-30)/2=15。</p><p>この頂点での利益はZ=30+15=45（万円）。他の頂点（X=40,Y=0でZ=40／X=0,Y=30でZ=30／原点でZ=0）より大きいので，最大利益は45万円となる。したがって正解は「ウ」。</p>","mnemonic":"部品Aを3対2、部品Bを1対2で使い切るぎりぎりの配分はX30台・Y15台。足せば『良い子(45)』の45万円が利益の頂点になる。"},{"id":12,"year":2018,"period":"平成30年度秋期","num":21,"cat":"ストラテジ系","field":"在庫補充量","summary":"在庫補充量：平成30年度秋期 問21","correct":"ア","result":"","formula":"在庫補充量=翌週販売予測量×1.1－現在庫量、翌週販売予測量=(先週実績+今週実績)/2","howto":"(C[n-1]+C[n])/2で翌週予測を出し、安全在庫10%分を含めて1.1倍し、現在庫B[n]を引く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>X社では、(1)〜(4)に示す算定方式で在庫補充量を決定している。第n週の週末時点での在庫量をB[n]、第n週の販売量をC[n]としたとき、第n週の週末に発注する在庫補充量の算出式はどれか。ここで、nは3以上とする。</p><p>〔在庫補充量の算定方式〕</p><ol><li>週末ごとに在庫補充量を算出し、発注を行う。在庫は翌週の月曜日に補充される。</li><li>在庫補充量は、翌週の販売予測量から現在の在庫量を引き、安全在庫量を加えて算出する。</li><li>翌週の販売予測量は、先週の販売量と今週の販売量の平均値とする。</li><li>安全在庫量は、翌週の販売予測量の10%とする。</li></ol>","choices":[{"label":"ア","html":"(C[n-1]+C[n])/2×1.1－B[n]"},{"label":"イ","html":"(C[n-1]+C[n])/2×1.1－B[n-1]"},{"label":"ウ","html":"(C[n-1]+C[n])/2+C[n]×0.1－B[n]"},{"label":"エ","html":"(C[n-2]+C[n-1])/2+C[n]×0.1－B[n]"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>第n週の週末時点で、先週(n-1週)の販売量はC[n-1]、今週(n週)の販売量はC[n]である。</p><p>(3)より、翌週の販売予測量=(C[n-1]+C[n])/2</p><p>(4)より、安全在庫量=翌週の販売予測量の10%=(C[n-1]+C[n])/2×0.1</p><p>(2)より、在庫補充量=翌週の販売予測量－現在の在庫量(B[n])＋安全在庫量</p><p>=(C[n-1]+C[n])/2－B[n]+(C[n-1]+C[n])/2×0.1</p><p>=(C[n-1]+C[n])/2×(1+0.1)－B[n]</p><p>=(C[n-1]+C[n])/2×1.1－B[n]</p><p>よって正解はア。</p>","mnemonic":"「平均を1割増しにして、引くのは今のBだけ」―先週と今週の平均を1.1倍するのが安全在庫込みの発注量、差し引くBは必ず最新のB[n]。"},{"id":13,"year":2018,"period":"平成30年度秋期","num":22,"cat":"ストラテジ系","field":"連結総利益率","summary":"連結総利益率：平成30年度秋期 問22","correct":"ウ","result":"","formula":"連結売上高総利益率=連結売上総利益÷連結売上高×100、グループ内取引は売上高・売上原価の双方から相殺消去","howto":"A社総売上(4,000+800)とB社売上(1,000)を合算し内部取引800を売上高・売上原価の両方から消去、売上高5,000・原価3,000・利益2,000で40%","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>連結売上高総利益率は何%か。ここで、B社はA社の100%子会社で、仕入れは全て親会社からであり、売上は全て親会社以外である。また、期首、期末とも在庫はない。</p><table><tr><th colspan=\"2\">A社損益計算書</th></tr><tr><td>売上高</td><td>4,000</td></tr><tr><td>子会社売上高</td><td>800</td></tr><tr><td>売上原価</td><td>3,000</td></tr><tr><td>売上総利益</td><td>1,800</td></tr></table><table><tr><th colspan=\"2\">B社損益計算書</th></tr><tr><td>売上高</td><td>1,000</td></tr><tr><td>売上原価</td><td>800</td></tr><tr><td>売上総利益</td><td>200</td></tr></table>","choices":[{"label":"ア","html":"34"},{"label":"イ","html":"38"},{"label":"ウ","html":"40"},{"label":"エ","html":"56"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A社の売上高4,000は親会社以外(外部)への売上であり、子会社売上高800はB社への売上(グループ内取引)である。両者を合計したA社の総売上高は4,800となり、これから売上原価3,000を差し引くと売上総利益1,800となって表の数値と一致する。</p><p>B社は仕入れを全てA社から行っており(売上原価800はA社からの仕入高)、売上1,000は全て外部向けである。</p><p>連結上は、A社のB社向け売上(800)とB社の仕入(売上原価800)が企業集団内部の取引であるため、連結売上高・連結売上原価の双方から800ずつ相殺消去する。</p><p>連結売上高=A社総売上高4,800+B社売上高1,000－内部取引800=5,000</p><p>連結売上原価=A社売上原価3,000+B社売上原価800－内部取引800=3,000</p><p>連結売上総利益=5,000－3,000=2,000</p><p>連結売上高総利益率=2,000÷5,000×100=40%</p><p>よって正解はウ。</p>","mnemonic":"「ハッピャク(800)を売上からも原価からも消す」―親子間の800億円を両側から相殺すれば売上5,000・原価3,000・利益2,000で、きれいに40%そろう。"},{"id":14,"year":2017,"period":"平成29年度秋期","num":8,"cat":"ストラテジ系","field":"NPV法","summary":"NPV法：平成29年度秋期 問8","correct":"イ","result":"","formula":"NPV=Σ(各年の回収額÷(1+割引率)^年数)－投資額、NPVが最大のものを採用","howto":"回収額を割引率5%で現在価値に換算して合計し、投資額220を差し引いてNPVを比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>投資効果を正味現在価値法で評価するとき、最も投資効果が大きい(又は損失が小さい)シナリオはどれか。ここで、期間は3年間、割引率は5%とし、各シナリオのキャッシュフローは表のとおりとする。</p><table><tr><td>シナリオ</td><td>投資額</td><td>1年目</td><td>2年目</td><td>3年目</td></tr><tr><td>A</td><td>220</td><td>40</td><td>80</td><td>120</td></tr><tr><td>B</td><td>220</td><td>120</td><td>80</td><td>40</td></tr><tr><td>C</td><td>220</td><td>80</td><td>80</td><td>80</td></tr><tr><td>投資をしない</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table><p>(単位 万円、1年目〜3年目は回収額)</p>","choices":[{"label":"ア","html":"A"},{"label":"イ","html":"B"},{"label":"ウ","html":"C"},{"label":"エ","html":"投資をしない"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>割引率5%での現価係数は、1年目1/1.05≒0.9524、2年目1/1.05²≒0.9070、3年目1/1.05³≒0.8638である。各シナリオの回収額の現在価値合計から投資額220を差し引き、NPVを求める。</p><p>A: 40×0.9524+80×0.9070+120×0.8638≒38.1+72.6+103.7=214.3 → NPV=214.3－220=－5.7</p><p>B: 120×0.9524+80×0.9070+40×0.8638≒114.3+72.6+34.6=221.4 → NPV=221.4－220=＋1.4</p><p>C: 80×0.9524+80×0.9070+80×0.8638≒76.2+72.6+69.1=217.9 → NPV=217.9－220=－2.1</p><p>投資をしない場合のNPV=0</p><p>4者のうちNPVが最大となるのはB(約+1.4)であり、唯一プラスのNPVを示す。よって投資効果が最も大きいのはB、正解はイ。</p>","mnemonic":"「早稼ぎは目減りしにくい」―Bは初年度に120稼ぐので割引の影響が小さく、唯一NPVがプラス(+1.4)になって逆転勝ちする。"},{"id":15,"year":2017,"period":"平成29年度秋期","num":20,"cat":"ストラテジ系","field":"線形計画法","summary":"線形計画法：平成29年度秋期 問20","correct":"ウ","result":"","formula":"線形計画法: 制約条件の交点(頂点)で目的関数(利益)を最大化する","howto":"3x+2y≤120とx+2y≤60を連立して交点(x=30,y=15)を求め、利益x+yを計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>製品X,Yを1台製造するのに必要な部品数は、表のとおりである。製品1台当たりの利益がX,Yともに1万円のとき、利益は最大何万円になるか。ここで、部品Aは120個、部品Bは60個まで使えるものとする。</p><table><tr><td>部品＼製品</td><td>X</td><td>Y</td></tr><tr><td>A</td><td>3</td><td>2</td></tr><tr><td>B</td><td>1</td><td>2</td></tr></table><p>(単位 個)</p>","choices":[{"label":"ア","html":"30"},{"label":"イ","html":"40"},{"label":"ウ","html":"45"},{"label":"エ","html":"60"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Xの製造台数をx、製品Yの製造台数をyとする。部品の制約条件は次のとおり。</p><p>部品A: 3x+2y≤120</p><p>部品B: x+2y≤60</p><p>目的関数(利益、1台当たり共に1万円)は、利益=x+yを最大化する。線形計画法では、実行可能領域の頂点のいずれかで目的関数が最大になる。二つの制約式を等号で連立させる。</p><p>3x+2y=120 …①</p><p>x+2y=60 …②</p><p>①－②: 2x=60 → x=30、②へ代入: 30+2y=60 → y=15</p><p>この頂点(x=30,y=15)での利益=x+y=30+15=45万円。他の頂点であるx=40,y=0(部品Bに余裕あり)では利益40万円、x=0,y=30では利益30万円であり、いずれも45万円より小さい。よって最大利益は45万円、正解はウ。</p>","mnemonic":"「サンマル・イチゴ」でぴったり―X30台・Y15台なら部品AもBも使い切り、利益は語呂よく45万円がてっぺん。"},{"id":16,"year":2017,"period":"平成29年度秋期","num":22,"cat":"ストラテジ系","field":"営業利益","summary":"営業利益：平成29年度秋期 問22","correct":"イ","result":"","formula":"営業利益=売上高－売上原価－販管費(営業外損益は含めない)","howto":"1,500－1,000－200=300。営業外収益40・営業外費用30は経常利益の算定要素なので無視する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fqpm-att/2017h29a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2017h29.html","q":"<p>期末の決算において、表の損益計算資料が得られた。当期の営業利益は何百万円か。</p><table><tr><td>項目</td><td>金額</td></tr><tr><td>売上高</td><td>1,500</td></tr><tr><td>売上原価</td><td>1,000</td></tr><tr><td>販売費及び一般管理費</td><td>200</td></tr><tr><td>営業外収益</td><td>40</td></tr><tr><td>営業外費用</td><td>30</td></tr></table><p>(単位 百万円)</p>","choices":[{"label":"ア","html":"270"},{"label":"イ","html":"300"},{"label":"ウ","html":"310"},{"label":"エ","html":"500"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>営業利益は、売上高から売上原価と販売費及び一般管理費を差し引いて求める。営業外収益・営業外費用は、営業利益に加減して経常利益を求める際に使う項目であり、営業利益そのものの計算には含めない。</p><p>売上総利益=売上高1,500－売上原価1,000=500</p><p>営業利益=売上総利益500－販売費及び一般管理費200=300</p><p>よって当期の営業利益は300百万円、正解はイ。</p>","mnemonic":"「営業外は蚊帳の外」―1500から原価1000と販管費200だけ引けば300、40や30の営業外項目には惑わされない。"},{"id":17,"year":2016,"period":"平成28年度秋期","num":4,"cat":"ストラテジ系","field":"PBP(回収期間)","summary":"PBP(回収期間)：平成28年度秋期 問4","correct":"エ","result":"","formula":"PBP=投資回収に要する年数(短いほど投資効果が高い)","howto":"各年のキャッシュインを累積し、投資額500に達するまでの年数を4シナリオで比較、最短のものを選ぶ","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>IT投資案件において、投資効果をPBP(Pay Back Period)で評価する。投資額が500のとき、期待できるキャッシュインの四つのシナリオa〜dのうち、PBPの効果が最も高いものはどれか。</p><table><tr><td></td><td>年目</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><td>a</td><td>キャッシュイン</td><td>100</td><td>150</td><td>200</td><td>250</td><td>300</td></tr><tr><td>b</td><td>キャッシュイン</td><td>100</td><td>200</td><td>300</td><td>200</td><td>100</td></tr><tr><td>c</td><td>キャッシュイン</td><td>200</td><td>150</td><td>100</td><td>150</td><td>200</td></tr><tr><td>d</td><td>キャッシュイン</td><td>300</td><td>200</td><td>100</td><td>50</td><td>50</td></tr></table>","choices":[{"label":"ア","html":"a"},{"label":"イ","html":"b"},{"label":"ウ","html":"c"},{"label":"エ","html":"d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>投資額500に対する各シナリオの累積キャッシュインを計算する。</p><table><tr><td>シナリオ</td><td>1年目</td><td>2年目</td><td>3年目</td><td>4年目</td><td>5年目</td></tr><tr><td>a(累計)</td><td>100</td><td>250</td><td>450</td><td>700</td><td>950</td></tr><tr><td>b(累計)</td><td>100</td><td>300</td><td>600</td><td>800</td><td>900</td></tr><tr><td>c(累計)</td><td>200</td><td>350</td><td>450</td><td>600</td><td>800</td></tr><tr><td>d(累計)</td><td>300</td><td>500</td><td>600</td><td>650</td><td>700</td></tr></table><p>dは2年目の累計キャッシュインがちょうど500に達し、投資額を最短の2.0年で回収できる。aは3年目450・4年目で50/250=0.2年分を要し約3.2年、bは2年目300・3年目で200/300=0.67年分を要し約2.67年、cは3年目450・4年目で50/150=0.33年分を要し約3.33年となり、いずれもdより回収期間が長い。PBPは短いほど投資効果が高いと評価されるため、最も効果が高いのはdである。よって正解はエ。</p>","mnemonic":"「初年度300+2年目200でジャスト500」―dだけ頭金を厚くして2.0年でゴール、他は3年目以降までかかりPBPで完敗。"},{"id":18,"year":2016,"period":"平成28年度秋期","num":22,"cat":"ストラテジ系","field":"連結売上高","summary":"連結売上高：平成28年度秋期 問22","correct":"ア","result":"","formula":"連結売上高=連結対象各社の売上高合計－グループ内取引高(支配力のない出資先は連結対象外)","howto":"80%・60%保有は子会社化で連結対象、役員派遣もない20%保有のD社は連結対象外。親子間取引のみ相殺消去する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_st_am2_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>次の条件においてA社の連結損益計算書を作成した場合の連結売上高は何億円か。</p><p>〔条件〕</p><ul><li>A社は、B社の株式の80%を取得している。</li><li>B社は、C社の株式の60%を取得している。</li><li>B社は、D社の株式の20%を取得している。ただし、役員の派遣などはない。</li><li>A社の売上高は、7,000億円であり、その10%は、B社に対するものである。</li><li>B社の売上高は、3,500億円であり、その20%は、D社に対するものである。</li><li>C社の売上高は、2,500億円である。</li><li>D社の売上高は、2,000億円である。</li><li>A社とB社、B社とD社以外の相互間取引はない。</li></ul>","choices":[{"label":"ア","html":"12,300"},{"label":"イ","html":"13,000"},{"label":"ウ","html":"13,600"},{"label":"エ","html":"14,300"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>連結の範囲を判定する。A社はB社株式の80%を保有し支配関係があるため、B社は連結子会社となる。B社はC社株式の60%を保有しており、C社も間接的にA社グループの連結子会社となる。一方、B社のD社への出資比率は20%で役員派遣などの支配の実態もないため、D社は連結の範囲に含めない。</p><p>連結売上高は、連結対象となるA社・B社・C社の売上高を合算し、グループ内取引(A社→B社の売上)のみを相殺消去して求める。B社→D社の売上は、D社が連結対象外であるため外部売上として扱い、相殺しない。</p><p>A社売上高7,000億円のうちB社向けは7,000×10%=700億円。</p><p>連結売上高=7,000(A社)+3,500(B社)+2,500(C社)－700(A社→B社の内部取引消去)=12,300億円</p><p>よって正解はア。</p>","mnemonic":"「ナナセン・サンゴー・ニゴーを足して700だけ引く」―7,000+3,500+2,500からA→B向け10%の700億だけ消せば12,300、Dは20%でも仲間外れ。"}]</script>
<script>
(function(){
"use strict";
var QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
var CATS = Array.from(new Set(QUESTIONS.map(function(q){return q.cat}))).sort();
var CAT_CLASS = {"テクノロジ系":"cat-tech","マネジメント系":"cat-mgmt","ストラテジ系":"cat-strat"};
var FIELDS = Array.from(new Set(QUESTIONS.map(function(q){return q.field}))).sort();
var YEARS = Array.from(new Set(QUESTIONS.map(function(q){return q.year}))).sort();

var STORE_KEY = 'stcalc_progress_v1';
var state = loadState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(!s.checks) s.checks = {};
      // migrate from the old single-flag "あやふや" toggle, if present
      if(s.unsure){
        Object.keys(s.unsure).forEach(function(id){
          if(s.unsure[id] && !s.checks[id]) s.checks[id] = 'yellow';
        });
        delete s.unsure;
      }
      if(!s.answers) s.answers = {};
      return s;
    }
  }catch(e){}
  return {answers:{}, checks:{}};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var filter = {cats:new Set(), fields:new Set(), years:new Set(), checks:new Set()};
var queue = [];      // array of question ids for current session
var qPos = 0;        // index into queue
var answeredThisQ = false;
var pickedLabel = null;

// ---------- auto-review mode ----------
var AUTO_KEY = 'stcalc_auto_mode';
var AUTO_SEC_KEY = 'stcalc_auto_seconds';
var AUTO_SEC_OPTIONS = [2, 3, 5, 8, 15];
var autoMode = false;
var autoSeconds = 15;
try{
  autoMode = localStorage.getItem(AUTO_KEY) === '1';
  var savedSec = parseInt(localStorage.getItem(AUTO_SEC_KEY) || '15', 10);
  if(savedSec > 0) autoSeconds = savedSec;
}catch(e){}
var autoTimeoutHandle = null;

function renderAutoUI(){
  document.getElementById('autoOffChip').classList.toggle('active', !autoMode);
  document.getElementById('autoOnChip').classList.toggle('active', autoMode);
  document.getElementById('autoSecRow').style.display = autoMode ? 'block' : 'none';
  var wrap = document.getElementById('autoSecChips');
  wrap.innerHTML = '';
  AUTO_SEC_OPTIONS.forEach(function(s){
    wrap.appendChild(chip(s+'秒', s===autoSeconds, function(){
      autoSeconds = s;
      try{ localStorage.setItem(AUTO_SEC_KEY, String(s)); }catch(e){}
      renderAutoUI();
    }));
  });
}
document.getElementById('autoOffChip').addEventListener('click', function(){
  autoMode = false;
  try{ localStorage.setItem(AUTO_KEY, '0'); }catch(e){}
  renderAutoUI();
});
document.getElementById('autoOnChip').addEventListener('click', function(){
  autoMode = true;
  try{ localStorage.setItem(AUTO_KEY, '1'); }catch(e){}
  renderAutoUI();
});

function clearAutoTimer(){
  if(autoTimeoutHandle){ window.clearTimeout(autoTimeoutHandle); autoTimeoutHandle = null; }
  var bar = document.getElementById('autoBar');
  if(bar) bar.style.display = 'none';
  var fill = document.getElementById('autoBarFill');
  if(fill){ fill.style.transition = 'none'; fill.style.width = '0%'; fill.classList.remove('advancing'); }
}
function startAutoBar(seconds, label, advancing, onDone){
  var bar = document.getElementById('autoBar');
  var fill = document.getElementById('autoBarFill');
  var lbl = document.getElementById('autoBarLabel');
  lbl.textContent = label;
  fill.classList.toggle('advancing', !!advancing);
  bar.style.display = 'block';
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth;
  fill.style.transition = 'width ' + seconds + 's linear';
  fill.style.width = '100%';
  autoTimeoutHandle = window.setTimeout(function(){
    autoTimeoutHandle = null;
    onDone();
  }, seconds * 1000);
}

var views = {};
['dash','quiz','jump','done'].forEach(function(v){ views[v]=document.getElementById('view-'+v); });
function showView(name){
  Object.keys(views).forEach(function(k){ views[k].classList.toggle('active', k===name); });
  window.scrollTo(0,0);
}

// ---------- theme toggle ----------
var THEME_KEY='stcalc_theme';
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
(function(){ try{ var t=localStorage.getItem(THEME_KEY); if(t) applyTheme(t); }catch(e){} })();
document.getElementById('themeToggle').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  applyTheme(next);
  try{ if(next) localStorage.setItem(THEME_KEY,next); else localStorage.removeItem(THEME_KEY); }catch(e){}
});

// ---------- sound ----------
var SOUND_KEY='stcalc_sound_muted';
var soundMuted = false;
try{ soundMuted = localStorage.getItem(SOUND_KEY)==='1'; }catch(e){}
var soundBtn = document.getElementById('soundToggle');
function renderSoundBtn(){ soundBtn.textContent = soundMuted ? '🔇' : '🔊'; }
renderSoundBtn();

var audioCtx = null;
function getCtx(){
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
  }catch(e){}
  return audioCtx;
}
function tone(ctx, t0, freq, dur, type, peak){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak||0.18, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.02);
  return osc;
}
function playTones(specs){
  try{
    var ctx = getCtx();
    if(!ctx) return;
    var fire = function(){
      try{
        var t0 = ctx.currentTime;
        specs.forEach(function(s){ tone(ctx, t0+s.at, s.freq, s.dur, s.type, s.peak); });
      }catch(e){}
    };
    if(ctx.state === 'suspended'){ ctx.resume().then(fire, fire); }
    else { fire(); }
  }catch(e){}
}
function playCorrectSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:880,    dur:0.16, type:'sine', peak:0.24},
    {at:0.1,  freq:1318.5, dur:0.26, type:'sine', peak:0.24}
  ]);
}
function playWrongSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:220,   dur:0.3,  type:'sawtooth', peak:0.16},
    {at:0.06, freq:174.6, dur:0.34, type:'sawtooth', peak:0.15}
  ]);
}
// unlock audio context on first touch/click anywhere (iOS requirement)
function unlockAudio(){
  var ctx = getCtx();
  if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
}
document.addEventListener('touchend', function once(){ unlockAudio(); document.removeEventListener('touchend', once); }, {once:true});
document.addEventListener('click', function once(){ unlockAudio(); document.removeEventListener('click', once); }, {once:true});

soundBtn.addEventListener('click', function(){
  soundMuted = !soundMuted;
  renderSoundBtn();
  try{ localStorage.setItem(SOUND_KEY, soundMuted?'1':'0'); }catch(e){}
  if(!soundMuted){ getCtx(); playCorrectSound(); }
});

// ---------- big stamp ----------
function flashBigStamp(correct){
  var el = document.getElementById('bigStamp');
  el.className = correct ? '' : 'wrong';
  el.innerHTML = correct
    ? '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20"></circle></svg>'
    : '<svg viewBox="0 0 52 52"><path d="M14 14 L38 38 M38 14 L14 38"></path></svg>';
  // force reflow so re-adding the class restarts the animation
  void el.offsetWidth;
  el.className = (correct ? '' : 'wrong ') + 'show';
  window.setTimeout(function(){ el.className = correct ? '' : 'wrong'; }, 950);
}

// ---------- stats ----------
function computeStats(){
  var answered=0, correct=0, wrong=0, checked=0;
  QUESTIONS.forEach(function(q){
    var a = state.answers[q.id];
    if(a){ answered++; if(a.correct) correct++; else wrong++; }
    if(state.checks[q.id]) checked++;
  });
  return {answered:answered, correct:correct, wrong:wrong, checked:checked, fresh:QUESTIONS.length-answered};
}
function idsWrong(){ return QUESTIONS.filter(function(q){var a=state.answers[q.id]; return a && !a.correct}).map(function(q){return q.id}); }
function idsChecked(){ return QUESTIONS.filter(function(q){return !!state.checks[q.id]}).map(function(q){return q.id}); }
function idsByCheck(color){ return QUESTIONS.filter(function(q){return state.checks[q.id]===color}).map(function(q){return q.id}); }
function idsFresh(){ return QUESTIONS.filter(function(q){return !state.answers[q.id]}).map(function(q){return q.id}); }

function renderDash(){
  var s = computeStats();
  document.getElementById('statAnswered').textContent = s.answered;
  document.getElementById('statTotal').textContent = QUESTIONS.length;
  document.getElementById('statCorrect').textContent = s.correct;
  document.getElementById('statWrong').textContent = s.wrong;
  document.getElementById('statChecked').textContent = s.checked;
  document.getElementById('statFresh').textContent = s.fresh;
  var pct = s.answered ? Math.round(s.correct/s.answered*100) : null;
  document.getElementById('pctText').textContent = pct===null ? '–' : pct+'%';
  var circumference = 2*Math.PI*50;
  var ring = document.getElementById('ringFill');
  ring.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ring.style.strokeDashoffset = (circumference - (pct||0)/100*circumference).toFixed(1);

  document.getElementById('mcAll').textContent = QUESTIONS.length;
  var w = idsWrong().length, c = idsChecked().length, f = idsFresh().length;
  document.getElementById('mcWrong').textContent = w;
  document.getElementById('mcChecked').textContent = c;
  document.getElementById('mcFresh').textContent = f;
  document.getElementById('cardWrong').disabled = w===0;
  document.getElementById('cardChecked').disabled = c===0;
  document.getElementById('cardFresh').disabled = f===0;

  renderFilterCount();
}

function chip(label, active, onclick, extraClass){
  var b = document.createElement('button');
  b.className = 'chip'+(extraClass?' '+extraClass:'')+(active?' active':'');
  b.textContent = label;
  b.addEventListener('click', onclick);
  return b;
}
var CHECK_DEFS = [
  {key:'green', label:'🟢 わかる', cls:'chip-green'},
  {key:'yellow', label:'🟡 あやふや', cls:'chip-yellow'},
  {key:'red', label:'🔴 わからない', cls:'chip-red'}
];
function renderCheckBadge(id){
  var badges = document.getElementById('qBadges');
  var existing = badges.querySelector('[data-check-badge]');
  if(existing) existing.remove();
  var color = state.checks[id];
  if(color){
    var cDef = CHECK_DEFS.filter(function(d){return d.key===color})[0];
    var b = document.createElement('span');
    b.className = 'badge check-'+color;
    b.setAttribute('data-check-badge', '1');
    b.textContent = cDef ? cDef.label : color;
    badges.appendChild(b);
  }
}
function renderChips(){
  var checkWrap = document.getElementById('checkChips'); checkWrap.innerHTML='';
  CHECK_DEFS.forEach(function(cd){
    checkWrap.appendChild(chip(cd.label, filter.checks.has(cd.key), function(){
      if(filter.checks.has(cd.key)) filter.checks.delete(cd.key); else filter.checks.add(cd.key);
      renderChips(); renderFilterCount();
    }, cd.cls));
  });
  var catWrap = document.getElementById('catChips'); catWrap.innerHTML='';
  CATS.forEach(function(c){
    catWrap.appendChild(chip(c, filter.cats.has(c), function(){
      if(filter.cats.has(c)) filter.cats.delete(c); else filter.cats.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var fWrap = document.getElementById('fieldChips'); fWrap.innerHTML='';
  FIELDS.forEach(function(c){
    fWrap.appendChild(chip(c, filter.fields.has(c), function(){
      if(filter.fields.has(c)) filter.fields.delete(c); else filter.fields.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var yWrap = document.getElementById('yearChips'); yWrap.innerHTML='';
  YEARS.forEach(function(y){
    yWrap.appendChild(chip(y+'年', filter.years.has(y), function(){
      if(filter.years.has(y)) filter.years.delete(y); else filter.years.add(y);
      renderChips(); renderFilterCount();
    }));
  });
}
function filteredIds(baseIds){
  return baseIds.filter(function(id){
    var q = QUESTIONS[id];
    if(filter.cats.size && !filter.cats.has(q.cat)) return false;
    if(filter.fields.size && !filter.fields.has(q.field)) return false;
    if(filter.years.size && !filter.years.has(q.year)) return false;
    if(filter.checks.size && !filter.checks.has(state.checks[id])) return false;
    return true;
  });
}
function hasActiveFilter(){
  return filter.cats.size || filter.fields.size || filter.years.size || filter.checks.size;
}
function renderFilterCount(){
  var all = QUESTIONS.map(function(q){return q.id});
  var n = filteredIds(all).length;
  document.getElementById('filterCount').textContent = hasActiveFilter() ? n+'問が条件に一致' : '';
  document.getElementById('startBtn').disabled = n===0;
}

document.querySelectorAll('.mode-card').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.disabled) return;
    startSession(btn.getAttribute('data-mode'));
  });
});
document.getElementById('startBtn').addEventListener('click', function(){ startSession('filter'); });

function startSession(mode){
  var ids;
  var all = QUESTIONS.map(function(q){return q.id});
  if(mode==='all') ids = all;
  else if(mode==='wrong') ids = idsWrong();
  else if(mode==='checked') ids = idsChecked();
  else if(mode==='fresh') ids = idsFresh();
  else ids = filteredIds(all);
  if(mode!=='filter' && hasActiveFilter()) ids = filteredIds(ids);
  if(!ids.length) return;
  queue = ids;
  qPos = 0;
  showView('quiz');
  renderQuestion();
}

document.getElementById('resetBtn').addEventListener('click', function(){
  if(confirm('すべての回答履歴（正誤・チェック）を削除します。よろしいですか？')){
    state = {answers:{}, checks:{}};
    saveState();
    renderDash();
  }
});

// ---------- quiz rendering ----------
function q(){ return QUESTIONS[queue[qPos]]; }

function renderQuestion(){
  clearAutoTimer();
  var cur = q();
  answeredThisQ = false;
  pickedLabel = null;

  document.getElementById('quizCounter').textContent = (qPos+1)+' / '+queue.length;
  document.getElementById('quizProgress').style.width = ((qPos)/queue.length*100)+'%';

  var badges = document.getElementById('qBadges');
  badges.innerHTML = '';
  var catB = document.createElement('span');
  catB.className = 'badge '+CAT_CLASS[cur.cat];
  catB.textContent = cur.cat;
  badges.appendChild(catB);
  var metaB = document.createElement('span');
  metaB.className = 'badge meta';
  metaB.textContent = cur.period+' 問'+cur.num;
  badges.appendChild(metaB);
  var fieldB = document.createElement('span');
  fieldB.className = 'badge meta';
  fieldB.textContent = cur.field;
  badges.appendChild(fieldB);
  renderCheckBadge(cur.id);

  document.getElementById('qText').innerHTML = cur.q;

  buildChoices(cur);

  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('nextBtn').textContent = '回答して確認';
  document.getElementById('nextBtn').disabled = true;

  document.querySelectorAll('.check-dot').forEach(function(d){
    d.classList.toggle('active', d.getAttribute('data-check')===state.checks[cur.id]);
  });

  document.getElementById('prevBtn').style.visibility = qPos>0 ? 'visible' : 'hidden';

  // if already answered before, restore
  var prev = state.answers[cur.id];
  if(prev){
    pickedLabel = prev.picked;
    revealAnswer(cur, false);
  } else if(autoMode){
    startAutoBar(autoSeconds, '⏱ '+autoSeconds+'秒以内に回答（自動モード）', false, function(){
      autoTimeoutAnswer(cur);
    });
  }
}

function autoTimeoutAnswer(cur){
  if(answeredThisQ) return;
  state.answers[cur.id] = {picked: null, correct: false, ts: Date.now(), timeout: true};
  saveState();
  revealAnswer(cur, true);
}

function buildChoices(cur){
  var wrap = document.getElementById('choicesWrap');
  wrap.innerHTML = '';
  wrap.classList.remove('answered');
  if(cur.shared){
    var block = document.createElement('div');
    block.className = 'shared-block';
    block.innerHTML = cur.shared;
    wrap.appendChild(block);
    var row = document.createElement('div');
    row.className = 'label-row';
    row.id = 'labelRow';
    cur.labels.forEach(function(lab){
      var b = document.createElement('button');
      b.className = 'label-btn';
      b.textContent = lab;
      b.dataset.label = lab;
      b.addEventListener('click', function(){ selectAnswer(cur, lab); });
      row.appendChild(b);
    });
    wrap.appendChild(row);
  } else {
    var list = document.createElement('div');
    list.className = 'choices';
    list.id = 'choiceList';
    cur.choices.forEach(function(c){
      var item = document.createElement('button');
      item.className = 'choice-item';
      item.dataset.label = c.label;
      item.innerHTML = '<span class="clabel">'+c.label+'</span><span class="ctext">'+c.html+'</span>';
      item.addEventListener('click', function(){ selectAnswer(cur, c.label); });
      list.appendChild(item);
    });
    wrap.appendChild(list);
  }
}

function selectAnswer(cur, label){
  if(answeredThisQ) return;
  pickedLabel = label;
  markPicked(label);
  if(autoMode){
    clearAutoTimer();
    commitAnswer();
  } else {
    document.getElementById('nextBtn').disabled = false;
  }
}

function markPicked(label){
  document.querySelectorAll('.choice-item, .label-btn').forEach(function(el){
    el.classList.toggle('picked', el.dataset.label===label);
  });
}

function commitAnswer(){
  var cur = q();
  if(!pickedLabel) return;
  var correct = pickedLabel === cur.correct;
  state.answers[cur.id] = {picked: pickedLabel, correct: correct, ts: Date.now()};
  saveState();
  revealAnswer(cur, true);
}

function revealAnswer(cur, animate){
  answeredThisQ = true;
  var saved = state.answers[cur.id];
  var picked = saved.picked;
  var correct = saved.correct;

  document.getElementById('choicesWrap').classList.add('answered');
  document.querySelectorAll('.choice-item, .label-btn').forEach(function(el){
    var lab = el.dataset.label;
    el.classList.remove('picked');
    if(lab===cur.correct) el.classList.add('correct-answer');
    if(lab===picked && !correct) el.classList.add('wrong-pick');
  });

  var panel = document.getElementById('resultPanel');
  panel.style.display = 'block';

  var stampIcon = document.getElementById('stampIcon');
  var stampText = document.getElementById('stampText');
  stampIcon.className = 'stamp'+(correct?'':' wrong');
  stampIcon.innerHTML = correct
    ? '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20"></circle></svg>'
    : '<svg viewBox="0 0 52 52"><path d="M14 14 L38 38 M38 14 L14 38"></path></svg>';
  if(!animate){ stampIcon.querySelectorAll('circle,path').forEach(function(el){ el.style.animation='none'; el.style.strokeDashoffset='0'; }); }
  stampText.className = 'stamp-text '+(correct?'ok':'ng');
  var resultLabel = saved.timeout ? '時間切れ' : (correct ? '正解' : '不正解');
  var resultDetail = saved.timeout
    ? '正解は「'+cur.correct+'」でした（未回答）'
    : '正解は「'+cur.correct+'」・あなたの回答は「'+picked+'」';
  stampText.innerHTML = '<b>'+resultLabel+'</b><div>'+resultDetail+'</div>';

  if(animate){
    flashBigStamp(correct);
    if(correct) playCorrectSound(); else playWrongSound();
  }

  var answerReveal = document.getElementById('answerReveal');
  if(cur.mnemonic){
    answerReveal.style.display = 'flex';
    document.getElementById('arLetter').textContent = cur.correct;
    document.getElementById('arMnemonic').textContent = cur.mnemonic;
  } else {
    answerReveal.style.display = 'none';
  }

  var tipBox = document.getElementById('tipBox');
  if(cur.formula || cur.howto){
    tipBox.style.display = 'block';
    document.getElementById('tipFormula').textContent = cur.formula || '';
    document.getElementById('tipHowto').textContent = cur.howto || '';
  } else {
    tipBox.style.display = 'none';
  }

  document.getElementById('explBody').innerHTML = cur.expl || '（解説準備中）';
  document.getElementById('origLink').href = cur.url;
  document.getElementById('ipaLink').href = cur.ipaUrl;

  var nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  var isLast = (qPos === queue.length-1);
  nextBtn.textContent = isLast ? '結果を見る' : '次の問題 →';

  // auto mode only times the "answer within N seconds" phase; once it's
  // revealed (answered or timed out) the user taps next whenever ready.
  if(animate){
    clearAutoTimer();
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.setTimeout(function(){
      try{ panel.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest'}); }catch(e){}
    }, 30);
  }
}

function advanceNext(){
  clearAutoTimer();
  if(qPos < queue.length-1){ qPos++; renderQuestion(); }
  else { finishSession(); }
}

document.getElementById('nextBtn').addEventListener('click', function(){
  if(!answeredThisQ){ commitAnswer(); return; }
  advanceNext();
});
document.getElementById('prevBtn').addEventListener('click', function(){
  clearAutoTimer();
  if(qPos>0){ qPos--; renderQuestion(); }
});
document.getElementById('checkRow').addEventListener('click', function(e){
  var btn = e.target.closest('.check-dot');
  if(!btn) return;
  var cur = q();
  var color = btn.getAttribute('data-check');
  if(state.checks[cur.id] === color) delete state.checks[cur.id];
  else state.checks[cur.id] = color;
  saveState();
  document.querySelectorAll('.check-dot').forEach(function(d){
    d.classList.toggle('active', d.getAttribute('data-check')===state.checks[cur.id]);
  });
  renderCheckBadge(cur.id);
});
document.getElementById('quizHome').addEventListener('click', function(){ clearAutoTimer(); renderDash(); showView('dash'); });

function finishSession(){
  clearAutoTimer();
  var correctCount = queue.filter(function(id){ var a=state.answers[id]; return a && a.correct; }).length;
  document.getElementById('doneDesc').textContent = queue.length+'問中 '+correctCount+'問正解でした。';
  renderDash();
  showView('done');
}
document.getElementById('doneHomeBtn').addEventListener('click', function(){ showView('dash'); });

// ---------- jump list ----------
document.getElementById('jumpBtn').addEventListener('click', function(){
  clearAutoTimer();
  renderJump();
  showView('jump');
});
document.getElementById('jumpClose').addEventListener('click', function(){ showView('quiz'); });
function renderJump(){
  document.getElementById('jumpSub').textContent = queue.length+'問中 '+(qPos+1)+'問目';
  var grid = document.getElementById('jumpGrid');
  grid.innerHTML = '';
  queue.forEach(function(id, i){
    var qq = QUESTIONS[id];
    var a = state.answers[id];
    var cell = document.createElement('button');
    cell.className = 'jump-cell';
    if(i===qPos) cell.classList.add('current');
    if(a) cell.classList.add(a.correct ? 'correct' : 'wrong');
    if(state.checks[id]) cell.classList.add('check-'+state.checks[id]);
    cell.textContent = i+1;
    cell.title = qq.period+' 問'+qq.num;
    cell.addEventListener('click', function(){ qPos = i; renderQuestion(); showView('quiz'); });
    grid.appendChild(cell);
  });
}

// ---------- init ----------
renderChips();
renderAutoUI();
renderDash();
})();
</script>
