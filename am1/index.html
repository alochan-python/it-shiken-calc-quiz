，及びルールから成るソフトウェア開発のフレームワークである。"},{"label":"エ","html":"モデルの全体像を作成した上で，優先度を付けた詳細なフィーチャリストを作成し，フィーチャを単位として計画し，フィーチャ単位に設計と構築を繰り返す。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スクラムは、プロダクトオーナー・スクラムマスター・開発者という役割(ロール)、スプリントプランニングやスプリントレビュー、デイリースクラムなどのイベント、プロダクトバックログやスプリントバックログといった作成物、及びそれらを運用するためのルールから構成される、軽量なソフトウェア開発フレームワークである。ウの記述はこの構成要素を正確に表しており正解となる。</p><p>アはエクストリームプログラミング(XP)の説明であり、5つの価値(コミュニケーション・シンプル・フィードバック・勇気・尊重)やテスト駆動開発、ペアプログラミングはXP特有のプラクティスである。イは適応型ソフトウェア開発(ASD)の「推測・協調・学習」というライフサイクルの説明であり、エはフィーチャ駆動開発(FDD)における、フィーチャ単位の反復開発の説明であって、いずれもスクラムの説明ではない。</p>","mnemonic":""},{"id":317,"year":2020,"period":"令和2年度10月","num":18,"cat":"マネジメント系","field":"プロジェクト管理(EVM)","summary":"プロジェクト管理(EVM)：令和2年度10月 問18","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>プロジェクトマネジメントにおいてパフォーマンス測定に使用するEVMの管理対象の組みはどれか。</p>","choices":[{"label":"ア","html":"コスト，スケジュール"},{"label":"イ","html":"コスト，リスク"},{"label":"ウ","html":"スケジュール，品質"},{"label":"エ","html":"品質，リスク"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EVM(アーンドバリューマネジメント)は、計画価値(PV)・出来高(EV)・実コスト(AC)という3つの指標を用いて、プロジェクトの進捗(スケジュール)とコストの両方のパフォーマンスを定量的・統合的に測定・管理する手法である。SPI(スケジュール効率指数)やCPI(コスト効率指数)が代表的な指標であり、管理対象はコストとスケジュールの組みであるため、正解はア。</p><p>EVMはあくまでコストとスケジュールの実績を計画と比較するための手法であり、品質やリスクそのものを直接測定する仕組みではないため、イ・ウ・エの組み合わせは誤りとなる。</p>","mnemonic":""},{"id":318,"year":2020,"period":"令和2年度10月","num":19,"cat":"マネジメント系","field":"リスクマネジメント","summary":"リスクマネジメント：令和2年度10月 問19","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>PMBOKガイド第6版によれば，脅威と好機の，どちらに対しても採用されるリスク対応戦略として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"回避"},{"label":"イ","html":"共有"},{"label":"ウ","html":"受容"},{"label":"エ","html":"転嫁"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PMBOKガイド第6版では、脅威(マイナスのリスク)への対応戦略として「回避・転嫁・軽減・受容・エスカレーション」、好機(プラスのリスク)への対応戦略として「活用・共有・強化・受容・エスカレーション」が挙げられている。両方のリストに共通して含まれる戦略は「受容」と「エスカレーション」であり、選択肢の中では「受容」が該当するため、正解はウ。</p><p>「回避」と「転嫁」は脅威に対してのみ用いられる戦略であり、「共有」は好機に対してのみ用いられる戦略(好機を実現する能力を持つ第三者とリスクの恩恵を分かち合う対応)であるため、いずれも脅威・好機の両方に共通する戦略としては不適切である。</p>","mnemonic":""},{"id":319,"year":2020,"period":"令和2年度10月","num":20,"cat":"ストラテジ系","field":"料金体系(逓減課金)","summary":"料金体系(逓減課金)：令和2年度10月 問20","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>ITサービスにおけるコンピュータシステムの利用に対する課金を逓減課金方式で行うときのグラフはどれか。ここで，グラフの縦軸は累計の課金額を示す。</p><p>選択肢はいずれも横軸を使用量，縦軸を累計課金額とした折れ線グラフであり，次のような形状となっている。<br>ア：使用量0付近で課金額が最も高く，使用量が増えるにつれて課金額が下がっていき，やがてほぼ横ばいになる(単調減少に近い形)。<br>イ：原点から一定の傾きで直線的に増加した後，ある使用量からは傾きがゼロになり横ばいになる(上限で頭打ち)。<br>ウ：原点から増加するが，使用量が増えるにつれて徐々に傾き(単価)が緩やかになっていく，右肩上がりで凸型に近い折れ線。<br>エ：原点から増加するが，使用量が増えるにつれて徐々に傾き(単価)が急になっていく，右肩上がりで凹型に近い折れ線。</p>","choices":[{"label":"ア","html":"使用量が増えるほど課金額が下がっていく形状のグラフ"},{"label":"イ","html":"一定の傾きで増加した後，上限で頭打ちになる形状のグラフ"},{"label":"ウ","html":"使用量が増えるほど単価(傾き)が小さくなっていく右肩上がりのグラフ"},{"label":"エ","html":"使用量が増えるほど単価(傾き)が大きくなっていく右肩上がりのグラフ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>逓減課金方式は、使用量が多くなるほど単位当たりの料金(限界単価)が段階的に安くなっていく課金方式である。累計の課金額は使用量の増加に伴って必ず増え続けるが、利用量が増えるにつれて1単位当たりの追加料金が小さくなるため、グラフの傾きは使用量が増えるほど緩やかになっていく。この特徴を持つウのグラフが正解となる。</p><p>アは課金額が減少していく形状であり、累計の課金額としては不自然(実利用に対して課金額がマイナスに作用する)なので誤り。イは一定料金まで直線的に増加した後に上限で頭打ちになる、定額制の上限キャップに近い形状である。エは使用量が増えるほど単価が高くなっていく逓増課金方式のグラフであり、逓減課金方式とは逆の特徴を持つ。</p>","mnemonic":""},{"id":320,"year":2020,"period":"令和2年度10月","num":21,"cat":"テクノロジ系","field":"可用性計算","summary":"可用性計算：令和2年度10月 問21","correct":"ウ","result":"","formula":"可用性(%) = (稼働予定時間－故障など計画外の停止時間) ÷ 稼働予定時間 × 100。計画停止時間は稼働予定時間そのものから除外する","howto":"4〜6月の総時間数を求め，顧客合意済みの計画停止(バージョンアップ)を差し引いて「稼働予定時間」を求めたうえで，そこから故障による計画外停止だけを差し引いて可用性を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>サービス提供時間帯が毎日0〜24時のITサービスにおいて，ある年の4月1日0時から6月30日24時までのサービス停止状況は表のとおりであった。システムバージョンアップ作業に伴う停止時間は，計画停止時間として顧客との間で合意されている。このとき，4月1日から6月30日までのITサービスの可用性は何%か。ここで，可用性（%）は小数第3位を四捨五入するものとする。</p><table><tr><th>停止理由</th><th>停止時間</th></tr><tr><td>システムバージョンアップ作業に伴う停止</td><td>5月2日22時から5月6日10時までの84時間</td></tr><tr><td>ハードウェア故障に伴う停止</td><td>6月26日10時から20時までの10時間</td></tr></table>","choices":[{"label":"ア","html":"95.52"},{"label":"イ","html":"95.70"},{"label":"ウ","html":"99.52"},{"label":"エ","html":"99.63"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>4月(30日)+5月(31日)+6月(30日)=91日であり，総時間は91日×24時間=2,184時間。システムバージョンアップに伴う84時間の停止は顧客と合意済みの「計画停止時間」であるため，これは最初から稼働予定時間に含めない(サービスを提供すべき時間から除外する)。したがって稼働予定時間は 2,184－84 = 2,100時間となる。</p><p>この稼働予定時間のうち，計画外の停止であるハードウェア故障による10時間だけが可用性計算上の「停止時間」としてカウントされる。よって可用性 = (2,100－10)／2,100×100 = 2,090／2,100×100 = 99.5238…% となり，小数第3位を四捨五入すると99.52%。正解はウ。</p>","mnemonic":"2,184時間から計画停止84時間を引いた2,100時間、さらに故障10時間を引いた2,090÷2,100=99.52%でウ。"},{"id":321,"year":2020,"period":"令和2年度10月","num":22,"cat":"マネジメント系","field":"システム監査基準","summary":"システム監査基準：令和2年度10月 問22","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>監査証拠の入手と評価に関する記述のうち，システム監査基準（平成30年）に照らして，適切でないものはどれか。</p>","choices":[{"label":"ア","html":"アジャイル手法を用いたシステム開発プロジェクトにおいては，管理用ドキュメントとしての体裁が整っているものだけが監査証拠として利用できる。"},{"label":"イ","html":"外部委託業務実施拠点に対する現地調査が必要と考えたとき，委託先から入手した第三者の保証報告書に依拠できると判断すれば，現地調査を省略できる。"},{"label":"ウ","html":"十分かつ適切な監査証拠を入手するための本調査の前に，監査対象の実態を把握するための予備調査を実施する。"},{"label":"エ","html":"一つの監査目的に対して，通常，複数の監査手続を組み合わせて監査を実施する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査基準では、監査証拠は文書化された管理用ドキュメントに限られるものではなく、関係者への質問、観察、再実施、分析的手続など多様な手段によって入手した情報全般が対象となり得るとされている。特にアジャイル開発のように、形式の整った管理ドキュメントが必ずしも豊富に作成されない開発手法では、バックログやレビュー記録、実際に動作するソフトウェアなど、体裁にとらわれない様々な証拠を監査証拠として扱う必要がある。したがって「体裁が整っているものだけ」に限定するアの記述は適切でなく、これが正解(適切でないもの)となる。</p><p>イのように第三者の保証報告書に依拠できると合理的に判断できる場合に現地調査を省略することや、ウのように本調査の前に予備調査で実態を把握すること、エのように一つの監査目的に対して複数の監査手続を組み合わせることは、いずれもシステム監査の実務として適切な進め方である。</p>","mnemonic":""},{"id":322,"year":2020,"period":"令和2年度10月","num":23,"cat":"ストラテジ系","field":"投資効果指標(ROI)","summary":"投資効果指標(ROI)：令和2年度10月 問23","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>情報戦略の投資効果を評価するとき，利益額を分子に，投資額を分母にして算出するものはどれか。</p>","choices":[{"label":"ア","html":"EVA"},{"label":"イ","html":"IRR"},{"label":"ウ","html":"NPV"},{"label":"エ","html":"ROI"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ROI(Return On Investment、投資利益率)は「利益額 ÷ 投資額 × 100」という式で算出される指標であり、投じた投資額に対してどれだけの利益を生み出したかの割合を表す。設問の「利益額を分子、投資額を分母にして算出する」という定義はROIそのものであり、正解はエ。</p><p>EVA(経済的付加価値)は税引後営業利益から資本コストを差し引いて算出する指標であり、比率ではなく金額で表される。IRR(内部収益率)は投資の正味現在価値をゼロにする割引率として算出される指標、NPV(正味現在価値)は将来キャッシュフローを現在価値に割り引いて投資額を差し引いた金額であり、いずれも「利益額÷投資額」という単純な比率の形では算出されない。</p>","mnemonic":""},{"id":323,"year":2020,"period":"令和2年度10月","num":24,"cat":"ストラテジ系","field":"SOA","summary":"SOA：令和2年度10月 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>SOAの説明はどれか。</p>","choices":[{"label":"ア","html":"会計，人事，製造，購買，在庫管理，販売などの企業の業務プロセスを一元管理することによって，業務の効率化や経営資源の全体最適を図る手法"},{"label":"イ","html":"企業の業務プロセス，システム化要求などのニーズと，ソフトウェアパッケージの機能性がどれだけ適合し，どれだけかい離しているかを分析する手法"},{"label":"ウ","html":"業務プロセスの問題点を洗い出して，目標設定，実行，チェック，修正行動のマネジメントサイクルを適用し，継続的な改善を図る手法"},{"label":"エ","html":"利用者の視点から業務システムの機能を幾つかの独立した部品に分けることによって，業務プロセスとの対応付けや他ソフトウェアとの連携を容易にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SOA(Service Oriented Architecture、サービス指向アーキテクチャ)は、業務システムが提供する機能を「サービス」という独立性の高い部品に分割して設計する考え方であり、業務プロセスの変更への追随や、他システムとの連携・再利用を容易にすることを目的とする。エの記述がこの考え方を正しく表しており正解となる。</p><p>アはERP(統合基幹業務システム)による業務プロセスの一元管理の説明、イはFit&Gap分析の説明、ウはPDCAサイクルを用いた業務プロセス改善(BPM的アプローチ)の説明であり、いずれもサービス単位への機能分割を特徴とするSOAの説明ではない。</p>","mnemonic":""},{"id":324,"year":2020,"period":"令和2年度10月","num":25,"cat":"ストラテジ系","field":"クラウドサービス管理","summary":"クラウドサービス管理：令和2年度10月 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>クラウドサービスの利用手順を，“利用計画の策定”，“クラウド事業者の選定”，“クラウド事業者との契約締結”，“クラウド事業者の管理”，“サービスの利用終了”としたときに，“利用計画の策定”において，利用者が実施すべき事項はどれか。</p>","choices":[{"label":"ア","html":"クラウドサービスの利用目的，利用範囲，利用による期待効果を検討し，クラウドサービスに求める要件やクラウド事業者に求めるコントロール水準を定める。"},{"label":"イ","html":"クラウド事業者がSLAなどを適切に遵守しているかモニタリングし，また，自社で構築しているコントロールの有効性を確認し，改善の必要性を検討する。"},{"label":"ウ","html":"クラウド事業者との間で調整不可となる諸事項については，自社による代替策を用意した上で，クラウド事業者との間でコントロール水準をSLAなどで合意する。"},{"label":"エ","html":"複数あるクラウド事業者のサービス内容を比較検討し，自社が求める要件及びコントロール水準が充足できるかどうかを判定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>“利用計画の策定”は、クラウドサービス利用の最も上流にあたる段階であり、自社がクラウドサービスを利用する目的や範囲、期待する効果を明確にした上で、クラウドサービスに求める要件やクラウド事業者に求めるコントロール(統制)の水準を定めることが利用者の役割となる。これを表すアが正解。</p><p>イは、契約締結後の運用段階にあたる“クラウド事業者の管理”で行うモニタリングや改善検討の内容である。ウは“クラウド事業者との契約締結”の段階でSLAなどの条件を合意する内容、エは候補となる事業者を比較し絞り込む“クラウド事業者の選定”の段階の内容であり、いずれも利用計画の策定段階より後の工程にあたる。</p>","mnemonic":""},{"id":325,"year":2020,"period":"令和2年度10月","num":26,"cat":"ストラテジ系","field":"バリューチェーン分析","summary":"バリューチェーン分析：令和2年度10月 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>企業の事業活動を機能ごとに主活動と支援活動に分け，企業が顧客に提供する製品やサービスの利益が，どの活動で生み出されているかを分析する手法はどれか。</p>","choices":[{"label":"ア","html":"3C分析"},{"label":"イ","html":"SWOT分析"},{"label":"ウ","html":"バリューチェーン分析"},{"label":"エ","html":"ファイブフォース分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バリューチェーン分析(価値連鎖分析)は、経営学者マイケル・ポーターが提唱したフレームワークであり、企業の事業活動を、顧客に直接価値を届ける「主活動」(購買物流・製造・出荷物流・マーケティング/販売・サービスなど)と、それを下支えする「支援活動」(調達・技術開発・人事労務管理・全般管理など)に分解し、どの活動が付加価値(利益)の源泉になっているかを分析する手法である。この説明はウと完全に一致する。</p><p>3C分析は顧客(Customer)・競合(Competitor)・自社(Company)の3つの視点から事業環境を分析する手法、SWOT分析は強み・弱み・機会・脅威を整理するフレームワーク、ファイブフォース分析は業界の競争構造を5つの力から分析する手法であり、いずれも事業活動を機能単位に分解して利益の源泉を特定する手法ではないため、バリューチェーン分析とは異なる。</p>","mnemonic":""},{"id":326,"year":2020,"period":"令和2年度10月","num":27,"cat":"ストラテジ系","field":"CPS(サイバーフィジカルシステム)","summary":"CPS(サイバーフィジカルシステム)：令和2年度10月 問27","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>CPS（サイバーフィジカルシステム）を活用している事例はどれか。</p>","choices":[{"label":"ア","html":"仮想化された標準的なシステム資源を用意しておき，業務内容に合わせてシステムの規模や構成をソフトウェアによって設定する。"},{"label":"イ","html":"機器を販売するのではなく貸し出し，その機器に組み込まれたセンサで使用状況を検知し，その情報を元に利用者から利用料金を徴収する。"},{"label":"ウ","html":"業務処理機能やデータ蓄積機能をサーバにもたせ，クライアント側はネットワーク接続と最小限の入出力機能だけをもたせてデスクトップの仮想化を行う。"},{"label":"エ","html":"現実世界の都市の構造や活動状況のデータによって仮想世界を構築し，災害の発生や時間軸を自由に操作して，現実世界では実現できないシミュレーションを行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CPS(サイバーフィジカルシステム)は、現実世界(フィジカル空間)のセンサなどから収集したデータをコンピュータ上の仮想空間(サイバー空間)に取り込み、そこで分析・シミュレーションした結果を現実世界側にフィードバックして活用する仕組みである。エの記述は、都市のデータから仮想空間上に都市モデル(いわゆるデジタルツイン)を構築し、現実には実行できない災害シミュレーションなどを行うという内容であり、CPSの典型的な活用事例に該当する。</p><p>アは仮想化基盤でシステム資源を柔軟に構成するクラウド/インフラ仮想化の事例、イはモノのサービス化(機器のセンサデータに基づく従量課金ビジネスモデル、いわゆるIoTを用いたサブスクリプション型のビジネス)の事例、ウはシンクライアント／デスクトップ仮想化の事例であり、いずれも現実世界のデータを基に仮想空間でシミュレーションを行うというCPSの核心的な特徴を持たない。</p>","mnemonic":""},{"id":327,"year":2020,"period":"令和2年度10月","num":28,"cat":"ストラテジ系","field":"SoE(企業システムの分類)","summary":"SoE(企業システムの分類)：令和2年度10月 問28","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>企業システムにおけるSoE（Systems of Engagement）の説明はどれか。</p>","choices":[{"label":"ア","html":"高可用性，拡張性，セキュリティを確保しながら情報システムを稼働・運用するためのハードウェア，ソフトウェアから構成されるシステム基盤"},{"label":"イ","html":"社内業務プロセスに組み込まれ，定型業務を処理し，結果を記録することによって省力化を実現するためのシステム"},{"label":"ウ","html":"データの活用を通じて，消費者や顧客企業とのつながりや関係性を深めるためのシステム"},{"label":"エ","html":"日々の仕訳伝票を入力した上で，データの改ざん，消失を防ぎながら取引データベースを維持・管理することによって，財務報告を行うためのシステム"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SoE(Systems of Engagement)は、顧客や取引先など企業を取り巻く人々との「つながり」や関係性の構築・強化に主眼を置いたシステム群であり、SNS連携やモバイルアプリ、Webポータルなどを通じて得られるデータを活用し、顧客との関係性を深めることを目的とする。ウの記述がこれに合致し正解となる。</p><p>アは情報システムの可用性・拡張性・セキュリティを確保するためのインフラ基盤そのものの説明であり、イは定型業務を正確に処理・記録する、いわゆるSoR(Systems of Record、基幹系システム)の特徴の説明である。エは仕訳データの改ざん防止や財務報告を目的とした会計システムの説明であり、これもSoRに近い性質を持つシステムの例であって、顧客との関係性構築を目的とするSoEとは異なる。</p>","mnemonic":""},{"id":328,"year":2020,"period":"令和2年度10月","num":29,"cat":"ストラテジ系","field":"損益分岐点(目標利益)計算","summary":"損益分岐点(目標利益)計算：令和2年度10月 問29","correct":"イ","result":"","formula":"営業利益 = 売上高 × 限界利益率 － 固定費　（限界利益率 = 1－変動費率）","howto":"今年度の実績から変動費率と限界利益率を求め，固定費総額と目標営業利益から翌年度の必要売上高を逆算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>資料は今年度の損益実績である。翌年度の計画では，営業利益を30百万円にしたい。翌年度の売上高は何百万円を計画すべきか。ここで，翌年度の固定費，変動費率は今年度と変わらないものとする。</p><table><tr><th colspan='2'>今年度の損益実績（単位 百万円）</th></tr><tr><td>売上高</td><td>500</td></tr><tr><td>材料費（変動費）</td><td>200</td></tr><tr><td>外注費（変動費）</td><td>100</td></tr><tr><td>製造固定費</td><td>100</td></tr><tr><td>粗利益</td><td>100</td></tr><tr><td>販売固定費</td><td>80</td></tr><tr><td>営業利益</td><td>20</td></tr></table>","choices":[{"label":"ア","html":"510"},{"label":"イ","html":"525"},{"label":"ウ","html":"550"},{"label":"エ","html":"575"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>今年度の変動費は材料費200＋外注費100＝300百万円であり，売上高500百万円に対する変動費率は300／500＝0.6（60%）。したがって限界利益率は1－0.6＝0.4（40%）となる。固定費は製造固定費100＋販売固定費80＝180百万円であり，今年度と変わらない前提である。</p><p>営業利益＝売上高×限界利益率－固定費という関係式に，目標営業利益30百万円を当てはめると、30＝売上高×0.4－180 となる。これを売上高について解くと、売上高×0.4＝210 → 売上高＝210／0.4＝525百万円となる。検算すると、525×0.4－180＝210－180＝30百万円で目標利益と一致するため、正解はイ。</p>","mnemonic":"変動費率6割・固定費180に利益目標30を足した210を0.4で割ると「ゴー・ニー・ゴー(525)」百万円になると覚える。"},{"id":329,"year":2020,"period":"令和2年度10月","num":30,"cat":"ストラテジ系","field":"プロバイダ責任制限法","summary":"プロバイダ責任制限法：令和2年度10月 問30","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>プロバイダ責任制限法が定める特定電気通信役務提供者が行う送信防止措置に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"明らかに不当な権利侵害がなされている場合でも，情報の発信者から事前に承諾を得ていなければ，特定電気通信役務提供者は送信防止措置の結果として生じた損害の賠償責任を負う。"},{"label":"イ","html":"権利侵害を防ぐための送信防止措置の結果，情報の発信者に損害が生じた場合でも，一定の条件を満たしていれば，特定電気通信役務提供者は賠償責任を負わない。"},{"label":"ウ","html":"情報発信者に対して表現の自由を保障し，通信の秘密を確保するため，特定電気通信役務提供者は，裁判所の決定を受けなければ送信防止措置を実施することができない。"},{"label":"エ","html":"特定電気通信による情報の流通によって権利を侵害された者が，個人情報保護委員会に苦情を申し立て，被害が認定された際に特定電気通信役務提供者に命令される措置である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロバイダ責任制限法(特定電気通信役務提供者の損害賠償責任の制限及び発信者情報の開示に関する法律)第3条は、プロバイダ等が権利侵害情報の送信防止措置(削除など)を行ったことによって情報の発信者に損害が生じた場合であっても、権利侵害を信じるに足りる相当の理由があったときや、被害者からの申出を受けて発信者に送信防止措置への同意の有無を照会し、7日以内に反論がなかったときなど、一定の要件を満たせば発信者に対する賠償責任を負わないとする、プロバイダ側の免責規定を定めている。これに合致するイが正解。</p><p>アは「事前の承諾がなければ必ず賠償責任を負う」としているが、実際には事前の承諾がなくても一定の要件を満たせば免責される仕組みがあるため誤り。ウは「裁判所の決定がなければ送信防止措置を実施できない」としているが、同法は上記のような一定要件のもとでプロバイダが自主的に送信防止措置を行うことを想定した免責規定であり、裁判所の決定を必須とするものではないため誤り。エは個人情報保護委員会ではなく、発信者情報開示請求など別の手続・機関に関する内容が混在しており、本法が定める送信防止措置の免責の仕組みとは異なる。</p>","mnemonic":""},{"id":330,"year":2019,"period":"令和元年度秋期","num":1,"cat":"テクノロジ系","field":"集合演算","summary":"集合演算：令和元年度秋期 問1","correct":"ア","result":"","formula":"Ā∩B̄ ＝ Ā－B（差集合の定義そのもの）","howto":"各選択肢をベン図で描き，Ā∩B̄の領域（AにもBにも属さない部分）と一致するか確認する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>全体集合Sの中に異なる部分集合AとBがあるとき，<span style=\"text-decoration:overline\">A</span>∩<span style=\"text-decoration:overline\">B</span> に等しいものはどれか。ここで，A∪BはAとBの和集合，A∩BはAとBの積集合，<span style=\"text-decoration:overline\">A</span>はSにおけるAの補集合，A－BはAからBを除いた差集合を表す。</p>","choices":[{"label":"ア","html":"<span style=\"text-decoration:overline\">A</span>－B"},{"label":"イ","html":"(<span style=\"text-decoration:overline\">A</span>∪<span style=\"text-decoration:overline\">B</span>)－(A∩B)"},{"label":"ウ","html":"(S－A)∪(S－B)"},{"label":"エ","html":"S－(A∩B)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>Ā－Bとは「Āに属し，かつBに属さない」集合，すなわちĀ∩B̄のことなので，定義よりそのままアが正しい。</p><p>確認のため他の選択肢も検証する。ウの(S－A)∪(S－B)はĀ∪B̄であり，Ā∩B̄とは一般に一致しない（AとBが等しいときだけ一致する特殊ケース）。</p><p>エのS－(A∩B)はド・モルガンの法則によりĀ∪B̄となり，やはりĀ∩B̄とは異なる。</p><p>イの(Ā∪B̄)－(A∩B)は，Ā∪B̄とA∩Bが互いに補集合同士（S全体を分割する関係）なので，Ā∪B̄からA∩Bを除いても変化はなくĀ∪B̄のままであり，Ā∩B̄にはならない。</p>","mnemonic":"「Aじゃない(Ā)からBも除けば，Bでもない領域だけが残る」―差集合の定義そのものがアと直結，ベン図で即確認。"},{"id":331,"year":2019,"period":"令和元年度秋期","num":2,"cat":"テクノロジ系","field":"待ち行列理論","summary":"待ち行列理論：令和元年度秋期 問2","correct":"イ","result":"","formula":"待ち時間＞伝送時間 ⇔ ρ／(1－ρ) ＞ 1","howto":"不等式 ρ／(1－ρ) ＞ 1 を解いて境界となる回線利用率ρを求める","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>通信回線を使用したデータ伝送システムにM/M/1の待ち行列モデルを適用すると，平均回線待ち時間，平均伝送時間，回線利用率の関係は，次の式で表すことができる。</p><p style=\"text-align:center\">平均回線待ち時間 ＝ 平均伝送時間 × 回線利用率 ／ (1－回線利用率)</p><p>回線利用率が0から徐々に増加していく場合，平均回線待ち時間が平均伝送時間よりも最初に長くなるのは，回線利用率が幾つを超えたときか。</p>","choices":[{"label":"ア","html":"0.4"},{"label":"イ","html":"0.5"},{"label":"ウ","html":"0.6"},{"label":"エ","html":"0.7"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>平均回線待ち時間が平均伝送時間より長くなる条件は，係数 ρ／(1－ρ) が1を超えることである（ρは回線利用率）。</p><p>ρ／(1－ρ) ＝ 1 とおくと，ρ ＝ 1－ρ，すなわち 2ρ＝1 より ρ＝0.5 が境界点となる。</p><p>ρが0.5を超えると ρ／(1－ρ) は1を上回り，平均回線待ち時間が平均伝送時間を上回り始める。よって答えはイの0.5。</p>","mnemonic":"利用率がちょうど半分(0.5)を超えた瞬間，待ち時間が伝送時間を追い抜く―五分五分のラインが勝負の分かれ目。"},{"id":332,"year":2019,"period":"令和元年度秋期","num":3,"cat":"テクノロジ系","field":"教師なし学習","summary":"教師なし学習：令和元年度秋期 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>AIの機械学習における教師なし学習で用いられる手法として，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"幾つかのグループに分かれている既存データ間に分離境界を定め，新たなデータがどのグループに属するかはその分離境界によって判別するパターン認識手法"},{"label":"イ","html":"数式で解を求めることが難しい場合に，乱数を使って疑似データを作り，数値計算をすることによって解を推定するモンテカルロ法"},{"label":"ウ","html":"データ同士の類似度を定義し，その定義した類似度に従って似たもの同士は同じグループに入るようにデータをグループ化するクラスタリング"},{"label":"エ","html":"プロットされた時系列データに対して，曲線の当てはめを行い，得られた近似曲線によってデータの補完や未来予測を行う回帰分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>教師なし学習は，正解ラベルを与えられていないデータから，データに潜む構造や規則性を見つけ出す機械学習の手法である。</p><p>クラスタリングはその代表的手法で，データ同士の類似度を定義し，似たデータ同士を同じグループにまとめる処理であり，正解ラベルを必要としないためウが正しい。</p><p>アは既存の正解（グループ分け）を学習データとして分離境界を決める分類（パターン認識）であり，正解ラベルを使う教師あり学習に該当する。</p><p>エの回帰分析も，実測値（正解データ）に基づいて近似曲線のパラメータを推定する点で教師あり学習の枠組みに含まれる。</p><p>イのモンテカルロ法は乱数を用いた数値計算の手法であり，教師あり・教師なしといった学習パラダイムの分類とは別の数学的技法である。</p>","mnemonic":""},{"id":333,"year":2019,"period":"令和元年度秋期","num":4,"cat":"テクノロジ系","field":"線形リスト","summary":"線形リスト：令和元年度秋期 問4","correct":"エ","result":"","formula":"末尾削除＝先頭から(n－1)回走査","howto":"各操作で先頭・末尾ポインタや次ポインタを何回たどる必要があるか数える","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>先頭ポインタと末尾ポインタをもち，多くのデータがポインタでつながった単方向の線形リストの処理のうち，先頭ポインタ，末尾ポインタ又は各データのポインタをたどる回数が最も多いものはどれか。ここで，単方向のリストは先頭ポインタからつながっているものとし，追加するデータはポインタをたどらなくても参照できるものとする。</p>","choices":[{"label":"ア","html":"先頭にデータを追加する処理"},{"label":"イ","html":"先頭のデータを削除する処理"},{"label":"ウ","html":"末尾にデータを追加する処理"},{"label":"エ","html":"末尾のデータを削除する処理"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ア（先頭追加）：新データのポインタ部に現在の先頭アドレスを設定し，先頭ポインタを新データに更新するだけで，既存データのポインタをたどる必要はない（0回）。</p><p>イ（先頭削除）：先頭ポインタが指すデータのポインタ（2番目の要素の先頭アドレス）を読み出し，先頭ポインタをそこへ更新する。たどる回数は1回。</p><p>ウ（末尾追加）：末尾ポインタを使えば末尾データのポインタ部に新データのアドレスを設定し，末尾ポインタを更新するだけで済み，たどる回数はごくわずか（1回程度）。</p><p>エ（末尾削除）：単方向リストには「後ろ向き」のポインタがないため，削除する末尾データの一つ手前のノードを知るには，先頭から順に次のポインタをたどり，次が末尾データであるノードを探すまで走査し続けるしかない。データ件数をnとすると，ほぼ(n－1)回のポインタ参照が必要になり，四つの中で最多となる。</p>","mnemonic":"末尾の「一つ手前」を知る術がない単方向リストは，先頭からnearly全件たどるしかなく，末尾削除が断トツで重い。"},{"id":334,"year":2019,"period":"令和元年度秋期","num":5,"cat":"テクノロジ系","field":"キャッシュ","summary":"キャッシュ：令和元年度秋期 問5","correct":"イ","result":"","formula":"平均アクセス時間 ＝ (1－r)×x ＋ r×y （rはキャッシュミス率）","howto":"ヒット率(1－r)×キャッシュ時間 ＋ ミス率r×主記憶時間 で加重平均を作る","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>容量がaMバイトでアクセス時間がxナノ秒の命令キャッシュと，容量がbMバイトでアクセス時間がyナノ秒の主記憶をもつシステムにおいて，CPUからみた，主記憶と命令キャッシュとを合わせた平均アクセス時間を表す式はどれか。ここで，読み込みたい命令コードがキャッシュに存在しない確率をrとし，キャッシュ管理に関するオーバヘッドは無視できるものとする。</p>","choices":[{"label":"ア","html":"(1－r)・a／(a＋b)・x ＋ r・b／(a＋b)・y"},{"label":"イ","html":"(1－r)・x ＋ r・y"},{"label":"ウ","html":"r・a／(a＋b)・x ＋ (1－r)・b／(a＋b)・y"},{"label":"エ","html":"r・x ＋ (1－r)・y"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>rは「命令コードがキャッシュに存在しない確率」，すなわちキャッシュミス率である。したがってキャッシュにヒットする確率は(1－r)となる。</p><p>ヒット時はキャッシュのアクセス時間xだけで読み出せ，ミス時は主記憶のアクセス時間yが掛かる（オーバヘッド無視）ので，平均アクセス時間はヒット率とミス率による加重平均 (1－r)・x ＋ r・y となり，イが正しい。</p><p>ア・ウはキャッシュと主記憶の容量a，bの比を重みに使っているが，容量の大小は読み出し時間の平均には関係しないため誤り（容量はヒット率rという形で既に問題文に織り込まれている）。</p><p>エはヒット率とミス率の掛け方が逆転しており，ミス確率rをキャッシュ時間xに，ヒット確率(1－r)を主記憶時間yに掛けてしまっているため誤り。</p>","mnemonic":"存在しない確率rがそのまま主記憶行きの重み―容量a,bに惑わされず確率だけで加重平均する。"},{"id":335,"year":2019,"period":"令和元年度秋期","num":6,"cat":"テクノロジ系","field":"ジョブ管理","summary":"ジョブ管理：令和元年度秋期 問6","correct":"ウ","result":"","formula":"同時に存在する一時ファイルの合計（50M×同時存在ファイル数）の最大値を求める","howto":"多重度2でジョブの開始・終了時刻を求め，各一時ファイルの生存区間を重ねて最大同時存在数を調べる","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ジョブ群と実行の条件が次のとおりであるとき，一時ファイルを作成する磁気ディスクに必要な容量は最低何Mバイトか。</p><p>〔ジョブ群〕ジョブの依存関係（矢印の始点ジョブが終わると矢印の終点ジョブが生起される）は次のとおり。</p><ul><li>A → B</li><li>A → C</li><li>B → D</li><li>B → E</li><li>C → D</li><li>C → E</li><li>D → F</li><li>E → F</li></ul><p>〔実行の条件〕</p><ol><li>ジョブの実行多重度を2とする。</li><li>各ジョブの処理時間は同一であり，他のジョブの影響は受けない。</li><li>各ジョブは開始時に50Mバイトの一時ファイルを新たに作成する。</li><li>X→Yの関係があれば，ジョブXの開始時に作成した一時ファイルは，直後のジョブYで参照し，ジョブYの終了時にその一時ファイルを削除する。直後のジョブが複数個ある場合には，最初に生起されるジョブだけが先行ジョブの一時ファイルを参照する。</li><li>一つのジョブから複数の矢印が出ている場合，そのジョブの終了時に，矢印で結ばれる全てのジョブが，上から記述された順（B→D，B→Eの順など）に優先して生起される。</li><li>複数のジョブから一つのジョブへ矢印が入る場合，先行する全てのジョブが終了したときに，その後続ジョブが生起される。</li><li>ジョブの生起とは実行待ち行列への追加を意味し，各ジョブは待ち行列の順に実行される。</li><li>OSのオーバヘッドは考慮しない。</li></ol>","choices":[{"label":"ア","html":"100"},{"label":"イ","html":"150"},{"label":"ウ","html":"200"},{"label":"エ","html":"250"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各ジョブの処理時間を1単位として，多重度2の制約の下でスケジュールを追う。</p><p>時刻0：Aだけが実行可能なのでAが開始。時刻1にAが終了。</p><p>時刻1：Aの完了によりB，Cがこの順で生起される（条件5）。多重度2なので両方同時に開始でき，時刻2に両方とも終了する。</p><p>時刻2：B，Cが共に終了したことで，D，Eの生起条件（条件6）が満たされ，D，Eがこの順で生起される。多重度2なので両方同時に開始し，時刻3に終了する。</p><p>時刻3：D，Eが共に終了したことでFの生起条件が満たされ，Fが開始，時刻4に終了する。</p><p>次に一時ファイルの生存期間を調べる。Aの一時ファイルは時刻0に作成され，Aの直後に最初に生起されるB（条件5でBが先）が参照・削除するので，Bの終了時刻2で削除される。Bの一時ファイルは時刻1に作成され，Bの後続D，Eのうち最初に生起されるD（条件5でDが先）が参照・削除するので，Dの終了時刻3で削除される。同様にCの一時ファイルも時刻1作成，Dの終了時刻3で削除される（DはCにとっても最初に生起される後続ジョブ）。Dの一時ファイルは時刻2作成，後続Fが削除するので時刻4で削除。Eの一時ファイルも時刻2作成，時刻4で削除。</p><p>区間ごとの同時存在ファイル数を確認すると，時刻2〜3の間はB，C，D，Eの4つの一時ファイルが同時に存在し，50M×4＝200Mバイトとなる。この区間が最大であり，他の区間（時刻1〜2は3ファイルで150M，時刻3〜4は3ファイルで150M）を上回るため，必要な最低容量は200Mバイトとなる。</p>","mnemonic":"2多重×4ファイルが鉢合わせする時刻2〜3（B,C,D,Eが同時生存）が山場で，50M×4＝200Mが正念場。"},{"id":336,"year":2019,"period":"令和元年度秋期","num":7,"cat":"テクノロジ系","field":"キャパシティ計画","summary":"キャパシティ計画：令和元年度秋期 問7","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>キャパシティプランニングの目的の一つに関する記述のうち，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"応答時間に最も影響があるボトルネックだけに着目して，適切な変更を行うことによって，そのボトルネックの影響を低減又は排除することである。"},{"label":"イ","html":"システムの現在の応答時間を調査し，長期的に監視することによって，将来を含めて応答時間を維持することである。"},{"label":"ウ","html":"ソフトウェアとハードウェアをチューニングして，現状の処理能力を最大限に引き出して，スループットを向上させることである。"},{"label":"エ","html":"パフォーマンスの問題はリソースの過剰使用によって発生するので，特定のリソースの有効利用を向上させることである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>キャパシティプランニングは，将来の負荷増大や需要変動にも耐えられるシステム環境を事前に準備し，SLAで定める応答時間などの目標を長期にわたって維持することを目的とする，先を見越した計画活動である。現在の応答時間を調査し，長期的に監視し続けることで将来の応答時間を維持するというイの説明が，この「将来を見据えた計画」という性質に最も合致する。</p><p>アとウは，いずれも「現状のボトルネックを見つけて改善する」「現状の処理能力を最大限引き出す」という，既に顕在化している問題に対処するチューニング（性能改善）の説明であり，将来を見据えた計画であるキャパシティプランニングの目的としては限定的すぎる。</p><p>エも「特定リソースの有効利用向上」という現状対処型の説明にとどまり，長期的な需要予測に基づく事前準備というキャパシティプランニング本来の狙いを表していない。</p>","mnemonic":""},{"id":337,"year":2019,"period":"令和元年度秋期","num":8,"cat":"テクノロジ系","field":"環境発電","summary":"環境発電：令和元年度秋期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>エネルギーハーベスティングの適用例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"AC電源で充電したバッテリで駆動される携帯電話機"},{"label":"イ","html":"インバータ制御を用いるエアーコンディショナの室外機"},{"label":"ウ","html":"スイッチを押す力を電力に変換して作動するRFリモコン"},{"label":"エ","html":"無停電電源装置を備えたデータサーバ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>エネルギーハーベスティング（環境発電）とは，振動・光・熱・圧力・電波など身の回りの微小な環境エネルギーを電力に変換し，外部電源なしで機器を動かす技術である。ウは，スイッチを押す動作（機械的な圧力）そのものを電力に変換してRFリモコンを動作させる仕組みであり，圧電素子などを用いたエネルギーハーベスティングの代表的な適用例に当たる。</p><p>アは家庭用AC電源からバッテリを充電して使う通常の携帯電話機であり，周囲の環境エネルギーを収穫しているわけではない。</p><p>イはインバータ制御という電力変換技術の話であり，環境エネルギーの収穫とは無関係である。</p><p>エは無停電電源装置（UPS）というバックアップ電源の仕組みであり，これも環境エネルギーの利用とは異なる。</p>","mnemonic":""},{"id":338,"year":2019,"period":"令和元年度秋期","num":9,"cat":"テクノロジ系","field":"障害回復","summary":"障害回復：令和元年度秋期 問9","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>データベースに媒体障害が発生したときのデータベースの回復法はどれか。</p>","choices":[{"label":"ア","html":"障害発生時，異常終了したトランザクションをロールバックする。"},{"label":"イ","html":"障害発生時点でコミットしていたがデータベースの実更新がされていないトランザクションをロールフォワードする。"},{"label":"ウ","html":"障害発生時点でまだコミットもアボートもしていなかった全てのトランザクションをロールバックする。"},{"label":"エ","html":"バックアップコピーでデータベースを復元し，バックアップ取得以降にコミットした全てのトランザクションをロールフォワードする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>媒体障害（ディスククラッシュなど，データベースの実体そのものが物理的に破損する障害）では，メモリ上のログだけでは復旧できず，まずバックアップコピーを使ってデータベース自体をリストア（復元）し，その後バックアップ取得以降のログを使って，その間にコミットが完了した全てのトランザクションをロールフォワード（再実行）して最新の状態まで復旧する必要がある。これがエの説明と一致する。</p><p>ア・ウは，ディスクなどハードウェアは無事で，電源断やソフトウェア異常などで実行中のトランザクションが中途半端な状態になった場合の回復法（未完了トランザクションのロールバック）であり，データベース自体が壊れる媒体障害には対応できない。</p><p>イは通常のシステム障害時に，メモリ上では更新済みでもディスクへの反映が済んでいないコミット済みトランザクションをロールフォワードする処理であり，バックアップへの復元を伴わないため，データベースの実体が失われる媒体障害には不十分である。</p>","mnemonic":""},{"id":339,"year":2019,"period":"令和元年度秋期","num":10,"cat":"テクノロジ系","field":"CSMA/CD","summary":"CSMA/CD：令和元年度秋期 問10","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>イーサネットで使用されるメディアアクセス制御方式であるCSMA/CDに関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"それぞれのステーションがキャリア検知を行うとともに，送信データの衝突が起きた場合は再送する。"},{"label":"イ","html":"タイムスロットと呼ばれる単位で分割して，同一周波数において複数の通信を可能にする。"},{"label":"ウ","html":"データ送受信の開始時にデータ送受信のネゴシエーションとしてRTS/CTS方式を用い，受信の確認はACKを使用する。"},{"label":"エ","html":"伝送路上にトークンを巡回させ，トークンを受け取った端末だけがデータを送信できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CSMA/CD（Carrier Sense Multiple Access with Collision Detection）は，各局が送信前に伝送路の使用状況をキャリア検知で確認し，それでも衝突が発生した場合はそれを検出して送信を中止，ランダムな時間待機の後に再送する方式であり，アの説明がこれに一致する。</p><p>イはタイムスロットで周波数や時間を分割して複数通信を可能にするTDMA（時分割多元接続）など別の多重化方式の説明である。</p><p>ウはRTS/CTSとACKを用いる方式で，無線LANなどで隠れ端末問題に対処するCSMA/CA方式の説明に近く，CSMA/CDとは異なる。</p><p>エは伝送路上にトークンを巡回させるトークンパッシング方式（トークンリングなど）の説明であり，CSMA/CDとは根本的に異なるアクセス制御方式である。</p>","mnemonic":""},{"id":340,"year":2019,"period":"令和元年度秋期","num":11,"cat":"テクノロジ系","field":"プロキシ","summary":"プロキシ：令和元年度秋期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>TCP/IPネットワークのフォワードプロキシに関する説明のうち，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"Webサーバと同一の組織内（例えば企業内）にあって，Webブラウザからのリクエストに対してWebサーバの代理として応答する。"},{"label":"イ","html":"Webブラウザと同一の組織内（例えば企業内）になければならない。"},{"label":"ウ","html":"Webブラウザの代理として，Webサーバに対するリクエストを送信する。"},{"label":"エ","html":"電子メールをインターネット上の複数のサーバを経由して転送する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フォワードプロキシは，クライアント（Webブラウザ）側に設置され，クライアントの代理としてインターネット上のWebサーバへリクエストを送信する仕組みであり，ウの説明が正しい。</p><p>アは，Webサーバと同一組織内に置かれ，Webサーバの代理として応答するリバースプロキシの説明である。</p><p>イは必須条件ではない。フォワードプロキシは社内LAN内に置かれることが多いが，外部の商用プロキシサービスを利用する形態もあり，「同一組織内になければならない」と断定するのは誤り。</p><p>エは電子メールを複数のサーバ経由で転送するメールリレー（SMTPのメール転送）の説明であり，プロキシとは異なる仕組みである。</p>","mnemonic":""},{"id":341,"year":2019,"period":"令和元年度秋期","num":12,"cat":"テクノロジ系","field":"NAPT","summary":"NAPT：令和元年度秋期 問12","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>インターネットとの接続において，ファイアウォールのNAPT機能によるセキュリティ上の効果はどれか。</p>","choices":[{"label":"ア","html":"DMZ上にある公開Webサーバの脆弱性を悪用する攻撃から防御できる。"},{"label":"イ","html":"インターネットから内部ネットワークへの侵入を検知し，検知後の通信を遮断できる。"},{"label":"ウ","html":"インターネット上の特定のWebサービスを利用するHTTP通信を検知し，遮断できる。"},{"label":"エ","html":"内部ネットワークからインターネットにアクセスする利用者PCについて，インターネットからの不正アクセスを困難にすることができる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NAPT（Network Address Port Translation）は，内部ネットワークのプライベートIPアドレス・ポート番号をグローバルIPアドレス・ポート番号に変換して通信する技術である。内部から外部への通信によって生成された変換テーブルのエントリがない限り，外部から内部ホストへ直接アクセスする経路が存在しないため，結果として内部PCへの不正アクセスを困難にする副次的なセキュリティ効果があり，エが正しい。</p><p>アのように公開Webサーバ自体の脆弱性を悪用する攻撃を防ぐものではない（DMZ上のサーバは外部に公開する必要があり，NAPTの保護対象には通常含まれない）。</p><p>イ・ウのような侵入の検知や特定通信の検知・遮断は，IDS/IPSやファイアウォールのフィルタリング機能が担う役割であり，アドレス変換が本来の目的であるNAPT単体の機能ではない。</p>","mnemonic":""},{"id":342,"year":2019,"period":"令和元年度秋期","num":13,"cat":"テクノロジ系","field":"認証方式","summary":"認証方式：令和元年度秋期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>チャレンジレスポンス認証方式に該当するものはどれか。</p>","choices":[{"label":"ア","html":"固定パスワードをTLSによって暗号化し，クライアントからサーバに送信する。"},{"label":"イ","html":"端末のシリアル番号を，クライアントで秘密鍵を使って暗号化してサーバに送信する。"},{"label":"ウ","html":"トークンという装置が自動的に表示する，認証のたびに異なるデータをパスワードとしてサーバに送信する。"},{"label":"エ","html":"利用者が入力したパスワードと，サーバから受け取ったランダムなデータとをクライアントで演算し，その結果をサーバに送信する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>チャレンジレスポンス認証は，サーバが毎回異なる乱数（チャレンジ）をクライアントに送り，クライアントはそのチャレンジと秘密情報（パスワードなど）を組み合わせて演算した結果（レスポンス）を返す方式である。これにより平文パスワードを送信せずに本人確認ができ，通信を盗聴して後から再送するリプレイ攻撃も防げる。エの説明がこれに一致する。</p><p>アは固定パスワードをTLSで暗号化して送るだけであり，パスワードそのものが（暗号化されているとはいえ）直接送信される点でチャレンジレスポンスの仕組みとは異なる。</p><p>ウはトークン装置が時刻や内部カウンタに基づいて自動的に変化するワンタイムパスワードを生成する方式であり，サーバから送られる乱数（チャレンジ）とのやり取りを伴わない点でエとは区別される。</p>","mnemonic":""},{"id":343,"year":2019,"period":"令和元年度秋期","num":14,"cat":"テクノロジ系","field":"ファジング","summary":"ファジング：令和元年度秋期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ファジングに該当するものはどれか。</p>","choices":[{"label":"ア","html":"サーバにFINパケットを送信し，サーバからの応答を観測して，稼働しているサービスを見つけ出す。"},{"label":"イ","html":"サーバのOSやアプリケーションソフトウェアが生成したログやコマンド履歴などを解析して，ファイルサーバに保存されているファイルの改ざんを検知する。"},{"label":"ウ","html":"ソフトウェアに，問題を引き起こしそうな多様なデータを入力し，挙動を監視して，脆弱性を見つけ出す。"},{"label":"エ","html":"ネットワーク上を流れるパケットを収集し，そのプロトコルヘッダやペイロードを解析して，あらかじめ登録された攻撃パターンと一致した場合は不正アクセスと判断する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファジング（ファズテスト）とは，問題を引き起こしそうな多様（想定外・異常）なデータ（ファズ）を大量にソフトウェアへ入力し，クラッシュや異常終了などの挙動を監視することで未知の脆弱性を発見する動的テスト手法であり，ウの説明と一致する（IPAの「ファジング活用の手引き」でも同様に説明されている）。</p><p>アはFINパケットを使ったポートスキャン（FINスキャン）によるサービス検出の説明である。</p><p>イはログ解析によるファイル改ざん検知（ファイル完全性監視）の説明である。</p><p>エはあらかじめ登録された攻撃パターン（シグネチャ）と照合するシグネチャ型の不正侵入検知システム（IDS）の説明であり，いずれもファジングとは異なる技術である。</p>","mnemonic":""},{"id":344,"year":2019,"period":"令和元年度秋期","num":15,"cat":"テクノロジ系","field":"虹彩認証","summary":"虹彩認証：令和元年度秋期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>虹彩認証に関する記述のうち，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"経年変化による認証精度の低下を防止するために，利用者の虹彩情報を定期的に登録し直さなければならない。"},{"label":"イ","html":"赤外線カメラを用いると，照度を高くするほど，目に負担を掛けることなく認証精度を向上させることができる。"},{"label":"ウ","html":"他人受入率を顔認証と比べて低くすることが可能である。"},{"label":"エ","html":"本人が装置に接触したあとに残された遺留物を採取し，それを加工することによって認証データを偽造し，本人になりすますことが可能である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>虹彩（眼球の茶目模様）は個人差が非常に大きく，成長後はほとんど経年変化しないとされる生体的特徴である。そのため，他人受入率（FAR，別人を本人と誤認識する率）を，一般に顔認証よりも低く（より高精度に）設計することが可能であり，ウが正しい。</p><p>アは誤り。虹彩はほとんど経年変化しないため，頻繁な再登録は不要とされる点がむしろ虹彩認証の利点の一つである。</p><p>イも誤り。赤外線の照度を無制限に高めると目への負担（安全性の問題）が生じるため，精度向上のために際限なく照度を上げることはできない。</p><p>エは，虹彩が非接触で読み取れる特徴量であるため，「装置に接触したあとの遺留物」という概念自体が当てはまらない。これは指紋認証などの接触型生体認証で懸念される偽造リスクであり，虹彩認証には該当しない。</p>","mnemonic":""},{"id":345,"year":2019,"period":"令和元年度秋期","num":16,"cat":"テクノロジ系","field":"レビュー技法","summary":"レビュー技法：令和元年度秋期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>作業成果物の作成者以外の参加者がモデレータとしてレビューを主導する役割を受け持つこと，並びに公式な記録及び分析を行うことが特徴のレビュー技法はどれか。</p>","choices":[{"label":"ア","html":"インスペクション"},{"label":"イ","html":"ウォークスルー"},{"label":"ウ","html":"パスアラウンド"},{"label":"エ","html":"ペアプログラミング"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>インスペクションは，作成者以外の第三者がモデレータとなって会議を主導し，あらかじめ定められた手順・役割分担に従って欠陥を摘出し，結果を公式な記録として残して分析する，最も形式的なレビュー技法であり，アが正しい。</p><p>イのウォークスルーは，通常は作成者自身が主導して成果物を説明しながら進める非形式的なレビューであり，事前の厳密な準備や公式記録は必須とされない。</p><p>ウのパスアラウンドは成果物を複数のレビューアに回覧してコメントを集める形式で，会議を主導するモデレータという概念自体がない。</p><p>エのペアプログラミングは2人の開発者が1台のPCを共有し実装とレビューを同時に行う手法であり，独立したレビュー会議として実施するものではない。</p>","mnemonic":""},{"id":346,"year":2019,"period":"令和元年度秋期","num":17,"cat":"ストラテジ系","field":"ソフト使用許諾","summary":"ソフト使用許諾：令和元年度秋期 問17","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>自社開発したソフトウェアの他社への使用許諾に関する説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"既に自社の製品に搭載して販売していると，ソフトウェア単体では使用許諾できない。"},{"label":"イ","html":"既にハードウェアと組み合わせて特許を取得していると，ソフトウェア単体では使用許諾できない。"},{"label":"ウ","html":"ソースコードを無償で使用許諾すると，無条件でオープンソースソフトウェアになる。"},{"label":"エ","html":"特許で保護された技術を使っていないソフトウェアであっても，使用許諾することは可能である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ソフトウェアの使用許諾（ライセンス供与）は著作権に基づいて行うことができ，特許権の取得を前提としない。したがって特許技術を利用していないソフトウェアでも，著作権者として自由に使用許諾契約を結ぶことができ，エが正しい。</p><p>アは誤り。既に自社製品に組み込んで販売していても，ソフトウェア単体を別途（非独占的に）ライセンスすることは法的に制約されない。</p><p>イも誤り。ハードウェアとセットで特許を取得していても，ソフトウェア部分を単体でライセンスすることは可能であり，特許権とソフトウェアの著作権ライセンスは別個に扱える。</p><p>ウは誤り。ソースコードを無償公開しても，再配布の自由や改変の許可など，OSIが定めるオープンソースの定義を満たす条件を付さなければ「オープンソースソフトウェア」とは呼べず，無条件にそう扱われるわけではない。</p>","mnemonic":""},{"id":347,"year":2019,"period":"令和元年度秋期","num":18,"cat":"マネジメント系","field":"PMO役割","summary":"PMO役割：令和元年度秋期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>PMBOKガイド第6版によれば，プロジェクト・マネジャー，プログラム・マネジャー，ポートフォリオ・マネジャー，プロジェクトマネジメント・オフィス（PMO）は，それぞれ他と異なる役割を担っている。それぞれに対応した役割の説明のうち，PMOのものはどれか。</p>","choices":[{"label":"ア","html":"戦略目標に整合させるよう，関連する複数のプロジェクトに影響する制約条件及びコンフリクトを解消する。"},{"label":"イ","html":"戦略目標を達成するために，プログラム及びプロジェクトの最適な組合せを選択して，構成要素の優先順位を決定し，必要な資源を提供する。"},{"label":"ウ","html":"プロジェクトに関連するガバナンス・プロセスを標準化し，資源，方法論，ツール及び技法の共有を促進する。"},{"label":"エ","html":"プロジェクトの要求事項を満たすために，知識，スキル，ツールと技法をプロジェクトのアクティビティへ適用する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PMBOKガイド第6版では，PMO（プロジェクトマネジメント・オフィス）は，プロジェクトに関連するガバナンスプロセスを標準化し，資源，方法論，ツール，技法の共有を促進する組織構造として位置づけられており，ウが正しい。</p><p>アは，複数プロジェクト間の制約やコンフリクトを戦略目標に沿って解消する役割であり，個々のプロジェクトを超えた視点を持つプログラム・マネジャーの説明に近い。</p><p>イは，戦略目標達成のためにプログラムやプロジェクトの組合せを選別し，優先順位を決めて資源を配分する，トップダウンの資源配分を担うポートフォリオ・マネジャーの役割である。</p><p>エは，個々のプロジェクトの要求事項を知識・スキル・ツールを適用して達成する，現場レベルの実行責任を負うプロジェクト・マネジャー自身の役割である。</p>","mnemonic":""},{"id":348,"year":2019,"period":"令和元年度秋期","num":19,"cat":"マネジメント系","field":"クリティカルパス","summary":"クリティカルパス：令和元年度秋期 問19","correct":"ウ","result":"","formula":"各結合点の最早開始時刻＝流入する全経路の(直前の時刻＋所要日数)の最大値","howto":"フォワードパスで各結合点の最早時刻を求め，作業D短縮前後の全体日数（終了時刻）の差を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>アローダイアグラムで表される作業A〜Hを見直したところ，作業Dだけが短縮可能であり，その所要日数は6日に短縮できることが分かった。作業全体の所要日数は何日短縮できるか。</p><p>〔アローダイアグラムの構成〕（○はイベント（結合点），矢印の上段が作業名，下段が所要日数（日），点線はダミー作業（所要日数0日）とする）</p><ul><li>開始 → ①：作業A（5日）</li><li>① → ②：作業B（3日）</li><li>① → ③：作業C（5日）</li><li>③ → ②：作業D（10日）（Cの後続結合点から，Bの後続結合点②へ向かう矢印）</li><li>② → ④：作業E（5日）</li><li>③ → ⑤：作業F（12日）</li><li>④ → ⑤：ダミー作業（0日）</li><li>④ → 終了：作業G（3日）</li><li>⑤ → 終了：作業H（6日）</li></ul>","choices":[{"label":"ア","html":"1"},{"label":"イ","html":"2"},{"label":"ウ","html":"3"},{"label":"エ","html":"4"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>【短縮前】最早時刻を順に求める。①＝5（A）。③＝①＋C＝5＋5＝10。②は①からのB経路と③からのD経路の両方が流入するので，②＝max(①＋B, ③＋D)＝max(5＋3, 10＋10)＝max(8, 20)＝20。④＝②＋E＝20＋5＝25。⑤は③からのF経路と④からのダミー経路が流入するので，⑤＝max(③＋F, ④＋0)＝max(10＋12, 25)＝max(22, 25)＝25。終了＝max(④＋G, ⑤＋H)＝max(25＋3, 25＋6)＝max(28, 31)＝31。よって全体の所要日数は31日，クリティカルパスはA→C→D→E→（ダミー）→Hである。</p><p>【Dを6日に短縮後】②＝max(①＋B, ③＋D)＝max(8, 10＋6)＝max(8, 16)＝16。④＝16＋5＝21。⑤＝max(③＋F, ④＋0)＝max(10＋12, 21)＝max(22, 21)＝22。終了＝max(④＋G, ⑤＋H)＝max(21＋3, 22＋6)＝max(24, 28)＝28。</p><p>短縮後の全体所要日数は28日となり，31－28＝3日短縮できる。Dを10日から6日へ4日短縮したにもかかわらず，全体の短縮が3日にとどまるのは，Dの短縮によって経路A→C→D→E→（ダミー）→Hの所要日数が20日まで縮んだ結果，別経路A→C→F→H（5＋5＋12＋6＝28日）がクリティカルパスの座を奪って下限となるためである。よって答えはウの3。</p>","mnemonic":"Dを4日削っても，裏に潜んでいたA→C→F→Hの28日ルートが追いつき，得をするのは結局3日だけ。"},{"id":349,"year":2019,"period":"令和元年度秋期","num":20,"cat":"マネジメント系","field":"インシデント管理","summary":"インシデント管理：令和元年度秋期 問20","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ITサービスマネジメントの活動のうち，インシデント及びサービス要求管理として行うものはどれか。</p>","choices":[{"label":"ア","html":"サービスデスクに対する顧客満足度が合意したサービス目標を満たしているかどうかを評価し，改善の機会を特定するためにレビューする。"},{"label":"イ","html":"ディスクの空き容量がしきい値に近づいたので，対策を検討する。"},{"label":"ウ","html":"プログラムを変更した場合の影響度を調査する。"},{"label":"エ","html":"利用者からの障害報告を受けて，既知の誤りに該当するかどうかを照合する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>インシデント管理は，サービスの中断や品質低下（インシデント）を迅速に復旧させるためのプロセスであり，利用者からの障害報告を受けた際に，既存の「既知の誤り（Known Error）」データベースと照合して，既知の解決策・回避策がないかを確認する活動は，典型的なインシデント管理の実務であり，エが正しい。</p><p>アはサービスデスクの顧客満足度をサービス目標に照らしてレビューする活動であり，サービスレベル管理に該当する。</p><p>イはディスク容量のしきい値監視に基づく事前対応であり，まだインシデントは発生していない段階での予防的活動（キャパシティ管理や問題管理の領域）に近い。</p><p>ウはプログラム変更の影響度調査であり，変更管理（チェンジマネジメント）の活動に該当する。</p>","mnemonic":""},{"id":350,"year":2019,"period":"令和元年度秋期","num":21,"cat":"マネジメント系","field":"クラウド監査","summary":"クラウド監査：令和元年度秋期 問21","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>クラウドサービスの導入検討プロセスに対するシステム監査において，クラウドサービス上に保存されている情報の消失の予防に関するチェックポイントとして，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"既存の社内情報システムとのIDの一元管理の可否が検討されているか。"},{"label":"イ","html":"クラウドサービスの障害時における最大許容停止時間が検討されているか。"},{"label":"ウ","html":"クラウドサービスを提供する事業者に信頼が置け，かつ，事業やサービスが継続して提供されるかどうかが検討されているか。"},{"label":"エ","html":"クラウドサービスを提供する事業者の施設内のネットワークに，暗号化通信が採用されているかどうかが検討されているか。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>情報の「消失」を予防する観点では，クラウド事業者自体が信頼でき，事業・サービスが将来にわたって継続的に提供される（＝事業者の倒産やサービス終了によってデータが失われるリスクを避けられる）かどうかを検討することが，最も直接的なチェックポイントとなり，ウが正しい。</p><p>アはID管理の一元化（シングルサインオンなど）の検討であり，利便性やアクセス管理の論点であって，情報消失の予防とは直接関係しない。</p><p>イは障害時の最大許容停止時間（可用性・事業継続の目標値）の検討であり，「停止時間」に関する指標であって，データの「消失」防止そのものを指すものではない。</p><p>エは通信の暗号化であり，情報の盗聴・改ざん防止（機密性）に関する対策であって，消失防止とは異なる観点である。</p>","mnemonic":""},{"id":351,"year":2019,"period":"令和元年度秋期","num":22,"cat":"マネジメント系","field":"監査技法","summary":"監査技法：令和元年度秋期 問22","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>システム監査基準（平成30年）における監査手続の実施に際して利用する技法に関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"インタビュー法とは，システム監査人が，直接，関係者に口頭で問い合わせ，回答を入手する技法をいう。"},{"label":"イ","html":"現地調査法は，システム監査人が監査対象部門に直接赴いて，自ら観察・調査するものなので，当該部門の業務時間外に実施しなければならない。"},{"label":"ウ","html":"コンピュータ支援監査技法は，システム監査上使用頻度の高い機能に特化した，しかも非常に簡単な操作で利用できる専用ソフトウェアによらなければならない。"},{"label":"エ","html":"チェックリスト法とは，監査対象部門がチェックリストを作成及び利用して，監査対象部門の見解を取りまとめた結果をシステム監査人が点検する技法をいう。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査基準（平成30年）の実施技法の解説では，インタビュー法は監査人が関係者に直接口頭で問い合わせて回答を得る技法と定義されており，アの記述がそのまま正しい。</p><p>イは誤り。現地調査法は監査対象部門の実際の業務状況を観察することに意義があるため，むしろ業務時間内に実施して実態を確認する必要があり，「業務時間外に実施しなければならない」という限定は不適切である。</p><p>ウも誤り。コンピュータ支援監査技法（CAAT）は専用ソフトウェアに限らず，表計算ソフトや汎用プログラム言語を用いたデータ抽出・分析なども含まれ，「非常に簡単な操作の専用ソフトウェアによらなければならない」という限定は不適切である。</p><p>エも誤り。チェックリスト法は本来，システム監査人自身があらかじめ準備したチェックリストに基づいて関係者に質問し，回答を点検・評価する技法であり，「監査対象部門がチェックリストを作成する」という説明は主体が逆になっている。</p>","mnemonic":""},{"id":352,"year":2019,"period":"令和元年度秋期","num":23,"cat":"ストラテジ系","field":"BCP","summary":"BCP：令和元年度秋期 問23","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>BCPの説明はどれか。</p>","choices":[{"label":"ア","html":"企業の戦略を実現するために，財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点から戦略を検討したもの"},{"label":"イ","html":"企業の目標を達成するために業務内容や業務の流れを可視化し，一定のサイクルをもって継続的に業務プロセスを改善するもの"},{"label":"ウ","html":"業務効率の向上，業務コストの削減を目的に，業務プロセスを対象としてアウトソースを実施するもの"},{"label":"エ","html":"事業の中断・阻害に対応し，事業を復旧し，再開し，あらかじめ定められたレベルに回復するように組織を導く手順を文書化したもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BCP（事業継続計画）は，大規模災害やシステム障害などで事業活動が中断・阻害された場合に，重要業務を復旧・再開し，あらかじめ定めた目標レベルまで回復させるための方針・体制・手順を文書化した計画であり，エがその説明に一致する。</p><p>アは，財務・顧客・内部プロセス・学習と成長の四つの視点で戦略を管理するBSC（バランス・スコアカード）の説明である。</p><p>イは，業務プロセスを可視化し，PDCAサイクルなどで継続的に改善していくBPM（ビジネスプロセスマネジメント）の説明である。</p><p>ウは，業務プロセスを外部に委託するBPO（ビジネスプロセスアウトソーシング）の説明であり，いずれもBCPとは異なる経営管理の考え方を指している。</p>","mnemonic":""},{"id":353,"year":2019,"period":"令和元年度秋期","num":24,"cat":"ストラテジ系","field":"評価点算出","summary":"評価点算出：令和元年度秋期 問24","correct":"イ","result":"","formula":"達成度(%) ＝ 実際の加重評価点合計 ／ (重み合計×3点[満点]) × 100","howto":"各項目の重み×評価点を合計し，全項目が3点満点だった場合の合計(重み合計×3)で割って百分率を求める","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>定性的な評価項目を定量化するために評価点を与える方法がある。表に示す4段階評価を用いた場合，重み及び4段階評価の結果から評価されたシステム全体の目標達成度は，評価項目が全て目標どおりだった場合の評価点に対し，何%となるか。</p><table border=\"1\" cellpadding=\"4\"><tr><th>システムの評価項目</th><th>重み</th><th>4段階評価の結果</th></tr><tr><td>省力化効果</td><td>5</td><td>目標どおり</td></tr><tr><td>期間の短縮</td><td>8</td><td>変わらず</td></tr><tr><td>情報の統合化</td><td>12</td><td>部分改善</td></tr></table><p>4段階評価点：3＝目標どおり，2＝ほぼ目標どおり，1＝部分改善，0＝変わらず</p>","choices":[{"label":"ア","html":"27"},{"label":"イ","html":"36"},{"label":"ウ","html":"43"},{"label":"エ","html":"52"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各評価項目の実際の加重評価点を求める。省力化効果（目標どおり＝3点）：5×3＝15点。期間の短縮（変わらず＝0点）：8×0＝0点。情報の統合化（部分改善＝1点）：12×1＝12点。合計＝15＋0＋12＝27点。</p><p>全項目が目標どおり（3点満点）だった場合の評価点は，重みの合計(5＋8＋12＝25)に満点3点を掛けて，25×3＝75点となる。</p><p>目標達成度＝27／75×100＝36%。よってイが正しい。</p>","mnemonic":"満点75点のうち実際は27点―省力化と統合化が稼いでも，期間短縮の0点が重く3割6分止まり。"},{"id":354,"year":2019,"period":"令和元年度秋期","num":25,"cat":"ストラテジ系","field":"ファウンドリ","summary":"ファウンドリ：令和元年度秋期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>半導体メーカが行っているファウンドリサービスの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"商号や商標の使用権とともに，一定地域内での商品の独占販売権を与える。"},{"label":"イ","html":"自社で半導体製品の企画，設計から製造までを一貫して行い，それを自社ブランドで販売する。"},{"label":"ウ","html":"製造設備をもたず，半導体製品の企画，設計及び開発を専門に行う。"},{"label":"エ","html":"他社からの製造委託を受けて，半導体製品の製造を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファウンドリサービスとは，自らは製品の企画・設計を行わず，他社（ファブレス企業など）から半導体製品の製造委託を受けて，製造だけを専門に請け負う事業形態であり，エが正しい説明である。台湾のTSMCなどが代表例とされる。</p><p>アはフランチャイズ契約の説明である。</p><p>イは，設計から製造・自社ブランドでの販売まで一貫して自社で行うIDM（垂直統合型デバイスメーカー）の説明で，ファウンドリとは正反対の業態である。</p><p>ウは逆に，製造設備を持たず企画・設計に特化し，製造をファウンドリに委託する側の企業形態（ファブレス）の説明であり，製造を請け負うファウンドリ自身の説明ではない。</p>","mnemonic":""},{"id":355,"year":2019,"period":"令和元年度秋期","num":26,"cat":"ストラテジ系","field":"PPM花形","summary":"PPM花形：令和元年度秋期 問26","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>プロダクトポートフォリオマネジメント（PPM）における\"花形\"を説明したものはどれか。</p>","choices":[{"label":"ア","html":"市場成長率，市場占有率ともに高い製品である。成長に伴う投資も必要とするので，資金創出効果は大きいとは限らない。"},{"label":"イ","html":"市場成長率，市場占有率ともに低い製品である。資金創出効果は小さく，資金流出量も少ない。"},{"label":"ウ","html":"市場成長率は高いが，市場占有率が低い製品である。長期的な将来性を見込むことはできるが，資金創出効果の大きさは分からない。"},{"label":"エ","html":"市場成長率は低いが，市場占有率は高い製品である。資金創出効果が大きく，企業の支柱となる資金源である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PPM（プロダクト・ポートフォリオ・マネジメント，BCGが提唱したフレームワーク）における「花形（スター）」は，市場成長率・市場占有率がともに高い製品・事業を指す。ただし成長を維持するために継続的な設備投資や販促投資が必要となるため，資金の流入は大きくても流出も大きく，差し引きの資金創出効果（キャッシュフロー）は必ずしも大きいとは限らない，というアの説明が正しい。</p><p>イは「負け犬」の説明（成長率・占有率ともに低い）である。</p><p>ウは「問題児」の説明（成長率は高いが占有率が低く，将来性はあるが資金創出力は未知数で，むしろ投資負担から資金流出傾向になりやすい）である。</p><p>エは「金のなる木」の説明（成長率は低いが占有率が高く，追加投資が少なく済むため資金創出効果が大きい，企業の資金源）であり，いずれも花形とは異なる象限の説明である。</p>","mnemonic":""},{"id":356,"year":2019,"period":"令和元年度秋期","num":27,"cat":"ストラテジ系","field":"CRM","summary":"CRM：令和元年度秋期 問27","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>CRMを説明したものはどれか。</p>","choices":[{"label":"ア","html":"卸売業者・メーカが，小売店の経営活動を支援してその売上と利益を伸ばすことによって，自社との取引拡大につなげる方法である。"},{"label":"イ","html":"企業全体の経営資源を有効かつ総合的に計画して管理し，経営の高効率化を図るための手法である。"},{"label":"ウ","html":"企業内の全ての顧客チャネルで情報を共有し，サービスのレベルを引き上げて顧客満足度を高め，顧客ロイヤルティの最大化に結び付ける考え方である。"},{"label":"エ","html":"生産，在庫，購買，販売，物流などの全ての情報をリアルタイムに交換することによって，サプライチェーン全体の効率を大幅に向上させる経営手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CRM（カスタマー・リレーションシップ・マネジメント，顧客関係管理）は，企業内のあらゆる顧客接点（チャネル）から得られる顧客情報を一元的に共有・分析し，サービス品質を高めることで顧客満足度とロイヤルティ（愛顧・再購買意欲）を最大化しようとする経営の考え方であり，ウが正しい説明である。</p><p>アは卸売業者・メーカが小売店を支援するリテールサポート（帳合取引拡大策）の説明である。</p><p>イは経営資源を全社的・統合的に計画・管理するERP（企業資源計画）の説明である。</p><p>エは供給網全体の情報をリアルタイムに共有し効率化するSCM（サプライチェーンマネジメント）の説明であり，いずれもCRMとは異なる経営管理手法を指している。</p>","mnemonic":""},{"id":357,"year":2019,"period":"令和元年度秋期","num":28,"cat":"ストラテジ系","field":"RPA","summary":"RPA：令和元年度秋期 問28","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>RPA（Robotic Process Automation）の説明はどれか。</p>","choices":[{"label":"ア","html":"ホワイトカラーの単純な間接作業を，ルールエンジンや認知技術などを活用して代行するソフトウェア"},{"label":"イ","html":"自動制御によって，対象物をつかみ，動かす機能や，自動的に移動できる機能を有し，また，各種の作業をプログラムによって実行できる産業用ロボット"},{"label":"ウ","html":"車両の状態や周囲の環境を認識し，利用者が行き先を指定するだけで自律的な走行を可能とするレーダ，GPS，カメラなどの自動運転関連機器"},{"label":"エ","html":"人の生活と同じ空間で安全性を確保しながら，食事，清掃，移動，コミュニケーションなどの生活支援に使用されるロボット"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RPA（ロボティック・プロセス・オートメーション）は，ルールエンジンや画面認識，AI（認知技術）などの既存技術を組み合わせ，人間（主にホワイトカラー）がパソコン上で行っていた定型的な間接業務（データ入力・転記・集計など）をソフトウェアロボットが代行する仕組みであり，アがその説明に一致する。「仮想知的労働者」「デジタルレイバー」とも呼ばれる。</p><p>イは工場の組立・搬送などの物理的作業を行う産業用ロボットの説明である。</p><p>ウは自動運転関連機器の説明である。</p><p>エは生活支援ロボット（介護・サービスロボット）の説明であり，いずれも物理的な機械・ロボットを指しているのに対し，RPAはあくまでソフトウェアである点が決定的な違いである。</p>","mnemonic":""},{"id":358,"year":2019,"period":"令和元年度秋期","num":29,"cat":"ストラテジ系","field":"損益分岐点","summary":"損益分岐点：令和元年度秋期 問29","correct":"ア","result":"","formula":"限界利益率＝(売上高－変動費)／売上高，損益分岐点売上高＝固定費／限界利益率，安全余裕率＝1－損益分岐点売上高／売上高","howto":"両社の限界利益率→損益分岐点売上高→安全余裕率の順に計算して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>損益分岐点分析でA社とB社を比較した記述のうち，適切なものはどれか。</p><table border=\"1\" cellpadding=\"4\"><tr><th></th><th>A社</th><th>B社</th></tr><tr><td>売上高</td><td>2,000</td><td>2,000</td></tr><tr><td>変動費</td><td>800</td><td>1,400</td></tr><tr><td>固定費</td><td>900</td><td>300</td></tr><tr><td>営業利益</td><td>300</td><td>300</td></tr></table><p>（単位：万円）</p>","choices":[{"label":"ア","html":"安全余裕率はB社の方が高い。"},{"label":"イ","html":"売上高が両社とも3,000万円である場合，営業利益はB社の方が高い。"},{"label":"ウ","html":"限界利益率はB社の方が高い。"},{"label":"エ","html":"損益分岐点売上高はB社の方が高い。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A社：限界利益＝2,000－800＝1,200，限界利益率＝1,200／2,000＝60%。損益分岐点売上高＝固定費900÷60%＝1,500万円。安全余裕率＝1－1,500／2,000＝25%。</p><p>B社：限界利益＝2,000－1,400＝600，限界利益率＝600／2,000＝30%。損益分岐点売上高＝固定費300÷30%＝1,000万円。安全余裕率＝1－1,000／2,000＝50%。</p><p>B社の安全余裕率（50%）はA社（25%）より高いので，アが正しい。</p><p>(参考)売上高が両社とも3,000万円の場合：A社の営業利益＝3,000×60%－900＝900万円，B社の営業利益＝3,000×30%－300＝600万円となりA社の方が高いため，イは誤り。限界利益率はA社60%＞B社30%なのでウも誤り。損益分岐点売上高はA社1,500＞B社1,000なのでエも誤り。</p>","mnemonic":"固定費が軽いB社(300)は売上が落ちても倒れにくい―安全余裕率はB社が5割，A社は2割5分で踏ん張る。"},{"id":359,"year":2019,"period":"令和元年度秋期","num":30,"cat":"ストラテジ系","field":"著作権法","summary":"著作権法：令和元年度秋期 問30","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>プログラムの著作物について，著作権法上，適法である行為はどれか。</p>","choices":[{"label":"ア","html":"海賊版を複製したプログラムと事前に知りながら入手し，業務で使用した。"},{"label":"イ","html":"業務処理用に購入したプログラムを複製し，社内教育用として各部門に配布した。"},{"label":"ウ","html":"職務著作のプログラムを，作成した担当者が独断で複製し，他社に貸与した。"},{"label":"エ","html":"処理速度を向上させるために，購入したプログラムを改変した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>著作権法第47条の3では，プログラムの著作物の複製物を正当に所有する者は，自らその著作物を電子計算機で利用するために必要と認められる限度において，複製又は翻案（改変）をすることができると規定されている。処理速度向上のための改変は，まさに自ら利用するために必要な範囲の翻案（最適化）に該当し適法となるため，エが正しい。</p><p>アは海賊版と知りながら取得・業務使用する行為であり，著作権法上の侵害に当たる（いわゆる「みなし侵害」規定に該当しうる）。</p><p>イは，購入した1本のライセンスを複製して社内の複数部門に配布する行為であり，許諾を超えた複製にあたり著作権侵害となる。</p><p>ウは，職務著作（法人著作）の場合，著作権は通常使用者（会社）に帰属するため，従業員個人が独断で複製し他社に貸与する行為は，会社の許諾を得ない無断利用であり著作権侵害となる。</p>","mnemonic":""},{"id":360,"year":2019,"period":"平成31年度春期","num":1,"cat":"テクノロジ系","field":"2進数と論理演算","summary":"2進数と論理演算：平成31年度春期 問1","correct":"ア","result":"","formula":"next(n) = (n+1) AND 255 (8ビットマスクで9ビット目を切り捨てる)","howto":"n=255のとき n+1=256(=100000000₂)が0に戻るかをANDマスクで確認し、n<255のときn+1がそのまま保たれるかを確認する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>0以上255以下の整数 n に対して、</p><p>next(n) = n+1 (0≦n&lt;255のとき)、next(n) = 0 (n=255のとき)</p><p>と定義する。next(n)と等しい式はどれか。ここで、x AND y 及び x OR y は、それぞれ x と y を2進数表現にして、桁ごとの論理積及び論理和をとったものとする。</p>","choices":[{"label":"ア","html":"(n+1) AND 255"},{"label":"イ","html":"(n+1) AND 256"},{"label":"ウ","html":"(n+1) OR 255"},{"label":"エ","html":"(n+1) OR 256"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>next(n)は「255までは1ずつ増え、255になったら0に戻る」8ビットカウンタの動きを表している。</p><p>n&lt;255のとき、n+1は1〜255の範囲に収まる。255=11111111₂(8ビット全て1)なので、(n+1) AND 255 は n+1 自身の値をそのまま残す。</p><p>n=255のとき、n+1=256=100000000₂(9ビット目だけが1)。これと255=011111111₂の論理積を取ると、1が共通する桁が存在しないため結果は0になる。</p><p>以上より (n+1) AND 255 はn<255でも n=255でもnext(n)と一致する。イの AND 256 はn+1が256未満のときは常に0になってしまい誤り。ウ・エのORを使う式はn+1の値をそのまま通すどころか余分なビットを立ててしまい、255や256に固定されてしまうため誤りである。</p>","mnemonic":"「255はフル8ビット、256は9ビット目だけポツン」―ANDでその9ビット目を消せば次のnextが0に戻る、が合言葉。"},{"id":361,"year":2019,"period":"平成31年度春期","num":2,"cat":"テクノロジ系","field":"ディープラーニング","summary":"ディープラーニング：平成31年度春期 問2","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>AIにおけるディープラーニングに関する記述として、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"あるデータから結果を求める処理を、人間の脳神経回路のように多層の処理を重ねることによって、複雑な判断をできるようにする。"},{"label":"イ","html":"大量のデータからまだ知られていない新たな規則や仮説を発見するために、想定値から大きく外れている例外事項を取り除きながら分析を繰り返す手法である。"},{"label":"ウ","html":"多様なデータや大量のデータに対して、三段論法、統計的手法やパターン認識手法を組み合わせることによって、高度なデータ分析を行う手法である。"},{"label":"エ","html":"知識がルールに従って表現されており、演繹手法を利用した推論によって有意な結論を導く手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ディープラーニング(深層学習)は、人間の脳神経回路(ニューロン)を模したニューラルネットワークを多層(ディープ)に重ねることで、入力データから特徴量を段階的に自動抽出し、複雑な判断や認識を行えるようにする機械学習の手法である。画像認識や音声認識などで飛躍的な精度向上をもたらした。</p><p>選択肢アは、まさにこの「多層の処理を重ねて複雑な判断を可能にする」という深層学習の核心を的確に表現しており正解である。</p><p>イは、データマイニングにおける外れ値除去を伴う規則発見の説明であり、深層学習固有の特徴ではない。ウは三段論法(演繹推論)まで含めた統計・パターン認識の一般的なデータ分析手法の説明で、深層学習の本質である「多層ニューラルネットワーク」に言及していない点で不適切。エは知識をルールとして明示的に表現し演繹推論する、エキスパートシステムなどのルールベースAIの説明であり、データから特徴を自動学習する深層学習とは対照的なアプローチなので誤りである。</p>","mnemonic":""},{"id":362,"year":2019,"period":"平成31年度春期","num":3,"cat":"テクノロジ系","field":"シェルソート","summary":"シェルソート：平成31年度春期 問3","correct":"ア","result":"","formula":"手順(3)の実行回数 = Hが[H÷3]を経て0になるまでの除算回数","howto":"データ数9からH=[9/3]=3でスタートし、(2)→(3)→(4)のループで H=3→1→0 と変化する過程を数える","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>次の手順はシェルソートによる整列を示している。データ列 7, 2, 8, 3, 1, 9, 4, 5, 6 を手順(1)〜(4)に従って整列するとき、手順(3)を何回繰り返して完了するか。ここで、[ ] は小数点以下を切り捨てた結果を表す。</p><p>[手順]</p><p>(1) \"H ← [データ数÷3]\" とする。</p><p>(2) データ列を、互いに H 要素分だけ離れた要素の集まりから成る部分列とし、それぞれの部分列を、挿入法を用いて整列する。</p><p>(3) \"H ← [H÷3]\" とする。</p><p>(4) H が0であればデータ列の整列は完了し、0でなければ(2)に戻る。</p>","choices":[{"label":"ア","html":"2"},{"label":"イ","html":"3"},{"label":"ウ","html":"4"},{"label":"エ","html":"5"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>データ数は9個なので、手順(1)で H ← [9÷3] = 3 となる。</p><p>1回目のループ: 手順(2)でH=3として部分列整列を行う。手順(3)の1回目の実行で H ← [3÷3] = 1。手順(4)でHは0でないため(2)へ戻る。</p><p>2回目のループ: 手順(2)でH=1として(ほぼ通常の挿入ソートに相当する)整列を行う。手順(3)の2回目の実行で H ← [1÷3] = 0。手順(4)でHが0になったので整列は完了する。</p><p>したがって手順(3)が実行されたのは合計2回であり、正解はアの2である。</p>","mnemonic":"「9を3で割って3、3を3で割って1、1を3で割ったら0」―わり算の儀式は3段だが手順(3)が動くのは最初の2回だけ。"},{"id":363,"year":2019,"period":"平成31年度春期","num":4,"cat":"テクノロジ系","field":"スーパースカラ","summary":"スーパースカラ：平成31年度春期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>スーパースカラの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"一つのチップ内に複数のプロセッサコアを実装し、複数のスレッドを並列に実行する。"},{"label":"イ","html":"一つのプロセッサコアで複数のスレッドを切り替えて並列に実行する。"},{"label":"ウ","html":"一つの命令で、複数の異なるデータに対する演算を、複数の演算器を用いて並列に実行する。"},{"label":"エ","html":"並列実行可能な複数の命令を、複数の演算器に振り分けることによって並列に実行する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スーパースカラ(superscalar)とは、1つのプロセッサコアの中に複数の演算器(パイプライン)を備え、命令間の依存関係がなく並列実行可能な複数の命令を同時に複数の演算器に振り分けて実行することで、1クロックあたりの実行命令数(IPC)を高める高速化技術である。選択肢エはこの定義そのものであり正解。</p><p>アは1チップに複数のコアを搭載するマルチコア(チップマルチプロセッサ)の説明であり、スーパースカラとは異なる並列化手法である。イは1コアで複数スレッドの実行状態を高速に切り替える(あるいは同時実行する)マルチスレッディング/SMTの説明。ウは1つの命令で複数データに同じ演算を適用するSIMD(ベクトル演算)の説明であり、いずれも「複数の異なる命令」を並列化するスーパースカラの特徴とは区別される。</p>","mnemonic":""},{"id":364,"year":2019,"period":"平成31年度春期","num":5,"cat":"テクノロジ系","field":"システム性能計算","summary":"システム性能計算：平成31年度春期 問5","correct":"ア","result":"","formula":"処理件数/秒 = min(サーバの処理能力, ネットワークの転送能力)","howto":"サーバ側は100MIPS÷100万命令/件、ネットワーク側は8×10⁷ビット/秒÷(2×10⁵バイト×8ビット/件)をそれぞれ計算し、小さい方を採る","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>あるクライアントサーバシステムにおいて、クライアントから要求された1件の検索を処理するために、サーバで平均100万命令が実行される。1件の検索につき、ネットワーク内で転送されるデータは平均2×10⁵バイトである。このサーバの性能は100 MIPSであり、ネットワークの転送速度は8×10⁷ビット/秒である。このシステムにおいて、1秒間に処理できる検索要求は何件か。ここで、処理できる件数は、サーバとネットワークの処理能力だけで決まるものとする。また、1バイトは8ビットとする。</p>","choices":[{"label":"ア","html":"50"},{"label":"イ","html":"100"},{"label":"ウ","html":"200"},{"label":"エ","html":"400"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サーバの処理能力: 100 MIPS = 1秒間に1億(10⁸)命令を実行できる。1件の検索に100万(10⁶)命令必要なので、1秒間に処理できる件数は 10⁸ ÷ 10⁶ = 100件。</p><p>ネットワークの処理能力: 1件あたりの転送データ量は 2×10⁵ バイト × 8 ビット/バイト = 1.6×10⁶ ビット。ネットワークの転送速度は 8×10⁷ ビット/秒なので、1秒間に転送できる件数は 8×10⁷ ÷ 1.6×10⁶ = 50件。</p><p>サーバは100件/秒処理できるが、ネットワークは50件/秒しか転送できないため、システム全体として1秒間に処理できる件数はボトルネックとなるネットワーク側の50件に制限される。よって正解はアの50である。</p>","mnemonic":"「ひゃく万命令は余裕のひゃく(100)件、でもネットは一点六メガ(1.6×10⁶)ビットで頭打ちの五十(50)件」―小さい方が答え。"},{"id":365,"year":2019,"period":"平成31年度春期","num":6,"cat":"テクノロジ系","field":"デッドロック","summary":"デッドロック：平成31年度春期 問6","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>二つのタスクが共用する二つの資源を排他的に使用するとき、デッドロックが発生するおそれがある。このデッドロックの発生を防ぐ方法はどれか。</p>","choices":[{"label":"ア","html":"一方のタスクの優先度を高くする。"},{"label":"イ","html":"資源獲得の順序を両方のタスクで同じにする。"},{"label":"ウ","html":"資源獲得の順序を両方のタスクで逆にする。"},{"label":"エ","html":"両方のタスクの優先度を同じにする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>デッドロックは、複数のタスクが互いに相手の確保している資源の解放を待ち続け、処理が先に進まなくなる状態であり、発生条件の一つに「循環待ち(資源獲得順序の食い違いによってタスク間で待ちの輪ができること)」がある。</p><p>資源獲得の順序を全てのタスクで統一(同じ順序)にすれば、どのタスクも常に同じ順番で資源を確保しようとするため、互いに相手の資源を待ち合う循環待ちの状態が構造的に発生しなくなる。したがってイが正解である。</p><p>逆にウのように獲得順序をタスクごとに逆にすると、一方が資源Aを確保して資源Bを待ち、他方が資源Bを確保して資源Aを待つという典型的なデッドロックを招きやすくなるため誤り。ア・エのようなタスクの優先度の高低・同一化は、スケジューリング上の問題(優先度逆転など)には関係するが、資源の循環待ちそのものを防ぐ仕組みではないため、デッドロック防止策としては適切ではない。</p>","mnemonic":""},{"id":366,"year":2019,"period":"平成31年度春期","num":7,"cat":"テクノロジ系","field":"論理回路","summary":"論理回路：平成31年度春期 問7","correct":"ウ","result":"","formula":"左の回路: E=A AND B AND C、F=B AND C AND D / 右の回路: E=A OR B OR C、F=B OR C OR D","howto":"各選択肢の入力値を左右それぞれの式に代入し、与えられたE,Fの値と一致するかどうかを両方の回路で確認して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>次の二つの回路の入力に値を与えたとき、表の入力 A, B, C, D と出力 E, F の組合せのうち、全ての素子が論理積素子で構成された左側の回路でだけ成立するものはどれか。</p><p>【左側の回路(全ての素子が論理積素子(AND)で構成)】B と C が1つ目のAND素子に入力され、その出力と A が2つ目のAND素子に入力されて E を出力する(E = A AND B AND C)。B と C の1つ目のAND素子の出力と D が3つ目のAND素子に入力されて F を出力する(F = B AND C AND D)。</p><p>【右側の回路(配線は左と同じだが、全ての素子が論理和素子(OR)で構成)】E = A OR B OR C、F = B OR C OR D となる。</p>","choices":[{"label":"ア","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th colspan='4'>入力</th><th colspan='2'>出力</th></tr><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr></table>"},{"label":"イ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th colspan='4'>入力</th><th colspan='2'>出力</th></tr><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>"},{"label":"ウ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th colspan='4'>入力</th><th colspan='2'>出力</th></tr><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td></tr></table>"},{"label":"エ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th colspan='4'>入力</th><th colspan='2'>出力</th></tr><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>左側の回路は E = A AND B AND C、F = B AND C AND D であり、右側の回路は E = A OR B OR C、F = B OR C AND D(厳密には OR)である。</p><p>選択肢ウ(A=1,B=1,C=0,D=1,E=0,F=0)を左の式に当てはめると、E = 1 AND 1 AND 0 = 0(一致)、F = 1 AND 0 AND 1 = 0(一致)となり、左側の回路の動作と矛盾しない。一方、右の式では E = 1 OR 1 OR 0 = 1 となり、与えられた E=0 と矛盾するため、右側の回路ではこの組合せは成立しない。つまりウは「左側の回路でだけ」成立する組合せであり正解となる。</p><p>他の選択肢を確認すると、ア(全て0)とエ(全て1)は、AND・OR双方の式で同じ結果(全て0、または全て1)になるため、左右どちらの回路でも成立してしまい「左側だけ」という条件を満たさない。イ(A=0,B=0,C=1,D=1,E=1,F=1)は、左の式では E=0 AND 0 AND 1=0 となり与えられたE=1と矛盾するため、そもそも左側の回路ですら成立しない。</p>","mnemonic":"「イチイチゼロイチでゼロゼロ(A=1,B=1,C=0,D=1→E=0,F=0)」―ANDなら筋が通るがORなら1になってしまう、この食い違いが左専用の証拠。"},{"id":367,"year":2019,"period":"平成31年度春期","num":8,"cat":"テクノロジ系","field":"レンダリング","summary":"レンダリング：平成31年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>コンピュータグラフィックスにおける、レンダリングに関する記述として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"異なる色のピクセルを混ぜて配置することによって、中間色を表現すること"},{"label":"イ","html":"複数の静止画を1枚ずつ連続表示することによって、動画を作ること"},{"label":"ウ","html":"物体の表面に陰影を付けたり、光を反射させたりして、画像を作ること"},{"label":"エ","html":"物体をワイヤフレーム、ポリゴンなどを用いて、モデル化すること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>レンダリングとは、3次元のモデルデータ(形状・材質・光源などの情報)から、光の反射や陰影計算(シェーディング)を行い、最終的な2次元の画像を生成する処理のことである。選択肢ウはこの「陰影付け・光の反射計算によって画像を作る」という内容を正しく表しており正解である。</p><p>アは複数色のピクセルを混在させて中間色を疑似的に表現するディザリングの説明、イは静止画を連続表示して動画を作るアニメーションの原理の説明であり、いずれもレンダリングとは別の技術・工程を指す。エはワイヤフレームやポリゴンを用いて立体形状を数値データとして作成するモデリングの説明であり、レンダリングの前段階の工程にあたるため、レンダリングそのものの説明としては不適切である。</p>","mnemonic":""},{"id":368,"year":2019,"period":"平成31年度春期","num":9,"cat":"テクノロジ系","field":"ACID特性","summary":"ACID特性：平成31年度春期 問9","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>トランザクションのACID特性のうち、一貫性(consistency)の説明はどれか。</p>","choices":[{"label":"ア","html":"整合性の取れたデータベースに対して、トランザクション実行後も整合性が取れている性質である。"},{"label":"イ","html":"同時実行される複数のトランザクションは互いに干渉しないという性質である。"},{"label":"ウ","html":"トランザクションは、完全に実行が完了するか、全く実行されなかったかの状態しかとらない性質である。"},{"label":"エ","html":"ひとたびコミットすれば、その後どのような障害が起こっても状態の変更が保たれるという性質である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ACID特性は、トランザクション処理が満たすべき4つの性質、原子性(Atomicity)、一貫性(Consistency)、独立性(Isolation)、永続性(Durability)の頭文字をとったものである。このうち一貫性(Consistency)は、データベースに定義された制約(整合性制約)を、トランザクションの実行前後で常に満たし続けることを意味する。すなわち、整合性の取れた状態からトランザクションを実行しても、結果として整合性の取れた別の状態に遷移するという性質であり、選択肢アがこれに合致し正解である。</p><p>イは複数トランザクションが互いに干渉しないという独立性(Isolation)の説明、ウは「全て実行されるか全く実行されないか」という原子性(Atomicity)の説明、エはコミット後に変更が障害によらず保持され続けるという永続性(Durability)の説明であり、いずれも一貫性とは別のACID特性を指しているため誤りである。</p>","mnemonic":""},{"id":369,"year":2019,"period":"平成31年度春期","num":10,"cat":"テクノロジ系","field":"NAPT","summary":"NAPT：平成31年度春期 問10","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>プライベートIPアドレスを割り当てられたPCがNAPT(IPマスカレード)機能をもつルータを経由して、インターネット上のWebサーバにアクセスしている。Webサーバからのパケットに含まれるヘッダ情報のうち、このルータで書き換えられるフィールドの組合せとして、適切なものはどれか。ここで、表中の○はフィールドの情報が書き換えられることを表す。</p>","choices":[{"label":"ア","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>宛先IPアドレス</th><th>送信元IPアドレス</th><th>宛先ポート番号</th><th>送信元ポート番号</th></tr><tr><td>○</td><td>○</td><td></td><td></td></tr></table>"},{"label":"イ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>宛先IPアドレス</th><th>送信元IPアドレス</th><th>宛先ポート番号</th><th>送信元ポート番号</th></tr><tr><td>○</td><td></td><td>○</td><td></td></tr></table>"},{"label":"ウ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>宛先IPアドレス</th><th>送信元IPアドレス</th><th>宛先ポート番号</th><th>送信元ポート番号</th></tr><tr><td></td><td>○</td><td></td><td>○</td></tr></table>"},{"label":"エ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>宛先IPアドレス</th><th>送信元IPアドレス</th><th>宛先ポート番号</th><th>送信元ポート番号</th></tr><tr><td></td><td></td><td>○</td><td>○</td></tr></table>"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NAPT(IPマスカレード)は、1つのグローバルIPアドレスを複数のプライベートIPアドレスのPCで共有するために、IPアドレスだけでなくポート番号も合わせて変換する仕組みである。Webサーバから届く応答パケットは、ルータのグローバルIPアドレス・ルータが割り当てた変換後のポート番号宛てに届く。</p><p>このパケットをPCへ正しく届けるために、ルータは「宛先IPアドレス」(自分のグローバルIPアドレスから、本来のPCのプライベートIPアドレスへ)と「宛先ポート番号」(変換用にルータが割り当てたポート番号から、PCが元々使っていたポート番号へ)の2つを書き換える必要がある。</p><p>一方、パケットの送信元であるWebサーバのIPアドレスやポート番号(通常80番など)は、ルータが変換する対象ではなく、サーバが設定した値のまま素通りする。したがって書き換えられるのは「宛先IPアドレス」と「宛先ポート番号」の組合せであるイが正解となる。送信元側を書き換えるア・ウ・エはいずれもNAPTの動作と矛盾する。</p>","mnemonic":""},{"id":370,"year":2019,"period":"平成31年度春期","num":11,"cat":"テクノロジ系","field":"MAC/IPアドレス","summary":"MAC/IPアドレス：平成31年度春期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>図のようなIPネットワークのLAN環境で、ホストAからホストBにパケットを送信する。LAN1において、パケット内のイーサネットフレームの宛先とIPデータグラムの宛先の組合せとして、適切なものはどれか。ここで、図中のMACn/IPmはホスト又はルータがもつインタフェースのMACアドレスとIPアドレスを示す。</p><p>【構成】LAN1上にホストA(MAC1/IP1)とルータのLAN1側インタフェース(MAC3/IP3)が接続されている。ルータのLAN2側インタフェース(MAC4/IP4)とホストB(MAC2/IP2)はLAN2上に接続されている。</p>","choices":[{"label":"ア","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>イーサネットフレームの宛先</th><th>IPデータグラムの宛先</th></tr><tr><td>MAC2</td><td>IP2</td></tr></table>"},{"label":"イ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>イーサネットフレームの宛先</th><th>IPデータグラムの宛先</th></tr><tr><td>MAC2</td><td>IP3</td></tr></table>"},{"label":"ウ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>イーサネットフレームの宛先</th><th>IPデータグラムの宛先</th></tr><tr><td>MAC3</td><td>IP2</td></tr></table>"},{"label":"エ","html":"<table border='1' cellspacing='0' cellpadding='4'><tr><th>イーサネットフレームの宛先</th><th>IPデータグラムの宛先</th></tr><tr><td>MAC3</td><td>IP3</td></tr></table>"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IP通信では、IPデータグラムの宛先アドレスは送信元から最終的な宛先ホストまで経路上で変化しない(エンドツーエンドで一貫)のに対し、イーサネットフレームの宛先MACアドレスは、ホップ(1つの物理区間)ごとに、その区間での次の転送先(次ホップ)のMACアドレスに書き換えられる。</p><p>ホストBはLAN1上には存在せず、LAN2上にあるため、ホストAはパケットを直接ホストBに送ることができず、同一LAN1上にあるルータ(デフォルトゲートウェイ)経由で送る必要がある。したがってLAN1区間でのイーサネットフレームの宛先MACアドレスは、次ホップであるルータのLAN1側インタフェースのMAC3になる。</p><p>一方、IPデータグラムの宛先IPアドレスは経路上で変化しないため、最終的な宛先ホストであるホストBのIP2のままである。したがって正解は「MAC3、IP2」の組合せであるウとなる。アやエのようにMAC・IPどちらも同じ対象(ホストBまたはルータ)を指す組合せは、MACアドレスとIPアドレスの役割の違い(区間ごとの転送先か、最終宛先か)を反映しておらず誤りである。</p>","mnemonic":""},{"id":371,"year":2019,"period":"平成31年度春期","num":12,"cat":"テクノロジ系","field":"リスクベース認証","summary":"リスクベース認証：平成31年度春期 問12","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>リスクベース認証の特徴はどれか。</p>","choices":[{"label":"ア","html":"いかなる環境からの認証の要求においても認証方法を変更せずに、同一の手順によって普段どおりにシステムが利用できる。"},{"label":"イ","html":"ハードウェアトークンとパスワードを併用させるなど、認証要求元の環境によらず常に二つの認証方式を併用することによって、安全性を高める。"},{"label":"ウ","html":"普段と異なる環境からのアクセスと判断した場合、追加の本人認証をすることによって、不正アクセスに対抗し安全性を高める。"},{"label":"エ","html":"利用者が認証情報を忘れ、かつ、Webブラウザに保存しているパスワード情報も使用できない場合でも、救済することによって、利用者は普段どおりにシステムを利用できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>リスクベース認証とは、利用者がいつも使っているIPアドレスや端末、アクセス時間帯などの利用状況・環境の情報をもとに、通常のアクセスかどうかをシステムが自動的に判定し、普段と異なる(リスクが高いと判断される)環境からのアクセスがあった場合にのみ、追加の本人確認(ワンタイムパスワードや秘密の質問など)を要求する認証方式である。</p><p>選択肢ウは、この「普段と異なる環境からのアクセスと判断した場合に追加認証を行う」という仕組みを正確に表しており正解である。この方式の利点は、リスクが低い通常のアクセスでは追加の手間をかけずに利便性を保ちつつ、リスクが高いと判断された場合にだけ安全性を高められる点にある。</p><p>アは環境によらず常に同一の認証手順しか使わない方式であり、リスクに応じた制御を行わない点でリスクベース認証とは異なる。イは環境を問わず常に二要素認証を要求する方式であり、これもリスク判定に基づく可変的な制御とは言えないため誤り。エは認証情報忘失時の救済機能の説明であり、アクセス環境のリスク評価とは無関係なので該当しない。</p>","mnemonic":""},{"id":372,"year":2019,"period":"平成31年度春期","num":13,"cat":"テクノロジ系","field":"ディジタルフォレンジックス","summary":"ディジタルフォレンジックス：平成31年度春期 問13","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ディジタルフォレンジックスの手順を収集、検査、分析、報告に分けたとき、そのいずれかに該当するものはどれか。</p>","choices":[{"label":"ア","html":"サーバとネットワーク機器のログをログ管理サーバに集約し、リアルタイムに相関分析することによって、不正アクセスを検出する。"},{"label":"イ","html":"ディスクを解析し、削除されたログファイルを復元することによって、不正アクセスの痕跡を発見する。"},{"label":"ウ","html":"電子メールを外部に送る際に、本文及び添付ファイルを暗号化することによって、情報漏えいを防ぐ。"},{"label":"エ","html":"プログラムを実行する際に、プログラムファイルのハッシュ値と脅威情報を突き合わせることによって、マルウェアを発見する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ディジタルフォレンジックスとは、不正アクセスや情報漏えいなどのインシデント発生後に、コンピュータやネットワーク機器などに残された電磁的記録(デジタル証拠)を収集・解析し、原因究明や法的証拠としての活用に役立てる一連の技術・手続きのことで、一般に「収集」「検査」「分析」「報告」という段階に分けられる。</p><p>選択肢イの「ディスクを解析し、削除されたログファイルを復元して不正アクセスの痕跡を発見する」は、保存されているデータから関連性のある情報を取り出し整理する「検査」の段階に該当する行為であり、ディジタルフォレンジックスの手順の一つとして正解となる。</p><p>アはログをリアルタイムに相関分析して不正アクセスを検出するSIEM的な監視・検知の活動であり、インシデント発生後の証拠保全・解析というフォレンジックスの枠組みとは性質が異なる。ウは電子メールの暗号化という事前の漏えい防止策(予防的統制)、エはハッシュ値照合によるマルウェア検知という技術的対策であり、いずれも証拠の収集・解析を行うディジタルフォレンジックスの手順そのものではないため該当しない。</p>","mnemonic":""},{"id":373,"year":2019,"period":"平成31年度春期","num":14,"cat":"テクノロジ系","field":"サンドボックス","summary":"サンドボックス：平成31年度春期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>情報セキュリティにおけるサンドボックスの説明はどれか。</p>","choices":[{"label":"ア","html":"OS、DBMS、アプリケーションソフトウェア、ネットワーク機器など多様なソフトウェアや機器が出力する大量のログデータを分析する。"},{"label":"イ","html":"Webアプリケーションの入力フォームへの入力データに含まれるHTMLタグ、JavaScript、SQL文などを他の文字列に置き換えることによって、入力データ中に含まれる悪意のあるプログラムの実行を防ぐ。"},{"label":"ウ","html":"Webサーバの前段に設置し、不特定多数のPCから特定のWebサーバへのリクエストに代理応答する。"},{"label":"エ","html":"不正な動作をする可能性があるプログラムを特別な領域で動作させることによって、他の領域に悪影響が及ぶのを防ぐ。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サンドボックスとは「砂場」を語源とする仕組みで、出所が不明なプログラムや不審なファイルを、通常の実行環境から隔離された特別な仮想環境(保護された領域)の中で実際に動作させ、その挙動(ファイル作成・書き換え、外部通信の有無など)を観察・分析する技術である。万が一マルウェアであっても、隔離された領域内にとどめることで、実際のシステムや他の領域への悪影響を防ぐことができる。</p><p>選択肢エはこの「特別な領域でプログラムを動作させ、他の領域への悪影響を防ぐ」という内容を正確に表しており正解である。</p><p>アは多様な機器のログを分析するSIEM(ログ相関分析基盤)の説明、イは入力データ中の危険な文字列を無害化するサニタイジング(エスケープ処理、WAF等が行う対策)の説明、ウは特定のWebサーバへのリクエストを代理で処理するリバースプロキシの説明であり、いずれも隔離実行によって安全性を確保するサンドボックスとは異なる仕組みである。</p>","mnemonic":""},{"id":374,"year":2019,"period":"平成31年度春期","num":15,"cat":"テクノロジ系","field":"WAF","summary":"WAF：平成31年度春期 問15","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>WAFの説明はどれか。</p>","choices":[{"label":"ア","html":"Webアプリケーションへの攻撃を検知し、阻止する。"},{"label":"イ","html":"Webブラウザの通信内容を改ざんする攻撃をPC内で監視し、検出する。"},{"label":"ウ","html":"サーバのOSへの不正なログインを監視する。"},{"label":"エ","html":"ファイルへのマルウェア感染を監視し、検出する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>WAF(Web Application Firewall)は、Webサーバの前段に設置され、SQLインジェクションやクロスサイトスクリプティング(XSS)といったWebアプリケーション層への攻撃パターンを通信内容から検知し、不正なリクエストを遮断することで、Webアプリケーションを保護するセキュリティ機器・機能である。選択肢アがこの説明そのものであり正解。</p><p>イはPC内でブラウザとサーバ間の通信改ざん(MITB攻撃など)をPC側で監視する仕組みの説明であり、WAFがサーバ側で行う防御とは監視対象・設置位置が異なる。ウはOSへの不正ログイン監視を行うIDS(不正侵入検知システム)などの役割、エはマルウェア感染を検出するアンチウイルスソフトの役割であり、いずれもWebアプリケーションそのものへの攻撃を対象とするWAFとは異なる機能である。</p>","mnemonic":""},{"id":375,"year":2019,"period":"平成31年度春期","num":16,"cat":"テクノロジ系","field":"フェールセーフ","summary":"フェールセーフ：平成31年度春期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>フェールセーフの考えに基づいて設計したものはどれか。</p>","choices":[{"label":"ア","html":"乾電池のプラスとマイナスを逆にすると、乾電池が装填できないようにする。"},{"label":"イ","html":"交通管制システムが故障したときには、信号機に赤色が点灯するようにする。"},{"label":"ウ","html":"ネットワークカードのコントローラを二重化しておき、片方のコントローラが故障しても運用できるようにする。"},{"label":"エ","html":"ハードディスクにRAID1を採用して、MTBFで示される信頼性が向上するようにする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フェールセーフとは、システムに故障が発生した場合に、被害が拡大しないよう、常に安全側の状態に移行するよう設計する考え方である。選択肢イの「交通管制システムが故障したときに信号機を赤色点灯にする」は、故障時にあえて「全方向停止」という最も安全な状態に倒す典型的なフェールセーフの例であり正解である。</p><p>アは電池の向きを間違えたときにそもそも装填できないようにする誤操作防止の設計であり、これはフェールセーフではなくフールプルーフ(ヒューマンエラー防止)の考え方である。ウとエはいずれも部品やディスクを二重化しておくことで、故障が発生しても全体の機能を維持し続ける設計であり、これはフェールセーフではなくフォールトトレラント(高信頼化・冗長化)の考え方に該当するため誤りである。</p>","mnemonic":""},{"id":376,"year":2019,"period":"平成31年度春期","num":17,"cat":"テクノロジ系","field":"バーンダウンチャート","summary":"バーンダウンチャート：平成31年度春期 問17","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>アジャイル開発におけるプラクティスの一つであるバーンダウンチャートはどれか。ここで、図中の破線は予定又は予想を、実線は実績を表す。</p><p>ア: 縦軸が「残作業量」、横軸が「時間」で、時間の経過とともに右肩下がりに減少していく折れ線グラフ(予定・実績とも最終的に0へ収束)。イ: 縦軸「発生不具合数」が時間とともにU字型(減少してから再び増加)に変化するグラフ。ウ: 縦軸「累積バグ数」が時間とともにS字型に増加し、やがて横ばいになるグラフ。エ: 縦軸「要員数」が時間とともに階段状に増減するグラフ。</p>","choices":[{"label":"ア","html":"残作業量が時間とともに右肩下がりに減少していくグラフ(ア)"},{"label":"イ","html":"発生不具合数がU字型に推移するグラフ(イ)"},{"label":"ウ","html":"累積バグ数がS字型に増加するグラフ(ウ)"},{"label":"エ","html":"要員数が階段状に増減するグラフ(エ)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バーンダウンチャート(burn-down chart)は、アジャイル開発(スクラムなど)において、スプリント(反復)の進行に伴って「残っている作業量(残タスク量やストーリーポイント)」が時間の経過とともにどれだけ減っていくかを可視化するグラフである。縦軸に残作業量、横軸に時間(日付)をとり、理想線(予定)と実績線を重ねて表示することで、計画どおりに消化が進んでいるかを一目で把握できる。</p><p>選択肢アのグラフは、縦軸が残作業量で、時間経過とともに右肩下がりに減少し、最終的に0に収束する形になっており、バーンダウンチャートの特徴と一致するため正解である。</p><p>イの発生不具合数がU字型に推移するグラフは信頼度成長曲線に関連する別の管理指標、ウの累積バグ数がS字型(ゴンペルツ曲線など)に増加していくグラフは信頼度成長曲線(累積バグ件数曲線)の説明であり、いずれも品質管理で用いられる別のグラフである。エの要員数が階段状に増減するグラフは要員計画(人員投入計画)を表すグラフであり、作業の消化状況を表すバーンダウンチャートとは異なる。</p>","mnemonic":""},{"id":377,"year":2019,"period":"平成31年度春期","num":18,"cat":"マネジメント系","field":"EVM(アーンドバリュー)","summary":"EVM(アーンドバリュー)：平成31年度春期 問18","correct":"エ","result":"","formula":"EAC = BAC ÷ CPI、CPI = EV ÷ AC","howto":"まずCPI(コスト効率指数)=EV÷ACを求め、BACをそのCPIで割ってEACを計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ある組織では、プロジェクトのスケジュールとコストの管理にアーンドバリューマネジメントを用いている。期間10日間のプロジェクトの、5日目の終了時点の状況は表のとおりである。この時点でのコスト効率が今後も続くとしたとき、完成時総コスト見積り(EAC)は何万円か。</p><table border='1' cellspacing='0' cellpadding='4'><tr><th>管理項目</th><th>金額(万円)</th></tr><tr><td>完成時総予算(BAC)</td><td>100</td></tr><tr><td>プランドバリュー(PV)</td><td>50</td></tr><tr><td>アーンドバリュー(EV)</td><td>40</td></tr><tr><td>実コスト(AC)</td><td>60</td></tr></table>","choices":[{"label":"ア","html":"110"},{"label":"イ","html":"120"},{"label":"ウ","html":"135"},{"label":"エ","html":"150"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コスト効率を表す指標であるコスト効率指数(CPI)は、出来高(アーンドバリューEV)を実際に投入したコスト(実コストAC)で割って求める。CPI = EV ÷ AC = 40 ÷ 60 = 2/3(約0.667)となる。</p><p>CPIが1より小さいことは、コストを1万円投入しても0.667万円分の出来高しか生み出せていない、すなわち当初計画より効率が悪い(コスト超過気味の)状態にあることを意味する。</p><p>このコスト効率(CPI)が完成まで続くと仮定した場合の、完成時総コスト見積り(EAC)は、完成時総予算(BAC)をCPIで割ることで求められる。EAC = BAC ÷ CPI = 100 ÷ (2/3) = 150万円となる。</p><p>したがって正解はエの150万円であり、ア110・イ120・ウ135はCPIやAC・PVの数値を取り違えた場合に出やすい誤答である。</p>","mnemonic":"「ろくまん(60)かけてよんまん(40)しか出来高が出ない」―効率2/3の逆数をBAC100万に掛ければ150万、コスト超過は一目瞭然。"},{"id":378,"year":2019,"period":"平成31年度春期","num":19,"cat":"マネジメント系","field":"アローダイアグラム","summary":"アローダイアグラム：平成31年度春期 問19","correct":"ウ","result":"","formula":"総余裕(TF) = 後続ノードの最遅日 − 開始ノードの最早日 − 所要日数","howto":"各ノードの最早開始日(前進計算)と最遅開始日(後退計算)をすべて求め、作業ごとに総余裕(TF)を計算して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>図のアローダイアグラムから読み取れることとして、適切なものはどれか。ここで、プロジェクトの開始日を1日目とする。</p><p>【アローダイアグラムの構成(作業名・所要日数)】</p><table border='1' cellspacing='0' cellpadding='4'><tr><th>作業</th><th>開始ノード</th><th>終了ノード</th><th>所要日数</th></tr><tr><td>A</td><td>開始</td><td>ノード1</td><td>5</td></tr><tr><td>B</td><td>開始</td><td>ノード2</td><td>10</td></tr><tr><td>ダミー作業</td><td>ノード2</td><td>ノード1</td><td>0</td></tr><tr><td>C</td><td>ノード1</td><td>ノード3</td><td>20</td></tr><tr><td>D</td><td>ノード1</td><td>ノード4</td><td>30</td></tr><tr><td>E</td><td>ノード1</td><td>ノード5</td><td>10</td></tr><tr><td>F</td><td>ノード2</td><td>ノード5</td><td>10</td></tr><tr><td>G</td><td>ノード3</td><td>ノード4</td><td>20</td></tr><tr><td>ダミー作業</td><td>ノード5</td><td>ノード4</td><td>0</td></tr><tr><td>H</td><td>ノード4</td><td>終了</td><td>10</td></tr></table>","choices":[{"label":"ア","html":"作業Cを最も早く開始できるのは6日目である。"},{"label":"イ","html":"作業Dはクリティカルパス上の作業である。"},{"label":"ウ","html":"作業Eの総余裕時間は30日である。"},{"label":"エ","html":"作業Fを最も遅く開始できるのは11日目である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>開始ノードを0日目として、各ノードの最早開始日(フォワードパス)を計算する。ノード1はA経由で0+5=5、B+ダミー経由で0+10+0=10となり、大きい方の10を採用する(両方の経路が完了していないと次に進めないため)。ノード2は0+10=10。ノード3はノード1+C=10+20=30。ノード5はmax(ノード1+E=10+10=20, ノード2+F=10+10=20)=20。ノード4はmax(ノード3+G=30+20=50, ノード1+D=10+30=40, ノード5+ダミー=20+0=20)=50。プロジェクト全体の所要日数はノード4+H=50+10=60日となる。</p><p>次に終了ノードを60として最遅開始日(バックワードパス)を計算する。ノード4=60-10=50。ノード3=50-20=30。ノード5=50-0=50。ノード1=min(30-20, 50-30, 50-10)=10。ノード2=min(10-0, 50-10)=10。開始ノード=min(10-5, 10-10)=0となり、開始ノードの最早日・最遅日が一致するので無矛盾である。</p><p>クリティカルパスはB→ダミー→C→G→H(10+0+20+20+10=60日)であり、作業Dの総余裕(TF)=ノード4の最遅50−ノード1の最早10−30=10日あるため、Dはクリティカルパス上の作業ではない(イは誤り)。作業Eの総余裕(TF)=ノード5の最遅日50−ノード1の最早日10−所要日数10=30日となり、ウの記述と一致する。</p><p>なお、作業Cの最早開始日はノード1の最早日である10日後、すなわち(1日目起点で)11日目であり6日目ではない(アは誤り)。作業Fの最遅開始日はノード5の最遅日50からFの所要日数10を引いた40日後、すなわち41日目であり11日目ではない(エは誤り)。</p>","mnemonic":"「ビーさん(B,10日)の陰でダミーが0日、そこからC・Gで合計60日」―わき道の作業Eは丸々30日の余裕を抱えた余裕綽々の作業。"},{"id":379,"year":2019,"period":"平成31年度春期","num":20,"cat":"マネジメント系","field":"ITIL問題管理","summary":"ITIL問題管理：平成31年度春期 問20","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>ITサービスマネジメントにおける問題管理プロセスにおいて実施することはどれか。</p>","choices":[{"label":"ア","html":"インシデントの発生後に暫定的にサービスを復旧させ、業務を継続できるようにする。"},{"label":"イ","html":"インシデントの発生後に未知の根本原因を特定し、恒久的な解決策を策定する。"},{"label":"ウ","html":"インシデントの発生に備えて、復旧のための設計をする。"},{"label":"エ","html":"インシデントの発生を記録し、関係する部署に状況を連絡する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ITILにおける「問題」とは、1件以上のインシデントの原因、またはその可能性があるものと定義されている。問題管理プロセスの目的は、インシデントを一時的に復旧させるだけでなく、その背後にある未知の根本原因を調査・特定し、恒久的な解決策(是正措置)を策定・実施することで、同種のインシデントの再発を防止することにある。選択肢イはこの内容を正確に表しており正解である。</p><p>アは発生したインシデントをまず暫定的に復旧させ業務影響を最小化する「インシデント管理」の活動、ウはインシデント発生に備えてあらかじめ復旧手順や体制を設計しておく活動(可用性管理やサービス継続管理に近い)、エはインシデントの発生を記録し関係部署へ連絡するというインシデント管理の初動対応であり、いずれも根本原因の特定・恒久対策という問題管理固有の目的とは異なるため誤りである。</p>","mnemonic":""},{"id":380,"year":2019,"period":"平成31年度春期","num":21,"cat":"テクノロジ系","field":"バックアップ運用","summary":"バックアップ運用：平成31年度春期 問21","correct":"ウ","result":"","formula":"必要本数 = (当月+6か月前までの計7か月分) × (フルバックアップ用1本+差分バックアップ用1本)","howto":"常に6か月前の同一日まで復元できるようにするには、当月を含む直近7か月分のフル・差分バックアップ用テープを同時に保持し続ける必要がある","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>次の処理条件で磁気ディスクに保存されているファイルを磁気テープにバックアップするとき、バックアップの運用に必要な磁気テープは最少で何本か。</p><p>[処理条件]</p><p>(1) 毎月初日(1日)にフルバックアップを取る。フルバックアップは1本の磁気テープに1回分を記録する。</p><p>(2) フルバックアップを取った翌日から次のフルバックアップを取るまでは、毎日
