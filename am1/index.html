html":"トランザクション処理プログラムがデータベースの更新中に異常終了した場合には、ログファイルの更新後情報を使用してデータの回復処理を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>チェックポイントは、ある時点でメモリ上の更新内容を確実にディスクへ反映させる区切りであり、障害回復処理の基準点として使われる。システム障害（媒体障害以外のハードウェア障害やOSの異常停止など）が発生した場合、チェックポイント取得以前に正常にコミットが完了していたトランザクションは、その更新内容が既にディスクへ書き込まれていることが保証されているため、改めて回復処理（ロールフォワードやロールバック）を行う必要がない。回復が必要になるのは、チェックポイント以降にコミットされた、あるいは更新途中であったトランザクションだけである。</p><p>選択肢アは、異なるトランザクションが同一データを同時更新する際の論理的矛盾を防ぐための仕組みとして「データのブロック化」を挙げているが、実際にはロック（排他制御）によって整合性を保つのが一般的であり、適切な説明ではない。選択肢ウは媒体障害からの回復について「更新前情報（ログのビフォアイメージ）」を使うとしているが、媒体障害からの回復はバックアップをリストアした後、ログの更新後情報（アフターイメージ）を使ってロールフォワードするのが正しい。選択肢エはトランザクション異常終了時に「更新後情報」を使うとしているが、実際には更新前情報を使ってロールバックするのが正しい処理である。</p>","mnemonic":""},{"id":249,"year":2021,"period":"令和3年度秋期","num":10,"cat":"テクノロジ系","field":"ネットワークプロトコル","summary":"ネットワークプロトコル：令和3年度秋期 問10","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>TCP/IPネットワークにおけるARPの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"IPアドレスからMACアドレスを得るプロトコルである。"},{"label":"イ","html":"IPネットワークにおける誤り制御のためのプロトコルである。"},{"label":"ウ","html":"ゲートウェイ間のホップ数によって経路を制御するプロトコルである。"},{"label":"エ","html":"端末に対して動的にIPアドレスを割り当てるためのプロトコルである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ARP（Address Resolution Protocol）は、同一LAN（イーサネットセグメント）内の通信において、宛先のIPアドレスから対応する物理的なMACアドレスを取得するためのプロトコルである。送信側は、対象のIPアドレスを指定したARP要求をブロードキャストで送信し、該当するIPアドレスを持つ機器だけがARP応答として自分のMACアドレスを返す。取得したMACアドレスはARPテーブルに一定時間キャッシュされ、同じ宛先への再問い合わせを減らす。</p><p>選択肢イのような誤り制御は、ARPではなくイーサネットのフレームチェックシーケンス（FCS）などの役割である。選択肢ウのようなホップ数による経路制御は、RIPなどのルーティングプロトコルが担う機能であり、ARPはそもそもルーティング（経路制御）とは無関係にローカルセグメント内のアドレス解決のみを行う。選択肢エの動的IPアドレス割当てはDHCPの機能であり、ARPとは逆方向（IPからMACを求める）の処理を行うARPとは目的が異なる。</p>","mnemonic":""},{"id":250,"year":2021,"period":"令和3年度秋期","num":11,"cat":"テクノロジ系","field":"IPアドレス計算","summary":"IPアドレス計算：令和3年度秋期 問11","correct":"エ","result":"","formula":"ブロードキャストアドレス＝IPアドレス OR (サブネットマスクを反転したもの)","howto":"サブネットマスクの各ビットを反転するとホスト部が全て1・ネットワーク部が全て0のビット列になる。これとIPアドレスの論理和を取ると、ネットワーク部はIPアドレスのまま残り、ホスト部は全て1（＝ブロードキャストアドレス）になる。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>IPv4ネットワークにおいて、あるホストが属するサブネットのブロードキャストアドレスを、そのホストのIPアドレスとサブネットマスクから計算する方法として、適切なものはどれか。ここで、論理和、論理積はビットごとの演算とする。</p>","choices":[{"label":"ア","html":"IPアドレスの各ビットを反転したものとサブネットマスクとの論理積を取る。"},{"label":"イ","html":"IPアドレスの各ビットを反転したものとサブネットマスクとの論理和を取る。"},{"label":"ウ","html":"サブネットマスクの各ビットを反転したものとIPアドレスとの論理積を取る。"},{"label":"エ","html":"サブネットマスクの各ビットを反転したものとIPアドレスとの論理和を取る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サブネットマスクは、ネットワーク部が1、ホスト部が0で構成されるビット列である。これを反転すると、ネットワーク部が0、ホスト部が全て1のビット列になる。これとIPアドレスとのビットごとの論理和（OR）を取ると、ネットワーク部はIPアドレスの値がそのまま残り（0とのORは元の値のまま）、ホスト部は全て1になる。ホスト部が全て1のアドレスはそのサブネットのブロードキャストアドレスの定義そのものである。</p><p>例えば、IPアドレス192.168.1.10、サブネットマスク255.255.255.0（ホスト部8ビット）の場合、マスクを反転すると0.0.0.255になり、IPアドレスとのORを取ると192.168.1.255となり、これが正しいブロードキャストアドレスになる。</p><p>選択肢ア・イはIPアドレス自体を反転してしまっており、ホスト部だけでなくネットワーク部まで反転されるため正しい結果にならない。選択肢ウは論理積（AND）を使っているが、反転したマスクとIPのANDを取るとホスト部はIPアドレスの値のまま、ネットワーク部は0になってしまい、得られるのはネットワークアドレスでもブロードキャストアドレスでもない誤った値になる。</p>","mnemonic":"「マスクを裏返してORすれば端まで1」―反転マスクはホスト部が全部1の服、ORで着せればブロードキャストの出来上がり。"},{"id":251,"year":2021,"period":"令和3年度秋期","num":12,"cat":"テクノロジ系","field":"IoTセキュリティ","summary":"IoTセキュリティ：令和3年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>IoT推進コンソーシアム、総務省、経済産業省が策定した“IoTセキュリティガイドライン(Ver1.0)”における“要点17. 出荷・リリース後も安全安心な状態を維持する”に対策例として挙げられているものはどれか。</p>","choices":[{"label":"ア","html":"IoT機器及びIoTシステムが収集するセンサデータ、個人情報などの情報の洗い出し、並びに保護すべきデータの特定"},{"label":"イ","html":"IoT機器のアップデート方法の検討、アップデートなどの機能の搭載、アップデートの実施"},{"label":"ウ","html":"IoT機器メーカ、IoTシステムやサービスの提供者、利用者の役割の整理"},{"label":"エ","html":"PDCAサイクルの実施、組織としてIoTシステムやサービスのリスクの認識、対策を行う体制の構築"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IoT推進コンソーシアム、総務省、経済産業省が策定した「IoTセキュリティガイドライン（Ver1.0）」は、IoT機器のライフサイクル全体を5つの指針・21の要点に整理したものである。そのうち「要点17．出荷・リリース後も安全安心な状態を維持する」は、市場に出た後もIoT機器やシステムのセキュリティを継続的に保つための対策を求めるもので、具体的にはIoT機器のアップデート方法の検討（遠隔での自動アップデートが可能かなど）、アップデート機能自体の搭載、及び実際のアップデートの実施がその代表的な対策例として挙げられている。</p><p>選択肢アの「保護すべきデータの特定」は、設計・開発段階で守るべきものを洗い出す別の要点の内容に近い。選択肢ウの「メーカ・提供者・利用者の役割の整理」は、関係者間の責任分担を明確にする別の要点の内容である。選択肢エのPDCAサイクルの実施や体制構築は、組織的なマネジメント方針に関する別の要点であり、出荷後のアップデート対応という技術的・運用的な対策を直接指す要点17の内容とは異なる。</p>","mnemonic":""},{"id":252,"year":2021,"period":"令和3年度秋期","num":13,"cat":"テクノロジ系","field":"情報セキュリティ特性","summary":"情報セキュリティ特性：令和3年度秋期 問13","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>JIS Q 27000:2019(情報セキュリティマネジメントシステム-用語)において定義されている情報セキュリティの特性に関する説明のうち、否認防止の特性に関するものはどれか。</p>","choices":[{"label":"ア","html":"ある利用者があるシステムを利用したという事実が証明可能である。"},{"label":"イ","html":"認可された利用者が要求したときにアクセスが可能である。"},{"label":"ウ","html":"認可された利用者に対してだけ、情報を使用させる又は開示する。"},{"label":"エ","html":"利用者の行動と意図した結果とが一貫性をもつ。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIS Q 27000:2019（情報セキュリティマネジメントシステム−用語）では、情報セキュリティの特性として機密性、完全性、可用性に加え、否認防止、責任追跡性、真正性、信頼性を定義している。このうち否認防止（Non-repudiation）とは、ある事象や処置の発生について、後になってその事実を否定されないように証明できる性質を指す。選択肢アの「ある利用者があるシステムを利用したという事実が証明可能である」は、まさに利用の事実を後から否認できないようにする、否認防止の典型的な説明である。</p><p>選択肢イの「認可された利用者が要求したときにアクセスが可能である」は可用性の定義であり、選択肢ウの「認可された利用者に対してだけ、情報を使用させる又は開示する」は機密性の定義である。選択肢エの「利用者の行動と意図した結果とが一貫性をもつ」は信頼性（Reliability）に関する説明に近い。これらはいずれも否認防止とは異なる特性を説明したものである。</p>","mnemonic":""},{"id":253,"year":2021,"period":"令和3年度秋期","num":14,"cat":"テクノロジ系","field":"決済セキュリティ","summary":"決済セキュリティ：令和3年度秋期 問14","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>盗まれたクレジットカードの不正利用を防ぐ仕組みのうち、オンラインショッピングサイトでの不正利用の防止に有効なものはどれか。</p>","choices":[{"label":"ア","html":"3Dセキュアによって本人確認する。"},{"label":"イ","html":"クレジットカード内に保持されたPINとの照合によって本人確認する。"},{"label":"ウ","html":"クレジットカードの有効期限を確認する。"},{"label":"エ","html":"セキュリティコードの入力によって券面認証する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>3Dセキュアは、クレジットカードによるオンライン決済の際に、カード番号や有効期限といったカード自体の情報だけでなく、ワンタイムパスワードや生体認証などを使って「本人であること」を追加で確認する本人認証サービスである。VisaのVisa SecureやMastercardのID Check、JCBのJ/Secureなどはいずれもこの3Dセキュアの仕組みに基づいており、カード情報が盗まれてもなりすましによる不正利用を防ぎやすくなる。</p><p>選択肢イの「クレジットカード内に保持されたPINとの照合」は、主にICカード（チップ）を使った対面決済での本人確認手段であり、オンラインショッピングでのなりすまし防止には直接関係しない。選択肢ウの有効期限確認や選択肢エのセキュリティコード（券面認証）は、カード自体の情報の一部にすぎず、カード番号と一緒に盗まれてしまえば防止効果がないため、盗まれたカード情報を使った不正利用対策としては不十分である。これに対し3Dセキュアは、カード情報を知っているだけでは突破できない追加認証を課す点で有効性が高い。</p>","mnemonic":""},{"id":254,"year":2021,"period":"令和3年度秋期","num":15,"cat":"テクノロジ系","field":"ネットワークセキュリティ","summary":"ネットワークセキュリティ：令和3年度秋期 問15","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>OSI基本参照モデルのネットワーク層で動作し、“認証ヘッダ(AH)”と“暗号ペイロード(ESP)”の二つのプロトコルを含むものはどれか。</p>","choices":[{"label":"ア","html":"IPsec"},{"label":"イ","html":"S/MIME"},{"label":"ウ","html":"SSH"},{"label":"エ","html":"XML暗号"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IPsecは、OSI基本参照モデルのネットワーク層（第3層）で動作し、IPパケット単位で認証・暗号化を行うことでIP通信の機密性と完全性を保護するプロトコル群である。認証ヘッダ（AH: Authentication Header）はパケットの改ざん検知などの認証機能のみを提供し、暗号ペイロード（ESP: Encapsulating Security Payload）は認証に加えてデータの暗号化（秘匿性）も提供する。IPsecはこのAHとESPという2つの主要プロトコルを含む枠組みとして定義されている。</p><p>選択肢イのS/MIMEは電子メールの本文や添付ファイルを暗号化・署名する、アプリケーション層（メールの中身）で使われる技術であり、ネットワーク層のプロトコルではない。選択肢ウのSSHはリモートログインなどに使われるプロトコルで、トランスポート層以上で動作し、AHやESPを含まない。選択肢エのXML暗号はXML文書内のデータを暗号化するための仕様であり、こちらもネットワーク層ではなくアプリケーションレベルの技術である。</p>","mnemonic":""},{"id":255,"year":2021,"period":"令和3年度秋期","num":16,"cat":"テクノロジ系","field":"UML図","summary":"UML図：令和3年度秋期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>UMLにおける振る舞い図の説明のうち、アクティビティ図のものはどれか。</p>","choices":[{"label":"ア","html":"ある振る舞いから次の振る舞いへの制御の流れを表現する。"},{"label":"イ","html":"オブジェクト間の相互作用を時系列で表現する。"},{"label":"ウ","html":"システムが外部に提供する機能と、それを利用する者や外部システムとの関係を表現する。"},{"label":"エ","html":"一つのオブジェクトの状態がイベントの発生や時間の経過とともにどのように変化するかを表現する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>UMLの振る舞い図のうち、アクティビティ図は、ある振る舞い（アクティビティ）から次の振る舞いへの制御の流れ（場合によってはデータの流れも含む）を表現する図である。開始ノードから終了ノードまでの処理の流れを、分岐（条件分岐）や並行処理（フォーク・ジョイン）を交えて表現でき、業務プロセスやアルゴリズムのフローチャートに似た形で視覚化できる。</p><p>選択肢イの「オブジェクト間の相互作用を時系列で表現する」のはシーケンス図の説明である。選択肢ウの「システムが外部に提供する機能と、それを利用する者や外部システムとの関係を表現する」のはユースケース図の説明であり、これは振る舞い図の一種ではあるがアクティビティ図とは異なる。選択肢エの「一つのオブジェクトの状態がイベントの発生や時間の経過とともにどのように変化するかを表現する」のはステートマシン図（状態遷移図）の説明である。</p>","mnemonic":""},{"id":256,"year":2021,"period":"令和3年度秋期","num":17,"cat":"テクノロジ系","field":"アジャイル開発","summary":"アジャイル開発：令和3年度秋期 問17","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>アジャイル開発におけるプラクティスの一つであるバーンダウンチャートはどれか。ここで、図中の破線は予定又は予想を、実線は実績を表す。</p><p>ア：縦軸「残作業量」、横軸「時間」。破線・実線とも右肩下がりに減少していくグラフ<br>イ：縦軸「発生不具合数」、横軸「時間」。U字型に推移するグラフ<br>ウ：縦軸「累積バグ数」、横軸「時間」。増加して頭打ちになるS字型のグラフ<br>エ：縦軸「要員数」、横軸「時間」。階段状に増減するグラフ</p>","choices":[{"label":"ア","html":"残作業量が時間とともに右肩下がりに減少するグラフ"},{"label":"イ","html":"発生不具合数がU字型に推移するグラフ"},{"label":"ウ","html":"累積バグ数が増加して頭打ちになるグラフ"},{"label":"エ","html":"要員数が階段状に増減するグラフ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バーンダウンチャートは、アジャイル開発（特にスクラム）においてスプリントなどの期間中に残っている作業量の推移を、横軸に時間、縦軸に残作業量（ストーリーポイントやタスク数など）を取って表した図である。理想的には時間の経過とともに残作業量が右肩下がりに減っていき、スプリント終了時にゼロへ近づく。選択肢アのグラフは、縦軸が「残作業量」で時間とともに減少していく形を示しており、これがバーンダウンチャートの典型的な形である。</p><p>選択肢イは「発生不具合数」がU字型に推移するグラフで、これは信頼度成長曲線やテストの不具合発生傾向を示すグラフに近く、バーンダウンチャートとは異なる。選択肢ウは「累積バグ数」が時間とともに増加して頭打ちになる形で、これはソフトウェア信頼度成長モデル（ゴンペルツ曲線など）に近いグラフである。選択肢エは「要員数」が階段状に増減するグラフで、要員計画やリソースヒストグラムに近く、残作業量を表すものではない。</p>","mnemonic":""},{"id":257,"year":2021,"period":"令和3年度秋期","num":18,"cat":"マネジメント系","field":"アローダイアグラム","summary":"アローダイアグラム：令和3年度秋期 問18","correct":"イ","result":"","formula":"PDM→AOA変換：複数の先行作業をもつ作業の直前にダミー作業（矢線）を挿入して依存関係を表現する","howto":"各作業の直前・直後関係（FS関係）を洗い出し、1つの作業が複数の先行作業を持つ場合は、アローダイアグラム上で共通の結合点に合流させるためダミー作業（点線の矢線、時間・コストを持たない）を使う。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>次のプレシデンスダイアグラムで表現されたプロジェクトスケジュールネットワーク図を、アローダイアグラムに書き直したものはどれか。ここで、プレシデンスダイアグラムの依存関係は全てFS関係とする。</p><p>プレシデンスダイアグラム：開始→A、開始→B。A→C→E→G→終了。B→D→F→H→終了。さらにA→F（Fの開始にはAとDの両方の完了が必要）。</p><p>選択肢ア〜エは、この依存関係をアローダイアグラム（矢線図）で表現したもので、ダミー作業（点線の矢線、作業時間を持たない）の引き方が異なる。</p>","choices":[{"label":"ア","html":"ダミー作業を使わずA・Bから並行してC・Dへ進み、CとDの結合点からそれぞれE、Fへ進む図"},{"label":"イ","html":"Aの完了点からDの完了点（Fの開始点）へ1本のダミー作業を引いた図"},{"label":"ウ","html":"Aの完了点からDの完了点及びその先の結合点へ複数本のダミー作業を引いた図"},{"label":"エ","html":"Aの完了点からHの開始点へダミー作業を引いた図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プレシデンスダイアグラム（PDM）から各作業の依存関係を読み取ると、開始からA、Bが並行して始まり、Aの完了後にCとFが、Bの完了後にDが開始できる。さらにFはAだけでなくDの完了も待つ必要がある（図ではAからFへも矢印が伸びている）。CはEへ、DはFへ、EはGへ、FはHへそれぞれつながり、G、Hの両方が完了すると終了する。</p><p>アローダイアグラム（AOA）では、1本の矢線は1つの作業しか表せないため、Fのように2つの作業（AとD）の完了を待つ作業を表現するには、Aの完了を表すイベント（結合点）からDの完了を表すイベント（結合点）へ、時間を消費しないダミー作業（点線の矢線）を1本引く必要がある。これにより、Fの開始点はDの完了点と同じになり、かつAの完了という条件も経由して満たされる。一方、Cの開始はAの完了点だけから出発すればよく、Dの完了を経由する必要はない。</p><p>選択肢の中で、Aの完了点からDの完了点（Fの開始点）へ向かう1本のダミー作業だけを追加した図が、この依存関係を過不足なく表現している。ダミー作業を引く本数が多すぎたり、逆に足りなかったりする選択肢は、本来存在しない依存関係を作ってしまったり、必要な依存関係を表現できていなかったりするため誤りとなる。</p>","mnemonic":"「AとDが合流しないとFは動けない」―Aの完了点からDの完了点へ点線1本だけ忍び込ませれば、Fはちゃんと両方を待てる。"},{"id":258,"year":2021,"period":"令和3年度秋期","num":19,"cat":"マネジメント系","field":"PMBOKリスク管理","summary":"PMBOKリスク管理：令和3年度秋期 問19","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>PMBOKガイド第6版によれば、リスクの定量的分析で実施することはどれか。</p>","choices":[{"label":"ア","html":"発生の可能性や影響のみならず他の特性を評価することによって、さらなる分析や行動のためにプロジェクトの個別リスクに優先順位を付ける。"},{"label":"イ","html":"プロジェクトの個別の特定した個別リスクと、プロジェクト目標全体における他の不確実性要因が複合した影響を数量的に分析する。"},{"label":"ウ","html":"プロジェクトの全体リスクとプロジェクトの個別リスクに対処するために、選択肢の策定、戦略の選択、及び対応処置を合意する。"},{"label":"エ","html":"プロジェクトの全体リスクの要因だけでなくプロジェクトの個別リスクの要因も特定し、それぞれの特性を文書化する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PMBOKガイド第6版における「リスクの定量的分析」プロセスは、定性的リスク分析で優先度が高いと判断された個々のリスク（個別リスク）について、それらがプロジェクト目標全体に与える影響を数値的・定量的に分析するプロセスである。具体的には、個別のリスクだけでなく、プロジェクト全体に存在する様々な不確実性要因が複合的に組み合わさった場合の影響度を、期待金額価値分析やモンテカルロ・シミュレーションなどの手法を用いて数量的に分析する。選択肢イの説明はこの定量的分析の内容そのものである。</p><p>選択肢アは「発生の可能性や影響のみならず他の特性を評価することによって…優先順位を付ける」とあり、これは数値ではなく相対的な優先順位付けを行う「リスクの定性的分析」プロセスの説明である。選択肢ウは「選択肢の策定、戦略の選択、及び対応処置を合意する」とあり、これはリスクへの対処方法を決める「リスク対応の計画」プロセスの説明である。選択肢エは「それぞれの特性を文書化する」とあり、これはリスクを洗い出して記録する「リスクの特定」プロセスの説明である。これらはいずれも定量的な数値分析を行う定量的リスク分析プロセスとは異なる。</p>","mnemonic":""},{"id":259,"year":2021,"period":"令和3年度秋期","num":20,"cat":"マネジメント系","field":"ITサービスマネジメント","summary":"ITサービスマネジメント：令和3年度秋期 問20","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>サービスマネジメントシステムにおける問題管理の活動のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"同じインシデントが発生しないように、問題は根本原因を特定して必ず恒久的に解決する。"},{"label":"イ","html":"同じ問題が重複して管理されないように、既知の誤りは記録しない。"},{"label":"ウ","html":"問題管理の負荷を低減するために、解決した問題は直ちに問題管理の対象から除外する。"},{"label":"エ","html":"問題を特定するために、インシデントのデータ及び傾向を分析する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サービスマネジメント（ITILなどに基づく）における問題管理は、インシデントの根本原因を特定し、同様のインシデントの再発を防止するための活動である。そのためには、発生したインシデントのデータや傾向を分析して問題（根本原因やその可能性）を特定することが不可欠であり、選択肢エの「問題を特定するために、インシデントのデータ及び傾向を分析する」はこの問題管理の基本的な活動そのものである。</p><p>選択肢アは「必ず恒久的に解決する」としているが、実際には根本原因が判明してもすぐに恒久的対策を講じられない場合があり、その場合は回避策（ワークアラウンド）を用いた「既知の誤り」として管理しながら、変更管理プロセスを通じて恒久対策を進めるのが一般的であり、「必ず恒久的に解決する」とは限らない。選択肢イは「既知の誤りは記録しない」としているが、既知の誤り（根本原因と回避策が判明している問題）は既知の誤りデータベース（KEDB）などに記録・管理することが推奨されており、記録しないというのは誤りである。選択肢ウは「解決した問題は直ちに問題管理の対象から除外する」としているが、実際には再発の有無を確認したり、恒久対策の効果を検証したりするため、解決後も一定の管理下に置かれることが一般的であり、直ちに除外するわけではない。</p>","mnemonic":""},{"id":260,"year":2021,"period":"令和3年度秋期","num":21,"cat":"マネジメント系","field":"バックアップ運用","summary":"バックアップ運用：令和3年度秋期 問21","correct":"ウ","result":"","formula":"必要本数＝(フル用+差分用)×保持すべき月数","howto":"復元が必要な範囲（当月+過去6か月=7か月分）について、各月ごとにフルバックアップ用1本・差分バックアップ用1本が同時に必要になる最悪のタイミングを考え、テープは使い終えた分から使い回せることを踏まえて最少本数を求める。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>次の処理条件で磁気ディスクに保存されているファイルを磁気テープにバックアップするとき、バックアップの運用に必要な磁気テープは最少で何本か。</p><p>〔処理条件〕<br>(1) 毎月初日(1日)にフルバックアップを取る。フルバックアップは1本の磁気テープに1回分を記録する。<br>(2) フルバックアップを取った翌日から次のフルバックアップを取るまでは、毎日、差分バックアップを取る。差分バックアップは、差分バックアップ用としてフルバックアップとは別の磁気テープに追記録し、1本に1か月分を記録する。<br>(3) 常に6か月前の同一日までのデータについて、指定日の状態にファイルを復元できるようにする。ただし、6か月前の月に同一日が存在しない場合は、当該月の末日までのデータについて、指定日の状態にファイルを復元できるようにする(例:本日が10月31日の場合は、4月30日までのデータについて、指定日の状態にファイルを復元できるようにする)。</p>","choices":[{"label":"ア","html":"12"},{"label":"イ","html":"13"},{"label":"ウ","html":"14"},{"label":"エ","html":"15"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>処理条件を整理すると、フルバックアップは毎月1日に1本の専用テープへ、差分バックアップはその月の間、別の1本のテープに日々追記される。復元要件は「常に6か月前の同一日まで」なので、ある時点で保持しておかなければならない範囲は、当月を含めて過去6か月、つまり合計7か月分（例：10月31日なら4月末〜10月末の7か月分）である。</p><p>この7か月分のどの日にも復元できるようにするには、該当する各月について、その月のフルバックアップ用テープ1本と差分バックアップ用テープ1本の、合わせて2本が必要になる。したがって必要本数は 7か月 × 2本/月 = 14本 となる。</p><p>最も古い月（7か月前の月）のテープは、翌月に新しいフルバックアップを取得した瞬間に復元要件の範囲から外れるため、そのタイミングで新しい月のフル・差分用として再利用（使い回し）できる。つまり、常時保持しておくべき最少本数は14本であり、それ以上増やす必要はない。</p><p>選択肢ア(12)やイ(13)は、7か月分×2本という組合せを過小に見積もった場合に出てくる本数であり、選択肢エ(15)は、テープの使い回しのタイミングを考慮せず、新しい月のフルバックアップ用に余分な1本を追加してしまった場合の本数である。実際には使い終えたテープを直ちに再利用できるため、最少本数は14本で足りる。</p>","mnemonic":"「7か月×2本で14本」―今月と前の6か月、フルと差分のペアを7か月分そろえれば、ちょうど14本で使い回しが効く。"},{"id":261,"year":2021,"period":"令和3年度秋期","num":22,"cat":"マネジメント系","field":"システム監査技法","summary":"システム監査技法：令和3年度秋期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>データの生成から入力、処理、出力、活用までのプロセス、及び組み込まれているコントロールを、システム監査人が書面上で又は実際に追跡する技法はどれか。</p>","choices":[{"label":"ア","html":"インタビュー法"},{"label":"イ","html":"ウォークスルー法"},{"label":"ウ","html":"監査モジュール法"},{"label":"エ","html":"ペネトレーションテスト法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ウォークスルー法は、データの生成から入力、処理、出力、活用に至るまでの一連のプロセス、及びそこに組み込まれているコントロール（統制）を、書面上で、あるいは実際にシステムを操作しながら追跡し、処理の流れや統制が意図どおりに機能しているかを確認するシステム監査技法である。代表的な取引データなどをサンプルとして選び、処理の最初から最後までを順にたどっていく点が特徴である。</p><p>選択肢アのインタビュー法は、監査人が関係者に直接口頭で質問して情報を収集する技法であり、プロセスを順にたどって追跡する技法ではない。選択肢ウの監査モジュール法は、監査対象システムに監査用のモジュール（プログラム）を組み込んでおき、処理中のデータを継続的にチェックする技法である。選択肢エのペネトレーションテスト法は、実際に不正アクセスを試みるなどしてシステムの脆弱性を検証する技法であり、いずれもプロセス全体を書面や実地で追跡するウォークスルー法とは異なる。</p>","mnemonic":""},{"id":262,"year":2021,"period":"令和3年度秋期","num":23,"cat":"ストラテジ系","field":"KPIマネジメント","summary":"KPIマネジメント：令和3年度秋期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>物流業務において、10%の物流コストの削減の目標を立てて、図のような業務プロセスの改善活動を実施している。図中のcに相当する活動はどれか。</p><p>〔改善活動〕物流コストの削減活動の開始 → a → b → c → 改善活動の実施 → 成果の計測と目標値とのギャップ分析 →（aへ戻るループ）</p><p>〔目標の設定例〕a：「10%の物流コストの削減」／b：「在庫の削減」「誤出荷の削減」／c：「在庫日数7日以内」「誤出荷率3%以内」</p>","choices":[{"label":"ア","html":"CSF(Critical Success Factor)の抽出"},{"label":"イ","html":"KGI(Key Goal Indicator)の設定"},{"label":"ウ","html":"KPI(Key Performance Indicator)の設定"},{"label":"エ","html":"MBO(Management by Objectives)の導入"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>図の改善活動では、a「10%の物流コストの削減」という最終目標（KGI：重要目標達成指標）が設定された後、b「在庫の削減・誤出荷の削減」という、その目標を達成するために重要となる要因（CSF：重要成功要因）が示されている。そしてcでは、「在庫日数7日以内」「誤出荷率3%以内」という、CSFの達成度合いを具体的な数値で測るための指標が設定されており、これはCSFの達成状況を定量的にモニタリングするためのKPI（Key Performance Indicator：重要業績評価指標）の設定に当たる。</p><p>選択肢アのCSFの抽出は既にbの段階で行われており、cではその成功要因を測定可能な数値目標に落とし込む段階であるため、CSFの抽出そのものではない。選択肢イのKGIの設定は最終目標であるaの段階に当たる。選択肢エのMBO（目標管理制度）は、組織や個人の目標設定・評価の仕組みであり、業務プロセス改善における指標設定の枠組みとしては直接の対象ではない。</p>","mnemonic":""},{"id":263,"year":2021,"period":"令和3年度秋期","num":24,"cat":"ストラテジ系","field":"投資対効果計算","summary":"投資対効果計算：令和3年度秋期 問24","correct":"イ","result":"","formula":"5年間の効果＝(削減額の合計)－(費用の合計)","howto":"通勤費・オフィス光熱費・中途採用費用の削減額を5年分合算し、PC購入・リモートアクセスツール・インターネット回線の費用を5年分合算して差し引く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>A社は、社員10名を対象に、ICT活用によるテレワークを導入しようとしている。テレワーク導入後5年間の効果（“テレワークで削減可能な費用”から“テレワークに必要な費用”を差し引いた額）の合計は何万円か。</p><p>〔テレワークの概要〕<br>・テレワーク対象者は、リモートアクセスツールを利用して、テレワーク用PCから社内システムにインターネット経由でアクセスして、フルタイムで在宅勤務を行う。<br>・テレワーク用PCの購入費用、リモートアクセスツールの費用、自宅・会社間のインターネット回線費用は会社が負担する。<br>・テレワークを導入しない場合は、育児・介護理由によって、毎年1名の離職が発生する。フルタイムの在宅勤務制度を導入した場合は、離職を防止できる。離職が発生した場合は、その補充のために中途採用が必要となる。<br>・テレワーク対象者分の通勤費とオフィススペース・光熱費が削減できる。<br>・在宅勤務によって、従来、通勤に要していた時間が削減できるが、その効果は考慮しない。</p><table border='1' style='border-collapse:collapse'><tr><th colspan='2'>テレワークで削減可能な費用、テレワークに必要な費用</th></tr><tr><td>通勤費の削減額</td><td>平均10万円／年・人</td></tr><tr><td>オフィススペース・光熱費の削減額</td><td>12万円／年・人</td></tr><tr><td>中途採用費用の削減額</td><td>50万円／人</td></tr><tr><td>テレワーク用PCの購入費用</td><td>初期費用8万円／台</td></tr><tr><td>リモートアクセスツールの費用</td><td>初期費用1万円／人、運用費2万円／年・人</td></tr><tr><td>インターネット回線費用</td><td>運用費用6万円／年・人</td></tr></table>","choices":[{"label":"ア","html":"610"},{"label":"イ","html":"860"},{"label":"ウ","html":"950"},{"label":"エ","html":"1,260"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>対象は社員10名、期間は5年間として計算する。</p><p>【削減できる費用】<br>・通勤費：10万円/年・人 ×10人×5年＝500万円<br>・オフィススペース・光熱費：12万円/年・人 ×10人×5年＝600万円<br>・中途採用費用：テレワークを導入しない場合、育児・介護理由で毎年1名が離職し、その都度中途採用（50万円/人）が必要になる。導入によりこれを防げるので、5年間で5人分＝50万円×5人＝250万円の削減<br>削減額合計＝500＋600＋250＝1,350万円</p><p>【必要な費用】<br>・テレワーク用PC購入費：初期費用8万円/台 ×10台＝80万円<br>・リモートアクセスツール初期費用：1万円/人×10人＝10万円<br>・リモートアクセスツール運用費：2万円/年・人×10人×5年＝100万円<br>・インターネット回線運用費：6万円/年・人×10人×5年＝300万円<br>費用合計＝80＋10＋100＋300＝490万円</p><p>したがって5年間の効果（削減額合計−費用合計）＝1,350−490＝860万円となり、選択肢イが正解である。</p>","mnemonic":"「1350引く490は八百六十(860)」―5年分の削減1,350万円から導入費用490万円を引けば残るのは860万円、選択肢イに直結。"},{"id":264,"year":2021,"period":"令和3年度秋期","num":25,"cat":"ストラテジ系","field":"システム調達","summary":"システム調達：令和3年度秋期 問25","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>RFIを説明したものはどれか。</p>","choices":[{"label":"ア","html":"サービス提供者と顧客との間で、提供するサービスの内容、品質などに関する保証範囲やペナルティについてあらかじめ契約としてまとめた文書"},{"label":"イ","html":"システム化に当たって、現在の状況において利用可能な技術・製品、ベンダにおける導入実績など実現手段に関する情報提供をベンダに依頼する文書"},{"label":"ウ","html":"システムの調達のために、調達側からベンダに技術的要件、サービスレベル要件、契約条件などを提示し、指定した期限内で実現策の提案を依頼する文書"},{"label":"エ","html":"要件定義との整合性を図り、利用者と開発要員及び運用要員の共有物とするために、業務処理の概要、入出力情報の一覧、データフローなどをまとめた文書"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RFI（Request For Information：情報提供依頼書）は、システム化に当たって、現在の状況において利用可能な技術や製品、ベンダにおける導入実績など、調達の検討に必要な情報の提供をベンダに依頼する文書である。正式な調達（RFP）を行う前の初期段階で、市場にどのような選択肢があるかを把握するために用いられる。選択肢イの説明はこのRFIの内容そのものである。</p><p>選択肢アはSLA（サービスレベルアグリーメント）の説明であり、サービス提供者と顧客との間で品質保証範囲やペナルティをあらかじめ契約として定めたものである。選択肢ウはRFP（提案依頼書）の説明であり、調達側がベンダに技術的要件やサービスレベル要件、契約条件を提示して提案を依頼する文書であって、RFIより後の、より具体的な調達段階で使われる。選択肢エは要件定義書（または機能要件を整理した文書）の説明に近く、業務処理の概要や入出力情報、データフローなどを利用者と開発・運用要員の間で共有するための文書である。</p>","mnemonic":""},{"id":265,"year":2021,"period":"令和3年度秋期","num":26,"cat":"ストラテジ系","field":"経営戦略フレームワーク","summary":"経営戦略フレームワーク：令和3年度秋期 問26","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>バリューチェーンの説明はどれか。</p>","choices":[{"label":"ア","html":"企業活動を、五つの主活動と四つの支援活動に区分し、企業の競争優位の源泉を分析するフレームワーク"},{"label":"イ","html":"企業の内部環境と外部環境を分析し、自社の強みと弱み、自社を取り巻く機会と脅威を整理し明確にする手法"},{"label":"ウ","html":"財務、顧客、内部ビジネスプロセス、学習と成長の四つの視点から企業を分析し、戦略マップを策定するフレームワーク"},{"label":"エ","html":"商品やサービスを、誰に、何を、どのように提供するかを分析し、事業領域を明確にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バリューチェーン（価値連鎖）は、経営学者マイケル・ポーターが著書『競争優位の戦略』（1985年）で提唱したフレームワークであり、企業活動を購買物流・製造・出荷物流・販売マーケティング・サービスという五つの主活動と、全般管理・人事労務管理・技術開発・調達活動という四つの支援活動に区分し、どの活動が付加価値（マージン）を生み出し、どこに競争優位の源泉があるかを分析する手法である。選択肢アの説明はこのバリューチェーン分析の内容そのものである。</p><p>選択肢イは自社の強み・弱みと外部の機会・脅威を整理するSWOT分析の説明である。選択肢ウは財務・顧客・内部ビジネスプロセス・学習と成長の四つの視点から戦略マップを策定するバランススコアカード（BSC）の説明である。選択肢エは誰に・何を・どのように提供するかを分析して事業領域（ドメイン）を明確にする手法の説明であり、いずれもバリューチェーンとは異なるフレームワークである。</p>","mnemonic":""},{"id":266,"year":2021,"period":"令和3年度秋期","num":27,"cat":"ストラテジ系","field":"新規事業開発手法","summary":"新規事業開発手法：令和3年度秋期 問27","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>新しい事業に取り組む際の手法として、E.リースが提唱したリーンスタートアップの説明はどれか。</p>","choices":[{"label":"ア","html":"国・地方公共団体など、公共機関の補助金・助成金の交付を前提とし、事前に詳細な事業計画を検討・立案した上で、公共性のある事業を立ち上げる手法"},{"label":"イ","html":"市場環境の変化によって競争力を喪失した事業分野に対して、経営資源を大規模に追加投入し、リニューアルすることによって、基幹事業として再出発を期す手法"},{"label":"ウ","html":"持続可能な事業を迅速に構築し、展開するために、あらかじめ詳細に立案された事業計画を厳格に遂行して、成果の検証や計画の変更を最小限にとどめる手法"},{"label":"エ","html":"実用最小限の製品・サービスを短期間で作り、構築・計測・学習というフィードバックループで改良や方向転換をして、継続的にイノベーションを行う手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>リーンスタートアップは、エリック・リースが2008年頃に提唱した、新しい事業やサービスを立ち上げる際の手法である。実用最小限の製品（MVP：Minimum Viable Product）を短期間で作り、それを顧客に実際に使ってもらうことで仮説を検証し、「構築（Build）・計測（Measure）・学習（Learn）」というフィードバックループを高速に回しながら、得られた学びをもとに改良や方向転換（ピボット）を行い、継続的にイノベーションを進めていく手法である。選択肢エの説明はこの内容と一致する。</p><p>選択肢アは公共機関の補助金・助成金を前提とした事業立ち上げの説明であり、リーンスタートアップとは無関係である。選択肢イは競争力を喪失した事業に大規模な経営資源を追加投入して再出発を図る手法であり、小さく始めて検証しながら進めるリーンスタートアップの考え方とは正反対である。選択肢ウは「あらかじめ詳細に立案された事業計画を厳格に遂行して、計画の変更を最小限にとどめる」としており、仮説検証と方向転換を前提とするリーンスタートアップとはむしろ対照的な、従来型の計画駆動アプローチの説明である。</p>","mnemonic":""},{"id":267,"year":2021,"period":"令和3年度秋期","num":28,"cat":"ストラテジ系","field":"IoT技術動向","summary":"IoT技術動向：令和3年度秋期 問28","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>IoTの技術として注目されている、エッジコンピューティングの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"演算処理のリソースをセンサ端末の近傍に置くことによって、アプリケーション処理の低遅延化や通信トラフィックの最適化を行う。"},{"label":"イ","html":"人体に装着して脈拍センサなどで人体の状態を計測して解析を行う。"},{"label":"ウ","html":"ネットワークを介して複数のコンピュータを結ぶことによって、全体として処理能力が高いコンピュータシステムを作る。"},{"label":"エ","html":"周りの環境から微小なエネルギーを収穫して、電力に変換する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>エッジコンピューティングは、IoT機器から送られるデータの処理を、クラウド上の集中したサーバではなく、センサ端末の近くに設置したサーバや端末自体（ネットワークの「端：エッジ」）で行う分散コンピューティングの考え方である。処理する場所をデータの発生源に近づけることで、クラウドとの往復にかかる通信遅延を減らし、アプリケーション処理の低遅延化や、全データをクラウドへ送らずに済むことによる通信トラフィックの最適化を実現できる。選択肢アの説明はこの内容と一致する。</p><p>選択肢イは人体に装着したセンサで状態を計測するウェアラブルデバイスの説明であり、エッジコンピューティングそのものの定義ではない。選択肢ウはネットワークを介して複数のコンピュータを結びつけ全体として処理能力を高める、グリッドコンピューティングや分散コンピューティング一般の説明に近く、エッジ（端）で処理するという点を明示していない。選択肢エは周囲の微弱なエネルギーを電力に変換するエネルギーハーベスティングの説明であり、エッジコンピューティングとは全く異なる技術である。</p>","mnemonic":""},{"id":268,"year":2021,"period":"令和3年度秋期","num":29,"cat":"ストラテジ系","field":"意思決定理論","summary":"意思決定理論：令和3年度秋期 問29","correct":"ア","result":"","formula":"マクシミン原理：各選択肢の最悪値（最小値）を求め、その中で最大のものを選ぶ","howto":"各株式について3つの経済状況（高・中・低）の中での最小値を求め、その最小値が最も大きい株式を選ぶ。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>いずれも時価100円の株式A〜Dのうち、一つの株式に投資したい。経済の成長を高、中、低の三つに区分したときのそれぞれの株式の予想値上がり幅は、表のとおりである。マクシミン原理に従うとき、どの株式に投資することになるか。</p><table border='1' style='border-collapse:collapse;text-align:center'><tr><th>株式＼経済の成長</th><th>高</th><th>中</th><th>低</th></tr><tr><td>A</td><td>20</td><td>10</td><td>15</td></tr><tr><td>B</td><td>25</td><td>5</td><td>20</td></tr><tr><td>C</td><td>30</td><td>20</td><td>5</td></tr><tr><td>D</td><td>40</td><td>10</td><td>−10</td></tr></table><p>（単位：円）</p>","choices":[{"label":"ア","html":"A"},{"label":"イ","html":"B"},{"label":"ウ","html":"C"},{"label":"エ","html":"D"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マクシミン原理は、各選択肢について起こりうる最悪の結果（最小値）を求め、その最悪の結果の中で最も良いもの（最大値）を選ぶという、リスク回避的な意思決定の考え方である。</p><p>各株式の最小値（最悪のケース）を求めると、A=min(20,10,15)=10、B=min(25,5,20)=5、C=min(30,20,5)=5、D=min(40,10,−10)=−10となる。</p><p>これらの最小値の中で最大のものはAの10円であるため、マクシミン原理に従うとAに投資することになる。</p>","mnemonic":"「最悪でも一番マシなのはA」―A・B・C・Dの最悪値10・5・5・−10を比べると、どん底でも一番マシなのはAの10円。"},{"id":269,"year":2021,"period":"令和3年度秋期","num":30,"cat":"ストラテジ系","field":"労働法規","summary":"労働法規：令和3年度秋期 問30","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>労働基準法で定める36協定において、あらかじめ労働の内容や事情などを明記することによって、臨時的に限度時間の上限を超えて勤務させることが許される特別条項を適用する36協定届の事例として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"商品の売上が予想を超えたことによって、製造、出荷及び顧客サービスの作業量が増大したので、期間を3か月間とし、限度時間を超えて勤務する人数や所要時間を定めて特別条項を適用した。"},{"label":"イ","html":"新技術を駆使した新商品の研究開発業務がピークとなり、3か月間の業務量が増大したので、労働させる必要があるために特別条項を適用した。"},{"label":"ウ","html":"退職者の増加に伴い従業員一人当たりの業務量が増大したので、新規に要員を雇用できるまで、特に期限を定めずに特別条項を適用した。"},{"label":"エ","html":"慢性的な人手不足なので、増員を実施し、その効果を想定して1年間を期限とし、特別条項を適用した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>労働基準法が定める36協定（時間外労働・休日労働に関する労使協定）では、時間外労働の上限は原則として月45時間・年360時間（限度時間）とされている。ただし、通常予見できない業務量の大幅な増加など、臨時的に限度時間を超えて労働させる必要がある特別な事情がある場合に限り、あらかじめ36協定に「特別条項」を定めておくことで、限度時間を超える時間外労働が認められる。特別条項には、年720時間以内、複数月平均80時間以内、月100時間未満、限度時間（月45時間）を超えられる月は年6回までという上限があり、かつ「臨時的」であることが要件とされている。選択肢アの「商品の売上が予想を超えたことによる作業量増大」に対し、期間を3か月間と区切り、人数や所要時間を定めて特別条項を適用した事例は、この「臨時的」「期間限定」という要件を満たしており、適切な特別条項の運用例である。</p><p>選択肢イは理由づけが曖昧で、具体的な人数や時間の定めなど要件を満たす形で明記されていない点が問題となりうる。選択肢ウは「特に期限を定めずに」特別条項を適用しており、特別条項はあくまで臨時的・一時的な措置であるべきで、期限を定めないのは要件に反する。選択肢エは「慢性的な人手不足」を理由としているが、これは本来、臨時的な事情ではなく恒常的な人員不足の問題であり、特別条項ではなく人員増強などで対応すべき事柄であるため、特別条項の適用事由としては不適切である。</p>","mnemonic":""},{"id":270,"year":2021,"period":"令和3年度春期","num":1,"cat":"テクノロジ系","field":"論理演算","summary":"論理演算：令和3年度春期 問1","correct":"ア","result":"","formula":"相補演算＝真理値表の全出力ビットを反転したもの","howto":"排他的論理和（XOR）の真理値表を書き、各行の出力をすべて反転させて一致する演算を探す","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>任意のオペランドに対するブール演算Aの結果とブール演算Bの結果が互いに否定の関係にあるとき，AはBの（又は，BはAの）相補演算であるという。排他的論理和の相補演算はどれか。</p>","choices":[{"label":"ア","html":"等価演算（ベン図では両円の一致部分と外側の非重複部分を塗った演算）"},{"label":"イ","html":"否定論理和"},{"label":"ウ","html":"論理積"},{"label":"エ","html":"論理和"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>XOR（排他的論理和）の真理値表は，(A,B)=(0,0),(0,1),(1,0),(1,1)の順に出力が 0,1,1,0 となる。相補演算とは全ての出力ビットを反転させたものなので，1,0,0,1 という出力になる演算を探せばよい。これは「AとBの値が一致するときに1を返す」演算，すなわち等価演算（XNOR）の真理値表と完全に一致する。したがって排他的論理和の相補演算は等価演算であり，正解はアである。</p>","mnemonic":"排他的論理和の出力0,1,1,0を丸ごと反転すると1,0,0,1になり、これは一致したら1を返す等価演算と同じ形になる"},{"id":271,"year":2021,"period":"令和3年度春期","num":2,"cat":"テクノロジ系","field":"スタック・組合せ","summary":"スタック・組合せ：令和3年度春期 問2","correct":"ウ","result":"","formula":"n個のデータに対するスタック出力順列数＝カタラン数 Cn = (2n)! / ((n+1)! n!)","howto":"全n!通りの出力順のうち，後入れ先出しの構造上実現不可能な順序を取り除いて数える","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>A，B，Cの順序で入力されるデータがある。各データについてスタックへの挿入と取出しを1回ずつ行うことができる場合，データの出力順序は何通りあるか。</p><p>（図：A,B,Cが順にスタックへ入力され，任意のタイミングでスタックから取り出すことができる構造）</p>","choices":[{"label":"ア","html":"3"},{"label":"イ","html":"4"},{"label":"ウ","html":"5"},{"label":"エ","html":"6"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A，B，Cの3個のデータについて，push／popを自由に組み合わせたときに実現できる出力順序を考える。全順列は3!=6通りあるが，スタック（後入れ先出し）の構造上，「C，A，B」の順（＝先に積んだA，Bより後に積んだCを先に出した後，Aを先にBより先に出す）だけは実現できない。なぜなら，Cを先に出すにはA，Bをすでに積んだ状態（スタックは下からA，Bの順）にしておく必要があり，その後はBがAより上にあるため，Aより先にBを出すことはできないからである。したがって実現可能な出力順序はABC，ACB，BAC，BCA，CBAの5通りであり，正解はウである。この5という数は，n=3のときのカタラン数 C3 = (2×3)!/(4!×3!) = 5 とも一致する。</p>","mnemonic":"3個なら全6通り中、後から積んだCを飛び越してAを先に出す「C→A→B」の1通りだけが不可能なので6-1=5通り"},{"id":272,"year":2021,"period":"令和3年度春期","num":3,"cat":"テクノロジ系","field":"アルゴリズム設計","summary":"アルゴリズム設計：令和3年度春期 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>アルゴリズム設計としての分割統治法に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"与えられた問題を直接解くことが難しいときに，幾つかに分割した一部分に注目し，とりあえず粗い解を出し，それを逐次改良して精度の良い解を得る方法である。"},{"label":"イ","html":"起こり得る全てのデータを組み合わせ，それぞれの解を調べることによって，データの組合せのうち無駄なものを除き，実際に調べる組合せ数を減らす方法である。"},{"label":"ウ","html":"全体を幾つかの小さな問題に分割して，それぞれの小さな問題を独立に処理した結果をつなぎ合わせて，最終的に元の問題を解決する方法である。"},{"label":"エ","html":"まずは問題全体のことは考えずに，問題をある尺度に沿って分解し，各時点で最良の解を選択し，これを繰り返すことによって，全体の最適解を得る方法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>分割統治法（divide and conquer）とは，全体の問題をいくつかの独立した小さな問題に分割し，それぞれを独立に解いた後，その結果を統合（つなぎ合わせ）して元の問題の解を得るアルゴリズム設計手法である。マージソートやクイックソート，高速フーリエ変換などが代表例であり，「分割」「統治（各部分を解く）」「統合」という3段階で構成される点が特徴である。選択肢アは逐次改良を行うヒューリスティックな最適化手法（焼きなまし法などに近い）の説明，イは枝刈りによって調べる組合せ数を減らす分枝限定法の説明，エは各段階で局所的に最良の選択を重ねる貪欲法（グリーディ法）の説明であり，いずれも「独立した小問題に分割して解を統合する」という分割統治法の本質とは異なる。</p>","mnemonic":""},{"id":273,"year":2021,"period":"令和3年度春期","num":4,"cat":"テクノロジ系","field":"キャッシュメモリ","summary":"キャッシュメモリ：令和3年度春期 問4","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>キャッシュメモリへの書込み動作には，ライトスルー方式とライトバック方式がある。それぞれの特徴のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"ライトスルー方式では，データをキャッシュメモリにだけ書き込むので，高速に書込みができる。"},{"label":"イ","html":"ライトスルー方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，主記憶の内容は常に最新である。"},{"label":"ウ","html":"ライトバック方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，速度が遅い。"},{"label":"エ","html":"ライトバック方式では，読出し時にキャッシュミスが発生してキャッシュメモリの内容が追い出されるときに，主記憶に書き戻す必要が生じることはない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ライトスルー方式は，CPUがキャッシュメモリに書き込むと同時に主記憶にも同じデータを書き込む方式であり，主記憶の内容が常に最新に保たれるという利点がある一方，書込みのたびに低速な主記憶へのアクセスが発生するため速度面では不利になる。ライトバック方式は，通常はキャッシュメモリのみに書き込み，該当するキャッシュラインが追い出される（キャッシュミスなどで置き換えられる）タイミングでまとめて主記憶へ反映するため，書込み自体は高速だが，追い出し時には主記憶への書き戻し（ライトバック）が必要になる。したがって，アはライトスルーを高速とする点が誤り，ウはライトバックを低速とする点が誤り，エはライトバックで追い出し時に書き戻しが不要としている点が誤りであり，主記憶を常に最新に保つライトスルー方式の説明であるイが正しい。</p>","mnemonic":""},{"id":274,"year":2021,"period":"令和3年度春期","num":5,"cat":"テクノロジ系","field":"稼働率","summary":"稼働率：令和3年度春期 問5","correct":"エ","result":"","formula":"f(x) = 1 − (1 − x²)²（直列2台の稼働率x²を2系統並列にした式）","howto":"直列部分の稼働率x²をまず求め，それを2系統並列にした1-(1-x²)²を計算し，y=xとの大小をいくつかのxで比較してグラフの形を判断する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>稼働率がxである装置を四つ組み合わせて，図のようなシステムを作ったときの稼働率をf(x)とする。区間0≦x≦1におけるy=f(x)の傾向を表すグラフはどれか。ここで，破線はy=xのグラフである。</p><p>（図のシステム構成：稼働率xの装置2台を直列にした経路が2系統あり，その2系統が並列に接続されている。すなわち上の経路はx→x，下の経路もx→xで，上下2経路が並列構成。）</p>","choices":[{"label":"ア","html":"区間全体でy=xより上側に膨らむ，滑らかな凸型の曲線（0と1でy=xと一致）"},{"label":"イ","html":"区間全体でy=xより下側に膨らむ，滑らかな凹型の曲線（0と1でy=xと一致）"},{"label":"ウ","html":"原点付近ではy=xより上側，中央付近でy=xを下回り，終点付近で再び上側に戻るS字型の曲線"},{"label":"エ","html":"原点付近ではy=xより下側，x≈0.6付近でy=xと交わり，それ以降はy=xより上側を保つS字型の曲線"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>上下それぞれの経路は装置2台の直列接続なので，各経路の稼働率はx×x=x²である。この2経路が並列接続されているので，システム全体の稼働率はf(x)=1-(1-x²)²=2x²-x⁴となる。ここでf(x)-x=-x(x-1)(x²+x-1)と因数分解でき，0と1以外の実根はx=(√5-1)/2≈0.618である。実際にx=0.5を代入するとf(0.5)=2×0.25-0.0625=0.4375<0.5となりy=xより下側，x=0.9を代入するとf(0.9)=2×0.81-0.6561=0.9639>0.9となりy=xより上側になる。つまりこの曲線は原点付近ではy=xの下側にあり，x≈0.618付近でy=xと交差し，それ以降はy=xの上側に抜けていく。この挙動に一致するグラフはエである。</p>","mnemonic":"x=0.5を代入するとf=0.4375で対角線の下、x=0.9ならf=0.9639で対角線の上になり、曲線が下から上へ抜けるエが正解"},{"id":275,"year":2021,"period":"令和3年度春期","num":6,"cat":"テクノロジ系","field":"仮想記憶管理","summary":"仮想記憶管理：令和3年度春期 問6","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ページング方式の仮想記憶において，ページアクセス時に発生する事象をその回数の多い順に並べたものはどれか。ここで，A≧Bは，Aの回数がBの回数以上，A=Bは，AとBの回数が常に同じであることを表す。</p>","choices":[{"label":"ア","html":"ページアウト≧ページイン≧ページフォールト"},{"label":"イ","html":"ページアウト≧ページフォールト≧ページイン"},{"label":"ウ","html":"ページフォールト＝ページアウト≧ページイン"},{"label":"エ","html":"ページフォールト＝ページイン≧ページアウト"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>仮想記憶において，必要なページが主記憶上に存在しないとページフォールトが発生し，そのページを補助記憶から主記憶へ読み込む「ページイン」が必ず1回行われる。したがって，ページフォールトの回数とページインの回数は常に等しい（ページフォールト＝ページイン）。一方，ページアウトは，新しいページを読み込む際に主記憶に空きページ枠がない場合にだけ，既存の古いページを追い出すために発生する処理であり，空き枠がある間は発生しない。したがって，ページアウトの回数はページイン（＝ページフォールト）の回数を超えることはなく，多い順に並べると「ページフォールト＝ページイン≧ページアウト」となる。選択肢ア・イはページアウトがページインより多くなり得るとしている点で，ページアウトが追い出しの必要な場合にしか発生しないという性質に反するため誤りである。</p>","mnemonic":""},{"id":276,"year":2021,"period":"令和3年度春期","num":7,"cat":"テクノロジ系","field":"RFID","summary":"RFID：令和3年度春期 問7","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>RFIDの活用事例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"紙に印刷されたディジタルコードをリーダで読み取ることによる情報の入力"},{"label":"イ","html":"携帯電話とヘッドフォンとの間の音声データ通信"},{"label":"ウ","html":"赤外線を利用した近距離データ通信"},{"label":"エ","html":"微小な無線チップによる人又は物の識別及び管理"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RFID（Radio Frequency IDentification）は，ID情報を記録した微小な無線ICチップ（RFIDタグ）と，リーダ／ライタが電波を使って非接触でデータをやり取りする自動認識技術である。タグを荷札や値札，社員証，動物の個体識別票などに組み込むことで，人や物の識別・管理に広く活用されている。選択肢アは印刷されたコード（バーコードや二次元コードなど）を光学的に読み取る技術の説明，イはBluetoothなどの近距離無線音声通信の説明，ウは赤外線通信（IrDAなど）の説明であり，いずれも電波を用いた非接触のIC識別技術であるRFIDとは異なる仕組みである。</p>","mnemonic":""},{"id":277,"year":2021,"period":"令和3年度春期","num":8,"cat":"テクノロジ系","field":"画像フォーマット","summary":"画像フォーマット：令和3年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>W3Cで仕様が定義され，矩形や円，直線，文字列などの図形オブジェクトをXML形式で記述し，Webページでの図形描画にも使うことができる画像フォーマットはどれか。</p>","choices":[{"label":"ア","html":"OpenGL"},{"label":"イ","html":"PNG"},{"label":"ウ","html":"SVG"},{"label":"エ","html":"TIFF"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SVG（Scalable Vector Graphics）は，W3Cが仕様を策定したXMLベースのベクタ画像フォーマットであり，矩形や円，直線，文字列などの図形オブジェクトをXMLのタグとして記述する。ベクタ形式であるため拡大・縮小しても画質が劣化せず，HTML内に直接埋め込んでWebページでの図形描画にも利用できる点が特徴である。OpenGLは3Dグラフィックスを描画するためのAPI（画像フォーマットではない），PNGとTIFFはいずれもピクセル単位で色情報を保持するビットマップ（ラスタ）形式の画像フォーマットであり，図形オブジェクトをXMLで記述する仕組みは持たない。</p>","mnemonic":""},{"id":278,"year":2021,"period":"令和3年度春期","num":9,"cat":"テクノロジ系","field":"データレイク","summary":"データレイク：令和3年度春期 問9","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>データレイクの特徴はどれか。</p>","choices":[{"label":"ア","html":"大量のデータを分析し，単なる検索だけでは分からない隠れた規則や相関関係を見つけ出す。"},{"label":"イ","html":"データウェアハウスに格納されたデータから特定の用途に必要なデータだけを取り出し，構築する。"},{"label":"ウ","html":"データウェアハウスやデータマートからデータを取り出し，多次元分析を行う。"},{"label":"エ","html":"必要に応じて加工するために，データを発生したままの形で格納する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>データレイクとは，構造化データだけでなく半構造化データや非構造化データも含め，発生した生のままの形式でスキーマを定めずに大量に格納しておくリポジトリであり，格納後に必要に応じて目的別のスキーマを当てはめて加工・分析できる柔軟性（スキーマオンリード）が特徴である。選択肢アは大量データから隠れた規則・相関関係を発見するデータマイニングの説明，イ・ウはデータウェアハウスやデータマートからあらかじめ整形・構造化されたデータを取り出して特定用途に加工したり多次元分析を行ったりする処理の説明であり，いずれも事前に構造化されたデータを扱う点でデータレイクの特徴とは異なる。</p>","mnemonic":""},{"id":279,"year":2021,"period":"令和3年度春期","num":10,"cat":"テクノロジ系","field":"サブネットマスク","summary":"サブネットマスク：令和3年度春期 問10","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>IPv4ネットワークで使用されるIPアドレスaとサブネットマスクmからホストアドレスを求める式はどれか。ここで，“～”はビット反転の演算子，“|”はビットごとの論理和の演算子，“&”はビットごとの論理積の演算子を表し，ビット反転の演算子の優先順位は論理和，論理積の演算子よりも高いものとする。</p>","choices":[{"label":"ア","html":"～a & m"},{"label":"イ","html":"～a | m"},{"label":"ウ","html":"a & ～m"},{"label":"エ","html":"a | ～m"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サブネットマスクmは，ネットワーク部のビットが1，ホスト部のビットが0になっているビット列である。これを反転した～mは，逆にネットワーク部が0，ホスト部が1になるビット列になる。IPアドレスaと～mとの論理積（AND）をとると，ネットワーク部のビットは強制的に0にクリアされ，ホスト部のビットだけが元の値のまま残る。これがまさにホストアドレス（ホスト部）を求める計算であり，正しい式は「a & ～m」である。選択肢ア・イのように先にaを反転すると全く別の値になってしまい，エの「a | ～m」はホスト部のビットを全て1にする計算になるため，これはホストアドレスではなくブロードキャストアドレスを求める式に相当する。</p>","mnemonic":""},{"id":280,"year":2021,"period":"令和3年度春期","num":11,"cat":"テクノロジ系","field":"SDN","summary":"SDN：令和3年度春期 問11","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>ONF（Open Networking Foundation）が標準化を進めているOpenFlowプロトコルを用いたSDN（Software-Defined Networking）の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"管理ステーションから定期的にネットワーク機器のMIB（Management Information Base）情報を取得して，稼働監視や性能管理を行うためのネットワーク管理手法"},{"label":"イ","html":"データ転送機能をもつネットワーク機器同士が経路情報を交換して，ネットワーク全体のデータ転送経路を決定する方式"},{"label":"ウ","html":"ネットワーク制御機能とデータ転送機能を実装したソフトウェアを，仮想環境で利用するための技術"},{"label":"エ","html":"ネットワーク制御機能とデータ転送機能を論理的に分離し，コントローラと呼ばれるソフトウェアで，データ転送機能をもつネットワーク機器の集中制御を可能とするアーキテクチャ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SDN（Software-Defined Networking）は，従来ネットワーク機器内で一体化していた「制御機能（経路決定など）」と「データ転送機能（パケット転送）」を論理的に分離し，コントローラと呼ばれるソフトウェアが複数のネットワーク機器のデータ転送機能を集中的に制御するアーキテクチャである。ONFが標準化を進めるOpenFlowは，このコントローラと転送機器（スイッチ）との間でフローテーブルなどの経路情報をやり取りするための代表的なプロトコルである。選択肢アはSNMPを用いたネットワーク管理手法，イはルーティングプロトコルによる経路交換方式，ウは仮想化技術（NFVに近い概念）の説明であり，いずれも「制御と転送の分離＋集中制御」というSDN／OpenFlowの本質とは異なる。</p>","mnemonic":""},{"id":281,"year":2021,"period":"令和3年度春期","num":12,"cat":"テクノロジ系","field":"暗号学的ハッシュ関数","summary":"暗号学的ハッシュ関数：令和3年度春期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>暗号学的ハッシュ関数における原像計算困難性，つまり一方向性の性質はどれか。</p>","choices":[{"label":"ア","html":"あるハッシュ値が与えられたとき，そのハッシュ値を出力するメッセージを見つけることが計算量的に困難であるという性質"},{"label":"イ","html":"入力された可変長のメッセージに対して，固定長のハッシュ値を生成できるという性質"},{"label":"ウ","html":"ハッシュ値が一致する二つの相異なるメッセージを見つけることが計算量的に困難であるという性質"},{"label":"エ","html":"ハッシュの処理メカニズムに対して，外部からの不正な観測や改変を防御できるという性質"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>暗号学的ハッシュ関数の原像計算困難性（一方向性）とは，あるハッシュ値が与えられたときに，そのハッシュ値を出力するような元のメッセージ（原像）を見つけることが計算量的に困難であるという性質である。この性質により，パスワードなどのハッシュ値から元の値を逆算されるリスクを防いでいる。選択肢ウは「同じハッシュ値を持つ二つの異なるメッセージ」を探す困難さを述べており，これは原像計算困難性とは別の性質である衝突困難性の説明である。イは安全性の性質ではなく，可変長入力から固定長出力を生成するというハッシュ関数の基本機能を述べたものにすぎない。</p>","mnemonic":""},{"id":282,"year":2021,"period":"令和3年度春期","num":13,"cat":"テクノロジ系","field":"サイバーセキュリティ経営","summary":"サイバーセキュリティ経営：令和3年度春期 問13","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>経済産業省とIPAが策定した“サイバーセキュリティ経営ガイドライン（Ver2.0）”の説明はどれか。</p>","choices":[{"label":"ア","html":"企業がIT活用を推進していく中で，サイバー攻撃から企業を守る観点で経営者が認識すべき3原則と，サイバーセキュリティ対策を実施する上での責任者となる担当幹部に，経営者が指示すべき重要10項目をまとめたもの"},{"label":"イ","html":"経営者がサイバーセキュリティについて方針を示し，マネジメントシステムの要求事項を満たすルールを定め，組織が保有する情報資産をCIAの観点から維持管理し，それらを継続的に見直すためのプロセス及び管理策を体系的に規定したもの"},{"label":"ウ","html":"事業体のITに関する経営者の活動を，大きくITガバナンス（統制）とITマネジメント（管理）に分割し，具体的な目標と工程として40のプロセスを定義したもの"},{"label":"エ","html":"世界的規模で生じているサイバーセキュリティ上の脅威の深刻化に関して，企業の経営者を支援する施策を総合的かつ効果的に推進するための国の責務を定めたもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>経済産業省とIPAが策定した「サイバーセキュリティ経営ガイドライン」は，企業がITを積極的に活用し攻めの経営を進める中で，サイバー攻撃から企業を守る観点から経営者が認識すべき3原則（経営者のリーダーシップ，サプライチェーン全体への目配り，平時・緊急時のコミュニケーション）と，サイバーセキュリティ対策の実施責任者となる担当幹部（CISO等）に経営者が指示すべき重要10項目をまとめた文書である。選択肢イはISMS（情報セキュリティマネジメントシステム）の説明に近く，ウはCOBITなどのITガバナンス／マネジメントフレームワークの説明，エはサイバーセキュリティ基本法のような国の政策文書の説明であり，いずれも経営者向けガイドラインとは異なる文書の特徴を述べている。</p>","mnemonic":""},{"id":283,"year":2021,"period":"令和3年度春期","num":14,"cat":"テクノロジ系","field":"セキュリティ組織","summary":"セキュリティ組織：令和3年度春期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>JPCERTコーディネーションセンターの説明はどれか。</p>","choices":[{"label":"ア","html":"産業標準化法に基づいて経済産業省に設置されている審議会であり，産業標準化全般に関する調査・審議を行っている。"},{"label":"イ","html":"電子政府推奨暗号の安全性を評価・監視し，暗号技術の適切な実装法・運用法を調査・検討するプロジェクトであり，総務省及び経済産業省が共同で運営する暗号技術検討会などで構成される。"},{"label":"ウ","html":"特定の政府機関や企業から独立した組織であり，国内のコンピュータセキュリティインシデントに関する報告の受付，対応の支援，発生状況の把握，手口の分析，再発防止策の検討や助言を行っている。"},{"label":"エ","html":"内閣官房に設置され，我が国をサイバー攻撃から防衛するための司令塔機能を担う組織である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JPCERTコーディネーションセンター（JPCERT/CC）は，特定の政府機関や企業から独立した中立的な組織であり，国内のコンピュータセキュリティインシデントに関する報告の受付，対応の支援，発生状況の把握，手口の分析，再発防止策の検討や助言を行う，日本における代表的なCSIRT（ナショナルCSIRT）である。選択肢アは産業標準化法に基づく審議会（日本産業標準調査会：JISCなど）の説明，イは電子政府推奨暗号を検討するCRYPTRECの説明，エは内閣サイバーセキュリティセンター（NISC）の説明であり，いずれもJPCERT/CCとは異なる組織を指している。</p>","mnemonic":""},{"id":284,"year":2021,"period":"令和3年度春期","num":15,"cat":"テクノロジ系","field":"セッション管理","summary":"セッション管理：令和3年度春期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>Webシステムにおいて，セッションの乗っ取りの機会を減らすために，利用者のログアウト時にWebサーバ又はWebブラウザにおいて行うべき処理はどれか。ここで，利用者は自分専用のPCにおいて，Webブラウザを利用しているものとする。</p>","choices":[{"label":"ア","html":"Webサーバにおいてセッション ID を内蔵ストレージに格納する。"},{"label":"イ","html":"Webサーバにおいてセッション ID を無効にする。"},{"label":"ウ","html":"WebブラウザにおいてキャッシュしているWebページをクリアする。"},{"label":"エ","html":"Webブラウザにおいてセッション ID を内蔵ストレージに格納する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>セッションの乗っ取り（ハイジャック）の機会を減らすには，ログアウト時にサーバ側でそのセッションIDを無効化し，以後そのセッションIDが使えないようにすることが最も効果的である。セッションIDをストレージに格納したり，ブラウザのキャッシュをクリアしたりするだけでは，サーバ側でそのセッションIDがまだ有効なままである限り，盗まれたセッションIDを使って第三者がなりすましアクセスできてしまう。したがって，ア・エ（ストレージへの格納は無効化と無関係）やウ（ブラウザキャッシュのクリアはサーバ側のセッションの有効性に影響しない）では対策として不十分であり，サーバ側でセッションIDを無効にするイが正しい。</p>","mnemonic":""},{"id":285,"year":2021,"period":"令和3年度春期","num":16,"cat":"テクノロジ系","field":"テストケース設計","summary":"テストケース設計：令和3年度春期 問16","correct":"ア","result":"","formula":"最小テストケース数＝各判定の分岐数の最大値（各判定が独立なら使い回せる）","howto":"各段の判定が独立であることを利用し，1回のテストケースで各段ごとに別々の分岐を通るように組み合わせれば，分岐数の最大値と同じ回数で全分岐を網羅できる","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>あるプログラムについて，流れ図で示される部分に関するテストを，命令網羅で実施する場合，最小のテストケース数は幾つか。ここで，各判定条件は流れ図に示された部分の先行する命令の結果から影響を受けないものとする。</p><p>（流れ図の構造：3方向に分岐する判定（ひし形）とそれに続く3つの処理ブロック（いずれか一つを通る）の組が，独立に3回連続して並んでいる。すなわち，1段目の判定で3つの処理ブロックのうち1つを実行し，2段目の判定でも3つのうち1つを実行し，3段目の判定でも3つのうち1つを実行する，という構成。）</p>","choices":[{"label":"ア","html":"3"},{"label":"イ","html":"6"},{"label":"ウ","html":"8"},{"label":"エ","html":"18"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>命令網羅とは，プログラム中の全ての命令（処理ブロック）を少なくとも1回は実行するようにテストケースを設計する基準である。この流れ図は，3方向に分岐する判定が3段あり，各段とも3つの処理ブロックのいずれか1つを通る構造になっている。各判定条件は先行する命令の結果から影響を受けない（独立している）ため，1回のテストケースで1段目・2段目・3段目それぞれ異なる分岐を選ぶことができる。したがって，3回のテストケースで，各段の3つの分岐をちょうど1回ずつ，全部で9個（3段×3分岐）の処理ブロックを漏れなく実行できる。これより少ない2回では，各段で最大2通りの分岐しかカバーできず，3通りある分岐を網羅できない。よって最小のテストケース数は3であり，正解はアである。</p>","mnemonic":"3分岐の判定が独立して3段あるが、各回で段ごとに違う枝を選べば3回の実行で9本の枝を3本ずつ分担して使い切れる"},{"id":286,"year":2021,"period":"令和3年度春期","num":17,"cat":"マネジメント系","field":"スクラム","summary":"スクラム：令和3年度春期 問17","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>スクラムチームにおけるプロダクトオーナの役割はどれか。</p>","choices":[{"label":"ア","html":"ゴールとミッションが達成できるように，プロダクトバックログのアイテムの優先順位を決定する。"},{"label":"イ","html":"チームのコーチやファシリテータとして，スクラムが円滑に進むように支援する。"},{"label":"ウ","html":"プロダクトを完成させるための具体的な作り方を決定する。"},{"label":"エ","html":"リリース判断可能な，プロダクトのインクリメントを完成する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スクラムチームにおけるプロダクトオーナ（PO）は，プロダクトの価値を最大化する責任を負い，プロダクトバックログの各アイテムに優先順位を付け，ゴールやミッションの達成に向けて何を先に開発すべきかを決定する役割を担う。選択肢イはスクラムマスターの役割（チームのコーチやファシリテーションによる進行支援）であり，ウ・エは開発チームの役割（具体的な実装方法の決定や，リリース判断可能なインクリメントの完成）であって，いずれもプロダクトオーナの職務ではない。</p>","mnemonic":""},{"id":287,"year":2021,"period":"令和3年度春期","num":18,"cat":"マネジメント系","field":"プロジェクトマネジメント標準","summary":"プロジェクトマネジメント標準：令和3年度春期 問18","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>JIS Q 21500:2018（プロジェクトマネジメントの手引）によれば，プロジェクトマネジメントのプロセスのうち，計画のプロセス群に属するプロセスはどれか。</p>","choices":[{"label":"ア","html":"スコープの定義"},{"label":"イ","html":"品質保証の遂行"},{"label":"ウ","html":"プロジェクト憲章の作成"},{"label":"エ","html":"プロジェクトチームの編成"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIS Q 21500（ISO 21500に対応するプロジェクトマネジメントの手引）は，プロジェクトマネジメントのプロセスを「立ち上げ」「計画」「実行」「管理」「終結」の5つのプロセス群に分類している。「スコープの定義」は，プロジェクトの要求事項や成果物の範囲を具体化する「計画」プロセス群に属するプロセスである。これに対し，選択肢イ（品質保証の遂行）とエ（プロジェクトチームの編成）は「実行」プロセス群，選択肢ウ（プロジェクト憲章の作成）は「立ち上げ」プロセス群に属するプロセスであり，いずれも計画のプロセス群には含まれない。</p>","mnemonic":""},{"id":288,"year":2021,"period":"令和3年度春期","num":19,"cat":"マネジメント系","field":"PERT・日程計算","summary":"PERT・日程計算：令和3年度春期 問19","correct":"ア","result":"","formula":"最早結合点時刻＝max(各流入経路の（開始時刻＋所要日数）)","howto":"図1・図2それぞれでCPM（クリティカルパス法）の前進計算を行い，分割後に別の経路（D→G）が新たなクリティカルパスに変わる点に注意しながら全体の所要日数の差を求める","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>プロジェクトのスケジュールを短縮したい。当初の計画は図1のとおりである。作業Eを作業E1，E2，E3に分けて，図2のとおりに計画を変更すると，スケジュールは全体で何日短縮できるか。</p>\n<table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse\">\n<tr><th colspan=\"4\">図1　当初の計画（開始ノードをSとする）</th></tr>\n<tr><th>作業</th><th>開始ノード</th><th>終了ノード</th><th>所要日数</th></tr>\n<tr><td>A</td><td>S</td><td>N1</td><td>5</td></tr>\n<tr><td>B</td><td>N1</td><td>N2</td><td>8</td></tr>\n<tr><td>C</td><td>N1</td><td>Nc</td><td>7</td></tr>\n<tr><td>D</td><td>N2</td><td>N3</td><td>7</td></tr>\n<tr><td>E（太線）</td><td>N2</td><td>Nf</td><td>9</td></tr>\n<tr><td>F</td><td>Nc</td><td>Nf</td><td>5</td></tr>\n<tr><td>G</td><td>N3</td><td>終了</td><td>7</td></tr>\n<tr><td>H</td><td>Nf</td><td>N6</td><td>4</td></tr>\n<tr><td>I</td><td>N6</td><td>終了</td><td>2</td></tr>\n</table>\n<table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse\">\n<tr><th colspan=\"4\">図2　変更後の計画</th></tr>\n<tr><th>作業</th><th>開始ノード</th><th>終了ノード</th><th>所要日数</th></tr>\n<tr><td>A</td><td>S</td><td>N1</td><td>5</td></tr>\n<tr><td>B</td><td>N1</td><td>N2</td><td>8</td></tr>\n<tr><td>C</td><td>N1</td><td>Nc</td><td>7</td></tr>\n<tr><td>D</td><td>N2</td><td>N3</td><td>7</td></tr>\n<tr><td>E1（太線）</td><td>N2</td><td>Nx</td><td>3</td></tr>\n<tr><td>E2（太線）</td><td>N2</td><td>Ny</td><td>4</td></tr>\n<tr><td>ダミー作業（破線，所要0日）</td><td>Ny</td><td>Nx</td><td>0</td></tr>\n<tr><td>E3（太線）</td><td>Nx</td><td>Nf</td><td>2</td></tr>\n<tr><td>F</td><td>Nc</td><td>Nf</td><td>5</td></tr>\n<tr><td>G</td><td>N3</td><td>終了</td><td>7</td></tr>\n<tr><td>H</td><td>Nf</td><td>N6</td><td>4</td></tr>\n<tr><td>I</td><td>N6</td><td>終了</td><td>2</td></tr>\n</table>","choices":[{"label":"ア","html":"1"},{"label":"イ","html":"2"},{"label":"ウ","html":"3"},{"label":"エ","html":"4"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>まず図1（当初）の各結合点の最早時刻を前進計算する。S=0日として，N1=5日（A），N2=N1+8=13日（B）。D経由ではN3=N2+7=20日，Gを経て終了は20+7=27日。一方，C経由ではNc=N1+7=12日，これにF（5日）を加えるとNf＝17日になるが，E経由（N2+9=22日）の方が大きいので，Nf＝max(17,22)=22日となる。ここからH（4日），I（2日）を経て終了は22+4+2=28日。したがって図1全体の所要日数は27日と28日の大きい方，すなわち28日である（N2→E→Nf→H→Iの経路がクリティカルパス）。</p>\n<p>次に図2（変更後）を計算する。E1とE2はともにN2（13日）から分岐し，Nx＝N2+E1=13+3=16日，Ny＝N2+E2=13+4=17日となる。NyからNxへダミー作業（所要0日）が張られているため，Nxの実際の最早時刻はE1経由とダミー経由の大きい方，max(16,17)=17日になる。ここからE3（2日）を経てNfに到達する時刻は17+2=19日であり，これはC→F経由の17日より大きいので，Nf＝19日となる。H（4日），I（2日）を経て終了は19+4+2=25日。一方，D→Gの経路は図1と変わらず27日のままである。したがって図2全体の所要日数は27日と25日の大きい方，すなわち27日となり，クリティカルパスがE経由からD→G経由へ移る。</p>\n<p>以上より，全体の所要日数は28日から27日へ短縮され，短縮できる日数は28－27＝1日である。作業Eの分割自体はその経路を22日から19日へ3日短縮する効果があるが，元々27日とあまり余裕のなかったD→Gの経路が新たなクリティカルパスになるため，プロジェクト全体で見ると短縮効果は1日にとどまる。</p>","mnemonic":"E経由は22日→19日に3日縮むが、元々27日あったD→G経路が新たな天井になるため全体は28日→27日と1日しか縮まらない"},{"id":289,"year":2021,"period":"令和3年度春期","num":20,"cat":"マネジメント系","field":"組合せ・工数計算","summary":"組合せ・工数計算：令和3年度春期 問20","correct":"エ","result":"","formula":"延べ時間＝nC2（組合せ数）×1回当たりの所要時間","howto":"16人から2人を選ぶ組合せの数16C2を求め，1回当たりの所要時間0.5時間を掛ける","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>プロジェクトメンバが16人のとき，1対1の総当たりでプロジェクトメンバ相互の顔合わせ会を行うためには，延べ何時間の顔合わせ会が必要か。ここで，顔合わせ会1回の所要時間は0.5時間とする。</p>","choices":[{"label":"ア","html":"8"},{"label":"イ","html":"16"},{"label":"ウ","html":"30"},{"label":"エ","html":"60"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>16人が1対1の総当たりで顔合わせを行う場合，必要な顔合わせ会の回数は16人から2人を選ぶ組合せの数16C2である。16C2＝16×15÷2＝120通り，すなわち120回の顔合わせ会が必要になる。1回当たりの所要時間は0.5時間なので，延べ時間は120×0.5＝60時間となり，正解はエである。</p>","mnemonic":"16人から2人を選ぶ組合せは16×15÷2=120試合、1試合0.5時間なので120×0.5=60時間"},{"id":290,"year":2021,"period":"令和3年度春期","num":21,"cat":"マネジメント系","field":"システム監査","summary":"システム監査：令和3年度春期 問21","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>マスタファイル管理に関するシステム監査項目のうち，可用性に該当するものはどれか。</p>","choices":[{"label":"ア","html":"マスタファイルが置かれているサーバを二重化し，耐障害性の向上を図っていること"},{"label":"イ","html":"マスタファイルのデータを複数件まとめて検索・加工するための機能が，システムに盛り込まれていること"},{"label":"ウ","html":"マスタファイルのメンテナンスは，特権アカウントを付与された者だけに許されていること"},{"label":"エ","html":"マスタファイルへのデータ入力チェック機能が，システムに盛り込まれていること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査における「可用性」とは，必要なときにシステムやデータを支障なく利用できる状態を確保することを指す。マスタファイルが置かれているサーバを二重化して耐障害性を高めることは，障害発生時にもシステムの利用を継続できるようにする施策であり，まさに可用性を高める取組みに該当する。選択肢イは業務の効率性（利便性・機能性），ウはアクセス制御による機密性（セキュリティ），エは入力チェックによる正確性（完全性）に関する監査の観点であり，いずれも可用性とは異なる評価軸に該当する。</p>","mnemonic":""},{"id":291,"year":2021,"period":"令和3年度春期","num":22,"cat":"マネジメント系","field":"システム監査","summary":"システム監査：令和3年度春期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>システム監査人が行う改善提案のフォローアップとして，適切なものはどれか。</p>","choices":[{"label":"ア","html":"改善提案に対する改善の実施を監査対象部門の長に指示する。"},{"label":"イ","html":"改善提案に対する監査対象部門の改善実施プロジェクトの管理を行う。"},{"label":"ウ","html":"改善提案に対する監査対象部門の改善状況をモニタリングする。"},{"label":"エ","html":"改善提案の内容を監査対象部門に示した上で改善実施計画を策定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査人が行う改善提案のフォローアップとは，監査対象部門が監査人の指摘・改善提案を踏まえて自ら改善を実施しているかどうかの状況を，監査人の立場から客観的にモニタリング（確認）することである。監査人が改善の実施そのものを指示したり（ア），改善実施プロジェクトを自ら管理したり（イ），改善実施計画の策定に関与したりする（エ）ことは，監査人としての独立性・客観性を損なう行為であり適切ではない。監査人はあくまで改善の実施主体にはならず，状況の確認・検証に徹する必要があるため，ウが正しい。</p>","mnemonic":""},{"id":292,"year":2021,"period":"令和3年度春期","num":23,"cat":"テクノロジ系","field":"エンタープライズアーキテクチャ","summary":"エンタープライズアーキテクチャ：令和3年度春期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>エンタープライズアーキテクチャの“四つの分類体系”に含まれるアーキテクチャは，ビジネスアーキテクチャ，テクノロジアーキテクチャ，アプリケーションアーキテクチャともう一つはどれか。</p>","choices":[{"label":"ア","html":"システムアーキテクチャ"},{"label":"イ","html":"ソフトウェアアーキテクチャ"},{"label":"ウ","html":"データアーキテクチャ"},{"label":"エ","html":"バスアーキテクチャ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>エンタープライズアーキテクチャ（EA）の「四つの分類体系」は，組織の業務とシステムを整理・最適化するために，ビジネスアーキテクチャ（業務体系），データアーキテクチャ（データ体系），アプリケーションアーキテクチャ（適用処理体系），テクノロジアーキテクチャ（技術体系）という4つの観点でモデル化する枠組みである。日本でも政府・自治体のEA策定ガイドラインなどでこの4体系が用いられている。選択肢ア「システムアーキテクチャ」，イ「ソフトウェアアーキテクチャ」，エ「バスアーキテクチャ」は，いずれもEAの四つの分類体系を構成する正式な用語ではない。</p>","mnemonic":""},{"id":293,"year":2021,"period":"令和3年度春期","num":24,"cat":"ストラテジ系","field":"システム調達","summary":"システム調達：令和3年度春期 問24","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>情報システムの調達の際に作成されるRFIの説明はどれか。</p>","choices":[{"label":"ア","html":"調達者から供給者候補に対して，システム化の目的や業務内容などを示し，必要な情報の提供を依頼すること"},{"label":"イ","html":"調達者から供給者候補に対して，対象システムや調達条件などを示し，提案書の提出を依頼すること"},{"label":"ウ","html":"調達者から供給者に対して，契約内容で取り決めた内容に関して，変更を要請すること"},{"label":"エ","html":"調達者から供給者に対して，双方の役割分担などを確認し，契約の締結を要請すること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RFI（Request for Information，情報提供依頼書）は，システム調達の初期段階で，調達者（発注者）が供給者候補（ベンダー）に対して，システム化の目的や業務内容などを示し，必要な技術情報や製品情報の提供を依頼する文書である。これにより調達者は市場動向や実現可能性を把握し，後続のRFP（提案依頼書）の内容を具体化していく。選択肢イはRFP（提案依頼書）の説明であり，提案書の提出を依頼する点でRFIより後の段階に当たる。ウは契約内容の変更交渉，エは契約締結の確認であり，いずれもRFIより更に後の調達プロセスに該当する。</p>","mnemonic":""},{"id":294,"year":2021,"period":"令和3年度春期","num":25,"cat":"ストラテジ系","field":"契約形態","summary":"契約形態：令和3年度春期 問25","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>システム開発委託契約の委託報酬におけるレベニューシェア契約の特徴はどれか。</p>","choices":[{"label":"ア","html":"委託側が開発するシステムから得られる収益とは無関係に開発に必要な費用を全て負担する。"},{"label":"イ","html":"委託側は開発するシステムから得られる収益に関係無く定額で費用を負担する。"},{"label":"ウ","html":"開発するシステムから得られる収益を委託側が受託側にあらかじめ決められた配分率で分配する。"},{"label":"エ","html":"受託側は継続的に固定額の収益が得られる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>レベニューシェア契約とは，システム開発の委託報酬を固定額とせず，開発したシステムが生み出す収益（売上）を，委託側と受託側であらかじめ取り決めた配分率に基づいて分配する契約形態である。委託側は開発初期の費用負担を抑えられる一方，受託側は収益が伸びれば報酬も増える可能性がある反面，収益が低迷すれば報酬も減少するリスクを負う。選択肢アは収益に関係なく委託側が費用を全額負担する通常の請負契約的な特徴であり，イ・エは「定額」「固定額」を前提としており，収益の変動に応じて報酬が変わるというレベニューシェアの本質的な特徴とは相いれない。</p>","mnemonic":""},{"id":295,"year":2021,"period":"令和3年度春期","num":26,"cat":"ストラテジ系","field":"PPM","summary":"PPM：令和3年度春期 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>プロダクトポートフォリオマネジメント（PPM）マトリックスのa，bに入れる語句の適切な組合せはどれか。</p>\n<table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;text-align:center\">\n<tr><td></td><td>（縦軸a：高）</td><td></td></tr>\n<tr><td>花形</td><td></td><td>問題児</td></tr>\n<tr><td>金のなる木</td><td></td><td>負け犬</td></tr>\n<tr><td></td><td>（縦軸a：低／横軸b：高→低）</td><td></td></tr>\n</table>\n<p>（縦軸aが高いほど上，横軸bが高いほど左にくる4象限のマトリックスで，左上＝花形，右上＝問題児，左下＝金のなる木，右下＝負け犬）</p>","choices":[{"label":"ア","html":"a：売上高利益率　b：市場占有率"},{"label":"イ","html":"a：市場成長率　b：売上高利益率"},{"label":"ウ","html":"a：市場成長率　b：市場占有率"},{"label":"エ","html":"a：市場占有率　b：市場成長率"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロダクトポートフォリオマネジメント（PPM）は，BCG（ボストン コンサルティング グループ）が提唱したフレームワークで，縦軸に「市場成長率」，横軸に「市場占有率（相対マーケットシェア）」をとり，事業・製品を「花形」「問題児」「金のなる木」「負け犬」の4象限に分類して経営資源の配分を検討する手法である。市場成長率・市場占有率がともに高い事業が「花形」，成長率は高いがシェアが低い事業が「問題児」，成長率は低いがシェアが高い事業が「金のなる木」，両方低い事業が「負け犬」に分類される。したがって縦軸（a）には市場成長率，横軸（b）には市場占有率が入り，正解はウである。売上高利益率は収益性を示す指標であり，PPMマトリックスの軸には用いられない。</p>","mnemonic":""},{"id":296,"year":2021,"period":"令和3年度春期","num":27,"cat":"ストラテジ系","field":"Society5.0","summary":"Society5.0：令和3年度春期 問27","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>政府は，IoTを始めとする様々なICTが最大限に活用され，サイバー空間とフィジカル空間とが融合された“超スマート社会”の実現を推進してきた。必要なものやサービスが人々に過不足なく提供され，年齢や性別などの違いにかかわらず，誰もが快適に生活することができるとされる“超スマート社会”実現への取組は何と呼ばれているか。</p>","choices":[{"label":"ア","html":"e-Gov"},{"label":"イ","html":"Society 5.0"},{"label":"ウ","html":"Web 2.0"},{"label":"エ","html":"ダイバーシティ社会"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>「超スマート社会」の実現は，第5期科学技術基本計画で提唱された日本政府の政策構想「Society 5.0」と呼ばれる。これは狩猟社会（Society 1.0），農耕社会（2.0），工業社会（3.0），情報社会（4.0）に続く，サイバー空間（仮想空間）とフィジカル空間（現実空間）を高度に融合させたシステムにより，IoTやAIなどのICTを最大限活用して必要なモノ・サービスを必要な人に必要なときに提供し，経済発展と社会的課題の解決を両立する人間中心の社会を目指す構想である。選択肢アのe-Govは行政手続のオンライン窓口となる電子政府のポータルサイト，ウのWeb 2.0はユーザー参加型・双方向的なWebの在り方を指す概念，エのダイバーシティ社会は多様性を尊重する社会の在り方を指す言葉であり，いずれも「超スマート社会」そのものを指す用語ではない。</p>","mnemonic":""},{"id":297,"year":2021,"period":"令和3年度春期","num":28,"cat":"ストラテジ系","field":"アグリゲーションサービス","summary":"アグリゲーションサービス：令和3年度春期 問28","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>アグリゲーションサービスに関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"小売販売の会社が，店舗やECサイトなどあらゆる顧客接点をシームレスに統合し，どの顧客接点でも顧客に最適な購買体験を提供して，顧客の利便性を高めるサービス"},{"label":"イ","html":"物品などの売買に際し，信頼のおける中立的な第三者が契約当事者の間に入り，代金決済等取引の安全性を確保するサービス"},{"label":"ウ","html":"分散的に存在する事業者，個人や機能への一括的なアクセスを顧客に提供し，比較，まとめ，統一的な制御，最適な組合せなどワンストップでのサービス提供を可能にするサービス"},{"label":"エ","html":"本部と契約した加盟店が，本部に対価を支払い，販売促進，確立したサービスや商品などを使う権利をもらうサービス"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アグリゲーションサービスとは，分散的に存在する複数の事業者や機能・サービスへのアクセスを，顧客に対して一つの窓口（ワンストップ）でまとめて提供し，比較・統合・最適な組合せなどを可能にするサービスである。例えば，複数の金融機関の口座情報を一つの画面でまとめて閲覧できるサービスなどが代表例として挙げられる。選択肢アは複数チャネルを統合して一貫した購買体験を提供するオムニチャネルの説明，イは取引の安全性を確保する第三者仲介（エスクローサービス）の説明，エは本部・加盟店間のフランチャイズ契約の説明であり，いずれも「分散する事業者への一括アクセスをワンストップで提供する」というアグリゲーションサービスの本質的な特徴とは異なる。</p>","mnemonic":""},{"id":298,"year":2021,"period":"令和3年度春期","num":29,"cat":"マネジメント系","field":"バランススコアカード","summary":"バランススコアカード：令和3年度春期 問29","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>バランススコアカードの四つの視点とは，財務，学習と成長，内部ビジネスプロセスと，もう一つはどれか。</p>","choices":[{"label":"ア","html":"ガバナンス"},{"label":"イ","html":"顧客"},{"label":"ウ","html":"自社の強み"},{"label":"エ","html":"遵法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バランススコアカード（BSC）は，キャプランとノートンが提唱した業績評価の枠組みであり，「財務の視点」「顧客の視点」「内部ビジネスプロセスの視点」「学習と成長の視点」という4つの視点から，企業のビジョンや戦略を具体的な指標・目標に落とし込み，バランスよく評価・管理する手法である。財務だけでなく，顧客満足度やブランドの信頼度を測る「顧客の視点」を含めることで，短期的な財務成果だけでなく中長期的な企業価値の向上を捉えられる点が特徴である。選択肢ア（ガバナンス），ウ（自社の強み），エ（遵法）はBSCの4つの基本視点には含まれない概念であり，特にガバナンスやコンプライアンス（遵法）はBSCとは別のマネジメント領域で扱われることが一般的である。</p>","mnemonic":""},{"id":299,"year":2021,"period":"令和3年度春期","num":30,"cat":"ストラテジ系","field":"電子署名法","summary":"電子署名法：令和3年度春期 問30","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2021r03.html","q":"<p>電子署名法に関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"電子署名には，電磁的記録ではなく，かつ，コンピュータで処理できないものも含まれる。"},{"label":"イ","html":"電子署名には，民事訴訟法における押印と同様の効力が認められる。"},{"label":"ウ","html":"電子署名の認証業務を行うことができるのは，政府が運営する認証局に限られる。"},{"label":"エ","html":"電子署名は共通鍵暗号技術によるものに限られる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>電子署名法第3条は，本人による電子署名が行われた電磁的記録について，民事訴訟法第228条第4項が紙の文書における押印に対して定めているのと同様に，真正に成立したものと推定する効力を認めている。選択肢アは，電子署名の対象を「電磁的記録であり，かつコンピュータで処理できるもの」とする法の趣旨に反しており誤り。ウは，認証業務は政府が運営する認証局に限られるわけではなく，民間事業者も認証業務（認定を受けたもの・受けていないもの）を行うことができるため誤り。エは，電子署名の技術方式を共通鍵暗号方式に限定しているが，実際には公開鍵暗号方式（RSA等）を用いた電子署名が一般的であり，特定の暗号方式に限定されないため誤りである。</p>","mnemonic":""},{"id":300,"year":2020,"period":"令和2年度10月","num":1,"cat":"テクノロジ系","field":"逆ポーランド記法","summary":"逆ポーランド記法：令和2年度10月 問1","correct":"ウ","result":"","formula":"後置記法(逆ポーランド記法)は「オペランド オペランド 演算子」の順で表す","howto":"優先順位の高い乗算から先に後置化し、外側の演算を最後に付け足す","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>式A+B×Cの逆ポーランド表記法による表現として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"+×CBA"},{"label":"イ","html":"×+ABC"},{"label":"ウ","html":"ABC×+"},{"label":"エ","html":"CBA+×"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A+B×Cはまず優先順位の高いB×Cを後置化するとBC×になる。これを残りの式に当てはめるとA+(BC×)となり、これをさらに後置化するとA BC× + すなわち「ABC×+」になる。したがって正解はウ。</p><p>アの「+×CBA」やイの「×+ABC」は演算子を前に置く前置記法(ポーランド記法)の考え方が混ざっており、逆ポーランド記法の規則(演算子は両オペランドの後)に反する。エの「CBA+×」はオペランドの順序が入れ替わっており、元の式の構造（B×Cを先に計算してからAを足す）と対応しない。</p>","mnemonic":"「ABC×+」は掛け算(B×C)を先に片付けてから最後にAを足す、掛けてから足すが鉄則の語呂合わせ。"},{"id":301,"year":2020,"period":"令和2年度10月","num":2,"cat":"テクノロジ系","field":"符号理論","summary":"符号理論：令和2年度10月 問2","correct":"ウ","result":"","formula":"期待符号長 = Σ(出現確率 × 符号語長)。前提として、どの符号語も他の符号語の先頭(接頭)と一致しない「接頭符号」である必要がある","howto":"各選択肢が接頭符号か(一意に復号できるか)をまず判定し、条件を満たすものだけで期待符号長を計算して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>a, b, c, dの4文字から成るメッセージを符号化してビット列にする方法として表のア〜エの4通りを考えた。この表はa, b, c, dの各1文字を符号化するときのビット列を表している。メッセージ中でのa, b, c, dの出現頻度は，それぞれ50%，30%，10%，10%であることが分かっている。符号化されたビット列から元のメッセージが一意に復号可能であって，ビット列の長さが最も短くなるものはどれか。</p><table><tr><th></th><th>a</th><th>b</th><th>c</th><th>d</th></tr><tr><td>ア</td><td>0</td><td>1</td><td>00</td><td>11</td></tr><tr><td>イ</td><td>0</td><td>01</td><td>10</td><td>11</td></tr><tr><td>ウ</td><td>0</td><td>10</td><td>110</td><td>111</td></tr><tr><td>エ</td><td>00</td><td>01</td><td>10</td><td>11</td></tr></table>","choices":[{"label":"ア","html":"表のとおり(a=0,b=1,c=00,d=11)"},{"label":"イ","html":"表のとおり(a=0,b=01,c=10,d=11)"},{"label":"ウ","html":"表のとおり(a=0,b=10,c=110,d=111)"},{"label":"エ","html":"表のとおり(a=00,b=01,c=10,d=11)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アは a=0 が c=00 の先頭2ビットと一致してしまい、イは a=0 が b=01 の先頭1ビットと一致してしまうため、どちらも接頭符号ではなく、一意に復号できない(例えば「00」はaa なのか c なのか区別できない)。したがって一意復号可能なのはウとエに絞られる。</p><p>ウの期待符号長は 0.5×1 + 0.3×2 + 0.1×3 + 0.1×3 = 0.5+0.6+0.3+0.3 = 1.7ビットであり、エの固定長符号(常に2ビット)より短い。出現頻度の高いaに最短の符号(1ビット)を割り当てるハフマン符号的な発想により、ウが最も短い一意復号可能な符号となる。</p>","mnemonic":"50・30・10・10%の出現率、接頭性を満たす「ウ」だけが生き残り1.7ビットの最短符号になると覚える。"},{"id":302,"year":2020,"period":"令和2年度10月","num":3,"cat":"テクノロジ系","field":"プログラム言語仕様","summary":"プログラム言語仕様：令和2年度10月 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>オブジェクト指向のプログラム言語であり，クラスや関数，条件文などのコードブロックの範囲はインデントの深さによって指定する仕様であるものはどれか。</p>","choices":[{"label":"ア","html":"JavaScript"},{"label":"イ","html":"Perl"},{"label":"ウ","html":"Python"},{"label":"エ","html":"Ruby"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>Pythonはインデント(字下げ)の深さによってコードブロックの範囲を規定する言語仕様(オフサイドルール)を持つことで知られる。中括弧やbegin/endのような明示的な区切り記号を使わず、同じ階層のインデントであることがそのままブロックの範囲を表す。</p><p>一方、JavaScriptとPerlはC言語系の文法を踏襲し、波括弧{ }でブロックの範囲を明示する。RubyはC言語系の構文ではないが、endキーワードでブロックの終わりを示す方式であり、インデントの深さ自体は構文上の意味を持たない。したがって、インデントでブロックを規定する言語はPython(ウ)のみである。</p>","mnemonic":""},{"id":303,"year":2020,"period":"令和2年度10月","num":4,"cat":"テクノロジ系","field":"記憶装置の高速化","summary":"記憶装置の高速化：令和2年度10月 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>メモリインタリーブの説明はどれか。</p>","choices":[{"label":"ア","html":"CPUと磁気ディスク装置との間に半導体メモリによるデータバッファを設けて，磁気ディスクアクセスの高速化を図る。"},{"label":"イ","html":"主記憶のデータの一部をキャッシュメモリにコピーすることによって，CPUと主記憶とのアクセス速度のギャップを埋め，メモリアクセスの高速化を図る。"},{"label":"ウ","html":"主記憶へのアクセスを高速化するために，アクセス要求，データの読み書き及び後処理が終わってから，次のメモリアクセスの処理に移る。"},{"label":"エ","html":"主記憶を複数の独立したグループに分けて，各グループに交互にアクセスすることによって，主記憶へのアクセスの高速化を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>メモリインタリーブは、主記憶を複数の独立したバンク(グループ)に分割し、連続したアドレスへのアクセスを各バンクに割り振って並行してアクセスすることで、見かけ上のメモリアクセス時間を短縮する技術である。エの記述はこの「複数グループへの分割と交互アクセス」という仕組みを正しく説明している。</p><p>アはディスクキャッシュの説明、イはキャッシュメモリの説明であり、いずれもメモリインタリーブとは異なる高速化技術である。ウは1回のアクセスが完全に終わってから次のアクセスに移るという逐次処理の説明であり、むしろインタリーブ(並行・交互処理)の考え方とは逆である。</p>","mnemonic":""},{"id":304,"year":2020,"period":"令和2年度10月","num":5,"cat":"テクノロジ系","field":"サーバ統合","summary":"サーバ統合：令和2年度10月 問5","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>複数のサーバを用いて構築されたシステムに対するサーバコンソリデーションの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"各サーバに存在する複数の磁気ディスクを，特定のサーバから利用できるようにして，資源の有効活用を図る。"},{"label":"イ","html":"仮想化ソフトウェアを利用して元のサーバ数よりも少なくすることによって，サーバ機器の管理コストを削減する。"},{"label":"ウ","html":"サーバのうちいずれかを監視専用に変更することによって，システム全体のセキュリティを強化する。"},{"label":"エ","html":"サーバの故障時に正常なサーバだけで瞬時にシステムを再構成し，サーバ数を減らしてでも運転を継続する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サーバコンソリデーション(サーバ統合)は、仮想化技術などを用いて複数の物理サーバの機能を少数のサーバに集約し、サーバ台数を削減することで設置スペース・電力・運用管理などのコストを削減する取り組みである。イの説明がこれに合致する。</p><p>アは複数サーバ間でのディスクリソース共有の説明、ウは監視専用サーバの設置によるセキュリティ強化、エはフェイルオーバー/縮退運転による可用性確保の説明であり、いずれもサーバ台数を減らしてコストを削減するというコンソリデーションの目的とは異なる。</p>","mnemonic":""},{"id":305,"year":2020,"period":"令和2年度10月","num":6,"cat":"テクノロジ系","field":"仮想記憶管理","summary":"仮想記憶管理：令和2年度10月 問6","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>仮想記憶方式で，デマンドページングと比較したときのプリページングの特徴として，適切なものはどれか。ここで，主記憶には十分な余裕があるものとする。</p>","choices":[{"label":"ア","html":"将来必要と想定されるページを主記憶にロードしておくので，実際に必要となったときの補助記憶へのアクセスによる遅れを減少できる。"},{"label":"イ","html":"将来必要と想定されるページを主記憶にロードしておくので，ページフォールトが多く発生し，OSのオーバヘッドが増加する。"},{"label":"ウ","html":"プログラムがアクセスするページだけをその都度主記憶にロードするので，主記憶への不必要なページのロードを避けることができる。"},{"label":"エ","html":"プログラムがアクセスするページだけをその都度主記憶にロードするので，将来必要となるページの予想が不要である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プリページングは、今後アクセスされると予測されるページをあらかじめ主記憶にロードしておく方式であり、実際にそのページが必要になった時点で既に主記憶上に存在するため、補助記憶装置へのアクセス(ページフォールト処理)による遅延を減らせる。アの記述がこの特徴を正しく表している。</p><p>イは「ページフォールトが多く発生し」とあるが、事前ロードによってむしろページフォールトの発生を抑える狙いがあるため誤り。ウとエは、必要になったページだけをその都度ロードするという、プリページングとは対照的なデマンドページングの特徴の説明である。</p>","mnemonic":""},{"id":306,"year":2020,"period":"令和2年度10月","num":7,"cat":"テクノロジ系","field":"半導体メモリ","summary":"半導体メモリ：令和2年度10月 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>SRAMと比較した場合のDRAMの特徴はどれか。</p>","choices":[{"label":"ア","html":"主にキャッシュメモリとして使用される。"},{"label":"イ","html":"データを保持するためのリフレッシュ又はアクセス動作が不要である。"},{"label":"ウ","html":"メモリセル構成が単純なので，ビット当たりの単価が安くなる。"},{"label":"エ","html":"メモリセルにフリップフロップを用いてデータを保存する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DRAMはキャパシタ(コンデンサ)1個とトランジスタ程度の単純な回路でメモリセルを構成できるため集積度を高めやすく、SRAMに比べてビット当たりの単価が安くなる。この特徴からウが正解となる。</p><p>アとエはSRAMの特徴である。SRAMはフリップフロップでデータを保持する構成のため高速でキャッシュメモリ用途に向くが、回路規模が大きく高価になる。DRAMはキャパシタの電荷が自然放電するため、データ保持には定期的なリフレッシュ動作が必要であり、イの「リフレッシュが不要」というのもSRAMの特徴であってDRAMには当てはまらない。</p>","mnemonic":""},{"id":307,"year":2020,"period":"令和2年度10月","num":8,"cat":"テクノロジ系","field":"D/A変換","summary":"D/A変換：令和2年度10月 問8","correct":"ウ","result":"","formula":"出力電圧 = データ値(10進数) × LSB1ビット当たりの電圧変化量","howto":"16進数82を10進数に変換してから，1ビット当たりの変化量10mVを掛ける","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>8ビットD/A変換器を使って負でない電圧を発生させる。使用するD/A変換器は，最下位の1ビットの変化で出力が10ミリV変化する。データに0を与えたときの出力は0ミリVである。データに16進数で82を与えたときの出力は何ミリVか。</p>","choices":[{"label":"ア","html":"820"},{"label":"イ","html":"1,024"},{"label":"ウ","html":"1,300"},{"label":"エ","html":"1,312"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>16進数の82を10進数に変換すると、82(16) = 8×16 + 2 = 130 となる。データ0のとき出力0mV、最下位1ビットの変化(データ+1)ごとに出力が10mV変化するので、データが130のときの出力は 130 × 10mV = 1,300mV となる。よって正解はウ。</p>","mnemonic":"16進「82」→10進「130」、10mVずつ積み上げて「いちさん・まるまる(1300)」ミリVが答えと覚える。"},{"id":308,"year":2020,"period":"令和2年度10月","num":9,"cat":"テクノロジ系","field":"データモデリング(ER)","summary":"データモデリング(ER)：令和2年度10月 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>UMLを用いて表した図のデータモデルから，“部品”表，“納入”表及び“メーカ”表を関係データベース上に定義するときの解釈のうち，適切なものはどれか。</p><p>データモデル: 「部品」(部品番号，部品名，…)　1 —— * 「納入」(納入日，数量，…)　* —— 1 「メーカ」(メーカ番号，メーカ名，…)<br>（1つの部品は複数の納入に対応し，1つのメーカも複数の納入に対応する，多対多の関連を“納入”が中間実体として表している）</p>","choices":[{"label":"ア","html":"同一の部品を同一のメーカから複数回納入することは許されない。"},{"label":"イ","html":"“納入”表に外部キーは必要ない。"},{"label":"ウ","html":"部品番号とメーカ番号の組みを“納入”表の候補キーの一部にできる。"},{"label":"エ","html":"“メーカ”表は，外部キーとして部品番号をもつことになる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>“部品”と“メーカ”はそれぞれ“納入”と1対多の関連で結ばれており，“納入”は部品とメーカの間の多対多の関連を解消するための中間実体(連関エンティティ)である。したがって“納入”表には部品番号とメーカ番号を外部キーとして持たせる必要があり，この2つの組み合わせが“納入”表を一意に識別するための候補キー(の一部)になり得る。これがウの内容であり正しい。</p><p>アは1対1の納入しか認めないという制約であり，図からはそのような制約は読み取れないため誤り。イは外部キーが不要としているが，多対多を解消するためには部品番号とメーカ番号を外部キーとして持つ必要があるため誤り。エは外部キーを持つ表が逆で，部品番号を外部キーとして持つのは“メーカ”表ではなく“納入”表である。</p>","mnemonic":""},{"id":309,"year":2020,"period":"令和2年度10月","num":10,"cat":"テクノロジ系","field":"ターンアラウンドタイム計算","summary":"ターンアラウンドタイム計算：令和2年度10月 問10","correct":"エ","result":"","formula":"ターンアラウンドタイム = 往復の伝送時間(2×メッセージ長/回線速度) + ホスト処理時間","howto":"端末Aと端末Bの式を連立させ，共通のホスト処理時間を消去してメッセージ長を求め，端末Aの片道伝送時間を逆算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>図のようなネットワーク構成のシステムにおいて，同じメッセージ長のデータをホストコンピュータとの間で送受信した場合のターンアラウンドタイムは，端末Aでは100ミリ秒，端末Bでは820ミリ秒であった。上り，下りのメッセージ長は同じ長さで，ホストコンピュータでの処理時間は端末A，端末Bのどちらから利用しても同じとするとき，端末Aからホストコンピュータへの片道の伝送時間は何ミリ秒か。ここで，ターンアラウンドタイムは，端末がデータを回線に送信し始めてから応答データを受信し終わるまでの時間とし，伝送時間は回線速度だけに依存するものとする。</p><p>構成: ホストコンピュータ ―(回線速度1Gビット/秒)― 端末A，ホストコンピュータ ―(回線速度100Mビット/秒)― 端末B</p>","choices":[{"label":"ア","html":"10"},{"label":"イ","html":"20"},{"label":"ウ","html":"30"},{"label":"エ","html":"40"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>メッセージ長をL［bit］，ホスト処理時間をP［秒］とすると、端末Aの回線速度は1Gbps=10^9bps、端末Bは100Mbps=10^8bpsなので、次の連立方程式が立つ。<br>端末A：2L/10^9 + P = 0.1秒<br>端末B：2L/10^8 + P = 0.82秒<br>両式の差を取ると、2L(1/10^8－1/10^9) = 0.72秒 → 2L×9×10^-9 = 0.72 → L = 4×10^7ビット。</p><p>したがって，端末Aの片道の伝送時間は L/10^9 = 4×10^7／10^9 = 0.04秒 = 40ミリ秒となる。検算として P = 0.1－2×0.04 = 0.02秒(20ミリ秒)となり、端末Bの式に代入すると 2×4×10^7／10^8 + 0.02 = 0.8+0.02 = 0.82秒と問題文の値に一致するため、L=4×10^7ビットは正しい。よって正解はエ。</p>","mnemonic":"差の720ミリ秒を線速度の差で割ると「よんせん(4000)万ビット」、Aの片道は「し(4)まる(0)＝40ミリ秒」と覚える。"},{"id":310,"year":2020,"period":"令和2年度10月","num":11,"cat":"テクノロジ系","field":"アドレス変換(NAPT)","summary":"アドレス変換(NAPT)：令和2年度10月 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>TCP，UDPのポート番号を識別し，プライベートIPアドレスとグローバルIPアドレスとの対応関係を管理することによって，プライベートIPアドレスを使用するLAN上の複数の端末が，一つのグローバルIPアドレスを共有してインターネットにアクセスする仕組みはどれか。</p>","choices":[{"label":"ア","html":"IPスプーフィング"},{"label":"イ","html":"IPマルチキャスト"},{"label":"ウ","html":"NAPT"},{"label":"エ","html":"NTP"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NAPT(Network Address Port Translation、IPマスカレードとも呼ばれる)は、IPアドレスの変換に加えてTCP/UDPのポート番号も併せて変換・管理することで、LAN内の複数端末が1つのグローバルIPアドレスを共有してインターネットに接続できるようにする仕組みである。設問の説明はNAPTそのものを指しており、正解はウ。</p><p>アのIPスプーフィングは送信元IPアドレスを偽装する攻撃手法、イのIPマルチキャストは1対多の同報通信の仕組み、エのNTPは時刻同期のためのプロトコルであり、いずれもアドレス変換とは関係がない。</p>","mnemonic":""},{"id":311,"year":2020,"period":"令和2年度10月","num":12,"cat":"テクノロジ系","field":"ネットワーク層暗号化","summary":"ネットワーク層暗号化：令和2年度10月 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>PCからサーバに対し，IPv6を利用した通信を行う場合，ネットワーク層で暗号化を行うときに利用するものはどれか。</p>","choices":[{"label":"ア","html":"IPsec"},{"label":"イ","html":"PPP"},{"label":"ウ","html":"SSH"},{"label":"エ","html":"TLS"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IPsecはIPパケット自体を暗号化・認証するプロトコル群であり、OSI参照モデルのネットワーク層(IP層)で動作する。IPv6ではIPsecが標準でサポートされており、ネットワーク層での暗号化を行う代表的な仕組みとして利用される。</p><p>SSHやTLSはトランスポート層より上位(アプリケーション層寄り)で特定の通信を暗号化する仕組みであり、ネットワーク層そのものを暗号化するわけではない。PPPはデータリンク層の回線接続プロトコルであり、暗号化機能そのものを提供するものではないため、いずれも本問の正解ではない。</p>","mnemonic":""},{"id":312,"year":2020,"period":"令和2年度10月","num":13,"cat":"テクノロジ系","field":"ディジタル署名の検証","summary":"ディジタル署名の検証：令和2年度10月 問13","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>送信者Aからの文書ファイルと，その文書ファイルのディジタル署名を受信者Bが受信したとき，受信者Bができることはどれか。ここで，受信者Bは送信者Aの署名検証鍵Xを保有しており，受信者Bと第三者は送信者Aの署名生成鍵Yを知らないものとする。</p>","choices":[{"label":"ア","html":"ディジタル署名，文書ファイル及び署名検証鍵Xを比較することによって，文書ファイルに改ざんがあった場合，その部分を判別できる。"},{"label":"イ","html":"文書ファイルが改ざんされていないこと，及びディジタル署名が署名生成鍵Yによって生成されたことを確認できる。"},{"label":"ウ","html":"文書ファイルがマルウェアに感染していないことを認証局に問い合わせて確認できる。"},{"label":"エ","html":"文書ファイルとディジタル署名のどちらかが改ざんされた場合，どちらが改ざんされたかを判別できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>受信者Bは、送信者Aの署名検証鍵X(公開鍵)を用いてディジタル署名を検証することで、(1)受信した文書ファイルが送信後に改ざんされていないこと、(2)その署名が送信者Aの署名生成鍵Y(秘密鍵)によって生成されたものであることの2点を確認できる。これはディジタル署名の目的である完全性の確認と否認防止(真正性の確認)そのものであり、イが正しい。</p><p>アは改ざんされた「部分」を特定できるとしているが、ディジタル署名の検証で分かるのは改ざんの有無のみであり、どの部分が改ざんされたかまでは判別できないため誤り。ウはマルウェア感染の有無という、署名検証とは無関係な事項であり誤り。エも、改ざんがあったことは分かっても、文書とディジタル署名のどちらが改ざんされたのかまでは判別できないため誤り。</p>","mnemonic":""},{"id":313,"year":2020,"period":"令和2年度10月","num":14,"cat":"テクノロジ系","field":"暗号方式の基礎","summary":"暗号方式の基礎：令和2年度10月 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>暗号方式に関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"AESは公開鍵暗号方式，RSAは共通鍵暗号方式の一種である。"},{"label":"イ","html":"共通鍵暗号方式では，暗号化及び復号に同一の鍵を使用する。"},{"label":"ウ","html":"公開鍵暗号方式を通信内容の秘匿に使用する場合は，暗号化に使用する鍵を秘密にして，復号に使用する鍵を公開する。"},{"label":"エ","html":"ディジタル署名に公開鍵暗号方式が使用されることはなく，共通鍵暗号方式が使用される。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>共通鍵暗号方式(秘密鍵暗号方式)は、暗号化と復号に同一の鍵を使用する方式であり、イの記述はこれを正しく表している。代表例にAESやDESなどがある。</p><p>アはAESとRSAの分類が逆であり、AESは共通鍵暗号方式、RSAは公開鍵暗号方式の一種である。ウは公開鍵暗号方式を秘匿目的で使う場合の鍵の公開・非公開の関係が逆であり、正しくは「暗号化に使う鍵(公開鍵)を公開し、復号に使う鍵(秘密鍵)を秘密にする」。エはディジタル署名の仕組みを否定しているが、実際にはディジタル署名は秘密鍵で署名を生成し公開鍵で検証する、公開鍵暗号方式の応用技術であるため誤り。</p>","mnemonic":""},{"id":314,"year":2020,"period":"令和2年度10月","num":15,"cat":"テクノロジ系","field":"メール受信プロトコル","summary":"メール受信プロトコル：令和2年度10月 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>電子メールをスマートフォンで受信する際のメールサーバとスマートフォンとの間の通信をメール本文を含めて暗号化するプロトコルはどれか。</p>","choices":[{"label":"ア","html":"APOP"},{"label":"イ","html":"IMAPS"},{"label":"ウ","html":"POP3"},{"label":"エ","html":"SMTP Submission"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IMAPS(IMAP over SSL/TLS)は、メールサーバとクライアント(スマートフォン等)との間のIMAP通信全体をSSL/TLSで暗号化するプロトコルであり、認証情報だけでなくメール本文を含む通信内容全体を保護できる。これが設問の条件に合致し、正解はイ。</p><p>APOPはPOP3における認証(パスワード)部分をハッシュ化して保護する仕組みであり、メール本文自体は暗号化されない。POP3は暗号化を伴わない平文のメール受信プロトコルである。SMTP Submission(ポート587)はクライアントからメールサーバへの送信(投稿)に使うプロトコルであり、受信用のプロトコルではない。</p>","mnemonic":""},{"id":315,"year":2020,"period":"令和2年度10月","num":16,"cat":"テクノロジ系","field":"UML図","summary":"UML図：令和2年度10月 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>UMLのアクティビティ図の特徴はどれか。</p>","choices":[{"label":"ア","html":"多くの並行処理を含むシステムの，オブジェクトの振る舞いが記述できる。"},{"label":"イ","html":"オブジェクト群がどのようにコラボレーションを行うか記述できる。"},{"label":"ウ","html":"クラスの仕様と，クラスの間の静的な関係が記述できる。"},{"label":"エ","html":"システムのコンポーネント間の物理的な関係が記述できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アクティビティ図は、処理の流れ(フロー)や並行して進む複数の処理(フォーク／ジョイン)を表現できる図であり、並行処理を含むシステムにおけるオブジェクトの振る舞い(処理の分岐・合流を伴うワークフロー)の記述に適している。これがアの内容であり正解となる。</p><p>イはオブジェクト間の相互作用・協調関係を表すコミュニケーション図(コラボレーション図)やシーケンス図の特徴である。ウはクラス図、エはコンポーネント図や配置図といった、システムの静的構造や物理的配置を表す図の特徴であり、いずれも振る舞いを表すアクティビティ図とは異なる。</p>","mnemonic":""},{"id":316,"year":2020,"period":"令和2年度10月","num":17,"cat":"マネジメント系","field":"アジャイル開発(スクラム)","summary":"アジャイル開発(スクラム)：令和2年度10月 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2020r02.html","q":"<p>アジャイル開発手法の説明のうち，スクラムのものはどれか。</p>","choices":[{"label":"ア","html":"コミュニケーション，シンプル，フィードバック，勇気，尊重の五つの価値を基礎とし，テスト駆動型開発，ペアプログラミング，リファクタリングなどのプラクティスを推奨する。"},{"label":"イ","html":"推測（プロジェクト立上げ，適応的サイクル計画），協調（並行コンポーネント開発），学習（品質レビュー，最終QA／リリース）のライフサイクルをもつ。"},{"label":"ウ","html":"プロダクトオーナなどの役割，スプリントレビューなどのイベント，プロダクトバックログなどの作成物
