「書込みゼロのT3・T4は蚊帳の外、チェックポイント前に咲いたT1は放置、後に咲いたT2・T5は前へ進め、枯れたT6は後ろへ戻す」"},{"id":520,"year":2016,"period":"平成28年度秋期","num":11,"cat":"テクノロジ系","field":"ネットワークプロトコル(ARP)","summary":"ネットワークプロトコル(ARP)：平成28年度秋期 問11","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>TCP/IPネットワークにおけるARPの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"IPアドレスからMACアドレスを得るプロトコルである。"},{"label":"イ","html":"IPネットワークにおける誤り制御のためのプロトコルである。"},{"label":"ウ","html":"ゲートウェイ間のホップ数によって経路を制御するプロトコルである。"},{"label":"エ","html":"端末に対して動的にIPアドレスを割り当てるためのプロトコルである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ARP(Address Resolution Protocol)は、同一LAN(イーサネットなど)上で通信相手のIPアドレスから、対応する物理アドレス(MACアドレス)を取得するためのプロトコルである。ARP要求をブロードキャストし、該当IPアドレスを持つ機器がARP応答で自分のMACアドレスを返す仕組みになっている。したがって正解はアである。</p><p>選択肢イの誤り制御はICMPなどが担う機能であり、ウのホップ数による経路制御はRIPなどのルーティングプロトコルの説明、エの動的IPアドレス割り当てはDHCPの説明であって、いずれもARPとは異なる。</p>","mnemonic":""},{"id":521,"year":2016,"period":"平成28年度秋期","num":12,"cat":"テクノロジ系","field":"IPv6セキュリティ","summary":"IPv6セキュリティ：平成28年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>IPv6において、拡張ヘッダを利用することによって実現できるセキュリティ機能はどれか。</p>","choices":[{"label":"ア","html":"URLフィルタリング機能"},{"label":"イ","html":"暗号化機能"},{"label":"ウ","html":"ウイルス検疫機能"},{"label":"エ","html":"情報漏えい検知機能"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IPv6ではIPsecの機能が拡張ヘッダとして標準的に組み込める構造になっており、代表的なものに認証ヘッダ(AH)とESP(Encapsulating Security Payload)がある。このうちESP拡張ヘッダは、ペイロード部分を暗号化することで通信の機密性(暗号化機能)を提供し、あわせてデータ完全性や送信元認証も提供できる。したがって拡張ヘッダによって実現できるセキュリティ機能としては「暗号化機能」が適切であり、正解はイである。</p><p>選択肢ア(URLフィルタリング)、ウ(ウイルス検疫)、エ(情報漏えい検知)は、いずれもアプリケーション層やネットワーク機器(プロキシ、UTM、DLP製品など)で実現される機能であり、IPv6の拡張ヘッダそのものが提供する機能ではない。</p>","mnemonic":""},{"id":522,"year":2016,"period":"平成28年度秋期","num":13,"cat":"テクノロジ系","field":"認証方式(チャレンジレスポンス)","summary":"認証方式(チャレンジレスポンス)：平成28年度秋期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>チャレンジレスポンス認証方式の特徴はどれか。</p>","choices":[{"label":"ア","html":"TLSによって、クライアント側で固定パスワードを暗号化して送信する。"},{"label":"イ","html":"端末のシリアル番号を、クライアント側で秘密鍵を使って暗号化して送信する。"},{"label":"ウ","html":"トークンという装置が自動的に表示する、認証のたびに異なるデータをパスワードとして送信する。"},{"label":"エ","html":"利用者が入力したパスワードと、サーバから送られたランダムなデータとをクライアント側で演算し、その結果を送信する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>チャレンジレスポンス認証方式は、サーバ側が認証のたびに異なる乱数(チャレンジ)をクライアントに送り、クライアント側は利用者が入力したパスワード(あるいは秘密情報)とそのチャレンジとをハッシュ関数などで演算し、その結果(レスポンス)だけをサーバに送信する方式である。パスワードそのものをネットワーク上に流さず、また送信するレスポンスも毎回変化するため、盗聴による再送(リプレイ)攻撃に強いという特徴がある。選択肢エはこの仕組みを正確に説明しており、正解となる。</p><p>選択肢アは固定パスワードをそのまま(暗号化して)送る方式でチャレンジレスポンスの要素(毎回変わるやり取り)がなく異なる。選択肢ウは「トークンが表示するワンタイムパスワード」の説明であり、これはワンタイムパスワード方式(トークン方式)の特徴であって、サーバから送られるランダムなデータに対しクライアント側で演算するチャレンジレスポンス方式とは区別される。</p>","mnemonic":""},{"id":523,"year":2016,"period":"平成28年度秋期","num":14,"cat":"テクノロジ系","field":"認証デバイス","summary":"認証デバイス：平成28年度秋期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>アクセス制御に用いる認証デバイスの特徴に関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"USBメモリにディジタル証明書を組み込み、認証デバイスとする場合は、利用するPCのMACアドレスを組み込む必要がある。"},{"label":"イ","html":"成人には虹彩の経年変化がなく、虹彩認証では、認証デバイスでのパターン更新がほとんど不要である。"},{"label":"ウ","html":"静電容量方式の指紋認証デバイスでは、LED照明を設置した室内において正常に認証できなくなる可能性がある。"},{"label":"エ","html":"認証に利用する接触型ICカードは、カード内のコイルの誘導起電力を利用している。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>虹彩(瞳の模様)は、乳幼児期に模様がほぼ完成した後、成人以降は加齢による変化がほとんどないとされる生体的特徴である。そのため虹彩認証デバイスでは、一度登録したパターンを長期間使い続けることができ、指紋や顔のように経年変化に伴う再登録・パターン更新がほとんど不要である。選択肢イはこの特徴を正しく説明しており正解となる。</p><p>選択肢ウについて、LED照明(光)の影響を受けやすいのは、指先に光を照射して反射で読み取る光学式の指紋認証デバイスであり、指紋の凹凸による静電容量の変化を検出する静電容量方式は光の影響を受けにくい点で説明が誤りである。選択肢エについて、コイルの誘導起電力(電磁誘導)を利用して動作するのは非接触型ICカードであり、接触型ICカードは端子を介して電源供給と通信を行うため、この記述は接触型と非接触型を取り違えている。</p>","mnemonic":""},{"id":524,"year":2016,"period":"平成28年度秋期","num":15,"cat":"テクノロジ系","field":"暗号方式(ハイブリッド暗号)","summary":"暗号方式(ハイブリッド暗号)：平成28年度秋期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>OpenPGPやS/MIMEにおいて用いられるハイブリッド暗号方式の特徴はどれか。</p>","choices":[{"label":"ア","html":"暗号通信方式としてIPsecとTLSを選択可能にすることによって利用者の利便性を高める。"},{"label":"イ","html":"公開鍵暗号方式と共通鍵暗号方式を組み合わせることによって鍵管理コストと処理性能の両立を図る。"},{"label":"ウ","html":"複数の異なる共通鍵暗号方式を組み合わせることによって処理性能を高める。"},{"label":"エ","html":"複数の異なる公開鍵暗号方式を組み合わせることによって安全性を高める。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ハイブリッド暗号方式は、処理速度は速いが鍵配送に課題がある共通鍵暗号方式と、鍵配送は安全だが処理が重い公開鍵暗号方式の長所を組み合わせた方式である。具体的には、メッセージ本体は高速な共通鍵暗号方式(セッション鍵)で暗号化し、そのセッション鍵自体を受信者の公開鍵で暗号化して送ることで、鍵管理のコストを抑えつつ、暗号化・復号の処理性能も確保する。OpenPGPやS/MIMEはいずれもこの方式を採用しており、選択肢イが正解である。</p><p>選択肢アはIPsecやTLSといった通信方式の選択の話であり、OpenPGP/S/MIMEのメッセージ暗号化の仕組み(ハイブリッド暗号)とは無関係である。選択肢ウ・エは同じ種類の暗号方式を複数組み合わせる説明になっているが、ハイブリッド暗号方式の本質は「異なる種類」(公開鍵暗号と共通鍵暗号)の組合せである点が異なる。</p>","mnemonic":""},{"id":525,"year":2016,"period":"平成28年度秋期","num":16,"cat":"テクノロジ系","field":"UML図(ユースケース図)","summary":"UML図(ユースケース図)：平成28年度秋期 問16","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>UMLのユースケース図の説明はどれか。</p>","choices":[{"label":"ア","html":"外部からのトリガに応じて、オブジェクトの状態がどのように遷移するかを表現する。"},{"label":"イ","html":"クラスと関連から構成され、システムの静的な構造を表現する。"},{"label":"ウ","html":"システムとアクタの相互作用を表現する。"},{"label":"エ","html":"データの流れに注目してシステムの機能を表現する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ユースケース図は、利用者や外部システムなどの「アクタ」が、対象システムに対してどのような機能(ユースケース)を利用するか、すなわちシステムとアクタとの相互作用・関わり方を表現するUMLの図である。システムの振る舞いを利用者視点で俯瞰的に整理するために用いられ、選択肢ウが正解となる。</p><p>選択肢アはステートマシン図(状態遷移図)の説明、イはクラス図の説明、エはデータフロー図(DFD)の説明であり、いずれもユースケース図とは異なる図の説明である。</p>","mnemonic":""},{"id":526,"year":2016,"period":"平成28年度秋期","num":17,"cat":"ストラテジ系","field":"ソフトウェアライセンス","summary":"ソフトウェアライセンス：平成28年度秋期 問17","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>自社開発したソフトウェアの他社への使用許諾に関する説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"使用許諾対象が特許で保護された技術を使っていないソフトウェアであっても、使用許諾することは可能である。"},{"label":"イ","html":"既に自社の製品に搭載して販売していると、ソフトウェア単体では使用許諾対象にできない。"},{"label":"ウ","html":"既にハードウェアと組み合わせて特許を取得していると、ソフトウェア単体では使用許諾対象にできない。"},{"label":"エ","html":"ソースコードを無償で使用許諾すると、無条件でオープンソースソフトウェアになる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ソフトウェアの使用許諾(ライセンス供与)は著作権に基づく契約行為であり、必ずしも特許権で保護された技術を含んでいる必要はない。特許による保護がない独自開発のソフトウェアであっても、著作権者として他社に使用を許諾することは法的に可能である。したがって選択肢アが適切である。</p><p>選択肢イ・ウは、既に自社製品や他の特許に組み込んで利用していることを理由にソフトウェア単体でのライセンス供与ができないとしているが、同じソフトウェアを複数の形態・相手に許諾することは一般的に可能であり、この説明は誤り。選択肢エは、ソースコードを無償で許諾しただけでは、ライセンス条件(再配布や改変の自由など、OSI(Open Source Initiative)の定義する条件)を満たさない限り、自動的にオープンソースソフトウェアになるわけではないため誤りである。</p>","mnemonic":""},{"id":527,"year":2016,"period":"平成28年度秋期","num":18,"cat":"マネジメント系","field":"プロジェクト統合管理(PMBOK)","summary":"プロジェクト統合管理(PMBOK)：平成28年度秋期 問18","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>PMBOKの統合変更管理プロセスにおいて、プロジェクトのプロダクト、サービス、所産、構成要素などに対する変更と実施状況を記録・報告したり、要求事項への適合性を検証する活動を支援したりする活動はどれか。</p>","choices":[{"label":"ア","html":"アーンド・バリュー・マネジメント"},{"label":"イ","html":"コンフィギュレーション・マネジメント"},{"label":"ウ","html":"コンフリクト・マネジメント"},{"label":"エ","html":"ポートフォリオマネジメント"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コンフィギュレーション・マネジメント(構成管理)は、PMBOKの統合変更管理プロセスの中で用いられる活動であり、プロジェクトの成果物や構成要素の機能上・物理上の特性を識別・文書化し、それらに対する変更とその実施状況を記録・報告するとともに、成果物が要求事項に適合していることを検証する監査活動を支援する、一連の公式かつ文書化された手続きである。この説明は問題文の記述と一致するため、正解はイである。</p><p>選択肢アのアーンド・バリュー・マネジメント(EVM)はコストとスケジュールの実績を定量的に評価する進捗管理の技法、ウのコンフリクト・マネジメントはプロジェクトチーム内の対立・衝突を解消する人的資源管理の活動、エのポートフォリオマネジメントは複数のプロジェクトやプログラムを組織戦略に沿って統括管理する活動であり、いずれも変更の記録・報告や要求事項適合性の検証を主目的とするものではない。</p>","mnemonic":""},{"id":528,"year":2016,"period":"平成28年度秋期","num":19,"cat":"マネジメント系","field":"アローダイアグラム(CPM)","summary":"アローダイアグラム(CPM)：平成28年度秋期 問19","correct":"エ","result":"","formula":"最早結合点時刻(forward pass)と最遅結合点時刻(backward pass)をノードごとに計算する","howto":"まず全体の最短完了日数(クリティカルパス長)を最早結合点時刻の前進計算で求め、次に終点から逆算する後退計算で各ノードの最遅結合点時刻を求める。作業Hの開始可能な最遅時刻は、結合点5の最遅結合点時刻である。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>あるプロジェクトの作業が図のとおり計画されているとき、最短日数で終了するためには、作業Hはプロジェクトの開始から遅くとも何日後に開始しなければならないか。</p><p>(アローダイアグラム)ノード1〜7があり、矢線は次のとおり。1→2:作業A(8日)、1→3:作業B(5日)、1→5:作業C(12日)、2→4:作業D(10日)、3→4:作業E(9日)、2→7:作業F(8日)、4→7:作業G(12日)、4→5:ダミー作業(所要日数0、5は4の完了後でないと開始できない)、5→6:作業H(5日)、6→7:作業I(4日)。</p>","choices":[{"label":"ア","html":"12"},{"label":"イ","html":"14"},{"label":"ウ","html":"18"},{"label":"エ","html":"21"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>【前進計算(最早時刻)】結合点1=0。結合点2=0+8=8。結合点3=0+5=5。結合点4=max(結合点2+D=8+10=18, 結合点3+E=5+9=14)=18。結合点5=max(結合点1+C=12, 結合点4+ダミー0=18)=18。結合点6=結合点5+H=18+5=23。結合点7=max(結合点2+F=16, 結合点4+G=18+12=30, 結合点6+I=23+4=27)=30。したがってプロジェクトの最短完了日数は30日(クリティカルパスは1→2→4→7、A+D+G=8+10+12=30)である。</p><p>【後退計算(最遅時刻)】結合点7=30。結合点6=30−I(4)=26。結合点5=26−H(5)=21。結合点4=min(30−G(12)=18, 結合点5の21−ダミー0=21)=18。(結合点3、結合点2、結合点1も同様に計算すると結合点1=0に一致し、計算の整合性が確認できる。)</p><p>作業Hは結合点5から始まる作業なので、作業Hを開始できる最も遅い時刻は結合点5の最遅結合点時刻である21日後となる。これより遅く開始すると、結合点6・結合点7の最早完了がクリティカルパス長の30日を超えてしまう。よって正解はエの21である。</p>","mnemonic":"「にい(2)いち(1)が最終リミット」―最長経路30日から逆算すると、作業Hは21日目が出発の最終ラインになる。"},{"id":529,"year":2016,"period":"平成28年度秋期","num":20,"cat":"マネジメント系","field":"工数・期間配分モデル","summary":"工数・期間配分モデル：平成28年度秋期 問20","correct":"イ","result":"","formula":"全体期間T=228日÷(要件定義〜内部設計の期間比合計)、残り日数=プログラム開発の残期間+結合・テストの期間","howto":"要件定義〜内部設計の期間比合計から全体期間Tを逆算し、プログラム開発の残り(50%分)の期間と、結合・テスト工程の期間を足し合わせる。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>過去のプロジェクトの開発実績から構築した作業配分モデルがある。システム要件定義からシステム内部設計までをモデルどおりに進めて228日で完了し、プログラム開発を開始した。現在、200本のプログラムのうち100本のプログラム開発を完了し、残りの100本は未着手の状況である。プログラム開発以降もモデルどおりに進捗すると仮定するとき、プロジェクトの完了まで、あと何日掛かるか。ここで、各プログラムの開発に掛かる工数及び期間は、全てのプログラムで同一であるものとする。</p><p>〔作業配分モデル〕</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th></th><th>システム要件定義</th><th>システム外部設計</th><th>システム内部設計</th><th>プログラム開発</th><th>システム結合</th><th>システムテスト</th></tr><tr><td>工数比</td><td>0.17</td><td>0.21</td><td>0.16</td><td>0.16</td><td>0.11</td><td>0.19</td></tr><tr><td>期間比</td><td>0.25</td><td>0.21</td><td>0.11</td><td>0.11</td><td>0.11</td><td>0.21</td></tr></table>","choices":[{"label":"ア","html":"140"},{"label":"イ","html":"150"},{"label":"ウ","html":"161"},{"label":"エ","html":"172"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>要件定義からシステム内部設計までの期間比の合計は 0.25+0.21+0.11=0.57 であり、これが228日に相当するので、全プロジェクトの総期間Tは T = 228 ÷ 0.57 = 400日 となる。</p><p>プログラム開発工程全体の期間は 0.11×400=44日である。200本中100本(50%)が完了しているので、各プログラムの開発期間は均等と仮定すると、プログラム開発に残り必要な期間は 44日×(100/200)=22日 となる。</p><p>プログラム開発の残り以降、システム結合とシステムテストの期間はそれぞれ 0.11×400=44日、0.21×400=84日で、合計 44+84=128日 である。したがって、プロジェクト完了までの残り日数は 22(プログラム開発残り)+128(結合・テスト)=150日 となり、正解はイである。</p>","mnemonic":"要件定義〜内部設計の228日÷0.57=全体400日。プログラム開発の残り半分22日に結合44日・テスト84日を足すと150日でイ。"},{"id":530,"year":2016,"period":"平成28年度秋期","num":21,"cat":"テクノロジ系","field":"バックアップ運用","summary":"バックアップ運用：平成28年度秋期 問21","correct":"ウ","result":"","formula":"必要本数 = (保持すべき月数)×(フルバックアップ1本+差分バックアップ1本)","howto":"1か月分のバックアップはフルバックアップ用テープ1本と差分バックアップ用テープ1本の計2本を必要とする。6か月前の同一日まで復元できる必要があるため、常に7か月分(当月+過去6か月)のテープセットを保持しなければならないことに着目する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>次の処理条件で磁気ディスクに保存されているファイルを磁気テープにバックアップするとき、バックアップの運用に必要な磁気テープは最少で何本か。</p><p>〔処理条件〕</p><ol><li>毎月初日(1日)にフルバックアップを取る。フルバックアップは1本の磁気テープに1回分を記録する。</li><li>フルバックアップを取った翌日から次のフルバックアップまでは、毎日、差分バックアップを取る。差分バックアップは、差分バックアップ用としてフルバックアップとは別の磁気テープに追記録し、1本に1か月分を記録する。</li><li>常に6か月前の同一日までのデータについて、指定日の状態にファイルを復元できるようにする。ただし、6か月前の月に同一日が存在しない場合は、当該月の末日までのデータについて、指定日の状態にファイルを復元できるようにする(例:本日が10月31日の場合、4月30日までのデータについて、指定日の状態にファイルを復元できるようにする)。</li></ol>","choices":[{"label":"ア","html":"12"},{"label":"イ","html":"13"},{"label":"ウ","html":"14"},{"label":"エ","html":"15"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>1か月分のバックアップ運用には、月初のフルバックアップ用テープ1本と、その月の差分を1本にまとめて追記録する差分バックアップ用テープ1本の、合計2本が必要になる。</p><p>条件(3)より、常に6か月前の同一日(またはその月の末日)までの状態に復元できる必要がある。例えば月の途中のある日に障害が発生した場合でも、6か月前の同一日まで遡って復元できなければならないため、進行中の当月分に加えて、過去6か月分、合計7か月分のフル+差分のテープセットを保持しておく必要がある(月末・月初のタイミングでも6か月前のデータを欠落させないために、1か月分を余分に持つ必要があるため)。</p><p>したがって、必要なテープ本数は 7か月分 × 2本/月 = 14本 となり、正解はウである。</p>","mnemonic":"「なな(7)か月ぶんをフルと差分で2本ずつ、じゅうよん(14)本そろえておけば安心」"},{"id":531,"year":2016,"period":"平成28年度秋期","num":22,"cat":"マネジメント系","field":"内部統制(ITへの対応)","summary":"内部統制(ITへの対応)：平成28年度秋期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>金融庁の\"財務報告に係る内部統制の評価及び監査に関する実施基準\"における\"ITへの対応\"に関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"IT環境とは、企業内部に限られた範囲でのITの利用状況である。"},{"label":"イ","html":"ITの統制は、ITに係る全般統制及びITに係る業務処理統制から成る。"},{"label":"ウ","html":"ITの利用によって統制活動を自動化している場合、当該統制活動は有効であると評価される。"},{"label":"エ","html":"ITを利用せず手作業だけで内部統制を運用している場合、直ちに内部統制の不備となる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>金融庁の実施基準における\"ITへの対応\"では、ITの統制を「ITに係る全般統制(IT General Controls、ITGC)」と「ITに係る業務処理統制(IT Application Controls、ITAC)」の2種類に整理している。全般統制は業務処理統制が有効に機能するための環境を支える統制活動(アクセス権限管理やシステム開発・保守管理など)であり、業務処理統制は個々の業務プロセスに組み込まれ取引の正確な処理・記録を確保する統制活動である。この分類は実施基準の記述と一致しており、選択肢イが正解である。</p><p>選択肢アについて、IT環境は企業内部だけでなく取引先や社会のITの利用状況など企業を取り巻く広い範囲の情報を含む概念であり誤り。選択肢ウについて、自動化されているからといって統制活動が自動的に有効と評価されるわけではなく、別途その有効性を評価する必要があるため誤り。選択肢エについて、ITを利用せず手作業のみで統制を運用していても、それ自体が直ちに内部統制の不備になるわけではなく、手作業でも有効に機能していれば問題ないとされるため誤りである。</p>","mnemonic":""},{"id":532,"year":2016,"period":"平成28年度秋期","num":23,"cat":"ストラテジ系","field":"バランススコアカード","summary":"バランススコアカード：平成28年度秋期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ITベンダにおけるソリューションビジネスの推進で用いるバランススコアカードの、学習と成長のKPIの目標例はどれか。ここで、ソリューションとは\"顧客の経営課題の達成に向けて、情報技術と専門家によるプロフェッショナルサービスを通して支援すること\"とする。</p>","choices":[{"label":"ア","html":"サービスを提供した顧客に対して満足度調査を行い、満足度の平均を5段階評価で3.5以上とする。"},{"label":"イ","html":"再利用環境の整備によってソリューション事例の登録などを増やし、顧客提案数を前年度の1.5倍とする。"},{"label":"ウ","html":"情報戦略のコンサルティングサービスに重点を置くために、社内要員30名をITのプロフェッショナルとして育成する。"},{"label":"エ","html":"情報戦略立案やシステム企画立案に対するコンサルティングの受注金額を、全体の15%以上とする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バランススコアカード(BSC)は「財務の視点」「顧客の視点」「内部ビジネスプロセスの視点」「学習と成長の視点」の4つの視点から戦略目標とKPIを設定するマネジメント手法である。このうち「学習と成長の視点」は、従業員の能力開発や組織の人材育成・ノウハウ蓄積など、将来の価値創出を支える基盤となる要素を扱う。選択肢ウの「社内要員30名をITのプロフェッショナルとして育成する」は、まさに人材育成(組織の能力向上)に関する目標であり、学習と成長の視点のKPIとして適切であるため、正解はウである。</p><p>選択肢アは顧客満足度に関する指標であり「顧客の視点」、選択肢イは提案数の増加に関する指標であり「内部ビジネスプロセスの視点」(あるいは顧客視点)、選択肢エは受注金額の割合に関する指標であり「財務の視点」に、それぞれ対応する目標例と考えられ、いずれも学習と成長の視点のKPIとしては不適切である。</p>","mnemonic":""},{"id":533,"year":2016,"period":"平成28年度秋期","num":24,"cat":"ストラテジ系","field":"ビジネスインテリジェンス(BI)","summary":"ビジネスインテリジェンス(BI)：平成28年度秋期 問24","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>BI(Business Intelligence)の活用事例として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"競合する他社が発行するアニュアルレポートなどの刊行物を入手し、経営戦略や財務状況を把握する。"},{"label":"イ","html":"業績の評価や経営戦略の策定を行うために、業務システムなどに蓄積された膨大なデータを分析する。"},{"label":"ウ","html":"電子化された学習教材を社員がネットワーク経由で利用することを可能にし、学習・成績管理を行う。"},{"label":"エ","html":"りん議や決裁など、日常の定型的業務を電子化することによって、手続を確実に行い、処理を迅速化する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BI(ビジネスインテリジェンス)とは、企業内の基幹システムや業務システムなどに蓄積された大量のデータを収集・統合・分析し、経営者や意思決定者が業績評価や経営戦略の策定などに活用できる形で可視化・提供する仕組みや活動を指す。選択肢イはこの活用事例を正確に説明しており、正解はイである。</p><p>選択肢アは競合分析(競合他社の公開情報の収集・分析)であり、自社データの分析を主眼とするBIとは異なる活動である。選択肢ウはeラーニング(学習管理システム、LMS)の説明、選択肢エはワークフローシステム(電子decisionや電子承認)の説明であり、いずれもBIの活用事例とは異なる。</p>","mnemonic":""},{"id":534,"year":2016,"period":"平成28年度秋期","num":25,"cat":"マネジメント系","field":"システム開発契約(モデル取引・契約書)","summary":"システム開発契約(モデル取引・契約書)：平成28年度秋期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>\"情報システム・モデル取引・契約書\"によれば、要件定義工程を実施する際に、ユーザ企業がベンダと締結する契約の形態について適切なものはどれか。</p>","choices":[{"label":"ア","html":"構築するシステムがどのような機能となるか明確になっていないので準委任契約にした。"},{"label":"イ","html":"仕様の決定権はユーザ側ではなくベンダ側にあるので準委任契約にした。"},{"label":"ウ","html":"ベンダに委託する作業の成果物が具体的に想定できないので請負契約にした。"},{"label":"エ","html":"ユーザ内のステークホルダとの調整を行う責任が曖昧にならないように請負契約にした。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>経済産業省がまとめた\"情報システム・モデル取引・契約書\"では、請負契約と準委任契約のいずれを選ぶかは、委託する作業の成果物について契約当事者間で事前に十分な共通理解が成立しているかどうかで判断するとされている。要件定義工程は、構築するシステムがどのような機能・仕様になるかがまだ明確になっておらず、成果物を事前に確定することが難しい段階であるため、仕事の完成(成果物)を約束する請負契約ではなく、専門家としての業務遂行(助言・支援)を約束する準委任契約が選ばれるべきとされる。選択肢アはこの理由を正しく説明しており、正解である。</p><p>選択肢イは仕様決定権の所在を理由にしているが、これは準委任契約を選ぶ本来の理由(成果物が未確定であること)とは異なる。選択肢ウ・エは、成果物が具体的に想定できない要件定義工程であるにもかかわらず、むしろ逆に成果物の完成を約束する請負契約を選んでしまっており、契約類型の選択として不適切である。</p>","mnemonic":""},{"id":535,"year":2016,"period":"平成28年度秋期","num":26,"cat":"ストラテジ系","field":"経営管理手法(ベンチマーキング)","summary":"経営管理手法(ベンチマーキング)：平成28年度秋期 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ベンチマーキングを説明したものはどれか。</p>","choices":[{"label":"ア","html":"企業内に散在している知識を共有化し、全体の問題解決力を高めていく経営を行う。"},{"label":"イ","html":"迅速な意思決定のために、組織の階層をできるだけ少なくしたフラット型の組織構造によって経営を行う。"},{"label":"ウ","html":"優れた業績を上げている企業などとの比較分析を行い、結果を自社の経営改革に活用する。"},{"label":"エ","html":"他社にはまねのできない、企業独自のノウハウや技術などの強みを核とした経営を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ベンチマーキングとは、自社の業務プロセスを、同業他社や異業種を含む優れた業績(ベストプラクティス)を上げている組織の同種のプロセスと比較分析し、そのギャップを把握した上で、自社の業務改善・経営改革に役立てる経営手法である。1980年代に米国ゼロックス社で体系化され広まったとされる。選択肢ウはこの定義を正確に説明しており、正解である。</p><p>選択肢アは「ナレッジマネジメント」の説明、選択肢イは「フラット型組織」による経営の説明、選択肢エは自社固有の強みを核とする「コアコンピタンス経営」の説明であり、いずれも他社との比較分析を本質とするベンチマーキングとは異なる概念である。</p>","mnemonic":""},{"id":536,"year":2016,"period":"平成28年度秋期","num":27,"cat":"ストラテジ系","field":"成長戦略(アンゾフの成長マトリクス)","summary":"成長戦略(アンゾフの成長マトリクス)：平成28年度秋期 問27","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>アンゾフが提唱する成長マトリクスを説明したものはどれか。</p>","choices":[{"label":"ア","html":"自社の強みと弱み、市場における機会と脅威を、分類ごとに列挙して、事業戦略における企業の環境分析を行う。"},{"label":"イ","html":"製品と市場の視点から、事業拡大の方向性を市場浸透・製品開発・市場開拓・多角化に分けて、戦略を検討する。"},{"label":"ウ","html":"製品の市場占有率と市場成長率から、企業がそれぞれの事業に対する経営資源の最適配分を意思決定する。"},{"label":"エ","html":"製品の導入期・成長期・成熟期・衰退期の各段階に応じて、製品の改良、新品種の追加、製品廃棄などを計画する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アンゾフの成長マトリクス(アンゾフ・マトリクス)は、経営学者イゴール・アンゾフが提唱した事業成長戦略のフレームワークであり、「製品(既存・新規)」と「市場(既存・新規)」の2軸で事業拡大の方向性を4象限、すなわち市場浸透(既存製品×既存市場)、製品開発(新規製品×既存市場)、市場開拓(既存製品×新規市場)、多角化(新規製品×新規市場)に分類して戦略を検討するものである。選択肢イはこの説明に一致しており、正解である。</p><p>選択肢アはSWOT分析の説明、選択肢ウはPPM(プロダクト・ポートフォリオ・マネジメント)の説明、選択肢エはプロダクトライフサイクル(製品ライフサイクル)に基づく戦略の説明であり、いずれもアンゾフの成長マトリクスとは異なるフレームワークである。</p>","mnemonic":""},{"id":537,"year":2016,"period":"平成28年度秋期","num":28,"cat":"マネジメント系","field":"資材所要量計画(MRP)","summary":"資材所要量計画(MRP)：平成28年度秋期 問28","correct":"イ","result":"","formula":"正味所要量 = 総所要量(親の正味所要量×員数の合計) − 在庫残","howto":"まずユニットB・ユニットCの総所要量と正味所要量(在庫を引いたもの)を求め、それぞれの正味所要量から部品Dの総所要量を積み上げて計算し、最後に部品Dの在庫残を差し引く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ある期間の生産計画において、図の部品表で表される製品Aの需要量が10個であるとき、部品Dの正味所要量は何個か。ここで、ユニットBの在庫残が5個、部品Dの在庫残が25個あり、他の在庫残、仕掛残、注文残、引当残などはないものとする。</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th colspan='2'>レベル0</th><th colspan='2'>レベル1</th><th colspan='2'>レベル2</th></tr><tr><th>品名</th><th>数量(個)</th><th>品名</th><th>数量(個)</th><th>品名</th><th>数量(個)</th></tr><tr><td>製品A</td><td>1</td><td rowspan='2'>ユニットB</td><td rowspan='2'>4</td><td>部品D</td><td>3</td></tr><tr><td></td><td></td><td>部品E</td><td>1</td></tr><tr><td></td><td></td><td rowspan='2'>ユニットC</td><td rowspan='2'>1</td><td>部品D</td><td>1</td></tr><tr><td></td><td></td><td>部品F</td><td>2</td></tr></table><p>(ユニットBの下に部品D×3個、部品E×1個が、ユニットCの下に部品D×1個、部品F×2個がそれぞれ必要)</p>","choices":[{"label":"ア","html":"80"},{"label":"イ","html":"90"},{"label":"ウ","html":"95"},{"label":"エ","html":"105"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Aの需要量は10個であり、製品A1個にユニットBが4個必要なので、ユニットBの総所要量は 10×4=40個。ユニットBの在庫残が5個あるので、ユニットBの正味所要量(実際に新たに用意すべき数)は 40−5=35個。</p><p>同様にユニットCの総所要量は 10×1=10個。ユニットCの在庫残はないので、ユニットCの正味所要量は10個のままである。</p><p>部品Dは、ユニットB1個につき3個、ユニットC1個につき1個必要である。部品Dの総所要量は、それぞれの親部品の「正味所要量」(実際に生産・発注される数量)を基準に積み上げるため、ユニットB由来の所要量=35×3=105個、ユニットC由来の所要量=10×1=10個、合計 105+10=115個となる。</p><p>最後に部品Dの在庫残25個を差し引くと、部品Dの正味所要量は 115−25=90個 となり、正解はイである。</p>","mnemonic":"「さんごう(35×3=105)に十(10)足して百十五(115)、在庫にじゅうご(25)引けばきゅうじゅう(90)個」"},{"id":538,"year":2016,"period":"平成28年度秋期","num":29,"cat":"テクノロジ系","field":"信頼性(故障率曲線)","summary":"信頼性(故障率曲線)：平成28年度秋期 問29","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>故障率曲線において、図中のAの期間に実施すべきことはどれか。</p><p>(図:縦軸が故障率、横軸が時間のバスタブカーブ。初期は故障率が高く急激に低下し(初期故障期間)、中央部分で故障率がほぼ一定の低い水準で推移する期間Aがあり(偶発故障期間)、その後時間経過とともに故障率が再び上昇していく(摩耗故障期間)という形状をしている。)</p>","choices":[{"label":"ア","html":"設計段階では予想できなかった設計ミス、生産工程では発見できなかった欠陥などによって故障が発生するので、出荷前に試運転を行う。"},{"label":"イ","html":"対象の機器・部品が、様々な環境条件の下で使用されているうちに、偶発的に故障が発生するので、予備部品などを用意しておく。"},{"label":"ウ","html":"疲労・摩耗・劣化などの原因によって故障が発生するので、部品交換などの保全作業を行い、故障率を下げる。"},{"label":"エ","html":"摩耗故障が多く発生してくるので、定期的に適切な保守を行うことによって事故を未然に防止する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>故障率曲線(バスタブカーブ)は、機器の時間経過に伴う故障の発生しやすさを3つの期間に分けて表す。初期故障期間(故障率が時間とともに低下していく期間で、設計ミスや製造上の欠陥が主な原因)、偶発故障期間(故障率がほぼ一定で低い水準を保つ期間で、様々な環境要因により偶発的に故障が発生する)、摩耗故障期間(経年劣化・摩耗によって故障率が再び上昇していく期間)の3区分である。</p><p>図中のAは、故障率がほぼ一定の低い水準で推移している中央部分であることから偶発故障期間を指している。この期間は予測しにくい偶発的な故障が発生するため、根本的な故障率低減策よりも、故障発生時に迅速に対応できるよう予備部品を準備しておくなどの備えが実施すべき対応として適切であり、選択肢イが正解である。</p><p>選択肢アは初期故障期間への対応(出荷前の試運転によるスクリーニング)、選択肢ウ・エは摩耗故障期間への対応(定期保全・部品交換による予防保全)の説明であり、いずれも偶発故障期間Aの対応としては不適切である。</p>","mnemonic":""},{"id":539,"year":2016,"period":"平成28年度秋期","num":30,"cat":"ストラテジ系","field":"知的財産権(産業財産権)","summary":"知的財産権(産業財産権)：平成28年度秋期 問30","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000g6fw-att/2016h28a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>日本において、産業財産権と総称される四つの権利はどれか。</p>","choices":[{"label":"ア","html":"意匠権、実用新案権、商標権、特許権"},{"label":"イ","html":"意匠権、実用新案権、著作権、特許権"},{"label":"ウ","html":"意匠権、商標権、著作権、特許権"},{"label":"エ","html":"実用新案権、商標権、著作権、特許権"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>日本において「産業財産権」(かつては工業所有権とも呼ばれた)と総称されるのは、特許庁が所管する特許権、実用新案権、意匠権、商標権の4つの権利である。これらはいずれも登録(出願・審査)によって発生し、新しい技術やデザイン、ブランドなどを一定期間独占的に利用できる権利を付与するものであり、選択肢アが正解となる。</p><p>著作権は、創作された時点で自動的に発生し登録を要しない点、また所管官庁が文化庁である点で、特許庁が所管する産業財産権(登録主義)とは異なる性質をもつため、産業財産権には含まれない。したがって著作権を含む選択肢イ・ウ・エはいずれも誤りである。</p>","mnemonic":""},{"id":540,"year":2016,"period":"平成28年度春期","num":1,"cat":"テクノロジ系","field":"基数変換","summary":"基数変換：平成28年度春期 問1","correct":"ウ","result":"","formula":"123 = 商×26 ＋ 余り（商・余りをそれぞれA=0〜Z=25の対応表で文字に変換）","howto":"123を26で割って商と余りを求め，上位桁に商，下位桁に余りを対応する文字で当てはめる。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>10進数123を，英字A〜Zを用いた26進数で表したものはどれか。ここで，A＝0，B＝1，…，Z＝25とする。</p>","choices":[{"label":"ア","html":"BCD"},{"label":"イ","html":"DCB"},{"label":"ウ","html":"ET"},{"label":"エ","html":"TE"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>123を26進数に変換するには，123を26で割る。123÷26＝4 余り19。したがって上位の桁（26の位）は4，下位の桁（1の位）は19である。A＝0，B＝1，…，Z＝25の対応より，4はE，19はTに対応する。よって上位桁から順に並べると「ET」となり，選択肢ウが正解である。選択肢ア・イは文字の並びが異なるだけの紛らわしい選択肢，エ「TE」は上位・下位を逆にした典型的なひっかけである。</p>","mnemonic":"123÷26＝4あまり19。「よじ(4)じゅうく(19)」で商E・余りTの「ET」とセットで覚える。"},{"id":541,"year":2016,"period":"平成28年度春期","num":2,"cat":"テクノロジ系","field":"符号化(情報理論)","summary":"符号化(情報理論)：平成28年度春期 問2","correct":"ウ","result":"","formula":"平均符号長 ＝ Σ(出現確率×符号長)。まず各方式が接頭語(プレフィックス)条件を満たし一意に復号可能かを確認する。","howto":"どの符号語も他の符号語の先頭部分（接頭語）になっていないかを調べ，一意に復号できる方式の中で平均符号長が最小のものを選ぶ。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>a, b, c, dの4文字から成るメッセージを符号化してビット列にする方法として，表のア〜エの4通りを考えた。この表はa, b, c, dの各1文字を符号化するときのビット列を表している。メッセージ中でのa, b, c, dの出現頻度は，それぞれ50%，30%，10%，10%であることが分かっている。符号化されたビット列から元のメッセージが一意に復号可能であって，ビット列の長さが最も短くなるものはどれか。</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th></th><th>a</th><th>b</th><th>c</th><th>d</th></tr><tr><td>ア</td><td>0</td><td>1</td><td>00</td><td>11</td></tr><tr><td>イ</td><td>0</td><td>01</td><td>10</td><td>11</td></tr><tr><td>ウ</td><td>0</td><td>10</td><td>110</td><td>111</td></tr><tr><td>エ</td><td>00</td><td>01</td><td>10</td><td>11</td></tr></table>","choices":[{"label":"ア","html":"表のアの符号化方式"},{"label":"イ","html":"表のイの符号化方式"},{"label":"ウ","html":"表のウの符号化方式"},{"label":"エ","html":"表のエの符号化方式"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>まず一意に復号可能かを調べる。アはa＝0，c＝00であり，aの符号「0」がcの符号「00」の先頭と一致する（接頭語条件に違反）ため，例えば「0011」はa,a,b,bともc,dとも読めてしまい一意に復号できない。イもa＝0，b＝01でaがbの先頭と一致し，「010」がa,cともb,aとも解釈できるため一意に復号できない。したがってア・イは候補から除外される。ウ（a=0, b=10, c=110, d=111）とエ（すべて2ビット固定）はどの符号語も他の符号語の接頭語になっておらず，一意に復号可能である。平均符号長を計算すると，エは常に2ビットなので2.0ビット。ウは0.5×1＋0.3×2＋0.1×3＋0.1×3＝0.5＋0.6＋0.3＋0.3＝1.7ビットとなり，エより短い。出現頻度が高いaに最短の符号を割り当てるハフマン符号的な発想により，ウが最も短くかつ一意に復号可能な符号化方式となる。</p>","mnemonic":"一番人気のa(50%)に一番短い「0」を，レアなc・d(各10%)に長い「110」「111」を。えこひいき配分でウが1.7ビットの最短王。"},{"id":542,"year":2016,"period":"平成28年度春期","num":3,"cat":"テクノロジ系","field":"流れ図(並列処理)","summary":"流れ図(並列処理)：平成28年度春期 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>流れ図に示す処理の動作の記述として，適切なものはどれか。ここで，二重線は並列処理の同期を表す。</p><p>流れ図の構造：「開始」の後に処理Aを実行する。Aの後ろに二重線（同期点）があり，そこから左右2本の矢印が分岐してB，Cへそれぞれ入る。B，Cの下にも二重線（同期点）があり，さらにその下から矢印が再びB，Cの入り口へ戻るループ構造になっている（二重線は，そこに到達した全ての分岐が揃うまで待ち合わせる同期バリアを表す）。</p>","choices":[{"label":"ア","html":"ABC又はACBを実行してデッドロックになる。"},{"label":"イ","html":"AB又はACを実行してデッドロックになる。"},{"label":"ウ","html":"Aの後にBC又はCB，BC又はCB，…と繰り返して実行する。"},{"label":"エ","html":"Aの後にBの無限ループ又はCの無限ループになる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>二重線は「並列処理の同期（バリア同期）」を表す記号であり，そこに到達した複数の分岐が全て揃ってから次の処理に進むことを意味する。Aの後の二重線でB，Cの2つの処理が並列に起動されるが，二重線はあくまで待ち合わせのための同期点であり，相互排他のためのロック機構ではないため，BとCの間で資源の取り合いによるデッドロックは発生しない（選択肢ア・イは誤り）。B，Cはそれぞれ独立に実行されるため，どちらが先に終わるかは保証されず，実行順序はBC，CBのいずれもあり得る。そして下側の二重線で両者が合流（同期）した後，再び上の二重線に戻って同じ処理を繰り返す構造になっているため，Bのみ，あるいはCのみが無限ループになることもない（選択肢エは誤り）。したがって，Aの後にBとCを（順不同で）繰り返し実行するという記述が適切であり，ウが正解となる。</p>","mnemonic":""},{"id":543,"year":2016,"period":"平成28年度春期","num":4,"cat":"テクノロジ系","field":"並列処理方式(SIMD)","summary":"並列処理方式(SIMD)：平成28年度春期 問4","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>並列処理方式であるSIMDの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"単一命令ストリームで単一データストリームを処理する方式"},{"label":"イ","html":"単一命令ストリームで複数のデータストリームを処理する方式"},{"label":"ウ","html":"複数の命令ストリームで単一データストリームを処理する方式"},{"label":"エ","html":"複数の命令ストリームで複数のデータストリームを処理する方式"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SIMD（Single Instruction stream, Multiple Data stream）は，Flynnの分類における並列処理方式の一つで，1つの命令を複数のデータに同時に適用する方式である。例えば画像処理のように，同一の演算を大量のデータに一斉に施す処理に適しており，ベクトル計算機やGPU，CPUのSIMD拡張命令（SSE/AVXなど）で用いられる。したがって「単一命令ストリームで複数のデータストリームを処理する方式」と説明するイが正解。アは通常の逐次処理であるSISD，ウは現実にはほとんど存在しないMISD，エは複数のプロセッサがそれぞれ別の命令で別のデータを処理するMIMD（マルチコアプロセッサなど）の説明であり，いずれもSIMDとは異なる。</p>","mnemonic":""},{"id":544,"year":2016,"period":"平成28年度春期","num":5,"cat":"テクノロジ系","field":"サーバ仮想化(ライブマイグレーション)","summary":"サーバ仮想化(ライブマイグレーション)：平成28年度春期 問5","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>仮想サーバの運用サービスで使用するライブマイグレーションの概念を説明したものはどれか。</p>","choices":[{"label":"ア","html":"仮想サーバで稼働しているOSやソフトウェアを停止することなく，他の物理サーバへ移し替える技術である。"},{"label":"イ","html":"データの利用目的や頻度などに応じて，データを格納するのに適したストレージへ自動的に配置することによって，情報活用とストレージ活用を高める技術である。"},{"label":"ウ","html":"複数の利用者でサーバやデータベースを共有しながら，利用者ごとにデータベースの内容を明確に分離する技術である。"},{"label":"エ","html":"利用者の要求に応じてリソースを動的に割り当てたり，不要になったリソースを回収して別の利用者のために移し替えたりする技術である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ライブマイグレーションとは，仮想サーバ（仮想マシン）上で稼働しているOSやアプリケーションを停止させることなく，実行状態（メモリ内容など）を保ったまま別の物理サーバへ移動させる技術である。ハードウェア保守やサーバの負荷分散を，サービスを止めずに行える点が特長であり，アの記述が正しい。イは階層型ストレージ管理（HSM／ILM）の説明，ウはマルチテナント方式におけるデータ分離の説明，エはクラウドの弾力性（リソースの動的な割当て・回収）の説明であり，いずれもライブマイグレーション固有の概念ではない。</p>","mnemonic":""},{"id":545,"year":2016,"period":"平成28年度春期","num":6,"cat":"テクノロジ系","field":"仮想記憶方式","summary":"仮想記憶方式：平成28年度春期 問6","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>仮想記憶方式に関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"LRUアルゴリズムは，使用後の経過時間が最長のページを置換対象とするページ置換アルゴリズムである。"},{"label":"イ","html":"アドレス変換をインデックス方式で行う場合は，主記憶に存在する全ページ分のページテーブルが必要になる。"},{"label":"ウ","html":"ページフォールトが発生した場合は，ガーベジコレクションが必要である。"},{"label":"エ","html":"ページングが繰り返されるうちに多数の小さな空きメモリ領域が発生することを，フラグメンテーションという。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>LRU（Least Recently Used）は，直近の使用時点が最も古い，すなわち「使用後の経過時間が最も長い」ページを置換対象として選ぶページ置換アルゴリズムであり，アの記述は正しい。イについては，多段（階層型）ページテーブルなどを用いれば，必ずしも全ページ分のテーブルを常に主記憶上に保持する必要はなく，記述は不適切である。ウのガーベジコレクションはプログラム言語のメモリ管理機構であり，ページフォールト（参照ページが主記憶に無いことによる例外）の処理とは直接関係しない。エの「多数の小さな空き領域が散在する現象」はセグメント方式などで生じる外部フラグメンテーションの説明であり，ページング方式では固定長ページを扱うため最後の1ページ内の無駄（内部フラグメンテーション）は生じても，外部フラグメンテーションは本質的に発生しない。よってアが正解。</p>","mnemonic":""},{"id":546,"year":2016,"period":"平成28年度春期","num":7,"cat":"テクノロジ系","field":"半導体メモリ(DRAM)","summary":"半導体メモリ(DRAM)：平成28年度春期 問7","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>DRAMの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"1バイト単位でデータの消去及び書込みが可能な不揮発性のメモリであり，電源遮断時もデータ保持が必要な用途に用いられる。"},{"label":"イ","html":"不揮発性のメモリでNAND型又はNOR型があり，SSDに用いられる。"},{"label":"ウ","html":"メモリセルはフリップフロップで構成され，キャッシュメモリに用いられる。"},{"label":"エ","html":"リフレッシュ動作が必要なメモリであり，PCの主記憶として用いられる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DRAM（Dynamic RAM）は，コンデンサに電荷を蓄えてデータを保持する揮発性メモリであり，電荷がリーク（放電）してしまうため，一定時間ごとにデータを再書込みするリフレッシュ動作が必要である。構造が単純で高集積化・低コスト化しやすいため，PCやサーバの主記憶（メインメモリ）として広く使われており，エの記述が正しい。アはEEPROM，イはフラッシュメモリ（NAND/NOR型，SSDに使用），ウはSRAM（フリップフロップで構成され，リフレッシュ不要で高速なためキャッシュメモリに使用）の説明であり，いずれもDRAMとは異なる。</p>","mnemonic":""},{"id":547,"year":2016,"period":"平成28年度春期","num":8,"cat":"テクノロジ系","field":"ユーザビリティ評価","summary":"ユーザビリティ評価：平成28年度春期 問8","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>使用性（ユーザビリティ）の規格（JIS Z 8521:1999）では，使用性を，“ある製品が，指定された利用者によって，指定された利用の状況で，指定された目的を達成するために用いられる際の，有効さ，効率及び利用者の満足度の度合い”と定義している。この定義中の“利用者の満足度”を評価するのに適した方法はどれか。</p>","choices":[{"label":"ア","html":"インタビュー法"},{"label":"イ","html":"ヒューリスティック評価"},{"label":"ウ","html":"ユーザビリティテスト"},{"label":"エ","html":"ログデータ分析法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIS Z 8521（ISO 9241-11）のユーザビリティ定義は「有効さ」「効率」「満足度」の3要素から成る。このうち「満足度」は利用者の主観的な感じ方であるため，利用者に直接感想や意見を尋ねるインタビュー法（アンケート調査なども同様）が適している。ヒューリスティック評価は専門家がユーザビリティ原則に照らして問題点を洗い出す手法で有効さ・効率の評価に向き，ユーザビリティテストは被験者に実際にタスクを遂行させて達成度や所要時間を測る手法で主に有効さ・効率を定量的に評価するものであり，ログデータ分析法も操作履歴という客観データから有効さ・効率を推測する手法である。これらは主観的な満足度を直接測るものではないため，アが正解となる。</p>","mnemonic":""},{"id":548,"year":2016,"period":"平成28年度春期","num":9,"cat":"テクノロジ系","field":"関係データベース(参照制約)","summary":"関係データベース(参照制約)：平成28年度春期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>次の表において，“在庫”表の製品番号に定義された参照制約によって拒否される可能性がある操作はどれか。ここで，実線の下線は主キーを，破線の下線は外部キーを表す。</p><p>在庫（<u>在庫管理番号</u>，製品番号（外部キー），在庫量）<br>製品（<u>製品番号</u>，製品名，型，単価）</p>","choices":[{"label":"ア","html":"“在庫”表の行削除"},{"label":"イ","html":"“在庫”表の表削除"},{"label":"ウ","html":"“在庫”表への行追加"},{"label":"エ","html":"“製品”表への行追加"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>“在庫”表の製品番号は“製品”表の製品番号を参照する外部キーであり，参照制約（参照整合性制約）は「外部キーの値は，参照先の主キーに存在する値でなければならない」ことを保証する。“在庫”表へ行を追加する際，指定した製品番号が“製品”表に存在しない値であれば，この制約に違反するため挿入が拒否される可能性がある（ウが正解）。一方，“在庫”表の行削除や表削除は，他の表から参照される側ではなく参照する側（子表）の操作であり，参照制約には抵触しない。また“製品”表（親表）への行追加も，新たに追加される製品番号を“在庫”表のどの行も参照していないため，参照制約に違反することはない。</p>","mnemonic":""},{"id":549,"year":2016,"period":"平成28年度春期","num":10,"cat":"テクノロジ系","field":"DB障害回復(ロールフォワード)","summary":"DB障害回復(ロールフォワード)：平成28年度春期 問10","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>媒体障害の回復において，最新のデータベースのバックアップをリストアした後に，トランザクションログを用いて行う操作はどれか。</p>","choices":[{"label":"ア","html":"バックアップ取得後でコミット前に中断した全てのトランザクションをロールバックする。"},{"label":"イ","html":"バックアップ取得後でコミット前に中断した全てのトランザクションをロールフォワードする。"},{"label":"ウ","html":"バックアップ取得後にコミットした全てのトランザクションをロールバックする。"},{"label":"エ","html":"バックアップ取得後にコミットした全てのトランザクションをロールフォワードする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>媒体障害でデータベースそのものが破損した場合は，まず最新のバックアップをリストアしてバックアップ取得時点の状態に戻す。その後，バックアップ取得後に実際にコミットされた更新内容をトランザクションログ（更新後ジャーナル）をもとに再現（ロールフォワード）することで，障害直前の最新の状態まで復旧する。バックアップ取得後にコミットされていない（中断した）トランザクションはそもそも正式な更新として確定していないため，ロールフォワードの対象にはならない。したがって，正しい操作は「バックアップ取得後にコミットした全てのトランザクションをロールフォワードする」であり，エが正解。ロールバックは主記憶上のバッファ障害時などに未コミットの更新を取り消す操作であり，本問の媒体障害回復の文脈には当てはまらない。</p>","mnemonic":""},{"id":550,"year":2016,"period":"平成28年度春期","num":11,"cat":"テクノロジ系","field":"LAN(スイッチングハブ)","summary":"LAN(スイッチングハブ)：平成28年度春期 問11","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>CSMA/CD方式のLANで使用されるスイッチングハブ（レイヤ2スイッチ）は，フレームの蓄積機能，速度変換機能や交換機能をもっている。このようなスイッチングハブと同等の機能をもち，同じプロトコル階層で動作する装置はどれか。</p>","choices":[{"label":"ア","html":"ゲートウェイ"},{"label":"イ","html":"ブリッジ"},{"label":"ウ","html":"リピータ"},{"label":"エ","html":"ルータ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スイッチングハブ（レイヤ2スイッチ）はOSI参照モデルのデータリンク層（レイヤ2）で動作し，MACアドレスを基にフレームを蓄積・中継する装置である。これと同じデータリンク層で動作し，同等のフレーム中継機能をもつ代表的な装置がブリッジであり，イが正解。ゲートウェイはトランスポート層〜アプリケーション層でプロトコル変換などを行う装置，リピータは物理層で信号を増幅・整形するだけでフレーム蓄積機能をもたない装置，ルータはネットワーク層でIPアドレスを基に経路選択を行う装置であり，いずれも階層や機能が異なる。</p>","mnemonic":""},{"id":551,"year":2016,"period":"平成28年度春期","num":12,"cat":"テクノロジ系","field":"暗号方式","summary":"暗号方式：平成28年度春期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>暗号方式のうち，共通鍵暗号方式はどれか。</p>","choices":[{"label":"ア","html":"AES"},{"label":"イ","html":"ElGamal暗号"},{"label":"ウ","html":"RSA"},{"label":"エ","html":"楕円曲線暗号"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>AES（Advanced Encryption Standard）は，暗号化と復号に同一の鍵を用いる共通鍵（秘密鍵）暗号方式であり，アが正解。一方，ElGamal暗号，RSA，楕円曲線暗号はいずれも暗号化鍵と復号鍵が異なる公開鍵（非対称鍵）暗号方式であり，RSAは素因数分解の困難性，ElGamal暗号と楕円曲線暗号は離散対数問題（またはその楕円曲線版）の困難性を安全性の根拠としている。共通鍵暗号方式は公開鍵暗号方式に比べて処理が高速であるという特徴がある。</p>","mnemonic":""},{"id":552,"year":2016,"period":"平成28年度春期","num":13,"cat":"テクノロジ系","field":"WAF","summary":"WAF：平成28年度春期 問13","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>WAFの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"DMZに設置されているWebサーバへ外部から実際に侵入を試みる。"},{"label":"イ","html":"WebサーバのCPU負荷を軽減するために，TLSによる暗号化と復号の処理をWebサーバではなく専用のハードウェアで行う。"},{"label":"ウ","html":"システム管理者が質問に答える形式で，自組織の情報セキュリティ対策のレベルを診断する。"},{"label":"エ","html":"特徴的なパターンが含まれるかなどWebアプリケーションへの通信内容を検査して，不正な操作を遮断する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>WAF（Web Application Firewall）は，Webサーバの前面に設置され，HTTP/HTTPS通信の中身（リクエストの内容）を検査し，SQLインジェクションやクロスサイトスクリプティングなど攻撃に特徴的なパターンが含まれていないかをシグネチャなどで判定して，不正な通信を遮断するセキュリティ対策製品である。したがってエが正解。アはペネトレーションテストの説明，イはSSL（TLS）アクセラレータの説明，ウは自己点検（セキュリティチェックシートなどによる自己診断）の説明であり，WAFとは異なる。</p>","mnemonic":""},{"id":553,"year":2016,"period":"平成28年度春期","num":14,"cat":"テクノロジ系","field":"セッション管理","summary":"セッション管理：平成28年度春期 問14","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>Webアプリケーションのセッションが攻撃者に乗っ取られ，攻撃者が乗っ取ったセッションを利用してアクセスした場合でも，個人情報の漏えいなどの被害が拡大しないようにするために，Webアプリケーションが重要な情報をWebブラウザに送信する直前に行う対策として，最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"Webブラウザとの間の通信を暗号化する。"},{"label":"イ","html":"発行済セッションIDをCookieに格納する。"},{"label":"ウ","html":"発行済セッションIDをURLに設定する。"},{"label":"エ","html":"パスワードによる利用者認証を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>セッションが乗っ取られた場合，攻撃者は正規に発行されたセッションIDだけを使ってなりすましアクセスできてしまう。この被害の拡大を防ぐには，重要情報を送信する直前にもう一度パスワードなどによる本人確認（再認証）を行うのが有効である。これにより，攻撃者がセッションIDだけを知っていてもパスワードを知らなければ重要情報を取得できなくなるため，エが正解。アの通信の暗号化（TLS化）は盗聴を防ぐものであり，セッションID自体が盗まれて乗っ取られた状況には効果がない。イ・ウはセッションIDの格納場所（Cookieか，URLパラメータか）に関する話であり，セッションIDが漏えいした後の被害拡大防止には直接関係しない（なお一般にURLへの格納はリファラ漏えい等のリスクがあり避けるべきとされる）。</p>","mnemonic":""},{"id":554,"year":2016,"period":"平成28年度春期","num":15,"cat":"テクノロジ系","field":"クラウドサービスモデル","summary":"クラウドサービスモデル：平成28年度春期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>クラウドのサービスモデルをNISTの定義に従ってIaaS，PaaS，SaaSに分類したとき，パブリッククラウドサービスの利用企業が行うシステム管理作業において，PaaSとSaaSでは実施できないが，IaaSでは実施できるものはどれか。</p>","choices":[{"label":"ア","html":"アプリケーションの利用者ID管理"},{"label":"イ","html":"アプリケーションログの取得と分析"},{"label":"ウ","html":"仮想サーバのゲストOSに係るセキュリティの設定"},{"label":"エ","html":"ハイパバイザに係るセキュリティの設定"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NISTの定義によるIaaS・PaaS・SaaSは，クラウド事業者と利用者の管理範囲の境界が異なる。IaaSでは，物理インフラとハイパバイザ（仮想化基盤）は事業者が管理するが，その上のゲストOSやミドルウェア，アプリケーションは利用者が自ら構築・管理する。したがって，ゲストOSに対するセキュリティパッチ適用などの設定はIaaSでは利用者が行えるが，PaaSやSaaSではOS層は事業者側が管理するため利用者は手を出せない。よってウが正解。アのアプリケーション利用者ID管理やイのアプリケーションログ取得・分析は，アプリケーションを利用者が動かすSaaSでも一定範囲で実施可能な作業であり，また，エのハイパバイザに係る設定は，IaaSであっても事業者側の管理範囲であり利用者が行うことはできない。</p>","mnemonic":""},{"id":555,"year":2016,"period":"平成28年度春期","num":16,"cat":"テクノロジ系","field":"ソフトウェア品質特性","summary":"ソフトウェア品質特性：平成28年度春期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ソフトウェアの品質特性のうちの保守性に影響するものはどれか。</p>","choices":[{"label":"ア","html":"ソフトウェアが，特定の作業に特定の利用条件でどのように利用できるかを利用者が理解しやすいかどうか。"},{"label":"イ","html":"ソフトウェアにある欠陥の診断又は故障原因の追究，及びソフトウェアの修正箇所を識別しやすいかどうか。"},{"label":"ウ","html":"ソフトウェアに潜在する障害の結果として生じる故障が発生しやすいかどうか。"},{"label":"エ","html":"ソフトウェアの機能を実行する際に，資源の量及び資源の種類を適切に使用するかどうか。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ソフトウェア品質特性（ISO/IEC 9126など）において，保守性はさらに「解析性」「変更性（修正性）」「安定性」「試験性」などの副特性に分けられる。このうち「欠陥の診断や故障原因の追究，修正箇所の識別のしやすさ」は解析性の定義そのものであり，保守のしやすさに直結するためイが正解。アは使用性（理解性）の説明，ウは信頼性の説明，エは効率性（資源効率性）の説明であり，いずれも保守性とは異なる品質特性に関するものである。</p>","mnemonic":""},{"id":556,"year":2016,"period":"平成28年度春期","num":17,"cat":"テクノロジ系","field":"モジュール結合度","summary":"モジュール結合度：平成28年度春期 問17","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>モジュールの結合度が最も低い，データの受渡し方法はどれか。</p>","choices":[{"label":"ア","html":"単一のデータ項目を大域的データで受け渡す。"},{"label":"イ","html":"単一のデータ項目を引数で受け渡す。"},{"label":"ウ","html":"データ構造を大域的データで受け渡す。"},{"label":"エ","html":"データ構造を引数で受け渡す。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>モジュール結合度は，弱い（望ましい）順に，データ結合＜スタンプ結合＜制御結合＜外部結合＜共通結合＜内容結合，と整理される。必要最小限の単一データ項目を引数として受け渡す方式は「データ結合」に当たり，結合度が最も弱く望ましいため，イが正解。アやウのように大域的データ（グローバル変数など）を介してやり取りする方式は，関係ないモジュールからも参照・変更され得るため「共通結合」となり結合度が高い。エのようにデータ構造（複合データ）を丸ごと引数で渡す方式は，受け取る側が実際には一部しか使わない場合でも不要な情報まで渡ってしまうため「スタンプ結合」となり，単一データ項目を渡すデータ結合より結合度が高い。</p>","mnemonic":""},{"id":557,"year":2016,"period":"平成28年度春期","num":18,"cat":"マネジメント系","field":"工数見積り(COCOMO)","summary":"工数見積り(COCOMO)：平成28年度春期 問18","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>システム開発における工数の見積りに関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"COCOMOの使用には，自社における生産性に関する，蓄積されたデータが必要である。"},{"label":"イ","html":"開発要員の技量は異なるので工数は参考にならないが，過去に開発したプログラムの規模は見積りの参考になる。"},{"label":"ウ","html":"工数の見積りは，作業の進捗管理に有効であるが，ソフトウェアの品質管理には関係しない。"},{"label":"エ","html":"ファンクションポイント法による見積りでは，プログラムステップ数を把握する必要がある。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>COCOMO（COnstructive COst MOdel）は，プログラム規模などから工数・期間を見積もる手法であり，その係数は自社（あるいは類似プロジェクト）の過去の開発実績から得られる生産性データを用いて調整する必要がある。したがって，自社の蓄積データが見積り精度を左右するため，アが正解。イは，開発要員の技量差があっても過去のプロジェクトの工数実績は規模とあわせて重要な参考情報になるため誤り。ウは，工数見積りが適切であることは品質確保のための十分な工数・体制確保にもつながり，品質管理と無関係とはいえないため誤り。エのファンクションポイント法は，画面・帳票・ファイルなどの機能の数や複雑さから規模を見積もる手法であり，プログラムのステップ数（行数）を直接把握する必要はないため誤り。</p>","mnemonic":""},{"id":558,"year":2016,"period":"平成28年度春期","num":19,"cat":"マネジメント系","field":"サービスレベル管理","summary":"サービスレベル管理：平成28年度春期 問19","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ITサービスマネジメントにおけるサービスレベル管理の説明はどれか。</p>","choices":[{"label":"ア","html":"あらかじめ定めた間隔で，サービス目標に照らしてサービスの傾向及びパフォーマンスを監視する。"},{"label":"イ","html":"計画が発動された場合の可用性の目標，平常業務の状態に復帰するための取組みなどを含めた計画を作成し，導入し，維持する。"},{"label":"ウ","html":"サービスの品質を阻害する事象に対して，合意したサービス目標及び時間枠内に回復させる。"},{"label":"エ","html":"予算に照らして，費用を監視及び報告し，財務予測をレビューし，費用を管理する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サービスレベル管理（SLM）は，利用者と合意したサービス目標（SLA）に基づき，定期的にサービスの実績やパフォーマンスの傾向を監視・レビューし，目標達成状況を維持・改善していくプロセスであり，アが正解。イはITサービス継続性管理（サービス停止時の復旧計画に関するプロセス），ウはインシデント管理（合意した時間内でのサービス復旧），エはITサービスの財務管理（予算・課金・費用管理）の説明であり，いずれもサービスレベル管理とは異なるITILプロセスの説明である。</p>","mnemonic":""},{"id":559,"year":2016,"period":"平成28年度春期","num":20,"cat":"マネジメント系","field":"構成管理","summary":"構成管理：平成28年度春期 問20","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>ITサービスマネジメントのプロセスの一つである構成管理を導入することによって得られるメリットはどれか。</p>","choices":[{"label":"ア","html":"ITリソースに対する，現在の需要の把握と将来の需要の予測ができる。"},{"label":"イ","html":"緊急事態においても最低限のITサービス基盤を提供することによって，事業の継続が可能になる。"},{"label":"ウ","html":"構成品目の情報を正確に把握することによって，他のプロセスの確実な実施を支援できる。"},{"label":"エ","html":"適正な費用で常に一定した品質でのITサービスが提供されるようになる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>構成管理は，ITインフラを構成するハードウェア・ソフトウェアなどの構成品目（CI）とその関連・依存関係を正確に把握・維持するプロセスである。CMDB等で正確な構成情報を保持することで，インシデント管理や変更管理，リリース管理など他のプロセスが変更の影響範囲や依存関係を正しく判断でき，確実な実施を支援できるため，ウが正解。アはキャパシティ管理，イはITサービス継続性管理，エは可用性管理やサービスレベル管理によって得られるメリットの説明であり，構成管理固有のメリットではない。</p>","mnemonic":""},{"id":560,"year":2016,"period":"平成28年度春期","num":21,"cat":"マネジメント系","field":"システム監査(クラウド)","summary":"システム監査(クラウド)：平成28年度春期 問21","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>クラウドサービスの導入検討プロセスに対するシステム監査において，クラウドサービス上に保存されている情報の消失の予防に関するチェックポイントとして，適切なものはどれか。</p>","choices":[{"label":"ア","html":"既存の社内情報システムとのIDの一元管理の可否が検討されているか。"},{"label":"イ","html":"クラウドサービスの障害時における最大許容停止時間が検討されているか。"},{"label":"ウ","html":"クラウドサービスを提供する事業者に信頼が置け，かつ事業やサービスが継続して提供されるかどうかが検討されているか。"},{"label":"エ","html":"クラウドサービスを提供する事業者の施設内のネットワークに，暗号化通信が採用されているかどうかが検討されているか。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クラウドサービス上の情報が消失する最大の要因の一つは，サービス提供事業者自体の倒産やサービス終了といった事業継続性に関わるリスクである。したがって，情報消失を予防する観点のチェックポイントとしては，事業者が信頼でき，かつ事業・サービスが将来にわたって継続的に提供されるかどうかを検討しているかを確認することが適切であり，ウが正解。アはアクセス管理（ID管理）の観点，イは可用性・事業継続（BCP）の観点（停止時間の許容範囲），エは通信の盗聴防止（機密性）の観点であり，いずれも「情報の消失の予防」という論点とは異なる。</p>","mnemonic":""},{"id":561,"year":2016,"period":"平成28年度春期","num":22,"cat":"マネジメント系","field":"システム監査(予備調査)","summary":"システム監査(予備調査)：平成28年度春期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>システム監査人が予備調査で実施する監査手続はどれか。</p>","choices":[{"label":"ア","html":"監査対象に関する手順書や実施記録，及び被監査部門から入手した監査証拠に基づいて，指摘事項をまとめる。"},{"label":"イ","html":"監査対象に対する被監査部門の管理者及び担当者のリスクの認識について，アンケート調査によって情報を収集する。"},{"label":"ウ","html":"被監査部門の管理者の説明を受けながら，被監査部門が業務を行っている現場を実際に見て，改善提案の実現可能性を確かめる。"},{"label":"エ","html":"被監査部門の担当者に対して，監査手続書に従ってヒアリングを行い，監査対象の実態を詳細に調査する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査は，一般に監査対象の全体像や統制状況の概要を把握する「予備調査」と，現地で監査手続書に基づき監査証拠を実際に入手する「本調査」とに分かれる。予備調査の段階では，資料閲覧やアンケート調査などによって被監査部門の実態やリスク認識を大まかに把握するのが一般的であり，イのアンケート調査による情報収集が予備調査に該当する。一方，アの監査証拠に基づく指摘事項の取りまとめ，ウの現場での実地確認，エの監査手続書に従った詳細なヒアリングは，いずれも現地で監査証拠を収集・評価する本調査の段階で行う作業であり，予備調査には該当しない。</p>","mnemonic":""},{"id":562,"year":2016,"period":"平成28年度春期","num":23,"cat":"ストラテジ系","field":"IT投資評価","summary":"IT投資評価：平成28年度春期 問23","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>IT投資評価を，個別プロジェクトの計画，実施，完了に応じて，事前評価，中間評価，事後評価として実施する。事前評価について説明したものはどれか。</p>","choices":[{"label":"ア","html":"事前に設定した効果目標の達成状況を評価し，必要に応じて目標を達成するための改善策を検討する。"},{"label":"イ","html":"実施計画と実績との差異及び原因を詳細に分析し，投資額や効果目標の変更が必要かどうかを判断する。"},{"label":"ウ","html":"投資効果の実現時期と評価に必要なデータ収集方法を事前に計画し，その時期に合わせて評価を行う。"},{"label":"エ","html":"投資目的に基づいた効果目標を設定し，実施可否判断に必要な情報を上位マネジメントに提供する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>事前評価は，プロジェクトを開始する前の段階で，投資の目的に基づいた効果目標を設定し，その投資を実施すべきかどうかを上位マネジメントが判断するために必要な情報を提供する評価である。したがってエが正解。アは，設定済みの目標の達成状況を進行中に点検し改善策を検討する内容であり中間評価に当たる。イも実施計画と実績の差異分析による見直し判断であり中間評価の内容である。ウは評価の実施時期やデータ収集方法を計画する内容であり，事前評価の準備作業的な側面はあるが，実施可否の意思決定に必要な情報提供という事前評価の本質を直接説明したものではない。</p>","mnemonic":""},{"id":563,"year":2016,"period":"平成28年度春期","num":24,"cat":"ストラテジ系","field":"SOA","summary":"SOA：平成28年度春期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>SOAを説明したものはどれか。</p>","choices":[{"label":"ア","html":"企業改革において既存の組織やビジネスルールを抜本的に見直し，業務フロー，管理機構，情報システムを再構築する手法のこと"},{"label":"イ","html":"企業の経営資源を有効に活用して経営の効率を向上させるために，基幹業務を部門ごとではなく統合的に管理するための業務システムのこと"},{"label":"ウ","html":"発注者とITアウトソーシングサービス提供者との間で，サービスの品質について合意した文書のこと"},{"label":"エ","html":"ビジネスプロセスの構成要素とそれを支援するIT基盤を，ソフトウェア部品であるサービスとして提供するシステムアーキテクチャのこと"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SOA（Service Oriented Architecture：サービス指向アーキテクチャ）は，業務機能を標準的なインタフェースをもつ独立したソフトウェア部品（サービス）として実装し，それらを組み合わせてビジネスプロセスを構築・支援する設計手法である。ビジネスプロセスを構成する機能とそれを支える基盤をサービスという部品単位で提供するという考え方を説明したエが正解。アはBPR（ビジネスプロセスリエンジニアリング）の説明，イはERP（統合基幹業務システム）の説明，ウはSLA（サービスレベルアグリーメント）の説明であり，いずれもSOAとは異なる概念である。</p>","mnemonic":""},{"id":564,"year":2016,"period":"平成28年度春期","num":25,"cat":"ストラテジ系","field":"UMLモデリング","summary":"UMLモデリング：平成28年度春期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>表は，ビジネスプロセスをUMLで記述する際に使用される図法とその用途を示している。表中のbに相当する図法はどれか。ここで，ア〜エは，a〜dのいずれかに該当する。</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th>図法</th><th>記述用途</th></tr><tr><td>a</td><td>モデル要素の型，内部構造，他のモデル要素との関連を記述する。</td></tr><tr><td>b</td><td>システムが提供する機能単位と利用者との関連を記述する。</td></tr><tr><td>c</td><td>イベントの反応としてオブジェクトの状態遷移を記述する。</td></tr><tr><td>d</td><td>オブジェクト間のメッセージの交信と相互作用を記述する。</td></tr></table>","choices":[{"label":"ア","html":"クラス図"},{"label":"イ","html":"コラボレーション図"},{"label":"ウ","html":"ステートチャート図"},{"label":"エ","html":"ユースケース図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>bの用途である「システムが提供する機能単位と，それを利用する利用者（アクタ）との関連を記述する」というのは，ユースケース図の定義そのものであり，エが正解。aの「モデル要素の型，内部構造，モデル要素間の関連を記述する」はクラス図（ア），cの「イベントの反応としてのオブジェクトの状態遷移を記述する」はステートチャート図（ウ），dの「オブジェクト間のメッセージの交信と相互作用を記述する」はコラボレーション図（イ）にそれぞれ対応する。</p>","mnemonic":""},{"id":565,"year":2016,"period":"平成28年度春期","num":26,"cat":"ストラテジ系","field":"競争地位戦略","summary":"競争地位戦略：平成28年度春期 問26","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>企業の競争戦略におけるチャレンジャ戦略はどれか。</p>","choices":[{"label":"ア","html":"上位企業の市場シェアを奪うことを目標に，製品，サービス，販売促進，流通チャネルなどのあらゆる面での差別化戦略をとる。"},{"label":"イ","html":"潜在的な需要がありながら，大手企業が参入してこないような専門特化した市場に，限られた経営資源を集中する。"},{"label":"ウ","html":"目標とする企業の戦略を観察し，迅速に模倣することで，開発や広告のコストを抑制し，市場での存続を図る。"},{"label":"エ","html":"利潤，名声の維持・向上と最適市場シェアの確保を目標として，市場内の全ての顧客をターゲットにした全方位戦略をとる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コトラーの競争地位戦略では，企業は市場内の地位によってリーダ，チャレンジャ，フォロワ，ニッチャの4類型に分けられる。チャレンジャは業界トップ（リーダ）の座を狙う2位以下の企業であり，リーダとまともに同じ土俵で戦うのではなく，製品・サービス・プロモーション・流通など様々な面でリーダとの差別化を図り，シェアの奪取を目指すため，アが正解。イはニッチャ戦略（経営資源を特定の専門市場に集中），ウはフォロワ戦略（上位企業の模倣によるコスト抑制），エはリーダ戦略（全方位をカバーし市場全体での最適シェア維持を狙う）の説明である。</p>","mnemonic":""},{"id":566,"year":2016,"period":"平成28年度春期","num":27,"cat":"ストラテジ系","field":"マーケティング4P/4C","summary":"マーケティング4P/4C：平成28年度春期 問27","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>売り手側でのマーケティング要素4Pは，買い手側での要素4Cに対応するという考え方がある。4Pの一つであるプロモーションに対応する4Cの構成要素はどれか。</p>","choices":[{"label":"ア","html":"顧客価値（Customer Value）"},{"label":"イ","html":"顧客コスト（Customer Cost）"},{"label":"ウ","html":"コミュニケーション（Communication）"},{"label":"エ","html":"利便性（Convenience）"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マーケティングの4P（Product，Price，Place，Promotion：売り手視点）は，買い手視点に置き換えた4C（Customer Value，Customer Cost，Convenience，Communication）とそれぞれ対応すると整理される。Product⇔Customer Value，Price⇔Customer Cost，Place⇔Convenience，Promotion⇔Communicationという対応関係になっており，Promotion（販売促進・広告などの企業からの働きかけ）に対応する4C要素は，双方向の情報伝達であるコミュニケーションであるため，ウが正解。顧客価値・顧客コスト・利便性は，それぞれProduct・Price・Placeに対応するものであり，Promotionとの対応ではない。</p>","mnemonic":""},{"id":567,"year":2016,"period":"平成28年度春期","num":28,"cat":"ストラテジ系","field":"製品開発手法","summary":"製品開発手法：平成28年度春期 問28","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>製品開発のスピードアップ手法を次のa〜dに分類した場合，bに相当するものはどれか。ここで，ア〜エは，a〜dのいずれかに該当する。</p><p>分類の軸：縦軸は経営資源の確保（組織内から／組織外から），横軸は実現方法（技術的アプローチ／組織的アプローチ）。a＝組織内から×技術的アプローチ，b＝組織内から×組織的アプローチ，c＝組織外から×技術的アプローチ，d＝組織外から×組織的アプローチ。</p>","choices":[{"label":"ア","html":"CAD，CAM，CAEなど既に一部利用しているツールの積極的な活用"},{"label":"イ","html":"消費者ニーズを調査し，製品開発につなげるための市場調査会社の活用"},{"label":"ウ","html":"設計部門と生産部門の作業を並列に進めるコンカレントエンジニアリング"},{"label":"エ","html":"大学との共同研究開発や，同業他社からの技術導入"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>bは「組織内から（自社の経営資源を活用）」かつ「組織的アプローチ（仕組み・体制面での工夫）」による製品開発のスピードアップ手法に当たる。設計部門と生産部門など社内の複数部門が作業を並列に進めるコンカレントエンジニアリングは，社内（組織内）の体制・進め方（組織的アプローチ）を工夫する代表的な手法であり，ウが正解。アのCAD/CAM/CAE活用は組織内×技術的アプローチ（a），イの市場調査会社の活用は組織外×組織的アプローチ（d），エの大学との共同研究や他社からの技術導入は組織外×技術的アプローチ（c）に相当する。</p>","mnemonic":""},{"id":568,"year":2016,"period":"平成28年度春期","num":29,"cat":"ストラテジ系","field":"ワークライフバランス","summary":"ワークライフバランス：平成28年度春期 問29","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>内閣府によって取りまとめられた“仕事と生活の調和（ワーク・ライフ・バランス）憲章”及び“仕事と生活の調和推進のための行動指針”では，目指すべき社会の姿ごとに，その実現に向けた指標を設けている。次の表のcに当てはまるものはどれか。</p><table border='1' cellpadding='4' style='border-collapse:collapse'><tr><th>目指すべき社会の姿</th><th>実現に向けた指標の例</th></tr><tr><td>a</td><td>就業率／時間当たり労働生産性の伸び率／フリータの数</td></tr><tr><td>b</td><td>労働時間等の課題について労使が話合いの機会を設けていると回答した企業の割合／週労働時間60時間以上の雇用者の割合／メンタルヘルスケアに取り組んでいる事業所の割合</td></tr><tr><td>c</td><td>在宅型テレワーカの数／短時間勤務を選択できる事業所の割合／男性の育児休業取得率</td></tr></table>","choices":[{"label":"ア","html":"健康で豊かな生活のための時間が確保できる社会"},{"label":"イ","html":"個々の社員のキャリア形成を企業が支援可能な社会"},{"label":"ウ","html":"就労による経済的自立が可能な社会"},{"label":"エ","html":"多様な働き方・生き方が選択できる社会"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>“仕事と生活の調和（ワーク・ライフ・バランス）憲章”及び行動指針では，目指すべき社会の姿として「就労による経済的自立が可能な社会」「健康で豊かな生活のための時間が確保できる社会」「多様な働き方・生き方が選択できる社会」の3つが掲げられている。表のcに示された指標（在宅型テレワーカの数，短時間勤務を選べる事業所の割合，男性の育児休業取得率）は，働き方の柔軟性・多様性に関する指標であり，「多様な働き方・生き方が選択できる社会」に対応するため，エが正解。aは就業率や労働生産性など経済的自立に関する指標（ウ），bは労働時間やメンタルヘルスなど時間確保・健康に関する指標（ア）にそれぞれ対応する。</p>","mnemonic":""},{"id":569,"year":2016,"period":"平成28年度春期","num":30,"cat":"ストラテジ系","field":"個人情報保護法","summary":"個人情報保護法：平成28年度春期 問30","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000gn5o-att/2016h28h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2016h28.html","q":"<p>個人情報保護法で保護される個人情報の条件はどれか。</p>","choices":[{"label":"ア","html":"企業が管理している顧客に関する情報に限られる。"},{"label":"イ","html":"個人が秘密にしているプライバシに関する情報に限られる。"},{"label":"ウ","html":"生存している個人に関する情報に限られる。"},{"label":"エ","html":"日本国籍を有する個人に関する情報に限られる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>個人情報保護法第2条は，個人情報を「生存する個人に関する情報であって，氏名，生年月日その他の記述等により特定の個人を識別できるもの（他の情報と容易に照合でき，それにより特定の個人を識別できることとなるものを含む）」などと定義している。したがって，保護の対象は生存している個人に関する情報に限られ，死亡した人に関する情報は原則として対象外となるため，ウが正解。保護対象は企業が管理する顧客情報に限定されず（ア），本人が秘密にしているかどうかも要件ではなく（イ），日本国籍の有無も要件とされていない（エ）。</p>","mnemonic":""}]</script>
<script>
(function(){
"use strict";
var QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
var CATS = Array.from(new Set(QUESTIONS.map(function(q){return q.cat}))).sort();
var CAT_CLASS = {"テクノロジ系":"cat-tech","マネジメント系":"cat-mgmt","ストラテジ系":"cat-strat"};
var FIELDS = Array.from(new Set(QUESTIONS.map(function(q){return q.field}))).sort();
var YEARS = Array.from(new Set(QUESTIONS.map(function(q){return q.year}))).sort();

var STORE_KEY = 'am1_progress_v1';
var state = loadState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(!s.checks) s.checks = {};
      // migrate from the old single-flag "あやふや" toggle, if present
      if(s.unsure){
        Object.keys(s.unsure).forEach(function(id){
          if(s.unsure[id] && !s.checks[id]) s.checks[id] = 'yellow';
        });
        delete s.unsure;
      }
      if(!s.answers) s.answers = {};
      return s;
    }
  }catch(e){}
  return {answers:{}, checks:{}};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

var filter = {cats:new Set(), fields:new Set(), years:new Set(), checks:new Set()};
var queue = [];      // array of question ids for current session
var answeredInSession = new Set(); // ids answered during THIS session (so retry modes start fresh)
var qPos = 0;        // index into queue
var answeredThisQ = false;
var pickedLabel = null;

// ---------- auto-review mode ----------
var AUTO_KEY = 'am1_auto_mode';
var AUTO_SEC_KEY = 'am1_auto_seconds';
var AUTO_SEC_OPTIONS = [2, 3, 5, 8, 15];
var autoMode = false;
var autoSeconds = 15;
try{
  autoMode = localStorage.getItem(AUTO_KEY) === '1';
  var savedSec = parseInt(localStorage.getItem(AUTO_SEC_KEY) || '15', 10);
  if(savedSec > 0) autoSeconds = savedSec;
}catch(e){}
var autoTimeoutHandle = null;

function renderAutoUI(){
  document.getElementById('autoOffChip').classList.toggle('active', !autoMode);
  document.getElementById('autoOnChip').classList.toggle('active', autoMode);
  document.getElementById('autoSecRow').style.display = autoMode ? 'block' : 'none';
  var wrap = document.getElementById('autoSecChips');
  wrap.innerHTML = '';
  AUTO_SEC_OPTIONS.forEach(function(s){
    wrap.appendChild(chip(s+'秒', s===autoSeconds, function(){
      autoSeconds = s;
      try{ localStorage.setItem(AUTO_SEC_KEY, String(s)); }catch(e){}
      renderAutoUI();
    }));
  });
}
document.getElementById('autoOffChip').addEventListener('click', function(){
  autoMode = false;
  try{ localStorage.setItem(AUTO_KEY, '0'); }catch(e){}
  renderAutoUI();
});
document.getElementById('autoOnChip').addEventListener('click', function(){
  autoMode = true;
  try{ localStorage.setItem(AUTO_KEY, '1'); }catch(e){}
  renderAutoUI();
});

function clearAutoTimer(){
  if(autoTimeoutHandle){ window.clearTimeout(autoTimeoutHandle); autoTimeoutHandle = null; }
  var bar = document.getElementById('autoBar');
  if(bar) bar.style.display = 'none';
  var fill = document.getElementById('autoBarFill');
  if(fill){ fill.style.transition = 'none'; fill.style.width = '0%'; fill.classList.remove('advancing'); }
}
function startAutoBar(seconds, label, advancing, onDone){
  var bar = document.getElementById('autoBar');
  var fill = document.getElementById('autoBarFill');
  var lbl = document.getElementById('autoBarLabel');
  lbl.textContent = label;
  fill.classList.toggle('advancing', !!advancing);
  bar.style.display = 'block';
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth;
  fill.style.transition = 'width ' + seconds + 's linear';
  fill.style.width = '100%';
  autoTimeoutHandle = window.setTimeout(function(){
    autoTimeoutHandle = null;
    onDone();
  }, seconds * 1000);
}

var views = {};
['dash','quiz','jump','done'].forEach(function(v){ views[v]=document.getElementById('view-'+v); });
function showView(name){
  Object.keys(views).forEach(function(k){ views[k].classList.toggle('active', k===name); });
  window.scrollTo(0,0);
}

// ---------- theme toggle ----------
var THEME_KEY='am1_theme';
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
(function(){ try{ var t=localStorage.getItem(THEME_KEY); if(t) applyTheme(t); }catch(e){} })();
document.getElementById('themeToggle').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  applyTheme(next);
  try{ if(next) localStorage.setItem(THEME_KEY,next); else localStorage.removeItem(THEME_KEY); }catch(e){}
});

// ---------- sound ----------
var SOUND_KEY='am1_sound_muted';
var soundMuted = false;
try{ soundMuted = localStorage.getItem(SOUND_KEY)==='1'; }catch(e){}
var soundBtn = document.getElementById('soundToggle');
function renderSoundBtn(){ soundBtn.textContent = soundMuted ? '🔇' : '🔊'; }
renderSoundBtn();

var audioCtx = null;
function getCtx(){
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
  }catch(e){}
  return audioCtx;
}
function tone(ctx, t0, freq, dur, type, peak){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak||0.18, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.02);
  return osc;
}
function playTones(specs){
  try{
    var ctx = getCtx();
    if(!ctx) return;
    var fire = function(){
      try{
        var t0 = ctx.currentTime;
        specs.forEach(function(s){ tone(ctx, t0+s.at, s.freq, s.dur, s.type, s.peak); });
      }catch(e){}
    };
    if(ctx.state === 'suspended'){ ctx.resume().then(fire, fire); }
    else { fire(); }
  }catch(e){}
}
function playCorrectSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:880,    dur:0.16, type:'sine', peak:0.24},
    {at:0.1,  freq:1318.5, dur:0.26, type:'sine', peak:0.24}
  ]);
}
function playWrongSound(){
  if(soundMuted) return;
  playTones([
    {at:0,    freq:220,   dur:0.3,  type:'sawtooth', peak:0.16},
    {at:0.06, freq:174.6, dur:0.34, type:'sawtooth', peak:0.15}
  ]);
}
// unlock audio context on first touch/click anywhere (iOS requirement)
function unlockAudio(){
  var ctx = getCtx();
  if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
}
document.addEventListener('touchend', function once(){ unlockAudio(); document.removeEventListener('touchend', once); }, {once:true});
document.addEventListener('click', function once(){ unlockAudio(); document.removeEventListener('click', once); }, {once:true});

soundBtn.addEventListener('click', function(){
  soundMuted = !soundMuted;
  renderSoundBtn();
  try{ localStorage.setItem(SOUND_KEY, soundMuted?'1':'0'); }catch(e){}
  if(!soundMuted){ getCtx(); playCorrectSound(); }
});

// ---------- big stamp ----------
function flashBigStamp(correct){
  var el = document.getElementById('bigStamp');
  el.className = correct ? '' : 'wrong';
  el.innerHTML = correct
    ? '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20"></circle></svg>'
    : '<svg viewBox="0 0 52 52"><path d="M14 14 L38 38 M38 14 L14 38"></path></svg>';
  // force reflow so re-adding the class restarts the animation
  void el.offsetWidth;
  el.className = (correct ? '' : 'wrong ') + 'show';
  window.setTimeout(function(){ el.className = correct ? '' : 'wrong'; }, 950);
}

// ---------- stats ----------
function computeStats(){
  var answered=0, correct=0, wrong=0, checked=0;
  QUESTIONS.forEach(function(q){
    var a = state.answers[q.id];
    if(a){ answered++; if(a.correct) correct++; else wrong++; }
    if(state.checks[q.id]) checked++;
  });
  return {answered:answered, correct:correct, wrong:wrong, checked:checked, fresh:QUESTIONS.length-answered};
}
function idsWrong(){ return QUESTIONS.filter(function(q){var a=state.answers[q.id]; return a && !a.correct}).map(function(q){return q.id}); }
function idsChecked(){ return QUESTIONS.filter(function(q){return !!state.checks[q.id]}).map(function(q){return q.id}); }
function idsByCheck(color){ return QUESTIONS.filter(function(q){return state.checks[q.id]===color}).map(function(q){return q.id}); }
function idsFresh(){ return QUESTIONS.filter(function(q){return !state.answers[q.id]}).map(function(q){return q.id}); }

function renderDash(){
  var s = computeStats();
  document.getElementById('statAnswered').textContent = s.answered;
  document.getElementById('statTotal').textContent = QUESTIONS.length;
  document.getElementById('statCorrect').textContent = s.correct;
  document.getElementById('statWrong').textContent = s.wrong;
  document.getElementById('statChecked').textContent = s.checked;
  document.getElementById('statFresh').textContent = s.fresh;
  var pct = s.answered ? Math.round(s.correct/s.answered*100) : null;
  document.getElementById('pctText').textContent = pct===null ? '–' : pct+'%';
  var circumference = 2*Math.PI*50;
  var ring = document.getElementById('ringFill');
  ring.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ring.style.strokeDashoffset = (circumference - (pct||0)/100*circumference).toFixed(1);

  document.getElementById('mcAll').textContent = QUESTIONS.length;
  var w = idsWrong().length, c = idsChecked().length, f = idsFresh().length;
  document.getElementById('mcWrong').textContent = w;
  document.getElementById('mcChecked').textContent = c;
  document.getElementById('mcFresh').textContent = f;
  document.getElementById('cardWrong').disabled = w===0;
  document.getElementById('cardChecked').disabled = c===0;
  document.getElementById('cardFresh').disabled = f===0;

  renderFilterCount();
}

function chip(label, active, onclick, extraClass){
  var b = document.createElement('button');
  b.className = 'chip'+(extraClass?' '+extraClass:'')+(active?' active':'');
  b.textContent = label;
  b.addEventListener('click', onclick);
  return b;
}
var CHECK_DEFS = [
  {key:'green', label:'🟢 わかる', cls:'chip-green'},
  {key:'yellow', label:'🟡 あやふや', cls:'chip-yellow'},
  {key:'red', label:'🔴 わからない', cls:'chip-red'}
];
function renderCheckBadge(id){
  var badges = document.getElementById('qBadges');
  var existing = badges.querySelector('[data-check-badge]');
  if(existing) existing.remove();
  var color = state.checks[id];
  if(color){
    var cDef = CHECK_DEFS.filter(function(d){return d.key===color})[0];
    var b = document.createElement('span');
    b.className = 'badge check-'+color;
    b.setAttribute('data-check-badge', '1');
    b.textContent = cDef ? cDef.label : color;
    badges.appendChild(b);
  }
}
function renderChips(){
  var checkWrap = document.getElementById('checkChips'); checkWrap.innerHTML='';
  CHECK_DEFS.forEach(function(cd){
    checkWrap.appendChild(chip(cd.label, filter.checks.has(cd.key), function(){
      if(filter.checks.has(cd.key)) filter.checks.delete(cd.key); else filter.checks.add(cd.key);
      renderChips(); renderFilterCount();
    }, cd.cls));
  });
  var catWrap = document.getElementById('catChips'); catWrap.innerHTML='';
  CATS.forEach(function(c){
    catWrap.appendChild(chip(c, filter.cats.has(c), function(){
      if(filter.cats.has(c)) filter.cats.delete(c); else filter.cats.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var fWrap = document.getElementById('fieldChips'); fWrap.innerHTML='';
  FIELDS.forEach(function(c){
    fWrap.appendChild(chip(c, filter.fields.has(c), function(){
      if(filter.fields.has(c)) filter.fields.delete(c); else filter.fields.add(c);
      renderChips(); renderFilterCount();
    }));
  });
  var yWrap = document.getElementById('yearChips'); yWrap.innerHTML='';
  YEARS.forEach(function(y){
    yWrap.appendChild(chip(y+'年', filter.years.has(y), function(){
      if(filter.years.has(y)) filter.years.delete(y); else filter.years.add(y);
      renderChips(); renderFilterCount();
    }));
  });
}
function filteredIds(baseIds){
  return baseIds.filter(function(id){
    var q = QUESTIONS[id];
    if(filter.cats.size && !filter.cats.has(q.cat)) return false;
    if(filter.fields.size && !filter.fields.has(q.field)) return false;
    if(filter.years.size && !filter.years.has(q.year)) return false;
    if(filter.checks.size && !filter.checks.has(state.checks[id])) return false;
    return true;
  });
}
function hasActiveFilter(){
  return filter.cats.size || filter.fields.size || filter.years.size || filter.checks.size;
}
function renderFilterCount(){
  var all = QUESTIONS.map(function(q){return q.id});
  var n = filteredIds(all).length;
  document.getElementById('filterCount').textContent = hasActiveFilter() ? n+'問が条件に一致' : '';
  document.getElementById('startBtn').disabled = n===0;
}

document.querySelectorAll('.mode-card').forEach(function(btn){
  btn.addEventListener('click', function(){
    if(btn.disabled) return;
    startSession(btn.getAttribute('data-mode'));
  });
});
document.getElementById('startBtn').addEventListener('click', function(){ startSession('filter'); });

function startSession(mode){
  var ids;
  var all = QUESTIONS.map(function(q){return q.id});
  if(mode==='all') ids = all;
  else if(mode==='wrong') ids = idsWrong();
  else if(mode==='checked') ids = idsChecked();
  else if(mode==='fresh') ids = idsFresh();
  else ids = filteredIds(all);
  if(mode!=='filter' && hasActiveFilter()) ids = filteredIds(ids);
  if(!ids.length) return;
  queue = ids;
  qPos = 0;
  answeredInSession = new Set();
  showView('quiz');
  renderQuestion();
}

document.getElementById('resetBtn').addEventListener('click', function(){
  if(confirm('すべての回答履歴（正誤・チェック）を削除します。よろしいですか？')){
    state = {answers:{}, checks:{}};
    saveState();
    renderDash();
  }
});

// ---------- quiz rendering ----------
function q(){ return QUESTIONS[queue[qPos]]; }

function renderQuestion(){
  clearAutoTimer();
  var cur = q();
  answeredThisQ = false;
  pickedLabel = null;

  document.getElementById('quizCounter').textContent = (qPos+1)+' / '+queue.length;
  document.getElementById('quizProgress').style.width = ((qPos)/queue.length*100)+'%';

  var badges = document.getElementById('qBadges');
  badges.innerHTML = '';
  var catB = document.createElement('span');
  catB.className = 'badge '+CAT_CLASS[cur.cat];
  catB.textContent = cur.cat;
  badges.appendChild(catB);
  var metaB = document.createElement('span');
  metaB.className = 'badge meta';
  metaB.textContent = cur.period+' 問'+cur.num;
  badges.appendChild(metaB);
  var fieldB = document.createElement('span');
  fieldB.className = 'badge meta';
  fieldB.textContent = cur.field;
  badges.appendChild(fieldB);
  renderCheckBadge(cur.id);

  document.getElementById('qText').innerHTML = cur.q;

  buildChoices(cur);

  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('nextBtn').textContent = '回答して確認';
  document.getElementById('nextBtn').disabled = true;

  document.querySelectorAll('.check-dot').forEach(function(d){
    d.classList.toggle('active', d.getAttribute('data-check')===state.checks[cur.id]);
  });

  document.getElementById('prevBtn').style.visibility = qPos>0 ? 'visible' : 'hidden';

  // only restore a saved answer if it was answered during THIS session
  // (so "retry wrong" / "retry checked" etc. always start the question fresh)
  var prev = state.answers[cur.id];
  if(prev && answeredInSession.has(cur.id)){
    pickedLabel = prev.picked;
    revealAnswer(cur, false);
  } else if(autoMode){
    startAutoBar(autoSeconds, '⏱ '+autoSeconds+'秒以内に回答（自動モード）', false, function(){
      autoTimeoutAnswer(cur);
    });
  }
}

function autoTimeoutAnswer(cur){
  if(answeredThisQ) return;
  state.answers[cur.id] = {picked: null, correct: false, ts: Date.now(), timeout: true};
  answeredInSession.add(cur.id);
  saveState();
  revealAnswer(cur, true);
}

function buildChoices(cur){
  var wrap = document.getElementById('choicesWrap');
  wrap.innerHTML = '';
  wrap.classList.remove('answered');
  if(cur.shared){
    var block = document.createElement('div');
    block.className = 'shared-block';
    block.innerHTML = cur.shared;
    wrap.appendChild(block);
    var row = document.createElement('div');
    row.className = 'label-row';
    row.id = 'labelRow';
    cur.labels.forEach(function(lab){
      var b = document.createElement('button');
      b.className = 'label-btn';
      b.textContent = lab;
      b.dataset.label = lab;
      b.addEventListener('click', function(){ selectAnswer(cur, lab); });
      row.appendChild(b);
    });
    wrap.appendChild(row);
  } else {
    var list = document.createElement('div');
    list.className = 'choices';
    list.id = 'choiceList';
    cur.choices.forEach(function(c){
      var item = document.createElement('button');
      item.className = 'choice-item';
      item.dataset.label = c.label;
      item.innerHTML = '<span class="clabel">'+c.label+'</span><span class="ctext">'+c.html+'</span>';
      item.addEventListener('click', function(){ selectAnswer(cur, c.label); });
      list.appendChild(item);
    });
    wrap.appendChild(list);
  }
}

function selectAnswer(cur, label){
  if(answeredThisQ) return;
  pickedLabel = label;
  markPicked(label);
  if(autoMode){
    clearAutoTimer();
    commitAnswer();
  } else {
    document.getElementById('nextBtn').disabled = false;
  }
}

function markPicked(label){
  document.querySelectorAll('.choice-item, .label-btn').forEach(function(el){
    el.classList.toggle('picked', el.dataset.label===label);
  });
}

function commitAnswer(){
  var cur = q();
  if(!pickedLabel) return;
  var correct = pickedLabel === cur.correct;
  state.answers[cur.id] = {picked: pickedLabel, correct: correct, ts: Date.now()};
  answeredInSession.add(cur.id);
  saveState();
  revealAnswer(cur, true);
}

function revealAnswer(cur, animate){
  answeredThisQ = true;
  var saved = state.answers[cur.id];
  var picked = saved.picked;
  var correct = saved.correct;

  document.getElementById('choicesWrap').classList.add('answered');
  document.querySelectorAll('.choice-item, .label-btn').forEach(function(el){
    var lab = el.dataset.label;
    el.classList.remove('picked');
    if(lab===cur.correct) el.classList.add('correct-answer');
    if(lab===picked && !correct) el.classList.add('wrong-pick');
  });

  var panel = document.getElementById('resultPanel');
  panel.style.display = 'block';

  var stampIcon = document.getElementById('stampIcon');
  var stampText = document.getElementById('stampText');
  stampIcon.className = 'stamp'+(correct?'':' wrong');
  stampIcon.innerHTML = correct
    ? '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="20"></circle></svg>'
    : '<svg viewBox="0 0 52 52"><path d="M14 14 L38 38 M38 14 L14 38"></path></svg>';
  if(!animate){ stampIcon.querySelectorAll('circle,path').forEach(function(el){ el.style.animation='none'; el.style.strokeDashoffset='0'; }); }
  stampText.className = 'stamp-text '+(correct?'ok':'ng');
  var resultLabel = saved.timeout ? '時間切れ' : (correct ? '正解' : '不正解');
  var resultDetail = saved.timeout
    ? '正解は「'+cur.correct+'」でした（未回答）'
    : '正解は「'+cur.correct+'」・あなたの回答は「'+picked+'」';
  stampText.innerHTML = '<b>'+resultLabel+'</b><div>'+resultDetail+'</div>';

  if(animate){
    flashBigStamp(correct);
    if(correct) playCorrectSound(); else playWrongSound();
  }

  var answerReveal = document.getElementById('answerReveal');
  if(cur.mnemonic){
    answerReveal.style.display = 'flex';
    document.getElementById('arLetter').textContent = cur.correct;
    document.getElementById('arMnemonic').textContent = cur.mnemonic;
  } else {
    answerReveal.style.display = 'none';
  }

  var tipBox = document.getElementById('tipBox');
  if(cur.formula || cur.howto){
    tipBox.style.display = 'block';
    document.getElementById('tipFormula').textContent = cur.formula || '';
    document.getElementById('tipHowto').textContent = cur.howto || '';
  } else {
    tipBox.style.display = 'none';
  }

  document.getElementById('explBody').innerHTML = cur.expl || '（解説準備中）';
  document.getElementById('origLink').href = cur.url;
  document.getElementById('ipaLink').href = cur.ipaUrl;

  var nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  var isLast = (qPos === queue.length-1);
  nextBtn.textContent = isLast ? '結果を見る' : '次の問題 →';

  // auto mode only times the "answer within N seconds" phase; once it's
  // revealed (answered or timed out) the user taps next whenever ready.
  if(animate){
    clearAutoTimer();
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.setTimeout(function(){
      try{ panel.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest'}); }catch(e){}
    }, 30);
  }
}

function advanceNext(){
  clearAutoTimer();
  if(qPos < queue.length-1){ qPos++; renderQuestion(); }
  else { finishSession(); }
}

document.getElementById('nextBtn').addEventListener('click', function(){
  if(!answeredThisQ){ commitAnswer(); return; }
  advanceNext();
});
document.getElementById('prevBtn').addEventListener('click', function(){
  clearAutoTimer();
  if(qPos>0){ qPos--; renderQuestion(); }
});
document.getElementById('checkRow').addEventListener('click', function(e){
  var btn = e.target.closest('.check-dot');
  if(!btn) return;
  var cur = q();
  var color = btn.getAttribute('data-check');
  if(state.checks[cur.id] === color) delete state.checks[cur.id];
  else state.checks[cur.id] = color;
  saveState();
  document.querySelectorAll('.check-dot').forEach(function(d){
    d.classList.toggle('active', d.getAttribute('data-check')===state.checks[cur.id]);
  });
  renderCheckBadge(cur.id);
});
document.getElementById('quizHome').addEventListener('click', function(){ clearAutoTimer(); renderDash(); showView('dash'); });

function finishSession(){
  clearAutoTimer();
  var correctCount = queue.filter(function(id){ var a=state.answers[id]; return a && a.correct; }).length;
  document.getElementById('doneDesc').textContent = queue.length+'問中 '+correctCount+'問正解でした。';
  renderDash();
  showView('done');
}
document.getElementById('doneHomeBtn').addEventListener('click', function(){ showView('dash'); });

// ---------- jump list ----------
document.getElementById('jumpBtn').addEventListener('click', function(){
  clearAutoTimer();
  renderJump();
  showView('jump');
});
document.getElementById('jumpClose').addEventListener('click', function(){ showView('quiz'); });
function renderJump(){
  document.getElementById('jumpSub').textContent = queue.length+'問中 '+(qPos+1)+'問目';
  var grid = document.getElementById('jumpGrid');
  grid.innerHTML = '';
  queue.forEach(function(id, i){
    var qq = QUESTIONS[id];
    var a = state.answers[id];
    var cell = document.createElement('button');
    cell.className = 'jump-cell';
    if(i===qPos) cell.classList.add('current');
    if(a) cell.classList.add(a.correct ? 'correct' : 'wrong');
    if(state.checks[id]) cell.classList.add('check-'+state.checks[id]);
    cell.textContent = i+1;
    cell.title = qq.period+' 問'+qq.num;
    cell.addEventListener('click', function(){ qPos = i; renderQuestion(); showView('quiz'); });
    grid.appendChild(cell);
  });
}

// ---------- init ----------
renderChips();
renderAutoUI();
renderDash();
})();
</script>
