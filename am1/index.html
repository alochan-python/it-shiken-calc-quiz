、差分バックアップを取る。差分バックアップは、差分バックアップ用としてフルバックアップとは別の磁気テープに追記し、1本に1か月分を記録する。</p><p>(3) 常に6か月前の同一日までのデータについて、指定日の状態にファイルを復元できるようにする。ただし、6か月前の月に同一日が存在しない場合は、当該月の末日までのデータについて、指定日の状態にファイルを復元できるようにする(例:本日が10月31日の場合は、4月30日までのデータについて、指定日の状態にファイルを復元できるようにする)。</p>","choices":[{"label":"ア","html":"12"},{"label":"イ","html":"13"},{"label":"ウ","html":"14"},{"label":"エ","html":"15"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>条件(3)より、どの時点でも「6か月前の同一日」まで遡って復元できる必要がある。これは、当月を含めて直近7か月分(当月、1か月前、2か月前、3か月前、4か月前、5か月前、6か月前)のバックアップデータを常に保持し続けなければならないことを意味する。</p><p>各月について、(1)の条件からフルバックアップ用テープが1本、(2)の条件から1か月分の差分をまとめて記録する差分バックアップ用テープが1本必要であり、1か月あたり合計2本の磁気テープを要する。</p><p>したがって、常時保持しておく必要があるテープの本数は、7か月 × 2本/月 = 14本となる。7か月より前(つまり6か月より古い)月のテープは、その月のデータへの復元が不要になった時点で新しいフルバックアップ用として再利用(上書き)できるため、これ以上テープを増やす必要はない。</p><p>よって、バックアップの運用に必要な磁気テープの最少本数は14本であり、正解はウである。</p>","mnemonic":"「なな(7)か月分かかえて、つき(月)ごとにふた(2)本」―7×2=14本、半年前+今月を丸ごと抱えるのがコツ。"},{"id":381,"year":2019,"period":"平成31年度春期","num":22,"cat":"マネジメント系","field":"物理セキュリティ監査","summary":"物理セキュリティ監査：平成31年度春期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>事務所の物理的セキュリティ対策について、JIS Q 27002:2014(情報セキュリティ管理策の実践のための規範)に基づいて情報セキュリティ監査を実施した。判明した状況のうち、監査人が監査報告書に指摘事項として記載すべきものはどれか。</p>","choices":[{"label":"ア","html":"外部からの荷物の受渡しは、サーバ室などの情報処理施設にアクセスすることなく荷物の積降ろしができる場所で行っている。"},{"label":"イ","html":"機密性の高い情報資産が置かれている部屋には、入室許可を得た者が共通の暗証番号を入力して入室している。"},{"label":"ウ","html":"機密性の高い情報資産が置かれる部屋は、社員以外の者の目に触れる場所を避けて設けている。"},{"label":"エ","html":"取引先との打合せは、社員が業務を行っている執務室から分離された場所であって、かつ、機密性の高い情報資産が置かれていない場所で行っている。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>物理的セキュリティ対策における入退室管理の基本原則は、誰がいつ入退室したかを個人単位で特定(識別・認証)できるようにすることである。選択肢イのように、入室許可を得た複数の者が同一の共通暗証番号を使って入室する運用は、暗証番号を知っている者であれば誰でも入室でき、かつ記録上も個人を特定できないため、不正な入室や情報持出しがあった場合に責任の所在を追跡できないという重大な不備がある。したがって監査報告書で指摘すべき事項はイである。</p><p>アは荷物の受渡し場所を情報処理施設へのアクセスが不要な場所に限定しており、外部者が機密エリアに立ち入るリスクを下げる適切な対策である。ウは機密性の高い情報資産を社員以外の目に触れない場所に設置しており、これも適切な配慮といえる。エは取引先との打合せ場所を、社員の執務室や機密情報が置かれた部屋から分離しており、情報漏えいリスクを下げる適切な運用であるため、いずれも指摘事項には該当しない。</p>","mnemonic":""},{"id":382,"year":2019,"period":"平成31年度春期","num":23,"cat":"マネジメント系","field":"プログラムマネジメント","summary":"プログラムマネジメント：平成31年度春期 問23","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>事業目標達成のためのプログラムマネジメントの考え方として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"活動全体を複数のプロジェクトの結合体と捉え、複数のプロジェクトの連携、統合、相互作用を通じて価値を高め、組織全体の戦略の実現を図る。"},{"label":"イ","html":"個々のプロジェクト管理を更に細分化することによって、プロジェクトに必要な技術や確保すべき経営資源の明確化を図る。"},{"label":"ウ","html":"システムの開発に使用するプログラム言語や開発手法を早期に検討することによって、開発リスクを低減し、投資効果の最大化を図る。"},{"label":"エ","html":"リスクを最小化するように支援する専門組織を設けることによって、組織全体のプロジェクトマネジメントの能力と品質の向上を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プログラムマネジメントとは、個々の独立したプロジェクトの管理にとどまらず、相互に関連する複数のプロジェクトの集合体(プログラム)全体を一つの単位として捉え、各プロジェクト間の連携・統合・相互作用を通じて、個々のプロジェクトの成果の単純な合計以上の価値を生み出し、組織全体の事業戦略の実現につなげる管理手法である。選択肢アはこの定義を的確に表しており正解である。</p><p>イは個々のプロジェクト管理をさらに細分化するという内容であり、複数プロジェクトを束ねて戦略実現を図るプログラムマネジメントの視点とは逆方向(個別最適化寄り)の説明になっている。ウは開発言語・手法の早期検討によるリスク低減という、個別の開発プロジェクトにおけるマネジメント手法の話であり、複数プロジェクトの統合という観点を欠く。エはリスク低減を支援する専門組織(PMOに近い機能)の設置についての説明であり、プログラムマネジメントそのものの定義とは異なるため、いずれも正解ではない。</p>","mnemonic":""},{"id":383,"year":2019,"period":"平成31年度春期","num":24,"cat":"ストラテジ系","field":"CRMソリューション","summary":"CRMソリューション：平成31年度春期 問24","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>A社は、ソリューションプロバイダから、顧客に対するワントゥワンマーケティングを実現する統合的なソリューションの提案を受けた。この提案が該当するソリューションとして、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"CRMソリューション"},{"label":"イ","html":"HRMソリューション"},{"label":"ウ","html":"SCMソリューション"},{"label":"エ","html":"財務管理ソリューション"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CRM(Customer Relationship Management:顧客関係管理)ソリューションは、顧客一人ひとりの属性・購買履歴・嗜好などの情報を統合的に管理・分析し、顧客ごとに最適化されたアプローチ(ワントゥワンマーケティング)を行うことで、顧客満足度やロイヤルティ、ひいては収益の向上を図るための仕組みである。設問の「顧客に対するワントゥワンマーケティングを実現する統合的なソリューション」はまさにCRMの典型的な活用目的であり、選択肢アが正解となる。</p><p>イのHRM(Human Resource Management)ソリューションは人材(社員)の採用・育成・評価などを管理する人事領域の仕組みであり、顧客向けのマーケティングとは対象が異なる。ウのSCM(Supply Chain Management)ソリューションは資材調達から生産・物流・販売に至る供給連鎖全体を最適化する仕組みであり、エの財務管理ソリューションは会計・資金管理を対象とする仕組みであって、いずれも顧客個別対応のマーケティングを直接の目的とはしていないため誤りである。</p>","mnemonic":""},{"id":384,"year":2019,"period":"平成31年度春期","num":25,"cat":"テクノロジ系","field":"ユースケース図","summary":"ユースケース図：平成31年度春期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>要件定義において、利用者や外部システムと、業務の機能を分離して表現することによって、利用者を含めた業務全体の範囲を明らかにするために使用される図はどれか。</p>","choices":[{"label":"ア","html":"アクティビティ図"},{"label":"イ","html":"オブジェクト図"},{"label":"ウ","html":"クラス図"},{"label":"エ","html":"ユースケース図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ユースケース図は、UML(統一モデリング言語)の図法の一つで、システム(あるいは業務)の外部にいる利用者や他システムを「アクタ」として、システムが提供する機能を「ユースケース」として、それぞれ別々の図要素で表現し、両者の関係(どのアクタがどの機能を利用するか)や、システムが扱う機能の範囲(システム境界)を可視化するために用いられる。設問の「利用者や外部システムと、業務の機能を分離して表現し、業務全体の範囲を明らかにする」という内容はユースケース図の典型的な用途そのものであり、選択肢エが正解となる。</p><p>アのアクティビティ図は、処理や業務の流れ(一連の動作の順序や分岐)を表現する図であり、アクタと機能を分離して全体範囲を示すことを主目的とした図ではない。ウのクラス図はシステム内部のデータ構造(クラスとその関連・属性・操作)を表現する静的な構造図、イのオブジェクト図はある時点でのオブジェクト間の関係のスナップショットを表す図であり、いずれも利用者・外部システムと機能の分離による業務範囲の明確化を主眼とする図ではないため誤りである。</p>","mnemonic":""},{"id":385,"year":2019,"period":"平成31年度春期","num":26,"cat":"ストラテジ系","field":"コアコンピタンス","summary":"コアコンピタンス：平成31年度春期 問26","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>コアコンピタンスに該当するものはどれか。</p>","choices":[{"label":"ア","html":"主な事業ドメインの高い成長率"},{"label":"イ","html":"競合他社よりも効率性が高い生産システム"},{"label":"ウ","html":"参入を予定している事業分野の競合状況"},{"label":"エ","html":"収益性が高い事業分野での市場シェア"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コアコンピタンスとは、G・ハメルとC・K・プラハラードが提唱した経営概念で、他社には容易に模倣されない、企業の競争優位の源泉となる中核的な能力・強みのことを指す。技術力、生産ノウハウ、独自の生産システムなど、長期にわたり企業独自の価値を生み出し続ける能力がこれに該当する。選択肢イの「競合他社よりも効率性が高い生産システム」は、他社に真似されにくい独自の強みとしてコアコンピタンスの典型例であり正解となる。</p><p>アの「事業ドメインの高い成長率」やエの「収益性が高い事業分野での市場シェア」は、市場環境や結果としての事業成果・ポジションを表す指標であって、企業内部に蓄積された能力そのものではない。ウの「参入を予定している事業分野の競合状況」は外部環境分析の結果であり、自社の中核的な強みを表すものではないため、いずれもコアコンピタンスには該当しない。</p>","mnemonic":""},{"id":386,"year":2019,"period":"平成31年度春期","num":27,"cat":"ストラテジ系","field":"オープンイノベーション","summary":"オープンイノベーション：平成31年度春期 問27","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>オープンイノベーションに関する事例として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"社外からアイディアを募集し、新サービスの開発に活用した。"},{"label":"イ","html":"社内の製造部と企画部で共同プロジェクトを設置し、新規製品を開発した。"},{"label":"ウ","html":"物流システムを変更し、効率的な販売を行えるようにした。"},{"label":"エ","html":"ブランド向上を図るために、自社製品の革新性についてWebに掲載した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>オープンイノベーションとは、企業が自社内部の経営資源だけに頼らず、社外の企業・大学・個人などが持つ技術やアイディア、知見を積極的に取り込み、組み合わせることによって、革新的な製品・サービスの開発や新たな価値創造を実現しようとする考え方である。選択肢アの「社外からアイディアを募集し、新サービスの開発に活用した」は、社外資源を取り込んで革新を生み出すという点でオープンイノベーションの典型的な事例であり正解となる。</p><p>イは社内の部署間での共同プロジェクトであり、組織の外部ではなく内部の連携にとどまっているため、クローズドイノベーション(自社完結型)の範疇に入り該当しない。ウは物流システムの変更による販売効率化、エは自社製品の革新性をWebで広報する活動であり、いずれも社外の知見やアイディアを取り込んでイノベーションを創出するプロセスとは直接関係しないため、オープンイノベーションの事例としては不適切である。</p>","mnemonic":""},{"id":387,"year":2019,"period":"平成31年度春期","num":28,"cat":"ストラテジ系","field":"デジタルツイン","summary":"デジタルツイン：平成31年度春期 問28","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>IoT活用におけるディジタルツインの説明はどれか。</p>","choices":[{"label":"ア","html":"インターネットを介して遠隔地に設置した3Dプリンタへ設計データを送り、短時間に複製物を製作すること"},{"label":"イ","html":"システムを正副の二重に用意し、災害や故障時にシステムの稼働の継続を保証すること"},{"label":"ウ","html":"自宅の家電機器とインターネットでつながり、稼働監視や操作を遠隔で行うことができるウェアラブルデバイスのこと"},{"label":"エ","html":"ディジタル空間に現実世界と同等な世界を、様々なセンサで収集したデータを用いて構築し、現実世界では実施できないようなシミュレーションを行うこと"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ディジタルツイン(デジタルツイン)とは、IoTデバイスやセンサによって現実世界(設備、工場、都市など)から収集したデータを用いて、デジタル空間上に現実とほぼ同等な「双子(ツイン)」となる仮想モデルをリアルタイムに再現する技術である。現実のデータに基づいて構築された仮想モデル上で、現実世界では試行が困難・危険・コストが高いようなシミュレーションや予測、最適化を行い、その結果を現実側にフィードバックすることができる。選択肢エはこの内容を正しく表しており正解である。</p><p>アは遠隔地の3Dプリンタへの設計データ送信による複製物製作の説明であり、仮想モデルの構築とは無関係。イはシステムの冗長化(正副二重化)によって稼働継続性を保証するフォールトトレラントの考え方の説明であり、ディジタルツインとは別の概念である。ウは家電とインターネットをつなぐウェアラブルデバイスの説明であり、現実世界をまるごとデジタル空間に再現するディジタルツインの本質(仮想モデルによるシミュレーション)とは異なるため、いずれも誤りである。</p>","mnemonic":""},{"id":388,"year":2019,"period":"平成31年度春期","num":29,"cat":"マネジメント系","field":"パレート図","summary":"パレート図：平成31年度春期 問29","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>発生した故障について、発生要因ごとの件数の記録を基に、故障発生件数で上位を占める主な要因を明確に表現するのに適している図法はどれか。</p>","choices":[{"label":"ア","html":"特性要因図"},{"label":"イ","html":"パレート図"},{"label":"ウ","html":"マトリックス図"},{"label":"エ","html":"連関図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>パレート図は、QC七つ道具の一つで、発生した事象(ここでは故障)を要因別に分類し、その発生件数の多い順に棒グラフとして並べ、あわせて累積比率を折れ線グラフで重ねて表示する図法である。件数の多い要因から順に並べることで、全体の大部分(経験的に8割前後)を占める少数の主要因、いわゆる「ごく一部の要因が大半の結果を生み出す」というパレートの法則(80対20の法則)を視覚的に把握でき、優先的に対策すべき要因を明確にできる。設問の「故障発生件数で上位を占める主な要因を明確に表現する」目的に最も適しており、選択肢イが正解である。</p><p>アの特性要因図(フィッシュボーン図)は、ある結果(特性)に対してどのような要因が関係しているかを魚の骨のような形で体系的に整理するための図であり、件数による順位付けを目的とした図ではない。ウのマトリックス図は複数の要素間の対応関係を行列形式で整理する図、エの連関図は複雑に絡み合った要因間の因果関係を矢印でつないで整理する図であり、いずれも「発生件数の多寡によって主要因を明確化する」ことには向いていないため誤りである。</p>","mnemonic":""},{"id":389,"year":2019,"period":"平成31年度春期","num":30,"cat":"ストラテジ系","field":"要配慮個人情報","summary":"要配慮個人情報：平成31年度春期 問30","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000ddiw-att/2019h31h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2019h31.html","q":"<p>個人情報のうち、個人情報保護法における要配慮個人情報に該当するものはどれか。</p>","choices":[{"label":"ア","html":"個人情報の取得時に、本人が取扱いの配慮を申告することによって設定される情報"},{"label":"イ","html":"個人に割り当てられた、運転免許証、クレジットカードなどの番号"},{"label":"ウ","html":"生存する個人に関する、個人を特定するために用いられる勤務先や住所などの情報"},{"label":"エ","html":"本人の病歴、犯罪の経歴など不当な差別や不利益を生じさせるおそれのある情報"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>個人情報保護法における「要配慮個人情報」とは、本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱いに特に配慮を要する個人情報として法令で定められたものを指す。選択肢エの「本人の病歴、犯罪の経歴など不当な差別や不利益を生じさせるおそれのある情報」はこの定義そのものであり正解である。要配慮個人情報は、通常の個人情報よりも取得時に原則として本人の同意が必要となるなど、取扱いに厳格な規律が課される。</p><p>アは本人が自ら申告した配慮希望に基づく情報であり、法が定める要配慮個人情報(病歴・犯罪歴など特定のセンシティブな属性情報)の定義とは異なる任意の設定情報である。イの運転免許証番号やクレジットカード番号は、個人を識別するための番号である「個人識別符号」等に関連しうるが、要配慮個人情報(差別・不利益につながる機微な属性情報)には該当しない。ウの勤務先や住所などの通常の個人を特定する情報は、一般的な個人情報ではあるが、特別な配慮を要するセンシティブ情報には当たらないため、いずれも誤りである。</p>","mnemonic":""},{"id":390,"year":2018,"period":"平成30年度秋期","num":1,"cat":"テクノロジ系","field":"論理演算","summary":"論理演算：平成30年度秋期 問1","correct":"ア","result":"","formula":"NOT(A⊕B) = A≡B（等価演算）","howto":"A,B=00,01,10,11の4通りでXORの出力(0,1,1,0)を書き出し、全ビットを反転させた(1,0,0,1)がどの演算の真理値表と一致するかを照合する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>任意のオペランドに対するブール演算Aの結果とブール演算Bの結果が互いに否定の関係にあるとき，AはBの（又は，BはAの）相補演算であるという。排他的論理和の相補演算はどれか。</p>","choices":[{"label":"ア","html":"等価演算（両方の入力値が一致したときだけ1になる、ベン図では両方真または両方偽の領域が塗られる）"},{"label":"イ","html":"否定論理和（NOR、両方とも0のときだけ1になる）"},{"label":"ウ","html":"論理積（AND、両方とも1のときだけ1になる）"},{"label":"エ","html":"論理和（OR、少なくとも一方が1なら1になる）"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>排他的論理和（XOR）の真理値表は，入力(A,B)=(0,0),(0,1),(1,0),(1,1)に対して出力が0,1,1,0となる。相補演算とは，すべての入力に対して出力が互いに否定（反転）の関係になる演算同士を指すので，XORの出力をすべて反転すると1,0,0,1となる。この1,0,0,1という真理値表は，入力が一致したとき（両方0または両方1のとき）に1になる演算，すなわち等価演算（XNOR，論理一致）の真理値表そのものである。したがって正解はアとなる。イの否定論理和（NOR）は0,0,0,1，ウの論理積（AND）は0,0,0,1，エの論理和（OR）は0,1,1,1であり，いずれもXORの反転(1,0,0,1)とは一致しない。</p>","mnemonic":"「排他をひっくり返すと一致になる」―XORの0110を裏返すと1001、これは入力が一致したときだけ1になる等価演算の表そのもの。"},{"id":391,"year":2018,"period":"平成30年度秋期","num":2,"cat":"テクノロジ系","field":"待ち行列理論","summary":"待ち行列理論：平成30年度秋期 問2","correct":"イ","result":"","formula":"平均待ち時間 Wq = T・ρ/(1-ρ)","howto":"Wq≧T を T・ρ/(1-ρ)≧T に置き換え，両辺をTで割った ρ/(1-ρ)≧1 を解いて利用率ρの下限を求める。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>コンピュータによる伝票処理システムがある。このシステムは，伝票データをためる待ち行列をもち，M/M/1の待ち行列モデルが適用できるものとする。平均待ち時間がT秒以上となるのは，システムの利用率が少なくとも何％以上となったときか。ここで，伝票データをためる待ち行列の特徴は次のとおりである。</p><ul><li>伝票データは，ポアソン分布に従って到着する。</li><li>伝票データをためる数に制限はない。</li><li>1件の伝票データの処理時間は，平均T秒の指数分布に従う。</li></ul>","choices":[{"label":"ア","html":"33"},{"label":"イ","html":"50"},{"label":"ウ","html":"67"},{"label":"エ","html":"80"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>M/M/1モデルでは，1件あたりの平均処理（サービス）時間が1/μ=Tのとき，待ち行列で待たされる平均時間（平均待ち時間）はWq=ρ/{μ(1-ρ)}=T・ρ/(1-ρ)で表される。設問はWq≧Tとなる条件を問うているので，T・ρ/(1-ρ)≧T，すなわちρ/(1-ρ)≧1を解く。これを変形するとρ≧1-ρ，2ρ≧1，ρ≧0.5となり，利用率が50％以上のときに平均待ち時間がサービス時間T以上になる。したがって正解はイの50である。</p>","mnemonic":"「待ち行列は五分五分でひっくり返る」―ρ÷(1－ρ)は利用率50%ちょうどで1を超え、待ち時間がサービス時間Tを追い抜く。"},{"id":392,"year":2018,"period":"平成30年度秋期","num":3,"cat":"テクノロジ系","field":"正規分布","summary":"正規分布：平成30年度秋期 問3","correct":"イ","result":"","formula":"標準化変量 z = (90－平均点)／標準偏差","howto":"各教科について90点を標準化したzを求め，zが最小（＝平均から90点までの距離が標準偏差の何倍か最も小さい）教科を選ぶ。zが小さいほど90点以上の割合（1-Φ(z)）が大きくなる。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>受験者1,000人の4教科のテスト結果は表のとおりであり，いずれの教科の得点分布も正規分布に従っていたとする。90点以上の得点者が最も多かったと推定できる教科はどれか。</p><table border='1' cellspacing='0' cellpadding='4'><tr><th>教科</th><th>平均点</th><th>標準偏差</th></tr><tr><td>A</td><td>45</td><td>18</td></tr><tr><td>B</td><td>60</td><td>15</td></tr><tr><td>C</td><td>70</td><td>8</td></tr><tr><td>D</td><td>75</td><td>5</td></tr></table>","choices":[{"label":"ア","html":"A"},{"label":"イ","html":"B"},{"label":"ウ","html":"C"},{"label":"エ","html":"D"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正規分布では，平均から同じ標準偏差の倍数だけ離れた点より上側の割合は，標準偏差の倍数（zスコア）が小さいほど大きくなる。各教科のz=(90－平均点)／標準偏差を計算すると，A: (90-45)/18=2.5，B: (90-60)/15=2.0，C: (90-70)/8=2.5，D: (90-75)/5=3.0となる。zが最も小さいのはBの2.0であり，標準正規分布表ではzが小さいほど上側確率（90点以上の割合）は大きくなるため，Bが90点以上の得点者数が最も多いと推定できる。したがって正解はイである。</p>","mnemonic":"「90点まであと2シグマ」―B教科はz=(90-60)/15=2.0で4教科中最小、だから上位がいちばん厚いと読める。"},{"id":393,"year":2018,"period":"平成30年度秋期","num":4,"cat":"テクノロジ系","field":"組合せ計算","summary":"組合せ計算：平成30年度秋期 問4","correct":"イ","result":"","formula":"i>jの要素数 = 100C2 = 100×99／2","howto":"0～99の100個の値から異なる2つを選んでi,jに割り当て，大きい方をi，小さい方をjにすれば必ずi>jになるので，組合せ数100C2を計算する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>2次元配列A[i,j]（i,jはいずれも0～99の値をとる）のi＞jである要素A[i,j]は全部で幾つか。</p>","choices":[{"label":"ア","html":"4,851"},{"label":"イ","html":"4,950"},{"label":"ウ","html":"4,999"},{"label":"エ","html":"5,050"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>i,jはそれぞれ0～99の100通りの値をとるので，全要素数は100×100=10,000個である。このうちi=jとなる対角要素は100個，残りの9,900個はi>jとi<jのどちらかにちょうど半分ずつ分かれる（対称性があるため）。したがってi>jとなる要素数は9,900÷2=4,950個となる。別解として，100個の数から異なる2つを選ぶ組合せ100C2=100×99／2=4,950を使っても同じ結果が得られる。正解はイである。</p>","mnemonic":"「100人総当たり戦は4950試合」―100×99÷2=4,950、i>jのマス目もちょうど同じ総当たり数になる。"},{"id":394,"year":2018,"period":"平成30年度秋期","num":5,"cat":"テクノロジ系","field":"誤り制御方式","summary":"誤り制御方式：平成30年度秋期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>メモリの誤り制御方式で，2ビットの誤り検出機能と，1ビットの誤り訂正機能をもたせるのに用いられるものはどれか。</p>","choices":[{"label":"ア","html":"奇数パリティ"},{"label":"イ","html":"水平パリティ"},{"label":"ウ","html":"チェックサム"},{"label":"エ","html":"ハミング符号"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ハミング符号は，データビットに複数の検査（パリティ）ビットを所定の規則で付加することで，1ビットの誤りを自動的に検出して訂正し，さらに全体に1ビットの検査ビットを追加した拡張ハミング符号（SEC-DED）の形にすることで2ビットの誤りまで検出できるようにした符号方式であり，主記憶（メモリ）のECC（Error Correcting Code）として広く使われている。これに対し，アの奇数パリティやイの水平パリティは，1ビットの誤りを検出することはできるが，どのビットが誤っているかを特定して訂正することはできない。ウのチェックサムもデータの誤りを検出する目的で使われるが，誤り箇所を特定して訂正する機能はない。したがって，誤り検出と訂正の両方を兼ね備えるのはエのハミング符号である。</p>","mnemonic":""},{"id":395,"year":2018,"period":"平成30年度秋期","num":6,"cat":"テクノロジ系","field":"仮想記憶（ページング）","summary":"仮想記憶（ページング）：平成30年度秋期 問6","correct":"エ","result":"","formula":"平均処理時間 = p×20 ＋ (1－p)×60","howto":"ページアウトを伴わない割合をpとして加重平均の方程式 20p+60(1-p)=30 を立てて解く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ページング方式の仮想記憶において，あるプログラムを実行したとき，1回のページフォールトの平均処理時間は30ミリ秒であった。ページフォールト発生時の処理時間が次の条件であったとすると，ページアウトを伴わないページインだけの処理の割合は幾らか。</p><p>〔ページフォールト発生時の処理時間〕</p><ol><li>ページアウトを伴わない場合，ページインの処理時間は20ミリ秒である。</li><li>ページアウトを伴う場合，置換えページの選択，ページアウト，ページインの合計処理時間は60ミリ秒である。</li></ol>","choices":[{"label":"ア","html":"0.25"},{"label":"イ","html":"0.33"},{"label":"ウ","html":"0.67"},{"label":"エ","html":"0.75"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ページアウトを伴わない処理の割合をpとすると，ページアウトを伴う処理の割合は(1-p)となる。全体の平均処理時間は，それぞれの処理時間を割合で加重平均したものなので，20p＋60(1-p)=30という方程式が立つ。これを展開すると20p＋60-60p=30，-40p=-30，p=0.75となる。したがって，ページアウトを伴わないページインだけの処理の割合は0.75であり，正解はエである。</p>","mnemonic":"「4回に3回はラクな処理」―20pと60(1-p)の平均が30msになるのはp=0.75のとき、荒れる処理は4回に1回だけ。"},{"id":396,"year":2018,"period":"平成30年度秋期","num":7,"cat":"テクノロジ系","field":"論理回路（半加算器）","summary":"論理回路（半加算器）：平成30年度秋期 問7","correct":"ア","result":"","formula":"半加算器：桁上がりX=A・B（AND），和Y=A⊕B（XOR）","howto":"A,B=00,01,10,11それぞれについて2進加算した結果（00,01,01,10）を書き出し，上位桁（桁上がりX）と下位桁（和Y）が，それぞれAND・XORの真理値表と一致することを確認する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>1桁の2進数A，Bを加算し，Xに桁上がり，Yに桁上げなしの和（和の1桁目）が得られる論理回路はどれか。選択肢は，それぞれ入力A,Bから2本の出力X,Yへ向かう2個の論理ゲートの組合せ回路として示されている。</p><ul><li>ア：A,Bを論理積（AND）ゲートに入力してXを出力し，同じA,Bを排他的論理和（XOR，二重曲線の入力をもつ記号）ゲートに入力してYを出力する。</li><li>イ：A,Bを論理和（OR）ゲートに入力してXを出力し，同じA,Bを排他的論理和（XOR）ゲートに入力してYを出力する。</li><li>ウ：A,Bを論理和（OR）ゲートに入力してXを出力し，同じA,Bを論理積（AND）ゲートに入力してYを出力する。</li><li>エ：A,Bを論理積（AND）ゲートに入力してXを出力し，同じA,Bを論理和（OR）ゲートに入力してYを出力する。</li></ul>","choices":[{"label":"ア","html":"X=A・B（AND），Y=A⊕B（XOR）"},{"label":"イ","html":"X=A＋B（OR），Y=A⊕B（XOR）"},{"label":"ウ","html":"X=A＋B（OR），Y=A・B（AND）"},{"label":"エ","html":"X=A・B（AND），Y=A＋B（OR）"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>1桁の2進数A，Bを加算すると，結果は00（0+0=00），01（0+1=01），01（1+0=01），10（1+1=10）の4通りになる。桁上がりXは，A,B共に1のとき（1+1=10）だけ1になるので，これは論理積（AND）の真理値表0,0,0,1と一致する。一方，桁上げなしの和Yは，AとBのどちらか一方だけが1のときに1になり，両方とも0または両方とも1のときは0になるので，これは排他的論理和（XOR）の真理値表0,1,1,0と一致する。この組合せ（AND→X，XOR→Y）をもつのはアであり，これが半加算器（ハーフアダー）の標準的な構成である。イ・ウはXにORを使っており，A=1,B=1のときX=1となってしまい桁上がりの判定を誤る点で不適切，エはYにORを使っており和の判定を誤る。</p>","mnemonic":"「半分だけ足せるから半加算器」―両方1でANDが繰り上がりX、片方だけ1でXORが和Yになる組が正解。"},{"id":397,"year":2018,"period":"平成30年度秋期","num":8,"cat":"テクノロジ系","field":"VR（仮想現実）","summary":"VR（仮想現実）：平成30年度秋期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>バーチャルリアリティにおけるモデリングに関する記述のうち，レンダリングの説明はどれか。</p>","choices":[{"label":"ア","html":"ウェアラブルカメラ，慣性センサなどを用いて非言語情報を認識する処理"},{"label":"イ","html":"仮想世界の情報をディスプレイに描画可能な形式の画像に変換する処理"},{"label":"ウ","html":"視覚的に現実世界と仮想世界を融合させるために，それぞれの世界の中に定義された3次元座標を一致させる処理"},{"label":"エ","html":"時間経過とともに生じる物の移動などの変化について，モデル化したものを物理法則などに当てはめて変化させる処理"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>レンダリングとは，コンピュータ内部に保持している仮想世界の3次元モデルなどの情報を基に，視点や光源などの条件を計算して，ディスプレイに表示できる2次元の画像（映像）データへ変換する処理のことであり，イの説明が該当する。アはモーションキャプチャやセンシングに関する説明でトラッキングに近い処理，ウは現実世界と仮想世界の座標系を合わせるレジストレーション（位置合わせ）の説明，エは物理シミュレーションによるアニメーション処理の説明であり，いずれもレンダリングそのものではない。バーチャルリアリティのモデリングは，対象物の形状や性質を3次元データとして作成する工程を指し，レンダリングはそのモデルを最終的に画面表示用の画像に描き出す工程という位置付けになる。</p>","mnemonic":""},{"id":398,"year":2018,"period":"平成30年度秋期","num":9,"cat":"テクノロジ系","field":"ハッシュ関数","summary":"ハッシュ関数：平成30年度秋期 問9","correct":"ウ","result":"","formula":"除数d は (1168-571)，(1566-1168)，(1566-571) の最大公約数","howto":"3つのキー値の差を求め，それぞれを素因数分解して共通する最大の約数を求める。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>自然数を除数とした剰余を返すハッシュ関数がある。値がそれぞれ571，1168，1566である三つのレコードのキー値を入力値としてこのハッシュ関数を施したところ，全てのハッシュ値が衝突した。このとき使用した除数は幾つか。</p>","choices":[{"label":"ア","html":"193"},{"label":"イ","html":"197"},{"label":"ウ","html":"199"},{"label":"エ","html":"211"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>3つのキー値を同じ除数dで割った余りがすべて等しい（衝突する）ということは，キー値どうしの差がdの倍数になっているということである。差を計算すると，1168-571=597，1566-1168=398，1566-571=995となる。これらを素因数分解すると，597=3×199，398=2×199，995=5×199となり，いずれも199を共通因数として持つ。したがって，3つの差すべての最大公約数は199であり，使用された除数は199，正解はウである。</p>","mnemonic":"「いくいく(199)で全部そろって衝突」―597=3×199、398=2×199、995=5×199、共通の約数199が犯人。"},{"id":399,"year":2018,"period":"平成30年度秋期","num":10,"cat":"テクノロジ系","field":"排他制御（ロック）","summary":"排他制御（ロック）：平成30年度秋期 問10","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>データベースシステムにおいて，二つのプログラムが同一データへのアクセス要求を行うとき，後続プログラムのアクセス要求に対する並行実行の可否の組合せのうち，適切なものはどれか。ここで，表中の○は二つのプログラムが並行して実行されることを表し，×は先行プログラムの実行終了まで後続プログラムは待たされることを表す。</p><p>ア：後続が共用のとき（先行共用=○，先行排他=○），後続が排他のとき（先行共用=○，先行排他=×）</p><p>イ：後続が共用のとき（先行共用=○，先行排他=×），後続が排他のとき（先行共用=○，先行排他=×）</p><p>ウ：後続が共用のとき（先行共用=○，先行排他=○），後続が排他のとき（先行共用=×，先行排他=×）</p><p>エ：後続が共用のとき（先行共用=○，先行排他=×），後続が排他のとき（先行共用=×，先行排他=×）</p>","choices":[{"label":"ア","html":"共用/共用=○，共用/排他=○，排他/共用=○，排他/排他=×"},{"label":"イ","html":"共用/共用=○，共用/排他=×，排他/共用=○，排他/排他=×"},{"label":"ウ","html":"共用/共用=○，共用/排他=○，排他/共用=×，排他/排他=×"},{"label":"エ","html":"共用/共用=○，共用/排他=×，排他/共用=×，排他/排他=×"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>共用（共有）ロックは読み取りなど他と両立できる処理に使うロックで，排他ロックは更新などほかの処理と両立できないロックである。先行プログラムが共用ロックを保持しているとき，後続プログラムも共用ロックであれば両者は両立できるので並行実行可（○）だが，後続プログラムが排他ロックであれば先行の共用ロックと競合するため待たされる（×）。また，先行プログラムが排他ロックを保持しているときは，後続プログラムが共用・排他のいずれであっても必ず競合するため，常に待たされる（×）。これをまとめると，共用×共用だけが○で，それ以外（共用×排他，排他×共用，排他×排他）はすべて×となる組合せが正しく，これに一致するのはエである。アやウは排他ロックが保持されているにもかかわらず後続の共用アクセスを許可してしまっており，データの一貫性が保てないため誤りである。</p>","mnemonic":""},{"id":400,"year":2018,"period":"平成30年度秋期","num":11,"cat":"テクノロジ系","field":"LAN（データリンク層装置）","summary":"LAN（データリンク層装置）：平成30年度秋期 問11","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>CSMA/CD方式のLANで使用されるスイッチングハブ（レイヤ2スイッチ）は，フレームの蓄積機能，速度変換機能や交換機能をもっている。このようなスイッチングハブと同等の機能をもち，同じプロトコル階層で動作する装置はどれか。</p>","choices":[{"label":"ア","html":"ゲートウェイ"},{"label":"イ","html":"ブリッジ"},{"label":"ウ","html":"リピータ"},{"label":"エ","html":"ルータ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スイッチングハブ（レイヤ2スイッチ）は，MACアドレスを基にフレームの蓄積・交換・速度変換を行う装置であり，OSI参照モデルのデータリンク層（レイヤ2）で動作する。これと同じデータリンク層で動作し，MACアドレスを参照してフレームを中継する装置がブリッジであり，スイッチングハブはブリッジの機能をポート単位に多ポート化・高機能化したものと位置付けられる。したがって正解はイである。アのゲートウェイはプロトコル変換を行いトランスポート層より上位で動作し，ウのリピータは信号を増幅するだけで物理層（レイヤ1）で動作し，エのルータはIPアドレスを基に中継を行うネットワーク層（レイヤ3）で動作するため，いずれも同じ階層・同等機能とはいえない。</p>","mnemonic":""},{"id":401,"year":2018,"period":"平成30年度秋期","num":12,"cat":"テクノロジ系","field":"TLS（PKI）","summary":"TLS（PKI）：平成30年度秋期 問12","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>インターネットに接続された利用者のPCから，DMZ上の公開Webサイトにアクセスし，利用者の個人情報を入力すると，その個人情報が内部ネットワークのデータベース（DB）サーバに蓄積されるシステムがある。このシステムにおいて，利用者個人のディジタル証明書を用いたTLS通信を行うことによって期待できるセキュリティ上の効果はどれか。</p>","choices":[{"label":"ア","html":"PCとDBサーバ間の通信データを暗号化するとともに，正当なDBサーバであるかを検証することができるようになる。"},{"label":"イ","html":"PCとDBサーバ間の通信データを暗号化するとともに，利用者を認証することができるようになる。"},{"label":"ウ","html":"PCとWebサーバ間の通信データを暗号化するとともに，正当なDBサーバであるかを検証することができるようになる。"},{"label":"エ","html":"PCとWebサーバ間の通信データを暗号化するとともに，利用者を認証することができるようになる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TLS通信はPC（クライアント）と，直接通信する相手であるWebサーバとの間で確立されるものであり，内部ネットワークにあるDBサーバとPCが直接TLS通信を行うわけではない。そのため，通信経路として暗号化されるのはPCとWebサーバ間である。また，利用者個人のディジタル証明書を用いるクライアント認証（TLSクライアント認証）を行うと，サーバ側は証明書の検証によって接続してきた利用者本人を認証できるようになる。したがって，期待できる効果は「PCとWebサーバ間の通信データを暗号化するとともに，利用者を認証できるようになる」であり，正解はエである。ア・イはDBサーバとの通信を暗号化するとしている点で誤り，ウは暗号化区間は正しいがDBサーバの正当性検証としている点で誤りである。</p>","mnemonic":""},{"id":402,"year":2018,"period":"平成30年度秋期","num":13,"cat":"テクノロジ系","field":"Webセキュリティ（XSS対策）","summary":"Webセキュリティ（XSS対策）：平成30年度秋期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>クロスサイトスクリプティング対策に該当するものはどれか。</p>","choices":[{"label":"ア","html":"Webサーバで SNMP エージェントを常時稼働させることによって，攻撃を検知する。"},{"label":"イ","html":"WebサーバのOSにセキュリティパッチを適用する。"},{"label":"ウ","html":"Webページに入力されたデータの出力データが，HTMLタグとして解釈されないように処理する。"},{"label":"エ","html":"許容量を超えた大きさのデータをWebページに入力することを禁止する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クロスサイトスクリプティング（XSS）は，利用者が入力したデータをWebページがそのまま出力する際に，悪意のあるスクリプトタグなどがHTMLタグとして解釈・実行されてしまうことで発生する脆弱性である。対策としては，入力データを画面に出力する際に「&lt;」「&gt;」などの特殊文字をエスケープ処理（サニタイジング）し，HTMLタグとして解釈されないようにすることが基本であり，これに該当するのはウである。アはSNMPによる監視でXSS対策ではなく不正侵入検知に近い話，イはOSの脆弱性対策でXSS固有の対策ではない，エはバッファオーバーフローなど別の攻撃対策として有効だがXSS対策には直結しない。</p>","mnemonic":""},{"id":403,"year":2018,"period":"平成30年度秋期","num":14,"cat":"テクノロジ系","field":"サイバー攻撃手法","summary":"サイバー攻撃手法：平成30年度秋期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ブルートフォース攻撃に該当するものはどれか。</p>","choices":[{"label":"ア","html":"Webブラウザと Web サーバの間の通信で，認証が成功してセッションが開始されているときに，Cookieなどのセッション情報を盗む。"},{"label":"イ","html":"コンピュータへのキー入力を全て記録して外部に送信する。"},{"label":"ウ","html":"使用可能な文字のあらゆる組合せをそれぞれパスワードとして，繰り返しログインを試みる。"},{"label":"エ","html":"正当な利用者のログインシーケンスを盗聴者が記録してサーバに送信する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ブルートフォース攻撃（総当たり攻撃）とは，考えられる文字の組合せを機械的にすべて試すことでパスワードやPINなどを解読しようとする攻撃手法であり，これに該当するのはウである。アはセッションハイジャックの説明，イはキーロガーによる情報窃取の説明，エはリプレイ攻撃（記録した正規の通信を再送する攻撃）の説明であり，いずれも総当たりでパスワードを試す攻撃とは異なる手口である。</p>","mnemonic":""},{"id":404,"year":2018,"period":"平成30年度秋期","num":15,"cat":"テクノロジ系","field":"脆弱性検査（ファジング）","summary":"脆弱性検査（ファジング）：平成30年度秋期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>脆弱性検査手法の一つであるファジングはどれか。</p>","choices":[{"label":"ア","html":"既知の脆弱性に対するシステムの対応状況に注目し，システムに導入されているソフトウェアのバージョン及びパッチの適用状況の検査を行う。"},{"label":"イ","html":"ソフトウェアのデータの入出力に注目し，問題を引き起こしそうなデータを大量に多様なパターンで入力して挙動を観察し，脆弱性を見つける。"},{"label":"ウ","html":"ベンダや情報セキュリティ関連機関が提供するセキュリティアドバイザリなどの最新のセキュリティ情報に注目し，ソフトウェアの脆弱性の検査を行う。"},{"label":"エ","html":"ホワイトボックス検査の一つであり，ソフトウェアの内部構造に注目し，ソースコードの構文をチェックすることによって脆弱性を見つける。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファジング（fuzzing）とは，検査対象のソフトウェアに対して，想定外の値や不正な形式のデータ（ファズ）を大量かつ多様なパターンで入力し，その際の挙動（異常終了やクラッシュなど）を観察することで，未知の脆弱性を発見しようとするブラックボックス的な検査手法であり，これに該当するのはイである。アはパッチ管理状況の確認，ウはセキュリティアドバイザリの監視，エはソースコードを静的に解析するホワイトボックス検査（静的解析）の説明であり，いずれも実際にデータを入力して動的に挙動を観察するファジングとは異なる。</p>","mnemonic":""},{"id":405,"year":2018,"period":"平成30年度秋期","num":16,"cat":"テクノロジ系","field":"信頼性設計","summary":"信頼性設計：平成30年度秋期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>安全性と信頼性について，次の方針でプログラム設計を行う場合，その方針を表す用語はどれか。</p><p>〔方針〕不特定多数の人が使用するプログラムには，自分だけが使用するプログラムに比べて，より多く，データチェックの機能を組み込む。プログラムが処理できるデータの前提条件を文書に書いておくだけでなく，プログラムについても前提条件を満たしていないデータが入力されたときは，エラーメッセージを表示して再入力を促すようなものとする。</p>","choices":[{"label":"ア","html":"フールプルーフ"},{"label":"イ","html":"フェールセーフ"},{"label":"ウ","html":"フェールソフト"},{"label":"エ","html":"フォールトトレランス"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>フールプルーフとは，利用者が誤った操作や不適切なデータ入力を行っても，システムに重大な障害が発生しないように，あらかじめ誤りを防止・検知する仕組みを組み込む設計思想であり，不特定多数の利用者を想定して入力データのチェック機能を強化し，前提条件を満たさないデータにはエラーメッセージで再入力を促すという設問の方針はこれに該当する。正解はアである。イのフェールセーフは故障や異常発生時に安全側に動作させる設計，ウのフェールソフトは故障時にシステムを縮退させてでも運転を継続させる設計，エのフォールトトレランスは機器を多重化するなどして故障そのものの影響を許容し動作を継続させる設計であり，いずれも「誤操作や不正データの入力そのものを防ぐ」という設問の方針とは観点が異なる。</p>","mnemonic":""},{"id":406,"year":2018,"period":"平成30年度秋期","num":17,"cat":"テクノロジ系","field":"アジャイル開発","summary":"アジャイル開発：平成30年度秋期 問17","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>アジャイル開発で“イテレーション”を行う目的のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"ソフトウェアに存在する顧客の要求との不一致を短いサイクルで解消したり，要求の変化に柔軟に対応したりする。"},{"label":"イ","html":"タスクの実施状況を可視化して，いつでも確認できるようにする。"},{"label":"ウ","html":"ペアプログラミングのドライバとナビゲータを固定化させない。"},{"label":"エ","html":"毎日決めた時刻にチームメンバが集まって開発の状況を共有し，問題が拡大したり，状況が悪化したりするのを避ける。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>イテレーション（反復）は，アジャイル開発において計画・設計・実装・テストという一連の工程を短い期間（1～数週間程度）で繰り返し実施する単位であり，各イテレーションの終わりに動くソフトウェアを顧客に見せてフィードバックを得ることで，要求との不一致を早期に解消し，仕様変更などにも柔軟に対応できるようにすることを目的とする。したがって正解はアである。イはタスクボードなどの可視化ツールの目的，ウはペアプログラミングにおけるローテーションの話，エはデイリースクラム（朝会）の目的であり，いずれもイテレーションそのものの目的とは異なるアジャイルのプラクティスの説明である。</p>","mnemonic":""},{"id":407,"year":2018,"period":"平成30年度秋期","num":18,"cat":"マネジメント系","field":"進捗管理図表","summary":"進捗管理図表：平成30年度秋期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>システム開発の進捗管理などに用いられるトレンドチャートの説明はどれか。</p>","choices":[{"label":"ア","html":"作業に関与する人と責任をマトリックスで示したもの"},{"label":"イ","html":"作業日程の計画と実績を対比できるように帯状に示したもの"},{"label":"ウ","html":"作業の進捗状況と予算の消費状況を関連付けて折れ線で示したもの"},{"label":"エ","html":"作業の順序や相互関係をネットワーク図で示したもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>トレンドチャートは，プロジェクトの進捗状況（出来高）と予算の消費状況（コスト）の推移を時系列の折れ線グラフとして関連付けて示し，計画線と実績線を比較することで進捗の遅れやコスト超過の傾向を把握するための図表であり，ウが該当する。アは責任分担表（RAM／RACIチャートなど），イはガントチャート，エはアローダイアグラム（PERT図）の説明であり，いずれもトレンドチャートとは異なる管理図表である。</p>","mnemonic":""},{"id":408,"year":2018,"period":"平成30年度秋期","num":19,"cat":"マネジメント系","field":"ファンクションポイント法","summary":"ファンクションポイント法：平成30年度秋期 問19","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ソフトウェアの機能量に着目して開発規模を見積もるファンクションポイント法で，調整前FPを求めるために必要となる情報はどれか。</p>","choices":[{"label":"ア","html":"開発者数"},{"label":"イ","html":"画面数"},{"label":"ウ","html":"プログラムステップ数"},{"label":"エ","html":"利用者数"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファンクションポイント法は，外部入力・外部出力・外部照会・内部論理ファイル・外部インタフェースファイルといった，利用者から見た機能（画面や帳票，ファイルの入出力など）の個数と複雑さを基に開発規模を見積もる手法であり，調整前FPはこれら画面や帳票などの機能の数とその複雑さの評価点を積み上げて算出する。したがって必要な情報は画面数（および帳票数やファイル数など）であり，正解はイである。アの開発者数やエの利用者数は規模見積りの入力情報ではなく，ウのプログラムステップ数はプログラムの実装量に依存するためファンクションポイント法が目的とする「プログラム言語や実装方法に依存しない機能量の見積り」とは相いれない情報である。</p>","mnemonic":""},{"id":409,"year":2018,"period":"平成30年度秋期","num":20,"cat":"マネジメント系","field":"ITIL（サービスライフサイクル）","summary":"ITIL（サービスライフサイクル）：平成30年度秋期 問20","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>図は，ITIL 2011 editionのサービスライフサイクルの各段階の説明と流れである。a～dの段階名の適切な組合せはどれか。</p><table border='1' cellspacing='0' cellpadding='4'><tr><th>段階</th><th>説明</th></tr><tr><td>a</td><td>ITサービス及びITサービスマネジメントに対する全体的な戦略を確立する。</td></tr><tr><td>b</td><td>事業要件を取り入れ，事業が求める品質，信頼性及び柔軟性に応えるサービスと，それを支えるプラクティス及び管理ツールを作り出す。</td></tr><tr><td>c</td><td>サービス及びサービス変更を運用に利用できるようにするために，前の段階の成果を受け取り，事業のニーズを満たすかどうかをテストし，本番環境に展開する。</td></tr><tr><td>d</td><td>顧客とサービス提供者にとっての価値を確保できるように，ITサービスを効果的かつ効率的に提供しサポートする。</td></tr><tr><td>（継続的サービス改善）</td><td>ITサービスマネジメントプロセスとITサービスに対する改善の管理を責務とし，効率性，有効性及び費用対効果を向上させるために，サービス提供者のパフォーマンスを継続的に測定して，プロセス，ITサービス，インフラストラクチャに改善を加える。</td></tr></table><table border='1' cellspacing='0' cellpadding='4'><tr><th></th><th>a</th><th>b</th><th>c</th><th>d</th></tr><tr><td>ア</td><td>サービスストラテジ</td><td>サービスオペレーション</td><td>サービストランジション</td><td>サービスデザイン</td></tr><tr><td>イ</td><td>サービスストラテジ</td><td>サービスデザイン</td><td>サービストランジション</td><td>サービスオペレーション</td></tr><tr><td>ウ</td><td>サービスデザイン</td><td>サービスストラテジ</td><td>サービストランジション</td><td>サービスオペレーション</td></tr><tr><td>エ</td><td>サービスデザイン</td><td>サービストランジション</td><td>サービスストラテジ</td><td>サービスオペレーション</td></tr></table>","choices":[{"label":"ア","html":"a=サービスストラテジ，b=サービスオペレーション，c=サービストランジション，d=サービスデザイン"},{"label":"イ","html":"a=サービスストラテジ，b=サービスデザイン，c=サービストランジション，d=サービスオペレーション"},{"label":"ウ","html":"a=サービスデザイン，b=サービスストラテジ，c=サービストランジション，d=サービスオペレーション"},{"label":"エ","html":"a=サービスデザイン，b=サービストランジション，c=サービスストラテジ，d=サービスオペレーション"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ITIL 2011 editionのサービスライフサイクルは，サービスストラテジ（全体戦略の立案）→サービスデザイン（戦略を具体的なサービス・プラクティス・ツールとして設計）→サービストランジション（設計されたサービスをテストし本番環境へ移行）→サービスオペレーション（日々の運用・サポートにより価値を提供）という流れで構成され，これらを継続的サービス改善が全段階にわたって支える構造になっている。設問のa～dの説明文はこの順番（全体戦略の確立→サービス設計→本番展開→運用・サポート）と一致するため，a=サービスストラテジ，b=サービスデザイン，c=サービストランジション，d=サービスオペレーションとなり，正解はイである。</p>","mnemonic":""},{"id":410,"year":2018,"period":"平成30年度秋期","num":21,"cat":"マネジメント系","field":"システム監査（サンプリング）","summary":"システム監査（サンプリング）：平成30年度秋期 問21","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>システム監査における，サンプリング（試査）に関する用語の説明のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"許容逸脱率とは，受け入れることができる所定の内部統制からの逸脱率であり，監査人がサンプルの件数を決めるときに用いられる指標である。"},{"label":"イ","html":"サンプリングリスクとは，固有リスクと統制リスクを掛け合わせた結果である。"},{"label":"ウ","html":"統計的サンプリングとは，特定の種類の例外取引を全て抽出する方法である。"},{"label":"エ","html":"母集団とは，評価対象から結論を導き出すのに必要なデータ全体のうち，リスクが高いデータの集合である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>許容逸脱率とは，内部統制が有効に機能していると判断するために，監査人が許容できると判断する統制からの逸脱（エラー）の上限の率のことであり，サンプルサイズ（サンプル件数）を決定する際の重要な指標として用いられる。したがって，アの説明は適切であり正解となる。イのサンプリングリスクは，サンプル（試査）に基づく結論が母集団全体を対象に検証した場合の結論と異なってしまうリスクのことであり，固有リスクと統制リスクの積ではない（それはむしろ監査リスクの構成要素の計算に近い別概念である）。ウの統計的サンプリングは，母集団から無作為（ランダム）に一部を抽出して確率論に基づき結論を推定する方法であり，特定の例外取引を全件抽出する方法ではない（それは精査や特定項目抽出にあたる）。エの母集団は，評価対象から結論を導くために必要なデータ全体を指し，リスクが高いデータだけに限定されるものではない。</p>","mnemonic":""},{"id":411,"year":2018,"period":"平成30年度秋期","num":22,"cat":"マネジメント系","field":"システム監査（可監査性）","summary":"システム監査（可監査性）：平成30年度秋期 問22","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>情報システムの可監査性を説明したものはどれか。</p>","choices":[{"label":"ア","html":"コントロールの有効性を監査できるように，情報システムが設計・運用されていること"},{"label":"イ","html":"システム監査人が，監査の目的に合致した有効な手続を行える能力をもっていること"},{"label":"ウ","html":"情報システムから入手した監査証拠の十分性と監査報告書の完成度が保たれていること"},{"label":"エ","html":"情報システム部門の積極的な協力が得られること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>可監査性とは，情報システムそのものが，内部統制（コントロール）の整備・運用状況を監査人が検証（監査）できるように，あらかじめ監査証跡の記録機能や証拠の保全機能などを備えて設計・運用されていることを指す概念であり，アがこれに該当し正解である。イはシステム監査人自身の専門能力に関する説明であって，監査対象である情報システムの性質ではない。ウは監査証拠や監査報告書の品質に関する説明であり可監査性の定義そのものではない。エは監査実施時の協力体制の話であり，情報システムの設計上の性質を指す可監査性とは異なる。</p>","mnemonic":""},{"id":412,"year":2018,"period":"平成30年度秋期","num":23,"cat":"マネジメント系","field":"UML","summary":"UML：平成30年度秋期 問23","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>業務プロセスを可視化する手法としてUMLを採用した場合の活用シーンはどれか。</p>","choices":[{"label":"ア","html":"対象をエンティティとその属性及びエンティティ間の関連で捉え，データ中心アプローチの表現によって図に示す。"},{"label":"イ","html":"データの流れによってプロセスを表現するために，データ送出，データ受取り，データ格納域，データに施す処理を，データの流れを示す矢印でつないで表現する。"},{"label":"ウ","html":"複数の観点でプロセスを表現するために，目的に応じたモデル図法を使用し，オブジェクトモデリングのために標準化された記述ルールで表現する。"},{"label":"エ","html":"プロセスの機能を網羅的に表現するために，一つの要件に対して発生する事象を条件分岐の形式で記述する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>UML（統一モデリング言語）は，オブジェクト指向分析・設計のために標準化された表記法であり，クラス図，ユースケース図，アクティビティ図，シーケンス図など，目的に応じた複数種類の図法を使い分けて，対象を様々な観点（構造・振る舞い・相互作用など）から表現できる点が特徴である。したがって，これに該当するウが正解である。アはERD（実体関連図）を用いたデータ中心アプローチの説明，イはDFD（データフローダイアグラム）の説明，エはデシジョンツリーや判定表的な表現の説明であり，いずれもUMLそのものの活用シーンとは異なる伝統的な構造化分析の手法の説明である。</p>","mnemonic":""},{"id":413,"year":2018,"period":"平成30年度秋期","num":24,"cat":"マネジメント系","field":"バランススコアカード","summary":"バランススコアカード：平成30年度秋期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>IT投資に対する評価指標の設定に際し，バランススコアカードの手法を用いてKPIを設定する場合，内部ビジネスプロセスの視点に立ったKPIの例はどれか。</p>","choices":[{"label":"ア","html":"売上高営業利益率を前年比5％アップとする。"},{"label":"イ","html":"顧客クレーム件数を1か月当たり20件以内とする。"},{"label":"ウ","html":"新システムの利用者研修会の受講率を100％とする。"},{"label":"エ","html":"注文受付から製品出荷までの日数を3日短縮とする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バランススコアカード（BSC）では，経営を「財務の視点」「顧客の視点」「内部ビジネスプロセスの視点」「学習と成長の視点」という四つの視点でバランスよく評価する。内部ビジネスプロセスの視点は，業務プロセスそのものの効率性や品質を評価するものであり，注文受付から製品出荷までのリードタイムを短縮するという目標（エ）は，社内の業務プロセスの効率を測る典型的なKPIであるため正解となる。アの売上高営業利益率は財務の視点，イの顧客クレーム件数は顧客の視点，ウの研修受講率は学習と成長の視点のKPIの例であり，内部ビジネスプロセスの視点には該当しない。</p>","mnemonic":""},{"id":414,"year":2018,"period":"平成30年度秋期","num":25,"cat":"ストラテジ系","field":"システム化構想の立案","summary":"システム化構想の立案：平成30年度秋期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ある企業が，AIなどの情報技術を利用した自動応答システムを導入して，コールセンタにおける顧客対応を無人化しようとしている。この企業が，システム化構想の立案プロセスで行うべきことはどれか。</p>","choices":[{"label":"ア","html":"AIなどの情報技術の動向を調査し，顧客対応における省力化と品質向上など，競争優位を生み出すための情報技術の利用方法について分析する。"},{"label":"イ","html":"AIなどを利用した自動応答システムを構築する上でのソフトウェア製品又はシステムの信頼性，効率性など品質に関する要件を定義する。"},{"label":"ウ","html":"自動応答に必要なシステム機能及び能力などのシステム要件を定義し，システム要件を，AIなどを利用した製品又はサービスなどのシステム要素に割り当てる。"},{"label":"エ","html":"自動応答を実現するソフトウェア製品又はシステムの要件定義を行い，AIなどを利用した実現方式やインタフェース設計を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム化構想の立案プロセスは，共通フレーム（SLCP）において最上流の工程であり，経営戦略・事業戦略に基づき，情報技術の動向を調査・分析して，どのように情報技術を活用すれば競争優位（省力化や品質向上など）を生み出せるかという構想を練る段階である。これに該当するのはアであり，具体的なシステムの機能や品質要件を定義する段階にはまだ入っていない点がポイントである。イは品質要件を定義するシステム要件定義段階，ウはシステム要件をシステム要素に割り当てるシステム方式設計段階，エはソフトウェア要件定義や実現方式・インタフェース設計を行うより下流の工程の説明であり，いずれも構想の立案プロセスより後工程の作業である。</p>","mnemonic":""},{"id":415,"year":2018,"period":"平成30年度秋期","num":26,"cat":"ストラテジ系","field":"データ分析手法","summary":"データ分析手法：平成30年度秋期 問26","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>観測データを類似性によって集団や群に分類し，その特徴となる要因を分析する手法はどれか。</p>","choices":[{"label":"ア","html":"クラスタ分析法"},{"label":"イ","html":"指数平滑法"},{"label":"ウ","html":"デルファイ法"},{"label":"エ","html":"モンテカルロ法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クラスタ分析法は，多数の観測データについて，データ間の類似性（距離）を基に性質の近いもの同士をグループ（クラスタ）にまとめ，分類後の各グループの特徴を分析する多変量解析の手法であり，設問の説明に一致するため正解はアである。イの指数平滑法は過去の実績値に重みを付けて将来値を予測する時系列予測の手法，ウのデルファイ法は複数の専門家に匿名でアンケートを繰り返し，意見を収束させて将来予測や合意形成を行う手法，エのモンテカルロ法は乱数を用いたシミュレーションによって確率的な挙動を推定する手法であり，いずれも「類似性による分類」を目的とする手法ではない。</p>","mnemonic":""},{"id":416,"year":2018,"period":"平成30年度秋期","num":27,"cat":"ストラテジ系","field":"IoT活用","summary":"IoT活用：平成30年度秋期 問27","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>IoTがもたらす効果を“監視”，“制御”，“最適化”，“自律化”の4段階に分類すると，IoTによって工場の機械の監視や制御などを行っているシステムにおいて，“自律化”の段階に達している例はどれか。</p>","choices":[{"label":"ア","html":"機械に対して，保守員が遠隔地の保守センタからインターネットを経由して，機器の電源のオン・オフなどの操作命令を送信する。"},{"label":"イ","html":"機械の温度や振動データをセンサで集めて，インターネットを経由してクラウドシステム上のサーバに蓄積する。"},{"label":"ウ","html":"クラウドサービスを介して，機械同士が互いの状態を常時監視・分析し，人手を介すことなく目標に合わせた協調動作を自動で行う。"},{"label":"エ","html":"クラウドシステム上に常時収集されている機械の稼働情報を基に，機械の故障検知時に，保守員が故障部位を分析して特定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IoTの効果段階のうち，“監視”はデータの収集・可視化，“制御”は遠隔からの操作，“最適化”は収集データの分析に基づく判断支援，“自律化”は人手を介さずに機械自身（または機械同士）が状況を判断し自動的に動作を最適化・協調させる段階を指す。設問では，機械同士がクラウドを介して互いの状態を監視・分析し，人の介在なしに協調動作を自動で行うウが，人手を介さない自動的な協調制御という点で自律化の段階に該当し，正解となる。アは人（保守員）が操作命令を送信しているので制御の段階，イはデータ収集・蓄積のみなので監視の段階，エは収集データを基に人（保守員）が分析・判断しているので最適化（人による意思決定支援）の段階にとどまり，いずれも自律化までは達していない。</p>","mnemonic":""},{"id":417,"year":2018,"period":"平成30年度秋期","num":28,"cat":"マネジメント系","field":"資材所要量計画（MRP）","summary":"資材所要量計画（MRP）：平成30年度秋期 問28","correct":"イ","result":"","formula":"部品Dの正味所要量 ＝（ユニットBの正味所要量×3＋ユニットCの正味所要量×1）－部品Dの在庫残","howto":"まずユニットB・Cの総所要量（製品Aの需要量×員数）を求め，在庫残があるユニットBだけ正味所要量に直す。それぞれの正味所要量に部品Dの員数を掛けて部品Dの総所要量を求め，最後に部品Dの在庫残25個を差し引く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ある期間の生産計画において，表の部品表で表される製品Aの需要量が10個であるとき，部品Dの正味所要量は何個か。ここで，ユニットBの在庫残が5個，部品Dの在庫残が25個あり，他の在庫残，仕掛残，注文残，引当残などはないものとする。</p><table border='1' cellspacing='0' cellpadding='4'><tr><th colspan='2'>レベル0</th><th colspan='2'>レベル1</th><th colspan='2'>レベル2</th></tr><tr><th>品名</th><th>数量（個）</th><th>品名</th><th>数量（個）</th><th>品名</th><th>数量（個）</th></tr><tr><td rowspan='2'>製品A</td><td rowspan='2'>1</td><td>ユニットB</td><td>4</td><td>部品D</td><td>3</td></tr><tr><td></td><td></td><td>部品E</td><td>1</td></tr><tr><td></td><td></td><td>ユニットC</td><td>1</td><td>部品D</td><td>1</td></tr><tr><td></td><td></td><td></td><td></td><td>部品F</td><td>2</td></tr></table>","choices":[{"label":"ア","html":"80"},{"label":"イ","html":"90"},{"label":"ウ","html":"95"},{"label":"エ","html":"105"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Aの需要量は10個なので，ユニットBの総所要量は10×4＝40個，ユニットCの総所要量は10×1＝10個となる。ユニットBには在庫残が5個あるので，正味所要量は40－5＝35個。ユニットCには在庫残がないので，正味所要量はそのまま10個である。部品Dは，ユニットB1個あたり3個，ユニットC1個あたり1個必要なので，部品Dの総所要量（グロス所要量）は，ユニットBの正味所要量35個×3＋ユニットCの正味所要量10個×1＝105＋10＝115個となる。最後に，部品Dには在庫残が25個あるので，正味所要量は115－25＝90個となる。したがって正解はイである。ここでのポイントは，下位部品の所要量を計算する際には，親部品の総所要量ではなく，親部品自身の在庫を差し引いた後の正味所要量を用いる点である。</p>","mnemonic":"「在庫引いてから掛け算，最後にもう一度引く」―B:40-5=35個×3＋C:10個×1=115個、そこから在庫25個を引いて部品Dは90個。"},{"id":418,"year":2018,"period":"平成30年度秋期","num":29,"cat":"ストラテジ系","field":"損益分岐点（変動費計算）","summary":"損益分岐点（変動費計算）：平成30年度秋期 問29","correct":"ウ","result":"","formula":"利益＝売上高×(1－変動費率)－固定費，変動費＝売上高×変動費率","howto":"2つの売上高・利益の実績から連立方程式を立てて変動費率と固定費を求め，売上高8,000万円のときの変動費＝8,000×変動費率を計算する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>売上高が7,000万円のとき，200万円の損失，売上高が9,000万円のとき，600万円の利益と予想された。売上高が8,000万円のときの変動費は何万円か。ここで，売上高が変わっても変動費率は変わらないものとする。</p>","choices":[{"label":"ア","html":"3,200"},{"label":"イ","html":"4,000"},{"label":"ウ","html":"4,800"},{"label":"エ","html":"5,600"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>変動費率をv，固定費をFとすると，利益＝売上高×(1－v)－Fと表せる。売上高7,000万円のとき利益は－200万円なので，7,000(1－v)－F＝－200。売上高9,000万円のとき利益は600万円なので，9,000(1－v)－F＝600。この2式の差をとると，2,000(1－v)＝800となり，1－v＝0.4，すなわち変動費率v＝0.6（60％）と求まる。これを1本目の式に代入すると，7,000×0.4－F＝－200より，2,800－F＝－200，F＝3,000（固定費3,000万円）となる（9,000×0.4－3,000＝600で検算も一致）。したがって，売上高8,000万円のときの変動費は，8,000×0.6＝4,800万円となり，正解はウである。</p>","mnemonic":"「売上の6割が変動費」―7000と9000の差2000万円に対し利益差800万円、比率0.4→変動費率6割、8000万円なら4,800万円。"},{"id":419,"year":2018,"period":"平成30年度秋期","num":30,"cat":"ストラテジ系","field":"下請法（法務）","summary":"下請法（法務）：平成30年度秋期 問30","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ユーザから請け負うソフトウェア開発を下請業者に委託する場合，下請代金支払遅延等防止法で禁止されている行為はどれか。</p>","choices":[{"label":"ア","html":"交通費などの経費については金額を明記せず，実費負担とする旨を発注書面に記載する。"},{"label":"イ","html":"下請業者に委託する業務内容は決まっているが，ユーザとの契約代金が未定なので，下請代金の取決めは契約決定後とする。"},{"label":"ウ","html":"発注書面を交付する代わりに，下請業者の承諾を得て，必要な事項を記載した電子メールで発注を行う。"},{"label":"エ","html":"ユーザの事情で下請予定の業務内容の一部が未定なので，その部分及び下請代金は別途取り決める。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>下請代金支払遅延等防止法（下請法）は，親事業者に対し，発注に際して下請代金の額，支払期日，支払方法などを明記した書面（いわゆる3条書面）を直ちに下請業者に交付することを義務付けている。委託する業務内容自体は決まっているにもかかわらず，発注者側（ユーザ）との契約代金が未定であることを理由に，下請代金の額の取決めを先送りにして発注することは，下請代金の額を定めずに発注する行為として禁止されており，イが正解である。アの経費を実費精算とする旨を明記する取扱いや，ウの下請業者の承諾を得た電子的方法（電磁的記録）による発注は，いずれも法令上認められている。エのように，発注者側の事情でやむを得ず一部業務内容が未定な場合に，その部分と代金を別途取り決めることとし，その旨及び理由を書面に記載しておく取扱いも，正当な理由がある場合の例外として認められている。</p>","mnemonic":""},{"id":420,"year":2018,"period":"平成30年度春期","num":1,"cat":"テクノロジ系","field":"ハミング符号","summary":"ハミング符号：平成30年度春期 問1","correct":"ア","result":"","formula":"受信符号を3つのパリティ検査式に代入し，全式で不一致となるビット（＝全検査式に共通して現れるビット）を反転する","howto":"7ビットをX1 X2 X3 P3 X4 P2 P1の順に当てはめ，各検査式（⊕）の結果が0になるか確かめて誤りビットを特定する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ハミング符号とは，データに冗長ビットを付加して，1ビットの誤りを訂正できるようにしたものである。ここでは，X1，X2，X3，X4の4ビットから成るデータに，3ビットの冗長ビットP3，P2，P1を付加したハミング符号 X1 X2 X3 P3 X4 P2 P1 を考える。付加したビットP1，P2，P3は，それぞれ</p><p>X1 ⊕ X3 ⊕ X4 ⊕ P1 = 0<br>X1 ⊕ X2 ⊕ X4 ⊕ P2 = 0<br>X1 ⊕ X2 ⊕ X3 ⊕ P3 = 0</p><p>となるように決める。ここで，⊕は排他的論理和を表す。</p><p>ハミング符号1110011には1ビットの誤りが存在する。誤りビットを訂正したハミング符号はどれか。</p>","choices":[{"label":"ア","html":"0110011"},{"label":"イ","html":"1010011"},{"label":"ウ","html":"1100011"},{"label":"エ","html":"1110111"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>受信した符号1110011を，ビット位置の定義どおりに X1 X2 X3 P3 X4 P2 P1 = 1,1,1,0,0,1,1 と当てはめる。</p><p>①X1⊕X3⊕X4⊕P1 = 1⊕1⊕0⊕1 = 1（本来0のはずが1→不一致）<br>②X1⊕X2⊕X4⊕P2 = 1⊕1⊕0⊕1 = 1（不一致）<br>③X1⊕X2⊕X3⊕P3 = 1⊕1⊕1⊕0 = 1（不一致）</p><p>3つの検査式すべてが不一致ということは，3つの式すべてに共通して含まれるビット，すなわちX1に誤りがあることを意味する（P1・P2・P3はそれぞれ1式にしか現れず，X4は①②のみ，X3は①③のみであるのに対し，X1だけが①②③すべてに含まれる）。</p><p>X1を1→0に反転すると，符号は X1 X2 X3 P3 X4 P2 P1 = 0,1,1,0,0,1,1 となり，「0110011」が得られる。これは選択肢アと一致する。</p>","mnemonic":"三つの式が「イチ・イチ・イチ」と全部食い違うなら，犯人はいつも3式共通のX1――反転して0110011で疑いが晴れる。"},{"id":421,"year":2018,"period":"平成30年度春期","num":2,"cat":"テクノロジ系","field":"アッカーマン関数","summary":"アッカーマン関数：平成30年度春期 問2","correct":"ウ","result":"","formula":"Ack(1, n) = n+2 という性質を使うと検算が早い","howto":"定義式どおりにm=1のケースをn=0から順に地道に展開していく","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>非負の整数 m，n に対して次のとおりに定義された関数 Ack(m, n) がある。Ack(1, 3) の値はどれか。</p><p>Ack(m, n) =<br>　Ack(m−1, Ack(m, n−1))　（m＞0かつn＞0のとき）<br>　Ack(m−1, 1)　（m＞0かつn＝0のとき）<br>　n+1　（m＝0のとき）</p>","choices":[{"label":"ア","html":"3"},{"label":"イ","html":"4"},{"label":"ウ","html":"5"},{"label":"エ","html":"6"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>Ack(1,0) = Ack(0,1) = 1+1 = 2</p><p>Ack(1,1) = Ack(0, Ack(1,0)) = Ack(0,2) = 2+1 = 3</p><p>Ack(1,2) = Ack(0, Ack(1,1)) = Ack(0,3) = 3+1 = 4</p><p>Ack(1,3) = Ack(0, Ack(1,2)) = Ack(0,4) = 4+1 = 5</p><p>よって Ack(1,3) = 5 であり，これは一般式 Ack(1,n) = n+2 とも一致する（3+2=5）。</p>","mnemonic":"Ack(1,3)は「いち・さん」に2を足して5，1段ずつ階段を上って最後にプラス2と覚える。"},{"id":422,"year":2018,"period":"平成30年度春期","num":3,"cat":"テクノロジ系","field":"記憶管理方式","summary":"記憶管理方式：平成30年度春期 問3","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>再帰的な処理を実現するためには，再帰的に呼び出したときのレジスタ及びメモリの内容を保存しておく必要がある。そのための記憶管理方式はどれか。</p>","choices":[{"label":"ア","html":"FIFO"},{"label":"イ","html":"LFU"},{"label":"ウ","html":"LIFO"},{"label":"エ","html":"LRU"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>関数が自分自身を再帰的に呼び出すと，呼び出すたびにその時点のレジスタの値やローカル変数，戻り番地などを保存し，呼び出した処理が終わったら直前に保存した状態から順に復元して処理を再開する必要がある。この「最後に保存したものを最初に取り出す」という順序は，スタック（LIFO：Last In First Out）そのものであり，実際のプログラム実行環境でも再帰呼び出しの管理にはスタック領域（コールスタック）が使われている。</p><p>これに対し，FIFO（先入れ先出し）はキューの管理方式でジョブスケジューリングやバッファ管理に使われ，LFU（最も使用頻度が低いものを置換）やLRU（最も長く使われていないものを置換）はキャッシュやページの置換アルゴリズムであり，いずれも「直前の呼び出し状態を正しい順序で復元する」という再帰処理の要件には合わない。</p>","mnemonic":""},{"id":423,"year":2018,"period":"平成30年度春期","num":4,"cat":"テクノロジ系","field":"メモリインタリーブ","summary":"メモリインタリーブ：平成30年度春期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>メモリインタリーブの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"主記憶と外部記憶を一元的にアドレス付けし，主記憶の物理容量を超えるメモリ空間を提供する。"},{"label":"イ","html":"主記憶と磁気ディスク装置との間にバッファメモリを置いて，双方のアクセス速度の差を補う。"},{"label":"ウ","html":"主記憶と入出力装置との間でCPUとは独立にデータ転送を行う。"},{"label":"エ","html":"主記憶を複数のバンクに分けて，CPUからのアクセス要求を並列的に処理できるようにする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>メモリインタリーブは，主記憶を複数の独立したバンク（区画）に分割して構成し，連続したアドレスを異なるバンクに割り当てることで，複数のアクセス要求を並列に処理し，見かけ上のメモリアクセス速度を高める技術である。CPUが連続アドレスにアクセスする際，各バンクが並行して読み書きを行えるため，1つのバンクのアクセス時間の待ち時間を他のバンクの処理と重ね合わせることができる。</p><p>アは仮想記憶（主記憶と外部記憶を一体的に扱いアドレス空間を拡張する技術）の説明であり，イはディスクキャッシュ，ウはDMA（Direct Memory Access）の説明であって，いずれもメモリインタリーブとは異なる技術である。</p>","mnemonic":""},{"id":424,"year":2018,"period":"平成30年度春期","num":5,"cat":"テクノロジ系","field":"稼働率","summary":"稼働率：平成30年度春期 問5","correct":"ウ","result":"","formula":"並列（2台のうち1台以上稼働）: 1-(1-a)^2，直列（層ごとの積）: 各層の稼働率を掛け合わせる","howto":"AP層・DB層それぞれを『少なくとも1台稼働』の並列系とみなして稼働率を求め，両層が直列なので掛け合わせる","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>4種類の装置で構成される次のシステムの稼働率は，およそ幾らか。ここで，アプリケーションサーバとデータベースサーバの稼働率は0.8であり，それぞれのサーバのどちらかが稼働していればシステムとして稼働する。また，負荷分散装置と磁気ディスク装置は，故障しないものとする。</p><p>システム構成：負荷分散装置の配下にアプリケーションサーバが2台並列に接続され，その配下にデータベースサーバが2台並列に接続される。接続は交差（クロス）しており，どちらのアプリケーションサーバからもどちらのデータベースサーバにも到達できる。さらにその配下に磁気ディスク装置が接続されている。</p>","choices":[{"label":"ア","html":"0.64"},{"label":"イ","html":"0.77"},{"label":"ウ","html":"0.92"},{"label":"エ","html":"0.96"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>負荷分散装置と磁気ディスク装置は故障しないため，システム稼働率はアプリケーションサーバ層とデータベースサーバ層の稼働率だけで決まる。図の交差接続により，アプリケーションサーバが1台でも，データベースサーバが1台でも稼働していれば，互いにどちらにでも接続できるのでシステムとして稼働する。</p><p>アプリケーションサーバ層（2台のうち少なくとも1台が稼働）：1-(1-0.8)×(1-0.8) = 1-0.2×0.2 = 1-0.04 = 0.96</p><p>データベースサーバ層（同様に）：1-(1-0.8)×(1-0.8) = 0.96</p><p>両層は直列関係にあるので，システム全体の稼働率 = 0.96×0.96 = 0.9216 ≒ 0.92</p>","mnemonic":"「はち（8割）が2台束になれば，くろ（96%）に近づく」――サボる確率0.2×0.2=0.04を1から引き，2層分で0.96×0.96＝0.92に。"},{"id":425,"year":2018,"period":"平成30年度春期","num":6,"cat":"テクノロジ系","field":"仮想記憶管理","summary":"仮想記憶管理：平成30年度春期 問6","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ページング方式の仮想記憶における主記憶の割当てに関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"プログラム実行時のページフォールトを契機に，ページをロードするのに必要な主記憶が割り当てられる。"},{"label":"イ","html":"プログラムで必要なページをロードするための主記憶の空きが存在しない場合には，実行中のプログラムのどれかが終了するまで待たされる。"},{"label":"ウ","html":"プログラムに割り当てられる主記憶容量は一定であり，プログラムの進行によって変動することはない。"},{"label":"エ","html":"プログラムの実行開始時には，プログラムのデータ領域とコード領域のうち，少なくとも全てのコード領域に主記憶が割り当てられる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ページング方式の仮想記憶では，プログラムの実行に必要なページは最初から全て主記憶に読み込まれるのではなく，実際にそのページ上の命令やデータにアクセスしようとした時点でそのページが主記憶に存在しなければページフォールト（ページ不在割込み）が発生し，そのタイミングで必要なページだけが補助記憶装置から主記憶にロードされ，ページが割り当てられる。これはデマンドページング（要求時ページング）と呼ばれる一般的な方式である。</p><p>イは誤りで，空きがない場合は他のページを追い出す（ページ置換アルゴリズムによってページアウトする）ことで対応でき，プログラム終了を待つ必要はない。ウも誤りで，必要なページ数はプログラムの実行経過（局所性）によって変動するため，割当て容量は固定ではない。エも誤りで，実行開始時に全コード領域を事前にロードするのではなく，必要なページを逐次ロードするのがページング方式の特徴である。</p>","mnemonic":""},{"id":426,"year":2018,"period":"平成30年度春期","num":7,"cat":"テクノロジ系","field":"クロック分周","summary":"クロック分周：平成30年度春期 問7","correct":"エ","result":"","formula":"分周器入力周波数＝発振器周波数×PLL1逓倍率，SIO周波数＝分周器入力×分周比。各選択肢で計算し，115kHz±5%（109.25～120.75kHz）に収まるものを選ぶ","howto":"まずPLL1出力（分周器への入力）を求め，各選択肢の分周比を掛けて許容誤差範囲に入るか検算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ワンチップマイコンにおける内部クロック発生器のブロック図を示す。15MHzの発振器と，内部のPLL1，PLL2及び分周器の組合せでCPUに240MHz，シリアル通信（SIO）に115kHzのクロック信号を供給する場合の分周器の値は幾らか。ここで，シリアル通信のクロック精度は±5%以内に収まればよいものとする。</p><p>構成：発振器（15MHz）→PLL1（8逓倍）の出力が分岐し，一方はPLL2（2逓倍）を経てCPU（240MHz）へ，もう一方は分周器を経てSIO（115kHz，±5%）へ供給される。</p>","choices":[{"label":"ア","html":"1／2⁴"},{"label":"イ","html":"1／2⁶"},{"label":"ウ","html":"1／2⁸"},{"label":"エ","html":"1／2¹⁰"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>分周器への入力はPLL1の出力であり，PLL1は発振器の15MHzを8逓倍するので，分周器の入力周波数は15MHz×8＝120MHzである（PLL2はこの120MHzをさらに2逓倍してCPU用の240MHzを作っており，分周器はPLL1出力の分岐から直接SIO用クロックを作る）。</p><p>SIOに必要なクロックは115kHz（±5%）なので，許容範囲は115kHz×0.95≒109.25kHz～115kHz×1.05≒120.75kHzである。</p><p>選択肢エの1／2¹⁰（＝1／1024）で分周すると，120MHz÷1024≒117.1875kHzとなり，許容範囲（109.25～120.75kHz）に収まる。他の選択肢，例えば1／2⁸（＝1／256）では120MHz÷256≒468.75kHzとなり誤差が大きすぎて範囲外である。よって分周器の値は1／2¹⁰である。</p>","mnemonic":"120MHzを「せんにじゅうよん（1024）」で割ると117kHz，115kHzの5%圏内にすっぽり――2の10乗がジャストフィット。"},{"id":427,"year":2018,"period":"平成30年度春期","num":8,"cat":"テクノロジ系","field":"B+木インデックス","summary":"B+木インデックス：平成30年度春期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>関係データベースのテーブルにレコードを1件追加したところ，インデックスとして使う，図のB＋木のリーフノードCがノードC1とC2に分割された。ノード分割後のB＋木構造はどれか。ここで，矢印はノードへのポインタとする。また，中間ノードAには十分な空きがあるものとする。</p><p>分割前の構造：中間ノードAから3本の矢印がリーフノードB，C，Dへそれぞれ伸びており，リーフノード同士はB⇔C⇔Dの順に双方向の矢印（リンク）でつながっている。</p><p>各選択肢（いずれもCがC1とC2の2つに分割された後の構造）：</p><table><tr><th>選択肢</th><th>中間ノードAからの矢印</th><th>リーフノード間のリンク</th></tr><tr><td>ア</td><td>B，C1，Dの3本のみ（C2への直接の矢印なし）</td><td>B⇔C1⇔C2⇔Dの順に一直線にリンク</td></tr><tr><td>イ</td><td>B，C1，C2，Dの4本（全リーフへ直接矢印）</td><td>B⇔C1⇔C2⇔Dの順に一直線にリンク</td></tr><tr><td>ウ</td><td>B，C1，D，C2の4本（全リーフへ直接矢印）</td><td>B⇔C1⇔D⇔C2の順にリンク（DとC2の順序が逆転）</td></tr><tr><td>エ</td><td>B，C1，Dの3本のみ（C2への直接の矢印なし）</td><td>B⇔C1⇔Dの一直線リンクに加え，C2はC1から縦方向に伸びる矢印でぶら下がる</td></tr></table>","choices":[{"label":"ア","html":"A→B，C1，D（3本）／B⇔C1⇔C2⇔Dとリンク，AからC2への直接矢印なし"},{"label":"イ","html":"A→B，C1，C2，D（4本すべてに直接矢印）／B⇔C1⇔C2⇔Dの順にリンク"},{"label":"ウ","html":"A→B，C1，D，C2（4本）／B⇔C1⇔D⇔C2の順にリンク（順序が逆転）"},{"label":"エ","html":"A→B，C1，D（3本）／C2はC1から縦にぶら下がり，水平リンクに含まれない"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>B＋木では，リーフノード（データを指す末端ノード）はキー順に左から右へ並び，検索や範囲スキャンのためにリーフノード同士が双方向のリンクリスト（ここでは⇔の矢印）でつながっている。また，中間ノードは子として存在するすべてのリーフノードへ直接ポインタをもつ。</p><p>リーフノードCがC1とC2（Cの持っていたキー範囲を昇順で2分割したもの）に分割されたので，分割後もキー順を保つようにB，C1，C2，Dの順でリーフノードが並び，かつ互いにB⇔C1⇔C2⇔Dの一直線のリンクでつながる必要がある。加えて，設問文にあるとおり中間ノードAには十分な空きがあるため，新たに生じたC2に対してもAから直接ポインタを追加するのが正しいB＋木の構造である。この両方の条件を満たすのは選択肢イであり，Aから4つのリーフ（B，C1，C2，D）全てへ直接矢印が伸び，リーフ間もB⇔C1⇔C2⇔Dの順にリンクされている。</p><p>アとエはAからC2への直接のポインタが欠けており，C2への到達にC1を経由しなければならず中間ノードを介した効率的な検索ができない。ウはB⇔C1⇔D⇔C2の順にリンクされておりキーの昇順（大小関係）が崩れているため，いずれも正しいB＋木の構造ではない。</p>","mnemonic":""},{"id":428,"year":2018,"period":"平成30年度春期","num":9,"cat":"テクノロジ系","field":"NoSQL","summary":"NoSQL：平成30年度春期 問9","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ビッグデータの基盤技術として利用されるNoSQLに分類されるデータベースはどれか。</p>","choices":[{"label":"ア","html":"関係データモデルをオブジェクト指向データモデルに拡張し，操作の定義や型の継承関係の定義を可能としたデータベース"},{"label":"イ","html":"経営者の意思決定を支援するために，ある主題に基づくデータを現在の情報とともに過去の情報も蓄積したデータベース"},{"label":"ウ","html":"様々な形式のデータを一つのキーに対応付けて管理するキーバリュー型データベース"},{"label":"エ","html":"データ項目の名称や形式など，データそのものの特性を表すメタ情報を管理するデータベース"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NoSQL（Not only SQL）は，従来のリレーショナルデータベース（RDB）が前提とする厳格なスキーマやSQLによる操作に縛られない，大規模・非構造化データ向けのデータベース群の総称である。代表的な分類の一つがキーバリュー型データベースであり，値（様々な形式のデータ）を一意のキーに対応付けて格納・検索する単純な構造をとることで，ビッグデータのような大量データに対する高速な読み書きとスケールアウトが可能になる。選択肢ウはこのキーバリュー型の説明であり，NoSQLに分類される。</p><p>アはオブジェクト関係データベース（ORDB），イはデータウェアハウス，エはメタデータを管理するデータディクショナリ／リポジトリの説明であり，いずれもNoSQLというよりは従来型のRDB関連技術や管理手法を指している。</p>","mnemonic":""},{"id":429,"year":2018,"period":"平成30年度春期","num":10,"cat":"テクノロジ系","field":"NFV","summary":"NFV：平成30年度春期 問10","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ETSI（欧州電気通信標準化機構）によって提案されたNFV（Network Functions Virtualisation）に関する記述として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"インターネット上で地理情報システムと拡張現実の技術を利用することによって，現実空間と仮想空間をスムーズに融合させた様々なサービスを提供する。"},{"label":"イ","html":"仮想化技術を利用し，ネットワーク機能を汎用サーバ上にソフトウェアとして実現したコンポーネントを用いることによって，柔軟なネットワーク基盤を構築する。"},{"label":"ウ","html":"様々な入力情報に対する処理結果をニューラルネットワークに学習させることによって，画像認識や音声認識，自然言語処理などの問題に対する解を見いだす。"},{"label":"エ","html":"プレースとトランジションと呼ばれる2種類のノードをもつ有向グラフであり，システムの並列性や競合性の分析などに利用される。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>NFV（Network Functions Virtualisation，ネットワーク機能仮想化）は，ETSIが標準化を進めている技術概念であり，ルータやファイアウォール，ロードバランサといった従来は専用ハードウェア機器（アプライアンス）で提供していたネットワーク機能を，仮想化技術を用いて汎用的なサーバ上で動作するソフトウェア（VNF：Virtual Network Function）として実現するものである。これにより，専用機器を個別に設置・運用する必要がなくなり，ソフトウェアの追加・変更だけで柔軟にネットワーク機能を構築・拡張できるようになる。</p><p>アはAR（拡張現実）やGIS（地理情報システム）の説明，ウはディープラーニング（深層学習）の説明，エはペトリネットの説明であり，いずれもNFVとは異なる技術分野を指している。</p>","mnemonic":""},{"id":430,"year":2018,"period":"平成30年度春期","num":11,"cat":"テクノロジ系","field":"ビット誤り率","summary":"ビット誤り率：平成30年度春期 問11","correct":"イ","result":"","formula":"ビット誤り率＝誤りビット数÷総送信ビット数","howto":"100秒間に送信される総ビット数（伝送速度×時間）を求め，その中の誤り1ビットの割合を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>伝送速度30Mビット／秒の回線を使ってデータを連続送信したとき，平均して100秒に1回の1ビット誤りが発生した。この回線のビット誤り率は幾らか。</p>","choices":[{"label":"ア","html":"4.17×10⁻¹¹"},{"label":"イ","html":"3.33×10⁻¹⁰"},{"label":"ウ","html":"4.17×10⁻⁵"},{"label":"エ","html":"3.33×10⁻⁴"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>100秒間に送信される総ビット数＝30M（＝30×10⁶）ビット／秒×100秒＝3,000×10⁶＝3×10⁹ビット</p><p>この間に1ビットの誤りが発生しているので，ビット誤り率＝1÷（3×10⁹）≒0.333×10⁻⁹＝3.33×10⁻¹⁰</p><p>よって正解はイである。</p>","mnemonic":"30M×100秒=30億ビットのうち誤り1ビット、1÷30億=3.33×10⁻¹⁰でイ。"},{"id":431,"year":2018,"period":"平成30年度春期","num":12,"cat":"テクノロジ系","field":"クロスサイトスクリプティング","summary":"クロスサイトスクリプティング：平成30年度春期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>クロスサイトスクリプティングの手口はどれか。</p>","choices":[{"label":"ア","html":"Webアプリケーションのフォームの入力フィールドに，悪意のあるJavaScriptコードを含んだデータを入力する。"},{"label":"イ","html":"インターネットなどのネットワークを通じてサーバに不正にアクセスしたり，データの改ざんや破壊を行ったりする。"},{"label":"ウ","html":"大量のデータをWebアプリケーションに送ることによって，用意されたバッファ領域をあふれさせる。"},{"label":"エ","html":"パス名を推定することによって，本来は認証された後にしかアクセスが許可されないページに直接ジャンプする。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クロスサイトスクリプティング（XSS）は，脆弱性のあるWebアプリケーションの入力フォームなどに悪意のあるスクリプト（主にJavaScript）を含んだデータを入力・送信し，そのスクリプトが他の利用者のブラウザ上でサイトの正規のコンテンツであるかのように実行されるようにする攻撃手口である。これにより，利用者のCookie情報（セッションID等）の窃取や，偽の入力画面の表示などの被害が発生する。選択肢アはこの入力フィールドへの悪意あるコード混入を的確に表している。</p><p>イは不正アクセス行為一般の説明，ウはバッファオーバーフロー攻撃，エはディレクトリ（パス）の推測によるアクセス制御回避（強制ブラウジング）の説明であり，いずれもXSS固有の手口ではない。</p>","mnemonic":""},{"id":432,"year":2018,"period":"平成30年度春期","num":13,"cat":"テクノロジ系","field":"VDI/リモートブラウザ分離","summary":"VDI/リモートブラウザ分離：平成30年度春期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>内部ネットワークのPCからインターネット上のWebサイトを参照するときにDMZ上に用意したVDI（Virtual Desktop Infrastructure）サーバ上のWebブラウザを利用すると，未知のマルウェアがPCにダウンロードされて，PCが感染することを防ぐというセキュリティ上の効果が期待できる。この効果を生み出すVDIサーバの動作の特徴はどれか。</p>","choices":[{"label":"ア","html":"Webサイトからの受信データのうち，実行ファイルを削除し，その他のデータをPCに送信する。"},{"label":"イ","html":"Webサイトからの受信データのうち，不正なコード列が検知されない通信だけをPCに送信する。"},{"label":"ウ","html":"Webサイトからの受信データを処理してVDIサーバで生成したデスクトップ画面の画像データだけをPCに送信する。"},{"label":"エ","html":"Webサイトからの受信データを全てIPsecでカプセル化し，PCに送信する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>VDI（仮想デスクトップ基盤）をDMZに設置してWebブラウジングに利用する方式は「画面転送型」のリモートブラウザ分離（RBI）の一種であり，実際のWebサイトとの通信やコンテンツのレンダリングはすべてVDIサーバ上で行われ，PCにはそのデスクトップ画面を描画した画像（ピクセル）データだけが転送される。PCとインターネット上のWebサイトとの間でファイルや実行コードそのものがやり取りされることがないため，未知のマルウェアを含むデータがそのままPCにダウンロードされることがなく，感染を防止できる。</p><p>アは実行ファイルだけを削除する方式（ファイル無害化の一種）でマルウェア本体以外のデータはそのまま転送されてしまう可能性があり，イはシグネチャベースの検知をすり抜ける未知のマルウェアを防げない。エはIPsecによる暗号化であり，データの中身そのものはそのままPCに届くため，マルウェア対策としては機能しない。</p>","mnemonic":""},{"id":433,"year":2018,"period":"平成30年度春期","num":14,"cat":"テクノロジ系","field":"ファジング","summary":"ファジング：平成30年度春期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ファジングに該当するものはどれか。</p>","choices":[{"label":"ア","html":"サーバにFINパケットを送信し，サーバからの応答を観測して，稼働しているサービスを見つけ出す。"},{"label":"イ","html":"サーバのOSやアプリケーションソフトが生成したログやコマンド履歴などを解析して，ファイルサーバに保存されているファイルの改ざんを検知する。"},{"label":"ウ","html":"ソフトウェアに，問題を引き起こしそうな多様なデータを入力し，挙動を監視して，脆弱性を見つけ出す。"},{"label":"エ","html":"ネットワーク上を流れるパケットを収集し，そのプロトコルヘッダやデータを解析して，あらかじめ登録された攻撃パターンと一致した場合は不正アクセスと判断する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ファジング（fuzzing）は，検査対象のソフトウェアに対して，通常は想定されないような不正値・異常値・境界値など多様なデータ（ファズ，fuzzデータ）を大量に入力し，その際のソフトウェアの挙動（クラッシュ，異常終了，応答のハングアップなど）を監視することで，未知の脆弱性やバグを発見する検査手法である。選択肢ウはこの説明そのものである。</p><p>アはポートスキャン（FINスキャン）によるサービス検出，イはログ解析によるファイル改ざん検知（整合性監視），エはシグネチャ型の侵入検知システム（IDS）の動作であり，いずれもファジングとは異なる。</p>","mnemonic":""},{"id":434,"year":2018,"period":"平成30年度春期","num":15,"cat":"テクノロジ系","field":"セッション管理","summary":"セッション管理：平成30年度春期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>Webシステムにおいて，セッションの乗っ取りの機会を減らすために，利用者のログアウト時にWebサーバ又はWebブラウザにおいて行うべき処理はどれか。ここで，利用者は自分専用のPCにおいて，Webブラウザを利用しているものとする。</p>","choices":[{"label":"ア","html":"Webサーバにおいてセッション ID をディスクに格納する。"},{"label":"イ","html":"Webサーバにおいてセッション ID を無効にする。"},{"label":"ウ","html":"WebブラウザにおいてキャッシュしているWebページをクリアする。"},{"label":"エ","html":"Webブラウザにおいてセッション ID をディスクに格納する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>セッションハイジャック（セッションの乗っ取り）を防ぐ基本対策の一つは，利用が終了したセッションIDを速やかに無効化（失効）させることである。利用者がログアウトした時点でWebサーバ側がそのセッションIDをサーバ内のセッション管理情報から破棄・無効化すれば，仮にそのセッションIDが第三者に漏えい・盗用されたとしても，そのIDではもはやログイン状態を再利用できなくなる。選択肢イはこの対策を的確に表している。</p><p>ア・エはセッションIDをディスク（永続記憶）に格納する操作であり，むしろ漏えいのリスクを高める方向の処理であって対策にならない。ウはキャッシュクリアであり，Webページの表示内容の残存を防ぐ効果はあるが，サーバ側のセッションIDそのものを無効化するものではないため，乗っ取りの機会を減らす直接の対策にはならない。</p>","mnemonic":""},{"id":435,"year":2018,"period":"平成30年度春期","num":16,"cat":"テクノロジ系","field":"ソフトウェアライフサイクルプロセス","summary":"ソフトウェアライフサイクルプロセス：平成30年度春期 問16","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>ソフトウェアライフサイクルプロセスにおいてソフトウェア実装プロセスを構成するプロセスのうち，次のタスクを実施するものはどれか。</p><p>〔タスク〕<br>・ソフトウェア品目の外部インタフェース，及びソフトウェアコンポーネント間のインタフェースについて最上位レベルの設計を行う。<br>・データベースについて最上位レベルの設計を行う。<br>・ソフトウェア結合のために暫定的なテスト要求事項及びスケジュールを定義する。</p>","choices":[{"label":"ア","html":"ソフトウェア結合プロセス"},{"label":"イ","html":"ソフトウェア構築プロセス"},{"label":"ウ","html":"ソフトウェア詳細設計プロセス"},{"label":"エ","html":"ソフトウェア方式設計プロセス"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>共通フレーム（SLCP-JCF）やJIS X 0160（ISO/IEC/IEEE 12207）が定めるソフトウェア実装プロセスは，要件定義から結合・適格性確認テストまで段階的に構成されており，その中の「ソフトウェア方式設計プロセス」（アーキテクチャ設計プロセス）では，ソフトウェア品目全体を複数のコンポーネントに分割し，各コンポーネントの外部インタフェース及びコンポーネント間インタフェースについて最上位レベル（概要レベル）の設計を行うとともに，データベースの最上位設計や，後工程であるソフトウェア結合のための暫定的なテスト要求事項・スケジュールの定義までを行う。設問のタスクはこれに一致する。</p><p>ウのソフトウェア詳細設計プロセスはこの後工程で，方式設計で分割されたコンポーネントをさらに実装可能な単位（モジュール）まで詳細化する段階であり，イのソフトウェア構築プロセスはコードを実際に作成・単体テストする段階，アのソフトウェア結合プロセスはコンポーネントを統合して結合テストを行う段階であって，いずれも設問のタスク（最上位レベルの設計）とは工程が異なる。</p>","mnemonic":""},{"id":436,"year":2018,"period":"平成30年度春期","num":17,"cat":"テクノロジ系","field":"アジャイル開発","summary":"アジャイル開発：平成30年度春期 問17","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>アジャイル開発などで導入されている“ペアプログラミング”の説明はどれか。</p>","choices":[{"label":"ア","html":"開発工程の初期段階に要求仕様を確認するために，プログラマと利用者がペアとなり，試作した画面や帳票を見て，相談しながらプログラムの開発を行う。"},{"label":"イ","html":"効率よく開発するために，2人のプログラマがペアとなり，メインプログラムとサブプログラムを分担して開発を行う。"},{"label":"ウ","html":"短期間で開発するために，2人のプログラマがペアとなり，交互に作業と休憩を繰り返しながら長時間にわたって連続でプログラムの開発を行う。"},{"label":"エ","html":"品質の向上や知識の共有を図るために，2人のプログラマがペアとなり，その場で相談したりレビューしたりしながら，一つのプログラムの開発を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ペアプログラミングは，XP（エクストリームプログラミング）などのアジャイル開発プラクティスの一つで，2人のプログラマが1台のコンピュータの前に並んで座り，一方（ドライバ）が実際にコードを入力し，もう一方（ナビゲータ）がその場でコードの設計や論理の誤りをリアルタイムにレビュー・助言するというスタイルで，一つのプログラムを共同して開発する手法である。常時レビューが行われることによって欠陥が早期に発見され品質が向上するとともに，知識やノウハウがペア間で自然に共有されるという効果がある。選択肢エはこの説明に合致する。</p><p>アは要求仕様確認のためのプロトタイピングレビューの説明，イは単なる作業分担，ウは休憩を取りながらの交代制作業の説明であり，いずれも「2人が同時に相談・レビューしながら一つのプログラムを作る」というペアプログラミングの核心的特徴を表していない。</p>","mnemonic":""},{"id":437,"year":2018,"period":"平成30年度春期","num":18,"cat":"マネジメント系","field":"スコープコントロール","summary":"スコープコントロール：平成30年度春期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>プロジェクトマネジメントにおけるスコープコントロールの活動はどれか。</p>","choices":[{"label":"ア","html":"開発ツールの新機能の教育が不十分と分かったので，開発ツールの教育期間を2日間延長した。"},{"label":"イ","html":"要件定義完了時に再見積りをしたところ，当初見積もった開発コストを超過することが判明したので，追加予算を確保した。"},{"label":"ウ","html":"連携する計画であった外部システムのリリースが延期になったので，この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。"},{"label":"エ","html":"割り当てたテスト担当者が期待した成果を出せなかったので，経験豊富なテスト担当者と交代した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スコープコントロールは，プロジェクトマネジメントにおいてプロジェクト及びプロダクトのスコープ（作業範囲・成果物の範囲）の状況を監視し，スコープに対する変更要求が生じた場合にそれを適切に管理する活動である。選択肢ウは，外部システムとの連携作業という本プロジェクトのスコープに含まれていた作業を，外部要因（連携先のリリース延期）を理由に別プロジェクトへ切り出す，すなわちプロジェクトのスコープ（作業範囲）自体を変更する対応であり，スコープコントロールの典型例である。</p><p>アはスケジュール（教育期間）の調整であり時間管理の活動，イはコストの再見積りと予算確保でありコストマネジメントの活動，エは要員の交代であり人的資源マネジメントの活動であって，いずれもスコープ（作業範囲）そのものの変更ではない。</p>","mnemonic":""},{"id":438,"year":2018,"period":"平成30年度春期","num":19,"cat":"マネジメント系","field":"ITサービスマネジメント","summary":"ITサービスマネジメント：平成30年度春期 問19","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>JIS Q 20000-1:2012（サービスマネジメントシステム要求事項）は，サービスマネジメントシステム（以下，SMSという）及びサービスのあらゆる場面でPDCA方法論の適用を要求している。SMSの実行（Do）の説明はどれか。</p>","choices":[{"label":"ア","html":"SMS及びサービスのパフォーマンスを継続的に改善するための処置を実施する。"},{"label":"イ","html":"SMSを確立し，文書化し，合意する。"},{"label":"ウ","html":"サービスの設計，移行，提供及び改善のためにSMSを導入し，運用する。"},{"label":"エ","html":"方針，目的，計画及びサービスの要求事項について，SMS及びサービスを監視，測定及びレビューし，それらの結果を報告する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIS Q 20000-1はサービスマネジメントシステムの確立・導入・運用・監視・レビュー・維持・改善にPDCAサイクルを適用することを求めている。このうちDo（実行）の段階は，Plan（計画）の段階で確立・文書化・合意されたSMSを，サービスの設計，移行，提供及び改善のために実際に導入し，運用する段階である。選択肢ウはこのDoの定義に一致する。</p><p>アは継続的改善の処置を指しておりAct（処置・改善）の段階，イはSMSの確立・文書化・合意でありPlan（計画）の段階，エは監視・測定・レビュー・報告でありCheck（点検）の段階の説明であって，いずれもDo（実行）とは異なるPDCAの段階を表している。</p>","mnemonic":""},{"id":439,"year":2018,"period":"平成30年度春期","num":20,"cat":"マネジメント系","field":"ITサービスマネジメント(構成管理)","summary":"ITサービスマネジメント(構成管理)：平成30年度春期 問20","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>JIS Q 20000-2:2013（サービスマネジメントシステムの適用の手引）によれば，構成管理プロセスの活動として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"構成品目の総所有費用及び総減価償却費用の計算"},{"label":"イ","html":"構成品目の特定，管理，記録，追跡，報告及び検証，並びにCMDBでのCI情報の管理"},{"label":"ウ","html":"正しい場所及び時間での構成品目の配付"},{"label":"エ","html":"変更管理方針で定義された構成品目に対する変更要求の管理"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>構成管理（コンフィギュレーションマネジメント）プロセスは，サービスを構成する資産やコンポーネントであるCI（構成品目）を適切に特定・管理し，その情報をCMDB（構成管理データベース）に記録・追跡・報告・検証することによって，正確な構成情報をいつでも把握できるようにする活動である。選択肢イはこの一連の活動を的確に表している。</p><p>アは資産管理（ITAM）における費用管理の観点，ウはリリース及び展開管理プロセスにおける配付作業，エは変更管理プロセスの活動であり，いずれも構成管理プロセス固有の活動ではなく，関連する別のプロセスの活動である。</p>","mnemonic":""},{"id":440,"year":2018,"period":"平成30年度春期","num":21,"cat":"マネジメント系","field":"システム監査","summary":"システム監査：平成30年度春期 問21","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>企業において整備したシステム監査規程の最終的な承認者として，最も適切な者は誰か。</p>","choices":[{"label":"ア","html":"監査対象システムの利用部門の長"},{"label":"イ","html":"経営者"},{"label":"ウ","html":"情報システム部門の長"},{"label":"エ","html":"被監査部門の長"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査規程は，組織全体におけるシステム監査の目的，監査人の権限と責任，監査の実施体制などを定める全社的な規程であり，システム監査基準でも監査の実施体制の整備や監査規程の制定は組織のトップマネジメントの責任とされている。監査の独立性・客観性を担保するためにも，監査対象部門や情報システム部門といった被監査側の長ではなく，組織全体を統括する経営者が最終的に承認することが最も適切である。</p><p>ア・ウ・エはいずれも監査対象となりうる特定部門の長であり，自らが監査を受ける可能性がある立場の者が監査規程を最終承認すると，監査の独立性が損なわれるおそれがあるため適切ではない。</p>","mnemonic":""},{"id":441,"year":2018,"period":"平成30年度春期","num":22,"cat":"マネジメント系","field":"システム監査(可用性)","summary":"システム監査(可用性)：平成30年度春期 問22","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>マスタファイル管理に関するシステム監査項目のうち，可用性に該当するものはどれか。</p>","choices":[{"label":"ア","html":"マスタファイルが置かれているサーバを二重化し，耐障害性の向上を図っていること"},{"label":"イ","html":"マスタファイルのデータを複数件まとめて検索・加工するための機能が，システムに盛り込まれていること"},{"label":"ウ","html":"マスタファイルのメンテナンスは，特権アカウントを付与された者だけに許されていること"},{"label":"エ","html":"マスタファイルへのデータ入力チェック機能が，システムに盛り込まれていること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>情報セキュリティにおける可用性（availability）とは，必要なときに情報システムやデータが中断することなく利用できる状態を確保することを指す。選択肢アのように，マスタファイルを置くサーバを二重化して耐障害性（フォールトトレランス）を高めることは，サーバ障害が発生してもシステムの稼働を継続できるようにする施策であり，まさに可用性を確保するための監査項目である。</p><p>イは利便性・機能性に関する項目，ウは特権アカウントによるアクセス制御でありマスタファイルの不正な変更を防ぐ機密性・完全性に関する項目，エはデータ入力チェックでありデータの正確性を確保する完全性に関する項目であって，いずれも可用性には該当しない。</p>","mnemonic":""},{"id":442,"year":2018,"period":"平成30年度春期","num":23,"cat":"マネジメント系","field":"システム監査/情報戦略","summary":"システム監査/情報戦略：平成30年度春期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>システム管理基準（平成16年）によれば，情報戦略策定段階の成果物はどれか。</p>","choices":[{"label":"ア","html":"関連する他の情報システムと役割を分担し，組織体として最大の効果を上げる機能を実現するために，全体最適化計画との整合性を考慮して策定する開発計画"},{"label":"イ","html":"経営戦略に基づいて組織体全体で整合性及び一貫性を確保した情報化を推進するために，方針及び目標に基づいて策定する全体最適化計画"},{"label":"ウ","html":"情報システムの運用を円滑に行うために，運用設計及び運用管理ルールに基づき，さらに規模，期間，システム特性を考慮して策定する運用手順"},{"label":"エ","html":"組織体として一貫し，効率的な開発作業を確実に遂行するために，組織体として標準化された開発方法に基づいて策定する開発手順"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム管理基準（経済産業省策定）は，情報システムの戦略策定から企画，開発，運用，保守までの各段階で組織体が整備すべき管理の基準を示している。このうち「情報戦略策定段階」は，経営戦略・経営計画に基づいて，組織体全体として整合性及び一貫性を確保した情報化を推進するための方針及び目標を定め，それに基づいて個別システムの開発に先立つ全体最適化計画を策定する段階である。選択肢イはこの全体最適化計画の説明に一致する。</p><p>アは個別システムの開発計画であり企画段階以降の成果物，ウは運用段階の成果物，エは開発段階における開発手順であって，いずれも情報戦略策定段階より後の段階の成果物である。</p>","mnemonic":""},{"id":443,"year":2018,"period":"平成30年度春期","num":24,"cat":"ストラテジ系","field":"生産委託形態(EMS)","summary":"生産委託形態(EMS)：平成30年度春期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>EMS（electronics manufacturing services）の説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"相手先ブランドで販売する電子機器の設計だけを受託し，製造は相手先で行う。"},{"label":"イ","html":"外部から調達した電子機器に付加価値を加えて，自社ブランドで販売する。"},{"label":"ウ","html":"自社ブランドで販売する電子機器のソフトウェア開発だけを外部に委託し，ハードウェアは自社で設計製造する。"},{"label":"エ","html":"生産設備をもつ企業が，他社からの委託を受けて電子機器を製造する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EMS（Electronics Manufacturing Services，電子機器受託製造サービス）とは，自ら生産設備（工場）をもつ企業が，他の企業（発注元）から電子機器の製造を受託し，部品調達から組立て，検査，出荷までの製造工程の一部又は全部を代行するビジネスモデルを指す。発注元は製品の設計やブランドを保持したまま，製造部分をEMS企業に委託することで，自社は研究開発やマーケティングなど中核事業に経営資源を集中できる。選択肢エはこの定義に一致する。</p><p>アは設計受託（製造を自社では行わない形），イは完成品や部品を調達して自社ブランドで販売する形（OEM調達に近い），ウはソフトウェア開発だけの外部委託であり，いずれもEMSの「製造そのものを受託する」という特徴とは異なる。</p>","mnemonic":""},{"id":444,"year":2018,"period":"平成30年度春期","num":25,"cat":"ストラテジ系","field":"調達(RFI)","summary":"調達(RFI)：平成30年度春期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>情報システムの調達の際に作成されるRFIの説明はどれか。</p>","choices":[{"label":"ア","html":"調達者から供給者候補に対して，システム化の目的や業務内容などを示し，必要な情報の提供を依頼すること"},{"label":"イ","html":"調達者から供給者候補に対して，対象システムや調達条件などを示し，提案書の提出を依頼すること"},{"label":"ウ","html":"調達者から供給者に対して，契約内容で取り決めた内容に関して，変更を要請すること"},{"label":"エ","html":"調達者から供給者に対して，双方の役割分担などを確認し，契約の締結を要請すること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>RFI（Request For Information，情報提供依頼書）は，情報システムの調達プロセスの初期段階で，調達者（発注者）が複数の供給者候補に対して，システム化の目的や対象業務の内容などを示し，実現に当たって必要となる技術動向や製品・サービスに関する情報の提供を依頼する文書である。これにより，調達者は市場で実現可能な技術や製品の概要を把握し，後続のRFP（提案依頼書）作成や調達計画の精度を高めることができる。選択肢アはこの説明に一致する。</p><p>イは対象システムや調達条件を示して提案書の提出を求めるものでRFP（Request For Proposal，提案依頼書）の説明であり，ウ・エは契約締結後や契約内容そのものに関するやり取りであって，調達の初期段階で情報収集を目的とするRFIとは異なる。</p>","mnemonic":""},{"id":445,"year":2018,"period":"平成30年度春期","num":26,"cat":"ストラテジ系","field":"PPM","summary":"PPM：平成30年度春期 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>PPMにおいて，投資用の資金源として位置付けられる事業はどれか。</p>","choices":[{"label":"ア","html":"市場成長率が高く，相対的市場占有率が高い事業"},{"label":"イ","html":"市場成長率が高く，相対的市場占有率が低い事業"},{"label":"ウ","html":"市場成長率が低く，相対的市場占有率が高い事業"},{"label":"エ","html":"市場成長率が低く，相対的市場占有率が低い事業"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PPM（プロダクト・ポートフォリオ・マネジメント）は，市場成長率と相対的市場占有率（マーケットシェア）の2軸で事業（製品）を「花形（高成長・高シェア）」「金のなる木（低成長・高シェア）」「問題児（高成長・低シェア）」「負け犬（低成長・低シェア）」の4象限に分類し，経営資源配分の意思決定に用いるフレームワークである。このうち「金のなる木」に該当する，市場成長率が低く相対的市場占有率が高い事業（選択肢ウ）は，既に市場で確固たる地位を築いており，新規投資をあまり必要としない一方で安定的に多くのキャッシュを生み出すため，他の事業（特に「問題児」などの成長事業）への投資用資金の供給源として位置付けられる。</p><p>アの「花形」は高い成長を維持するために多額の投資を必要とする事業，イの「問題児」はシェア拡大のために投資が必要な事業であり，いずれも資金を必要とする側である。エの「負け犬」は成長性・収益性ともに低く，資金源にも投資対象にもなりにくい事業とされる。</p>","mnemonic":""},{"id":446,"year":2018,"period":"平成30年度春期","num":27,"cat":"ストラテジ系","field":"予測手法(デルファイ法)","summary":"予測手法(デルファイ法)：平成30年度春期 問27","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>現在の動向から未来を予測したり，システム分析に使用したりする手法であり，専門的知識や経験を有する複数の人にアンケート調査を行い，その結果を互いに参照した上で調査を繰り返して，集団としての意見を収束させる手法はどれか。</p>","choices":[{"label":"ア","html":"因果関係分析法"},{"label":"イ","html":"クロスセクション法"},{"label":"ウ","html":"時系列回帰分析法"},{"label":"エ","html":"デルファイ法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>デルファイ法は，ある課題について複数の専門家に匿名でアンケート調査（質問票への回答）を行い，得られた回答を集計・要約して参加者全員にフィードバックした上で，再度同じ質問に回答してもらうというプロセスを複数回繰り返すことによって，専門家個々人の意見を互いに参照させながら，特定の個人の権威や発言力に左右されずに集団としての見解を徐々に収束させていく，技術予測や意見集約のための手法である。1950年代に米国のランド研究所で開発されたとされ，将来予測やリスク分析，要件の優先順位付けなど幅広い場面で利用される。</p><p>因果関係分析法や時系列回帰分析法は過去の数値データを統計的に分析して将来を予測する定量的手法であり，クロスセクション法（横断面分析）も特定時点のデータ間の関係を分析する統計的手法であって，いずれも「専門家への反復アンケートによる意見収束」という設問の特徴には当てはまらない。</p>","mnemonic":""},{"id":447,"year":2018,"period":"平成30年度春期","num":28,"cat":"ストラテジ系","field":"資材所要量計画","summary":"資材所要量計画：平成30年度春期 問28","correct":"ウ","result":"","formula":"総所要量＝Σ（上位品の所要数量×構成比），発注量（正味所要量）＝総所要量－現在庫","howto":"部品表（BOM）をたどり，Aから直接必要なCと，Bを経由して間接的に必要なCの両方を合算してから在庫を差し引く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>図は，製品Aの構成部品を示し，括弧内の数字は上位の製品・部品1個当たりの所要数量である。この製品Aを10個生産する場合，部品Cは，少なくとも何個発注する必要があるか。ここで，現在の部品Bの在庫は0個，部品Cの在庫は5個である。</p><p>構成：製品Aの直下に部品B（Aに対して2個必要）と部品C（Aに対して1個必要）。さらに部品Bの直下に部品D（1個），部品E（1個），部品C（1個）がある（部品Cは製品Aの直接の子であると同時に，部品Bを構成する部品としても登場する）。</p>","choices":[{"label":"ア","html":"15"},{"label":"イ","html":"20"},{"label":"ウ","html":"25"},{"label":"エ","html":"30"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Aを10個生産するために必要な部品Bの数量＝10個×2（B/A）＝20個。部品Bの在庫は0個なので，20個全てを新たに生産（＝部品Dと部品Eと部品Cを使って組み立てる）する必要がある。</p><p>部品Cは，①製品Aの直接の構成部品として，②部品Bの構成部品として，の2経路から必要になる。</p><p>①Aから直接必要なC＝10個（A）×1（C/A）＝10個</p><p>②Bから必要なC＝20個（B）×1（C/B）＝20個</p><p>部品Cの総所要量（総需要）＝10＋20＝30個</p><p>部品Cの現在庫は5個なので，発注が必要な数量（正味所要量）＝30－5＝25個</p><p>よって正解はウの25個である。</p>","mnemonic":"Aから10個，Bの20個分からさらに20個，合わせて「さんじゅう（30）」――在庫の5個を引いて「にじゅうご（25）」発注。"},{"id":448,"year":2018,"period":"平成30年度春期","num":29,"cat":"ストラテジ系","field":"固定資産会計","summary":"固定資産会計：平成30年度春期 問29","correct":"エ","result":"","formula":"年間減価償却費＝取得原価×償却率，除却損＝除却時の帳簿価額＋廃棄費用","howto":"2年分の減価償却累計額を取得原価から差し引いて帳簿価額を求め，それに廃棄費用を加算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>取得原価30万円のPCを2年間使用した後，廃棄処分し，廃棄費用2万円を現金で支払った。このときの固定資産の除却損は廃棄費用も含めて何万円か。ここで，耐用年数は4年，減価償却方法は定額法，定額法の償却率は0.250，残存価額は0円とする。</p>","choices":[{"label":"ア","html":"9.5"},{"label":"イ","html":"13.0"},{"label":"ウ","html":"15.0"},{"label":"エ","html":"17.0"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>定額法による年間減価償却費＝取得原価30万円×償却率0.250＝7.5万円／年</p><p>2年間使用した時点での減価償却累計額＝7.5万円×2年＝15万円</p><p>除却時の帳簿価額＝取得原価30万円－減価償却累計額15万円＝15万円</p><p>固定資産を除却すると，その時点の帳簿価額は除却損として計上され，さらに廃棄のために支払った費用2万円も除却損に含めて計上する。</p><p>除却損＝帳簿価額15万円＋廃棄費用2万円＝17万円</p><p>よって正解はエの17.0万円である。</p>","mnemonic":"30万円を4年で割ってまた割って(0.25)，2年分引いたら帳簿は「じゅうご（15）」，廃棄費用2万円足して「じゅうなな（17）」。"},{"id":449,"year":2018,"period":"平成30年度春期","num":30,"cat":"ストラテジ系","field":"法務(刑法)","summary":"法務(刑法)：平成30年度春期 問30","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000fabr-att/2018h30h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2018h30.html","q":"<p>企業のWebサイトに接続してWebページを改ざんし，システムの使用目的に反する動作をさせて業務を妨害する行為を処罰の対象とする法律はどれか。</p>","choices":[{"label":"ア","html":"刑法"},{"label":"イ","html":"特定商取引法"},{"label":"ウ","html":"不正競争防止法"},{"label":"エ","html":"プロバイダ責任制限法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>刑法234条の2には「電子計算機損壊等業務妨害罪」が規定されており，人の業務に使用するコンピュータ（電子計算機）やその電磁的記録を損壊したり，虚偽の情報や不正な指令を与えたりするなどして，コンピュータにその使用目的に反する動作をさせ，又は使用目的に沿う動作をさせないことによって，人の業務を妨害する行為
