I=EV/AC、SPI=EV/PV、TCPI=(BAC-EV)/(BAC-AC)","howto":"各指標が1より大きいか小さいかで予算超過/進捗の遅れ・前倒しを判断し、TCPI&gt;1なら残作業の効率向上が必要と読む","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>EVMを使用してマネジメントをしているプロジェクトで、進捗に関する指標値は次のとおりであった。このプロジェクトに対する適切な評価と対策はどれか。</p><p>〔進捗に関する指標値〕</p><ul><li>CPI(コスト効率指数): 0.9</li><li>SPI(スケジュール効率指数): 1.1</li><li>BAC(完成時総予算)に基づくTCPI(残作業効率指数): 1.2</li></ul>","choices":[{"label":"ア","html":"コストが予算を超えているが、スケジュールには余裕があり、残業のコスト効率を計画よりも上げる必要はないので、CPIに基づいて完成までに必要なコストを予測する。"},{"label":"イ","html":"コストが予算を超えているので、完成時総予算を超過するおそれがあるが、スケジュールには余裕があるので、残業のコスト効率を上げる対策を検討するか、コンティンジェンシー予備費の使用を検討する。"},{"label":"ウ","html":"コストには余裕があるが、スケジュールが予定より遅れており、残業のコスト効率を計画よりも上げる必要があるので、ファストトラッキングなどを用いたスケジュール短縮を検討するとともに、コンティンジェンシー予備費の使用を検討する。"},{"label":"エ","html":"コストには余裕があるので、残業のコスト効率を計画よりも上げる必要はないが、スケジュールが予定より遅れているので、クラッシングなどを用いたスケジュール短縮を検討する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CPI=0.9&lt;1は、投じたコストの割に出来高(EV)が少ない=予算超過の状態を示す。SPI=1.1&gt;1は、計画よりも多くの出来高が出ている=スケジュールが前倒し(余裕がある)状態を示す。TCPI=1.2&gt;1は、当初予算(BAC)内に完成させるには残作業を計画より約1.2倍の効率で実行する必要があることを示し、達成が容易でないことを意味する。</p><p>以上を総合すると、コストは予算を超過しており完成時総予算を超過するおそれがある一方、スケジュールには余裕がある状態である。したがって、残作業のコスト効率を上げる対策の検討や、コンティンジェンシー予備費の使用検討といった対応が適切であり、これはイの記述と一致する。</p><p>アはコストが予算超過にもかかわらず「コスト効率を上げる必要はない」としている点が不適切。ウ・エはスケジュールが遅れているとしている点がSPI=1.1(前倒し)という実際の状況と矛盾しており誤り。</p><p>正解はイ。</p>","mnemonic":"「くてん9(0.9)で予算オーバー、いちいち1(1.1)で進み気味」―CPIが1未満、SPIが1超えの組合せがイの状況。"},{"id":48,"year":2025,"period":"令和7年度春期","num":19,"cat":"マネジメント系","field":"スケジュール短縮(クラッシング)","summary":"スケジュール短縮(クラッシング)：令和7年度春期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>プロジェクトの期間を短縮する方法のうち、クラッシングに該当するものはどれか。</p>","choices":[{"label":"ア","html":"作業の前後関係を組み直し、実施する順番を変える。"},{"label":"イ","html":"作業を分析し、同時に実施できる部分を複数の作業に分割し、並行して実施する。"},{"label":"ウ","html":"先行作業の一部の成果物が完成した時点で、後続作業を開始する。"},{"label":"エ","html":"プロジェクトの外部から要員を調達し、クリティカルパス上の作業に投入する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>クラッシングは、プロジェクトのクリティカルパス上の作業に追加の資源(要員など)を投入することで、コストの増加と引き換えに作業期間を短縮する手法である。設問のエは、外部から要員を調達してクリティカルパス上の作業に投入するという内容であり、これがクラッシングに該当する。</p><p>ア・イ・ウはいずれもファストトラッキング(作業を並行実施して期間短縮を図る手法)やその関連手法の説明であり、資源の追加投入を伴わない点でクラッシングとは異なる。特にイ・ウは作業の依存関係を見直して並行度を高める典型的なファストトラッキングの説明である。</p><p>正解はエ。</p>","mnemonic":""},{"id":49,"year":2025,"period":"令和7年度春期","num":20,"cat":"マネジメント系","field":"SLA(稼働率)","summary":"SLA(稼働率)：令和7年度春期 問20","correct":"イ","result":"","formula":"許容停止時間=サービス提供時間×(1-目標稼働率)","howto":"サービス提供時間の総時間を求め、実績の停止時間と目標の停止時間をそれぞれ計算して差を取る","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>あるサービスでは〔サービス可用性のSLA〕に基づき、サービス可用性の目標値の遵守状況を月ごとに測定して評価している。ある月の実績値は99.3%だった。この月にサービス可用性の目標値を達成するためには、サービス停止時間は、最低、何時間少なければよかったか。</p><p>〔サービス可用性のSLA〕</p><ul><li>サービス可用性の目標値: 99.5%以上</li><li>サービス提供時間帯: 7時〜22時</li><li>サービス提供日数: 20日／月</li></ul>","choices":[{"label":"ア","html":"0.4"},{"label":"イ","html":"0.6"},{"label":"ウ","html":"1.3"},{"label":"エ","html":"1.95"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サービス提供時間帯は7時〜22時の15時間、提供日数は20日／月なので、月間サービス提供時間は 15×20=300時間。</p><p>実績可用性99.3%のときの停止時間は 300×(1-0.993)=300×0.007=2.1時間。目標可用性99.5%のときに許容される停止時間は 300×(1-0.995)=300×0.005=1.5時間。</p><p>目標を達成するには、停止時間を2.1時間から1.5時間まで、少なくとも 2.1-1.5=0.6時間 短縮する必要がある。</p><p>正解はイ(0.6)。</p>","mnemonic":"「ろく(0.6)時間早く直せば合格ライン」―300時間のうち2.1時間止めたのを1.5時間に縮めれば99.5%達成。"},{"id":50,"year":2025,"period":"令和7年度春期","num":21,"cat":"マネジメント系","field":"システム監査技法(ウォークスルー法)","summary":"システム監査技法(ウォークスルー法)：令和7年度春期 問21","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>システム監査におけるウォークスルー法の説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"機密データの保管状況に関する資料及び文書類を入手し、内容を点検する。"},{"label":"イ","html":"システムの運用状況について、関係者に口頭で問い合わせ、回答を入手する。"},{"label":"ウ","html":"データの生成から入力、処理、出力、利活用までのプロセス、及び組み込まれている一連のコントロールを確認する。"},{"label":"エ","html":"テストデータを監査対象プログラムで処理し、期待した結果が出力されるかどうかを確かめる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ウォークスルー法は、データの生成から入力・処理・出力・利活用に至る一連のプロセスと、その中に組み込まれている内部統制(コントロール)を、書面上または実際に追跡して確認するシステム監査技法である。設問のウはこの内容と一致する。</p><p>アは資料や文書を入手して点検する「閲覧(資料・文書の点検)」に近い技法、イは関係者に口頭で問い合わせて回答を得る「インタビュー法(ヒアリング法)」、エは実際にテストデータをプログラムに処理させ結果を確認する「テストデータ法」の説明であり、いずれもウォークスルー法とは異なる監査技法である。</p><p>正解はウ。</p>","mnemonic":""},{"id":51,"year":2025,"period":"令和7年度春期","num":22,"cat":"マネジメント系","field":"システム監査(監査手続)","summary":"システム監査(監査手続)：令和7年度春期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>システム監査における“監査手続”として、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"監査計画の立案や監査業務の進捗管理を行うための手続"},{"label":"イ","html":"監査結果を受けて、監査報告書に監査人の結論や指摘事項を記述する手続"},{"label":"ウ","html":"監査項目について、十分かつ適切な証拠を入手するための手続"},{"label":"エ","html":"監査テーマに合わせて、監査チームを編成する手続"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>監査手続とは、監査人が監査意見・結論の基礎となる十分かつ適切な監査証拠を入手するために実施する一連の作業(質問、閲覧、観察、確認、再計算、分析的手続など)を指す。設問のウはこの定義と一致する。</p><p>アは監査計画の立案・進捗管理という監査業務全体のマネジメントに関する説明であり、証拠入手そのものを指す監査手続とは異なる。イは監査証拠を踏まえて結論や指摘事項を報告書にまとめる「監査報告」の工程であり、監査手続の実施後に行われる別の活動である。エは監査チームの編成という監査の実施体制づくりに関する事項であり、これも監査手続そのものではない。</p><p>正解はウ。</p>","mnemonic":""},{"id":52,"year":2025,"period":"令和7年度春期","num":23,"cat":"ストラテジ系","field":"経営戦略(DX認定制度)","summary":"経営戦略(DX認定制度)：令和7年度春期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>DX認定制度における認定基準に含まれている事項はどれか。</p>","choices":[{"label":"ア","html":"経営ビジョン及びDX戦略を策定して対外発信を行うことに加えて、ビジネスモデルの革新などデジタル技術活用の成果目標も既に達成していること"},{"label":"イ","html":"経営ビジョン及びビジネスモデルの方向性を公表するとともに、策定したビジネスモデルを実現するための方策として、DX戦略を公表していること"},{"label":"ウ","html":"申請対象が、中小企業基本法で定められた中小企業であること"},{"label":"エ","html":"デジタルガバナンス・コード3.0の全項目に対応していること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DX認定制度は「情報処理の促進に関する法律」に基づき、デジタルガバナンス・コードが示す基本的事項(経営ビジョン・ビジネスモデル、戦略、成果指標、ガバナンス体制など)を満たし、それらをステークホルダーに適切に開示している事業者を国が認定する制度である。認定基準の中核は、経営ビジョン及びビジネスモデルの方向性を公表するとともに、それを実現する方策としてのDX戦略を策定・公表していることであり、イの記述と一致する。</p><p>アは「成果目標を既に達成していること」まで求めている点が誤りで、DX認定は戦略を策定・公表し準備が整っている段階の事業者も対象となり、成果の達成そのものは必須要件ではない。ウはDX認定の対象が中小企業に限定されるとしている点が誤りで、大企業を含むあらゆる規模の事業者が申請可能である。エはデジタルガバナンス・コードの全項目への対応を求めているが、実際には基本的事項を満たせば認定対象となり、全項目完全対応までは要求されない。</p><p>正解はイ。</p>","mnemonic":""},{"id":53,"year":2025,"period":"令和7年度春期","num":24,"cat":"ストラテジ系","field":"クラウド調達(プロビジョニング)","summary":"クラウド調達(プロビジョニング)：令和7年度春期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>クラウドサービスなどの提供を迅速に実現するためのプロビジョニングの説明はどれか。</p>","choices":[{"label":"ア","html":"企業の情報システムの企画、設計、開発、導入、保守などのサービスを、一貫して又は工程の幾つかを部分的に提供する。"},{"label":"イ","html":"業種や事業内容などで共通する複数の企業や組織が共同でデータセンターを運用して、それぞれがインターネットを通して各種サービスを利用する。"},{"label":"ウ","html":"自社でハードウェア、ネットワークなどの環境を用意し、業務パッケージなどを導入して利用する運用形態にする。"},{"label":"エ","html":"利用者の需要を予想し、ネットワーク設備やシステムリソースなどを計画的に調達して強化し、利用者の要求に応じたサービスを提供できるように備える。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロビジョニングとは、利用者からの将来の需要を予測したうえで、あらかじめネットワーク設備やシステムリソースなどを計画的に調達・増強しておき、要求があった際に迅速にサービスを提供できるよう備えておく考え方・活動である。クラウドサービスでは、この事前準備によって利用者からの要求に即応した迅速なサービス提供を実現する。設問のエがこの内容に一致する。</p><p>アは情報システムの企画から保守までを請け負うシステムインテグレーション(アウトソーシング)の説明、イは複数組織が共同でデータセンターを利用する共同利用型(コミュニティ型)の形態の説明、ウは自社で環境を用意するオンプレミス型の運用形態の説明であり、いずれもプロビジョニングそのものの定義ではない。</p><p>正解はエ。</p>","mnemonic":""},{"id":54,"year":2025,"period":"令和7年度春期","num":25,"cat":"ストラテジ系","field":"IT契約(準委任型・請負型)","summary":"IT契約(準委任型・請負型)：令和7年度春期 問25","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>ベンダーX社に対して、表に示すように要件定義フェーズから運用テストフェーズまでを委託したい。X社との契約に当たって、“情報システム・モデル取引・契約書＜第二版＞”に照らし、各フェーズの契約形態を整理した。a〜dの契約形態のうち、準委任型が適切であるとされるものはどれか。</p><table border='1' cellpadding='4'><tr><th>要件定義</th><th>システム外部設計</th><th>システム内部設計</th><th>ソフトウェア設計、プログラミング、ソフトウェアテスト</th><th>システム結合</th><th>システムテスト</th><th>運用テスト</th></tr><tr><td>a</td><td>準委任型又は請負型</td><td>b</td><td>請負型</td><td>c</td><td>準委任型又は請負型</td><td>d</td></tr></table>","choices":[{"label":"ア","html":"a, b"},{"label":"イ","html":"a, d"},{"label":"ウ","html":"b, c"},{"label":"エ","html":"b, d"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>“情報システム・モデル取引・契約書＜第二版＞”では、成果物の完成(仕事の完成)を明確に約束しにくい性質をもつ工程は準委任型、成果物の完成を約束できる開発工程は請負型を基本とする契約形態の考え方が示されている。要件定義フェーズは、要件が確定していく過程であり完成責任を明確に負わせにくいため準委任型が適切とされ(a)、運用テストフェーズも、本番相当の環境での検証・調整作業という性質上、仕事の完成を一律に約束しにくいため準委任型が適切とされる(d)。</p><p>一方、システム外部設計・システム内部設計・システム結合・システムテストは、仕様に基づく成果物(設計書やテスト結果など)の完成を約束しやすい工程として、請負型(又は準委任型・請負型のいずれかを選択可能な工程)に位置づけられ、ソフトウェア設計・プログラミング・ソフトウェアテストは明確に請負型とされている。したがって、準委任型が適切であるとされるのはaとdの組合せである。</p><p>正解はイ。</p>","mnemonic":""},{"id":55,"year":2025,"period":"令和7年度春期","num":26,"cat":"ストラテジ系","field":"経営戦略(PPM)","summary":"経営戦略(PPM)：令和7年度春期 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>市場成長率と相対的市場シェアから、市場と企業との関係を分析し、自社製品や事業についての最適な資源配分方針を求めるための手法はどれか。</p>","choices":[{"label":"ア","html":"3C"},{"label":"イ","html":"BSC"},{"label":"ウ","html":"PPM"},{"label":"エ","html":"SWOT"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PPM(プロダクト・ポートフォリオ・マネジメント)は、縦軸に市場成長率、横軸に相対的市場シェアをとった4象限のマトリクスに自社の製品・事業をマッピングし、「花形」「金のなる木」「問題児」「負け犬」に分類することで、どの事業に資源を重点配分し、どこから資金を回収・撤退すべきかを判断するための経営戦略手法である。設問の記述はPPMの定義そのものであり、ウが正解。</p><p>3Cは顧客(Customer)・競合(Competitor)・自社(Company)の3視点で事業環境を分析するフレームワーク、BSCはバランストスコアカードで財務・顧客・業務プロセス・学習と成長の4視点から業績を評価する手法、SWOTは強み・弱み・機会・脅威の4要素を整理する分析手法であり、いずれも市場成長率と相対的市場シェアという2軸で資源配分を決める手法ではない。</p><p>正解はウ。</p>","mnemonic":""},{"id":56,"year":2025,"period":"令和7年度春期","num":27,"cat":"ストラテジ系","field":"ビジネスインダストリ(エッジAI)","summary":"ビジネスインダストリ(エッジAI)：令和7年度春期 問27","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>クラウドで学習し、エッジデバイスで推論する機械学習ベースのエッジAIにおいて、エッジデバイスで行われる推論処理として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"一定の環境の中で試行錯誤を行い、行動に報酬を与えることで学習するプロセス"},{"label":"イ","html":"学習したモデルに従い、実際にデータの識別などを行うプロセス"},{"label":"ウ","html":"識別などを行うためのモデルを、正解のラベルを付けたデータによって作成するプロセス"},{"label":"エ","html":"識別などを行うためのモデルを、正解のラベルを付けないデータによって作成するプロセス"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>エッジAIでは、計算資源の大きいクラウド側でモデルの学習を行い、現場のエッジデバイス側では、その学習済みモデルを使って実際の入力データに対する識別・判定を行う「推論」のみを担う構成が一般的である。これにより通信の往復がなくなり低遅延で処理でき、通信量やプライバシーの面でも有利になる。設問のイは、学習済みモデルに従ってデータの識別などを行うプロセスであり、これが推論処理の説明として適切である。</p><p>アは試行錯誤と報酬によってモデル自体を更新していく強化学習のプロセス、ウは正解ラベル付きデータからモデルを作成する教師あり学習のプロセス、エは正解ラベルなしデータからモデルを作成する教師なし学習のプロセスであり、いずれも「モデルを作る(学習する)」工程の説明であって、学習済みモデルを使う「推論」の説明ではない。</p><p>正解はイ。</p>","mnemonic":""},{"id":57,"year":2025,"period":"令和7年度春期","num":28,"cat":"ストラテジ系","field":"ビジネスインダストリ(スマートファクトリー)","summary":"ビジネスインダストリ(スマートファクトリー)：令和7年度春期 問28","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>スマートファクトリーで使用されるAIを用いたマシンビジョンの目的として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"クラウドに蓄積した入出荷データを用いてAIが需要予測し、生産数を最適化する。"},{"label":"イ","html":"作業者が装着したVRゴーグルにAIが作業状況に応じたガイドを表示することによって、作業効率を向上させる。"},{"label":"ウ","html":"設計変更内容をAIによって整理し、製造現場に正確に伝達する。"},{"label":"エ","html":"人間の目視検査をAIが代替し、検査効率を向上させる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>マシンビジョンは、カメラなどで取得した画像をAI(主に画像認識技術)で解析し、製品の外観検査や欠陥検出などを自動で行う技術である。従来、人手による目視検査で行っていた作業をAIによる画像認識で代替することにより、検査の均質性を保ちながら検査効率を高めることができる。設問のエはこの内容と一致する。</p><p>アは入出荷データに基づく需要予測の話で画像認識(マシンビジョン)とは直接関係しない。イはAR/VRゴーグルを用いた作業ガイド表示の話であり、画像を解析して判定するマシンビジョンの用途とは異なる。ウは設計変更情報の整理・伝達という文書・データ処理の話であり、画像処理による検査とは異なる。</p><p>正解はエ。</p>","mnemonic":""},{"id":58,"year":2025,"period":"令和7年度春期","num":29,"cat":"ストラテジ系","field":"損益分岐点分析(変動費計算)","summary":"損益分岐点分析(変動費計算)：令和7年度春期 問29","correct":"ウ","result":"","formula":"利益=売上高×(1-変動費率)-固定費、変動費=売上高×変動費率","howto":"2組の(売上高,利益)のデータから連立方程式で変動費率と固定費を求め、求める売上高での変動費を計算する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>売上高が7,000万円のとき、200万円の損失、売上高が9,000万円のとき、600万円の利益と予想された。売上高が8,000万円のときの変動費は何万円か。ここで、売上高が変わっても変動費率は変わらないものとする。</p>","choices":[{"label":"ア","html":"3,200"},{"label":"イ","html":"4,000"},{"label":"ウ","html":"4,800"},{"label":"エ","html":"5,600"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>変動費率をv、固定費をFとすると、利益=売上高×(1-v)-Fと表せる。</p><p>売上高7,000万円のとき: 7000×(1-v)-F=-200 …①</p><p>売上高9,000万円のとき: 9000×(1-v)-F=600 …②</p><p>②-①より、2000×(1-v)=800、(1-v)=0.4、よってv=0.6(変動費率60%)。</p><p>①に代入: 7000×0.4-F=-200 → 2800-F=-200 → F=3000(固定費3,000万円)。</p><p>売上高8,000万円のときの変動費=8000×0.6=4,800万円。</p><p>正解はウ(4,800)。</p>","mnemonic":"「ろく(6)割が変動費、はっせん(8,000)に掛ければ よんせんはっぴゃく(4,800)」―変動費率60%を売上8,000万円に掛けるだけ。"},{"id":59,"year":2025,"period":"令和7年度春期","num":30,"cat":"ストラテジ系","field":"著作権法(生成AI)","summary":"著作権法(生成AI)：令和7年度春期 問30","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>著作権法及び関連法令によれば、生成AIを利用して画像を生成する行為又はその生成物の利用が著作権侵害にあたるか否かに関して、適切な記述はどれか。</p>","choices":[{"label":"ア","html":"AIが既存の著作権で保護されている画像をデータセットとして学習している場合は、そのAIを利用して画像を生成すると、いかなる場合も著作権侵害になる。"},{"label":"イ","html":"AIを利用して生成した画像が著作権で保護された既存の画像と類似しており、それを公開した場合、著作権侵害となる可能性がある。"},{"label":"ウ","html":"AIを利用して生成した画像は、AIが自動的に創作したものであるため、いかなる状況でも著作権の対象外となり、著作権侵害の懸念は生じない。"},{"label":"エ","html":"AIを利用して生成した画像は、生成した本人の私的使用に限って、利用が認められており、商業利用を行った場合は、いかなる場合も著作権侵害となる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>文化庁・内閣府が示す考え方では、生成AIをめぐる著作権の問題は「AI開発・学習段階」と「生成・利用段階」に分けて検討する必要があるとされる。生成・利用段階においては、通常の著作権侵害の判断と同様、生成された画像等が既存の著作物と類似性・依拠性を有していれば著作権侵害となり得るとされており、設問のイはこの考え方と一致する。</p><p>アは、学習データに保護著作物が含まれていたとしても、生成された画像が既存著作物と類似性・依拠性を欠く場合には必ずしも著作権侵害とならないため、「いかなる場合も侵害になる」という断定は誤りである。ウは、AI生成物であっても通常の著作権侵害の判断枠組み(類似性・依拠性)が適用され得るため、「いかなる状況でも著作権の対象外」という記述は誤りである。エは、著作権侵害の成否は利用が私的使用か商業利用かという利用目的だけで一律に決まるものではなく、独自性のある生成物を商業利用しても侵害にならない場合があるため、「商業利用は、いかなる場合も著作権侵害となる」という断定は誤りである。</p><p>正解はイ。</p>","mnemonic":""},{"id":60,"year":2024,"period":"令和6年度秋期","num":1,"cat":"テクノロジ系","field":"交差検証","summary":"交差検証：令和6年度秋期 問1","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>AIにおける教師あり学習での交差検証に関する記述はどれか。</p>","choices":[{"label":"ア","html":"過学習を防ぐために，回帰モデルに複雑さを表すペナルティ項を加え，訓練データへ過剰に適合しないようにモデルを調整する。"},{"label":"イ","html":"学習の精度を高めるために，複数の異なるアルゴリズムのモデルで学習し，学習の結果は組み合わせて評価する。"},{"label":"ウ","html":"学習モデルの汎化性能を高めるために，単一のモデルで関連する複数の課題を学習することによって，課題間に共通する要因を獲得する。"},{"label":"エ","html":"学習モデルの汎化性能を評価するために，データを複数のグループに分割し，一部を学習に残りを評価に使い，順にグループを入れ替えて学習と評価を繰り返す。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。交差検証（クロスバリデーション、特にk分割交差検証）とは、手元のデータを複数（k個）のグループ（フォールド）に分割し、そのうち1つを検証用、残りを学習用として学習・評価を行うことを、検証用グループを順に入れ替えながらk回繰り返す手法である。これにより、限られたデータでも学習に使わなかったデータでモデルを評価でき、未知データに対する予測性能（汎化性能）を偏りなく見積もることができる。単一の学習・テスト分割よりも評価のばらつきが小さく、過学習の発見にも役立つ。アは過学習を防ぐための「正則化」の説明であり交差検証そのものではない。イは複数モデルの結果を組み合わせる「アンサンブル学習」の説明、ウは複数の関連課題を同時に学習する「マルチタスク学習」の説明であり、いずれも交差検証とは異なる技法である。</p>","mnemonic":""},{"id":61,"year":2024,"period":"令和6年度秋期","num":2,"cat":"テクノロジ系","field":"逆ポーランド記法","summary":"逆ポーランド記法：令和6年度秋期 問2","correct":"ウ","result":"","formula":"逆ポーランド記法＝優先順位の高い演算を先に奥（内側）へ押し込み，優先順位の低い演算を最後に外側へ出す","howto":"乗算B×Cを先にBC×へ変換し，それを一つの項とみなしてA＋(BC×)をA BC×＋の形にする","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>式A＋B×Cの逆ポーランド表記法による表現として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"＋×ＣＢＡ"},{"label":"イ","html":"×＋ＡＢＣ"},{"label":"ウ","html":"ＡＢＣ×＋"},{"label":"エ","html":"ＣＢＡ＋×"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。逆ポーランド表記法（後置記法）では演算子をオペランドの後ろに置く。式A＋B×Cは演算子の優先順位から（A＋(B×C)）と同じであり，まず優先順位の高い乗算B×CをBC×に変換する。次にこの結果を1つの値とみなし，加算A＋(BC×)を後置記法にするとA(BC×)＋，すなわちA BC×＋となる。スタックを使ったアルゴリズムで検算しても，入力順A,B,C,×,＋に対してスタックは[A]→[A,B]→[A,B,C]→×でB,Cを取り出し掛けてABC×を積む→[A,BC×]→＋でA,BC×を取り出し足してABC×＋を得る，という流れになりウと一致する。ア・イ・エはいずれも演算子の順序がA＋B×Cの計算順序と対応しない誤った並びである。</p>","mnemonic":"「エービーシーかける足す（ABC×＋）」―掛け算BCを先に奥へ押し込み，最後に足し算＋を外側にくっつけると覚える。"},{"id":62,"year":2024,"period":"令和6年度秋期","num":3,"cat":"テクノロジ系","field":"ハッシュ関数","summary":"ハッシュ関数：令和6年度秋期 問3","correct":"イ","result":"","formula":"a mod n = b mod n ⇔ (a－b) はnの倍数","howto":"ハッシュ値が一致する（衝突する）条件を，合同式 a≡b (mod n) として捉え，差 a－b がnの倍数になるかどうかを確認する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>自然数をキーとするデータを，ハッシュ表を用いて管理する。キーxのハッシュ関数h(x)を</p><p style=\"margin-left:2em\">h(x) = x mod n</p><p>とすると，任意のキーaとbが衝突する条件はどれか。ここで，nはハッシュ表の大きさであり，x mod nはxをnで割った余りを表す。</p>","choices":[{"label":"ア","html":"a＋bがnの倍数"},{"label":"イ","html":"a－bがnの倍数"},{"label":"ウ","html":"nがa＋bの倍数"},{"label":"エ","html":"nがa－bの倍数"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。キーaとbが衝突するのは，ハッシュ値h(a)とh(b)が一致するとき，すなわちa mod n = b mod nが成り立つときである。これは合同式でa≡b (mod n)と表され，この関係はa－bがnの倍数であることと数学的に同値である（例えばa＝13, b＝5, n＝4のとき，13 mod 4＝1, 5 mod 4＝1で衝突し，a－b＝8は4の倍数になっている）。ア「a＋bがnの倍数」やウ・エのように，n自体がa＋bやa－bの倍数になる条件は，a mod nとb mod nが一致することとは一般に無関係であり，衝突条件としては成り立たない。</p>","mnemonic":"「えーまいなすびー（a－b）がnの子分（倍数）」なら，同じ巣穴（バケット）で衝突すると覚える。"},{"id":63,"year":2024,"period":"令和6年度秋期","num":4,"cat":"テクノロジ系","field":"キャッシュメモリ","summary":"キャッシュメモリ：令和6年度秋期 問4","correct":"イ","result":"","formula":"実効アクセス時間 = ヒット率×キャッシュアクセス時間 ＋ (1－ヒット率)×主記憶アクセス時間","howto":"主記憶のアクセス時間を1として，ヒット率で加重平均する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>キャッシュメモリのアクセス時間が主記憶のアクセス時間の1/30で，ヒット率が95%のとき，実効メモリアクセス時間は，主記憶のアクセス時間の約何倍になるか。</p>","choices":[{"label":"ア","html":"0.03"},{"label":"イ","html":"0.08"},{"label":"ウ","html":"0.37"},{"label":"エ","html":"0.95"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。主記憶のアクセス時間を1とすると，キャッシュメモリのアクセス時間は1/30である。実効アクセス時間は，ヒットした場合（確率95%）はキャッシュのアクセス時間，ミスした場合（確率5%）は主記憶のアクセス時間がかかるとして加重平均することで求める。計算すると，0.95×(1/30)＋0.05×1 ＝ 0.0317＋0.05 ＝ 0.0817 ≒ 0.08倍となる。したがって主記憶のアクセス時間の約0.08倍がイの答えとなる。</p>","mnemonic":"ヒット率95%×1/30＋ミス率5%×1＝0.0317+0.05=0.08倍でイ。"},{"id":64,"year":2024,"period":"令和6年度秋期","num":5,"cat":"テクノロジ系","field":"Webサーバの信頼性","summary":"Webサーバの信頼性：令和6年度秋期 問5","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>Webアプリケーションサーバの信頼性に関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"コールドスタンバイ構成で稼働しているサーバに障害が発生した場合，サービスは中断しないが，トランザクションは継続できない。"},{"label":"イ","html":"コールドスタンバイ構成で稼働しているサーバに障害が発生した場合，サービスは中断するが，トランザクションは継続できる。"},{"label":"ウ","html":"セッションを共有しないクラスタ構成で1台のサーバに障害が発生した場合，サービスは継続できないが，トランザクションは継続できる。"},{"label":"エ","html":"セッションを共有するクラスタ構成で1台のサーバに障害が発生した場合，サービス及びトランザクションは継続できる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。複数のサーバでセッション情報（ログイン状態や処理途中の状態）を共有するクラスタ構成を組んでおけば，1台のサーバに障害が発生しても，他のサーバがそのセッション情報を引き継いで処理を継続できるため，サービスの継続とトランザクションの継続の両方が実現できる。アとイのコールドスタンバイ構成は，普段は待機系サーバを起動しておらず，障害発生後に起動・切り替えを行うため，その間サービスは必ず中断し，実行中だったトランザクションも引き継げず継続できない。したがってア・イは誤り。ウのセッションを共有しないクラスタ構成では，障害が起きたサーバが保持していたセッション情報が失われるため，そのサーバで処理中だったトランザクションは継続できず，利用者から見てもサービスが一時的に継続できない状態になる。</p>","mnemonic":""},{"id":65,"year":2024,"period":"令和6年度秋期","num":6,"cat":"テクノロジ系","field":"仮想記憶方式","summary":"仮想記憶方式：令和6年度秋期 問6","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>仮想記憶方式において，セグメンテーション方式と比較した場合のページング方式の長所はどれか。</p>","choices":[{"label":"ア","html":"記憶領域へのアクセス保護を論理的な単位で行うことができる。"},{"label":"イ","html":"記憶領域をプログラム間で容易に共用することができる。"},{"label":"ウ","html":"実行時に記憶領域の大きさを動的に変えることができる。"},{"label":"エ","html":"主記憶の外部断片化が発生しない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。ページング方式は，主記憶をページと呼ばれる固定長の単位に分割して管理する方式であり，どのページも同じ大きさなので，空き領域に過不足なく詰め込むことができ，主記憶上に使用できない小さな隙間（外部断片化）が発生しない。これがセグメンテーション方式に対するページング方式の代表的な長所である。一方セグメンテーション方式は，プログラムの意味的なまとまり（セグメント）という可変長の単位で管理するため，確保・解放を繰り返すと主記憶上に小さな未使用領域が点在する外部断片化が起こりやすい。ア（論理的な単位でのアクセス保護）やイ（プログラム間での容易な共用），ウ（実行時の記憶領域の動的な大きさ変更）は，意味のあるまとまりを単位とするセグメンテーション方式の方が得意とする特徴であり，ページング方式の長所としては適切ではない。</p>","mnemonic":""},{"id":66,"year":2024,"period":"令和6年度秋期","num":7,"cat":"テクノロジ系","field":"コンパイラ","summary":"コンパイラ：令和6年度秋期 問7","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>手続型言語のコンパイラがコード生成までに行う処理のうち，最後に行うものはどれか。</p>","choices":[{"label":"ア","html":"意味解析"},{"label":"イ","html":"構文解析"},{"label":"ウ","html":"最適化"},{"label":"エ","html":"字句解析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。手続型言語のコンパイラは一般に，ソースプログラムをトークン列に分解する「字句解析」，トークン列の文法的な構造を解析して構文木を作る「構文解析」，変数の型や宣言などの意味的な整合性を確認する「意味解析」，そして無駄な処理を取り除いたり効率の良いコードに書き換えたりする「最適化」という順序で処理を進め，その後にコード生成（目的コードの出力）を行う。したがって，コード生成の直前（4つの処理の中で最後）に行われるのは最適化であり，答えはウとなる。エの字句解析は最初に行われる処理，イの構文解析は字句解析の次，アの意味解析は構文解析の次に行われる処理であり，いずれも最適化より前の段階である。</p>","mnemonic":""},{"id":67,"year":2024,"period":"令和6年度秋期","num":8,"cat":"テクノロジ系","field":"アクチュエーター","summary":"アクチュエーター：令和6年度秋期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>アクチュエーターの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"与えられた目標値と，センサーから得られた制御量を比較し，制御量を目標値に一致させるように操作量を出力する。"},{"label":"イ","html":"位置，角度，速度，加速度，力，温度などを検出し，電気的な情報に変換する。"},{"label":"ウ","html":"エネルギー源からのパワーを，回転，直進などの動きに変換する。"},{"label":"エ","html":"マイクロフォン，センサーなどが出力する微小な電気信号を増幅する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。アクチュエーターとは，電気・油圧・空気圧などのエネルギー源から得られる動力（パワー）を，回転運動や直進運動などの機械的な動きに変換する装置であり，モーターやシリンダーなどがその例である。アは制御系におけるコントローラ（制御器）の働きの説明，イは物理量を電気信号に変換する「センサー」の説明，エは微小な電気信号を増幅する「増幅器（アンプ）」の説明であり，いずれもアクチュエーターとは異なる構成要素の説明である。制御システムでは，センサーで対象の状態を検出し，コントローラが目標値との差から操作量を決め，アクチュエーターがその操作量どおりに実際に対象を動かす，という役割分担になっている。</p>","mnemonic":""},{"id":68,"year":2024,"period":"令和6年度秋期","num":9,"cat":"テクノロジ系","field":"動画の帯域幅計算","summary":"動画の帯域幅計算：令和6年度秋期 問9","correct":"エ","result":"","formula":"帯域幅 ＝ 横ピクセル数 × 縦ピクセル数 × 色深度(ビット) × フレームレート","howto":"1フレームあたりのビット数（画素数×色ビット数）を求め，それに1秒あたりのフレーム数を掛ける","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>800×600ピクセル，24ビットカラーで30フレーム／秒の動画像の配信に最小限必要な帯域幅はおよそ幾らか。ここで，通信時にデータ圧縮は行わないものとする。</p>","choices":[{"label":"ア","html":"350kビット／秒"},{"label":"イ","html":"3.5Mビット／秒"},{"label":"ウ","html":"35Mビット／秒"},{"label":"エ","html":"350Mビット／秒"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。1フレームの画素数は800×600＝480,000ピクセルで，24ビットカラーなので1フレームのデータ量は480,000×24＝11,520,000ビット（約11.52Mビット）になる。これが1秒間に30フレーム配信されるので，必要な帯域幅は11,520,000×30＝345,600,000ビット／秒，すなわち約345.6Mビット／秒となり，選択肢の中では350Mビット／秒（エ）に最も近い。圧縮を行わない前提なので，この計算値がそのまま最小限必要な帯域幅となる。</p>","mnemonic":"800×600×24bit×30fps=345,600,000ビット/秒、一番近い350Mビット/秒でエ。"},{"id":69,"year":2024,"period":"令和6年度秋期","num":10,"cat":"テクノロジ系","field":"データベース設計","summary":"データベース設計：令和6年度秋期 問10","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>化粧品の製造を行っているA社では，販売代理店を通じて商品販売を行っている。今後の販売戦略に活用するために，次の三つの表を設計した。これらの表を用いるだけでは得ることのできない情報はどれか。</p><p><b>顧客</b></p><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th>顧客ID</th><th>氏名</th><th>性別</th><th>生年月日</th></tr></table><p><b>販売代理店別日別販売</b></p><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th>販売代理店ID</th><th>日付</th><th>商品ID</th><th>販売数量</th></tr></table><p><b>商品購入</b></p><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th>顧客ID</th><th>販売代理店ID</th><th>商品ID</th><th>購入数量</th></tr></table>","choices":[{"label":"ア","html":"商品ごとの販売数量の日別差異"},{"label":"イ","html":"性別ごとの売れ筋商品"},{"label":"ウ","html":"販売代理店ごとの購入者数の日別差異"},{"label":"エ","html":"販売代理店ごとの売れ筋商品"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。「販売代理店ごとの購入者数の日別差異」を求めるには，販売代理店ごと・日付ごとに，何人の顧客が購入したかを集計する必要がある。ところが，顧客の購入実績を記録している「商品購入」表には日付の項目がなく，日別に購入者数を集計することができない。一方，日付を持つ「販売代理店別日別販売」表には顧客ID（購入者を特定する情報）がなく，販売数量の合計しか分からない。したがって，この三つの表を組み合わせても「日別の購入者数」という情報は得られない。アの商品ごとの販売数量の日別差異は「販売代理店別日別販売」表を商品IDと日付で集計すれば得られる。イの性別ごとの売れ筋商品は「顧客」表の性別と「商品購入」表の商品ID・購入数量を顧客IDで結合すれば得られる。エの販売代理店ごとの売れ筋商品も「商品購入」表（または「販売代理店別日別販売」表）を販売代理店IDと商品IDで集計すれば得られる。</p>","mnemonic":""},{"id":70,"year":2024,"period":"令和6年度秋期","num":11,"cat":"テクノロジ系","field":"DNS","summary":"DNS：令和6年度秋期 問11","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>DNSに関する記述のうち，適切なものはどれか。</p>","choices":[{"label":"ア","html":"DNSサーバのホスト名を登録するレコードをMXレコードという。"},{"label":"イ","html":"DNSサーバに問い合わせを行うソフトウェアをレゾリューションという。"},{"label":"ウ","html":"IPアドレスに対応するホスト名を調べることを逆引きという。"},{"label":"エ","html":"ホスト名に対し別名を登録するレコードをNSレコードという。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。DNSにおいて，ホスト名からIPアドレスを調べる通常の問合せを「正引き」というのに対し，IPアドレスからホスト名を調べることを「逆引き」といい，PTRレコードを用いて実現される。アについて，メールサーバを示すレコードはMXレコードであり，DNSサーバのホスト名を登録するのはNSレコードであるため誤り。イについて，DNSサーバに問い合わせを行うソフトウェア（クライアント側の仕組み）は「リゾルバ（resolver）」と呼ばれ，「レゾリューション」ではないため誤り。エについて，ホスト名に別名を付けるレコードはCNAMEレコードであり，NSレコードはDNSサーバ（ネームサーバ）のホスト名を登録するためのレコードであるため誤り。</p>","mnemonic":""},{"id":71,"year":2024,"period":"令和6年度秋期","num":12,"cat":"テクノロジ系","field":"ARPコマンド","summary":"ARPコマンド：令和6年度秋期 問12","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>IPv4のLANに接続されているプリンターのMACアドレスを，同一LAN上のPCから調べるときに使用するコマンドはどれか。ここで，PCはこのプリンターを直前に使用しており，プリンターのIPアドレスは分かっているものとする。</p>","choices":[{"label":"ア","html":"arp"},{"label":"イ","html":"ipconfig又はifconfig"},{"label":"ウ","html":"netstat"},{"label":"エ","html":"ping"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。arpコマンドは，直前に通信を行ったことでPC内に保持されているARPテーブル（IPアドレスとMACアドレスの対応表）の内容を表示するコマンドである。プリンターのIPアドレスが分かっており，かつ直前にそのプリンターと通信している（ARPテーブルに情報が残っている）という設問の条件から，arp -aのようなコマンドを使えば，該当するIPアドレスに対応するMACアドレスを確認できる。イのipconfig／ifconfigは自分自身（PC）のネットワーク設定を確認するコマンド，ウのnetstatは自分のPCの通信状況や接続状態を確認するコマンド，エのpingは相手に対する疎通確認（到達性の確認）を行うコマンドであり，いずれも相手のMACアドレスを直接調べる手段としては適切ではない。</p>","mnemonic":""},{"id":72,"year":2024,"period":"令和6年度秋期","num":13,"cat":"テクノロジ系","field":"ディープフェイク攻撃","summary":"ディープフェイク攻撃：令和6年度秋期 問13","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ディープフェイクを悪用した攻撃に該当するものはどれか。</p>","choices":[{"label":"ア","html":"AI技術によって加工したCEOの音声を使用して従業員に電話をかけ，指定した銀行口座に送金するよう指示した。"},{"label":"イ","html":"企業のPCをランサムウェアに感染させ，暗号化したデータを復号するための鍵と引き換えに，指定した方法で暗号資産を送付するよう指示した。"},{"label":"ウ","html":"企業の秘密情報を含むデータを不正に取得したと誤認させる電子メールを従業員に送付し，不正に取得したデータを公開しないことと引き換えに，指定した方法で暗号資産を送付するよう指示した。"},{"label":"エ","html":"ディープウェブにて入手した認証情報でCEOの電子メールアカウントに不正にログインして偽りの電子メールを従業員に送付し，指定した銀行口座に送金するよう指示した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。ディープフェイクとは，AI（深層学習）技術を用いて人物の音声や映像を本人そっくりに加工・合成する技術であり，これを悪用してCEOなど実在の人物になりすました偽の音声を作り，電話で従業員に送金を指示する詐欺が実際に海外で発生している。この手口はまさにAIで合成した音声を使ってなりすます攻撃であり，ディープフェイクの悪用に該当する。イはランサムウェア感染を用いた身代金要求（ランサムウェア攻撃），ウは情報窃取を装う，または実際に窃取した情報を使った脅迫（二重恐喝型のランサムウェアに類する手口や脅迫メール），エは窃取した認証情報を使ったアカウント乗っ取り（ビジネスメール詐欺の一種）であり，いずれもAIによる音声・映像の合成というディープフェイク特有の技術は使われていない。</p>","mnemonic":""},{"id":73,"year":2024,"period":"令和6年度秋期","num":14,"cat":"テクノロジ系","field":"CVE識別子","summary":"CVE識別子：令和6年度秋期 問14","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>JVNなどの脆弱性情報サイトで採用されているCVE（Common Vulnerabilities and Exposures）識別子の説明はどれか。</p>","choices":[{"label":"ア","html":"コンピュータで必要なセキュリティ設定項目を識別するための識別子"},{"label":"イ","html":"脆弱性が悪用されて改ざんされたWebサイトのスクリーンショットを識別するための識別子"},{"label":"ウ","html":"製品に含まれる脆弱性を識別するための識別子"},{"label":"エ","html":"セキュリティ製品の種別を識別するための識別子"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。CVE（Common Vulnerabilities and Exposures）は，個別の製品に含まれる既知の脆弱性一つひとつに対して「CVE-西暦年-通番」という形式の一意な識別番号（CVE-ID）を付与する仕組みであり，米国の非営利団体MITREが採番を管理し，日本ではIPAとJPCERT/CCが共同運営するJVNもこれと連携している。同じ脆弱性について異なる組織・ベンダーが別々の呼び方をしていても，CVE番号を使えば共通の識別子として相互に参照でき，脆弱性対策情報の共有や管理に役立てられる。アはセキュリティ設定項目の識別子であるCCE（Common Configuration Enumeration），エのような製品種別の識別子はCPE（Common Platform Enumeration）の説明に近く，CVEの説明としては誤りである。イのようなスクリーンショットを識別する識別子という仕組みは一般的なセキュリティ標準には存在しない。</p>","mnemonic":""},{"id":74,"year":2024,"period":"令和6年度秋期","num":15,"cat":"テクノロジ系","field":"DNSキャッシュポイズニング対策","summary":"DNSキャッシュポイズニング対策：令和6年度秋期 問15","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>DNSキャッシュポイズニング攻撃に対して有効な対策はどれか。</p>","choices":[{"label":"ア","html":"DNSサーバにおいて，侵入したマルウェアをリアルタイムに隔離する。"},{"label":"イ","html":"DNS問合せに使用するDNSヘッダー内のIDを固定せずにランダムに変更する。"},{"label":"ウ","html":"DNS問合せに使用する送信元ポート番号を53番に固定する。"},{"label":"エ","html":"外部からのDNS問合せに対しては，宛先ポート番号53のものだけに応答する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。DNSキャッシュポイズニング攻撃は，攻撃者がキャッシュDNSサーバになりすましの偽応答パケットを送り込み，正規の応答として受理させることでキャッシュを汚染する攻撃である。偽応答が受理されるには，問合せ時に使われたDNSヘッダー内のトランザクションID（16ビット）と送信元ポート番号を攻撃者が正しく推測（一致させる）必要があるため，問合せのたびにIDをランダムに変更すれば，攻撃者が偽応答を一致させることが極めて困難になり，有効な対策となる（送信元ポート番号のランダム化と組み合わせるとさらに効果的である）。ウのように送信元ポート番号を53番に固定したり，エのように特定の宛先ポートの問合せにしか応答しないようにしたりすることは，推測すべき値を減らして攻撃者に有利になるだけで対策にはならない。アのマルウェアのリアルタイム隔離は，マルウェア感染対策であり，DNSの偽応答を利用したキャッシュポイズニングへの直接的な対策ではない。</p>","mnemonic":""},{"id":75,"year":2024,"period":"令和6年度秋期","num":16,"cat":"テクノロジ系","field":"エクスプロイトコード","summary":"エクスプロイトコード：令和6年度秋期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>エクスプロイトコードの説明はどれか。</p>","choices":[{"label":"ア","html":"攻撃コードとも呼ばれ，ソフトウェアの脆弱性を悪用するコードのことであり，使い方によっては脆弱性の検証に役立つこともある。"},{"label":"イ","html":"マルウェア定義ファイルとも呼ばれ，マルウェアを特定するための特徴的なコードのことであり，マルウェア対策ソフトによるマルウェアの検知に用いられる。"},{"label":"ウ","html":"メッセージとシークレットデータから計算されるハッシュコードのことであり，メッセージの改ざん検知に用いられる。"},{"label":"エ","html":"ログインのたびに変化する認証コードのことであり，不正に取得しても再利用できないので不正アクセスを防ぐ。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。エクスプロイトコード（攻撃コード）とは，ソフトウェアやハードウェアに存在するセキュリティ上の脆弱性を意図的に突いて，不正な動作（権限の奪取，任意のコードの実行など）を起こさせるために作られたプログラムやコードのことである。悪用すればマルウェア感染や情報漏えい，システムの乗っ取りにつながる危険なものだが，裏を返せば実際にその脆弱性が悪用可能かどうかを検証する目的（ペネトレーションテストなど）にも使われることがある。イはマルウェア対策ソフトが使う「パターンファイル（マルウェア定義ファイル）」の説明，ウはメッセージ認証コード（MAC）の説明，エはワンタイムパスワードの説明であり，いずれもエクスプロイトコードとは異なる概念である。</p>","mnemonic":""},{"id":76,"year":2024,"period":"令和6年度秋期","num":17,"cat":"テクノロジ系","field":"使用性の評価指標","summary":"使用性の評価指標：令和6年度秋期 問17","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ソフトウェアの使用性を評価する指標の目標設定の例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"ソフトウェアに障害が発生してから1時間以内に，利用者が使用できること"},{"label":"イ","html":"ソフトウェアの使用方法を，利用者が1時間以内に習得できること"},{"label":"ウ","html":"利用者から要望のある機能の改善を，1週間以内に完了できること"},{"label":"エ","html":"利用者の使用したい機能が，100％提供できていること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。ソフトウェア品質特性でいう「使用性（ユーザビリティ）」は，利用者が製品を効果的・効率的・満足して使用できる度合いを指し，その下位特性の一つに「習得性（learnability）」がある。「利用方法を1時間以内に習得できる」という目標は，まさに習得性という使用性の一側面を定量的に表した例であり，使用性の評価指標の目標設定として適切である。アの障害発生後の復旧時間は，信頼性（特に回復性・可用性）に関する指標であり，使用性の指標ではない。ウの機能改善の完了期限は，保守性やサービスマネジメント上の対応時間に関する指標である。エの機能の提供率100%は，要求された機能がどれだけ実装されているかという「機能適合性」に関する指標であり，いずれも使用性を直接評価するものではない。</p>","mnemonic":""},{"id":77,"year":2024,"period":"令和6年度秋期","num":18,"cat":"マネジメント系","field":"スコープ管理","summary":"スコープ管理：令和6年度秋期 問18","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>プロジェクトマネジメントにおけるスコープの管理の活動はどれか。</p>","choices":[{"label":"ア","html":"開発ツールの新機能の教育が不十分と分かったので，開発ツールの教育期間を2日間延長した。"},{"label":"イ","html":"要件定義が完了した時点で再見積りをしたところ，当初見積もった開発コストを超過することが判明したので，追加予算を確保した。"},{"label":"ウ","html":"連携する計画であった外部システムのリリースが延期になったので，この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。"},{"label":"エ","html":"割り当てたテスト担当者が期待した成果を出せなかったので，経験豊富なテスト担当者と交代した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。プロジェクトのスコープマネジメントとは，プロジェクトで実施すべき作業（成果物やその範囲）を定義し，それを維持・コントロールする活動である。外部システムとの連携作業を，このプロジェクトのスコープから切り離して別プロジェクトで実施することにした，という判断は，プロジェクトで行う作業の範囲（スコープ）そのものを変更する活動であり，スコープの管理に該当する。アは教育期間というスケジュールを延長する活動なのでスケジュールマネジメント，イは予算超過に対応して追加予算を確保する活動なのでコストマネジメント，エは担当者の交代という人的資源（要員）の入れ替えに関する活動なので資源マネジメントに分類され，いずれもスコープの管理には当たらない。</p>","mnemonic":""},{"id":78,"year":2024,"period":"令和6年度秋期","num":19,"cat":"マネジメント系","field":"ファストトラッキング","summary":"ファストトラッキング：令和6年度秋期 問19","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>プロジェクトマネジメントにおけるファストトラッキングの例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"クリティカルパス上のアクティビティの開始が遅れたので，そのアクティビティに人的資源を追加した。"},{"label":"イ","html":"コストを削減するために，これまで承認されていた残業を禁止した。"},{"label":"ウ","html":"仕様の確定が大幅に遅れたので，プロジェクトの完了予定日を延期した。"},{"label":"エ","html":"設計が終わったモジュールから順にプログラム開発を実施するようにして，スケジュールを短縮した。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。ファストトラッキングとは，本来は順番に（直列に）実施する工程やアクティビティを，一部重複させて並行して進めることでスケジュールを短縮するスケジュール短縮技法である。設計が完了したモジュールから順次プログラム開発に着手し，すべての設計が完了するのを待たずに開発を進めるというやり方は，設計工程と開発工程を並行させてスケジュールを短縮する典型的なファストトラッキングの例である。アは遅れたアクティビティに人員（資源）を追加投入してコストをかけて期間短縮を図る「クラッシング」の例，イはコスト削減のための施策であってスケジュール短縮技法ではない。ウは完了予定日自体を延期しており，スケジュールを短縮する活動ではない。</p>","mnemonic":""},{"id":79,"year":2024,"period":"令和6年度秋期","num":20,"cat":"マネジメント系","field":"RTO・RLO","summary":"RTO・RLO：令和6年度秋期 問20","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>サービスマネジメントにおいて，中断したサービスを復旧させるときの目標を定めた指標に，RTO（目標復旧時間），RPO（目標復旧時点）及びRLO（目標復旧レベル）がある。RTOとRLOとを定めた例として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"サービスが中断する3時間前の時点の状態にデータを復旧し，利用者の50%以上にサービスを提供できるようにする。"},{"label":"イ","html":"サービスが中断する直前の状態にデータを復旧し，当日のサービス終了時刻を，サービスが中断していた時間だけ延長する。"},{"label":"ウ","html":"サービスの中断から1時間以内に，中断した1時間前の時点の状態にデータを復旧する。"},{"label":"エ","html":"サービスの中断から1日以内に，中断したサービスのうちの重要なサービスに限定してサービスを復旧する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。RTO（Recovery Time Objective，目標復旧時間）は「サービス中断からどれだけの時間以内に復旧させるか」という時間の目標であり，RLO（Recovery Level Objective，目標復旧レベル）は「どの範囲・どの水準まで復旧させるか」という復旧対象の範囲やレベルの目標である。エの選択肢は，「中断から1日以内に」という時間の目標（RTO）と，「重要なサービスに限定して復旧する」という復旧範囲・レベルの目標（RLO）の両方を含んでおり，RTOとRLOを定めた例として適切である。ア・ウは「3時間前の時点」「1時間前の時点」のようにデータをどの時点の状態まで戻すかという指標であり，これはRPO（目標復旧時点）に関する記述である。イも中断直前の状態へのデータ復旧（RPOの考え方）とサービス終了時刻の延長について述べており，RTOやRLOを明確に定めたものとはいえない。</p>","mnemonic":""},{"id":80,"year":2024,"period":"令和6年度秋期","num":21,"cat":"マネジメント系","field":"システム監査技法","summary":"システム監査技法：令和6年度秋期 問21","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>システム監査において，監査手続の適用に際して用いられる技法のうち，データの生成から入力，処理，出力，活用までのプロセス，及び組み込まれているコントロールを，書面上で，又は実際に追跡するものはどれか。</p>","choices":[{"label":"ア","html":"ウォークスルー法"},{"label":"イ","html":"チェックリスト法"},{"label":"ウ","html":"突合・照合法"},{"label":"エ","html":"ドキュメントレビュー法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。ウォークスルー法とは，データが生成され，入力・処理・出力・活用されるまでの一連の業務プロセスと，その過程に組み込まれている内部統制（コントロール）を，文書（書面）上で，あるいは実際の業務の流れに沿って追跡し，整備・運用状況を確かめるシステム監査技法である。イのチェックリスト法は，あらかじめ用意した点検項目（チェックリスト）に沿って確認・評価していく技法であり，プロセスを追跡する技法ではない。ウの突合・照合法は，関連する複数の証憑や記録間でデータを突き合わせ，整合性を確認する技法である。エのドキュメントレビュー法は，規程やマニュアルなどの文書を閲覧して評価する技法であり，業務プロセスの実際の追跡を主眼とするウォークスルー法とは異なる。</p>","mnemonic":""},{"id":81,"year":2024,"period":"令和6年度秋期","num":22,"cat":"マネジメント系","field":"システム監査基準フォローアップ","summary":"システム監査基準フォローアップ：令和6年度秋期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>システム監査基準（令和5年）におけるフォローアップの説明として，適切なものはどれか。</p>","choices":[{"label":"ア","html":"監査対象先が，監査報告書の指摘事項及び改善提案を基に改善計画の策定を行うこと"},{"label":"イ","html":"監査部門の責任者が，監査報告書を基に監査の実施状況と指摘事項の妥当性を確認すること"},{"label":"ウ","html":"システム監査人が，監査報告書に記載した改善提案の実施状況に関する情報を収集し，改善状況をモニタリングすること"},{"label":"エ","html":"システム監査人が，時間の関係で調査が終了しなかった監査項目を追跡調査して報告すること"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。システム監査基準におけるフォローアップとは，監査報告書で示した改善提案について，監査対象部門がその後どのように対応し，実際に改善が図られているかに関する情報をシステム監査人自身が収集し，改善の実施状況を継続的にモニタリング（追跡確認）する活動を指す。これにより，指摘した問題点が放置されず，実効性のある改善につながっているかを確かめることができる。アは改善計画を策定するのは監査対象先自身の役割であり，監査人によるフォローアップの説明としては主体が異なる。イは監査部門の責任者による監査の実施状況・妥当性の確認であり，フォローアップ（改善提案の実施状況の確認）とは対象が異なる。エは監査の過程で終了しなかった項目の追跡調査であり，これはフォローアップではなく監査自体の未了事項への対応にあたる。</p>","mnemonic":""},{"id":82,"year":2024,"period":"令和6年度秋期","num":23,"cat":"ストラテジ系","field":"DX推進指標","summary":"DX推進指標：令和6年度秋期 問23","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>経済産業省が取りまとめた“デジタル経営改革のための評価指標（DX推進指標）”によれば，DXを実現する上で基盤となるITシステムの構築に関する指標において，“ITシステムに求められる要素”について経営者が確認すべき事項はどれか。</p>","choices":[{"label":"ア","html":"ITシステムの全体設計や協働できるベンダーの選定などを行える人材を育成・確保できているか。"},{"label":"イ","html":"環境変化に迅速に対応し，求められるデリバリースピードに対応できるITシステムとなっているか。"},{"label":"ウ","html":"データ処理において，リアルタイム性よりも，ビッグデータの蓄積と事後の分析が重視されているか。"},{"label":"エ","html":"データを迅速に活用するために，全体最適よりも，個別最適を志向したITシステムとなっているか。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。経済産業省の「DX推進指標」では，DXを支える基盤となるITシステムに求められる要素として，データを環境変化に応じて迅速に活用できること，部門を超えて全社最適でデータを活用できること，そして環境の変化に迅速に対応し，求められるスピード（デリバリースピード）でシステムを変更・提供できることなどが挙げられている。イはこの「変化に迅速に対応できるデリバリースピード」という要素そのものであり，経営者が確認すべき事項として適切である。アはITシステムを構築・活用する「人材」に関する指標であり，“ITシステムに求められる要素”とは別の指標区分に属する。ウは「リアルタイム性よりも蓄積・事後分析を重視する」としており，DX推進指標が重視する迅速なデータ活用の方向性と逆行するため不適切である。エも「全体最適よりも個別最適」としており，DX推進指標が課題として指摘する部門ごとの個別最適化（システムのサイロ化）を志向する内容であり，目指すべき姿とは逆であるため不適切である。</p>","mnemonic":""},{"id":83,"year":2024,"period":"令和6年度秋期","num":24,"cat":"ストラテジ系","field":"BPR効果計算","summary":"BPR効果計算：令和6年度秋期 問24","correct":"イ","result":"","formula":"部門の年間効果 ＝ 付加価値業務の利益 ＋ 異動による人件費削減 － 外部委託費","howto":"各シナリオで，従業員の保有時間から業務に必要な時間を引いて余剰時間を求め，余剰時間の付加価値利益，異動による人件費削減，外部委託費を足し引きして比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>BPRによって業務を見直した場合，これまで従業員5人で年間計9,000時間掛かっていた業務が7,000時間で実現可能なことと，その7,000時間のうちの2,000時間分の業務は外部委託が可能なことが分かった。この結果を基にBPRを実施した次のシナリオaからdのうち，当該部門において，年間当たりの金額面の効果が最も高いものはどれか。なお，いずれのシナリオも年初から実施することとし，条件に記載した時間や費用以外は考慮しないものとする。</p><p>〔条件〕</p><ol><li>年間計9,000時間の内訳は従業員1人当たり1,800時間とする。</li><li>従業員1人当たりの年間の人件費は600万円とする。</li><li>外部委託が可能な2,000時間分の業務を，外部委託した場合の年間費用は700万円とする。外部委託の契約は1年単位で年間費用の700万円は固定である。</li><li>従業員の空いた時間は別の付加価値業務が行えるようになり，従業員1人につき100時間当たり20万円の利益を得ることができる。</li><li>従業員4人で当該業務を行う場合は，残り1人は他部門に異動する。当該部門では，1人分の人件費の削減効果だけを考慮する。</li><li>BPR実施後，当該業務に関わらない従業員の人件費は金額面の効果とみなす。</li></ol><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th>シナリオ</th><th>当該業務を行う従業員数</th><th>外部委託</th></tr><tr><td>a</td><td>4人</td><td>する</td></tr><tr><td>b</td><td>4人</td><td>しない</td></tr><tr><td>c</td><td>5人</td><td>する</td></tr><tr><td>d</td><td>5人</td><td>しない</td></tr></table>","choices":[{"label":"ア","html":"シナリオa"},{"label":"イ","html":"シナリオb"},{"label":"ウ","html":"シナリオc"},{"label":"エ","html":"シナリオd"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ（シナリオb）。各シナリオの年間効果を計算する。<br>シナリオa（4人・外部委託する）：内部処理が必要な時間は7,000－2,000＝5,000時間。4人の保有時間は4×1,800＝7,200時間なので余剰時間は7,200－5,000＝2,200時間。付加価値利益は2,200÷100×20万＝440万円。外部委託費－700万円。1人異動による人件費削減＋600万円。合計440－700＋600＝340万円。<br>シナリオb（4人・外部委託しない）：内部処理時間は7,000時間。余剰時間は7,200－7,000＝200時間。付加価値利益は200÷100×20万＝40万円。外部委託費なし。1人異動による人件費削減＋600万円。合計40＋600＝640万円。<br>シナリオc（5人・外部委託する）：内部処理時間は5,000時間。5人の保有時間は5×1,800＝9,000時間なので余剰時間は4,000時間。付加価値利益は4,000÷100×20万＝800万円。外部委託費－700万円。異動者はいないので人件費削減なし。合計800－700＝100万円。<br>シナリオd（5人・外部委託しない）：内部処理時間は7,000時間。余剰時間は9,000－7,000＝2,000時間。付加価値利益は2,000÷100×20万＝400万円。合計400万円。<br>以上よりa＝340万円，b＝640万円，c＝100万円，d＝400万円となり，最も金額面の効果が高いのはシナリオb（640万円）である。</p>","mnemonic":"シナリオbは外部委託せず内部処理、余剰200時間の付加価値利益40万円＋人件費削減600万円=640万円が最大でイ。"},{"id":84,"year":2024,"period":"令和6年度秋期","num":25,"cat":"テクノロジ系","field":"UMLアクティビティ図","summary":"UMLアクティビティ図：令和6年度秋期 問25","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>UMLの図のうち，業務要件定義において，業務フローを記述する際に使用する，処理の分岐や並行処理，処理の同期などを表現できる図はどれか。</p>","choices":[{"label":"ア","html":"アクティビティ図"},{"label":"イ","html":"クラス図"},{"label":"ウ","html":"状態マシン図"},{"label":"エ","html":"ユースケース図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。アクティビティ図は，処理の流れ（ワークフロー）を表現するUMLの図であり，フローチャートに似た見た目を持ちながら，条件分岐（ひし形）に加えて，複数の処理が同時に進む並行処理の表現や，太い横線（同期バー）を使ってそれらの処理の開始・合流（同期）を表現できる点が特徴であり，業務フロー（ビジネスプロセス）の記述によく用いられる。イのクラス図はシステムを構成するクラスとその関連（静的な構造）を表す図，ウの状態マシン図は一つのオブジェクトが状態を遷移していく様子を表す図，エのユースケース図は利用者（アクター）とシステムが提供する機能（ユースケース）との関係を表す図であり，いずれも業務フロー上の分岐・並行処理・同期を表現する図ではない。</p>","mnemonic":""},{"id":85,"year":2024,"period":"令和6年度秋期","num":26,"cat":"ストラテジ系","field":"コ・クリエーション戦略","summary":"コ・クリエーション戦略：令和6年度秋期 問26","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>コ・クリエーション戦略の特徴はどれか。</p>","choices":[{"label":"ア","html":"企業の営業部門と製造部門が協働し，特定の商品・サービスに限定して，徹底的に自前主義にこだわることによって強みを発揮する。"},{"label":"イ","html":"顧客が自らのアイデアを商品の仕様に具体的に落とし込み，企業に製品を製造してもらう。"},{"label":"ウ","html":"顧客や企業ネットワークの力を活用し，商品・サービスだけでなく，顧客の経験までを含めて差別化可能な価値を創造する。"},{"label":"エ","html":"自社に不足する経営資源をM&Aによって強化し，従来にない価値をより素早く創造する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。コ・クリエーション（共創）戦略は，米国の経営学者プラハラードとラマスワミが提唱した考え方で，企業が顧客や社外のネットワーク（顧客コミュニティ，取引先など）の力を取り込み，商品やサービスそのものだけでなく，それを利用する過程で得られる顧客の経験（カスタマー・エクスペリエンス）までを一体の価値として捉え，他社と差別化できる新たな価値を共同で創造していく戦略である。アは社内の部門間協働と自前主義（外部資源を使わない内製志向）を強調しており，外部ネットワークの力を活用するコ・クリエーションの考え方とは逆である。イは顧客の意見を単に製品仕様に反映させる受動的な関係にとどまり，顧客の「経験」自体を価値として位置づける視点を欠くため，コ・クリエーションの本質的な特徴とまではいえない。エはM&Aによる経営資源の外部調達であり，顧客やネットワークとの共創とは異なる手段である。</p>","mnemonic":""},{"id":86,"year":2024,"period":"令和6年度秋期","num":27,"cat":"ストラテジ系","field":"ダーウィンの海","summary":"ダーウィンの海：令和6年度秋期 問27","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>企業における研究，開発，事業化，そして産業化へとステージが移行する過程の中で，事業化から産業化に移行するときの，競合製品との競争過程にある障壁を何と呼ぶか。</p>","choices":[{"label":"ア","html":"キャズム"},{"label":"イ","html":"死の谷"},{"label":"ウ","html":"ダーウィンの海"},{"label":"エ","html":"魔の川"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。研究開発から事業として成功するまでの道のりは，しばしば三つの関門にたとえられる。基礎研究の成果を実用化に向けた具体的な開発に進めることができるかどうかの壁を「魔の川」，開発した技術を事業化（製品化・市場投入）に結び付けられるかどうかの壁を「死の谷」，そして事業化した製品が実際の市場で既存の競合製品と激しい競争にさらされ，淘汰を乗り越えて産業として定着できるかどうかの壁を「ダーウィンの海」と呼ぶ。設問は「事業化から産業化に移行するときの，競合製品との競争過程にある障壁」を問うており，これはまさに市場競争による淘汰を意味する「ダーウィンの海」に当たる。アのキャズムは，先進的な利用者層と多数派の一般利用者層との間にある製品普及上の溝を指す別の概念であり，イの死の谷は開発から事業化への壁，エの魔の川は研究から開発への壁を指すため，いずれも事業化から産業化への壁とは段階が異なる。</p>","mnemonic":""},{"id":87,"year":2024,"period":"令和6年度秋期","num":28,"cat":"ストラテジ系","field":"資材所要量計算(MRP)","summary":"資材所要量計算(MRP)：令和6年度秋期 問28","correct":"イ","result":"","formula":"正味所要量 ＝ 総所要量（上位品目の正味所要量×員数の合計） － 自身の在庫量","howto":"製品Aの正味の生産数量から部品aの正味所要量を求め，さらにそこからbの総所要量を積み上げ，最後にbの在庫を差し引く（多段階の展開を行う）","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>構成表の製品Aを300個出荷しようとするとき，部品bの正味所要量は何個か。ここで，A，a，b，cの在庫量は在庫表のとおりとする。また，他の仕掛残，注文残，引当残などはないものとする。</p><p><b>構成表</b>（単位 個）</p><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th rowspan=\"2\">品名</th><th colspan=\"3\">構成部品</th></tr><tr><th>a</th><th>b</th><th>c</th></tr><tr><td>A</td><td>3</td><td>2</td><td>0</td></tr><tr><td>a</td><td>－</td><td>1</td><td>2</td></tr></table><p><b>在庫表</b>（単位 個）</p><table border=\"1\" cellspacing=\"0\" cellpadding=\"4\"><tr><th>品名</th><th>在庫量</th></tr><tr><td>A</td><td>100</td></tr><tr><td>a</td><td>100</td></tr><tr><td>b</td><td>300</td></tr><tr><td>c</td><td>400</td></tr></table>","choices":[{"label":"ア","html":"200"},{"label":"イ","html":"600"},{"label":"ウ","html":"900"},{"label":"エ","html":"1,500"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ（600個）。まず製品Aの正味の生産数量を求める。出荷に必要な300個に対し，Aの在庫が100個あるので，実際に生産すべきAは300－100＝200個である。<br>次に部品aの所要量を求める。Aを200個作るには，構成表よりAの中にaが3個含まれるので，aの総所要量は200×3＝600個。aの在庫は100個あるので，aの正味所要量（実際に用意すべきa）は600－100＝500個である。<br>続いて部品bの所要量を求める。bはAから直接必要になる分と，aを作るために必要になる分の両方がある。Aを200個作るにはAの構成表よりb×2個／A分なので200×2＝400個。aを500個作るにはaの構成表よりb×1個／a分なので500×1＝500個。合計した総所要量は400＋500＝900個である。最後にbの在庫300個を差し引くと，正味所要量は900－300＝600個となる。</p>","mnemonic":"「Aから400，aから500，足して900，在庫300引いてろっぴゃく（600）」と段階的に積み上げて覚える。"},{"id":88,"year":2024,"period":"令和6年度秋期","num":29,"cat":"ストラテジ系","field":"経営理念と戦略の関係","summary":"経営理念と戦略の関係：令和6年度秋期 問29","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>企業経営において，経営理念，経営戦略，事業戦略は，経営理念を最上位とするピラミッドを形成している。経営理念，経営戦略，事業戦略の関係性で適切なものはどれか。</p>","choices":[{"label":"ア","html":"経営理念，経営戦略，事業戦略のピラミッドは上位ほど具体的な内容であるのに対して，下位にいくほど抽象的な内容となっている。"},{"label":"イ","html":"経営理念，経営戦略，事業戦略のピラミッドは上位ほど短期的な視点であるのに対して，下位にいくほど中長期的な視点となっている。"},{"label":"ウ","html":"経営理念を達成するために経営戦略を策定し，経営戦略という目標を達成するために事業戦略に分解する。"},{"label":"エ","html":"経営理念を達成するために事業戦略を策定し，事業戦略という目標を達成するために経営戦略に分解する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。企業経営におけるピラミッド構造では，最上位に企業が何のために存在し何を目指すのかという普遍的・抽象的な「経営理念」が置かれ，それを実現するための中長期的な方向性として「経営戦略」が策定され，さらにその経営戦略という目標を達成するために，各事業分野でより具体的・個別的な「事業戦略」へと落とし込まれる，という上位から下位への展開関係になっている。アは上位ほど具体的で下位ほど抽象的としており，実際には逆（上位ほど抽象的・普遍的，下位ほど具体的）であるため誤り。イは上位ほど短期的としているが，実際には上位の経営理念・経営戦略ほど中長期的な視点であり，下位の事業戦略の方がより短期的・具体的な実行計画になりやすいため，この記述も実態と逆である。エは経営理念の直下に事業戦略を置き，そこから経営戦略に分解するとしており，経営戦略と事業戦略の上下関係が逆になっているため誤りである。</p>","mnemonic":""},{"id":89,"year":2024,"period":"令和6年度秋期","num":30,"cat":"ストラテジ系","field":"労働者派遣法","summary":"労働者派遣法：令和6年度秋期 問30","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>大規模なシステム開発を受注したA社では，不足する開発要員を派遣事業者であるB社からの労働者派遣によって補うことにした。A社の行為のうち，労働者派遣法に照らして適切なものはどれか。</p>","choices":[{"label":"ア","html":"システム開発が長期間となることが予想されるので，開発要員の派遣期間を3年とする契約を結ぶ。"},{"label":"イ","html":"派遣候補者の履歴書及び業務経歴書の提出をB社に求め，書類選考を行い，面接対象者を絞り込む。"},{"label":"ウ","html":"派遣された要員が大きな作業負担を負うことが見込まれるので，B社に20代男性の派遣を求める。"},{"label":"エ","html":"派遣労働者がA社の指揮命令に対して申し立てた苦情に自社で対応せず，その処理をB社に任せる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。労働者派遣法では，同一の事業所（組織単位）が同じ業務について派遣労働者を受け入れられる期間は，原則として上限3年と定められている（3年を超えて受け入れる場合は過半数労働組合等への意見聴取などの手続が必要になる）。あらかじめ長期化が見込まれるシステム開発について，法律の上限である3年の派遣期間で契約を結ぶこと自体は，労働者派遣法に反しない適切な行為である。イについて，派遣先（A社）が派遣労働者の履歴書の提出を求めたり，事前に書類選考や特定の労働者を指名するような行為（事前面接に類する行為）は，原則として禁止されている特定行為に該当し不適切である。ウについて，性別や年齢などを理由に特定の属性の労働者の派遣を求めることは，派遣労働者を特定する行為として不適切であり，雇用における性差別の観点からも問題がある。エについて，派遣労働者が派遣先の指揮命令に関して申し立てた苦情は，まず派遣先であるA社自身が誠実に対応すべき義務があり，これを一方的にB社（派遣元）に押し付けて自社で対応しないことは労働者派遣法の趣旨に反し不適切である。</p>","mnemonic":""},{"id":90,"year":2024,"period":"令和6年度春期","num":1,"cat":"テクノロジ系","field":"待ち行列理論","summary":"待ち行列理論：令和6年度春期 問1","correct":"エ","result":"","formula":"Wq=ρ'/(1−ρ')×Ts(M/M/1)、統合後はρ'=2ρに置き換える","howto":"各支店の到着率をλ=ρ/Tsとし、2支店分を合算した利用率ρ'=2ρを待ち時間の式へ代入する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ATM(現金自動預払機)が1台ずつ設置してある二つの支店を統合し、統合後の支店にはATMを1台設置する。統合後のATMの平均待ち時間を求める式はどれか。ここで、待ち時間はM/M/1の待ち行列モデルに従い、平均待ち時間にはサービス時間を含まず、ATMを1台に統合しても十分に処理できるものとする。</p><p>〔条件〕</p><ol><li>統合後の平均サービス時間:T<sub>S</sub></li><li>統合前のATMの利用率:両支店ともρ</li><li>統合後の利用者数:統合前の両支店の利用者数の合計</li></ol>","choices":[{"label":"ア","html":"ρ/(1−ρ)×T<sub>S</sub>"},{"label":"イ","html":"ρ/(1−2ρ)×T<sub>S</sub>"},{"label":"ウ","html":"2ρ/(1−ρ)×T<sub>S</sub>"},{"label":"エ","html":"2ρ/(1−2ρ)×T<sub>S</sub>"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>M/M/1の待ち行列モデルにおける平均待ち時間(サービス時間を含まない)は、利用率をρ'、平均サービス時間をT<sub>S</sub>とすると Wq = ρ'/(1−ρ') × T<sub>S</sub> で表される。</p><p>統合前は、各支店のATMの利用率がともにρであったので、各支店の到着率(利用者数)は λ = ρ/T<sub>S</sub> と表せる。条件(3)より、統合後の利用者数(到着率)は両支店の合計になるので、統合後の到着率は λ' = 2λ = 2ρ/T<sub>S</sub> となる。</p><p>統合後の利用率は ρ' = λ'×T<sub>S</sub> = 2ρ となるので、これを待ち時間の式に代入すると、統合後の平均待ち時間は 2ρ/(1−2ρ) × T<sub>S</sub> となり、選択肢エと一致する。</p>","mnemonic":"ふたり分背負う『にばいρ(2ρ)』―1から引いた残りがどんどん細って待ち時間は2ρ/(1−2ρ)×Tsに膨らむ"},{"id":91,"year":2024,"period":"令和6年度春期","num":2,"cat":"テクノロジ系","field":"ハミング符号","summary":"ハミング符号：令和6年度春期 問2","correct":"エ","result":"","formula":"i=c0+2c1+4c2(誤りビット位置の2進復元)","howto":"x1〜x7からc0,c1,c2をmod2で算出し、iビット目を反転する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>符号長7ビット、情報ビット数4ビットのハミング符号による誤り訂正の方法を、次のとおりとする。</p><p>受信した7ビットの符号語 x<sub>1</sub> x<sub>2</sub> x<sub>3</sub> x<sub>4</sub> x<sub>5</sub> x<sub>6</sub> x<sub>7</sub>(x<sub>k</sub>=0又は1)に対して</p><p>c<sub>0</sub> = x<sub>1</sub>+x<sub>3</sub>+x<sub>5</sub>+x<sub>7</sub><br>c<sub>1</sub> = x<sub>2</sub>+x<sub>3</sub>+x<sub>6</sub>+x<sub>7</sub><br>c<sub>2</sub> = x<sub>4</sub>+x<sub>5</sub>+x<sub>6</sub>+x<sub>7</sub><br>(いずれもmod 2での計算)</p><p>を計算し、c<sub>0</sub>, c<sub>1</sub>, c<sub>2</sub>の中に少なくとも一つは0でないものがある場合には、</p><p>i = c<sub>0</sub>+c<sub>1</sub>×2+c<sub>2</sub>×4</p><p>を求めて、左からiビット目を反転することによって誤りを訂正する。</p><p>受信した符号語が1000101であった場合、誤り訂正後の符号語はどれか。</p>","choices":[{"label":"ア","html":"1000001"},{"label":"イ","html":"1000101"},{"label":"ウ","html":"1001101"},{"label":"エ","html":"1010101"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>受信した符号語 x1 x2 x3 x4 x5 x6 x7 = 1 0 0 0 1 0 1 を用いて、各パリティをmod 2で計算する。</p><p>c0 = x1+x3+x5+x7 = 1+0+1+1 = 3 → mod2 = 1<br>c1 = x2+x3+x6+x7 = 0+0+0+1 = 1 → mod2 = 1<br>c2 = x4+x5+x6+x7 = 0+1+0+1 = 2 → mod2 = 0</p><p>i = c0 + c1×2 + c2×4 = 1 + 2×1 + 4×0 = 3 なので、左から3ビット目(x3)を反転する。x3は0であったので1に反転し、訂正後の符号語は 1 0 1 0 1 0 1 = 1010101 となり、選択肢エと一致する。</p>","mnemonic":"c0=1,c1=1,c2=0を並べるとi=1+2×1+4×0=3、x3が誤りビットだから反転すると1010101に生まれ変わる"},{"id":92,"year":2024,"period":"令和6年度春期","num":3,"cat":"テクノロジ系","field":"二分木再帰","summary":"二分木再帰：令和6年度春期 問3","correct":"エ","result":"","formula":"f(n)=f(右)→f(左)→自ノード出力、の順の再帰","howto":"各部分木を右優先で辿り、処理し終えたノードを都度出力していく","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>各ノードがもつデータを出力する再帰処理f(ノードn)を定義した。この処理を、図の2分木の根(最上位のノード)から始めたときの出力はどれか。</p><p>〔f(ノードn)の定義〕</p><ol><li>ノードnの右に子ノードrがあれば、f(ノードr)を実行</li><li>ノードnの左に子ノードlがあれば、f(ノードl)を実行</li><li>再帰処理f(ノードr)、f(ノードl)を未実行の子ノード、又は子ノードがなければ、ノード自身がもつデータを出力</li><li>終了</li></ol><p>〔2分木の構造〕根のデータは「+」で、左の子は「A」(子ノードなし)、右の子は「÷」である。「÷」の左の子は「×」、右の子は「−」である。「×」の左の子は「B」、右の子は「C」(ともに子ノードなし)である。「−」の左の子は「D」、右の子は「E」(ともに子ノードなし)である。</p>","choices":[{"label":"ア","html":"+÷−ED×CBA"},{"label":"イ","html":"ABC×DE−÷+"},{"label":"ウ","html":"E−D÷C×B+A"},{"label":"エ","html":"ED−CB×÷A+"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>定義を整理すると、f(ノードn)は「右の子があればf(右の子)を先に実行し、次に左の子があればf(左の子)を実行し、最後に(あるいは子がない場合に)自分自身のデータを出力する」という、右部分木→左部分木→自分自身、の順に処理する再帰処理である。つまり、各部分木について「右→左→自分」の順で出力されていく。</p><p>葉のノード(B, C, D, E, A)はそのまま自分のデータを出力する。×ノード(子はB, C)は、右のC→左のB→自分(×)の順で「CB×」を出力し、−ノード(子はD, E)は、右のE→左のD→自分(−)の順で「ED−」を出力する。</p><p>÷ノード(子は左が×、右が−)は、右の−部分木「ED−」を先に出力し、続いて左の×部分木「CB×」を出力し、最後に自分(÷)を出力するので「ED−CB×÷」となる。</p><p>根の+ノード(子は左がA、右が÷)は、右の÷部分木「ED−CB×÷」を先に出力し、続いて左のA「A」を出力し、最後に自分(+)を出力するので、全体の出力は「ED−CB×÷A+」となり、選択肢エと一致する。</p>","mnemonic":"右から先に覗き見るクセの再帰、『右・左・自分』の順で『ED−CB×÷A+』が出来上がる"},{"id":93,"year":2024,"period":"令和6年度春期","num":4,"cat":"テクノロジ系","field":"量子コンピュータ","summary":"量子コンピュータ：令和6年度春期 問4","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>量子ゲート方式の量子コンピュータの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"演算は2進数で行われ、結果も2進数で出力される。"},{"label":"イ","html":"特定のアルゴリズムによる演算だけができ、加算演算はできない。"},{"label":"ウ","html":"複数の状態を同時に表現する量子ビットと、その重ね合わせを利用する。"},{"label":"エ","html":"量子状態を変化させながら観測するので、100℃以上の高温で動作する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。量子ゲート方式の量子コンピュータは、0と1を同時に表現できる「量子ビット(qubit)」と、複数の量子ビットの状態を重ね合わせた状態を量子ゲート(ゲート演算)によって操作することで、多数の状態を並列的に扱う計算を行う。この重ね合わせと、量子ビット間の量子もつれ(エンタングルメント)を利用する点が古典コンピュータとの本質的な違いである。</p><p>選択肢アは演算も出力も単純な2進数であるとする点で量子ビットの重ね合わせ性質を無視しており誤り。イは量子コンピュータが特定アルゴリズム専用で加算すらできないとする点が誤りで、実際には様々な量子アルゴリズムや基本演算を実行できる。エは量子状態の重ね合わせは非常に壊れやすく、現実の量子コンピュータの多くはむしろ絶対零度近くまで冷却して動作させており、100℃以上の高温で動作するという記述は誤りである。</p>","mnemonic":""},{"id":94,"year":2024,"period":"令和6年度春期","num":5,"cat":"テクノロジ系","field":"信頼性設計","summary":"信頼性設計：令和6年度春期 問5","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>システムの信頼性設計に関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"フェールセーフとは、利用者の誤操作によってシステムが異常終了してしまうことのないように、単純なミスを発生させないようにする設計方法である。"},{"label":"イ","html":"フェールソフトとは、故障が発生した場合でも機能を縮退させることなく稼働を継続する概念である。"},{"label":"ウ","html":"フォールトアボイダンスとは、システム構成要素の個々の品質を高めて故障が発生しないようにする概念である。"},{"label":"エ","html":"フォールトトレランスとは、故障が生じてもシステムに重大な影響が出ないように、あらかじめ定められた安全状態にシステムを固定し、全体として安全が維持されるような設計方法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。フォールトアボイダンスとは、構成部品一つひとつの品質や信頼性を高めることによって、そもそも故障が発生しないようにする設計思想であり、設問の記述と一致する。</p><p>選択肢アはフェールセーフの説明ではなく、単純ミスを防止する設計は一般にフールプルーフと呼ばれるものであり、フェールセーフ本来の意味(故障時に安全側へ動作させる)とは異なる。イはフェールソフトの説明として誤りで、フェールソフトは故障時にシステム全体を止めずに機能を縮退させてでも稼働を継続させる考え方であり、「縮退させることなく」という記述が本来の定義と矛盾する。エの記述はフォールトトレランスではなく、あらかじめ定めた安全状態に固定するという点はむしろフェールセーフの考え方に近く、フォールトトレランスは冗長構成などによって故障時にも性能を落とさず正常に動作し続けることを指す。</p>","mnemonic":""},{"id":95,"year":2024,"period":"令和6年度春期","num":6,"cat":"テクノロジ系","field":"デッドロック","summary":"デッドロック：令和6年度春期 問6","correct":"イ","result":"","formula":"資源獲得順序が逆転する2プロセス間は循環待ち(デッドロック)の可能性あり","howto":"Aの順序X→Y→Zと各プロセスの順序を比較し、互いに逆順で資源を欲しがる組合せを探す","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>三つの資源X〜Zを占有して処理を行う四つのプロセスA〜Dがある。各プロセスは処理の進行に伴い、表中の数値の順に資源を占有し、実行終了時に三つの資源を一括して解放する。プロセスAと同時にもう一つプロセスを動かした場合に、デッドロックを起こす可能性があるプロセスはどれか。</p><table><tr><th>プロセス</th><th>資源X</th><th>資源Y</th><th>資源Z</th></tr><tr><td>A</td><td>1</td><td>2</td><td>3</td></tr><tr><td>B</td><td>1</td><td>2</td><td>3</td></tr><tr><td>C</td><td>2</td><td>3</td><td>1</td></tr><tr><td>D</td><td>3</td><td>2</td><td>1</td></tr></table><p>(表中の数値は各プロセスがその資源を占有する順序を表す。)</p>","choices":[{"label":"ア","html":"B, C, D"},{"label":"イ","html":"C, D"},{"label":"ウ","html":"Cだけ"},{"label":"エ","html":"Dだけ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プロセスAの資源占有順序はX→Y→Zである。この順序と、同時に動かすもう一つのプロセスの占有順序を比較し、循環待ち(デッドロック)が起こり得るかを検討する。</p><p>プロセスB(X→Y→Z)はAと全く同じ順序で資源を獲得するため、二つのプロセスは常に同じ順番で資源を要求し合う形になり、片方が先に資源を確保すればもう片方は単に待つだけで、互いが相手の持つ資源を待ち合う循環待ちは発生しない。したがってBは安全である。</p><p>プロセスC(Z→X→Y)は、例えばAがXを確保した直後にCがZを確保し、その後Aが(Yを確保後に)Zを要求するとCに握られていて待たされ、一方Cも次にXを要求するとAに握られていて待たされる、という状況が起こり得る。AはZ待ち、CはX待ちとなって互いに相手の資源を待ち合う循環待ちが成立し、デッドロックの可能性がある。</p><p>プロセスD(Z→Y→X)についても同様に、AがXとYを確保した後にZを要求し、DがZを確保した後にYを要求するという順にタイミングが重なると、AはD保有のZを待ち、DはA保有のYを待つ循環待ちが成立し得る。したがってデッドロックの可能性があるのはC, Dであり、選択肢イが正解となる。</p>","mnemonic":"AとBは同じ道を歩む仲良しコンビ、CとDは逆走してAと『シーディー(C,D)』衝突事故"},{"id":96,"year":2024,"period":"令和6年度春期","num":7,"cat":"テクノロジ系","field":"論理回路","summary":"論理回路：令和6年度春期 問7","correct":"ウ","result":"","formula":"Y=NOT(A・B)(NAND)","howto":"A,Bが共に1の区間だけYが0になる波形を探し、該当する論理ゲートを選ぶ","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>入力がAとB、出力がYの論理回路を動作させたとき、図のタイムチャートが得られた。この論理回路として、適切なものはどれか。</p><p>〔タイムチャートの内容〕時間の経過とともにAとBがそれぞれ0と1の間でパルス状に変化しており、AとBが共に1になっている区間でだけYが0になり、それ以外の区間ではYが1になっている波形が観測された。</p>","choices":[{"label":"ア","html":"OR回路(論理和素子、入出力に否定の丸印なし)"},{"label":"イ","html":"論理一致回路(XNOR、入力側にXOR形状・出力に否定の丸印あり)"},{"label":"ウ","html":"NAND回路(否定論理積素子、AND形状の出力に否定の丸印あり)"},{"label":"エ","html":"NOR回路(否定論理和素子、OR形状の出力に否定の丸印あり)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>タイムチャートを区間ごとに読み取り、入力A, Bの組合せと出力Yの値を対応づけると、AとBがともに1になっている区間だけYが0になり、それ以外(AとBの少なくとも一方が0である区間)ではYが1になっていることが分かる。</p><p>これをA, Bの全ての組合せについて整理すると、Y = NOT(A AND B) という真理値表になり、これはNAND(否定論理積)の動作そのものである。選択肢の中でNAND素子の図記号(AND形状の出力側に否定を表す小さい丸印が付いたもの)に対応するのはウであり、これが正解となる。</p>","mnemonic":"AもBも『そろい踏み(1,1)』の瞬間だけYがへそを曲げて0になる、気難しやのNAND"},{"id":97,"year":2024,"period":"令和6年度春期","num":8,"cat":"テクノロジ系","field":"アウトラインフォント","summary":"アウトラインフォント：令和6年度春期 問8","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ビットマップフォントよりも、アウトラインフォントの利用が適している場合はどれか。</p>","choices":[{"label":"ア","html":"英数字だけでなく、漢字も表示する。"},{"label":"イ","html":"各文字の幅を一定にして表示する。"},{"label":"ウ","html":"画面上にできるだけ高速に表示する。"},{"label":"エ","html":"文字を任意の倍率に拡大して表示する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。アウトラインフォントは文字の輪郭を数式(ベジェ曲線など)で表現するため、拡大・縮小しても輪郭がなめらかなまま任意の倍率で表示でき、特に大きな文字を表示する見出しなどに適している。これに対しビットマップフォントはドットの集合であらかじめ用意されたサイズごとに文字を保持するため、拡大すると輪郭がギザギザになりやすい。</p><p>選択肢アの漢字表示自体はビットマップフォントでも可能であり、アウトラインフォント固有の利点ではない。ウについては、ビットマップフォントはあらかじめ用意したドットパターンをそのまま転送するだけでよいため、計算が必要なアウトラインフォントよりもむしろ高速に表示できる点で、設問の趣旨とは逆である。</p>","mnemonic":""},{"id":98,"year":2024,"period":"令和6年度春期","num":9,"cat":"テクノロジ系","field":"ストアドプロシージャ","summary":"ストアドプロシージャ：令和6年度春期 問9","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ストアドプロシージャの利点はどれか。</p>","choices":[{"label":"ア","html":"アプリケーションプログラムからネットワークを介してDBMSにアクセスする場合、両者間の通信量を減少させる。"},{"label":"イ","html":"アプリケーションプログラムからの一連の要求を一括して処理することによって、DBMS内の実行計画の数を減少させる。"},{"label":"ウ","html":"アプリケーションプログラムからの一連の要求を一括して処理することによって、DBMS内の必要バッファ数を減少させる。"},{"label":"エ","html":"データが格納されているディスク装置へのI/O回数を減少させる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。ストアドプロシージャは、一連のSQL処理をあらかじめDBMSサーバ側に手続き(プロシージャ)として登録しておき、アプリケーションプログラムからは1回の呼出しで実行させる仕組みである。これにより、複数回のSQL発行をネットワーク越しに個別に行う場合に比べて、アプリケーションとDBMS間でやり取りする通信回数・通信量を大きく減少させられる点が代表的な利点である。</p><p>選択肢イ・ウは実行計画数やバッファ数の削減を挙げているが、これらはストアドプロシージャの直接的な利点として一般的に説明される内容ではない。エのディスクI/O回数の削減も、ストアドプロシージャ自体の性質というよりはインデックス設計やキャッシュ技術に関わる話であり、本問の趣旨とは異なる。</p>","mnemonic":""},{"id":99,"year":2024,"period":"令和6年度春期","num":10,"cat":"テクノロジ系","field":"CSMA/CD","summary":"CSMA/CD：令和6年度春期 問10","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>CSMA/CD方式のLANに接続されたノードの送信動作として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"各ノードに論理的な順位付けを行い、送信権を順次受け渡し、これを受け取ったノードだけが送信を行う。"},{"label":"イ","html":"各ノードは伝送媒体が使用中かどうかを調べ、使用中でなければ送信を行う。衝突を検出したらランダムな時間の経過後に再度送信を行う。"},{"label":"ウ","html":"各ノードを環状に接続して、送信権を制御するための特殊なフレームを巡回させ、これを受け取ったノードだけが送信を行う。"},{"label":"エ","html":"タイムスロットを割り当てられたノードだけが送信を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。CSMA/CD(Carrier Sense Multiple Access with Collision Detection)方式では、各ノードは送信前に伝送媒体(ケーブル)が使用中かどうかを確認し(キャリアセンス)、空いていれば送信を行う。複数ノードがほぼ同時に送信してしまい衝突(コリジョン)が検出された場合は、送信を中止し、ランダムな時間だけ待ってから再送信を試みることで衝突の再発を避ける。</p><p>選択肢アはトークンパッシング方式(トークンリングなど)の説明であり、順位付けされた送信権を受け渡す方式はCSMA/CDとは異なる。ウも同様にトークンリング方式の説明であり、エはTDMA(時分割多元接続)のような時刻枠(タイムスロット)を割り当てる方式の説明であって、いずれもCSMA/CDの送信動作とは異なる。</p>","mnemonic":""},{"id":100,"year":2024,"period":"令和6年度春期","num":11,"cat":"テクノロジ系","field":"ビット誤り率","summary":"ビット誤り率：令和6年度春期 問11","correct":"エ","result":"","formula":"期待値=送信数×(1−(1−p)^ビット数)≒送信数×p×ビット数","howto":"1,500バイトを12,000ビットに換算し、誤り率1×10^-6を掛けて1パケットの誤り確率を求め、10,000個を掛ける","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ビット誤り率が0.0001%の回線を使って、1,500バイトのパケットを10,000個送信するとき、誤りが含まれるパケットの個数の期待値はおよそ幾らか。</p>","choices":[{"label":"ア","html":"10"},{"label":"イ","html":"15"},{"label":"ウ","html":"80"},{"label":"エ","html":"120"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>1,500バイトのパケットは 1,500×8 = 12,000ビットである。ビット誤り率は0.0001% = 0.000001 = 1×10<sup>−6</sup>なので、1パケットあたりに誤りが含まれる確率は、誤り率が非常に小さいことから近似的に 12,000 × 1×10<sup>−6</sup> = 0.012(1.2%)と求められる。</p><p>10,000個のパケットを送信するとき、誤りが含まれるパケット数の期待値は、1パケットあたりの誤り発生確率に送信個数を掛けて 10,000 × 0.012 = 120(個)となり、選択肢エと一致する。</p>","mnemonic":"1,500バイト=12,000ビット、誤り率10⁻⁶を掛けて1パケット当たり0.012、それを1万個に掛けると0.012×10,000=120と桁がすっきり揃う"},{"id":101,"year":2024,"period":"令和6年度春期","num":12,"cat":"テクノロジ系","field":"3Dセキュア","summary":"3Dセキュア：令和6年度春期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>3Dセキュア2.0(EMV 3-Dセキュア)は、オンラインショッピングにおけるクレジットカード決済時に、不正取引を防止するための本人認証サービスである。3Dセキュア2.0で利用される本人認証の特徴はどれか。</p>","choices":[{"label":"ア","html":"利用者がカード会社による本人認証に用いるパスワードを忘れた場合でも、安全にパスワードを再発行することができる。"},{"label":"イ","html":"利用者の過去の取引履歴や決済に用いているデバイスの情報から不正利用や高リスクと判断される場合に、カード会社が追加の本人認証を行う。"},{"label":"ウ","html":"利用者の過去の取引履歴や決済に用いているデバイスの情報にかかわらず、カード会社がパスワードと生体認証を併用した本人認証を行う。"},{"label":"エ","html":"利用者の過去の取引履歴や決済に用いているデバイスの情報に加えて、操作しているのが人間であることを確認した上で、カード会社が追加の本人認証を行う。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。3Dセキュア2.0(EMV 3-Dセキュア)は、決済ごとに固定のパスワードを毎回入力させる旧方式(3Dセキュア1.0)とは異なり、利用者の過去の取引履歴や利用デバイスの情報など多様なデータをもとにカード会社がリスクを評価し(リスクベース認証)、低リスクと判断されれば追加認証なしでスムーズに決済を完了させ、不正利用の疑いが高いと判断された場合にのみワンタイムパスワードなどの追加の本人認証を要求する仕組みが特徴である。</p><p>選択肢アのパスワード再発行機能や、ウの常に生体認証を併用するという記述、エの人間操作であることの確認を必須とする記述は、3Dセキュア2.0の中核であるリスクベースの追加認証という特徴を正しく表していない。</p>","mnemonic":""},{"id":102,"year":2024,"period":"令和6年度春期","num":13,"cat":"テクノロジ系","field":"公開鍵暗号","summary":"公開鍵暗号：令和6年度春期 問13","correct":"イ","result":"","formula":"公開鍵暗号の総鍵数=2n(一人1組)","howto":"一人が公開鍵・秘密鍵を1組だけ持てば全員と通信できる点を押さえ、共通鍵方式のn(n−1)/2と区別する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>公開鍵暗号方式を使った暗号通信をn人が相互に行う場合、全部で何個の異なる鍵が必要になるか。ここで、一組の公開鍵と秘密鍵は2個と数える。</p>","choices":[{"label":"ア","html":"n+1"},{"label":"イ","html":"2n"},{"label":"ウ","html":"n(n−1)/2"},{"label":"エ","html":"n<sup>2</sup>"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>公開鍵暗号方式では、暗号化や署名検証に使う公開鍵と、復号や署名生成に使う秘密鍵の組を、通信を行う一人ひとりが1組だけ持てばよい。相手ごとに異なる鍵を用意する必要がある共通鍵暗号方式(鍵の総数がn(n−1)/2組、すなわちn(n−1)個になる方式)とは異なり、公開鍵暗号方式では自分の公開鍵を公開しておき、相手は各自その公開鍵を使って暗号化すればよいため、鍵ペアはn人分、すなわち2n個で足りる。</p><p>したがって、n人が相互に公開鍵暗号方式で暗号通信を行うために必要な異なる鍵の総数は2n個であり、選択肢イが正解となる。</p>","mnemonic":"みんな自分の鍵束(2個)を1つだけ持てばいい、n人集まれば『にばいのn(2n)』で足りる"},{"id":103,"year":2024,"period":"令和6年度春期","num":14,"cat":"テクノロジ系","field":"PSIRT","summary":"PSIRT：令和6年度春期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>自社製品の脆弱性に起因するリスクに対応するための社内機能として、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"CSIRT"},{"label":"イ","html":"PSIRT"},{"label":"ウ","html":"SOC"},{"label":"エ","html":"WHOISデータベースの技術連絡担当"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。PSIRT(Product Security Incident Response Team)は、自社が開発・販売する製品に存在する脆弱性に関する情報を受け付け、調査・対応し、必要に応じて利用者へ注意喚起や修正プログラムの提供などを行う、製品セキュリティに特化した社内体制である。</p><p>これに対しCSIRT(Computer Security Incident Response Team)は、自社内のネットワークやシステムで発生したセキュリティインシデントへの対応を担う組織であり、必ずしも自社製品の脆弱性対応に特化したものではない。SOC(Security Operation Center)は主に自社システムの監視・検知を担う機能であり、WHOISデータベースの技術連絡担当は、ドメイン名登録に関する技術的な問合せ窓口にすぎず、いずれも自社製品の脆弱性リスクへの直接的な対応機能としては適切ではない。</p>","mnemonic":""},{"id":104,"year":2024,"period":"令和6年度春期","num":15,"cat":"テクノロジ系","field":"IPsec","summary":"IPsec：令和6年度春期 問15","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>PCからサーバに対し、IPv6を利用した通信を行う場合、ネットワーク層で暗号化を行うときに利用するものはどれか。</p>","choices":[{"label":"ア","html":"IPsec"},{"label":"イ","html":"PPP"},{"label":"ウ","html":"SSH"},{"label":"エ","html":"TLS"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。IPsec(IP Security)は、IPパケットそのものを暗号化・認証する仕組みであり、OSI参照モデルのネットワーク層(IP層)で動作する。そのため、上位のアプリケーションを問わずIP通信全体を保護でき、IPv6ではIPsecが標準的にサポートされている。</p><p>選択肢イのPPPはデータリンク層のプロトコルであり、ネットワーク層の暗号化を行うものではない。ウのSSHやエのTLSは、いずれもトランスポート層より上位(アプリケーション層寄り)で特定の通信(リモートログインやWebなど)を暗号化する技術であり、ネットワーク層での暗号化には該当しない。</p>","mnemonic":""},{"id":105,"year":2024,"period":"令和6年度春期","num":16,"cat":"テクノロジ系","field":"オブジェクト指向","summary":"オブジェクト指向：令和6年度春期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>オブジェクト指向におけるクラス間の関係のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"クラス間の関連は、二つのクラス間でだけ定義できる。"},{"label":"イ","html":"サブクラスではスーパークラスの操作を再定義することができる。"},{"label":"ウ","html":"サブクラスのインスタンスが、スーパークラスで定義されている操作を実行するときは、スーパークラスのインスタンスに操作を依頼する。"},{"label":"エ","html":"二つのクラスに集約の関係があるときには、集約オブジェクトは部分となるオブジェクトと、属性及び操作を共有する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はイ。オブジェクト指向において、サブクラス(派生クラス)はスーパークラス(基底クラス)から操作(メソッド)を継承しつつ、同じ名前の操作を独自の内容に再定義できる。これはオーバーライド(メソッドのオーバーライド)と呼ばれ、ポリモーフィズム(多態性)を実現する基本的な仕組みである。</p><p>選択肢アは誤りで、UMLのクラス図などではクラス間の関連を三つ以上のクラス間(多項関連)でも定義できる。ウも誤りで、サブクラスのインスタンスは継承した操作をスーパークラスのインスタンスに依頼するのではなく、自分自身でその操作を実行する。エも誤りで、集約関係にある全体オブジェクトと部分オブジェクトは、それぞれ独立した属性・操作をもつものであり、属性や操作を共有するわけではない。</p>","mnemonic":""},{"id":106,"year":2024,"period":"令和6年度春期","num":17,"cat":"テクノロジ系","field":"ゴンペルツ曲線","summary":"ゴンペルツ曲線：令和6年度春期 問17","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>ソフトウェア信頼度成長モデルの一つであって、テスト工程においてバグが収束したと判定する根拠の一つとして使用するゴンペルツ曲線はどれか。〔グラフの形状〕横軸はテスト項目消化数、縦軸は累積誤り検出数を表す。</p>","choices":[{"label":"ア","html":"消化数が増えるほど検出数の増加率がますます大きくなっていく、下に凸の急増曲線"},{"label":"イ","html":"原点から右肩上がりに一定の傾きで増加する直線"},{"label":"ウ","html":"開始は緩やかに増加し、中盤で急増したのち、後半で横ばいに近づくS字形の曲線"},{"label":"エ","html":"開始から急増し、徐々に増加率が小さくなりながら上に凸でなだらかに飽和していく曲線"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。ゴンペルツ曲線は、ソフトウェア信頼度成長モデルの代表例の一つで、テスト開始直後はバグの検出が緩やかに進み、テストが進むにつれて検出ペースが急激に高まり、その後テストの終盤に近づくにつれて検出数の増加が鈍化し一定値に収束していく、いわゆるS字型(S字カーブ)の形状を描く。この収束(飽和)の様子をもって、テストによるバグ摘出がほぼ終わった、すなわちバグが収束したと判断する根拠の一つとして用いられる。</p><p>選択肢アのように検出数の増加率がテストの進行とともにますます大きくなる単調な増加曲線や、イのような直線的な増加、エのように開始直後から急増しその後緩やかに飽和するだけでS字の立ち上がりをもたない曲線は、いずれもゴンペルツ曲線の特徴的なS字形状とは異なる。</p>","mnemonic":""},{"id":107,"year":2024,"period":"令和6年度春期","num":18,"cat":"マネジメント系","field":"EVM","summary":"EVM：令和6年度春期 問18","correct":"ア","result":"","formula":"CV=EV−AC、SV=EV−PV","howto":"グラフの高さの順にPV>AC>EVを読み取り、EV<ACならコスト超過、EV<PVなら進捗遅延と判定する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>EVMで管理しているプロジェクトがある。図は、プロジェクトの開始から完了予定までの期間の半分が経過した時点での状況である。コスト効率、スケジュール効率がこのまま推移すると仮定した場合の見通しのうち、適切なものはどれか。</p><p>〔グラフの状況〕現時点において、累積値の大きい順に PV(計画価値)が最も高く、次に AC(実コスト)、最も低い位置に EV(出来高)がある。すなわち EV &lt; AC &lt; PV である。</p>","choices":[{"label":"ア","html":"計画に比べてコストは多くなり、プロジェクトの完了は遅くなる。"},{"label":"イ","html":"計画に比べてコストは多くなり、プロジェクトの完了は早くなる。"},{"label":"ウ","html":"計画に比べてコストは少なくなり、プロジェクトの完了は遅くなる。"},{"label":"エ","html":"計画に比べてコストは少なくなり、プロジェクトの完了は早くなる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>EVM(アーンドバリューマネジメント)では、PV(計画価値)、EV(出来高/アーンドバリュー)、AC(実コスト)の3つの指標の大小関係からプロジェクトの状況を判断する。コスト差異 CV = EV − AC、スケジュール差異 SV = EV − PV として評価する。</p><p>図の現時点では、累積値の大小関係が PV &gt; AC &gt; EV となっている。EV &lt; AC であることから CV = EV − AC &lt; 0 となり、計画よりも実際に投入したコストの方が出来高を上回っている、すなわち計画に比べてコストが多くかかっている(コスト超過)状態であると分かる。</p><p>また EV &lt; PV であることから SV = EV − PV &lt; 0 となり、計画した出来高(PV)よりも実際の出来高(EV)が少ない、すなわち作業の進捗が計画より遅れている状態であると分かる。この傾向がこのまま続けば、プロジェクトはコストが計画より多くかかり、完了も計画より遅くなると見通せるので、選択肢アが正解となる。</p>","mnemonic":"一番低いEV(出来高)が主役不在、ACに食われコストは増え、PVに置いていかれ完了は遅れる"},{"id":108,"year":2024,"period":"令和6年度春期","num":19,"cat":"マネジメント系","field":"期待金額価値","summary":"期待金額価値：令和6年度春期 問19","correct":"ア","result":"","formula":"期待金額価値=Σ(確率×収入)−投資額","howto":"新規は180×0.7+50×0.3−100、既存は120×0.7+40×0.3−50を計算し、大きい方を採用する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>工場の生産能力を増強する方法として、新規システムを開発する案と既存システムを改修する案とを検討している。次の条件で、期待金額価値の高い案を採用するとき、採用すべき案と期待金額価値との組合せのうち、適切なものはどれか。ここで、期待金額価値は、収入と投資額との差で求める。</p><p>〔条件〕</p><ul><li>新規システムを開発する場合の投資額は100億円であって、既存システムを改修する場合の投資額は50億円である。</li><li>需要が拡大する確率は70%であって、需要が縮小する確率は30%である。</li><li>新規システムを開発した場合、需要が拡大したときは180億円の収入が見込まれ、需要が縮小したときは50億円の収入が見込まれる。</li><li>既存システムを改修した場合、需要が拡大したときは120億円の収入が見込まれ、需要が縮小したときは40億円の収入が見込まれる。</li><li>他の条件は考慮しない。</li></ul><table><tr><th></th><th>採用すべき案</th><th>期待金額価値(億円)</th></tr><tr><td>ア</td><td>既存システムの改修</td><td>46</td></tr><tr><td>イ</td><td>既存システムの改修</td><td>96</td></tr><tr><td>ウ</td><td>新規システムの開発</td><td>41</td></tr><tr><td>エ</td><td>新規システムの開発</td><td>130</td></tr></table>","choices":[{"label":"ア","html":"既存システムの改修、46億円"},{"label":"イ","html":"既存システムの改修、96億円"},{"label":"ウ","html":"新規システムの開発、41億円"},{"label":"エ","html":"新規システムの開発、130億円"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>期待金額価値(EMV)は、各選択肢について「確率×収入」の合計から投資額を差し引いて求める。</p><p>新規システムを開発する場合:期待収入 = 180×0.7 + 50×0.3 = 126 + 15 = 141(億円)。投資額100億円を引くと、期待金額価値 = 141 − 100 = 41(億円)。</p><p>既存システムを改修する場合:期待収入 = 120×0.7 + 40×0.3 = 84 + 12 = 96(億円)。投資額50億円を引くと、期待金額価値 = 96 − 50 = 46(億円)。</p><p>46億円(既存システムの改修)の方が41億円(新規システムの開発)よりも期待金額価値が高いため、採用すべき案は既存システムの改修、その期待金額価値は46億円となり、選択肢アと一致する。</p>","mnemonic":"新規=180×0.7+50×0.3−100=41億円、既存=120×0.7+40×0.3−50=46億円。46>41で僅差ながら手堅い改修案が勝つ"},{"id":109,"year":2024,"period":"令和6年度春期","num":20,"cat":"マネジメント系","field":"SLM","summary":"SLM：令和6年度春期 問20","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>サービスマネジメントにおけるサービスレベル管理の活動はどれか。</p>","choices":[{"label":"ア","html":"現在の資源の調整と最適化とを行い、将来の資源要件に関する予測を記載した計画を作成する。"},{"label":"イ","html":"サービスの提供に必要な予算に応じて、適切な資金を確保する。"},{"label":"ウ","html":"災害や障害などで事業が中断しても、要求されたサービス機能を合意された期間内に確実に復旧できるように、事業影響度の評価や復旧優先順位を明確にする。"},{"label":"エ","html":"提供するサービス及びサービスレベル目標を決定し、サービス提供者が顧客との間で合意文書を交わす。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。サービスレベル管理(SLM: Service Level Management)は、提供するITサービスの内容とサービスレベル目標(応答時間や稼働率など)を顧客と合意のうえで定義し、SLA(サービスレベルアグリーメント)などの合意文書を取り交わし、その達成状況を継続的にモニタリング・報告・改善していく活動である。</p><p>選択肢アはキャパシティ管理(将来の資源要件の予測と計画)の活動、イは財務管理(予算確保)の活動、ウはITサービス継続性管理(事業影響度分析や復旧優先順位の明確化)の活動であり、いずれもサービスレベル管理そのものの活動ではなく、サービスマネジメントの別のプロセスに該当する。</p>","mnemonic":""},{"id":110,"year":2024,"period":"令和6年度春期","num":21,"cat":"マネジメント系","field":"システム監査基準","summary":"システム監査基準：令和6年度春期 問21","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>システム監査基準(令和5年)によれば、システム監査において、監査人が一定の基準に基づいて総合的に点検・評価を行う対象とするものは、情報システムのマネジメント、コントロールと、あと一つはどれか。</p>","choices":[{"label":"ア","html":"ガバナンス"},{"label":"イ","html":"コンプライアンス"},{"label":"ウ","html":"サイバーレジリエンス"},{"label":"エ","html":"モニタリング"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はア。経済産業省が公表するシステム監査基準(令和5年改訂)では、システム監査人は、組織体の情報システムにまつわる「ガバナンス」、「マネジメント」、「コントロール」の三つを総合的に点検・評価の対象とすることが明確化されている。これは、従来のマネジメントやコントロールの適切性評価に加えて、経営陣による情報システムガバナンスの発揮状況も監査の射程に含めることで、より経営に資するシステム監査を志向した改訂によるものである。</p><p>選択肢のコンプライアンスやモニタリングはガバナンス・マネジメント・コントロールを支える個別要素であり、サイバーレジリエンスは監査の重要な着眼点の一つではあるが、同基準が総合的点検・評価の対象として明示する三つの柱には含まれていない。</p>","mnemonic":""},{"id":111,"year":2024,"period":"令和6年度春期","num":22,"cat":"マネジメント系","field":"IT統制","summary":"IT統制：令和6年度春期 問22","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>情報システムに対する統制をITに係る全般統制とITに係る業務処理統制に分けたとき、ITに係る業務処理統制に該当するものはどれか。</p>","choices":[{"label":"ア","html":"サーバ室への入退室を制限・記録するための入退室管理システム"},{"label":"イ","html":"システム開発業務を適切に委託するために定めた選定手続"},{"label":"ウ","html":"販売管理システムにおける入力データの正当性チェック機能"},{"label":"エ","html":"不正アクセスを防止するためのファイアウォールの運用管理"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はウ。IT統制は大きく、情報システム全般に共通して適用される「IT全般統制」と、個々の業務アプリケーションに組み込まれて特定の業務処理の正確性・網羅性を担保する「IT業務処理統制」に分けられる。販売管理システムにおける入力データの正当性チェック(入力値の形式チェックや照合チェックなど)は、特定の業務システムの処理そのものに組み込まれた統制であり、IT業務処理統制の典型例である。</p><p>これに対し、選択肢ア(入退室管理)、イ(委託先選定手続)、エ(ファイアウォールの運用管理)は、特定の業務アプリケーションに限定されない、情報システム基盤全体に共通する統制であり、いずれもIT全般統制に分類される。</p>","mnemonic":""},{"id":112,"year":2024,"period":"令和6年度春期","num":23,"cat":"ストラテジ系","field":"SOA","summary":"SOA：令和6年度春期 問23","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>SOAの説明はどれか。</p>","choices":[{"label":"ア","html":"会計、人事、製造、購買、在庫管理、販売などの企業の業務プロセスを一元管理することによって、業務の効率化や経営資源の全体最適を図る手法"},{"label":"イ","html":"企業の業務プロセス、システム化要求などのニーズと、ソフトウェアパッケージの機能性がどれだけ適合し、どれだけかい離しているかを分析する手法"},{"label":"ウ","html":"業務プロセスの問題点を洗い出して、目標設定、実行、チェック、修正行動のマネジメントサイクルを適用し、継続的な改善を図る手法"},{"label":"エ","html":"利用者の視点から業務システムの機能を幾つかの独立した部品に分けることによって、業務プロセスとの対応付けや他ソフトウェアとの連携を容易にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。SOA(Service Oriented Architecture:サービス指向アーキテクチャ)は、業務システムがもつ機能を、利用者の視点から意味のあるまとまりをもつ独立した「サービス」という部品に分割し、それらを組み合わせることで業務プロセスとの対応付けをとりやすくし、また標準的なインタフェースを介して他のソフトウェアとの連携(再利用や組合せ)を容易にする設計手法・考え方である。</p><p>選択肢アはERP(統合基幹業務システム)の説明、イはFit &amp; Gap分析の説明、ウはPDCAサイクルを用いた業務改善の説明であり、いずれもSOAそのものの説明ではない。</p>","mnemonic":""},{"id":113,"year":2024,"period":"令和6年度春期","num":24,"cat":"ストラテジ系","field":"EMS","summary":"EMS：令和6年度春期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>EMS(Electronics Manufacturing Services)の説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"相手先ブランドで販売する電子機器の設計だけを受託し、製造は相手先で行う。"},{"label":"イ","html":"外部から調達した電子機器に付加価値を加えて、自社ブランドで販売する。"},{"label":"ウ","html":"自社ブランドで販売する電子機器のソフトウェア開発だけを外部に委託し、ハードウェアは自社で設計製造する。"},{"label":"エ","html":"生産設備をもつ企業が、他社からの委託を受けて電子機器を製造する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。EMS(Electronics Manufacturing Services)とは、自ら製造設備をもつ企業が、他の電子機器メーカーなどから製造工程を受託し、電子機器を製造するビジネス形態、またそれを担う企業を指す。設計はブランドをもつ委託元企業が行い、EMS企業は主に製造(場合により調達や物流も含む)を担うのが一般的である。</p><p>選択肢アは設計のみ受託し製造は相手先で行うとしており、EMSとは逆の関係の説明になっている。イは外部調達品に付加価値を付けて自社ブランドで売る説明で、ブランドオーナー側の説明に近く、ウは自社で製造しソフトウェアだけ外部委託するという、ハードウェア製造を受託するEMSの趣旨とは逆の内容になっている。</p>","mnemonic":""},{"id":114,"year":2024,"period":"令和6年度春期","num":25,"cat":"ストラテジ系","field":"コンティンジェンシープラン","summary":"コンティンジェンシープラン：令和6年度春期 問25","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>組込み機器のハードウェアの製造を外部に委託する場合のコンティンジェンシープランの記述として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"実績のある外注先の利用によって、リスクの発生確率を低減する。"},{"label":"イ","html":"製造品質が担保されていることを確認できるように委託先と契約する。"},{"label":"ウ","html":"複数の会社の見積りを比較検討して、委託先を選定する。"},{"label":"エ","html":"部品調達のリスクが顕在化したときに備えて、対処するための計画を策定する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。コンティンジェンシープランとは、リスクが実際に発生(顕在化)してしまった場合に備えて、あらかじめ被害を最小限に抑え事業やプロジェクトへの影響に対処するための具体的な行動計画を策定しておくことであり、いわば「発生時対応計画」である。部品調達のリスクが現実に発生したときにどう対処するかを計画しておくという選択肢エの内容が、この定義に合致する。</p><p>選択肢アは信頼できる外注先を使うことでリスクの発生確率そのものを下げる取組み、イは委託先との契約内容による品質担保、ウは複数見積りによる委託先選定であり、いずれもリスク発生前の予防的・選定的な取組みであって、リスク発生後の対応計画であるコンティンジェンシープランには該当しない。</p>","mnemonic":""},{"id":115,"year":2024,"period":"令和6年度春期","num":26,"cat":"ストラテジ系","field":"ファイブフォース分析","summary":"ファイブフォース分析：令和6年度春期 問26","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2024r06.html","q":"<p>企業が属する業界の競争状態と収益構造を、\"新規参入の脅威\"、\"供給者の支配力\"、\"買い手の交渉力\"、\"代替製品・サービスの脅威\"、\"既存競合者同士の敵対関係\"の要素に分類して、分析するフレームワークはどれか。</p>","choices":[{"label":"ア","html":"PEST分析"},{"label":"イ","html":"VRIO分析"},{"label":"ウ","html":"バリューチェーン分析"},{"label":"エ","html":"ファイブフォース分析"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>正解はエ。ファイブフォース分析は、経営学者マイケル・ポーターが提唱したフレームワークで、業界の競争構造と収益性を、「新規参入の脅威」「供給者(売り手)の交渉力」「買い手の交渉力」「代替製品・サービスの脅威」「既存競合者同士の敵対関係」という五つの競争要因(five forces)に分解して分析する手法である。これにより、ある業界がなぜ儲かりやすい、あるいは儲かりにくい構造になっているのかを体系的に把握できる。</p><p>選択肢アのPEST分析は政治・経済・社会・技術のマクロ環境分析、イのVRIO分析は自社の経営資源の競争優位性を評価するフレームワーク、ウのバリューチェーン分析は自社の活動を価値連鎖として分解し強み・弱みを分析する手法であり、いずれも設問
