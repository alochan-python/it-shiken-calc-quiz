<meta charset="UTF-8">
<title>午前I問題道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="午前I問題道場">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FA; --bg-elevated:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECEEF5;
  --border:#DBDEE9; --border-soft:#E7E9F2;
  --text:#1B2130; --text-dim:#5B6478; --text-faint:#8991A3;
  --accent:#0E7C86; --accent-strong:#0A5E66; --accent-soft:#E1F1F1; --accent-contrast:#FFFFFF;
  --success:#1F8A4C; --success-soft:#E3F5E9;
  --danger:#C8392F; --danger-soft:#FBEAE8;
  --warning:#B4790F; --warning-soft:#FBF0DA;
  --cat-tech:#2F5FD6; --cat-tech-soft:#E7ECFC;
  --cat-mgmt:#7A4FC9; --cat-mgmt-soft:#F0EBFB;
  --cat-strat:#1E8F72; --cat-strat-soft:#E4F5F0;
  --shadow:0 1px 2px rgba(24,32,56,.06), 0 8px 24px rgba(24,32,56,.08);
  --shadow-lg:0 4px 8px rgba(24,32,56,.08), 0 16px 40px rgba(24,32,56,.12);
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --font-display:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
  --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
    --border:#2B3145; --border-soft:#242A3B;
    --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
    --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
    --success:#4BC382; --success-soft:rgba(75,195,130,.14);
    --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
    --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
    --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
    --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
    --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --bg-elevated:#181C28; --surface:#181C28; --surface-2:#1F2432;
  --border:#2B3145; --border-soft:#242A3B;
  --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
  --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
  --success:#4BC382; --success-soft:rgba(75,195,130,.14);
  --danger:#E8756B; --danger-soft:rgba(232,117,107,.14);
  --warning:#E3B152; --warning-soft:rgba(227,177,82,.14);
  --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
  --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
  --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 8px rgba(0,0,0,.35), 0 20px 48px rgba(0,0,0,.45);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
h1,h2,h3,h4,.disp{font-family:var(--font-display); text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit; touch-action:manipulation; color:inherit; background:none}
::selection{background:var(--accent-soft)}

#app{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
@media (min-width:700px){ #app{max-width:880px} }
.view{display:none}
.view.active{display:block}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .brand{display:flex;flex-direction:column;gap:2px}
.topbar h1{font-size:1.3rem;font-weight:900;letter-spacing:.01em;margin:0}
.topbar .sub{font-size:.74rem;color:var(--text-faint);letter-spacing:.04em}
.iconbtn{
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
  border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- Dashboard ---------- */
.hero{
  display:flex;align-items:center;gap:20px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow);
  margin-bottom:16px;
}
.ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:9}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .pct{font-family:var(--font-display);font-weight:900;font-size:1.5rem;line-height:1}
.ring-label .pct-cap{font-size:.62rem;color:var(--text-faint);margin-top:2px;letter-spacing:.03em}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;flex:1;min-width:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;border-bottom:1px dashed var(--border-soft);padding:3px 0}
.stat-row b{font-family:var(--font-display);font-size:1rem}
.stat-row .lbl{color:var(--text-dim)}

.section-label{font-size:.72rem;font-weight:700;color:var(--text-faint);letter-spacing:.08em;margin:22px 2px 8px;text-transform:uppercase}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{
  text-align:left;border:1px solid var(--border-soft);background:var(--surface);
  border-radius:var(--radius-m);padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.mode-card:disabled{opacity:.45;cursor:not-allowed}
.mode-card:not(:disabled):hover{border-color:var(--accent)}
.mode-card .mc-count{font-family:var(--font-display);font-weight:900;font-size:1.7rem;color:var(--accent)}
.mode-card .mc-title{font-size:.86rem;font-weight:700;margin-top:2px}
.mode-card .mc-desc{font-size:.72rem;color:var(--text-faint);margin-top:2px}
.mode-card.retry .mc-count{color:var(--danger)}
.mode-card.checked .mc-count{color:var(--warning)}
.mode-card.fresh .mc-count{color:var(--text-dim)}

.filters{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:14px;box-shadow:var(--shadow)}
.filter-group{margin-bottom:10px}
.filter-group:last-child{margin-bottom:0}
.filter-group .fg-label{font-size:.7rem;color:var(--text-faint);margin-bottom:6px;letter-spacing:.03em}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
  border-radius:999px;padding:5px 12px;font-size:.76rem;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);font-weight:700}
.chip.chip-green{border-color:var(--success);color:var(--success)}
.chip.chip-green.active{background:var(--success);border-color:var(--success);color:#fff}
.chip.chip-yellow{border-color:var(--warning);color:var(--warning)}
.chip.chip-yellow.active{background:var(--warning);border-color:var(--warning);color:#fff}
.chip.chip-red{border-color:var(--danger);color:var(--danger)}
.chip.chip-red.active{background:var(--danger);border-color:var(--danger);color:#fff}

.start-cta{
  width:100%;margin-top:14px;background:var(--accent);color:var(--accent-contrast);border:none;
  border-radius:999px;padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);
}
.start-cta:disabled{opacity:.4;cursor:not-allowed}
.filtercount{text-align:center;font-size:.74rem;color:var(--text-faint);margin-top:8px}

.danger-zone{margin-top:26px;text-align:center}
.link-btn{background:none;border:none;color:var(--text-faint);font-size:.72rem;text-decoration:underline;cursor:pointer}

/* ---------- Quiz ---------- */
.quizbar{position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:12px 0 10px;z-index:5;display:flex;align-items:center;gap:10px}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcounter{font-size:.76rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}

.qcard{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:14px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.badge{border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700;letter-spacing:.02em}
.badge.cat-tech{background:var(--cat-tech-soft);color:var(--cat-tech)}
.badge.cat-mgmt{background:var(--cat-mgmt-soft);color:var(--cat-mgmt)}
.badge.cat-strat{background:var(--cat-strat-soft);color:var(--cat-strat)}
.badge.meta{background:var(--surface-2);color:var(--text-dim);font-weight:500}
.badge.check-green{background:var(--success-soft);color:var(--success)}
.badge.check-yellow{background:var(--warning-soft);color:var(--warning)}
.badge.check-red{background:var(--danger-soft);color:var(--danger)}

.qtext{font-size:.94rem;line-height:1.6}
.qtext table,.expl-body table{border-collapse:collapse;margin:.8em 0;font-size:.92em;max-width:100%}
.qtext td,.qtext th,.expl-body td,.expl-body th{border:1px solid var(--border);padding:5px 10px;text-align:left}
.qtext th,.expl-body th{background:var(--surface-2);font-weight:700}
.qtext{overflow-x:auto}
.qtext img{max-width:100%;height:auto;display:block;margin:1em auto}
.qtext ul, .expl-body ul, .choice-item ul{padding-left:0;margin:.6em 0}
.qtext ul > li, .expl-body ul > li{list-style:none}
.qtext li[class^="li"],.qtext li[class^="maru"],.expl-body li[class^="li"],.expl-body li[class^="maru"]{
  position:relative;padding-left:2em;margin:0 0 6px}
.qtext li[class^="li"]::before,.expl-body li[class^="li"]::before{position:absolute;left:0;top:1px}
li.lia::before{content:"ア"}li.lii::before{content:"イ"}li.liu::before{content:"ウ"}li.lie::before{content:"エ"}
li.li1{counter-reset:licount}
li.li1::before,li.li2::before,li.li3::before,li.li4::before,li.li5::before,li.li6::before{counter-increment:licount;content:"(" counter(licount) ")"}
li[class^="maru"]{counter-increment:marucount}
li.maru1{counter-reset:marucount}
li[class^="maru"]::before{position:absolute;left:0;top:5px;counter-increment:marucount;content:counter(marucount);border:1px solid currentColor;border-radius:50%;text-align:center;font-size:11px;width:14px;height:14px;line-height:13px}
ul.none li{padding-left:0}
ul.none li::before{content:none}
.frac{display:inline-block;text-align:center;vertical-align:middle;line-height:1.4;min-width:1.6em;margin:0 .15em}
.frac>span:not([class]){display:block;border-bottom:1.5px solid currentColor;padding:0 .1em}
em.r{color:var(--danger);font-style:normal;font-weight:700}
em.g{color:var(--success);font-style:normal;font-weight:700}
.bb{display:inline-block;border:1.5px solid var(--text-dim);min-width:6ex;padding:1px 10px;margin:0 2px;text-align:center;border-radius:4px}
.code,.pre{font-family:Menlo,Consolas,monospace;font-size:.92em}
.pre{background:var(--surface-2);border-radius:6px;border-left:3px solid var(--border);padding:8px 10px;margin:.6em 0;overflow-x:auto;white-space:pre}
span.code{background:var(--surface-2);border-radius:5px;padding:1px 6px;border:1px solid var(--border)}
.img_margin{text-align:center;margin:1em auto !important}

.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice-item{
  display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:10px 12px;cursor:pointer;font-size:.9rem;line-height:1.5;color:var(--text);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.choice-item:hover{border-color:var(--accent)}
.choice-item .clabel{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--text-dim);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84rem;font-family:var(--font-display);
}
.choice-item .ctext{flex:1;padding-top:2px;color:var(--text)}
.choice-item .ctext img{max-width:100%}
.choices.locked .choice-item{cursor:default}
.choice-item.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice-item.picked .clabel{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.choice-item.correct-answer{border-color:var(--success);background:var(--success-soft)}
.choice-item.correct-answer .clabel{background:var(--success);border-color:var(--success);color:#fff}
.choice-item.wrong-pick{border-color:var(--danger);background:var(--danger-soft)}
.choice-item.wrong-pick .clabel{background:var(--danger);border-color:var(--danger);color:#fff}

.shared-block{margin-top:14px}
.shared-block img{max-width:100%}
.shared-block .selectList{list-style:none;padding:0;margin:0}
.label-row{display:flex;gap:8px;margin-top:14px}
.label-btn{
  flex:1;border:2px solid var(--border);background:var(--surface-2);border-radius:var(--radius-s);
  padding:11px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--text-dim);
  box-shadow:0 1px 2px rgba(24,32,56,.05);
}
.label-btn:hover{border-color:var(--accent)}
.label-btn.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.label-btn.correct-answer{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.label-btn.wrong-pick{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

/* stamp */
.stamp-row{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.stamp{width:42px;height:42px;flex-shrink:0}
.stamp svg{width:100%;height:100%;overflow:visible}
.stamp circle,.stamp path{fill:none;stroke:var(--success);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220;animation:draw .55s ease-out forwards}
.stamp.wrong circle,.stamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stamp circle,.stamp path{animation:none;stroke-dashoffset:0}}

/* big center-screen stamp flash */
#bigStamp{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:50;opacity:0;
}
#bigStamp svg{width:min(46vw,220px);height:min(46vw,220px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.18))}
#bigStamp circle,#bigStamp path{fill:none;stroke:var(--success);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220}
#bigStamp.wrong circle,#bigStamp.wrong path{stroke:var(--danger);stroke-dasharray:130;stroke-dashoffset:130}
#bigStamp.show{animation:bigStampPop .9s cubic-bezier(.2,.8,.2,1) forwards}
#bigStamp.show circle,#bigStamp.show path{animation:draw .4s ease-out .05s forwards}
@keyframes bigStampPop{
  0%{opacity:0; transform:scale(.6) rotate(-8deg)}
  16%{opacity:1; transform:scale(1.08) rotate(2deg)}
  26%{transform:scale(1) rotate(0)}
  72%{opacity:1; transform:scale(1) rotate(0)}
  100%{opacity:0; transform:scale(1.04) rotate(0)}
}
@media (prefers-reduced-motion:reduce){
  #bigStamp.show{animation:none; opacity:0}
}

/* big answer reveal (correct letter + mnemonic) */
.answer-reveal{
  display:flex; gap:11px; align-items:flex-start;
  background:linear-gradient(135deg, var(--accent-soft), transparent 160%);
  border:2px solid var(--accent); border-radius:var(--radius-m);
  padding:12px 13px; margin:8px 0;
}
.ar-letter{
  flex-shrink:0; width:44px; height:44px; border-radius:50%;
  background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:1.4rem;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.ar-body{flex:1; min-width:0}
.ar-h{display:flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;color:var(--accent-strong);letter-spacing:.05em;margin-bottom:3px}
:root:not([data-theme="light"]) .ar-h{color:var(--accent)}
:root[data-theme="dark"] .ar-h{color:var(--accent)}
.ar-mnemonic{font-size:1.02rem; line-height:1.55; font-weight:700; color:var(--text)}
.stamp-text b{font-family:var(--font-display);font-size:1.3rem}
.stamp-text.ok b{color:var(--success)}
.stamp-text.ng b{color:var(--danger)}
.stamp-text div{font-size:.8rem;color:var(--text-dim);margin-top:2px}

.auto-bar{margin-bottom:14px}
.auto-bar-label{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text-faint);margin-bottom:5px;letter-spacing:.02em}
.auto-bar-track{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.auto-bar-fill{height:100%;background:var(--accent);border-radius:99px;width:100%}
.auto-bar-fill.advancing{background:var(--success)}

.result-panel{margin-top:6px;border-top:1px dashed var(--border-soft);padding-top:10px}
.tip-box{background:var(--surface-2);border-radius:var(--radius-s);padding:9px 12px;margin:8px 0;font-size:.82rem}
.tip-box .tip-h{font-size:.68rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:4px}
.expl-h{font-size:.78rem;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin:16px 0 8px;text-transform:uppercase}
.expl-body{font-size:.9rem;line-height:1.85}
.expl-body img{max-width:100%;display:block;margin:1em auto}

.linkrow{display:flex;gap:14px;margin-top:14px;font-size:.78rem}
.linkrow a{text-decoration:none;color:var(--text-dim);border-bottom:1px solid var(--border)}
.linkrow a:hover{color:var(--accent);border-color:var(--accent)}

.footer-actions{display:flex;align-items:center;gap:8px;margin-top:4px}
.check-row{display:flex;gap:6px;flex-shrink:0}
.check-dot{
  width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg-elevated);
  font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:.45;filter:grayscale(.6);
}
.check-dot.active{opacity:1;filter:none;transform:scale(1.08);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.check-dot.green.active{border-color:var(--success)}
.check-dot.yellow.active{border-color:var(--warning)}
.check-dot.red.active{border-color:var(--danger)}
.next-btn{
  flex:1;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:999px;
  padding:12px;font-size:.9rem;font-weight:700;cursor:pointer;
}
.next-btn:disabled{opacity:.35;cursor:not-allowed}

.quiz-nav{display:flex;justify-content:space-between;margin-top:10px}
.ghost-btn{background:none;border:none;color:var(--text-faint);font-size:.78rem;cursor:pointer;padding:6px 4px}
.ghost-btn:hover{color:var(--text)}

/* jump grid */
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:6px}
.jump-cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);
  font-size:.68rem;color:var(--text-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.jump-cell.current{outline:2px solid var(--accent);outline-offset:1px}
.jump-cell.correct{background:var(--success-soft);color:var(--success);border-color:transparent}
.jump-cell.wrong{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.jump-cell.check-green{box-shadow:inset 0 -3px 0 var(--success)}
.jump-cell.check-yellow{box-shadow:inset 0 -3px 0 var(--warning)}
.jump-cell.check-red{box-shadow:inset 0 -3px 0 var(--danger)}

/* done screen */
.done-wrap{text-align:center;padding:40px 10px}
.done-wrap h2{font-size:1.4rem;margin-bottom:6px}
.done-wrap p{color:var(--text-dim);font-size:.88rem}

@media(max-width:420px){
  .mode-grid{grid-template-columns:1fr}
}

/* wider screens (iPad etc.): lay choices out 2-up so the question+choices
   block is shorter, leaving the answer/mnemonic visible without scrolling */
@media (min-width:700px){
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .label-row{max-width:420px}
}

/* once answered, shrink the choice list so the answer card below doesn't
   require scrolling to reach */
#choicesWrap.answered .choice-item{padding:6px 10px;font-size:.8rem;line-height:1.3}
#choicesWrap.answered .choice-item .clabel{width:21px;height:21px;font-size:.72rem}
#choicesWrap.answered .choices{gap:5px}
#choicesWrap.answered .label-btn{padding:7px;font-size:.88rem}
#choicesWrap.answered .label-row{margin-top:8px}
</style>

<script>
(function(){
  function showErr(msg){
    var b = document.getElementById('jsDebug');
    if(!b){
      b = document.createElement('div');
      b.id = 'jsDebug';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;'
        + 'padding:10px 14px;font:12px/1.5 -apple-system,sans-serif;font-weight:bold;white-space:pre-wrap;'
        + 'max-height:40vh;overflow:auto';
      document.body.insertBefore(b, document.body.firstChild);
    }
    b.textContent += (b.textContent?'\n\n':'') + msg;
  }
  window.addEventListener('error', function(e){
    showErr('JSエラー: ' + e.message + ' (' + (e.filename||'') + ':' + e.lineno + ':' + e.colno + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('Promiseエラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>

<script id="qdata" type="application/json">[{"id":0,"year":2025,"period":"令和7年度秋期","num":1,"cat":"テクノロジ系","field":"待ち行列理論","summary":"待ち行列理論：令和7年度秋期 問1","correct":"イ","result":"","formula":"Wq = ρ/(1-ρ) × Ts（M/M/1の平均待ち時間公式）","howto":"Wq≥Ts(=T)となる利用率ρの最小値を、不等式 ρ/(1-ρ)≥1 を解いて求める。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>コンピュータによる伝票処理システムがある。このシステムは、伝票データをためる待ち行列をもち、M/M/1の待ち行列モデルが適用できるものとする。平均待ち時間がT秒以上となるのは、システムの利用率が少なくとも何％以上となったときか。ここで、伝票データをためる待ち行列の特徴は次のとおりである。</p><ul><li>伝票データは、ポアソン分布に従って到着する。</li><li>伝票データをためる数に制限はない。</li><li>1件の伝票データの処理時間は、平均T秒の指数分布に従う。</li></ul>","choices":[{"label":"ア","html":"33"},{"label":"イ","html":"50"},{"label":"ウ","html":"67"},{"label":"エ","html":"80"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>M/M/1待ち行列モデルでは、平均待ち時間(サービス開始前の待ち時間)は Wq = ρ/(1-ρ) × Ts で表される。ここでρは利用率、Tsは平均サービス時間である。</p><p>本問ではサービス時間の平均がTなのでTs=Tとなる。平均待ち時間がT秒以上となる条件は次のとおり。</p><p>ρ/(1-ρ) × T ≥ T</p><p>両辺をTで割ると ρ/(1-ρ) ≥ 1 となり、これを解くと ρ ≥ 1-ρ、すなわち 2ρ ≥ 1、ρ ≥ 0.5 となる。</p><p>したがって、利用率が50%以上になると平均待ち時間はT秒以上になる。正解はイ。</p>","mnemonic":"「五分五分(50%)で追いつかれる」―ρ/(1－ρ)が1を超えるのはちょうど五分五分のとき、待ち行列も人生も五分五分がターニングポイント。"},{"id":1,"year":2025,"period":"令和7年度秋期","num":2,"cat":"テクノロジ系","field":"ROC曲線","summary":"ROC曲線：令和7年度秋期 問2","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>AIにおける機械学習において、2クラス分類モデルの評価方法の一つであるROC曲線で用いられる偽陽性率の説明として、最も適切なものはどれか。ここで、分類されるデータには正しいものと間違っているものが含まれるものとする。</p>","choices":[{"label":"ア","html":"“間違い”と予測したデータのうち、実際は“正しい”データの割合"},{"label":"イ","html":"実際に“間違い”であるデータに対し、誤って“正しい”と予測したデータの割合"},{"label":"ウ","html":"実際に“間違い”であるデータに対し、正しく“間違い”と予測したデータの割合"},{"label":"エ","html":"全データのうち、実際に正しく予測できなかったデータの割合"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>偽陽性率(False Positive Rate, FPR)は、実際には“間違い”(陰性)であるデータのうち、モデルが誤って“正しい”(陽性)と予測してしまった割合のことで、FP/(FP+TN)で計算される。ROC曲線は、分類の閾値を変化させながら、縦軸に真陽性率(TPR)、横軸に偽陽性率(FPR)をとってプロットしたものであり、FPRはその横軸にあたる指標である。</p><p>選択肢アは予測が“間違い”とされたデータのうち実際は“正しい”ものの割合であり、これは適合率系の指標で、FPRの定義とは異なる。選択肢ウは実際に“間違い”であるデータのうち正しく“間違い”と判定できた割合であり、これは真陰性率(特異度)でありFPRの補数(1-FPR)に相当する。選択肢エは全体に対する誤判定の割合(誤り率)であり、やはりFPRとは別の指標である。</p><p>以上から、実際には“間違い”であるデータに対して誤って“正しい”と予測した割合を表すイが、偽陽性率の説明として適切である。</p>","mnemonic":""},{"id":2,"year":2025,"period":"令和7年度秋期","num":3,"cat":"テクノロジ系","field":"探索アルゴリズム","summary":"探索アルゴリズム：令和7年度秋期 問3","correct":"イ","result":"","formula":"平均比較回数 = m/2 + n/(2m)","howto":"ブロック代表値の線形探索(対象n/m個)とブロック内線形探索(対象m個)、それぞれの平均比較回数(対象数+1)/2を、mとnが十分大きいとして近似し合計する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>異なるn個のデータが昇順に整列された表がある。この表をm個のデータごとのブロックに分割し、各ブロックの最後尾のデータだけを線形探索することによって、目的のデータの存在するブロックを探し出す。次に、当該ブロック内を線形探索して目的のデータを探し出す。このときの平均比較回数を表す式はどれか。ここで、mは十分に大きく、nはmの倍数とし、目的のデータは必ず表の中に存在するものとする。</p>","choices":[{"label":"ア","html":"m + n/m"},{"label":"イ","html":"m/2 + n/(2m)"},{"label":"ウ","html":"n/m"},{"label":"エ","html":"n/(2m)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>n個のデータをm個ずつのブロックに分割すると、ブロック数はn/m個になる。</p><p>まず各ブロックの最後尾データをブロック数ぶん線形探索して目的のブロックを特定する。平均比較回数は、n/mが十分大きいとき(n/m+1)/2 ≈ n/(2m) で近似できる。</p><p>次に特定したブロック内(m個)を線形探索する。平均比較回数は(m+1)/2 ≈ m/2 で近似できる(mも十分大きいため)。</p><p>両者を合計すると、平均比較回数 ≈ m/2 + n/(2m) となる。正解はイ。</p>","mnemonic":"「エムにぶん(m/2)とエヌにエムぶん(n/2m)」―代表探索とブロック内探索、2段構えの線形探索はどちらも半分が目安。"},{"id":3,"year":2025,"period":"令和7年度秋期","num":4,"cat":"テクノロジ系","field":"プロセッサ高速化","summary":"プロセッサ高速化：令和7年度秋期 問4","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>プロセッサの高速化技法の一つとして、同時に実行可能な複数の動作を、コンパイルの段階でまとめて一つの複合命令とし、高速化を図る方式はどれか。</p>","choices":[{"label":"ア","html":"CISC"},{"label":"イ","html":"MIMD"},{"label":"ウ","html":"RISC"},{"label":"エ","html":"VLIW"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>VLIW(Very Long Instruction Word)は、同時に実行可能な複数の演算(動作)をコンパイラが解析し、それらをコンパイル時にあらかじめ一つの長い複合命令にまとめておくことで、実行時に複数の演算ユニットを並列に動かし高速化を図るプロセッサアーキテクチャである。命令レベルの並列性をハードウェアではなくコンパイラが静的に見つけ出す点が特徴で、実行時にハードウェアが動的に並列実行を判断するスーパースカラ方式とは対照的である。</p><p>選択肢のCISC(複雑命令セットコンピュータ)は一つの命令で複雑な処理を行わせる設計思想、RISCは命令を単純化し高速なクロックで実行する設計思想であり、どちらも複数動作をコンパイル段階で一命令にまとめる技法そのものではない。MIMD(Multiple Instruction stream, Multiple Data stream)は複数のプロセッサがそれぞれ異なる命令を異なるデータに対して実行する並列処理の分類であり、単一プロセッサ内でのコンパイル時命令合成とは異なる概念である。</p><p>したがって、正解はエのVLIWである。</p>","mnemonic":""},{"id":4,"year":2025,"period":"令和7年度秋期","num":5,"cat":"テクノロジ系","field":"容量計画","summary":"容量計画：令和7年度秋期 問5","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>キャパシティプランニングの目的の一つに関する記述のうち、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"応答時間に最も影響があるボトルネックだけに着目して、適切な変更を行うことによって、そのボトルネックの影響を低減又は排除することである。"},{"label":"イ","html":"システムの現在の応答時間を調査して、長期的に監視することによって、将来を含めて応答時間を維持することである。"},{"label":"ウ","html":"ソフトウェアとハードウェアをチューニングして、現状の処理能力を最大限に引き出して、スループットを向上させることである。"},{"label":"エ","html":"パフォーマンスの問題はリソースの過剰使用によって発生するので、特定のリソースの有効利用を向上させることである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>キャパシティプランニングとは、現在および将来のシステム利用状況や需要を見積もり、必要なハードウェア・ネットワークなどのリソースを計画的に確保・配分することで、将来にわたりサービスレベル(応答時間やスループットなど)を適切に維持し続けるための活動である。したがって、現在の応答時間を調査し、将来を見据えて長期的に監視・計画することで応答時間を維持するというイの記述が、その目的として最も適切である。</p><p>選択肢アはボトルネックの解消に特化した記述であり、これは個別のパフォーマンスチューニング(性能改善)の説明に近く、将来を見据えた容量計画という視点が欠けている。選択肢ウも同様に、現状のハードウェア・ソフトウェアのチューニングによるスループット向上という短期的・局所的な性能改善の説明であり、将来予測に基づく計画という観点がない。選択肢エはリソースの“過剰使用”が性能問題の原因であると限定しており、キャパシティプランニングの一般的な目的の説明としては不適切である。</p>","mnemonic":""},{"id":5,"year":2025,"period":"令和7年度秋期","num":6,"cat":"テクノロジ系","field":"キャッシュ置換","summary":"キャッシュ置換：令和7年度秋期 問6","correct":"エ","result":"","formula":"LRU：最終参照時刻が最も古いブロックを置換対象とする","howto":"各ブロックの最終参照時刻・ロード時刻・参照回数を比較し、どの基準でC2が選ばれるか照合する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>4ブロックのキャッシュメモリC0〜C3が表に示す状態である。ここで、新たに別のブロックの内容をキャッシュメモリにロードする必要が生じたとき、C2のブロックを置換の対象とするアルゴリズムはどれか。</p><table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse\"><tr><th>キャッシュメモリ</th><th>ロード時刻(分:秒)</th><th>最終参照時刻(分:秒)</th><th>参照回数</th></tr><tr><td>C0</td><td>0:00</td><td>0:08</td><td>10</td></tr><tr><td>C1</td><td>0:03</td><td>0:06</td><td>1</td></tr><tr><td>C2</td><td>0:04</td><td>0:05</td><td>3</td></tr><tr><td>C3</td><td>0:05</td><td>0:10</td><td>5</td></tr></table>","choices":[{"label":"ア","html":"FIFO"},{"label":"イ","html":"LFU"},{"label":"ウ","html":"LIFO"},{"label":"エ","html":"LRU"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>各キャッシュブロックの最終参照時刻を比較すると、C0は0:08、C1は0:06、C2は0:05、C3は0:10である。最も古い最終参照時刻を持つのはC2(0:05)であり、これは「直近で最も長く参照されていないブロック」を置換するLRU(Least Recently Used)の選択基準そのものである。</p><p>参考までに、ロード時刻が最も古いのはC0(FIFOならC0が対象)、参照回数が最も少ないのはC1(LFUならC1が対象)、ロード時刻が最も新しいのはC3(LIFOならC3が対象)であり、C2が選ばれるのはLRUの場合のみである。</p><p>したがって、正解はエ。</p>","mnemonic":"「ゴーフン(0:05)前からほったらかしのC2」―最終参照0:05が表中最古だからLRUで真っ先に追い出される。"},{"id":6,"year":2025,"period":"令和7年度秋期","num":7,"cat":"テクノロジ系","field":"論理回路","summary":"論理回路：令和7年度秋期 問7","correct":"ア","result":"","formula":"変化検出式：a・b̄（今回1 かつ 前回0）","howto":"「今回=1」と「前回=0」の両方が真になる論理積を作る。否定が付く変数(今回か前回か)に注意する。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>組込みシステムのプログラムで、放された状態では0になり、押された状態では1になるスイッチの値を読み込んでいる。このプログラムによって、スイッチの値は周期的に適切なタイミングで読み込まれ、チャタリング処理などの適切な処理が行われるものとし、aが今回の値で、bが前回の値とする。このスイッチが放された状態から押された状態に変化したことを検出するための論理式はどれか。ここで、“・”は論理積、“+”は論理和、“￣”は論理否定を表す。</p>","choices":[{"label":"ア","html":"a・<span style=\"text-decoration:overline\">b</span>"},{"label":"イ","html":"<span style=\"text-decoration:overline\">a</span>・b"},{"label":"ウ","html":"a+<span style=\"text-decoration:overline\">b</span>"},{"label":"エ","html":"<span style=\"text-decoration:overline\">a</span>+b"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スイッチは放された状態で0、押された状態で1になる。今回の値をa、前回の値をbとすると、“放された状態(0)から押された状態(1)に変化した”というのは、前回b=0であり今回a=1である場合を指す。</p><p>これを論理式で表すと、aが1であり、かつbの否定(bが0)であることが条件になるので、a・<span style=\"text-decoration:overline\">b</span> となる。</p><p>イの<span style=\"text-decoration:overline\">a</span>・bは逆に“押された状態から放された状態への変化”(今回0・前回1)を検出する式であり、本問とは逆の変化を示すので誤り。</p><p>したがって、正解はア。</p>","mnemonic":"「今アリ(a)・前ナシ(b̄)で放す→押すをキャッチ」―今回1かつ前回0の論理積がオンエッジ検出の定番。"},{"id":7,"year":2025,"period":"令和7年度秋期","num":8,"cat":"テクノロジ系","field":"BASE特性","summary":"BASE特性：令和7年度秋期 問8","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>BASE特性を満たし、次の特徴をもつNoSQLデータベースシステムに関する記述のうち、適切なものはどれか。</p><p>〔NoSQLデータベースシステムの特徴〕</p><ul><li>ネットワーク上に分散した複数のノードから構成される。</li><li>一つのノードでデータを更新した後、他の全てのノードにその更新を反映する。</li></ul>","choices":[{"label":"ア","html":"クライアントからの更新要求を2相コミットによって全てのノードに反映する。"},{"label":"イ","html":"データの更新結果は、システムに障害がなければ、いつかは全てのノードに反映される。"},{"label":"ウ","html":"同一の主キーの値による同時の参照要求に対し、全てのノードは同じ結果を返す。"},{"label":"エ","html":"ノード間のネットワークが分断されると、クライアントからの処理要求を受け付けなくなる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>BASE特性(Basically Available, Soft state, Eventually consistent)は、分散データベースにおいてACID特性のような厳密な一貫性を即座に保証する代わりに、基本的に可用性を確保しつつ、一時的に不整合な状態(Soft state)を許容し、最終的には(Eventually)全ノードが同じ状態に収束する、という考え方である。したがって、障害がなければいずれ全ノードに更新が反映されるというイの記述が、結果整合性(Eventual Consistency)を表しており適切である。</p><p>選択肢アの2相コミットは、全ノードへの反映を即時かつ同期的に保証する強整合性の仕組みであり、ACID特性に基づく手法である。選択肢ウは更新直後に全ノードが同じ結果を返すことを求めており、これは強整合性の説明であって、BASE特性が許容する一時的な不整合とは矛盾する。選択肢エは、ネットワーク分断時に可用性を失うという記述であり、BASEが重視する可用性の確保(CAP定理でいうAP型の挙動)とは逆の説明になっている。</p>","mnemonic":""},{"id":8,"year":2025,"period":"令和7年度秋期","num":9,"cat":"テクノロジ系","field":"ビュー定義","summary":"ビュー定義：令和7年度秋期 問9","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>関係データベースのビューに関する記述のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"ビューの列名は、基の表の列名と異なる名称で定義することができる。"},{"label":"イ","html":"ビューは、基の表から指定した列を抜き出すように定義するものであり、行を抜き出すように定義することはできない。"},{"label":"ウ","html":"二つ以上の表の結合によって定義されたビューは、結合の仕方によらず更新操作ができる。"},{"label":"エ","html":"和両立な二つの表に対し、和集合演算を用いてビューを定義することはできない。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>関係データベースのビューは、基の表(実表)に対するSELECT文を名前付きで定義した仮想的な表である。ビューの列には、元の表の列名とは異なる任意の名称を列別名(AS)によって付けることができるため、アの記述は適切である。</p><p>選択肢イは誤りで、ビューはWHERE句によって特定の行(タプル)だけを抜き出すように定義することも可能であり、列だけでなく行の選択もできる。選択肢ウも誤りで、複数の表を結合して定義したビューは、更新対象となる行が一意に特定できないなどの理由から、結合の仕方によっては更新操作(INSERT/UPDATE/DELETE)ができない場合がある。選択肢エも誤りで、列の数・型が対応する(和両立な)二つの表であれば、UNIONなどの和集合演算を用いてビューを定義することができる。</p>","mnemonic":""},{"id":9,"year":2025,"period":"令和7年度秋期","num":10,"cat":"テクノロジ系","field":"LAN伝送計算","summary":"LAN伝送計算：令和7年度秋期 問10","correct":"ウ","result":"","formula":"送信時間差 = N × (100M側1個の所要時間 − 1G側1個の所要時間)","howto":"1,250バイトをビットに変換して各LANの送信時間を求め、送信間隔1ミリ秒を加えた1個あたりの所要時間の差にNを掛けて9ミリ秒と置いた方程式を解く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>100Mビット/秒のLANと1Gビット/秒のLANがある。ヘッダーを含めて1,250バイトのパケットをN個送信するときに、100Mビット/秒のLANの送信時間が1Gビット/秒のLANより9ミリ秒多く掛かった。Nは幾らか。ここで、いずれのLANにおいても、パケットの送信間隔(パケットの送信が完了してから次のパケットを送信開始するまでの時間)は1ミリ秒であり、パケット送信間隔も送信時間に含める。</p>","choices":[{"label":"ア","html":"10"},{"label":"イ","html":"80"},{"label":"ウ","html":"100"},{"label":"エ","html":"800"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>パケット1個のサイズは1,250バイト=10,000ビットである。</p><p>100Mビット/秒のLANでの送信時間：10,000/100,000,000=0.0001秒=0.1ミリ秒</p><p>1Gビット/秒のLANでの送信時間：10,000/1,000,000,000=0.00001秒=0.01ミリ秒</p><p>パケット送信間隔1ミリ秒を含めると、1個あたりの所要時間は100M側が0.1+1=1.1ミリ秒、1G側が0.01+1=1.01ミリ秒となる。</p><p>N個分の差はN×(1.1-1.01)=N×0.09ミリ秒であり、これが9ミリ秒に等しいので、N=9/0.09=100。</p><p>したがって、正解はウ。</p>","mnemonic":"「イチイチ(1.1)からテンイチ(1.01)引いてクク(0.09)、キュー(9)÷クク=ヒャク(100)」―差0.09ミリ秒の100個分がちょうど9ミリ秒。"},{"id":10,"year":2025,"period":"令和7年度秋期","num":11,"cat":"テクノロジ系","field":"リバースプロキシ","summary":"リバースプロキシ：令和7年度秋期 問11","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>リバースプロキシの説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"インターネットから内部ネットワークの公開Webサーバへの通信を、中継するために利用される。"},{"label":"イ","html":"インターネットと内部ネットワークとの通信を監視し、インターネットからの攻撃を検知するための技術である。"},{"label":"ウ","html":"仮想的な専用ネットワークを確立するための技術である。"},{"label":"エ","html":"内部ネットワークのPCからインターネットへの通信を、中継するために利用される。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>リバースプロキシは、インターネットなどの外部ネットワークからのアクセスを一旦受け取り、内部ネットワークにある公開Webサーバなどへ中継する仕組みである。クライアントからは代理(プロキシ)サーバがあたかも本来のサーバであるかのように見え、実際のサーバのアドレスを隠蔽しつつ、負荷分散やキャッシュ、SSL終端などの機能を提供できる。したがって、インターネットから内部ネットワークの公開Webサーバへの通信を中継するために利用されるというアの記述が適切である。</p><p>選択肢イはIDS/IPS(侵入検知・防止システム)の説明であり、リバースプロキシとは役割が異なる。選択肢ウはVPN(仮想専用ネットワーク)の説明である。選択肢エは、内部のPCから外部インターネットへの通信を中継するものであり、これは一般にフォワードプロキシ(通常のプロキシサーバ)の役割であって、“逆”方向を扱うリバースプロキシとは逆の説明になっている。</p>","mnemonic":""},{"id":11,"year":2025,"period":"令和7年度秋期","num":12,"cat":"テクノロジ系","field":"キルチェーン","summary":"キルチェーン：令和7年度秋期 問12","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>サイバー攻撃の攻撃段階をモデル化したサイバーキルチェーンにおいて、“エクスプロイト”に該当する行為はどれか。</p>","choices":[{"label":"ア","html":"公開情報の閲覧、顧客を装った電子メールでの問合せなどを行い、標的とする組織を調査する。"},{"label":"イ","html":"標的とする組織のPCでOSの脆弱性を悪用し、攻撃ツールを実行させる。"},{"label":"ウ","html":"標的とする組織のサーバから秘密情報を窃取し、攻撃者が用意したサーバに送信する。"},{"label":"エ","html":"標的とする組織の従業員にマルウェアを添付した電子メールを送りつける。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>サイバーキルチェーンは、偵察(Reconnaissance)、武器化(Weaponization)、デリバリー(Delivery)、エクスプロイト(Exploitation)、インストール(Installation)、遠隔操作(Command and Control)、目的の実行(Actions on Objectives)という段階で攻撃をモデル化したものである。このうち“エクスプロイト”は、標的のシステムに送り込まれたマルウェアや攻撃コードが、OSやソフトウェアの脆弱性を悪用して実際に実行される段階を指す。したがって、標的組織のPCでOSの脆弱性を悪用し攻撃ツールを実行させるイの記述が該当する。</p><p>選択肢アは偵察(Reconnaissance)の段階、選択肢エはマルウェア付きメールを送りつける行為でありデリバリー(Delivery)の段階に該当する。選択肢ウは攻撃後に情報を窃取して送信する行為であり、目的の実行(Actions on Objectives)の段階に該当し、いずれもエクスプロイトの段階とは異なる。</p>","mnemonic":""},{"id":12,"year":2025,"period":"令和7年度秋期","num":13,"cat":"テクノロジ系","field":"コード署名証明書","summary":"コード署名証明書：令和7年度秋期 問13","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>デジタル署名が付与されたソフトウェアをインストールするときに、そのソフトウェアの発行元を確認するために使用する証明書はどれか。</p>","choices":[{"label":"ア","html":"EV SSL証明書"},{"label":"イ","html":"クライアント証明書"},{"label":"ウ","html":"コードサイニング証明書"},{"label":"エ","html":"サーバ証明書"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>コードサイニング証明書は、ソフトウェア(実行ファイルやドライバなど)に対してデジタル署名を付与するために使われる電子証明書であり、利用者がソフトウェアをインストールする際に、その発行元(開発者・配布元)が証明書に記載された組織であることと、配布後にコードが改ざんされていないことを確認できるようにするものである。したがって、ウが正解である。</p><p>選択肢アのEV SSL証明書や選択肢エのサーバ証明書は、Webサイト運営組織の実在性を確認しTLS通信を暗号化するためにWebサーバに設定する証明書であり、ソフトウェアの発行元確認とは目的が異なる。選択肢イのクライアント証明書は、サーバに対してクライアント(利用者や端末)側の身元を証明するために用いられるものであり、これもソフトウェアの発行元確認には使われない。</p>","mnemonic":""},{"id":13,"year":2025,"period":"令和7年度秋期","num":14,"cat":"テクノロジ系","field":"真正性・信頼性","summary":"真正性・信頼性：令和7年度秋期 問14","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>JIS Q 27000:2019(情報セキュリティマネジメントシステム-用語)における真正性及び信頼性に対する定義a〜dの組みのうち、適切なものはどれか。</p><p>〔定義〕</p><ul><li>a 意図する行動と結果とが一貫しているという特性</li><li>b エンティティは、それが主張するとおりのものであるという特性</li><li>c 認可されたエンティティが要求したときに、アクセス及び使用が可能であるという特性</li><li>d 認可されていない個人、エンティティ又はプロセスに対して、情報を使用させず、また、開示しないという特性</li></ul><table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse\"><tr><th></th><th>真正性</th><th>信頼性</th></tr><tr><td>ア</td><td>b</td><td>a</td></tr><tr><td>イ</td><td>b</td><td>c</td></tr><tr><td>ウ</td><td>d</td><td>a</td></tr><tr><td>エ</td><td>d</td><td>c</td></tr></table>","choices":[{"label":"ア","html":"真正性=b、信頼性=a"},{"label":"イ","html":"真正性=b、信頼性=c"},{"label":"ウ","html":"真正性=d、信頼性=a"},{"label":"エ","html":"真正性=d、信頼性=c"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>JIS Q 27000:2019における真正性(authenticity)は「エンティティは、それが主張するとおりのものであるという特性」と定義されており、選択肢bがこれに該当する。一方、信頼性(reliability)は「意図する行動と結果とが一貫しているという特性」と定義されており、選択肢aがこれに該当する。したがって、真正性=b、信頼性=aの組合せであるアが正解となる。</p><p>なお、選択肢cの「認可されたエンティティが要求したときにアクセス及び使用が可能であるという特性」は可用性(availability)の定義であり、選択肢dの「認可されていない個人、エンティティ又はプロセスに対して情報を使用させず、また開示しないという特性」は機密性(confidentiality)の定義であって、いずれも真正性・信頼性とは異なる特性の説明である。</p>","mnemonic":""},{"id":14,"year":2025,"period":"令和7年度秋期","num":15,"cat":"テクノロジ系","field":"DKIM","summary":"DKIM：令和7年度秋期 問15","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>電子メールの送信時に、送信側メールサーバでデジタル署名を電子メールヘッダーに付与し、受信側メールサーバでそれを検証することで、送信元ドメインのなりすましや電子メールの改ざんを検知できる技術はどれか。</p>","choices":[{"label":"ア","html":"DKIM"},{"label":"イ","html":"OP25B"},{"label":"ウ","html":"S/MIME"},{"label":"エ","html":"SPF"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>DKIM(DomainKeys Identified Mail)は、送信側メールサーバが秘密鍵を用いて電子メールのヘッダーや本文の一部からデジタル署名を生成し、電子メールヘッダーに付与する技術である。受信側メールサーバは、送信元ドメインのDNSに公開されている公開鍵を用いてこの署名を検証することで、送信元ドメインのなりすましやメール内容の改ざんがないことを確認できる。</p><p>選択肢イのOP25B(Outbound Port 25 Blocking)は、ISPが自ネットワーク外への25番ポート(SMTP)通信を遮断し、スパム踏み台化を防ぐ対策であり、署名による検証とは異なる仕組みである。選択肢ウのS/MIMEは、メール自体の本文を送信者・受信者間で暗号化・署名する技術であり、サーバ間で付与・検証されるDKIMとは適用レイヤが異なる。選択肢エのSPF(Sender Policy Framework)は、送信元IPアドレスがそのドメインの正規の送信元として登録されているかをDNSで確認する技術であり、デジタル署名によるヘッダー検証ではない。したがって、正解はアである。</p>","mnemonic":""},{"id":15,"year":2025,"period":"令和7年度秋期","num":16,"cat":"テクノロジ系","field":"UML図","summary":"UML図：令和7年度秋期 問16","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>UMLのダイアグラムのうち、インスタンス間の関係を表現するものはどれか。</p>","choices":[{"label":"ア","html":"アクティビティ図"},{"label":"イ","html":"オブジェクト図"},{"label":"ウ","html":"コンポーネント図"},{"label":"エ","html":"ユースケース図"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>UMLのオブジェクト図(Object Diagram)は、クラス図がクラス(型)間の関係を表現するのに対し、ある時点における実際のインスタンス(オブジェクト)とその間の関係・リンクのスナップショットを表現する図である。したがって、インスタンス間の関係を表現するものという説明に該当するのはイである。</p><p>選択肢アのアクティビティ図は処理の流れ(ワークフロー)を表現する図、選択肢ウのコンポーネント図はソフトウェアの構成要素(モジュール)間の依存関係を表現する図、選択肢エのユースケース図はシステムと利用者(アクター)との間の機能的なやり取りを表現する図であり、いずれもインスタンス間の関係そのものを表現するものではない。</p>","mnemonic":""},{"id":16,"year":2025,"period":"令和7年度秋期","num":17,"cat":"ストラテジ系","field":"著作者人格権","summary":"著作者人格権：令和7年度秋期 問17","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>委託元への著作権の移転に関する条項を含むソフトウェア開発委託契約書に、“委託先は著作者人格権を行使しない”という記載があった。これはどのような問題の発生を防ぐためのものか。</p>","choices":[{"label":"ア","html":"委託先で当該ソフトウェアを開発した開発者が、技術者倫理に関しての責任を負わなくなることを防ぐ。"},{"label":"イ","html":"委託先で当該ソフトウェアを開発した開発者を、委託元が後で雇用できなくなることを防ぐ。"},{"label":"ウ","html":"納品されたソフトウェアに不具合が発見された場合に、委託先が金銭的補償を負わなくなることを防ぐ。"},{"label":"エ","html":"納品されたソフトウェアを委託先の了解なく委託元で修正できなくなること、又は他の会社に修正を依頼できなくなることを防ぐ。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>著作者人格権(同一性保持権・氏名表示権・公表権)は著作者自身の人格的利益を保護するものであり、著作権法上、他人に譲渡することができない一身専属の権利である。そのため、委託先が開発したソフトウェアの財産権としての著作権を委託元に移転する契約を結んでも、著作者人格権は委託先(開発者)に残ったままとなる。もし委託先がこの権利、特に同一性保持権を行使すると、委託元が納品後のソフトウェアを無断で改変(バグ修正や機能追加など)することや、別の会社に改修を依頼することが、著作者の同意を得られない限りできなくなるおそれがある。</p><p>これを防ぐために、委託契約書に“委託先は著作者人格権を行使しない”という不行使特約を設けることで、委託元が納品後のソフトウェアを自由に保守・改変できるようにする。したがって、正解はエである。他の選択肢(ア:技術者倫理上の責任、イ:開発者の委託元への転籍、ウ:不具合時の金銭的補償)は、いずれも著作者人格権の不行使特約とは直接関係のない事項である。</p>","mnemonic":""},{"id":17,"year":2025,"period":"令和7年度秋期","num":18,"cat":"マネジメント系","field":"タックマンモデル","summary":"タックマンモデル：令和7年度秋期 問18","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>チームの発展段階を五つに区分したタックマンモデルによれば、メンバーの異なる考え方や価値観が明確になり、メンバーがそれぞれの意見を主張し合う段階はどれか。</p>","choices":[{"label":"ア","html":"安定期(Norming)"},{"label":"イ","html":"遂行期(Performing)"},{"label":"ウ","html":"成立期(Forming)"},{"label":"エ","html":"動乱期(Storming)"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>タックマンモデルは、チームの発展段階を成立期(Forming)、動乱期(Storming)、安定期(Norming)、遂行期(Performing)、さらに解散期(Adjourning)を加えた五段階で説明するモデルである。このうち動乱期(Storming)は、チームが活動を始めてメンバーそれぞれの考え方や価値観の違いが表面化し、意見の対立や主張のぶつかり合いが生じる段階とされる。したがって、メンバーの異なる考え方や価値観が明確になり、それぞれが意見を主張し合う段階という記述に該当するのはエである。</p><p>選択肢ウの成立期(Forming)はチームが結成されたばかりで、メンバー同士がまだ互いを理解していない段階であり、対立はまだ表面化しない。選択肢ア安定期(Norming)は、対立を経て互いの役割やチームの規範が確立されていく段階、選択肢イ遂行期(Performing)はチームが成熟し高いパフォーマンスを発揮する段階であり、いずれも意見の衝突が中心の段階ではない。</p>","mnemonic":""},{"id":18,"year":2025,"period":"令和7年度秋期","num":19,"cat":"マネジメント系","field":"要員計画","summary":"要員計画：令和7年度秋期 問19","correct":"ウ","result":"","formula":"増加人件費 = (実際に発生した人月数－当初計画の人月数) × 100万円/人月","howto":"離脱する4人の計画人月(4人×6か月)と、実際の在籍期間・引継ぎを踏まえた人月、及び増員メンバーの必要人数と引継ぎ込みの人月を求めて差を取る。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>あるプロジェクトは4月から9月までの6か月間で開発を進めており、現在のメンバー全員が9月末まで作業すれば完了する見込みである。しかし、他のプロジェクトで発生した緊急の案件に対応するために、8月初めから、4人のメンバーがプロジェクトから外れることになった。9月末に予定どおり開発を完了させるために、7月の半ばからメンバーを増員する。条件に従うとき、人件費は何万円増加するか。</p><p>〔条件〕</p><ul><li>元のメンバーと増員するメンバーの、プロジェクトにおける生産性は等しい。</li><li>7月の半ばから7月末までの0.5か月間、元のメンバー4人から増員するメンバーに引継ぎを行う。</li><li>引継ぎの期間中は、元のメンバー4人と増員するメンバーはプロジェクトの開発作業を実施しないが、人件費は全額をこのプロジェクトに計上する。</li><li>人件費は、1人月当たり100万円とする。</li></ul>","choices":[{"label":"ア","html":"200"},{"label":"イ","html":"250"},{"label":"ウ","html":"450"},{"label":"エ","html":"700"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>元の計画では、離脱する4人は4月から9月まで6か月間フルに働く予定だったので、計画上の人件費は4人×6か月=24人月である。</p><p>実際には、4人は4月・5月・6月の3か月間は通常どおり開発作業を行い、7月後半(0.5か月)は増員メンバーへの引継ぎに専念して開発作業はしない(が人件費は計上される)。つまり4人の在籍期間は4月〜7月の4か月間で、人件費は4人×4か月=16人月、そのうち実際に開発に貢献したのは3.5か月×4人=14人月分である。</p><p>計画どおり9月末に完了させるには、残り24-14=10人月分の作業を、増員メンバーが8月・9月の2か月間(増員メンバーも7月後半0.5か月は引継ぎで非稼働)で担う必要がある。増員メンバーの人数をNとすると、稼働できるのは8・9月の2か月間だけなので2N=10よりN=5人。</p><p>増員メンバーの人件費は、引継ぎ0.5か月+稼働2か月=2.5か月×5人=12.5人月。</p><p>新計画の総人件費(元の4人+増員分)=16人月+12.5人月=28.5人月。元の計画の24人月と比べると、28.5-24=4.5人月増加し、1人月100万円なので4.5×100万円=450万円の増加となる。</p><p>したがって、正解はウ。</p>","mnemonic":"「ゴニン(5人)がニカゲツ(2か月)でジュウ(10)人月穴埋め、引継ぎ込みでヨンテンゴ(4.5)人月増=ヨンヒャクゴジュウ(450)万円」"},{"id":19,"year":2025,"period":"令和7年度秋期","num":20,"cat":"マネジメント系","field":"問題管理","summary":"問題管理：令和7年度秋期 問20","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>サービスマネジメントにおける問題管理の活動はどれか。</p>","choices":[{"label":"ア","html":"根本原因の特定"},{"label":"イ","html":"サービス要求の優先度付け"},{"label":"ウ","html":"変更要求の記録"},{"label":"エ","html":"リリースの検証"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>ITILなどのサービスマネジメントにおいて、問題管理(Problem Management)は、インシデントの背後にある根本原因(root cause)を特定し、再発防止や恒久的な解決策を講じることを目的とした活動である。インシデント管理が個々の障害発生時の迅速な復旧を目的とするのに対し、問題管理はその根本原因を突き止め、恒久対策につなげる点に特徴がある。したがって、根本原因の特定という記述に該当するアが正解である。</p><p>選択肢イのサービス要求の優先度付けは要求実現管理(Request Fulfilment)の活動、選択肢ウの変更要求の記録は変更管理(Change Management)の活動、選択肢エのリリースの検証はリリース管理(Release Management)の活動であり、いずれも問題管理とは異なるITILプロセスの活動である。</p>","mnemonic":""},{"id":20,"year":2025,"period":"令和7年度秋期","num":21,"cat":"マネジメント系","field":"システム監査用語","summary":"システム監査用語：令和7年度秋期 問21","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>システム監査基準(令和5年)において、システム監査で使用される用語の説明として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"所見とは、他の標準的な監査人が監査を実施した場合であっても同じ検証結果を得られることである。"},{"label":"イ","html":"正当な懐疑心とは、客観性の保持という精神的な態度を堅持できることである。"},{"label":"ウ","html":"正当な注意とは、監査で発見したことに基づく考えや意見のことである。"},{"label":"エ","html":"独立性とは、第三者から不当な影響や圧力等を受けていない状態のことである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査基準(令和5年)における独立性とは、監査人が監査対象や利害関係者など第三者から不当な影響や圧力を受けず、客観的な立場で監査を行える状態をいう。したがって、“第三者から不当な影響や圧力等を受けていない状態”と説明するエが適切である。</p><p>選択肢アは、監査の再現性・検証可能性に近い説明であり“所見”の定義とは異なる(所見とは、監査の結果判明した事実とそれに基づく監査人の結論を指す)。選択肢イの正当な懐疑心は、監査証拠をうのみにせず、矛盾や不正の可能性を意識して批判的に評価する姿勢を指すものであり、単なる“客観性の保持という精神的な態度”という説明では不十分である。選択肢ウの正当な注意は、監査人が専門家として払うべき相応の注意深さ・慎重さを指すものであり、“発見したことに基づく考えや意見”(これは所見の説明に近い)とは異なる概念である。</p>","mnemonic":""},{"id":21,"year":2025,"period":"令和7年度秋期","num":22,"cat":"マネジメント系","field":"監査の三視点","summary":"監査の三視点：令和7年度秋期 問22","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>システム監査基準(令和5年)に従い、監査目的に基づいて、ガバナンス、マネジメント、コントロールの視点から検証・評価を行う。“コントロールの視点”から行う項目はどれか。</p>","choices":[{"label":"ア","html":"IT投資の結果が適切なリターンを生んでいるか。"},{"label":"イ","html":"異常なアクセスを検出した際に適時に対処及び報告がなされているか。"},{"label":"ウ","html":"情報セキュリティ対策がPDCAサイクルに基づいて適切に管理されているか。"},{"label":"エ","html":"新技術や技術革新を経営戦略推進のために適時適切に利活用できているか。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>システム監査基準(令和5年)では、監査人はIT統制に関する三つの階層、すなわち経営層による意思決定・統治を扱う“ガバナンス”、その方針の下で行われる管理活動である“マネジメント”、そして個々の業務やシステムに組み込まれた具体的な統制活動である“コントロール”の視点から検証・評価を行うとされる。“異常なアクセスを検出した際に適時に対処及び報告がなされているか”という項目は、個別の業務・システムにおける具体的な統制(アクセス監視とその対応手続)の実施状況を問うものであり、“コントロールの視点”に該当する。したがって、正解はイである。</p><p>選択肢アの“IT投資の結果が適切なリターンを生んでいるか”や選択肢エの“新技術を経営戦略推進のために活用できているか”は、経営層による意思決定・戦略に関わる事項であり“ガバナンスの視点”に該当する。選択肢ウの“情報セキュリティ対策がPDCAサイクルに基づいて適切に管理されているか”は、管理の仕組み全体(マネジメントシステム)の運用状況を問うものであり“マネジメントの視点”に該当する。</p>","mnemonic":""},{"id":22,"year":2025,"period":"令和7年度秋期","num":23,"cat":"マネジメント系","field":"プログラム管理","summary":"プログラム管理：令和7年度秋期 問23","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>事業目標達成のためのプログラムマネジメントの考え方として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"活動全体を複数のプロジェクトの結合体と捉え、複数のプロジェクトの連携、統合、相互作用を通じて価値を高め、組織全体の戦略の実現を図る。"},{"label":"イ","html":"個々のプロジェクト管理を更に細分化することによって、プロジェクトに必要な技術や確保すべき経営資源の明確化を図る。"},{"label":"ウ","html":"システムの開発に使用するプログラム言語や開発手法を早期に検討することによって、開発リスクを低減し、投資効果の最大化を図る。"},{"label":"エ","html":"リスクを最小化するように支援する専門組織を設けることによって、組織全体のプロジェクトマネジメントの能力と品質の向上を図る。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>プログラムマネジメントとは、個別のプロジェクトを単独で管理するのではなく、関連する複数のプロジェクトの集合(プログラム)全体を、組織の事業目標・戦略と結び付けて統合的にマネジメントする考え方である。複数のプロジェクト間の連携や相互作用、資源配分の最適化を通じて、個々のプロジェクトの成果の総和以上の価値(相乗効果)を生み出し、組織全体の戦略実現を図る点に特徴がある。したがって、活動全体を複数プロジェクトの結合体と捉え、連携・統合・相互作用を通じて組織全体の戦略実現を図るというアの記述が適切である。</p><p>選択肢イは個々のプロジェクト管理の細分化という、むしろプロジェクトマネジメント内部の話であり、プログラム間の統合という視点がない。選択肢ウはプログラム言語や開発手法の早期検討による開発リスク低減という、個別プロジェクトの技術的な話であって事業目標達成のための複数プロジェクト統合とは異なる。選択肢エはリスク管理を支援する専門組織の設置という、PMO(プロジェクトマネジメントオフィス)的な機能の一側面にすぎず、プログラムマネジメントの考え方全体を説明するものではない。</p>","mnemonic":""},{"id":23,"year":2025,"period":"令和7年度秋期","num":24,"cat":"テクノロジ系","field":"SOA","summary":"SOA：令和7年度秋期 問24","correct":"エ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>SOAの説明はどれか。</p>","choices":[{"label":"ア","html":"会計、人事、製造、購買、在庫管理、販売などの企業の業務プロセスを一元管理することによって、業務の効率化や経営資源の全体最適を図る手法"},{"label":"イ","html":"企業の業務プロセス、システム化要求などのニーズと、ソフトウェアパッケージの機能性がどれだけ適合し、どれだけかい離しているかを分析する手法"},{"label":"ウ","html":"業務プロセスの問題点を洗い出して、目標設定、実行、チェック、修正行動のマネジメントサイクルを適用し、継続的な改善を図る手法"},{"label":"エ","html":"利用者の視点から業務システムの機能を幾つかの独立した部品に分けることによって、業務プロセスとの対応付けや他ソフトウェアとの連携を容易にする手法"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SOA(Service Oriented Architecture、サービス指向アーキテクチャ)は、業務システムが提供する機能を、利用者(業務)の視点から見て意味のあるまとまりである“サービス”という独立した部品に分割し、それらを組み合わせることでシステムを構築する考え方である。サービス単位に分割しておくことで、業務プロセスの変更に合わせた機能の組み替えや、他のソフトウェア・システムとの連携(サービスの再利用)が容易になる。したがって、利用者の視点から業務システムの機能を独立した部品に分け、業務プロセスとの対応付けや他ソフトウェアとの連携を容易にするというエの記述が適切である。</p><p>選択肢アは基幹業務を一元管理するERP(統合基幹業務システム)の説明、選択肢イは業務ニーズとパッケージソフトの機能とのかい離を分析するフィット&ギャップ分析の説明、選択肢ウは業務プロセスにPDCAサイクルを適用するBPM(ビジネスプロセスマネジメント)の説明であり、いずれもSOAの説明ではない。</p>","mnemonic":""},{"id":24,"year":2025,"period":"令和7年度秋期","num":25,"cat":"ストラテジ系","field":"回収期間法","summary":"回収期間法：令和7年度秋期 問25","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>投資の意思決定手法の一つであるPBP法に関する記述として、適切なものはどれか。</p>","choices":[{"label":"ア","html":"キャッシュフローの時間的価値が考慮されている。"},{"label":"イ","html":"投資回収後のキャッシュフローも考慮されている。"},{"label":"ウ","html":"投資金額の回収期間の長さによって投資を評価する手法である。"},{"label":"エ","html":"ほかの意思決定手法であるNPV法やIRR法と同様に割引率を用いる手法である。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PBP法(Payback Period法、回収期間法)は、投資した金額を将来のキャッシュフローでどのくらいの期間で回収できるかに着目し、その回収期間の長短によって投資案を評価する手法である。回収期間が短いほど資金回収が早く、相対的にリスクが低い投資と判断される。したがって、投資金額の回収期間の長さによって投資を評価する手法であるというウの記述が適切である。</p><p>選択肢アと選択肢エは誤りで、一般的なPBP法(単純回収期間法)はキャッシュフローの時間的価値(割引率)を考慮しない手法であり、NPV法やIRR法のように割引率を用いるのは派生形である割引回収期間法である。選択肢イも誤りで、PBP法は投資額を回収し終えるまでの期間だけに着目する手法であり、回収期間後に発生するキャッシュフローの大小は評価に反映されないという欠点がある。</p>","mnemonic":""},{"id":25,"year":2025,"period":"令和7年度秋期","num":26,"cat":"ストラテジ系","field":"戦略マップ","summary":"戦略マップ：令和7年度秋期 問26","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>バランススコアカードで使われる戦略マップの説明はどれか。</p>","choices":[{"label":"ア","html":"切り口となる二つの要素をX軸、Y軸として、市場における自社又は自社製品のポジションを表現したもの"},{"label":"イ","html":"財務、顧客、内部ビジネスプロセス、学習と成長という四つの視点を基に、課題、施策、目標の因果関係を表現したもの"},{"label":"ウ","html":"市場の魅力度、自社の優位性という二つの軸から成る四象限に自社の製品や事業を分類して表現したもの"},{"label":"エ","html":"どのような顧客層に対して、どのような経営資源を使用し、どのような製品・サービスを提供するのかを表現したもの"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>バランススコアカード(BSC)は、財務の視点、顧客の視点、内部ビジネスプロセスの視点、学習と成長の視点という四つの視点から経営を評価・管理するフレームワークである。このうち戦略マップは、四つの視点それぞれにおける戦略目標(課題)を、下位の視点の目標達成が上位の視点の目標達成につながるという因果関係(ストーリー)として図示したものであり、課題・施策・目標の因果関係を表現したイの記述が適切である。</p><p>選択肢アはプロダクト・ポートフォリオ・マネジメント(PPM)などで用いられる市場ポジショニングの表現、選択肢ウは市場の魅力度と自社の優位性による事業ポートフォリオ分析(GEマトリクスなど)の説明、選択肢エは顧客セグメント・提供価値・経営資源の関係を表すビジネスモデルキャンバス的な説明であり、いずれも戦略マップの説明ではない。</p>","mnemonic":""},{"id":26,"year":2025,"period":"令和7年度秋期","num":27,"cat":"ストラテジ系","field":"成長マトリクス","summary":"成長マトリクス：令和7年度秋期 問27","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>図のアンゾフの成長マトリクスのうち、市場浸透戦略の例として、適切なものはどれか。</p><table border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;text-align:center\"><tr><th></th><th>製品：既存</th><th>製品：新規</th></tr><tr><th>市場：既存</th><td>市場浸透戦略</td><td>新製品開発戦略</td></tr><tr><th>市場：新規</th><td>新市場開拓戦略</td><td>多角化戦略</td></tr></table>","choices":[{"label":"ア","html":"ある商品が高いシェアを確保したため、最近の技術開発の成果を取り入れた上位機種を、既存のユーザー向けに販売する。"},{"label":"イ","html":"ある地域において特別価格で販売することで、商品の知名度を上げ、その地域の多くの住民に販売する。"},{"label":"ウ","html":"ある地方で長年販売してきた商品を、今年から他の地方でも販売する。"},{"label":"エ","html":"販売実績がないある国の商習慣に合う製品を一から開発し、その国で販売する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>アンゾフの成長マトリクスは、市場(既存・新規)と製品(既存・新規)の2軸で、市場浸透戦略(既存市場×既存製品)、新製品開発戦略(既存市場×新規製品)、新市場開拓戦略(新規市場×既存製品)、多角化戦略(新規市場×新規製品)の四つの成長戦略に分類するフレームワークである。市場浸透戦略は、既存の製品を既存の市場(顧客)に対して、より深く浸透させる(シェアを高める)戦略であり、既存ユーザー向けに改良版を販売するアの記述がこれに該当する。</p><p>選択肢イは、既存製品を新規の顧客層(地域の多くの住民)に特別価格で販売し新規顧客を開拓する例であり、新市場開拓に近い内容を含む。選択肢ウは既存製品を他の地方(新規市場)に展開する新市場開拓戦略の例、選択肢エは新規の製品を新規の市場(販売実績のない国)に投入する多角化戦略の例であり、いずれも市場浸透戦略ではない。</p>","mnemonic":""},{"id":27,"year":2025,"period":"令和7年度秋期","num":28,"cat":"ストラテジ系","field":"生産管理システム","summary":"生産管理システム：令和7年度秋期 問28","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>生産事業所のシステムを、生産計画などの計画層、各指示や工程管理・製造管理などの実行層、機械・機器の制御を行う制御層の三つの層に大きく分けたとき、MESが運用される層はどれか。</p>","choices":[{"label":"ア","html":"計画層"},{"label":"イ","html":"実行層"},{"label":"ウ","html":"制御層"},{"label":"エ","html":"計画層・実行層・制御層"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>MES(Manufacturing Execution System、製造実行システム)は、生産計画などの上位の計画層(経営・生産計画)と、機械・設備を直接制御する制御層(FA制御)との中間に位置し、作業指示の発行、工程の進捗管理、製造実績の収集・管理などを行う実行層のシステムである。したがって、MESが運用される層は実行層であり、イが正解である。</p><p>生産計画そのもの(いつ・何を・どれだけ作るか)を決めるのは計画層(例えば生産管理システムやERP)の役割であり、個々の機械・機器の動作制御を直接行うのは制御層(PLCなど)の役割である。MESはこの両者の間で、計画層からの指示を実行可能なレベルに具体化し、現場の実績情報を計画層にフィードバックする橋渡しの役割を担う。</p>","mnemonic":""},{"id":28,"year":2025,"period":"令和7年度秋期","num":29,"cat":"ストラテジ系","field":"限界利益計算","summary":"限界利益計算：令和7年度秋期 問29","correct":"イ","result":"","formula":"時間当たり限界利益 = (販売単価－変動費) ÷ 製造時間、大きい方の製品に全機械時間を投入","howto":"製品ごとに1時間あたりの限界利益を比較し、大きい製品に機械の全稼働時間を割り当てて限界利益合計を求め、固定費を差し引く。","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>表のような製品A、Bを製造、販売する場合、考えられる利益は最大で何円になるか。ここで、機械の年間使用可能時間は延べ15,000時間とし、年間の固定費は製品A、Bに関係なく15,000,000円とする。</p><table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse\"><tr><th>製品</th><th>販売単価</th><th>変動費</th><th>製造時間</th></tr><tr><td>A</td><td>30,000円</td><td>18,000円/個</td><td>8時間/個</td></tr><tr><td>B</td><td>25,000円</td><td>10,000円/個</td><td>12時間/個</td></tr></table>","choices":[{"label":"ア","html":"3,750,000"},{"label":"イ","html":"7,500,000"},{"label":"ウ","html":"16,250,000"},{"label":"エ","html":"18,750,000"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>製品Aの限界利益(販売単価-変動費)は30,000-18,000=12,000円/個、製造時間は8時間/個なので、機械1時間あたりの限界利益は12,000/8=1,500円/時間。</p><p>製品Bの限界利益は25,000-10,000=15,000円/個、製造時間は12時間/個なので、1時間あたりの限界利益は15,000/12=1,250円/時間。</p><p>機械の年間使用可能時間は共通の制約(延べ15,000時間)であり、固定費も共通なので、限られた機械時間をどちらの製品に使うかは、1時間あたりの限界利益が大きい製品Aに全て充てるのが最も有利である。</p><p>製品Aだけを製造すると15,000時間÷8時間/個=1,875個製造でき、限界利益の合計は1,875個×12,000円=22,500,000円。</p><p>ここから年間固定費15,000,000円を差し引くと、利益=22,500,000-15,000,000=7,500,000円。</p><p>(参考:製品Bだけなら15,000/12=1,250個、限界利益18,750,000円、利益3,750,000円となり、Aを選ぶ方が有利)</p><p>したがって、正解はイ。</p>","mnemonic":"「エーはセンゴヒャク(1,500)、ビーはセンニヒャクゴジュウ(1,250)、時間あたりはAの勝ちでナナヒャクゴジュウマン(750万)が答え」"},{"id":29,"year":2025,"period":"令和7年度秋期","num":30,"cat":"ストラテジ系","field":"意匠法","summary":"意匠法：令和7年度秋期 問30","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>意匠法において、保護の対象となり得るものはどれか。</p>","choices":[{"label":"ア","html":"独自のGUI"},{"label":"イ","html":"独自のアルゴリズム"},{"label":"ウ","html":"独自の通信プロトコル"},{"label":"エ","html":"独自のビジネスモデル"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>意匠法は、物品、建築物又は画像のデザイン(形状・模様・色彩等)を保護対象とする法律である。2019年の法改正(2020年4月施行)により、機器の操作の用に供される画像や、機器がその機能を発揮した結果として表示される画像が、物品に記録・表示されていない場合(例えばクラウド上から配信される画像)であっても意匠登録の対象に含まれるようになった。スマートフォンのアイコンなど、独自のGUI(グラフィカルユーザーインタフェース)のデザインはこの“画像の意匠”として保護の対象となり得るため、アが正解である。</p><p>選択肢イの独自のアルゴリズムや選択肢ウの独自の通信プロトコルは、情報の処理手順や通信規約といった技術的な仕組み(アイデア)であり、物品や画像の外観・デザインではないため意匠法の保護対象にはならない(アルゴリズムなど技術的思想は特許法の対象になり得る)。選択肢エの独自のビジネスモデルも、デザインではなく事業の仕組みそのものであるため、意匠法ではなく、要件を満たせば特許法(ビジネスモデル特許)などで保護され得るものであり、意匠法の対象ではない。</p>","mnemonic":""},{"id":30,"year":2025,"period":"令和7年度春期","num":1,"cat":"テクノロジ系","field":"アルゴリズム(二分探索)","summary":"アルゴリズム(二分探索)：令和7年度春期 問1","correct":"ア","result":"","formula":"区間幅 w_i = 1/2^(i-1)、停止条件は w_i/2 &lt; 0.001","howto":"初期区間1を毎回半分に割る二分探索とみなし、x1-xが0.001未満になる最初の回数を求める","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>0≦x≦1の範囲で単調に増加する連続関数f(x)が f(0)&lt;0≦f(1) を満たすときに、区間内でf(x)=0であるxの値を近似的に求めるアルゴリズムにおいて、(2)は何回実行されるか。</p><p>〔アルゴリズム〕</p><ol><li>x0←0, x1←1 とする。</li><li>x ← (x0+x1)/2 とする。</li><li>x1-x &lt; 0.001 ならばxの値を近似値として終了する。</li><li>f(x)≧0 ならば x1←x として、そうでなければ x0←x とする。</li><li>(2)に戻る。</li></ol>","choices":[{"label":"ア","html":"10"},{"label":"イ","html":"20"},{"label":"ウ","html":"100"},{"label":"エ","html":"1,000"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>x0=0, x1=1から出発し、(2)を1回実行するごとに区間幅は半分になる。i回目の(2)実行直前の区間幅を w_i とすると w_1=1, w_2=1/2, …, w_i=1/2^(i-1) である。</p><p>i回目の実行で求めた中点xについて x1-x = w_i/2 = 1/2^i となり、これが0.001未満になった時点で終了する。</p><p>1/2^i &lt; 0.001 ⇔ 2^i &gt; 1000。2^9=512&lt;1000、2^10=1024&gt;1000なので、i=10で初めて条件を満たす。</p><p>よって(2)はちょうど10回実行される。正解はア。</p>","mnemonic":"「とお(10)回刻めば せん(1000)を超える」―2を10回掛けると1024、0.001の壁をついに割る二分探索。"},{"id":31,"year":2025,"period":"令和7年度春期","num":2,"cat":"テクノロジ系","field":"機械学習(過学習)","summary":"機械学習(過学習)：令和7年度春期 問2","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>AIにおける機械学習の過程において、過学習と疑われたときの解消方法として、最も適切なものはどれか。</p>","choices":[{"label":"ア","html":"訓練した時と同じ精度を出すために、訓練データをテストデータとして使用する。"},{"label":"イ","html":"精度を高めるために、元の訓練データに加工を施し、訓練データの量を増やす。"},{"label":"ウ","html":"予測した結果に近づけるために、モデルをより複雑にする。"},{"label":"エ","html":"より多くの未知のデータに対して予測できるように、汎化性能を下げる。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>過学習(オーバーフィッティング)とは、モデルが訓練データに過度に適合し、未知のデータに対する予測性能(汎化性能)が低下する現象である。代表的な解消策には、訓練データ量の増加・データ拡張、正則化、交差検証、早期終了(early stopping)、モデルの単純化などがある。</p><p>イは、元の訓練データに回転・反転・ノイズ付加などの加工を施して水増しする「データ拡張」に相当し、学習データの多様性と量を増やして過学習を抑える代表的な対策であるため適切である。</p><p>アは、訓練データをそのままテストデータに使うと見かけ上の精度が高く出るだけで、未知データへの汎化性能は測れず、過学習の解消にはならない。ウはモデルをより複雑にすると訓練データへの適合度がさらに上がり、過学習を悪化させる。エは汎化性能を「下げる」としている点が逆で、本来は汎化性能を高めることが過学習対策の目的である。</p>","mnemonic":""},{"id":32,"year":2025,"period":"令和7年度春期","num":3,"cat":"テクノロジ系","field":"データ構造(スタック)","summary":"データ構造(スタック)：令和7年度春期 問3","correct":"ウ","result":"","formula":"カタラン数 C_n = (2n)!/(n!(n+1)!)","howto":"push順を固定したまま、push/popの組合せ(長さ2nの0/1列で各接頭辞のpush数≧pop数)を数える、またはカタラン数の公式を使う","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>A, B, Cの順序で入力されるデータがある。各データについてスタックへの挿入と取出しを1回ずつ行うことができる場合、データの出力順序は何通りあるか。</p><table border='1' cellpadding='4'><tr><td colspan='2' style='text-align:center'>A, B, C → スタック</td></tr></table>","choices":[{"label":"ア","html":"3"},{"label":"イ","html":"4"},{"label":"ウ","html":"5"},{"label":"エ","html":"6"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>A, B, Cの順にpushし、任意のタイミングでpopできるとき、実現可能な出力順列の総数はカタラン数 C_3 で与えられる。C_3 = (2×3)!/(3!×4!) = 720/(6×24) = 5。</p><p>実際に列挙すると、PPPOOO→C,B,A、PPOPOO→B,C,A、PPOOPO→B,A,C、POPPOO→A,C,B、POPOPO→A,B,Cの5通りが実現でき、残るC,A,Bという順序だけは、Cを最初に取り出すには先にA,Bが積まれている必要があり、popするとBが先に出てしまうため実現不可能である。</p><p>よって出力順序は5通り。正解はウ。</p>","mnemonic":"ABCの6通りのうち「C→A→B」だけはスタックでは出せない―だから答えは1引いた5(ご)通り。"},{"id":33,"year":2025,"period":"令和7年度春期","num":4,"cat":"テクノロジ系","field":"コンピュータ性能(CPI)","summary":"コンピュータ性能(CPI)：令和7年度春期 問4","correct":"ウ","result":"","formula":"処理時間 = 命令数 × CPI × クロック周期","howto":"両コンピュータの「CPI×クロック周期」(1命令あたりの実行時間)を求めて比を取る","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>同じ命令セットをもつコンピュータAとBとがある。それぞれのCPUクロック周期、及びあるプログラムを実行したときのCPI(Cycles Per Instruction)は、表のとおりである。そのプログラムを実行したとき、コンピュータAの処理時間は、コンピュータBの処理時間の何倍になるか。</p><table border='1' cellpadding='4'><tr><th></th><th>CPUクロック周期</th><th>CPI</th></tr><tr><td>コンピュータA</td><td>1ナノ秒</td><td>4.0</td></tr><tr><td>コンピュータB</td><td>4ナノ秒</td><td>0.5</td></tr></table>","choices":[{"label":"ア","html":"1/32"},{"label":"イ","html":"1/2"},{"label":"ウ","html":"2"},{"label":"エ","html":"8"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>1命令あたりの実行時間は「CPI×クロック周期」で求まる。コンピュータA: 4.0×1ナノ秒=4ナノ秒/命令。コンピュータB: 0.5×4ナノ秒=2ナノ秒/命令。</p><p>同じプログラム(同じ命令数)を実行するので、処理時間の比はこの1命令あたり時間の比に等しく、A/B = 4/2 = 2倍となる。</p><p>正解はウ。</p>","mnemonic":"「よん(4)割るに(2)でに(2)倍」―Aは4ナノ秒/命令、Bは2ナノ秒/命令、だからAはBの2倍遅い。"},{"id":34,"year":2025,"period":"令和7年度春期","num":5,"cat":"テクノロジ系","field":"稼働率(アベイラビリティ)","summary":"稼働率(アベイラビリティ)：令和7年度春期 問5","correct":"イ","result":"","formula":"稼働率 α=MTBF/(MTBF+MTTR) ⇔ MTTR/MTBF=(1-α)/α","howto":"稼働率の定義式を変形し、MTTR/MTBFをαだけの式で表して比較する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>二つのシステムA, Bの稼働率をそれぞれα<sub>A</sub>(0&lt;α<sub>A</sub>&lt;1), α<sub>B</sub>(0&lt;α<sub>B</sub>&lt;1), MTBFをそれぞれMTBF<sub>A</sub>, MTBF<sub>B</sub>, MTTRをそれぞれMTTR<sub>A</sub>, MTTR<sub>B</sub>としたとき、これらの関係として、常に成り立つものはどれか。</p>","choices":[{"label":"ア","html":"α_A=α_Bならば、MTBF_A=MTBF_Bであり、かつMTTR_A=MTTR_Bである。"},{"label":"イ","html":"α_A=α_Bならば、MTTR_A／MTBF_A=MTTR_B／MTBF_Bである。"},{"label":"ウ","html":"α_A&gt;α_Bならば、MTBF_A&gt;MTBF_Bであり、かつMTTR_A&gt;MTTR_Bである。"},{"label":"エ","html":"α_A&gt;α_Bならば、MTTR_A／MTBF_A&gt;MTTR_B／MTBF_Bである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>稼働率の定義 α=MTBF/(MTBF+MTTR) を変形すると、1/α=1+MTTR/MTBF、すなわち MTTR/MTBF=(1-α)/α が得られる。右辺はαのみで決まる値なので、α_A=α_Bならば MTTR_A/MTBF_A=MTTR_B/MTBF_B が常に成り立つ。これはイの内容そのものである。</p><p>アは誤り。稼働率が等しくてもMTBFとMTTRの個々の絶対値は一致するとは限らない(例: MTBF=1,MTTR=0.01でもMTBF=100,MTTR=1でも稼働率はほぼ同程度になり得る)。</p><p>ウ・エも誤り。MTTR/MTBF=(1-α)/αはαの減少関数なので、α_A&gt;α_Bのときむしろ MTTR_A/MTBF_A&lt;MTTR_B/MTBF_B となり、エの不等号は逆である。また稼働率が高いからといってMTBFやMTTRの大小関係が一意に決まるわけでもない(MTBFもMTTRも両方小さいシステムの方が稼働率が高いこともある)。</p><p>正解はイ。</p>","mnemonic":"「イコールはイコールを生む」―α_A=α_Bなら(1-α)/αの式も等しくなるので、MTTR/MTBFの比もぴったり一致。"},{"id":35,"year":2025,"period":"令和7年度春期","num":6,"cat":"テクノロジ系","field":"仮想記憶(LRU)","summary":"仮想記憶(LRU)：令和7年度春期 問6","correct":"ウ","result":"","formula":"LRU: 最も長い間参照されていないページを置換対象とする","howto":"参照のたびに各ページの新しさの順(最新→最古)を更新しながら追跡する","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>仮想記憶管理におけるページ置換えアルゴリズムとしてLRU方式を採用する。主記憶のページ枠が、4000, 5000, 6000, 7000番地(いずれも16進数)の4ページ分で、プログラムが参照するページ番号の順が、1→2→3→4→2→5→3→1→6→5→4のとき、最後の参照ページ4は何番地にページインされているか。ここで、最初の1→2→3→4の参照で、それぞれのページは4000, 5000, 6000, 7000番地にページインされるものとする。</p>","choices":[{"label":"ア","html":"4000"},{"label":"イ","html":"5000"},{"label":"ウ","html":"6000"},{"label":"エ","html":"7000"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>初期状態: ページ1→4000, 2→5000, 3→6000, 4→7000。参照直後の新しい順(MRU→LRU)は 4,3,2,1。</p><p>参照2(ヒット): 順序→2,4,3,1。</p><p>参照5(ミス): LRUの1を追い出し、5を4000にロード。順序→5,2,4,3。</p><p>参照3(ヒット): 順序→3,5,2,4。</p><p>参照1(ミス): LRUの4を追い出し(7000番地)、1を7000にロード。順序→1,3,5,2。</p><p>参照6(ミス): LRUの2を追い出し(5000番地)、6を5000にロード。順序→6,1,3,5。</p><p>参照5(ヒット): 順序→5,6,1,3。</p><p>参照4(ミス): LRUの3を追い出す。3は6000番地にあったので、4はこの6000番地にページインされる。</p><p>正解はウ(6000)。</p>","mnemonic":"「ろく(6000)番地によん(4)が入る」―3を追い出した跡地が6000番地、そこへ最後の4が収まる。"},{"id":36,"year":2025,"period":"令和7年度春期","num":7,"cat":"テクノロジ系","field":"消費電流(間欠動作)","summary":"消費電流(間欠動作)：令和7年度春期 問7","correct":"ウ","result":"","formula":"平均電流=(動作時間×動作電流+待機時間×待機電流)/(動作時間+待機時間)","howto":"平均電流≦1μAとなる待機時間tを方程式で解く","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>IoTシステムにおいて、センサーの値をゲートウェイに送信するセンサーノードの消費電流を抑えるため、図のような間欠動作を考える。センサーノードの動作時間は10ミリ秒で、その間は平均して10mAの電流が流れる。待機中は常に0.1μAの電流が流れる。間欠動作の平均電流を1μA以下にするための待機時間として、最も短いものはどれか。ここで、平均電流の値を求める時間は十分に長いものとする。</p><p>〔図の説明〕動作時間10ミリ秒の間は10mAの電流が流れ、その後の待機時間の間は0.1μAの電流が流れるというパターンを周期的に繰り返す波形。</p>","choices":[{"label":"ア","html":"1.1秒"},{"label":"イ","html":"11.1秒"},{"label":"ウ","html":"111.1秒"},{"label":"エ","html":"1111.1秒"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>動作時間10ミリ秒(0.01秒)で10mA(=10,000μA)、待機時間t秒で0.1μAが流れるとすると、平均電流は (0.01×10000+t×0.1)/(0.01+t) ≦ 1 を満たす必要がある。</p><p>t秒はミリ秒に比べて十分長いとみなせるので、等号で解くと 100+0.1t = 0.01+t(分母の0.01も含めて厳密に解く)。整理すると 100-0.01 = t-0.1t、99.99 = 0.9t、t ≒ 111.1秒。</p><p>したがって待機時間は少なくとも約111.1秒必要であり、最も短い待機時間はウの111.1秒。</p>","mnemonic":"「いい(111)な1秒休めば平均1μA以下」―動作0.01秒×10,000μAの電荷を薄めるには約111.1秒の待機が必要。"},{"id":37,"year":2025,"period":"令和7年度春期","num":8,"cat":"テクノロジ系","field":"画像フォーマット(SVG)","summary":"画像フォーマット(SVG)：令和7年度春期 問8","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>W3Cで仕様が定義され、矩形や円、直線、文字列などの図形オブジェクトをXML形式で記述し、Webページでの図形描画にも使うことができる画像フォーマットはどれか。</p>","choices":[{"label":"ア","html":"OpenGL"},{"label":"イ","html":"PNG"},{"label":"ウ","html":"SVG"},{"label":"エ","html":"TIFF"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SVG(Scalable Vector Graphics)は、W3Cが策定したXMLベースのベクター画像フォーマットで、矩形・円・直線・文字列などの図形をタグとして記述する。拡大縮小しても画質が劣化せず、Webページに直接埋め込んで描画できることから広く利用されている。</p><p>PNGとTIFFはいずれもビットマップ(ラスター)形式の画像フォーマットであり、画素の集合として画像を表現するためXMLで図形オブジェクトを記述する形式ではない。OpenGLは画像フォーマットではなく、3Dグラフィックス描画のためのAPI(ライブラリ仕様)である。</p><p>以上よりXML形式で図形オブジェクトを記述するのはSVGであり、正解はウ。</p>","mnemonic":""},{"id":38,"year":2025,"period":"令和7年度春期","num":9,"cat":"テクノロジ系","field":"データベース正規化","summary":"データベース正規化：令和7年度春期 問9","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>関係を第2正規形から第3正規形に変換する手順はどれか。</p>","choices":[{"label":"ア","html":"候補キー以外の属性から、候補キーの一部の属性に対して関数従属性がある場合、その関係を分解する。"},{"label":"イ","html":"候補キー以外の属性間に関数従属性がある場合、その関係を分解する。"},{"label":"ウ","html":"候補キーの一部の属性から、候補キー以外の属性への関数従属性がある場合、その関係を分解する。"},{"label":"エ","html":"一つの属性に複数の値が入っている場合、単一の値になるように分解する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>第2正規形から第3正規形への変換は、非キー属性間に存在する「推移的関数従属」を取り除く操作である。候補キー以外の属性同士で関数従属性がある場合、その従属関係にある属性を別の関係に分解することで、更新時異常(修正不整合)を防ぐ。これはイの記述と一致する。</p><p>ウは、候補キーの一部の属性(部分キー)が候補キー以外の属性を決定する「部分関数従属」を取り除く操作であり、これは第1正規形から第2正規形への変換に当たる。エは、繰返し項目(多値属性)を単一値に分解する操作で、非正規形から第1正規形への変換に当たる。アのような「候補キー以外→候補キーの一部」という従属関係は通常の正規化段階では想定されない組合せであり、2NF→3NFの定義とは合致しない。</p><p>正解はイ。</p>","mnemonic":""},{"id":39,"year":2025,"period":"令和7年度春期","num":10,"cat":"テクノロジ系","field":"SQL(参照整合性)","summary":"SQL(参照整合性)：令和7年度春期 問10","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>SQL文に示す参照制約が存在する“商品”表と“受注”表とがある。“商品”表の行を削除したとき、削除した行の商品コードと同じ値の商品コードをもつ“受注”表の行を自動的に削除するSQL文として、aに入れる字句はどれか。</p><p>〔SQL文〕</p><pre>CREATE TABLE 商品 (\n    商品コード  CHAR(4) PRIMARY KEY,\n    商品名      VARCHAR(64)\n)\n\nCREATE TABLE 受注 (\n    受注番号    INTEGER PRIMARY KEY,\n    商品コード  CHAR(4),\n    受注個数    INTEGER,\n    納品日      CHAR(8),\n    FOREIGN KEY (商品コード) REFERENCES 商品(商品コード)\n    ON DELETE [ a ]\n)</pre>","choices":[{"label":"ア","html":"CASCADE"},{"label":"イ","html":"RESTRICT"},{"label":"ウ","html":"SET DEFAULT"},{"label":"エ","html":"SET NULL"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>外部キー制約のON DELETEオプションのうち、CASCADEは親表(商品表)の行が削除されたとき、それを参照している子表(受注表)の行も連動して自動的に削除する指定である。設問は「削除した行の商品コードと同じ値をもつ受注表の行を自動的に削除する」ことを求めているため、CASCADEが該当する。</p><p>RESTRICTは参照されている行がある場合に親の削除自体を禁止する。SET NULLは子表の該当列をNULLに、SET DEFAULTはデフォルト値に変更するだけで、行自体は削除されない。したがっていずれも設問の要件(行の自動削除)を満たさない。</p><p>正解はア。</p>","mnemonic":""},{"id":40,"year":2025,"period":"令和7年度春期","num":11,"cat":"テクノロジ系","field":"ネットワーク(給電)","summary":"ネットワーク(給電)：令和7年度春期 問11","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>無線LANのアクセスポイントやIP電話機などに、LANケーブルを利用して給電も行う仕組みはどれか。</p>","choices":[{"label":"ア","html":"PLC"},{"label":"イ","html":"PoE"},{"label":"ウ","html":"UPS"},{"label":"エ","html":"USB"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>PoE(Power over Ethernet)は、LANケーブル(イーサネットケーブル)を通じてデータ通信と同時に電力を供給する仕組みで、無線LANアクセスポイントやIP電話機、ネットワークカメラなど、電源コンセントの確保が難しい場所に設置する機器への給電に広く使われている。</p><p>PLC(Power Line Communication)は逆に電力線を通信回線として利用する技術であり、LANケーブルでの給電とは無関係である。UPSは停電時に電力を一時的に供給する無停電電源装置、USBはパソコンと周辺機器を接続する汎用シリアルバス規格であり、いずれもLANケーブル経由の給電とは異なる。</p><p>正解はイ。</p>","mnemonic":""},{"id":41,"year":2025,"period":"令和7年度春期","num":12,"cat":"テクノロジ系","field":"暗号(CRYPTREC)","summary":"暗号(CRYPTREC)：令和7年度春期 問12","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>デジタル庁、総務省及び経済産業省が策定した“電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)”を構成する暗号リストの説明のうち、適切なものはどれか。</p>","choices":[{"label":"ア","html":"推奨候補暗号リストとは、CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリストである。"},{"label":"イ","html":"推奨候補暗号リストとは、候補段階に格下げされ、互換性維持目的で利用する暗号技術のリストである。"},{"label":"ウ","html":"電子政府推奨暗号リストとは、CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリストである。"},{"label":"エ","html":"電子政府推奨暗号リストとは、推奨段階から格下げされ、互換性維持目的で利用する暗号技術のリストである。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>CRYPTREC暗号リストは「電子政府推奨暗号リスト」「推奨候補暗号リスト」「運用監視暗号リスト」の3種類で構成される。電子政府推奨暗号リストは、CRYPTRECによって安全性・実装性能が確認された暗号技術のうち、市場での利用実績が十分であるか今後の普及が見込まれると判断され、利用が推奨される技術を掲げるリストであり、ウの記述と一致する。</p><p>アは同じ説明文を「推奨候補暗号リスト」に誤って当てはめている点が誤り(その内容は電子政府推奨暗号リストの説明である)。推奨候補暗号リストは、確認は取れているが実績や普及見込みの判断基準では電子政府推奨暗号リストに一歩及ばない技術を指す。イ・エのような「格下げされ互換性維持目的で利用する」という説明は、安全性に問題が生じ推奨できなくなった暗号を掲載する「運用監視暗号リスト」(例: SHA-1)の性格に近く、推奨候補暗号リストや電子政府推奨暗号リストの説明としては誤りである。</p><p>正解はウ。</p>","mnemonic":""},{"id":42,"year":2025,"period":"令和7年度春期","num":13,"cat":"テクノロジ系","field":"セキュリティ(SBOM)","summary":"セキュリティ(SBOM)：令和7年度春期 問13","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>ソフトウェアの情報セキュリティ対策のうち、SBOM(Software Bill Of Materials)管理ツールを用いることができるものはどれか。</p>","choices":[{"label":"ア","html":"ソフトウェアでの利用者認証に用いるアカウントの一元管理"},{"label":"イ","html":"ソフトウェアについての脆弱性管理"},{"label":"ウ","html":"ソフトウェアのソースコードについてのバージョン管理、アクセス制御及び改ざん防止"},{"label":"エ","html":"ソフトウェアのソースコードのバックアップとマルウェア混入防止"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>SBOM(Software Bill of Materials、ソフトウェア部品表)は、ソフトウェアに含まれるOSSやライブラリなどの構成部品とその依存関係を一覧化したものである。SBOM管理ツールはこれを生成・管理し、新たな脆弱性情報が公表された際に、該当するライブラリ・バージョンを含む製品を迅速に特定して対処できるようにする、すなわち脆弱性管理に活用できる。</p><p>アの利用者アカウントの一元管理はID管理(IDaaS)の役割であり、SBOMの機能ではない。ウのソースコードのバージョン管理・アクセス制御・改ざん防止はバージョン管理システム(VCS)やソースコード管理ツールの役割、エのバックアップやマルウェア混入防止はバックアップ製品やセキュリティスキャナの役割であり、いずれもSBOM管理ツール本来の機能ではない。</p><p>正解はイ。</p>","mnemonic":""},{"id":43,"year":2025,"period":"令和7年度春期","num":14,"cat":"テクノロジ系","field":"セキュリティ(OSコマンドインジェクション)","summary":"セキュリティ(OSコマンドインジェクション)：令和7年度春期 問14","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>Webアプリケーションソフトウェアの開発におけるOSコマンドインジェクション対策はどれか。</p>","choices":[{"label":"ア","html":"SQL文の組立ては全てプレースホルダで実装する。"},{"label":"イ","html":"シェルを起動できる言語機能を利用した実装を避ける。"},{"label":"ウ","html":"直接メモリにアクセスできる言語機能を利用した実装を避ける。"},{"label":"エ","html":"利用者が入力したファイル名にディレクトリが含まれていないかのエラーチェックを実装する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>IPAの「安全なウェブサイトの作り方」によれば、OSコマンドインジェクションに対する根本的解決策は、シェルを起動できる言語機能(Perlのopen()やsystem()、PHPのexec()やshell_exec()など)を利用した実装を避けることであり、イが該当する。これにより、外部からの入力がOSコマンドとして解釈・実行されるリスクを根本から排除できる。</p><p>アはSQLインジェクション対策(プレースホルダによるバインド機構の利用)であり、OSコマンドインジェクションとは別の脆弱性への対策である。ウは直接メモリ操作に起因するバッファオーバーフローなどへの対策に近い。エはディレクトリトラバーサル(パストラバーサル)対策であり、ファイル名に意図しないディレクトリ指定が含まれないかを確認するものでOSコマンドインジェクション対策とは異なる。</p><p>正解はイ。</p>","mnemonic":""},{"id":44,"year":2025,"period":"令和7年度春期","num":15,"cat":"テクノロジ系","field":"VPN(プロトコル階層)","summary":"VPN(プロトコル階層)：令和7年度春期 問15","correct":"ウ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>VPNで使用されるプロトコルであるIPsec, L2TP, TLSの、OSI基本参照モデルにおける相対的な位置関係はどれか。</p><table border='1' cellpadding='4'><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td>上位層側</td><td>IPsec</td><td>IPsec</td><td>TLS</td><td>TLS</td></tr><tr><td>中間</td><td>L2TP</td><td>TLS</td><td>IPsec</td><td>L2TP</td></tr><tr><td>下位層側</td><td>TLS</td><td>L2TP</td><td>L2TP</td><td>IPsec</td></tr></table><p>(上位層=アプリケーション層側、下位層=物理層側)</p>","choices":[{"label":"ア","html":"A"},{"label":"イ","html":"B"},{"label":"ウ","html":"C"},{"label":"エ","html":"D"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>TLSはトランスポート層の上位(セッション層・プレゼンテーション層相当)で動作し、アプリケーションデータを暗号化するプロトコルで、3つの中では最も上位層寄りに位置する。IPsecはネットワーク層(IPヘッダレベル)で動作するプロトコルで中間に位置する。L2TPはデータリンク層のトンネリングプロトコル(PPPフレームをカプセル化)であり、3つの中では最も下位層寄りに位置する。</p><p>したがって上位層から下位層へ向かう順序は「TLS→IPsec→L2TP」となり、この並びに一致するのは選択肢Cである。</p><p>正解はウ(C)。</p>","mnemonic":""},{"id":45,"year":2025,"period":"令和7年度春期","num":16,"cat":"マネジメント系","field":"品質管理(デザインレビュー)","summary":"品質管理(デザインレビュー)：令和7年度春期 問16","correct":"ア","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>デザインレビューの目的はどれか。</p>","choices":[{"label":"ア","html":"設計工程内で、設計工程の成果物の問題点を発見する。"},{"label":"イ","html":"品質保証部門が、全成果物の出荷の可否を判定する。"},{"label":"ウ","html":"品質保証部門によるプログラムのサンプリング検査によって、設計者では気付かない品質上の問題点を発見する。"},{"label":"エ","html":"プロジェクトマネジメントのプロセス上の問題点を発見する。"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>デザインレビュー(設計審査)は、設計の各工程で複数の関係者・専門家が設計成果物を多角的にレビューし、その工程内で品質上の問題点やリスクを早期に発見・除去することを目的とする活動である。問題を上流工程で発見するほど手戻りのコストを抑えられるため、各設計フェーズの完了前に実施されるのが一般的であり、アの記述と一致する。</p><p>イは出荷判定会議の役割に近く、デザインレビューは出荷可否そのものを決める場ではない。ウは品質保証部門単独でのサンプリング検査(テスト・監査活動)を指しており、設計者を含む関係者が集まって検討するデザインレビューの進め方とは異なる。エはプロジェクトマネジメントのプロセス改善を目的とするもので、デザインレビューが対象とする「設計成果物の品質」とは観点が異なる。</p><p>正解はア。</p>","mnemonic":""},{"id":46,"year":2025,"period":"令和7年度春期","num":17,"cat":"マネジメント系","field":"スクラム(スプリントレビュー)","summary":"スクラム(スプリントレビュー)：令和7年度春期 問17","correct":"イ","result":"","formula":"","howto":"","url":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_koudo_am1_qs.pdf","ipaUrl":"https://www.ipa.go.jp/shiken/mondai-kaiotu/2025r07.html","q":"<p>スクラムにおいて繰り返し実行するイベントのうち、ステークホルダに作業の結果をプレゼンテーションして、プロダクトゴールに対する進捗について話し合い、必要に応じてスコープを調整するイベントはどれか。</p>","choices":[{"label":"ア","html":"スプリントプランニング"},{"label":"イ","html":"スプリントレビュー"},{"label":"ウ","html":"デイリースクラム"},{"label":"エ","html":"レトロスペクティブ"}],"shared":"","labels":["ア","イ","ウ","エ"],"expl":"<p>スプリントレビューは、スプリントの終わりにスクラムチームとステークホルダが集まり、そのスプリントで完成したインクリメントを検査し、プロダクトゴールに対する進捗についてフィードバックを得ながら話し合い、必要に応じてプロダクトバックログ(スコープ)を適応させるイベントである。設問の記述はこの内容と一致する。</p><p>スプリントプランニングはスプリント開始時に次のスプリントで何をどのように行うかを計画するイベント、デイリースクラムは開発チームが毎日進捗を同期する短時間のイベントで、いずれもステークホルダへのプレゼンテーションを主眼としない。レトロスペクティブはスプリント終了時にチーム内部のやり方(プロセス)を振り返り改善する場であり、ステークホルダは通常参加しない。</p><p>正解はイ。</p>","mnemonic":""},{"id":47,"year":2025,"period":"令和7年度春期","num":18,"cat":"マネジメント系","field":"EVM(コスト・スケジュール効率)","summary":"EVM(コスト・スケジュール効率)：令和7年度春期 問18","correct":"イ","result":"","formula":"CP
