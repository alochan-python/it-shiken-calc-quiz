<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>計算問題道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#ECEEF5; --border:#DBDEE9;
  --text:#1B2130; --text-dim:#5B6478; --text-faint:#8991A3;
  --accent:#0E7C86; --accent-strong:#0A5E66; --accent-soft:#E1F1F1; --accent-contrast:#FFFFFF;
  --cat-tech:#2F5FD6; --cat-tech-soft:#E7ECFC;
  --cat-strat:#1E8F72; --cat-strat-soft:#E4F5F0;
  --cat-mgmt:#7A4FC9; --cat-mgmt-soft:#F0EBFB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --surface:#181C28; --surface-2:#1F2432; --border:#2B3145;
    --text:#E9EBF3; --text-dim:#A7ADC0; --text-faint:#6D7387;
    --accent:#3FBEC2; --accent-strong:#5FD1D4; --accent-soft:rgba(63,190,194,.14); --accent-contrast:#08262A;
    --cat-tech:#7C9DF5; --cat-tech-soft:rgba(124,157,245,.14);
    --cat-strat:#5FC9A8; --cat-strat-soft:rgba(95,201,168,.14);
    --cat-mgmt:#B79AEF; --cat-mgmt-soft:rgba(183,154,239,.14);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;line-height:1.7;min-height:100vh}
h1,.disp{font-family:'Zen Kaku Gothic New',sans-serif}
#wrap{max-width:640px;margin:0 auto;padding:40px 18px 60px}
header{margin-bottom:28px}
h1{font-size:1.5rem;font-weight:900;margin:0 0 6px}
header p{color:var(--text-faint);font-size:.85rem;margin:0}
.card{
  display:block;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(24,32,56,.06), 0 8px 24px rgba(24,32,56,.08);
}
.card .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700;margin-bottom:10px}
.card.ap .badge{background:var(--cat-tech-soft);color:var(--cat-tech)}
.card.st .badge{background:var(--cat-strat-soft);color:var(--cat-strat)}
.card.stall .badge{background:var(--cat-mgmt-soft);color:var(--cat-mgmt)}
.card.am1 .badge{background:var(--cat-tech-soft);color:var(--cat-tech)}
.card h2{font-size:1.15rem;margin:0 0 6px;font-weight:700}
.card p{color:var(--text-dim);font-size:.85rem;margin:0 0 10px}
.card .cta{color:var(--accent);font-weight:700;font-size:.82rem}
footer{margin-top:30px;color:var(--text-faint);font-size:.72rem;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>計算問題道場</h1>
    <p>情報処理技術者試験の計算問題を、実際の問題文つきで解いて覚える学習アプリ</p>
  </header>

  <a class="card ap" href="ap/">
    <span class="badge">テクノロジ系</span>
    <h2>応用情報 計算問題道場</h2>
    <p>応用情報技術者試験・午前 計算問題 209問(過去10年分)</p>
    <span class="cta">開く →</span>
  </a>

  <a class="card st" href="st/">
    <span class="badge">ストラテジ系</span>
    <h2>ST計算問題道場</h2>
    <p>ITストラテジスト試験・午前II 計算問題 19問(過去9回分)</p>
    <span class="cta">開く →</span>
  </a>

  <a class="card stall" href="st-all/">
    <span class="badge">全分野</span>
    <h2>ST全問題道場</h2>
    <p>ITストラテジスト試験・午前II 全225問(過去9回分・解説つき)</p>
    <span class="cta">開く →</span>
  </a>

  <a class="card am1" href="am1/">
    <span class="badge">高度共通</span>
    <h2>午前I問題道場</h2>
    <p>高度試験共通・午前I 全570問(過去10年19回分・解説つき)</p>
    <span class="cta">開く →</span>
  </a>

  <footer>個人の学習用アプリです。</footer>
</div>
</body>
</html>
